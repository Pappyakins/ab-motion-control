<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>AB Motion Control App</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f2f5f9; --card:#ffffff; --text:#141a24; --muted:#6b7280;
  --primary:#7c3aed; --primary-dark:#6d28d9; --primary-soft:#ede9fe;
  --danger:#ef4444; --danger-soft:#fee2e2; --success:#10b981; --success-soft:#d1fae5;
  --gold:#b45309; --gold-soft:#fef3c7; --warn:#d97706; --warn-soft:#fef3c7;
  --border:#e5e9f0; --radius:16px; --tabbar-h:64px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1117; --card:#171c26; --text:#eef1f7; --muted:#9aa3b5;
    --primary:#a78bfa; --primary-dark:#7c3aed; --primary-soft:#2e1065;
    --danger:#f87171; --danger-soft:#3a1d1d; --success:#34d399; --success-soft:#123b2c;
    --gold:#fbbf24; --gold-soft:#3d2f10; --warn:#fbbf24; --warn-soft:#3d2f10; --border:#262c3b;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
header.top{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 14px) 18px 16px;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;border-radius:0 0 24px 24px;box-shadow:0 4px 18px rgba(124,58,237,.35)}
header.top h1{margin:0;font-size:20px;font-weight:700}
header.top .sub{margin:4px 0 0;font-size:13px;opacity:.85}
main{padding:14px 14px calc(var(--tabbar-h) + var(--sab) + 40px)}
.tab{display:none}
.tab.active{display:block;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(20,20,60,.05)}
.card h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.card h2{margin:0 0 6px;font-size:18px}
.card p{margin:6px 0;line-height:1.55;font-size:14.5px}
.card p.small{font-size:13px;color:var(--muted)}
button{font-family:inherit}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;cursor:pointer;background:var(--primary);color:#fff;font-size:16px;font-weight:700;min-height:52px;margin-bottom:12px}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--primary-soft);color:var(--primary)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--border);min-height:44px;padding:10px;font-size:14px}
input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;font-size:16px;background:var(--card);color:var(--text);font-family:inherit;min-height:50px}
input:focus{outline:2px solid var(--primary);border-color:var(--primary)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.list-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;color:var(--text);font-size:15px}
.list-item:active{transform:scale(.98)}
.list-item .grow{flex:1}
.list-item .t{font-weight:700}
.list-item .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.green{background:var(--success-soft);color:var(--success)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.progress{height:8px;border-radius:999px;background:var(--border);overflow:hidden;margin:8px 0 2px}
.progress>div{height:100%;background:var(--primary);border-radius:999px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.45}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.tbd{border:2px dashed var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px;margin:10px 0;font-size:13.5px;line-height:1.5}
.tbd b{color:var(--warn)}
.quiz-opt{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:15px;margin-bottom:10px;cursor:pointer;line-height:1.45}
.quiz-opt.correct{border-color:var(--success);background:var(--success-soft)}
.quiz-opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.quiz-opt:disabled{opacity:.85;cursor:default}
.explain{font-size:13.5px;line-height:1.55;background:var(--primary-soft);border-radius:12px;padding:12px;margin:10px 0}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;height:calc(var(--tabbar-h) + var(--sab));padding-bottom:var(--sab);background:var(--card);border-top:1px solid var(--border);display:flex;z-index:30}
.tabbar button{flex:1;border:none;background:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;padding-top:10px}
.tabbar button.active{color:var(--primary)}
.tabbar button .ic{display:block;font-size:20px;margin-bottom:2px}
.back{color:var(--primary);background:none;border:none;font-size:14px;font-weight:700;cursor:pointer;padding:0 0 10px}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:20px 0 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:14px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted);flex:none}
.kv b{text-align:right;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--border);font-size:14.5px;line-height:1.5}
.check:last-child{border-bottom:none}
.check input{width:20px;height:20px;min-height:20px;flex:none;margin-top:2px;accent-color:var(--primary)}
.check.done{color:var(--muted);text-decoration:line-through}
a{color:var(--primary)}
</style>
</head>

d the PC to the same Ethernet network, then browse to the drive's IP address (default 192.168.124.200) to open MotionView OnBoard.", "screen": "MotionView OnBoard (web browser)", "parameter": "Drive IP address", "value": "Default 192.168.124.200", "source": "2097-UM001A-EN-P Ch5; 2097-UM001D-EN-P p.128"}, {"step": "Lab 1 - Basic Drive Configuration: open MotionView OnBoard, restore factory defaults, select the servo motor, choose the operating mode, configure the drive inputs and outputs, and auto tune for indexing mode.", "screen": "MotionView OnBoard", "parameter": "Motor selection; operating mode; I/O; autotune", "value": "Per application", "source": "Rockwell Kinetix 300 hands-on lab, Lab 1"}, {"step": "Lab 2 - Indexing mode: configure the drive for indexing, command the drive in indexing mode, use the monitor feature, and blend index moves.", "screen": "MotionView OnBoard, indexing", "parameter": "Indexing parameters", "value": "Per application", "source": "Rockwell Kinetix 300 hands-on lab, Lab 2"}, {"step": "Operating modes: standalone, analog velocity, indexing.", "screen": "MotionView OnBoard, operating mode", "parameter": "Operating mode", "value": "standalone / analog velocity / indexing", "source": "2097-UM001A-EN-P Ch5"}, {"step": "On powerup the display shows diS (disabled) or run (enabled). After 30 seconds it alternately scrolls the IP address and the status. If faulted, it shows the fault code non-scrolling; after 30 seconds it alternates the IP address and the fault code.", "screen": "Drive status display", "parameter": "Status display", "value": "diS / run / fault code", "source": "2097-UM001A-EN-P Ch5/Ch6"}, {"step": "The status indicator displays E plus a two-digit code until the fault is cleared.", "screen": "Drive status indicator", "parameter": "Fault code display", "value": "E + two-digit code", "source": "2097-UM001A-EN-P Ch6"}], "commissioning": ["Verify the IP address on the display and power-cycle the drive after any change.", "Verify the motor is recognized on the MotionView OnBoard motor screen.", "Verify the overtravel limits and the home sensor / marker positions before running a home search.", "Run the auto-tune for indexing mode in MotionView OnBoard.", "Verify the Ethernet I/O connection is scanned at the correct RPI rate in the controller program.", "Check the status indicator for a fault code (E + two-digit code) before putting the machine into service."], "tuning": "Auto-tune in MotionView OnBoard for indexing mode (hands-on lab, Lab 1). For excess position error, check the position loop tuning and increase the following error limit or time.", "faults": [{"code": "E04", "meaning": "Motor overtemperature - thermostat tripped", "fix": "High ambient temperature or excessive current: operate within the continuous torque rating, ambient 40 C / 104 F maximum, lower the ambient temperature or increase cooling. Motor wiring error: check the wiring. Incorrect motor: verify the proper motor was selected."}, {"code": "E06", "meaning": "Hardware overtravel - dedicated overtravel input inactive", "fix": "Check the wiring; verify the motion profile."}, {"code": "E07", "meaning": "Feedback lost - feedback wiring open, shorted, or missing", "fix": "Check the motor encoder wiring; ensure the motor is recognized from the drive's web-based configuration motor screen."}, {"code": "E09", "meaning": "Bus undervoltage - low AC line or input voltage", "fix": "Verify the voltage level of the incoming AC; check for AC line drop; install a UPS on the AC input."}, {"code": "E10", "meaning": "Bus overvoltage - excessive regeneration, or excessive AC input voltage", "fix": "The motor is driven by an external mechanical power source and regenerates too much peak energy: change the decel or motion profile, use a larger system, or use a resistive shunt; if a shunt is connected, verify the wiring. Also verify the input voltage is within specification."}, {"code": "E11", "meaning": "Illegal Hall state - incorrect phasing", "fix": "Check the Hall phasing; verify the Hall wiring; check for bad connections; verify the 5V power supply to the encoder."}, {"code": "E12", "meaning": "Home search failed - home sensor or marker outside the overtravel limits", "fix": "Reposition the overtravel limits or the sensor; check the wiring."}, {"code": "E14", "meaning": "Ethernet I/O connection lost", "fix": "Check the wiring and the Ethernet cables and routing; check the controller program to ensure the I/O is scanned at the correct RPI rate."}, {"code": "E16", "meaning": "Software overtravel - programmed overtravel limit exceeded", "fix": "Verify the motion profile; verify the overtravel settings are appropriate."}, {"code": "E18", "meaning": "Overspeed - motor speed exceeded 125% of the maximum rated speed", "fix": "Check the cables for noise; check the tuning."}, {"code": "E19", "meaning": "Excess position error - position error limit exceeded", "fix": "Increase the following error limit or time; check the position loop tuning."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2097-um001_-en-p.pdf", "sources": ["https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2097-um001_-en-p.pdf (official manual link; direct fetch blocked by Akamai - read from the archive.org mirror copy, local file .research/pdfs/um001-300.txt, Rockwell 2097-UM001A-EN-P Feb 2010)", "Local mirror copy read 2026-11-20: .research/pdfs/um001-300.txt (Rockwell 2097-UM001A-EN-P Feb 2010, archive.org djvu text, OCR messy)", "Rockwell Kinetix 300 hands-on lab (Lab 1 Basic Drive Configuration, Lab 2 Indexing mode), read via archive.org text"], "tbd": ["E67 fault code context (referenced on p.164 of UM001A, meaning unverified) - source needed: 2097-UM001E-EN-P", "Full fault table beyond the verified rows - source needed: 2097-UM001 Ch6", "Kinetix 300 to 5100 migration details beyond the existence of the guide - source needed: 2198-RM004A-EN-P"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-350", "category": "servo-drive", "family": "Kinetix 350", "catalogNumbers": ["2097-V31PR0-LM", "2097-V31PR2-LM", "2097-V32PR0-LM", "2097-V32PR2-LM", "2097-V32PR4-LM", "2097-V33PR1-LM", "2097-V33PR3-LM", "2097-V33PR5-LM", "2097-V33PR6-LM", "2097-V34PR3-LM", "2097-V34PR5-LM", "2097-V34PR6-LM"], "name": "Kinetix 350 Servo Drive", "whatItIs": "The Kinetix 350 is a single-axis EtherNet/IP servo drive, 0.4 to 3.0 kW (2 to 12 A rms), with integrated motion on EtherNet/IP (CIP Motion) and Safe Torque Off. Rockwell announced in July 2024 that Bulletin 2097 Kinetix 350 is discontinued and no longer for sale; the migration target is the Bulletin 2198 Kinetix 5300.", "whenToUse": "Legacy single-axis CIP Motion applications only. For any new design, use the Kinetix 5300, the announced migration target for the 350.", "selection": "Continuous output current in A (0-pk): 2097-V31PR0 2.8, V31PR2 5.7, V32PR0 2.8, V32PR2 5.7, V32PR4 11.3, V33PR6 17.0, V34PR3 2.8, V34PR5 5.7, V34PR6 8.5. Input: 120V single-phase doubler mode (V31), 240V single-phase (V32), 240V single/three-phase (V33), 480V three-phase (V34). Integrated AC line filter. Size with Rockwell Motion Analyzer.", "wiring": {"power": "AC input (120/240/480V) with AC line filters 2097-Fx. Contactor ratings per UM002 (for example 2097-V32PR0-LM at 240V uses a 100-C23x10 / 100-C23Zx10 contactor). No isolation transformer is required for three-phase input. Enclosure sizing example: minimum cabinet depth 332 mm.", "feedback": "Motor power and feedback via 2090 cables. I/O terminal block 2097-TB1. Shunt resistors 2097-Rx.", "safety": "Hardwired Safe Torque Off via the STO connector. If the system does not use the safe torque-off feature, follow the Safe Torque-off Feature Bypass instructions starting on page 107 of UM002. Troubleshooting the STO function is on page 103; 'Wiring Your Safe Torque-off Circuit' is on page 105.", "network": "EtherNet/IP Port 1 (10/100 Mbps). Default IP address 192.168.124.200. DHCP (dynamic) or static (manual) addressing via the keypad parameters IP.1-IP.4. Changes take effect only after the drive is powered off and on again. Use 1585J Ethernet cables."}, "configuration": [{"step": "Set the IP address from the drive keypad. Press the display key and use the arrow keys to access parameters IP.1, IP.2, IP.3 and IP.4; each parameter holds one sub-octet of the full IP address (factory default 192.168.124.200). Changes take effect only after the drive is powered off and on again.", "screen": "Drive keypad display", "parameter": "IP.1; IP.2; IP.3; IP.4", "value": "Factory default 192.168.124.200", "source": "2097-UM002C-EN-P Ch5 p.81-82"}, {"step": "Configure the Logix5000 EtherNet/IP controller (UM002E Ch5 p.84).", "screen": "Studio 5000 Logix Designer", "parameter": "Controller; EtherNet/IP module", "value": "Per application", "source": "2097-UM002E-EN-P Ch5 p.84"}, {"step": "Configure the Motion Group: right-click Motion Groups > New Motion Group (p.86-87).", "screen": "Motion Groups > New Motion Group", "parameter": "Motion Group", "value": "New Motion Group", "source": "2097-UM002E-EN-P Ch5 p.86-87"}, {"step": "Configure the Axis Properties: right-click the axis > Properties (p.87 and following). Step 14 is 'Click Apply' (p.86).", "screen": "Axis Properties", "parameter": "Axis properties", "value": "Per motor", "source": "2097-UM002E-EN-P Ch5 p.86-87"}, {"step": "Apply power to the Kinetix 350 drive (p.93).", "screen": "Drive display", "parameter": "Power", "value": "Apply power", "source": "2097-UM002E-EN-P Ch5 p.93"}, {"step": "Test and Tune the Axes (p.94): run the hookup tests and the autotune in Axis Properties.", "screen": "Axis Properties > Hookup Tests; Autotune", "parameter": "Hookup test; Autotune", "value": "Passed; Success", "source": "2097-UM002E-EN-P Ch5 p.94"}, {"step": "If needed, Disable EnableInputChecking by Using a Logix Designer Message Instruction (Ch5 p.100).", "screen": "Logix Designer, Message Instruction", "parameter": "EnableInputChecking", "value": "Disabled via MSG", "source": "2097-UM002E-EN-P Ch5 p.100"}], "commissioning": ["Verify the IP address on the display (parameters IP.1-IP.4) and power-cycle the drive after any change.", "Verify the controller connection and the Motion Group / axis configuration.", "Verify the STO wiring, or the STO bypass if the safe torque-off feature is not used.", "Verify the four-digit display: it shows an axis fault code F xx, a custom fault code Fxx, an initialization fault code, or a node fault code nFxx.", "Test and tune the axes (UM002E p.94) before putting the machine into service."], "tuning": "Test and Tune the Axes (2097-UM002E p.94): hookup tests and autotune in Axis Properties, following the same CIP Motion pattern as the 5300/5500/5700. The detailed hookup and autotune steps for the 350 were not fully verified from the manual text and are recorded in tbd.", "faults": [{"code": "F02", "meaning": "Illegal Hall State - Hall feedback inputs are incorrect", "fix": "Check for improper connections; check the wiring of S1/S2/S3, the power supply to the encoder, and the motor wire phasing."}, {"code": "F03", "meaning": "Motor Overspeed - speed exceeded 125% of the maximum rated speed", "fix": "Check the cables for noise, check the tuning, and check the motor wiring at the MF connector."}, {"code": "F05", "meaning": "Motor Overtemperature - thermostat / thermistor / encoder temperature sensor tripped", "fix": "High ambient temperature and/or excessive current: operate within the continuous torque rating, lower the ambient temperature or increase cooling, and verify the proper motor was selected."}, {"code": "F07", "meaning": "Motor Thermal Protection - thermal model over 110% of the RMS rating", "fix": "The machine duty cycle requires RMS current exceeding the continuous rating; change the command profile to reduce speed or increase time."}, {"code": "F10", "meaning": "Inverter Overcurrent - power transistors turned off due to overcurrent, overtemperature, or power supply problems", "fix": "Motor cables shorted: verify continuity. Motor winding shorted: with a multimeter, phase-to-phase should not be open and phase-to-ground should be open. Check for clogged vents or a defective fan, restricted cooling, and ambient within specification (KNX-TD003 / GMC-TD003). Operate within the continuous power rating and reduce acceleration rates. Remove all power and motor connections and continuity-check DC bus to U/V/W; if continuity exists, check for wire fibers or send the drive for repair."}, {"code": "E38", "meaning": "Memory module error - bad memory module", "fix": "Replace the memory module."}, {"code": "E76", "meaning": "Blank memory module - a blank MEM module was inserted", "fix": "Push and hold the drive's enter key."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2097-um002_-en-p.pdf", "sources": ["https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2097-um002_-en-p.pdf (official manual link; direct fetch blocked by Akamai - read from the archive.org mirror copy, local file .research/pdfs/um002-350.txt, Rockwell 2097-UM002C-EN-P Dec 2013)", "Local mirror copy read 2026-11-20: .research/pdfs/um002-350.txt (Rockwell 2097-UM002C-EN-P Dec 2013, archive.org djvu text, OCR messy)", "Local file: .research/pdfs/um002-350.pdf (Rockwell 2097-UM002E-EN-P, 4-page excerpt)"], "tbd": ["Full Table 44 / 45 / 46 fault list beyond the verified rows - source needed: 2097-UM002D/E Ch7", "Tuning details (hookup / autotune steps) - source needed: 2097-UM002E Ch5 p.94", "Kinetix 350 to Kinetix 5300 migration guide publication number - source needed: Rockwell migration guide"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-5100", "category": "servo-drive", "family": "Kinetix 5100", "catalogNumbers": ["2198-E1007-ERS", "2198-E1004-ERS", "2198-E1015-ERS", "2198-E1020-ERS", "2198-E2030-ERS", "2198-E2055-ERS", "2198-E2075-ERS", "2198-E2150-ERS", "2198-E4004-ERS", "2198-E4007-ERS", "2198-E4015-ERS", "2198-E4020-ERS", "2198-E4030-ERS", "2198-E4055-ERS", "2198-E4075-ERS"], "name": "Kinetix 5100 Servo Drive", "whatItIs": "The Kinetix 5100 is a single-axis EtherNet/IP indexing servo drive, 0.4 to 15.0 kW (2.6 to 78 A rms), with built-in indexing (PR mode, PR commands 0-99). It can run standalone from digital I/O, pulse train or analog command, or under a Logix controller (Class 1 EtherNet/IP) or a Micro800 controller (Class 3), with operation modes for Position, Speed, Torque, PR indexing, IO mode, E-Cam, capture (CAP) and compare (CMP).", "whenToUse": "Pick the 5100 for small standalone machines with one or two axes that need indexing without full motion programming. Pick it over the 5300 when the drive must run without a Logix controller. Pick it over the 300/350 for any new design, since the 5100 is the current single-axis indexing drive and the 300/350 are discontinued.", "selection": "Size with Rockwell Motion Analyzer. KNX-RM011C design guide values: 2198-E1004 0.40 kW / 2.60 A / 6.50 A peak; E1007 0.75 kW / 5.10 A / 15.4 A; E1015 1.50 kW / 7.90 A / 23.7 A; E1020 2.00 kW / 13.4 A / 40.6 A. 2198-E4030 is 3.0 kW at 480V three-phase. Input: 120V single-phase, 200-230V single-phase, 230V three-phase, 480V three-phase (nominal).", "wiring": {"power": "AC input through the input power connector. I/O through the 50-pin terminal block 2198-TBIO. Motor power connector: ring lugs are recommended for motor power (U/V/W/PE) on 2198-E2055 / E2075 / E2150 (200V) and E4020 / E4030 / E4055 / E4075 / E4150 (400V). External passive shunt resistor as needed. AC line filters 2198-DB111-F, DB127-F, DB310-F, DB324-F. Cable shield clamp for the feedback cable.", "feedback": "MFB 15-pin connector kit 2198-K51CK-D15M with battery backup for TLP/TL/TLY multi-turn encoders (SIN+/-, COS+/-, DATA+/-, ECOM, EPWR 9V, S1/S2/S3, TS+, EPWR 5V, battery). AUX feedback kit 2198-AUXKIT for master or load feedback. Feedback battery box 2198-KTBT maintains TLP position on power loss. 2090-CFBM7Dx feedback cables.", "safety": "Hardwired Safe Torque Off only; Cat 3 per ISO 13849-1, PLd (SAFETY-AT188A-EN-P, Guardmaster DI safety relay). The STO alarm is typically E500. The STO condition is not automatically controlled: after a faulted STO state is corrected, the STO alarm remains and must be reset. STO connector data, wiring, bypass and cascade per UM004D Chapter 15.", "network": "EtherNet/IP, Port 1 (TX+/-, RX+/-). Set the IP address via the keypad interface, KNX5100C software, or the BOOTP-DHCP tool. Linear, ring and star topologies per UM004D Chapter 1. Studio 5000 Logix Designer v30+ for Logix, Connected Components Workbench (CCW) v10.0+ for Micro800, KNX5100C v1.001+ via the mini-USB cable 2198-USBC (with 2198-USBF filter). Pulse train output with the Motion User Defined Function Block from a Micro800 controller; MicroLogix 1400 via RS-232/485 plus Ethernet."}, "configuration": [{"step": "KNX5100C route: download KNX5100C software v1.001 or later, launch it, connect to the drive and set the COM port (mini-USB cable 2198-USBC).", "screen": "KNX5100C software", "parameter": "COM port", "value": "Mini-USB connection", "source": "2198-UM004D-EN-P Ch7"}, {"step": "In KNX5100C configure the drive settings: set the IP address, then configure the motor selection (Data Source, motor thermal models, motor feedback), then run a commutation test.", "screen": "KNX5100C, drive settings", "parameter": "Data Source; motor thermal models; motor feedback", "value": "Per motor catalog", "source": "2198-UM004D-EN-P Ch7"}, {"step": "Choose the operation mode in the Operation Mode Selection List: Position, Speed, Torque, PR (index), IO mode (Position / Home / Gear / Index / Speed / Torque), or E-Cam. The mode parameter is ControlMode ID117 (P1.001.Z).", "screen": "KNX5100C, Operation Mode Selection List", "parameter": "ID117 (P1.001.Z) ControlMode", "value": "Per application", "source": "2198-UM004D-EN-P Ch7/Ch10"}, {"step": "Configure the general settings, command source, pulse outputs, electronic gear (E-Gear) ratio, filter, notch filter, limits, analog I/O, position / velocity / current loops, and DI/DO plus the jog function. E-Gear ratio: GearRatioFollowerCountsN1 ID151 (P1.044), GearRatioMasterCounts ID152 (P1.045).", "screen": "KNX5100C, Parameter Editor / Parameter Wizard", "parameter": "ID151 (P1.044) GearRatioFollowerCountsN1; ID152 (P1.045) GearRatioMasterCounts", "value": "Per gearing", "source": "2198-UM004D-EN-P Ch7/Ch10; Appendix C"}, {"step": "For PR (indexing) mode, set up homing: ID297 (P5.004) homing mode and ID397 (P6.000) homing setting. The PR trigger is ID300 (P5.007). PR commands are numbered 0-99.", "screen": "KNX5100C, homing / PR settings", "parameter": "ID297 (P5.004) homing mode; ID397 (P6.000) homing setting; ID300 (P5.007) PR trigger", "value": "Per application", "source": "2198-UM004D-EN-P Ch7/Ch10"}, {"step": "Logix route (Studio 5000 v30+): install the Kinetix 5100 AOP, configure the Logix 5000 controller, add the 2198-Exxxx-ERS drive modules, use Automatic Device Configuration (ADC) in AOP v2+, set the Connection RPI, then download the program.", "screen": "Studio 5000 Logix Designer, New Module; Module Properties", "parameter": "Connection RPI; ADC", "value": "Per application", "source": "2198-UM004D-EN-P Ch8"}, {"step": "Configure the digital I/O: the drive supports ten customer-defined digital input points, all configurable with KNX5100C software (DI 1-8, plus DI 9 and DI 10 high-speed). All inputs are 24V DC (0V = OFF, 24V = ON). Digital outputs OUT1-OUT4 are assignable: Not assigned, Zero speed, Inspeed window, Current limit, Runtime fault, Ready, Brake (motor holding brake).", "screen": "KNX5100C, DI/DO configuration", "parameter": "Digital inputs 1-10; digital outputs OUT1-OUT4", "value": "24V DC; per application", "source": "2198-UM004D-EN-P Ch3/Ch7; 2198-RM004"}, {"step": "Apply power. After the drive boots up successfully it displays 'Kinetix 5100' briefly and then transitions to the Drive Status display, assuming the drive is disabled / servo off. The Real Time Data screen shows the real-time value of the selected parameter. Three status indicators on the front: module (MOD), network (NET), and CHARGE.", "screen": "Drive keypad display, Drive Status / Real Time Data", "parameter": "MOD; NET; CHARGE indicators", "value": "Per drive state", "source": "2198-UM004D-EN-P Ch5; 2198-UM004A-EN-P p.96"}], "commissioning": ["Verify wiring: AC input, 50-pin terminal block 2198-TBIO, motor power (ring lugs on the larger frames), MFB feedback kit with battery backup, AUX feedback if used, STO wiring or bypass, Ethernet Port 1.", "Verify the IP address (keypad, KNX5100C, or BOOTP-DHCP tool) and the MOD / NET / CHARGE indicators.", "Run the commutation test in KNX5100C and verify the motor selection (Data Source, motor thermal models, motor feedback).", "For PR mode, verify homing (ID297 / ID397) is defined before starting indexing; PR commands are 0-99.", "Verify the E-Gear ratio (ID151 / ID152) and the digital I/O assignments in KNX5100C.", "Monitor the drive in KNX5100C (Function List > Monitoring Status). View status and faults on the keypad display; the display shows E + code for a fault and A + code for a warning. Clear faults per UM004D Chapter 16, p.431."], "tuning": "Autotuning is available via the drive panel or KNX5100C. Tuning Mode 1 and Tuning Mode 2: ID217 (P2.032) = 1 selects Mode 1, = 2 selects Mode 2, = 0 selects manual mode; keep estimating ID144 (P1.037) and adjust ID216 (P2.031). Autotune constraints: dwell time must be over 1 second (else E08B), accel/decel from 0 to 3000 rpm within 1.5 s (else E08C), recommended speed 500 rpm (lowest 200 rpm), load inertia at most 50 times the motor inertia. Manual mode: nested P-I loop gain adjustment (position loop gain, velocity loop gain); low-frequency vibration suppression in position mode; mechanical resonance suppression; system analysis (phase margin / gain margin). Notch filters: ID208 (P2.023) NotchFilter1Frequency, ID209 (P2.024) NotchFilter1Depth, ID226 (P2.043) NotchFilter2Frequency, ID227 (P2.044) NotchFilter2Depth, ID228 (P2.045) NotchFilter3Frequency, ID229 (P2.046) NotchFilter3Depth, ID254 (P2.095) NotchFilter1QValue. Low-pass filter: ID210 (P2.025) ResonanceSuppressionLowPassFilterTime.", "faults": [{"code": "E001", "meaning": "Over current - current 1.5x the rated peak", "fix": "Check the wiring, check for shorts, check the heatsink temperature, reset the parameters to default then adjust gradually, check and increase the accel time, apply a filter."}, {"code": "E002", "meaning": "Over voltage - main circuit voltage above the rated value", "fix": "Check the main input voltage and apply the correct voltage."}, {"code": "E003", "meaning": "Under voltage - main circuit voltage below the rated value", "fix": "Check the input voltage and wiring."}, {"code": "E005", "meaning": "Regeneration error - shunt not connected or shunt value too low", "fix": "Check the shunt connection; set ID157 (P1.052) ShuntResistorValue and ID158 (P1.053) ShuntResistorPower correctly. ID158 must not be zero when no shunt is fitted."}, {"code": "E006", "meaning": "Motor overload - ratings exceeded", "fix": "Check ID102 (P0.002) LEDMonitorSelection = 12 for average torque percent; change the motor or reduce the load; check vibration; adjust tuning; check accel/decel."}, {"code": "E009", "meaning": "Excessive deviation of position command", "fix": "Check ID219 (P2.035) PositionErrorTolerance (it may be too small); check tuning; check that the torque limit is not too low; check the external load."}, {"code": "E011", "meaning": "Encoder error - encoder wired incorrectly, loose, or damaged", "fix": "Check the connectors; replace the motor."}, {"code": "E083", "meaning": "Excessive over current - output exceeds 95% of the hardware overcurrent", "fix": "Check the wiring for shorts and check the accel time."}, {"code": "E08C", "meaning": "Inertia estimation error (autotune)", "fix": "Accel/decel 0 to 3000 rpm within 1.5 s; recommended speed 500 rpm, lowest 200 rpm; load inertia at most 50x the motor inertia."}, {"code": "E500", "meaning": "STO enabled", "fix": "Check whether STO is activated; if STO is unused, check the bypass wiring; check the STO wiring."}, {"code": "E601", "meaning": "Duplicate IP address", "fix": "Set an unused IP address."}, {"code": "E602", "meaning": "Control connection loss", "fix": "Check the Ethernet cable and connection and the controller operation."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2198-um004_-en-p.pdf", "sources": ["https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=10 (Rockwell 2198-UM004D-EN-P Dec 2022, Ch1)", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=27 (UM004D Ch1, PTO / Micro800)", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=57 (UM004D Ch3, digital I/O)", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=107 (UM004D Ch4, 2198-K51CK-D15M feedback kit)", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=259 (UM004D Ch10, notch filters)", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=519 (UM004D Appendix C, MAG AOI E-Gear ID151/ID152)", "https://www.manualslib.com/manual/3863128/Allen-Bradley-Kinetix-5100-2198-E1007-Ers.html?page=425 (UM004A Ch16, status indicators)", "Local copies read 2026-11-20: .research/pdfs/um004-5100.pdf (failed 482-byte Akamai block page - ignored); 2198-RD001A-EN-P Aug 2021 fault reference read via Scribd"], "tbd": ["Exact KNX5100C click sequence beyond TOC-level steps - source needed: 2198-UM004D Ch7 full text", "24V control-power specification for the 5100 - source needed: 2198-UM004D Ch3 control power current specifications", "Number of Ethernet ports on the 5100 (Port 1 verified; a second port is unverified) - source needed: 2198-UM004D Ch3", "Full 2198-RD001 fault table beyond the verified rows - source needed: 2198-RD001A-EN-P Aug 2021"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-5300", "category": "servo-drive", "family": "Kinetix 5300", "catalogNumbers": ["2198-C1004-ERS", "2198-C1007-ERS", "2198-C1015-ERS", "2198-C1020-ERS", "2198-C2030-ERS", "2198-C2055-ERS", "2198-C2075-ERS", "2198-C4004-ERS", "2198-C4007-ERS", "2198-C4015-ERS", "2198-C4020-ERS", "2198-C4030-ERS", "2198-C4055-ERS", "2198-C4075-ERS"], "name": "Kinetix 5300 Servo Drive", "whatItIs": "The Kinetix 5300 is a single-axis EtherNet/IP servo drive, 0.22 to 14.70 kW, and Rockwell's entry-level CIP Motion drive. It is a standalone drive with hardwired Safe Torque Off, and it is the announced migration target for the discontinued Kinetix 350.", "whenToUse": "Pick the 5300 for single-axis machines where you want full Logix CIP Motion without the cost or complexity of the 5500/5700. Pick it over the 350 for any new design (the 350 was discontinued in July 2024). Pick it over the 5100 when the axis is driven by a Logix controller rather than running standalone indexing. Pick it over the 5500 when you do not need shared-bus multi-axis operation or integrated safety.", "selection": "Size with Rockwell Motion Analyzer. Table 3 of UM005E: 2198-C1004 0.22 kW; C1007 0.36/0.76/1.18 kW, 4.6 A rms continuous; C1015 8.5 A; C1020 0.97/2.02/3.13 kW, 12.2 A continuous, 25.0/40.6 A peak; C2030 5.02 kW, 19.6 A, 61.0 A peak; C2055 10.30 kW, 40.2 A, 108.0 A; C2075 12.22 kW, 47.7 A, 127.5 A; C4004 0.86 kW, 1.6 A, 5.3 A; C4007 1.55 kW, 2.9 A, 9.3 A; C4015 2.78 kW, 5.2 A, 18.0 A; C4020 3.90 kW, 7.3 A, 23.8 A; C4030 6.25 kW, 11.7 A, 34.1 A; C4055 12.08 kW, 22.6 A, 58.5 A; C4075 14.70 kW, 27.5 A, 73.5 A. Input voltages: 85-132V rms single-phase, 170-253V single-phase, 170-253V three-phase, 342-528V three-phase (100V / 200V / 400V class).", "wiring": {"power": "AC input through the input power connector. 24V DC control power through the 2198-TCON-24VDCIN36 control power input connector, with 2198-H040-P-T (frames 1-2) and 2198-H070-P-T T-connectors for control-power sharing between drives. AC line filters 2198-DB08-F or 2198-DBRxx-F (DBR20-F, DBR40-F) are required for CE and UK compliance. External passive shunt resistor as needed.", "feedback": "MFB 15-pin connector kit with battery backup for TLP/TL/TLY multi-turn encoders. AUX connector kit for master or load feedback. Feedback battery box 2198-KTBT maintains TLP motor position on power loss.", "safety": "Hardwired Safe Torque Off via the STO connector only; there is no integrated-safety variant. SF09 GuardStopInputFault occurs if the STO inputs disagree for more than 1.0 second.", "network": "Dual-port EtherNet/IP; linear, DLR (ring) and star topologies. Studio 5000 Logix Designer v33.00 or later. Controllers: CompactLogix 5370/5380/5480, GuardLogix 5370, ControlLogix 5570/5580, GuardLogix 5570/5580, with 1756-EN2T / EN2TR / EN3TR."}, "configuration": [{"step": "Set the network parameters from the front panel. From the Home Screen press Next to access the main menu, press Next to scroll until IP SETTINGS is displayed, press Select. Within the IP SETTINGS menu press Next to navigate IP ADDRESS, SUBNET, or GATE, then Select. If the character is editable it blinks: press Select to increment the active character, Next to move to the next character, Back to move to the previous character. After modifying the last character press Next (the display shows ACCEPT), then Select to accept and return to the IP SETTINGS submenu. Press Back to validate the settings; Net Err is displayed if any network settings are incompatible (or Protected Net is set to ON). Cycle 24V power to apply the changes.", "screen": "Drive front panel, IP SETTINGS menu", "parameter": "IP ADDRESS; SUBNET; GATE", "value": "Per network plan; cycle 24V power to apply", "source": "2198-UM005E-EN-P Ch6 p.99"}, {"step": "Download the Kinetix 5300 Add-On Profile (AOP) from the Product Compatibility and Download Center, following the download procedure in UM005E Chapter 6.", "screen": "Product Compatibility and Download Center", "parameter": "AOP: Kinetix 5300", "value": "Latest revision for the drive firmware", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Create the project in Studio 5000 Logix Designer v33.00 or later: select the controller, set the Revision, click Finish. Add the EtherNet/IP module (ControlLogix: 1756-EN2T / EN2TR / EN3TR) via I/O Configuration > New Module; in Module Definition set Time Sync Connection to 'Time Sync and Motion'; in Controller Properties > Date/Time tab check Enable Time Synchronization.", "screen": "Studio 5000 Logix Designer; I/O Configuration > New Module; Controller Properties > Date/Time tab", "parameter": "Time Sync Connection; Enable Time Synchronization", "value": "Time Sync and Motion; Checked", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Add the drive: right-click Ethernet > New Module, filter Motion + Allen-Bradley, select 2198-Cxxxx-ERS, enter a Name and the Ethernet Address (Private Network), click OK.", "screen": "New Module", "parameter": "Catalog number; Ethernet Address", "value": "2198-Cxxxx-ERS", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Create the axis: right-click the drive > Properties > Associated Axes tab > New Axis. Configure the Digital Input category and the Power category.", "screen": "Module Properties > Associated Axes tab", "parameter": "AXIS_CIP_DRIVE", "value": "New Axis", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Configure Axis Properties. SPM closed-loop motors: General, Motor, Scaling, Load, Actions, Exceptions, Parameter List. Induction motors: General, Motor, Frequency Control, Motor > Model, Motor > Analyzer (Calculate Model). Feedback-only axis: General + Master Feedback.", "screen": "Axis Properties", "parameter": "Motor > Analyzer: Calculate Model", "value": "Per motor", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Create the Motion Group: right-click Motion Groups > New Motion Group > Properties > Axis Assignment tab, move the axis from Unassigned to Assigned, then set the Attribute tab.", "screen": "Motion Groups > New Motion Group; Axis Assignment tab", "parameter": "Axis Assignment", "value": "Unassigned -> Assigned", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Download the program and apply power. Startup display sequence: BOOT, then 5300 (dot segments light left to right as each start-up phase completes), then self-test shows 8.8.8.8, then the device state and the MAC or IP address scroll across the display. Device states: 00 waiting for connection to controller, 01 configuring device attributes, 02 waiting for group synchronization, 03 waiting for DC-bus to charge, 04 device is operational.", "screen": "Drive front-panel display", "parameter": "Device state", "value": "04 = operational", "source": "2198-UM005E-EN-P Ch6 Table 59"}], "commissioning": ["Verify wiring: AC input, 24V DC control power, line filter fitted for CE/UK, motor power and feedback cables correct, STO wiring correct.", "Verify the network settings on the front panel (IP ADDRESS, SUBNET, GATE) and cycle 24V power after any change.", "Remove the load from every axis before running hookup tests (uncontrolled motion and brake release are possible).", "Run Hookup Tests in Axis Properties: enter the Test Distance (units from the Scaling tab), then run Marker (manual shaft rotation, marker detection), Commutation (required for third-party / custom PM motors not in the Motion Database; see Commutation Test p.229 of UM005E), Motor Feedback (manual rotation, verify feedback wiring), and Motor and Feedback (drive rotates the motor; needs full bus power; run Motor Feedback first).", "On each test: Start, wait for Test State Executing to become Passed, confirm the forward direction Yes, then Accept Test Results.", "On a hookup failure, verify the DC bus voltage, the Scaling values, and the motor power and feedback wiring.", "Verify the drive reaches device state 04 (operational) and there are no active faults (Fxx) on the display or in Logix Designer."], "tuning": "The Kinetix 5300 drives are configured for tuningless operation by default. If additional tuning is required, see the Motion System Tuning Application Technique, publication MOTION-AT005, for more information. (2198-UM005E-EN-P Ch6, p.133.)", "faults": [{"code": "F2", "meaning": "Motor Commutation Fault - illegal Hall state transition", "fix": "Verify the Hall wiring is not open, shorted, or missing; use shielded cables; check grounds; replace the motor if it persists."}, {"code": "F3", "meaning": "Motor Overspeed Factory Limit - speed over 125% of maximum, or output frequency over 590 Hz", "fix": "Check the control loop tuning; reduce the velocity command."}, {"code": "F7", "meaning": "Motor Thermal Overload FL - thermal model over the factory limit", "fix": "Modify the command profile; reduce speed or increase time."}, {"code": "F10", "meaning": "Inverter Overcurrent - current over the instantaneous hardware limit", "fix": "Check the power cable for shorts; verify the windings are not shorted; verify the wire gauge; operate within the continuous rating; reduce acceleration."}, {"code": "F25", "meaning": "Pre-charge Failure - DC bus did not reach the factory voltage after charging, or went too high", "fix": "Check the AC input on all phases and the input power wiring; check for an inverter or motor shorted to ground; replace the power supply or drive if it persists."}, {"code": "F33", "meaning": "Bus Undervoltage FL - DC bus below the factory limit", "fix": "Verify the incoming AC voltage; monitor for glitches or line droop; install a UPS."}, {"code": "F35", "meaning": "Bus Overvoltage FL - DC bus above the factory limit", "fix": "Change the decel or motion profile; unplug the shunt connector and measure the resistance; add an external shunt or an active brake."}, {"code": "F45", "meaning": "Motor Feedback Data Loss FL - missed or corrupted serial feedback packets", "fix": "Check the feedback cable and connector; check that the power cable and feedback shields are secured; check that the motor frame is grounded; consult the F47 solutions."}, {"code": "F47", "meaning": "Motor Feedback Device Failure - Hiperface internal error (nn sub-codes 01-35, e.g. 01 incorrect alignment data, 29 transmitter current critical, 30 encoder temperature critical, 33-35 multiturn position error)", "fix": "Check the feedback cable continuity; check motor phasing U/V/W and the Hiperface 15-pin connections; improve noise reduction and bonding; cycle control power; check the shield; reduce shock and vibration; replace the motor."}, {"code": "F49", "meaning": "Brake Slip Exception - motor displacement exceeded the brake slip tolerance while the brake was engaged", "fix": "Check the motor brake."}, {"code": "F54", "meaning": "Excessive Position Error - position error exceeded Position Error Tolerance for Position Error Tolerance Time", "fix": "Check the position loop tuning; increase the feedforward gain; verify the sizing; check the motor power wiring; increase Position Error Tolerance and/or Time."}, {"code": "F61", "meaning": "Enable Input Deactivated - hardware enable input deactivated while the drive was enabled", "fix": "Check the drive enable input wiring; un-assign Enable as a digital input source."}, {"code": "SF09", "meaning": "GuardStopInputFault - STO input discrepancy for more than 1.0 second", "fix": "Verify the safety wiring at the STO connector, the terminations, that the cable/header is seated, and that +24V is within limits; check the safety inputs; reset the error and execute STO to verify."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2198-um005_-en-p.pdf", "sources": ["http://5.imimg.com/data5/SELLER/Doc/2025/9/549021007/HD/NP/BQ/44769851/allen-bradley-2198-c1004-ers-kinetix-5300-200v-class-servo-drive.pdf (Rockwell 2198-UM005E-EN-P Sep 2024, 240 pp)", "https://che-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/2198-um005_-en-p.pdf?A294B07783706861C5B2847587965D99BE72C473C29B96&ts=1789790791895 (Rockwell 2198-UM005A-EN-P Oct 2020)", "https://www.manualslib.com/manual/2526843/Rockwell-Automation-Allen-Bradley-Kinetix-5300.html (Rockwell 2198-UM005C-EN-P Feb 2022)", "https://literature.rockwellautomation.com/idc/groups/literature/documents/rm/2198-rm006_-en-p.pdf (Ultra3000 to Kinetix 5300 Migration Guide, 2198-RM006A-EN-P Dec 2020)", "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/motion-um003_-en-p.pdf (Integrated Motion on the EtherNet/IP Network: Configuration and Startup, MOTION-UM003)", "Local mirror copy read 2026-11-20: .research/pdfs/um005-5300.txt (Rockwell 2198-UM005E-EN-P Sep 2024)"], "tbd": ["Tuning beyond the tuningless default - source needed: MOTION-AT005 and 2198-UM005E Ch6 Tune the Axes", "Kinetix 350 to Kinetix 5300 migration guide publication number (2198-RM006 is Ultra3000 to 5300; the 350 to 5300 guide number is unverified) - source needed: Rockwell migration guide", "Full 2198-RD006 fault table beyond the verified rows - source needed: 2198-RD006B-EN-P Sep 2024"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-5500", "category": "servo-drive", "family": "Kinetix 5500", "catalogNumbers": ["2198-H070-ERS2", "2198-H003-ERS", "2198-H008-ERS", "2198-H015-ERS", "2198-H025-ERS", "2198-H040-ERS", "2198-H070-ERS", "2198-CAPMOD-1300"], "name": "Kinetix 5500 Servo Drive", "whatItIs": "The Kinetix 5500 is a single-axis EtherNet/IP servo drive with hardwired Safe Torque Off (ERS) or integrated Safe Torque Off over EtherNet/IP (ERS2). Each drive is a complete servo axis that can run standalone or share AC, DC, or AC/DC bus power with other 5500 drives, and it connects to VP motors with a single cable carrying power, feedback and brake.", "whenToUse": "Pick the 5500 for one-drive-per-axis machines up to 14.6 kW where you want full CIP Motion with a Logix controller. Pick it over the 5700 when you do not need a separate DC-bus supply, dual-axis inverters, or power above 14.6 kW. Pick it over the 5300 when you need shared-bus multi-axis operation or integrated safety (ERS2). Pick it over the 5100 when the axis is driven by a Logix controller rather than running standalone indexing.", "selection": "Size with Rockwell Motion Analyzer. Table 3 of UM001M: 2198-H003 0.2/0.3 kW, 1.4 A 0-pk continuous / 3.5 A peak; H008 0.5/0.8/1.6 kW, 3.5 / 8.8 A; H015 1.0/1.5 kW, 7.1 / 17.7 A; H025 2.4/3.2/5.1 kW, 11.3 / 28.3 A; H040 4.0/8.3 kW, 18.4 / 45.9 A; H070 7.0/14.6 kW, 32.5 / 81.3 A. Input: 195-264V rms single-phase, 195-264V three-phase, or 324-528V rms three-phase. Frames 1-3. CAPMOD-1300 capacitor module: 1360 uF minimum, 650V DC nominal. Combined motor power cable length for all axes on the same DC bus must not exceed 250 m.", "wiring": {"power": "AC input through the input connector. Shared AC/DC power uses T-connector kits 2198-H040-x-x (frames 1-2) and 2198-H070-x-x (frame 3): ADP-IN for the first drive (mains AC + 24V DC + DC bus T), A-T for AC sharing, D-T for DC sharing, P-T for control power sharing, plus AD-T, AP-T and DP-T combinations. 24V DC control, digital-input, safety and motor-brake power from a 1606-XLxxx supply. AC line filters 2198-DB08-F / DB20-F are required for CE (DBRxx-F for new systems). External shunt 2097-R6/R7.", "feedback": "Single cable 2090-CSxM1DF (flying lead: power + feedback + optional 24V brake) for VP motors; 2090-CSxM1DG with longer leads. 2090-CFBM7DF-CEAxxx feedback cables and 2090-CPxM7DF power/brake cables for MP motors. DSL feedback via the 2198-KITCON-DSL kit. Hiperface motors (MPL/MPM/MPF/MPS, MPAS/MPAR/MPAI, LDAT) connect through the 2198-H2DCK Hiperface-to-DSL converter kit, series B or later. Optional 2198-ABQE encoder output module (DIN rail, EtherNet/IP) outputs encoder pulses, for example to line-scan vision cameras.", "safety": "ERS drives use a hardwired STO connector. ERS2 drives provide STO over EtherNet/IP (integrated safety), which needs Studio 5000 Logix Designer v24.00 or later. Safety rating SIL 3 / PLe.", "network": "Dual-port EtherNet/IP; linear, DLR (ring) and star topologies. A DLR supervisor is required in a ring (for example a 1783-ETAP). Use 1585J shielded Ethernet cable. Studio 5000 Logix Designer v21.00 or later (v24+ for ERS2). Controllers: CompactLogix 5370/5380/5480, GuardLogix 5370, ControlLogix 5570/5580, GuardLogix 5570, with 1756-EN2T / EN2TR / EN3TR."}, "configuration": [{"step": "Set the drive IP address from the LCD display: SETUP > NETWORK, choose STATIC IP (the default) or DHCP. Factory static IP is 192.168.1.1. Changes take effect only after a power cycle. The address can also be changed through the RSLinx Module Configuration dialog.", "screen": "Drive LCD display, SETUP > NETWORK", "parameter": "Static IP / DHCP; IP address", "value": "Factory static IP 192.168.1.1", "source": "2198-UM001M-EN-P Ch6"}, {"step": "Download the 2198 CIP Motion Kinetix 5500/5700 Add-On Profile (AOP) from the Product Compatibility and Download Center at rok.auto/pcdc. AOP rule (same as 5700): firmware 4.001 with Logix v26/27 needs the AOP, v28+ does not; firmware 5.001 with v26/27/28 needs the AOP, v29+ does not.", "screen": "Product Compatibility and Download Center", "parameter": "AOP: 2198 CIP Motion Kinetix 5500/5700", "value": "Per firmware / Logix version table (Table 58)", "source": "2198-UM001M-EN-P Ch6 Table 58"}, {"step": "Create the project in Studio 5000 Logix Designer v21.00 or later (v24.00+ for ERS2 drives): select the controller, set the Revision, click Finish.", "screen": "Studio 5000 Logix Designer, New Project", "parameter": "Controller Revision", "value": "v21.00+ (v24.00+ for ERS2)", "source": "2198-UM001M-EN-P Ch6"}, {"step": "ControlLogix / GuardLogix only: add the EtherNet/IP module via I/O Configuration > New Module, select 1756-EN2T / EN2TR / EN3TR. In Module Definition set Time Sync Connection to 'Time Sync and Motion'. Then Controller Properties > Date/Time tab > check Enable Time Synchronization.", "screen": "I/O Configuration > New Module; Module Definition; Controller Properties > Date/Time tab", "parameter": "Time Sync Connection; Enable Time Synchronization", "value": "Time Sync and Motion; Checked", "source": "2198-UM001M-EN-P Ch6"}, {"step": "Add the drive: right-click Ethernet > New Module, filter Motion + Allen-Bradley, select 2198-Hxxx-ERS or -ERS2, enter a Name and the Ethernet Address (Private Network).", "screen": "New Module", "parameter": "Catalog number; Ethernet Address", "value": "2198-Hxxx-ERS / -ERS2", "source": "2198-UM001M-EN-P Ch6"}, {"step": "Create the axis: Module Properties > Associated Axes tab > New Axis (AXIS_CIP_DRIVE is the default data type). For ERS2 drives, configure the Drive Safety tab and the Safety tab in Module Properties.", "screen": "Module Properties > Associated Axes tab; Drive Safety tab; Safety tab", "parameter": "AXIS_CIP_DRIVE", "value": "New Axis", "source": "2198-UM001M-EN-P Ch6"}, {"step": "Configure Axis Properties: General, Motor, Scaling, Load, Actions, Exceptions, Parameter List. For SPM motors follow the same categories. For induction motors use General, Motor, Frequency Control; the Parameter List category includes SkipSpeed1 and SkipSpeedBand. For a feedback-only axis use General + Master Feedback.", "screen": "Axis Properties", "parameter": "SkipSpeed1; SkipSpeedBand", "value": "Per application", "source": "2198-UM001M-EN-P Ch6; 2198-UM001D-EN-P p.129"}, {"step": "Create the Motion Group: right-click Motion Groups > New Motion Group. In Properties > Axis Assignment tab move the axis from Unassigned to Assigned, then set the Attribute tab.", "screen": "Motion Groups > New Motion Group; Axis Assignment tab", "parameter": "Axis Assignment", "value": "Unassigned -> Assigned", "source": "2198-UM001M-EN-P Ch6"}, {"step": "In the Module Properties > Power tab set the Bus Configuration (standalone, shared AC, shared DC, shared AC/DC, or shared AC/DC hybrid) and the Bus Sharing Group. Download the program and apply power.", "screen": "Module Properties > Power tab", "parameter": "Bus Configuration; Bus Sharing Group", "value": "Per system layout", "source": "2198-UM001M-EN-P Ch6"}], "commissioning": ["Verify wiring: AC input, 24V DC control power from the 1606-XLxxx supply, shared-bus T-connectors seated, motor power/brake and feedback cables correct, line filter fitted for CE.", "Verify the IP address on the LCD (factory 192.168.1.1) and that the controller time synchronization is enabled.", "Remove the load from every axis before running hookup tests (uncontrolled motion and brake release are possible).", "Run Hookup Tests in Axis Properties: enter the Test Distance (units from the Scaling tab), then run Marker (manual shaft rotation, marker detection), Commutation (third-party motors only for the 5500), Motor Feedback (manual rotation, verify feedback wiring), and Motor and Feedback (drive rotates the motor; needs full bus power; run Motor Feedback first).", "On each test: Start, wait for Test State Executing to become Passed, confirm the forward direction Yes, then Accept Test Results. The LCD shows TESTING, for example DC BUS: 218.3V.", "On a hookup failure, verify the DC bus voltage, the Scaling values, and the motor power and feedback wiring.", "Run the load-observer tuning or autotune, enable the drive with MSO then MSF for a few seconds, and listen for squealing before putting the machine into service.", "Verify there are no active faults on the display (FLT Sxx) or in Logix Designer, and verify the STO function."], "tuning": "PM motors use the load observer. In the Autotune tab set Application Type to Custom, Loop Response to Medium, Load Coupling to Rigid, with only Velocity Feedforward checked; UNCHECK Torque Low Pass Filter (it is checked by default). In the Load tab check Use Load Ratio and set Load Ratio to 0. In the Observer tab set Configuration to 'Load Observer with Velocity Estimate' for the Position Loop and 'Load Observer Only' for the Velocity Loop; the load observer is NOT available for the Torque Loop. In the Compliance tab set Adaptive Tuning Configuration to 'Tracking Notch'. Enable the drive with MSO then MSF for a few seconds and listen for squealing; if it squeals, set the Torque Notch Filter Frequency (Hz) in Load > Compliance. See MOTION-AT005. Induction motors: Automatic FluxUpControl is recommended; remove the load first, then reattach and repeat. In the Autotune category set Travel Limit to 50.0 and Speed to 2.0 (example values from the manual), Direction defaults to Forward Uni-directional; click Start, wait for Executing to become Success, then Accept Tuned Values.", "faults": [{"code": "FLT S02", "meaning": "MTR COMMUTATION - illegal Hall state", "fix": "Verify the Hall feedback wiring is not open, shorted, or missing; use shielded cables."}, {"code": "FLT S03", "meaning": "MTR OVERSPEED FL - motor speed over 125% of maximum, or output frequency over 590 Hz", "fix": "Check the control loop tuning; reduce the velocity command."}, {"code": "FLT S07", "meaning": "MTR OVERLOAD FL - motor thermal model over the factory limit", "fix": "Modify the command profile; reduce speed or increase time."}, {"code": "FLT S10", "meaning": "INV OVERCURRENT - current over the instantaneous hardware limit", "fix": "Check the motor power cable for shorts; verify the motor windings are not shorted."}, {"code": "FLT S15", "meaning": "CONV OVERCURRENT - converter overcurrent", "fix": "Reduce the acceleration times of all drives sharing the DC bus."}, {"code": "FLT S16", "meaning": "GROUND CURRENT - ground current detected", "fix": "Check the motor power wiring and cable; replace the motor if the fault persists."}, {"code": "FLT S20", "meaning": "CONV OVERLOAD FL - converter thermal model over the factory limit", "fix": "Reduce the duty cycle or the number of follower drives on the shared DC bus."}, {"code": "FLT S25", "meaning": "CONV PRECHARGE FAILURE - DC bus did not reach the factory voltage after charging, or went too high", "fix": "Check the AC input on all phases and the input power wiring; check for an inverter or motor shorted to ground."}, {"code": "FLT S33", "meaning": "BUS UNDERVOLT FL - DC bus below the factory limit", "fix": "Verify the incoming AC voltage; monitor for glitches or line droop; install a UPS."}, {"code": "FLT S45", "meaning": "FDBK COMM FL - motor feedback communication fault", "fix": "Check the feedback cable and connector, check the shield terminations, and check that the motor frame is grounded."}, {"code": "FLT S47", "meaning": "FDBK DEVICE FAILURE - feedback device internal error", "fix": "Check the feedback cable continuity and the motor phasing; cycle control power; replace the motor if it continues."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2198-um001_-en-p.pdf", "sources": ["https://my.goagilix.com/assets/2d/98/2d9819f3-8d9f-4a32-abba-37e75b483d36/2198-um001_-en-p.pdf (Rockwell 2198-UM001M-EN-P Nov 2022, 260 pp)", "https://www.manualslib.com/manual/2385730/Allen-Bradley-Kinetix-5500.html", "https://manuals.plus/wp-content/plugins/pdfjs-viewer-shortcode/pdfjs/web/viewer.php?file=https://manuals.plus/wp-content/uploads/2023/02/Allen-Bradley-Kinetix-5500-Servo-Drives-User-Manual.pdf&attachment_id=6851326&dButton=true&pButton=true&oButton=false&sButton=true", "https://www.scribd.com/document/647398152/iasimp-qs035-en-p (Kinetix 5500 Quick Start, IASIMP-QS035B-EN-P Apr 2015)", "Local mirror copy read 2026-11-20: .research/pdfs/um001-5500.txt (Rockwell 2198-UM001M-EN-P Nov 2022)"], "tbd": ["Full 2198-RD005 fault table beyond the verified rows - source needed: 2198-RD005A-EN-P Feb 2022", "Single-phase operation conditions in Module Properties > Power tab - source needed: 2198-UM001M Ch6 full text", "ERS2 integrated-safety configuration detail (Drive Safety tab) - source needed: 2198-UM001M Ch6 ERS2 procedure"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-5700", "category": "servo-drive", "family": "Kinetix 5700", "catalogNumbers": ["2198-D057-ERS3", "2198-D006-ERS3", "2198-D012-ERS3", "2198-D020-ERS3", "2198-D032-ERS3", "2198-S086-ERS3", "2198-S130-ERS3", "2198-S160-ERS3", "2198-P031", "2198-P070", "2198-P141", "2198-P208", "2198-CAPMOD-2240"], "name": "Kinetix 5700 Servo Drive", "whatItIs": "The Kinetix 5700 is a multi-axis servo drive system built around a shared DC bus. A separate 2198-Pxxx DC-bus power supply converts three-phase AC into DC, and zero-stacked single-axis (2198-Sxxx) and dual-axis (2198-Dxxx) inverters hang off that bus. It is Rockwell's flagship Integrated Motion over EtherNet/IP servo system, covering 1.6 to 60 kW.", "whenToUse": "Pick the 5700 for high-performance multi-axis machines where several axes share one DC bus and you want regenerative braking energy shared between axes. Pick it over the 5500 when you need a separate DC-bus supply, dual-axis inverters, or power above 14.6 kW; over the 5300/5100 when the machine has multiple coordinated axes; over the 6200/6500 for any new design, since the 5700 is the current flagship that replaces the 2094 platform.", "selection": "Size with Rockwell Motion Analyzer. DC-bus power supplies (400V-class, 324-528V AC rms input): 2198-P031 7 kW, 2198-P070 17 kW, 2198-P141 31 kW, 2198-P208 46 kW. Single-axis inverters: 2198-S086 29.7 kW / 60.8 A 0-pk, 2198-S130 44.9 kW / 91.9 A 0-pk, 2198-S160 60.1 kW / 120.2 A 0-pk. Dual-axis inverters: 2198-D006 1.7 kW / 3.5 A 0-pk, 2198-D012 3.4 kW / 7.0 A, 2198-D020 5.5 kW / 11.3 A, 2198-D032 8.9 kW / 18.3 A, 2198-D057 15.9 kW / 32.5 A 0-pk (23 A rms). Add a 2198-CAPMOD-2240 capacitor module (2240 uF, 100 A max) when the application needs extra bus capacitance. Bus-sharing groups: up to 25; all modules on the same shared bus must be in the same Bus Sharing Group.", "wiring": {"power": "Three-phase 324-528V AC rms into the 2198-Pxxx DC-bus power supply through the IPD (AC input) connector, with the CED (contactor-enable) connector for the line contactor. 24V DC control, digital-input and motor-brake power comes from a customer-supplied 1606-XLxxx supply into the CP connector. DC bus and shunt connectors link the power supply to the inverters over the zero-stacked shared-bus connection system. AC line filters 2198-DB20-F / DB42-F / DB80-F / DB290-F are required for CE compliance. Install the included ground screw for grounded (wye) power configurations; remove it for ungrounded or high-impedance grounded power.", "feedback": "MF-A / MF-B motor feedback connectors and UFB-A / UFB-B 15-pin universal feedback connectors for master, load or auxiliary feedback. DSL feedback via the 2198-KITCON-DSL kit (VPC-Bxxxxx-Q, VPL/VPF/VPS motors). Hiperface feedback via the 2198-K57CK-D15M 15-pin kit (VPC-Bxxxxx-S, MP-Series MPL/MPM/MPF/MPS, HPK, MPAS/MPAR/MPAI, LDAT, LDC). Heidenhain EnDat for RDD and VPC-Bxxxxx-Y motors. Hiperface-to-DSL converter kit 2198-H2DCK for mixed motor types. Use 2090 motor power/brake and feedback cables.", "safety": "Hardwired Safe Torque Off plus integrated STO over EtherNet/IP on ERS3 drives. ERS4 drives add safe monitor functions per 2198-RM001: five safe stop functions (STO, SS1, SS2, SOS, SBC) and three safe monitoring functions (SLS, SDI, SLP). Safety rating is TUV certified, PLe and SIL CL3. STO connector pins include SB+, S1A, SCA, S2A, SBS1B, SCB, S2B. STO can be cascaded from drive to drive.", "network": "Dual-port EtherNet/IP; linear, DLR (ring) and star topologies. Use 1585J-M8CBJM-x shielded Ethernet cable and 0.15 m drive-to-drive cables; use a 1783-ETAP for single-port devices in a ring. Controllers: CompactLogix 5370/5380, ControlLogix 5570/5580, GuardLogix 5570, with 1756-EN2T / EN2TR / EN3TR EtherNet/IP modules. CIP Sync provides the motion time base."}, "configuration": [{"step": "Set the drive IP address from the LCD display: SETUP > NETWORK, choose STATIC IP (the default) or DHCP. Factory static IP is 192.168.1.1, subnet 255.255.255.0, gateway 192.168.1.1. Changes take effect only after a power cycle. The address can also be changed through the RSLinx Module Configuration dialog.", "screen": "Drive LCD display, SETUP > NETWORK", "parameter": "Static IP / DHCP; IP address", "value": "Factory static IP 192.168.1.1", "source": "2198-UM002D-EN-P Ch6; 2198-UM002E-EN-P Table 82"}, {"step": "Install the 2198 CIP Motion Kinetix 5500/5700 Add-On Profile (AOP) from the Product Compatibility and Download Center (rok.auto/pcdc). AOP rule: firmware 4.001 with Logix Designer v26/27 needs the AOP, v28+ does not; firmware 5.001 with v26/27/28 needs the AOP, v29+ does not; firmware 7.001+ with v29+ does not. Firmware 7.001 features need Logix Designer v29+.", "screen": "Product Compatibility and Download Center", "parameter": "AOP: 2198 CIP Motion Kinetix 5500/5700", "value": "Per firmware / Logix version table (Table 85)", "source": "2198-UM002D-EN-P Ch6 Table 85"}, {"step": "Create the project in Studio 5000 Logix Designer v26.00 or later: select the controller (CompactLogix 5370/5380 or ControlLogix 5570/5580), set the Revision in the pull-down, click Finish.", "screen": "Studio 5000 Logix Designer, New Project", "parameter": "Controller Revision", "value": "v26.00 or later", "source": "2198-UM002D-EN-P Ch6"}, {"step": "ControlLogix / GuardLogix only: add the EtherNet/IP module via I/O Configuration > New Module, select 1756-EN2T / EN2TR / EN3TR. In Module Definition set Time Sync Connection to 'Time Sync and Motion'.", "screen": "I/O Configuration > New Module; Module Definition", "parameter": "Time Sync Connection", "value": "Time Sync and Motion", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Enable controller time synchronization: Controller Properties > Date/Time tab > check Enable Time Synchronization (the controller becomes the CIP Sync Grandmaster).", "screen": "Controller Properties > Date/Time tab", "parameter": "Enable Time Synchronization", "value": "Checked", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Add the DC-bus power supply: right-click Ethernet > New Module, filter Motion + Allen-Bradley, select 2198-Pxxx, enter a Name and the Ethernet Address (Private Network), for example last octet 1. In the Power tab set Bus Configuration to Shared AC/DC and assign the Bus Sharing Group. Logix Designer enforces the shared-bus rules.", "screen": "New Module; Module Properties > Power tab", "parameter": "Bus Configuration; Bus Sharing Group", "value": "Shared AC/DC", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Add each inverter the same way: right-click Ethernet > New Module, select 2198-Sxxx / Dxxx-ERS3 (or -ERS4). In the Power tab set Bus Configuration to Shared DC and assign the same Bus Sharing Group as the power supply.", "screen": "New Module; Module Properties > Power tab", "parameter": "Bus Configuration; Bus Sharing Group", "value": "Shared DC", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Create the axis: Module Properties > Associated Axes tab > New Axis (AXIS_CIP_DRIVE is the default data type). Then configure Axis Properties: General, Motor (select the catalog motor), Scaling, Load, Actions, Exceptions, Parameter List.", "screen": "Module Properties > Associated Axes tab; Axis Properties", "parameter": "AXIS_CIP_DRIVE", "value": "New Axis", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Create the Motion Group: right-click Motion Groups > New Motion Group. In Properties > Axis Assignment tab move the axis from Unassigned to Assigned, then set the Attribute tab.", "screen": "Motion Groups > New Motion Group; Axis Assignment tab", "parameter": "Axis Assignment", "value": "Unassigned -> Assigned", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Download the program and apply power. Verify the MOD and NET indicators and the axis state on the drive display (STANDBY, CONNECTING, CONFIGURING, SYNCING, PRECHARGE, RUNNING). The display shows the DC bus voltage, for example 680.0 V at 480 V input.", "screen": "Drive LCD display, Home screen", "parameter": "Axis state; DC bus voltage", "value": "RUNNING; e.g. DC BUS: 680.0V", "source": "2198-UM002D-EN-P Ch6"}], "commissioning": ["Verify mounting: modules zero-stacked with the tab and cutout aligned, ground screw installed for grounded (wye) power or removed for ungrounded / high-impedance grounded power.", "Verify wiring: IPD and CED on the DC-bus power supply, CP 24V control power present, DC bus and shunt connectors seated, motor power/brake and feedback cables correct.", "Verify the IP address on the LCD (factory 192.168.1.1) and that the controller time synchronization is enabled.", "Remove the load from every axis before running hookup tests (uncontrolled motion and brake release are possible).", "Run Hookup Tests in Axis Properties: enter the Test Distance (units from the Scaling tab), then run Marker (manual shaft rotation, marker detection), Commutation (third-party / custom PM motors with TTL-with-Hall or Sine-Cosine-with-Hall encoders not in the Motion Database), Motor Feedback (manual rotation, verify feedback wiring), and Motor and Feedback (drive rotates the motor; needs full bus power; run Motor Feedback first).", "On each test: Start, wait for Test State Executing to become Passed, confirm the forward direction Yes, then Accept Test Results. The LCD shows TESTING, for example DC BUS: 680.0V.", "On a hookup failure, verify the DC bus voltage, the Scaling values, and the motor power and feedback wiring.", "Run the load-observer tuning or autotune, enable the drive with MSO then MSF for a few seconds, and listen for squealing before putting the machine into service.", "Verify there are no active faults on the display (FLT Sxx) or in Logix Designer, and verify the STO function."], "tuning": "PM motors use the load observer. In the Autotune tab set Application Type to Custom, Loop Response to Medium, Load Coupling to Rigid, with only Velocity Feedforward checked. In the Load tab check Use Load Ratio and set Load Ratio to 0. In the Observer tab set Configuration to 'Load Observer with Velocity Estimate'. Click Apply, then Yes; the gains are set automatically. Enable the drive with MSO then MSF for a few seconds and listen for squealing; if it squeals, go to Axis Properties > Load > Compliance and set the Torque Notch Filter Frequency (Hz). See MOTION-AT005 Motion System Tuning Application Techniques. Induction motors: Automatic FluxUpControl is recommended; remove the load first, then reattach and repeat. In the Autotune category set Travel Limit to 50.0 and Speed to 2.0 (example values from the manual), Direction defaults to Forward Uni-directional; click Start, wait for Executing to become Success, then Accept Tuned Values; the tuned values populate the Loop and Load tables.", "faults": [{"code": "FLT S02", "meaning": "MTR COMMUTATION - illegal Hall state", "fix": "Check the Hall feedback wiring and use shielded cables; route feedback wiring away from noise sources."}, {"code": "FLT S03", "meaning": "MTR OVERSPEED FL - motor speed exceeded the factory maximum", "fix": "Check the control loop tuning."}, {"code": "FLT S10", "meaning": "INV OVERCURRENT - current exceeded the instantaneous hardware limit", "fix": "Verify the motor power wire gauge is correct for the drive."}, {"code": "FLT S16", "meaning": "GROUND CURRENT - ground current detected", "fix": "Check the motor power wiring; replace the motor if the fault persists."}, {"code": "FLT S22", "meaning": "AC POWER LOSS - AC input power lost", "fix": "Check the AC input voltage on all phases."}, {"code": "FLT S33", "meaning": "BUS UNDERVOLT FL - DC bus below the factory limit", "fix": "Monitor the AC line for glitches or line droop; check the incoming AC voltage."}, {"code": "FLT S45", "meaning": "FDBK COMM FL - motor feedback communication fault", "fix": "Check the motor feedback cable and connector."}, {"code": "FLT S47", "meaning": "FDBK DEVICE FAILURE - feedback device internal error (nn sub-codes; Hiperface sub-codes)", "fix": "Check the feedback cable continuity and the motor phasing U/V/W plus the Hiperface 15-pin connections; cycle control power; reduce shock and vibration; replace the motor if it continues."}, {"code": "FLT S49", "meaning": "BRAKE SLIP FLT - motor moved while the brake was engaged", "fix": "Check the motor brake."}, {"code": "FLT S54", "meaning": "POSN ERROR - excessive position error", "fix": "Verify the sizing of the drive and motor."}, {"code": "FLT S61", "meaning": "ENABLE INPUT - hardware enable input deactivated while the drive was enabled", "fix": "Check the drive enable input wiring."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2198-um002_-en-p.pdf", "sources": ["https://www.manualslib.com/manual/1590695/Allen-Bradley-Kinetix-5700.html (Rockwell 2198-UM002E-EN-P Feb 2018, read via ManualsLib pages 143, 205, 216)", "https://manuals.plus/m/6afe5ef81df23888629afaab5abcf709f7e5568e48ad218f6d78dc8f87228c26 (Rockwell 2198-UM002L-EN-P Oct 2021)", "https://literature.rockwellautomation.com/idc/groups/literature/documents/at/safety-at153_-en-p.pdf (SAFETY-AT153B-EN-P, Kinetix 5500/5700 integrated safety)", "Local mirror copy read 2026-11-20: .research/pdfs/um002-5700.txt (Rockwell 2198-UM002D-EN-P Nov 2016, 364 pp)"], "tbd": ["ERS4 safe-monitor function details beyond the 2198-RM001 summary (SS1/SS2/SOS/SBC/SLS/SDI/SLP behavior and configuration) - source needed: 2198-RM001E-EN-P full text", "Full 5700 fault spreadsheet beyond the verified FLT Sxx rows - source needed: 2198-RD003", "Newer manual revisions (UM002I Nov 2019, UM002Q) changes vs UM002D - source needed: 2198-UM002I-EN-P"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-6000", "category": "servo-drive", "family": "Kinetix 6000", "catalogNumbers": ["2094-AC05-MP5", "2094-AC05-M01", "2094-AC09-M02", "2094-AC16-M03", "2094-AC32-M05", "2094-BC01-MP5", "2094-BC01-M01", "2094-AMP5", "2094-AM01", "2094-AM02", "2094-AM03", "2094-AM05", "2094-BSP2", "2094-SEPM-B24-S"], "name": "Kinetix 6000 Servo Drive", "whatItIs": "The Kinetix 6000 is the original modular multi-axis sercos servo system on the Bulletin 2094 power rail, 3 to 45 kW (4 to 49 A). An Integrated Axis Module (IAM, converter plus inverter) and Axis Modules (AM, inverter only) share a DC common bus; the -S suffix means the module has Safe Torque Off. The 6000M IDM system uses the IPIM 2094-SEPM-B24-S (400V-class, 15 kW, 24 A rms) driving up to 16 IDM units.", "whenToUse": "Legacy sercos machines only. The migration target is the Kinetix 5700 (migration guide 2198-AP007). Do not specify the 6000 for new designs.", "selection": "IAM 200V: 2094-AC05-MP5 3 kW converter / 5 A inverter; AC05-M01 3 kW / 9 A; AC09-M02 6 kW / 15 A; AC16-M03 11 kW / 24 A; AC32-M05 23 kW / 49 A. IAM 400V: BC01-MP5 6 kW / 4 A; BC01-M01 6 kW / 9 A; BC02-M02, BC04-M03, BC07-M05 (ratings to be verified in KNX-TD005). AM modules: 2094-AMP5, AM01, AM02, AM03, AM05, BMP5 and others. Shunt module 2094-BSP2; slot filler 2094-PRF; IPIM 2094-SEPM-B24-S.", "wiring": {"power": "Three-phase AC to the IAM converter; separate AC control power to the IAM; DC common bus to the AM modules; DC-bus fuses per the common-bus rules (both lines between the DC bus terminal block and each follower IAM when wiring to more than one follower).", "feedback": "Motor feedback via the MF connector on the control module (Hiperface, TTL incremental, sine/cosine per the 2094 family); auxiliary feedback via the auxiliary feedback connector.", "safety": "Modules with the -S suffix include Safe Torque Off; see the 2094 safety reference manuals.", "network": "sercos only, via 1756-M03SE / M08SE / M16SE, 1768-M04SE, 1784-PM16SE modules; fiber-optic sercos cables (Bulletin 2090)."}, "configuration": [{"step": "Set the base node address with the sercos Node Address switch (01-99, most significant digit left, least significant digit right, +/- switches). Cycle control power; the address takes effect only after initialization. Node addresses begin at the IAM and increment left to right, and must be unique per IAM on the same sercos module.", "screen": "IAM Node Address switch", "parameter": "Base node address", "value": "01-99, unique per IAM", "source": "2094-UM001A-EN-P Ch6"}, {"step": "Set the sercos baud rate with DIP switches 2 and 3 (4 or 8 Mbps). Set the optical power High with DIP switch 1. The 6000M IDM supports only 8 Mbps (hardwired).", "screen": "Control module DIP switches 1, 2, 3", "parameter": "sercos baud rate; optical power", "value": "4 or 8 Mbps; High", "source": "2094-UM001A-EN-P Ch6"}, {"step": "Add the sercos module in RSLogix 5000: 1756-M03SE up to 3 axes, 1756-M08SE up to 8 axes, 1756-M16SE / 1784-PM16SE up to 16 axes, 1768-M04SE up to 4 axes.", "screen": "RSLogix 5000, I/O Configuration > New Module", "parameter": "sercos module", "value": "Per axis count", "source": "2094-UM001A-EN-P Ch6"}, {"step": "Configure the IAM and AM modules and the control modules in RSLogix 5000.", "screen": "RSLogix 5000, module configuration", "parameter": "IAM / AM / control module", "value": "Per hardware", "source": "2094-UM001A-EN-P Ch6"}, {"step": "Configure the Motion Group and the axis properties for motor feedback.", "screen": "Motion Groups; Axis Properties", "parameter": "Axis properties", "value": "Per motor", "source": "2094-UM001A-EN-P Ch6"}, {"step": "Run the Hookup test in RSLogix 5000 to verify the motor and feedback wiring (a motor or feedback malfunction produces E65).", "screen": "Axis Properties > Hookup Tests", "parameter": "Hookup test", "value": "Passed", "source": "2094-UM001A-EN-P Ch6/Ch8"}, {"step": "Run the Autotune procedure in RSLogix 5000 (an autotune failure produces E66).", "screen": "Axis Properties > Autotune", "parameter": "Autotune", "value": "Success", "source": "2094-UM001A-EN-P Ch6/Ch8"}], "commissioning": ["Verify control power is applied to the IAM and the ground jumper position matches the power type.", "Verify each IAM base node address is unique on its sercos module and takes effect after a control-power cycle.", "Verify the sercos fiber-optic cables are plugged in and the baud-rate DIP switches match the module configuration.", "Verify DC-bus fuses for common-bus followers.", "Run the Hookup test in RSLogix 5000, then the Autotune procedure.", "Check the seven-segment display: it shows E plus a two-digit code, flashing one digit at a time until cleared."], "tuning": "Autotune in RSLogix 5000; the load observer technique is described in MOTION-AT005 Motion System Tuning Application Techniques (verify the 6000-specific coverage in 2094-UM001 before relying on it).", "faults": [{"code": "E00", "meaning": "Blown fuse - a fuse was detected on the inverter PCB", "fix": "Return the module."}, {"code": "E04", "meaning": "Motor Overtemp - motor thermal switch tripped", "fix": "Operate within the continuous torque rating; ambient 40 C maximum; lower the ambient temperature or increase cooling."}, {"code": "E05", "meaning": "IPM Fault / Power Fault - overcurrent in the inverter power stage", "fix": "SHUTDOWN; check the motor and power wiring, then replace the module if the fault remains."}, {"code": "E07", "meaning": "Motor Feedback Loss - feedback wiring open, shorted, or missing", "fix": "Run the Hookup test in RSLogix 5000; check the motor encoder wiring."}, {"code": "E10", "meaning": "Bus Overvoltage - DC bus voltage too high", "fix": "Install a shunt module."}, {"code": "E11", "meaning": "Motor Feedback Fault / MotFeedbackFault - Hall state fault", "fix": "Check for bad connections; check the motor wiring at the MF connector."}, {"code": "E34", "meaning": "GroundShortFault - internal ground short", "fix": "Internal problem; if it remains, return the drive."}, {"code": "E43", "meaning": "Missing Drive Enable Input - active whenever the drive is enabled", "fix": "Check the drive enable input wiri
