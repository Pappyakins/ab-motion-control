sources": ["https://www.manualsdir.com/manuals/577088/rockwell-automation-20b-powerflex-700-ac-drives-vector-control-v4001-and-up.html?page=88", "https://www.manualsdir.com/manuals/580976/rockwell-automation-20b-powerflex-70-_-700-parameters-frn-3xx-20a-powerflex-70-_-700-parameters-frn-3xx.html?page=25", "https://4ind-hub.s3.amazonaws.com/prod/sku/20bc260a0aynanc0-651ecfea6b7cf384398325.pdf", "https://manualzilla.com/doc/5636642/powerflex-700-user-manual---columbia-electric-supply-pasco", "https://www.manualslib.com/manual/2497157/Rockwell-Automation-Allen-Bradley-Powerflex-700-Series.html?page=53", "https://manualzilla.com/doc/5773183/allen-bradley-powerflex-700-user-manual (Manualzilla mirror, 20B-UM002D-EN-P)", "https://manuals.plus/m/bb6d1422b36850fb2321598f22fd0f06a328fc250ab173951dbf5f7a48702557.pdf (manuals.plus mirror, PFLEX-AP005B-EN-P)", "http://assetcloud.roccommerce.net/files/_smcelectric/6/8/10/allen_bradley_20bb028a3aynbnc0_manual.pdf (distributor mirror, 20B-IN019E-EN-P)"], "tbd": [], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-753", "category": "vfd", "family": "PowerFlex 753", "catalogNumbers": ["20F11ND065JA0NNNNN"], "name": "PowerFlex 753 AC Drive", "whatItIs": "The general-purpose drive in Rockwell's PowerFlex 750-series (bulletin 20F) and the seed component 20F11ND065JA0NNNNN: 50 Hp normal duty / 40 Hp heavy duty, 480V 3-phase, 65 A output, Frame 4, open type, with embedded I/O, a DC link choke and a dynamic-braking transistor. It covers 0.75 to 270 kW (1 to 400 Hp) in wall-mount Frames 1-7, with three option slots plus built-in I/O for feedback, safety and communication cards.", "whenToUse": "Pick the 753 over the 525 when power exceeds 30 Hp, or when the job needs built-in I/O, PID process control, encoder feedback, Safe Torque-Off via an option card, or DeviceLogix. Pick the 755 over the 753 when you need dual-port embedded EtherNet/IP with DLR, five option slots, Integrated Motion on EtherNet/IP, Safe Speed Monitor, permanent-magnet motor control in open loop, or power above 400 Hp / 270 kW. Pick the 525 for small standalone machines where the 753 is oversized.", "selection": "Size by motor FLA against the drive rated output amps in 750-TD001, choosing Normal Duty or Heavy Duty to suit the load (the seed drive is 65 A, 50 Hp ND / 40 Hp HD). Voltage classes: 240V, 400V, 480V, 600V and 690V AC. Frames 1-5 are IP20 NEMA/UL Type 1 wall mount; Frames 6-7 are IP00 open wall mount (convertible to IP20 Type 1 with kit 20-750-NEMA1-Fx). A DC link choke is included on all frames; the internal brake transistor is standard on Frames 1-5 and optional on Frames 6-7. Select fuses and circuit breakers from the 750-TD001 tables.", "wiring": {"power": "Three-phase input to R/L1, S/L2, T/L3; motor to U/T1, V/T2, W/T3; DC+ and DC- bus terminals; PE ground. DC link choke is built in on all frames. Internal brake transistor is standard on Frames 1-5, optional on Frames 6-7; connect an external brake resistor only when the transistor is fitted.", "feedback": "Closed-loop and permanent-magnet control need a feedback device fitted in an option slot. For the 753, a feedback device must be used for PM flux vector control; open-loop PM flux vector is a 755-only feature. Speed feedback is read as P3 [Mtr Vel Fdbk]; check it against P2 [Commanded SpdRef] when diagnosing a speed error.", "safety": "Safe Torque-Off is available as an option module, catalog 20-750-S3, as a hardwired or networked (CIP Safety) solution certified SIL 3, PLe, Cat 3. The STO function reaction time is 15 ms maximum. See 750-UM004 for the STO wiring, timing diagrams and verification.", "network": "No embedded EtherNet/IP on the 753: fit the 20-750-ENETR dual-port EtherNet/IP option module (Adapter mode is the default and supports star, linear or Device Level Ring topologies). Automatic Device Configuration (ADC) lets a Logix controller detect a replaced drive and download all configuration parameters automatically. Other option modules: 20-750-DNET (DeviceNet), 20-750-CNETC (ControlNet), 20-750-PBUS (PROFIBUS DP), 20-750-PNET2P (PROFINET)."}, "configuration": [{"step": "Enter motor nameplate volts", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P25 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "750-PM001Q parameter list"}, {"step": "Enter motor nameplate amps, hertz, RPM and power", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P26 [Motor NP Amps] / P27 [Motor NP Hertz] / P28 [Motor NP RPM] / P30 [Motor NP Power]", "value": "Copy all four from the motor nameplate", "source": "750-PM001Q parameter list"}, {"step": "Set motor control mode", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P35 [Motor Ctrl Mode]", "value": "V/Hz, sensorless vector or flux vector to suit the application; PM flux vector on the 753 needs a feedback device", "source": "750-PM001Q; 750-UM001C"}, {"step": "Set maximum frequency and voltage", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P36 [Maximum Voltage] / P37 [Maximum Freq]", "value": "P37 limits the top speed; check P520 [Max Fwd Speed] and P521 [Max Rev Speed] agree with it", "source": "750-PM001Q; 750-IN001C"}, {"step": "Run autotune", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P70 [Autotune] / P71 [Autotune Torque]", "value": "Static Tune (motor still) or Rotate Tune (motor spins, uncoupled if possible)", "source": "750-PM001Q; 750-IN001C"}, {"step": "Set accel and decel times", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P535 [Accel Time 1] / P537 [Decel Time 1]", "value": "Ramp times in seconds; lengthen if the drive hits current limit or overvoltage on stopping", "source": "750-IN001C; PFLEX-AP005A"}, {"step": "Select the speed reference source", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P545 [Spd Ref A Sel]", "value": "Main speed reference source in Auto mode; P550 [Spd Ref B Sel] is the alternate, switched by digital input P173-P175 [DI Speed Sel]", "source": "750-PM001J"}, {"step": "Assign start/stop digital inputs", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P158 [DI Stop] / P161 [DI Start] / P162 [DI Fwd Reverse]", "value": "Wire 3-wire control to the assigned inputs, or use P163 [DI Run] / P164 [DI Run Forward] for 2-wire control", "source": "750-PM001Q; PFLEX-AP005A"}, {"step": "Set the stop mode for Stop Source A", "screen": "Drive Port 0 Parameters", "parameter": "P370 [Stop Mode A]", "value": "1 = Ramp (default); 0 = Coast, 2 = Ramp to Hold, 3 = DC Brake, 4 = DCBrkAutoOff, 5 = Current Lmt, 6 = Fast Brake", "source": "750-PM001 Ch3"}, {"step": "Set the stop mode for Stop Source B", "screen": "Drive Port 0 Parameters", "parameter": "P371 [Stop Mode B]", "value": "1 = Ramp (default); 0 = Coast, 2 = Ramp to Hold, 3 = DC Brake, 4 = DCBrkAutoOff, 5 = Current Lmt, 6 = Fast Brake", "source": "750-PM001 Ch3"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; confirm the supply voltage matches the drive voltage class.", "Confirm fuses/breaker per 750-TD001 and that the DC link choke and PE ground are in place.", "Check motor leads on U/T1, V/T2, W/T3 and that any feedback, safety and network option modules are seated in the correct slots.", "Enter the motor nameplate data (P25-P31) before the first run; do not trust defaults.", "Run P70 autotune (Static Tune first; Rotate Tune uncoupled if the application allows).", "Jog the motor at low speed, check rotation and that P3 [Mtr Vel Fdbk] follows P2 [Commanded SpdRef].", "Run up to full speed, compare P7 [Output Current] with P26 [Motor NP Amps], and confirm the PLC can start/stop the drive over the network.", "Verify ADC: the Logix controller should hold the drive configuration so a swapped drive is reconfigured automatically."], "tuning": "Autotune is P70 [Autotune] with P71 [Autotune Torque]; it sets P73 [IR Voltage Drop], P74 [Ixo Voltage Drop], P75 [Flux Current Ref] and P76 [Total Inertia] (with P77 [Inertia Test Lmt]). Static Tune measures the motor without spinning it; Rotate Tune spins the motor and gives the better result, so run it uncoupled where the machine allows. If motor data was entered wrong or autotune was not run, the drive will not accelerate to commanded speed or motor operation will be unstable - correct the nameplate data and re-run the tune. For flux vector work, P35 [Motor Ctrl Mode] must match the feedback fitted.", "faults": [{"code": "2", "meaning": "Auxiliary Input: an auxiliary input interlock is open.", "fix": "Check the auxiliary input wiring and the digital input assigned in P157 [DI Aux Fault]."}, {"code": "3", "meaning": "Power Loss: the DC bus voltage stayed below the power-loss level for longer than the programmed time.", "fix": "Check parameters P449, P451, P454 and P455; examine the incoming voltage source and supply."}, {"code": "4", "meaning": "UnderVoltage: DC bus voltage fell below the value set in P461 [UnderVltg Level].", "fix": "Check parameters P460 and P461; examine the incoming voltage source."}, {"code": "5", "meaning": "OverVoltage: the DC bus voltage exceeded the maximum value.", "fix": "Monitor P11 [DC Bus Volts]; check for high line voltage, transients or regenerative load; extend decel time or fit dynamic braking."}, {"code": "7", "meaning": "Motor Overload: an internal electronic overload trip occurred.", "fix": "Check P410 [Motor OL Actn]; check P7 [Output Current], P26 [Motor NP Amps], P413 [Mtr OL Factor] and P414 [Mtr OL Hertz]; reduce the load."}, {"code": "8", "meaning": "Heatsink OvrTemp: heatsink temperature exceeded 100% of the drive temperature (115-120 C).", "fix": "Check cooling airflow and ambient temperature; check P943 [Drive Temp Pct] and P944 [Drive Temp C]; clean heatsink fins."}, {"code": "12", "meaning": "HW OverCurrent: drive output current exceeded the hardware current limit.", "fix": "Examine the current limiters and the load; check for a shorted motor or wiring fault."}, {"code": "13", "meaning": "Ground Fault: a current path to earth ground greater than 25% of the drive rating.", "fix": "Inspect grounding and the motor and drive output wiring for a grounded condition."}, {"code": "9", "meaning": "Trnsistr OvrTemp: The output transistors have exceeded the maximum operating temperature.", "fix": "Check P941 [IGBT Temp Pct] and P942 [IGBT Temp C]; if using the drive on a chiller plate, set P38 [PWM Frequency] to 2 kHz."}, {"code": "17", "meaning": "Input Phase Loss: The DC bus ripple has exceeded a preset level.", "fix": "Check input impedance balance. Increase the setting of P463 [InPhase Loss Lvl] to make the drive less sensitive. Tune the bus regulator or speed regulator to mitigate the effects of dynamic cyclic loads on DC bus ripple. Disable the fault by setting P462 [InPhase LossActn] to 0 'Ignore' and use an external phase loss detector such as a Bulletin 809S relay."}, {"code": "21", "meaning": "Output PhaseLoss: The current in one or more phases has been lost or remains below the threshold set in P445 [Out PhaseLossLvl] for 1 second. Decreasing the threshold makes the drive less sensitive to tripping. A decreased threshold is necessary when the motor is smaller than the drive rating.", "fix": "If TorqProve is active, check for an open output contactor and increase P44 [Flux Up Time]; if the brake is slipping, check the brake. If a PM motor is used and motor phase is lost, lower P445 [OutPhaseLossLvl] to 0 if TorqProve is not used or the drive output (motor) contacts are not used."}, {"code": "24", "meaning": "Decel Inhibit: The drive is not following a commanded deceleration because it is attempting to limit the bus voltage.", "fix": "See the Bus Regulation section in 750-RM002. For high inertia loads, set P621 [Slip RPM at FLA] to 0 (V/Hz and SVC modes only)."}, {"code": "35", "meaning": "IPM OverCurrent: The current magnitude has exceeded the trip level set by P1640 [IPM Max Cur].", "fix": "Check P1640 [IPM Max Cur]; set this value to 0 only when the drive is set to the V/Hz or SVC mode."}, {"code": "38", "meaning": "Phase U to Grnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "39", "meaning": "Phase V to Grnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "40", "meaning": "Phase W to Grnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "41", "meaning": "Phase UV Short: Excessive current has been detected between these two output terminals.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "42", "meaning": "Phase VW Short: Excessive current has been detected between these two output terminals.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "43", "meaning": "Phase WU Short: Excessive current has been detected between these two output terminals.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "44", "meaning": "Phase UNegToGrnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "45", "meaning": "Phase VNegToGrnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "46", "meaning": "Phase WNegToGrnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "55", "meaning": "Ctrl Bd Overtemp: The temperature sensor on the main control board detected excessive heat.", "fix": "Check the main control board temperature against the product temperature requirement."}, {"code": "64", "meaning": "Drive OverLoad: P940 [Drive OL Count] has exceeded 100%.", "fix": "Reduce the mechanical load on the drive."}, {"code": "71", "meaning": "Port 1 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "72", "meaning": "Port 2 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "73", "meaning": "Port 3 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "74", "meaning": "Port 4 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "75", "meaning": "Port 5 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "76", "meaning": "Port 6 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "77", "meaning": "IR Volts Range: The value for P73 [IR Voltage Drop] is not within the range of acceptable values, as determined by the Calculated or Static/Rotate Autotune procedure.", "fix": "Check the motor nameplate data against parameters P25 [Motor NP Volts] through P30 [Motor NP Power]."}, {"code": "78", "meaning": "FluxAmpsRef Rang: The value for flux amps exceeds the value programmed in P26 [Motor NP Amps], as calculated or measured by the Autotune procedure.", "fix": "Check motor nameplate data against parameters P25 [Motor NP Volts] through P30 [Motor NP Power]."}, {"code": "81", "meaning": "Port 1 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "82", "meaning": "Port 2 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "83", "meaning": "Port 3 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "84", "meaning": "Port 4 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "85", "meaning": "Port 5 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "86", "meaning": "Port 6 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "91", "meaning": "Pri VelFdbk Loss: A Feedback Loss has been detected for the source of P127 [Pri Vel Fdbk]. The feedback loss could be due to a problem detected by the feedback option module selected by P125 [Pri Vel Fdbk Sel] or due to a loss in communication between the feedback option module and main control board.", "fix": "Check the feedback option module selected by P125 [Pri Vel Fdbk Sel] and its communication with the main control board. Configure the feedback source not to fault if the feedback loss switchover feature is used."}, {"code": "94", "meaning": "Alt VelFdbk Loss: A Feedback Loss has been detected for the source of P128 [Alt Vel Fdbk]. The feedback loss could be due to a problem detected by the feedback option module selected by P128 [Alt Vel Fdbk Sel] or due to a loss in communication between the feedback option module and main control board.", "fix": "Check the feedback option module selected by P128 [Alt Vel Fdbk Sel] and its communication with the main control board."}, {"code": "95", "meaning": "Aux VelFdbk Loss: A Feedback Loss has been detected for the source of P132 [Aux Vel Fdbk]. The feedback loss could be due to a problem detected by the feedback option module selected by P132 [Aux Vel Fdbk Sel] or due to a loss in communication between the feedback option module and main control board.", "fix": "Check the feedback option module selected by P132 [Aux Vel Fdbk Sel] and its communication with the main control board."}, {"code": "96", "meaning": "PositionFdbkLoss: A Feedback Loss has been detected for P847 [Psn Fdbk]. The feedback loss could be due to a problem detected by the feedback option module selected by P135 [Mtr Psn Fdbk Sel] or due to a loss in communication between the feedback option module and main control board.", "fix": "Check the feedback option module selected by P135 [Mtr Psn Fdbk Sel] and its communication with the main control board."}, {"code": "101", "meaning": "PwrDn NVS Blank: Internal data error.", "fix": "Reset parameter defaults. See publication 20HIM-UM001 for instructions. Reload parameters. If problem persists, replace main control board."}, {"code": "106", "meaning": "Incompat MCBPB: The main control board did not recognize the power structure.", "fix": "Flash with newer Application revision."}, {"code": "108", "meaning": "Anlg Cal Chksum: The checksum read from the analog calibration data does not match the checksum calculated.", "fix": "Replace main control board."}, {"code": "110", "meaning": "Ivld Pwr Bd Data: Power structure data invalid.", "fix": "Verify ribbon cable connection between the main control board and the power interface board. Replace power interface board."}, {"code": "111", "meaning": "PwrBd Invalid ID: Power structure ID invalid.", "fix": "Verify ribbon cable connection between the main control board and the power interface board. Replace power interface board."}, {"code": "112", "meaning": "PwrBd App MinVer: Power structure needs newer Application revision.", "fix": "Flash with newer Application revision."}, {"code": "124", "meaning": "App ID Changed: Application Firmware changed.", "fix": "Verify Application revision."}, {"code": "125", "meaning": "Using Backup App: Application did not flash correctly.", "fix": "Reflash."}, {"code": "168", "meaning": "HeatSinkUnderTmp: Heatsink temperature sensor is reporting a value below -18.7 C (-1.66 F) or the sensor feedback circuit is open.", "fix": "Check P943 [Drive Temp Pct] and/or P944 [Drive Temp C]."}, {"code": "175", "meaning": "Travel Lim Cflct: Travel limits are in conflict. Both the forward and reverse travel limits indicate that they are simultaneously active.", "fix": "If digital limits (hardware signals) are in use, ensure that the forward and reverse digital input pairs are not both off simultaneously: fwd/rev decel travel limit digital inputs and fwd/rev end stop travel limit digital inputs. The travel limit digital inputs are meant to be connected to normally closed switch contacts. A possible cause is loss of common power to both the forward and reverse travel limit switches. If software travel limits are in use, check the fwd/rev travel limit bits in P1101 [Trq Prove Setup]; Bit 2 'Decel Fwd' and Bit 4 'Decel Rev' should not be on simultaneously, nor Bit 3 'End Stop Fwd' and Bit 5 'End Stop Rev'."}, {"code": "181", "meaning": "Fwd End Limit: The selected digital input for the end limit switch, P196 [DI Fwd End Limit], has detected a falling edge and P313 [Actv SpTqPs Mode] is not set to 1 'Speed Reg'.", "fix": "Ensure that the digital inputs are connected to normally closed contacts. When the end limit is reached the contacts open."}, {"code": "182", "meaning": "Rev End Limit: The selected digital input for the end limit switch, P198 [DI Rev End Limit], has detected a falling edge and P313 [Actv SpTqPs Mode] is not set to 1 'Speed Reg'.", "fix": "Ensure that the digital inputs are connected to normally closed contacts. When the end limit is reached the contacts open."}, {"code": "197", "meaning": "PM Offset Failed: The PM Offset test failed due to interruption of the test before completion or the motor movement failed to reach the proper amount of rotation during the test. The test is rescheduled when this fault occurs.", "fix": "If failure occurred because of movement limitations, increase the [PM OfstTst Cur]. If this solution fails to correct the problem, the load on the motor may be too large."}, {"code": "203", "meaning": "Port 13 Adapter: The embedded EtherNet/IP adapter has a fault.", "fix": "See EtherNet event queue."}, {"code": "210", "meaning": "HW Enbl Jmpr Out: A Safety Option module is present and ENABLE Jumper is removed. This fault occurs only on frames 1...7.", "fix": "Install the jumper."}, {"code": "211", "meaning": "Safety Brd Fault: A Safety option module has indicated a fault.", "fix": "Verify that ENABLE Jumper is installed. Reset or power cycle drive. Safe Speed Monitor (20-750-S1): see P67 [Fault Status] and publication 750-RM001. Safe Torque Off (20-750-S): if DC power drops below 17V DC 'Not Enable' is indicated; if voltage drops below 11V DC the module faults; see publication 750-UM002. ATEX (20-750-ATEX): possible hardware damage; the motor thermal sensor is shorted; excessive EMC noise due to improper grounding/shielding; see publication 750-UM003."}, {"code": "212", "meaning": "Safety Jmpr Out: SAFETY Jumper is not installed and a Safety option module is not present.", "fix": "Install the jumper."}, {"code": "213", "meaning": "Safety Jumper In: SAFETY Jumper is installed and a Safety option module is present.", "fix": "Remove the jumper."}, {"code": "224", "meaning": "Port 4 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "225", "meaning": "Port 5 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "226", "meaning": "Port 6 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "227", "meaning": "Port 7 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "228", "meaning": "Port 8 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "229", "meaning": "Port 9 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "230", "meaning": "Port 10 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "231", "meaning": "Port 11 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "232", "meaning": "Port 12 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "233", "meaning": "Port 13 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "234", "meaning": "Port 14 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "291", "meaning": "HSFan Life: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "292", "meaning": "InFan Life: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "293", "meaning": "MtrBrng Life: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "294", "meaning": "MtrBrng Lube: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "295", "meaning": "MachBrng Life: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "296", "meaning": "MachBrng Lube: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "307", "meaning": "Port7InvalidCard: Option not valid in that port.", "fix": "Remove option module."}, {"code": "308", "meaning": "Port8InvalidCard: Option not valid in that port.", "fix": "Remove option module."}, {"code": "360", "meaning": "N-1 See Manual: The number of active inverters has been reduced from the original parallel configuration.", "fix": "See N-1 and Re-Rate Functions on page 348."}, {"code": "361", "meaning": "Rerate See Manual: The drive rating has changed from the original parallel configuration.", "fix": "See N-1 and Re-Rate Functions on page 348."}, {"code": "900", "meaning": "Critical input exception.", "fix": "Contact technical support."}, {"code": "901", "meaning": "Machine Check: Internal error.", "fix": "Replace the main control board."}, {"code": "902", "meaning": "Data Storage Error: Cache memory corrupt.", "fix": "Replace the main control board."}, {"code": "903", "meaning": "Instruction Storage Error: Cache memory corrupt.", "fix": "Replace the main control board."}, {"code": "905", "meaning": "Alignment Error: Pointer is pointing to a non-boundary member.", "fix": "Obtain test points and check grounding."}, {"code": "906", "meaning": "Program Error: Bad memory read.", "fix": "Check grounding or replace the main control board."}, {"code": "907", "meaning": "Floating Point Unit Not On: Firmware issue.", "fix": "Obtain test points."}, {"code": "909", "meaning": "Aux Processor Not On: Auxiliary processor interrupt.", "fix": "Contact technical support."}, {"code": "912", "meaning": "Watchdog: The timer counted down, reached 0, and fault occurred.", "fix": "Replace the main control board."}, {"code": "913", "meaning": "Data TLB Error: Processor attempted to access non-boundary memory.", "fix": "Check grounding or replace the main control board."}, {"code": "914", "meaning": "Instruction TLB Error: Processor attempted to access non-boundary memory.", "fix": "Check grounding or replace the main control board."}, {"code": "916", "meaning": "FPGA Failed to Load: MCB failed to load on powerup.", "fix": "Replace the main control board."}, {"code": "917", "meaning": "FPGA CRC Failure: FPGA CRC failure.", "fix": "Change fault configuration (753). Replace the main control board."}, {"code": "918", "meaning": "Control Task Overrun: Carrier frequency changes when passing through 7 Hz.", "fix": "In P40 [Mtr Option Cfg], set the PWM to 2 kHz or turn on the 'PWM FreqLock' Bit 9. Or flash the drive to 8.001."}, {"code": "919", "meaning": "System Task Overrun: The control task not finished and being told to run again.", "fix": "If fault does not clear, replace the main control board."}, {"code": "920", "meaning": "5 mSec Task Overrun: The control task not finished and being told to run again.", "fix": "If fault does not clear, replace the main control board."}, {"code": "921", "meaning": "Control Task Stall: Control task stalled.", "fix": "Check grounding or replace the main control board."}, {"code": "922", "meaning": "System Task Stall: System task stalled.", "fix": "Check grounding or replace the main control board."}, {"code": "923", "meaning": "5 mSec Task Stall: 5 msec task stalled.", "fix": "Check grounding or replace the main control board."}, {"code": "924", "meaning": "Background Task Stall: Background task stalled.", "fix": "Check grounding or replace the main control board."}, {"code": "925", "meaning": "Stack Overflow: Firmware overflow.", "fix": "Obtain test points."}, {"code": "926", "meaning": "Ethernet Error: Ethernet error.", "fix": "Contact technical support."}, {"code": "927", "meaning": "CIP Motion Error: Integrated motion error.", "fix": "Contact technical support."}, {"code": "14037", "meaning": "Net IO Timeout: DeviceLogix has been disabled.", "fix": "Re-enable DeviceLogix; check parameter 52 [DLX Prog Cond]."}], "manualUrl": "https://lvmcc-pubs.rockwellautomation.com/pubs/750-PM001Q-EN-P.pdf", "sources": ["https://lvmcc-pubs.rockwellautomation.com/pubs/750-PM001Q-EN-P.pdf", "http://docs.plcexchange.net/allen-bradley/howto/750-TD001.pdf", "https://www.manualsdir.com/manuals/577755/rockwell-automation-21g-powerflex-750-series-ac-drives-programming-manual-20g-powerflex-750-series-ac-drives-programming-manual-20f-powerflex-750-series-ac-drives-programming-manual.html?page=113", "https://www.docsity.com/en/docs/powerflex-753-vfd-fault-codes/9567207/", "https://lvmcc-pubs.rockwellautomation.com/cutsheets/20F11ND065JA0NNNNN.pdf", "https://www.scribd.com/document/251539099/Manual-PowerFlex-753 (Scribd mirror, 750-UM001C-EN-P)"], "tbd": [], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-755", "category": "vfd", "family": "PowerFlex 755", "catalogNumbers": ["20G11ND5P0AA0NNNNN"], "name": "PowerFlex 755 AC Drive", "whatItIs": "The performance tier of Rockwell's PowerFlex 750-series (bulletin 20G). It covers 0.75 to 1500 kW (1 to 2000 Hp) in wall-mount Frames 1-7 and floor-mount Frames 8-10, with five option slots, embedded dual-port EtherNet/IP, FORCE vector control, sensorless vector and permanent-magnet motor control, DeviceLogix, and optional Integrated Safety and Integrated Motion on EtherNet/IP.", "whenToUse": "Pick the 755 over the 753 when you need embedded dual-port EtherNet/IP with Device Level Ring, five option slots, Integrated Motion on EtherNet/IP alongside Kinetix drives, Safe Speed Monitor, open-loop PM flux vector control, or power above 400 Hp / 270 kW. Pick the 753 for general-purpose duty up to 400 Hp where the 755's extra slots and embedded network are not needed. Pick the 755T when the job needs low harmonics, regeneration or a common DC bus.", "selection": "Size by motor FLA against the drive rated output amps in 750-TD001, Normal Duty or Heavy Duty. Voltage classes: 200-240V (0.37-132 kW), 380-480V (0.75-1400 kW), 600V (up to 1500 Hp) and 690V (7.5-1500 kW). Frames 1-5 are IP20 NEMA/UL Type 1 wall mount; Frames 6-7 are IP00 open wall mount; Frames 8-10 are floor-mount cabinets (21G adds a pre-engineered power option bay). A DC link choke is included on all frames; the internal brake transistor is standard on Frames 1-5 and optional on Frames 6-7.", "wiring": {"power": "Three-phase input to R/L1, S/L2, T/L3; motor to U/T1, V/T2, W/T3; DC+ and DC- bus terminals; PE ground. DC link choke is built in on all frames. Internal brake transistor is standard on Frames 1-5, optional on Frames 6-7. Frames 8-10 floor-mount drives include integrated AC line fuses and a roll-out design.", "feedback": "Feedback, I/O, safety and communication modules fit the five option slots. Flux vector with or without encoder; interior permanent-magnet motors are supported with and without encoder on Frames 2-7 and with encoder on Frames 8-10. Unlike the 753, the 755 allows flux vector open-loop control of PM motors. Check P3 [Mtr Vel Fdbk] against P2 [Commanded SpdRef] when diagnosing a speed error.", "safety": "Safe Torque-Off option module 20-750-S3 is available as a networked or hardwired solution, both certified SIL 3, PLe, Cat 3, with a 15 ms maximum reaction time. Safe Speed Monitor option is certified SIL 3, PLe, Cat 4 and lets you safely monitor and control the speed of the application. See 750-UM004.", "network": "Dual-port EtherNet/IP is embedded on the main control board and supports linear, star and Device Level Ring topologies. The 20-750-ENETR dual-port option module can be added; in Tap mode (755 only) its ENET3 DEVICE port transfers Integrated Motion on EtherNet/IP data to the embedded adapter. Automatic Device Configuration (ADC) downloads the full drive configuration to a replacement drive automatically."}, "configuration": [{"step": "Enter motor nameplate volts", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P25 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "750-PM001Q parameter list"}, {"step": "Enter motor nameplate amps, hertz, RPM and power", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P26 [Motor NP Amps] / P27 [Motor NP Hertz] / P28 [Motor NP RPM] / P30 [Motor NP Power]", "value": "Copy all four from the motor nameplate", "source": "750-PM001Q parameter list"}, {"step": "Set motor control mode", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P35 [Motor Ctrl Mode]", "value": "V/Hz, sensorless vector, flux vector (FORCE) or PM control; open-loop PM flux vector is allowed on the 755", "source": "750-PM001Q; 750-PM001J"}, {"step": "Set maximum frequency and voltage", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P36 [Maximum Voltage] / P37 [Maximum Freq]", "value": "P37 limits the top speed; check P520 [Max Fwd Speed] and P521 [Max Rev Speed] agree with it", "source": "750-PM001Q; 750-IN001C"}, {"step": "Run autotune", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P70 [Autotune] / P71 [Autotune Torque]", "value": "Static Tune (motor still) or Rotate Tune (motor spins, uncoupled if possible)", "source": "750-PM001Q; 750-IN001C"}, {"step": "Set accel and decel times", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P535 [Accel Time 1] / P537 [Decel Time 1]", "value": "Ramp times in seconds; lengthen if the drive hits current limit or overvoltage on stopping", "source": "750-IN001C; PFLEX-AP005A"}, {"step": "Select the speed reference source", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P545 [Spd Ref A Sel]", "value": "Main speed reference source in Auto mode; P550 [Spd Ref B Sel] is the alternate, switched by digital input P173-P175 [DI Speed Sel]", "source": "750-PM001J"}, {"step": "Assign start/stop digital inputs", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P158 [DI Stop] / P161 [DI Start] / P162 [DI Fwd Reverse]", "value": "Wire 3-wire control to the assigned inputs, or use P163 [DI Run] / P164 [DI Run Forward] for 2-wire control", "source": "750-PM001Q; PFLEX-AP005A"}, {"step": "Set the stop mode for Stop Source A", "screen": "Drive Port 0 Parameters", "parameter": "P370 [Stop Mode A]", "value": "1 = Ramp (default); 0 = Coast, 2 = Ramp to Hold, 3 = DC Brake, 4 = DCBrkAutoOff, 5 = Current Lmt, 6 = Fast Brake", "source": "750-PM001 Ch3"}, {"step": "Set the stop mode for Stop Source B", "screen": "Drive Port 0 Parameters", "parameter": "P371 [Stop Mode B]", "value": "1 = Ramp (default); 0 = Coast, 2 = Ramp to Hold, 3 = DC Brake, 4 = DCBrkAutoOff, 5 = Current Lmt, 6 = Fast Brake", "source": "750-PM001 Ch3"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; confirm the supply voltage matches the drive voltage class.", "Confirm fuses/breaker per 750-TD001 and that the DC link choke and PE ground are in place.", "Check motor leads on U/T1, V/T2, W/T3 and that feedback, safety and network option modules are seated in the correct slots.", "Enter the motor nameplate data (P25-P31) before the first run; do not trust defaults.", "Run P70 autotune (Static Tune first; Rotate Tune uncoupled if the application allows).", "Jog the motor at low speed, check rotation and that P3 [Mtr Vel Fdbk] follows P2 [Commanded SpdRef].", "Run up to full speed, compare P7 [Output Current] with P26 [Motor NP Amps], and confirm the Logix controller can start/stop the drive over the embedded EtherNet/IP port.", "Verify ADC and, where used, Integrated Motion: the drive should appear in Studio 5000 with its axis configured and the configuration stored in the controller project."], "tuning": "Autotune is P70 [Autotune] with P71 [Autotune Torque]; it sets P73 [IR Voltage Drop], P74 [Ixo Voltage Drop], P75 [Flux Current Ref] and P76 [Total Inertia] (with P77 [Inertia Test Lmt]). Static Tune measures the motor without spinning it; Rotate Tune spins the motor and gives the better result, so run it uncoupled where the machine allows. If motor data was entered wrong or autotune was not run, the drive will not accelerate to commanded speed or motor operation will be unstable - correct the nameplate data and re-run the tune. For flux vector work, P35 [Motor Ctrl Mode] must match the feedback fitted; a Type 2 alarm bit will flag an invalid combination (for example flux vector with a PM motor and open-loop feedback on a 753).", "faults": [{"code": "2", "meaning": "Auxiliary Input: an auxiliary input interlock is open.", "fix": "Check the auxiliary input wiring and the digital input assigned in P157 [DI Aux Fault]."}, {"code": "3", "meaning": "Power Loss: the DC bus voltage stayed below the power-loss level for longer than the programmed time.", "fix": "Check parameters P449, P451, P454 and P455; examine the incoming voltage source and supply."}, {"code": "4", "meaning": "UnderVoltage: DC bus voltage fell below the value set in P461 [UnderVltg Level].", "fix": "Check parameters P460 and P461; examine the incoming voltage source."}, {"code": "5", "meaning": "OverVoltage: the DC bus voltage exceeded the maximum value.", "fix": "Monitor P11 [DC Bus Volts]; check for high line voltage, transients or regenerative load; extend decel time or fit dynamic braking."}, {"code": "7", "meaning": "Motor Overload: an internal electronic overload trip occurred.", "fix": "Check P410 [Motor OL Actn]; check P7 [Output Current], P26 [Motor NP Amps], P413 [Mtr OL Factor] and P414 [Mtr OL Hertz]; reduce the load."}, {"code": "8", "meaning": "Heatsink OvrTemp: heatsink temperature exceeded 100% of the drive temperature (115-120 C).", "fix": "Check cooling airflow and ambient temperature; check P943 [Drive Temp Pct] and P944 [Drive Temp C]; clean heatsink fins."}, {"code": "12", "meaning": "HW OverCurrent: drive output current exceeded the hardware current limit.", "fix": "Examine the current limiters and the load; check for a shorted motor or wiring fault."}, {"code": "13", "meaning": "Ground Fault: a current path to earth ground greater than 25% of the drive rating.", "fix": "Inspect grounding and the motor and drive output wiring for a grounded condition."}, {"code": "9", "meaning": "Trnsistr OvrTemp: The output transistors have exceeded the maximum operating temperature.", "fix": "Check P941 [IGBT Temp Pct] and P942 [IGBT Temp C]; if using the drive on a chiller plate, set P38 [PWM Frequency] to 2 kHz."}, {"code": "17", "meaning": "Input Phase Loss: The DC bus ripple has exceeded a preset level.", "fix": "Check input impedance balance. Increase the setting of P463 [InPhase Loss Lvl] to make the drive less sensitive. Tune the bus regulator or speed regulator to mitigate the effects of dynamic cyclic loads on DC bus ripple. Disable the fault by setting P462 [InPhase LossActn] to 0 'Ignore' and use an external phase loss detector such as a Bulletin 809S relay."}, {"code": "21", "meaning": "Output PhaseLoss: The current in one or more phases has been lost or remains below the threshold set in P445 [Out PhaseLossLvl] for 1 second. Decreasing the threshold makes the drive less sensitive to tripping. A decreased threshold is necessary when the motor is smaller than the drive rating.", "fix": "If TorqProve is active, check for an open output contactor and increase P44 [Flux Up Time]; if the brake is slipping, check the brake. If a PM motor is used and motor phase is lost, lower P445 [OutPhaseLossLvl] to 0 if TorqProve is not used or the drive output (motor) contacts are not used."}, {"code": "24", "meaning": "Decel Inhibit: The drive is not following a commanded deceleration because it is attempting to limit the bus voltage.", "fix": "See the Bus Regulation section in 750-RM002. For high inertia loads, set P621 [Slip RPM at FLA] to 0 (V/Hz and SVC modes only)."}, {"code": "35", "meaning": "IPM OverCurrent: The current magnitude has exceeded the trip level set by P1640 [IPM Max Cur].", "fix": "Check P1640 [IPM Max Cur]; set this value to 0 only when the drive is set to the V/Hz or SVC mode."}, {"code": "38", "meaning": "Phase U to Grnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "39", "meaning": "Phase V to Grnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "40", "meaning": "Phase W to Grnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "41", "meaning": "Phase UV Short: Excessive current has been detected between these two output terminals.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "42", "meaning": "Phase VW Short: Excessive current has been detected between these two output terminals.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "43", "meaning": "Phase WU Short: Excessive current has been detected between these two output terminals.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "44", "meaning": "Phase UNegToGrnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "45", "meaning": "Phase VNegToGrnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "46", "meaning": "Phase WNegToGrnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Rotate U/T1, V/T2, W/T3 connections. If the problem follows the wire, suspect a field wiring problem. If no change, suspect a problem with the drive."}, {"code": "55", "meaning": "Ctrl Bd Overtemp: The temperature sensor on the main control board detected excessive heat.", "fix": "Check the main control board temperature against the product temperature requirement."}, {"code": "64", "meaning": "Drive OverLoad: P940 [Drive OL Count] has exceeded 100%.", "fix": "Reduce the mechanical load on the drive."}, {"code": "71", "meaning": "Port 1 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "72", "meaning": "Port 2 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "73", "meaning": "Port 3 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "74", "meaning": "Port 4 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "75", "meaning": "Port 5 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "76", "meaning": "Port 6 Adapter: The DPI communications option has a fault.", "fix": "See device event queue."}, {"code": "77", "meaning": "IR Volts Range: The value for P73 [IR Voltage Drop] is not within the range of acceptable values, as determined by the Calculated or Static/Rotate Autotune procedure.", "fix": "Check the motor nameplate data against parameters P25 [Motor NP Volts] through P30 [Motor NP Power]."}, {"code": "78", "meaning": "FluxAmpsRef Rang: The value for flux amps exceeds the value programmed in P26 [Motor NP Amps], as calculated or measured by the Autotune procedure.", "fix": "Check motor nameplate data against parameters P25 [Motor NP Volts] through P30 [Motor NP Power]."}, {"code": "81", "meaning": "Port 1 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "82", "meaning": "Port 2 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "83", "meaning": "Port 3 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "84", "meaning": "Port 4 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "85", "meaning": "Port 5 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "86", "meaning": "Port 6 DPI Loss: The DPI port stopped communicating.", "fix": "Check connections and drive grounding."}, {"code": "91", "meaning": "Pri VelFdbk Loss: A Feedback Loss has been detected for the source of P127 [Pri Vel Fdbk]. The feedback loss could be due to a problem detected by the feedback option module selected by P125 [Pri Vel Fdbk Sel] or due to a loss in communication between the feedback option module and main control board.", "fix": "Check the feedback option module selected by P125 [Pri Vel Fdbk Sel] and its communication with the main control board. Configure the feedback source not to fault if the feedback loss switchover feature is used."}, {"code": "94", "meaning": "Alt VelFdbk Loss: A Feedback Loss has been detected for the source of P128 [Alt Vel Fdbk]. The feedback loss could be due to a problem detected by the feedback option module selected by P128 [Alt Vel Fdbk Sel] or due to a loss in communication between the feedback option module and main control board.", "fix": "Check the feedback option module selected by P128 [Alt Vel Fdbk Sel] and its communication with the main control board."}, {"code": "95", "meaning": "Aux VelFdbk Loss: A Feedback Loss has been detected for the source of P132 [Aux Vel Fdbk]. The feedback loss could be due to a problem detected by the feedback option module selected by P132 [Aux Vel Fdbk Sel] or due to a loss in communication between the feedback option module and main control board.", "fix": "Check the feedback option module selected by P132 [Aux Vel Fdbk Sel] and its communication with the main control board."}, {"code": "96", "meaning": "PositionFdbkLoss: A Feedback Loss has been detected for P847 [Psn Fdbk]. The feedback loss could be due to a problem detected by the feedback option module selected by P135 [Mtr Psn Fdbk Sel] or due to a loss in communication between the feedback option module and main control board.", "fix": "Check the feedback option module selected by P135 [Mtr Psn Fdbk Sel] and its communication with the main control board."}, {"code": "101", "meaning": "PwrDn NVS Blank: Internal data error.", "fix": "Reset parameter defaults. See publication 20HIM-UM001 for instructions. Reload parameters. If problem persists, replace main control board."}, {"code": "106", "meaning": "Incompat MCBPB: The main control board did not recognize the power structure.", "fix": "Flash with newer Application revision."}, {"code": "108", "meaning": "Anlg Cal Chksum: The checksum read from the analog calibration data does not match the checksum calculated.", "fix": "Replace main control board."}, {"code": "110", "meaning": "Ivld Pwr Bd Data: Power structure data invalid.", "fix": "Verify ribbon cable connection between the main control board and the power interface board. Replace power interface board."}, {"code": "111", "meaning": "PwrBd Invalid ID: Power structure ID invalid.", "fix": "Verify ribbon cable connection between the main control board and the power interface board. Replace power interface board."}, {"code": "112", "meaning": "PwrBd App MinVer: Power structure needs newer Application revision.", "fix": "Flash with newer Application revision."}, {"code": "124", "meaning": "App ID Changed: Application Firmware changed.", "fix": "Verify Application revision."}, {"code": "125", "meaning": "Using Backup App: Application did not flash correctly.", "fix": "Reflash."}, {"code": "168", "meaning": "HeatSinkUnderTmp: Heatsink temperature sensor is reporting a value below -18.7 C (-1.66 F) or the sensor feedback circuit is open.", "fix": "Check P943 [Drive Temp Pct] and/or P944 [Drive Temp C]."}, {"code": "175", "meaning": "Travel Lim Cflct: Travel limits are in conflict. Both the forward and reverse travel limits indicate that they are simultaneously active.", "fix": "If digital limits (hardware signals) are in use, ensure that the forward and reverse digital input pairs are not both off simultaneously: fwd/rev decel travel limit digital inputs and fwd/rev end stop travel limit digital inputs. The travel limit digital inputs are meant to be connected to normally closed switch contacts. A possible cause is loss of common power to both the forward and reverse travel limit switches. If software travel limits are in use, check the fwd/rev travel limit bits in P1101 [Trq Prove Setup]; Bit 2 'Decel Fwd' and Bit 4 'Decel Rev' should not be on simultaneously, nor Bit 3 'End Stop Fwd' and Bit 5 'End Stop Rev'."}, {"code": "181", "meaning": "Fwd End Limit: The selected digital input for the end limit switch, P196 [DI Fwd End Limit], has detected a falling edge and P313 [Actv SpTqPs Mode] is not set to 1 'Speed Reg'.", "fix": "Ensure that the digital inputs are connected to normally closed contacts. When the end limit is reached the contacts open."}, {"code": "182", "meaning": "Rev End Limit: The selected digital input for the end limit switch, P198 [DI Rev End Limit], has detected a falling edge and P313 [Actv SpTqPs Mode] is not set to 1 'Speed Reg'.", "fix": "Ensure that the digital inputs are connected to normally closed contacts. When the end limit is reached the contacts open."}, {"code": "197", "meaning": "PM Offset Failed: The PM Offset test failed due to interruption of the test before completion or the motor movement failed to reach the proper amount of rotation during the test. The test is rescheduled when this fault occurs.", "fix": "If failure occurred because of movement limitations, increase the [PM OfstTst Cur]. If this solution fails to correct the problem, the load on the motor may be too large."}, {"code": "203", "meaning": "Port 13 Adapter: The embedded EtherNet/IP adapter has a fault.", "fix": "See EtherNet event queue."}, {"code": "210", "meaning": "HW Enbl Jmpr Out: A Safety Option module is present and ENABLE Jumper is removed. This fault occurs only on frames 1...7.", "fix": "Install the jumper."}, {"code": "211", "meaning": "Safety Brd Fault: A Safety option module has indicated a fault.", "fix": "Verify that ENABLE Jumper is installed. Reset or power cycle drive. Safe Speed Monitor (20-750-S1): see P67 [Fault Status] and publication 750-RM001. Safe Torque Off (20-750-S): if DC power drops below 17V DC 'Not Enable' is indicated; if voltage drops below 11V DC the module faults; see publication 750-UM002. ATEX (20-750-ATEX): possible hardware damage; the motor thermal sensor is shorted; excessive EMC noise due to improper grounding/shielding; see publication 750-UM003."}, {"code": "212", "meaning": "Safety Jmpr Out: SAFETY Jumper is not installed and a Safety option module is not present.", "fix": "Install the jumper."}, {"code": "213", "meaning": "Safety Jumper In: SAFETY Jumper is installed and a Safety option module is present.", "fix": "Remove the jumper."}, {"code": "224", "meaning": "Port 4 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "225", "meaning": "Port 5 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "226", "meaning": "Port 6 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "227", "meaning": "Port 7 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "228", "meaning": "Port 8 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "229", "meaning": "Port 9 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "230", "meaning": "Port 10 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "231", "meaning": "Port 11 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "232", "meaning": "Port 12 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "233", "meaning": "Port 13 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "234", "meaning": "Port 14 Comm Loss: The device at the port has stopped communicating with the main control board.", "fix": "Verify that the device is present and functional. Verify network connections. Verify options that are installed in ports 4...8 are seated in the port and secured with mounting screws."}, {"code": "291", "meaning": "HSFan Life: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "292", "meaning": "InFan Life: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "293", "meaning": "MtrBrng Life: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "294", "meaning": "MtrBrng Lube: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "295", "meaning": "MachBrng Life: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "296", "meaning": "MachBrng Lube: Predictive maintenance function has reached the event level.", "fix": "Perform maintenance."}, {"code": "307", "meaning": "Port7InvalidCard: Option not valid in that port.", "fix": "Remove option module."}, {"code": "308", "meaning": "Port8InvalidCard: Option not valid in that port.", "fix": "Remove option module."}, {"code": "360", "meaning": "N-1 See Manual: The number of active inverters has been reduced from the original parallel configuration.", "fix": "See N-1 and Re-Rate Functions on page 348."}, {"code": "361", "meaning": "Rerate See Manual: The drive rating has changed from the original parallel configuration.", "fix": "See N-1 and Re-Rate Functions on page 348."}, {"code": "900", "meaning": "Critical input exception.", "fix": "Contact technical support."}, {"code": "901", "meaning": "Machine Check: Internal error.", "fix": "Replace the main control board."}, {"code": "902", "meaning": "Data Storage Error: Cache memory corrupt.", "fix": "Replace the main control board."}, {"code": "903", "meaning": "Instruction Storage Error: Cache memory corrupt.", "fix": "Replace the main control board."}, {"code": "905", "meaning": "Alignment Error: Pointer is pointing to a non-boundary member.", "fix": "Obtain test points and check grounding."}, {"code": "906", "meaning": "Program Error: Bad memory read.", "fix": "Check grounding or replace the main control board."}, {"code": "907", "meaning": "Floating Point Unit Not On: Firmware issue.", "fix": "Obtain test points."}, {"code": "909", "meaning": "Aux Processor Not On: Auxiliary processor interrupt.", "fix": "Contact technical support."}, {"code": "912", "meaning": "Watchdog: The timer counted down, reached 0, and fault occurred.", "fix": "Replace the main control board."}, {"code": "913", "meaning": "Data TLB Error: Processor attempted to access non-boundary memory.", "fix": "Check grounding or replace the main control board."}, {"code": "914", "meaning": "Instruction TLB Error: Processor attempted to access non-boundary memory.", "fix": "Check grounding or replace the main control board."}, {"code": "916", "meaning": "FPGA Failed to Load: MCB failed to load on powerup.", "fix": "Replace the main control board."}, {"code": "917", "meaning": "FPGA CRC Failure: FPGA CRC failure.", "fix": "Change fault configuration (753). Replace the main control board."}, {"code": "918", "meaning": "Control Task Overrun: Carrier frequency changes when passing through 7 Hz.", "fix": "In P40 [Mtr Option Cfg], set the PWM to 2 kHz or turn on the 'PWM FreqLock' Bit 9. Or flash the drive to 8.001."}, {"code": "919", "meaning": "System Task Overrun: The control task not finished and being told to run again.", "fix": "If fault does not clear, replace the main control board."}, {"code": "920", "meaning": "5 mSec Task Overrun: The control task not finished and being told to run again.", "fix": "If fault does not clear, replace the main control board."}, {"code": "921", "meaning": "Control Task Stall: Control task stalled.", "fix": "Check grounding or replace the main control board."}, {"code": "922", "meaning": "System Task Stall: System task stalled.", "fix": "Check grounding or replace the main control board."}, {"code": "923", "meaning": "5 mSec Task Stall: 5 msec task stalled.", "fix": "Check grounding or replace the main control board."}, {"code": "924", "meaning": "Background Task Stall: Background task stalled.", "fix": "Check grounding or replace the main control board."}, {"code": "925", "meaning": "Stack Overflow: Firmware overflow.", "fix": "Obtain test points."}, {"code": "926", "meaning": "Ethernet Error: Ethernet error.", "fix": "Contact technical support."}, {"code": "927", "meaning": "CIP Motion Error: Integrated motion error.", "fix": "Contact technical support."}, {"code": "14037", "meaning": "Net IO Timeout: DeviceLogix has been disabled.", "fix": "Re-enable DeviceLogix; check parameter 52 [DLX Prog Cond]."}], "manualUrl": "https://lvmcc-pubs.rockwellautomation.com/pubs/750-PM001Q-EN-P.pdf", "sources": ["https://lvmcc-pubs.rockwellautomation.com/pubs/750-PM001Q-EN-P.pdf", "http://docs.plcexchange.net/allen-bradley/howto/750-TD001.pdf", "https://www.manualsdir.com/manuals/577755/rockwell-automation-21g-powerflex-750-series-ac-drives-programming-manual-20g-powerflex-750-series-ac-drives-programming-manual-20f-powerflex-750-series-ac-drives-programming-manual.html?page=113", "https://lvmcc-pubs.rockwellautomation.com/cutsheets/20G11ND5P0AA0NNNNN.pdf", "https://lvmcc-pubs.rockwellautomation.com/cutsheets/20-750-ENETR.pdf", "https://www.scribd.com/document/251539099/Manual-PowerFlex-753 (Scribd mirror, 750-UM001C-EN-P)"], "tbd": [], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-755t", "category": "vfd", "family": "PowerFlex 755T", "catalogNumbers": ["20G21ND077JA0NNNNN"], "name": "PowerFlex 755T AC Drive", "whatItIs": "The TotalFORCE generation of the PowerFlex 750-series (bulletins 20G/20J): the 755TL low-harmonic drive, the 755TR regenerative drive, the 755TM common-bus drive system, and the 755TS smart drive. An active front end replaces the standard 6-pulse rectifier, so the drive mitigates harmonics, corrects power factor, and (on TR/TM) regenerates braking energy back to the supply. TotalFORCE technology adds adaptive motor control and predictive diagnostics that track the health of drive and motor components.", "whenToUse": "Pick a 755T over a standard 755 when the site needs low harmonics (IEEE 519 compliance or a generator supply), when braking energy is large enough to regenerate instead of burning in a resistor, or when several drives should share a common DC bus. The 755TL is for low-harmonic non-regenerative duty (7.5-1400 kW / 10-1800 Hp); the 755TR is for regenerative duty (7.5-4500 kW / 10-6000 Hp); the 755TM is a predesigned common-bus system with regenerative bus supplies and common-bus inverters (160-4500 kW). Pick the standard 755 when harmonics and regeneration are not a problem and cost matters.", "selection": "Size by motor FLA against the drive rated output amps in 750-TD100, Normal Duty or Heavy Duty. The 755TS example 20G21ND077JA0NNNNN is 77 A normal duty (60 Hp) / 65 A heavy duty (50 Hp), Frame 5, IP20. Total harmonic distortion is less than 5%. The 755T is a separate platform from the standard 750-series (bulletins 20J/20M/20N) and is not covered in 750-TD001; use 750-TD100. Voltage classes 400/480/600/690V; enclosures IP21 UL Type 1 and IP54 UL Type 12.", "wiring": {"power": "The 755T is built from modules: a line-side converter draws energy from the AC line, an LCL filter provides low-harmonic capability and minimises current distortion into the utility grid, and a motor-side inverter drives the motor. A pre-charge module regulates the input AC current. One control pod per common-bus inverter and one for the regenerative bus supply; the control pod holds the control platform with I/O, safety and feedback slots. Follow the 755T installation instructions for the module layout - it is not a single-box drive like the 753/755.", "feedback": "Feedback, I/O and safety fit the control pod option slots, as on the 755. TotalFORCE control supports permanent-magnet motors and adaptive control of torque, velocity and position. Confirm the feedback device selection in 750-TD100 for the exact 755T variant.", "safety": "Integrated Safety Safe Torque-Off is available on 755T drive products; the STO function reaction time is 15 ms maximum (750-UM004 covers both 755 and 755T products). Confirm the exact safety option catalog for the 755T variant in 750-TD100.", "network": "Built-in EtherNet/IP adapter (see 750COM-UM009, PowerFlex Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual). Settings made in the drive Add-on Profile are saved in the controller project, and Automatic Device Configuration downloads them when a replaced drive or option module no longer matches. Configuration and programming are via the HIM, Studio 5000 Logix Designer, or Connected Components Workbench."}, "configuration": [{"step": "Enter motor nameplate data", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P25 [Motor NP Volts] / P26 [Motor NP Amps] / P27 [Motor NP Hertz] / P28 [Motor NP RPM] / P30 [Motor NP Power]", "value": "Copy all five from the motor nameplate", "source": "750-PM001Q parameter list (750-series family); 755T parameter set to be confirmed in 750-UM003"}, {"step": "Set motor control mode", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P35 [Motor Ctrl Mode]", "value": "TotalFORCE control mode to suit the motor type (induction or PM)", "source": "750-TD100"}, {"step": "Set maximum frequency", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P37 [Maximum Freq]", "value": "Top speed limit for the application", "source": "750-PM001Q parameter list (750-series family)"}, {"step": "Run autotune", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P70 [Autotune]", "value": "Static Tune (motor still) or Rotate Tune (motor spins, uncoupled if possible)", "source": "750-PM001Q (750-series family); 755T autotune procedure to be confirmed in 750-UM003"}, {"step": "Set accel and decel times", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P535 [Accel Time 1] / P537 [Decel Time 1]", "value": "Ramp times in seconds", "source": "750-PM001Q (750-series family)"}, {"step": "Select the speed reference source", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P545 [Spd Ref A Sel]", "value": "Main speed reference source in Auto mode", "source": "750-PM001Q (750-series family)"}, {"step": "Run the autotune routine", "screen": "Port 10 parameters", "parameter": "10:910 [Autotune]", "value": "Static Tune or Rotate Tune. Enter the motor nameplate data first. NOTE: autotune is parameter 10:910 [Autotune] (Port 10 notation), not P70.", "source": "750-PM101 Ch4"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; confirm the supply voltage matches the drive voltage class.", "Confirm the line-side converter, LCL filter, pre-charge module and motor-side inverter modules are all present and cabled per the 755T installation instructions.", "Enter the motor nameplate data before the first run; do not trust defaults.", "Run the autotune, then jog the motor at low speed and check rotation.", "Run up to full speed, compare output current with motor nameplate amps, and confirm the Logix controller can start/stop the drive over the built-in EtherNet/IP port.", "On a 755TL, confirm the harmonic performance and power factor at load; on a 755TR, confirm regeneration back to the supply during braking.", "Verify ADC: the controller project should hold the drive configuration so a swapped drive is reconfigured automatically."], "tuning": "TotalFORCE technology adapts automatically to changes in resonance frequency over time and compensates for machine characteristics that change, and it continuously monitors operation to give real-time diagnostics and remaining-life estimates for critical components. Run the autotune (same Static Tune / Rotate Tune approach as the 750-series) after entering the motor nameplate data, then let the adaptive control settle the torque and velocity loops; do not hand-tune gains the adaptive loop is managing. If the drive reports a predictive-maintenance event (for example IGBT, fan/blower, DC bus capacitor, circuit breaker, LCL capacitor or filter/airflow life), treat it as a planned-maintenance trigger, not a nuisance alarm.", "faults": [{"code": "2", "meaning": "Auxiliary Input: an auxiliary input interlock is open.", "fix": "Check the auxiliary input wiring and the digital input assigned for the aux fault."}, {"code": "4", "meaning": "UnderVoltage: DC bus voltage fell below the configured undervoltage level.", "fix": "Check the undervoltage level and action parameters; examine the incoming voltage source."}, {"code": "5", "meaning": "OverVoltage: the DC bus voltage exceeded the maximum value.", "fix": "Monitor DC bus volts; check for high line voltage, transients or regenerative load; extend decel time."}, {"code": "7", "meaning": "Motor Overload: an internal electronic overload trip occurred.", "fix": "Check the motor overload action and factor parameters; check output current against motor nameplate amps; reduce the load."}, {"code": "12", "meaning": "HW OverCurrent: drive output current exceeded the hardware current limit.", "fix": "Examine the current limiters and the load; check for a shorted motor or wiring fault."}, {"code": "13", "meaning": "Ground Fault: a current path to earth ground greater than 25% of the drive rating.", "fix": "Inspect grounding and the motor and drive output wiring for a grounded condition."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/pm/750-pm101_-en-p.pdf", "sources": ["https://gesrepair.com/wp-content/uploads/2020/Allen_Bradley_PDF/Allen-Bradley_20G1G3D960LNDNNNNN-P15-P17.pdf", "https://www.nhpnz.co.nz/public/assets/pim/Original/10044/20G21ND077JA0NNNNN-NZ-PF755TS-Variable-Speed-Drive-Datasheet.pdf", "https://media.distributordatasolutions.com/158/jsonl_allen_bradley/7c0df31ee14d77caaa2c6731227fc220ea80f184.pdf", "https://www.rockwellautomation.com/en-pl/products/hardware/vfds-variable-frequency-drives/powerflex-755t.html", "https://test.gridnet.org:444/http://literature.rockwellautomation.com/idc/groups/literature/documents/pm/750-pm101_-en-p.pdf (gridnet mirror of the Rockwell PDF, 750-PM101E-EN-P)", "https://www.scribd.com/document/713145060/750-in100-en-p (Scribd mirror, 750-IN100F-EN-P)", "https://rexel-cdn.com/Products/16F382EB-97B0-4B59-81D6-629267F9CAB7/16F382EB-97B0-4B59-81D6-629267F9CAB7.pdf (Rexel CDN mirror, 750-TD100E-EN-P)", "https://www.rockwellautomation.com/en-us/docs/technical/powerflex/powerflex-755t/_online/powerflex-755t-drives-information-ditamap/safe-stop-functional-safety.html (Rockwell Safe Stop Functional Safety page for the PowerFlex 755T)"], "tbd": ["755T-specific fault and alarm event numbers (TotalFORCE predictive events) - the six faults listed here use the 750-series event framework; confirm against the 755T user manual."], "sourceFile": "powerflex.json"}, {"id": "ab-vpf", "category": "servo-motor", "family": "Kinetix VP VPF", "catalogNumbers": ["VPF-B1303F-PJ14AF"], "name": "Kinetix VP VPF Servo Motor", "whatItIs": "The Kinetix VP VPF is the food-grade version of the VPL low-inertia servo motor. It combines the characteristics of the VPL \u2014 single-cable DSL connection to Kinetix 5500/5700 drives, windings matched to those drives \u2014 with features for food and beverage applications: food-grade epoxy coating, food-grade shaft seal, noncorrosive fasteners and a stainless steel shaft (KNX-TD001A p48). The example motor VPF-B1303F-PJ14AF is a 480 V, 130 mm frame, 3-stack motor with an 18-bit multi-turn DSL encoder, keyed shaft, single SpeedTec DIN connector, 24 V DC holding brake and food-grade shaft seal.", "whenToUse": "Pick VPF for food packaging, volumetric filling, form-fill-seal and food handling axes on a Kinetix 5500/5700 system \u2014 anywhere the motor is exposed to food, washdown splash or cleaning chemicals and a standard VPL would corrode or contaminate. Pick VPL instead for the same motion in a dry, non-food environment (same performance, lower cost, no food-grade seal to maintain). Pick MPF instead if the drive is not a 5500/5700. For meat and poultry applications Rockwell recommends the stainless-steel VPS motors instead of VPF (KNX-TD001A p48). Never pick VPF for a Kinetix 3, 6000 or 300/350 drive \u2014 VPF is compatible only with Kinetix 5500 and 5700 (KNX-TD001A p2).", "selection": "Size with FactoryTalk Motion Analyzer software and the torque/speed curves in KNX-RM009 (Kinetix 5500) and KNX-RM010 (Kinetix 5700). Check: (1) continuous stall torque against RMS torque \u2014 VPF family range 0.93 to 19 N\u00b7m continuous stall, 2.69 to 49 N\u00b7m peak stall (KNX-TD001A p48); example VPF-B1303F (400 V): 8.80 N\u00b7m continuous stall, 20.72 N\u00b7m peak stall, 2.54 kW rated output, 4000 rpm rated and maximum speed. Note the family tops out lower than VPL (33 N\u00b7m) \u2014 if the axis needs more than 19 N\u00b7m continuous, VPF is the wrong family. (2) Speed: up to 8000 rpm across the family. (3) Inertia: rotor inertia 0.00040 kg-m2 class for the 1303 frame. (4) Frames: 63, 75, 100, 115, 130 and 165 mm; 200 V (A) or 400 V (B). (5) Feedback C/P/Q/W as on VPL, including SIL 2 rated options. (6) Environmental: IP66/IP67 with shaft seal (standard) and environmentally sealed cable connector, food-grade grease on the shaft seal. A positive-air-pressure kit (VPF-AIR-PURGE) mounts on the feedback connector to reduce contamination inside the motor.", "wiring": {"power": "SINGLE CABLE, same as VPL: one 2090 single motor cable carries power, feedback and brake to the single SpeedTec DIN (M1) connector, right angle, 315 deg rotatable, one-quarter turn (KNX-TD001A p50 \u2014 note 315 deg for VPF vs 325 deg for VPL). Cable families: 2090-CSBM1DF-xxAAxx / -xxAFxx for Kinetix 5500, 2090-CSBM1DE-xxAAxx / -xxAFxx for Kinetix 5700, 2090-CSBM1DG-xxAAxx / -xxAFxx for either; 2090-CSWM1Dx are power/feedback cables without brake wires. Cables in 1.0 m increments up to 50 m (5500) / 90 m (5700).", "feedback": "Hiperface DSL encoder protocol, same as VPL (KNX-TD001A p48). Feedback options: C = 18-bit absolute single-turn (262,144 counts/rev); P = 18-bit absolute multi-turn (4096 turns); Q = 23-bit absolute multi-turn SIL 2 (PLd) rated, 12-bit secondary safety channel; W = 18-bit absolute multi-turn SIL 2 (PLd) rated, 9-bit secondary safety channel. No battery needed for multi-turn. IMPORTANT (KNX-TD001A p50): building your own cables or using third-party cable is not an option for single-cable technology.", "safety": "Safe Torque-Off lives in the drive; the motor contributes safety-rated feedback only with a Q or W SIL 2 (PLd) encoder. The optional 24 V DC brake is a HOLDING brake only (KNX-TD001A p164): hold the shaft at 0 rpm up to the rated holding torque, not for stopping rotation, not a safety device. Example VPF-B1303 brake: 14.10 N\u00b7m holding torque, 0.738-0.902 A coil current at 24 V DC. Food-grade shaft seals are wear items: inspect periodically, replacement recommended every 3 months, not to exceed 12 months (KNX-TD001A p51).", "network": "The motor has no network port. It connects by its single cable to a Kinetix 5500 drive or Kinetix 5700 dual-axis inverter, and the drive connects to the Logix controller over EtherNet/IP Integrated Motion."}, "configuration": [{"step": "Add the Kinetix 5500/5700 drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Electronic Keying", "value": "Compatible Module or Exact Match \u2014 never Disable Keying with motion modules", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Add the Kinetix 5500/5700 drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Connection", "value": "Motion", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create the axis for the drive", "screen": "Module Properties - Associated Axes tab", "parameter": "Data Type", "value": "AXIS_CIP_DRIVE (New Axis, Type Base)", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"ste
