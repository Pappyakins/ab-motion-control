t-line speed ramp - the default and the best choice for most loads. Torque Control (Torque Ramp) slowly increases motor torque over a fixed time for fragile loads. Pump Start/Pump Stop shape torque to prevent water hammer; use the shortest pump-stop time that stops the pump cleanly. Dual Ramp gives two start profiles selected by a digital input. Preset Slow Speed runs the motor at 1...15% speed forward or reverse for positioning. Smart Motor Braking (Parameter 65 = SMB, Braking Current Parameter 69, Slow Speed Parameter 72) brakes the load; Accu-Stop combines slow speed with braking for accurate positioning. Energy Saver reduces voltage at light load; it is a running mode, not a starting mode.", "faults": [{"code": "1, 2, 3", "meaning": "Line Loss (with phase indication) - missing supply phase, high-impedance connection, or unstable 3-phase voltage", "fix": "Check for an open line (blown fuse), loose line/load connections, and power quality; disable the feature only if the application requires it."}, {"code": "4, 5, 6", "meaning": "Shorted SCR (with phase indication) - shorted power module", "fix": "Check for a shorted SCR with a resistance check (Power Module Check section); replace the power module if necessary."}, {"code": "7, 8, 9", "meaning": "Open Gate (with phase indication) - open gate circuitry or loose gate lead", "fix": "Perform a resistance check; remove the control module and check gate-lead connections TB5, TB6, TB7 are firmly seated; replace the power module if necessary."}, {"code": "10 or 60", "meaning": "SCR Overtemp or PTC Power Pole overtemperature", "fix": "Check controller ventilation, duty cycle and fan operation; wait for cooling or provide external cooling; replace the power module or control module as needed."}, {"code": "21", "meaning": "Overload - motor overloaded, or overload class / motor FLC do not match the motor", "fix": "Check the overload condition, check programmed overload class and motor FLC, verify actual current draw."}, {"code": "23 / 24", "meaning": "Jam (23) - current above the programmed jam level for the programmed time; Stall (24) - motor did not reach full speed by the end of the ramp", "fix": "Correct the jam/stall source or excessive loading; check programmed settings and adjust starting parameters."}, {"code": "25", "meaning": "Phase Reversal (prestart only) - incoming supply not in the expected ABC sequence", "fix": "Check power wiring and correct the phase sequence."}, {"code": "61", "meaning": "I/O Configuration Fault - control I/O does not meet the system rules (e.g. a Start input with no Coast/Stop input)", "fix": "Modify the control I/O configuration to meet the rules in Ch. 4 Configuration Functions."}], "manualUrl": "https://dalkos.ru/upload/documents/RockwellAutomation_SMC-50.pdf", "sources": ["https://dalkos.ru/upload/documents/RockwellAutomation_SMC-50.pdf", "https://www.manualsdir.com/manuals/577736/rockwell-automation-150-sm6-smc-50-soft-starter-parameter-configuration-option-module-installation.html?page=4", "https://lvmcc-pubs.rockwellautomation.com/cutsheets/150-SB1NUD.pdf", "https://dalkos.ru/upload/documents/RockwellAutomation_SMC-50.pdf (dalkos.ru mirror of 150-UM011B-EN-P)", "https://www.manualsdir.com/manuals/577736/rockwell-automation-150-sm6-smc-50-soft-starter-parameter-configuration-option-module-installation.html (manualsdir mirror of 150-IN053B-EN-E)"], "tbd": [], "sourceFile": "starters.json"}], "modules": [{"id": "kinetix-5700-module", "title": "Kinetix 5700: from selection to running axis", "family": "Kinetix 5700", "lessons": [{"id": "kinetix-5700-l1", "title": "What the Kinetix 5700 is", "body": "The Kinetix 5700 is Rockwell's flagship multi-axis servo drive system, and the first thing to understand is that it is not one box. It is a system of modules that share a DC bus. At the left of the system sits a 2198-Pxxx DC-bus power supply, which converts three-phase AC into DC. Hanging off that bus are the inverters that actually drive the motors: single-axis inverters (2198-Sxxx) and dual-axis inverters (2198-Dxxx). The modules zero-stack, which means they slide together with no gap between them, and the shared-bus connection system carries the DC bus from one module to the next without separate bus wiring.\n\nThe range is wide: 1.6 to 60 kW. The DC-bus power supplies come in four sizes, 2198-P031 at 7 kW, 2198-P070 at 17 kW, 2198-P141 at 31 kW, and 2198-P208 at 46 kW, all fed from 400V-class three-phase input at 324 to 528V AC rms. The single-axis inverters run from 29.7 kW (2198-S086) up to 60.1 kW (2198-S160). The dual-axis inverters pack two axes into one module, from 1.7 kW per axis (2198-D006) up to 15.9 kW per axis (2198-D057, 32.5 A 0-peak, 23 A rms). There is also a capacitor module, the 2198-CAPMOD-2240, rated 2240 microfarads and 100 A maximum, for applications that need extra bus capacitance, and an iTRAK power supply, the 2198T-W25K-ER, for iTRAK track systems.\n\nThe whole system runs Integrated Motion over EtherNet/IP, which means the motion control lives in the Logix controller and the drive is a CIP Motion axis on the network, not a standalone drive with its own program. That is the key difference from the Kinetix 5100, which can run indexing on its own, and from the Kinetix 300/350 generation. If you understand that the 5700 is a shared DC bus with a separate power supply and modular inverters, everything else in this module follows naturally.", "componentIds": ["ab-kinetix-5700"]}, {"id": "kinetix-5700-l2", "title": "Picking the right modules", "body": "Selection starts with the load, and Rockwell's Motion Analyzer is the tool for it: you enter the mechanism, the move profile and the motor, and it tells you the power and current each axis needs. Once you know the per-axis power, you pick the inverters, then you pick the DC-bus power supply that can feed them all. The power supply is sized on total demand: P031 at 7 kW, P070 at 17 kW, P141 at 31 kW, P208 at 46 kW. A common mistake is to size the power supply for one axis and forget the others on the same bus; the supply feeds every inverter on its bus, so add the axes up.\n\nChoose single-axis inverters when you need big power or when each axis deserves its own module: S086 at 29.7 kW and 60.8 A 0-peak, S130 at 44.9 kW and 91.9 A 0-peak, S160 at 60.1 kW and 120.2 A 0-peak. Choose dual-axis inverters when two smaller axes can share a slot and a bus connection: D006 at 1.7 kW, D012 at 3.4 kW, D020 at 5.5 kW, D032 at 8.9 kW, and D057 at 15.9 kW per axis. A dual-axis inverter is two complete axes in one module, which saves panel space and cost on machines with several small axes.\n\nThere is one more selection concept that trips people up: bus-sharing groups. The system supports up to 25 bus-sharing groups, and all modules on the same shared bus must be in the same Bus Sharing Group. Logix Designer enforces this when you configure the system, and it is how the controller knows which inverters share a power supply and therefore which ones lose power together on a fault. If your machine has two independent power supplies, you have two bus-sharing groups. Get the grouping right in the configuration and the fault behavior makes sense; get it wrong and Logix Designer will tell you before you ever download.", "componentIds": ["ab-kinetix-5700"]}, {"id": "kinetix-5700-l3", "title": "Wiring power, feedback, and safety", "body": "Power wiring has three separate pieces, and confusing them is the most common wiring mistake on this system. First, the three-phase AC input goes into the DC-bus power supply through the IPD (AC input) connector, with the CED (contactor-enable) connector driving the line contactor. The power supply input is 400V-class, 324 to 528V AC rms. Second, the DC bus and the shunt connect through the DC bus and shunt connectors, and the bus is carried between modules by the zero-stacked shared-bus connection system. Third, the 24V DC control power, digital inputs and motor brake power come from a customer-supplied 1606-XLxxx supply into the CP connector. The 24V supply is yours to provide; the drive does not make its own control power. AC line filters (2198-DB20-F, DB42-F, DB80-F or DB290-F) are required for CE compliance.\n\nThere is one small part that causes big confusion: the ground screw included in the drive module connector set. Install the ground screw for grounded (wye) power configurations, and remove it for ungrounded or high-impedance grounded power. It is a real installation step in the manual, not an optional detail.\n\nFeedback wiring depends on the motor. The drive has MF-A and MF-B motor feedback connectors and UFB-A and UFB-B 15-pin universal feedback connectors for master, load or auxiliary feedback. DSL feedback uses the 2198-KITCON-DSL kit and serves VPC-Bxxxxx-Q motors and the VPL, VPF and VPS families. Hiperface feedback uses the 2198-K57CK-D15M 15-pin kit and serves VPC-Bxxxxx-S motors, the MP-Series MPL, MPM, MPF and MPS motors, HPK, MPAS, MPAR, MPAI, LDAT and LDC. Heidenhain EnDat covers RDD and VPC-Bxxxxx-Y motors. If you have a mix, the 2198-H2DCK Hiperface-to-DSL converter kit bridges the two. Use 2090 motor power, brake and feedback cables throughout.\n\nSafety is the third piece. ERS3 drives have hardwired Safe Torque Off plus integrated STO over EtherNet/IP. ERS4 drives add safe monitor functions, defined in publication 2198-RM001: five safe stop functions (STO, SS1, SS2, SOS and SBC) and three safe monitoring functions (SLS, SDI and SLP). The safety rating is TUV certified, Performance Level e and SIL CL3. The STO connector pins include SB+, S1A, SCA, S2A, SBS1B, SCB and S2B, and STO can be cascaded from drive to drive.", "componentIds": ["ab-kinetix-5700"]}, {"id": "kinetix-5700-l4", "title": "The network: EtherNet/IP and CIP Sync", "body": "The Kinetix 5700 is a dual-port EtherNet/IP device, and it can be wired in a linear topology (drive to drive in a chain), a DLR ring topology, or a star topology through a switch. Use 1585J-M8CBJM-x shielded Ethernet cable and the 0.15 m drive-to-drive cables between modules. If you need a single-port device inside a DLR ring, use a 1783-ETAP to connect it; a single-port device cannot sit in a ring on its own.\n\nThe part that makes motion work over Ethernet is CIP Sync, and this is where technicians new to Integrated Motion get lost. Motion over EtherNet/IP needs every device on the same time base, so the Logix controller acts as the CIP Sync Grandmaster and the drives synchronize their clocks to it. That is why the configuration has two separate steps that look like they do the same thing: in the Module Definition of the 1756-EN2T, EN2TR or EN3TR EtherNet/IP module you set Time Sync Connection to 'Time Sync and Motion', and in Controller Properties on the Date/Time tab you check Enable Time Synchronization. The first tells the Ethernet module to carry motion and time sync traffic; the second turns the controller into the grandmaster. Skip either one and the axes will not synchronize.\n\nOn the controller side, the supported controllers are CompactLogix 5370 and 5380, ControlLogix 5570 and 5580, and GuardLogix 5570, with 1756-EN2T, EN2TR or EN3TR EtherNet/IP modules. Each drive has an LCD display with a Home screen that shows the axis state, the IP address and the DC bus voltage, which is your first diagnostic tool before you ever open the software.", "componentIds": ["ab-kinetix-5700"]}, {"id": "kinetix-5700-l5", "title": "Configuring in Studio 5000", "body": "Configuration happens in Studio 5000 Logix Designer, version 26.00 or later, and the first step is the one people skip: the Add-On Profile. The 2198 CIP Motion Kinetix 5500/5700 AOP comes from the Product Compatibility and Download Center, and whether you need it depends on the drive firmware and the Logix version together. With firmware 4.001 and Logix v26 or v27 you need the AOP; with v28 or later you do not. With firmware 5.001 and Logix v26, v27 or v28 you need it; with v29 or later you do not. With firmware 7.001 or later and Logix v29 or later you do not need it, but firmware 7.001 features need Logix v29 or later. Check the table in the manual (Table 85) before you start, because the wrong combination wastes an afternoon.\n\nThe configuration sequence follows the hardware. Create the project, select the controller and set the Revision. For ControlLogix and GuardLogix, add the 1756-EN2T, EN2TR or EN3TR through I/O Configuration, set Time Sync Connection to 'Time Sync and Motion' in Module Definition, and check Enable Time Synchronization in Controller Properties on the Date/Time tab. Then set the drive IP address from the LCD display: SETUP, then NETWORK, then choose STATIC IP (the default) or DHCP. The factory static IP is 192.168.1.1 with subnet 255.255.255.0 and gateway 192.168.1.1, and changes take effect only after a power cycle. You can also change the address through the RSLinx Module Configuration dialog.\n\nThen add the modules, power supply first. Right-click Ethernet, choose New Module, filter on Motion and Allen-Bradley, select the 2198-Pxxx power supply, give it a Name and an Ethernet Address on the private network (for example last octet 1). On the Power tab set Bus Configuration to Shared AC/DC and assign the Bus Sharing Group. Add each inverter the same way, selecting the 2198-Sxxx or Dxxx-ERS3 (or -ERS4), and on its Power tab set Bus Configuration to Shared DC with the same Bus Sharing Group as the power supply. Logix Designer enforces the shared-bus rules, so if you put an inverter in the wrong group it will tell you.\n\nFinally, create the axes and the motion group. On the drive module, go to the Associated Axes tab and click New Axis; AXIS_CIP_DRIVE is the default data type. Then configure the Axis Properties: General, Motor (select the catalog motor), Scaling, Load, Actions, Exceptions and Parameter List. Create the Motion Group by right-clicking Motion Groups and choosing New Motion Group, then on the Axis Assignment tab move the axis from Unassigned to Assigned and set the Attribute tab. Download the program, apply power, and watch the display: the axis walks through STANDBY, CONNECTING, CONFIGURING, SYNCING, PRECHARGE and RUNNING, and the display shows the DC bus voltage, for example 680.0 V at 480 V input.", "componentIds": ["ab-kinetix-5700"]}, {"id": "kinetix-5700-l6", "title": "First run: hookup tests and tuning", "body": "Before the first run, remove the load from every axis. This is not a suggestion: the hookup tests can move the motor without warning, and the brake releases during some of them. The manual carries an ATTENTION warning on exactly this point. With the load off, open the Axis Properties and go to the Hookup Tests category. Enter the Test Distance; the position units come from the Scaling tab, so check that first.\n\nThere are four hookup tests, and each checks a different piece of the wiring. The Marker test verifies marker detection as you manually rotate the motor shaft. The Commutation test verifies the commutation offset and polarity, and it is for third-party or custom permanent-magnet motors with TTL-with-Hall or Sine-Cosine-with-Hall incremental encoders that are not in the Motion Database. The Motor Feedback test verifies the feedback connections are wired correctly as you manually rotate the shaft. The Motor and Feedback test verifies the motor power and feedback connections as the drive commands the motor to rotate; it needs full bus power, so run the Motor Feedback test first. For each test, click the test, click Start, wait for the Test State to go from Executing to Passed, confirm the forward direction with Yes, and click Accept Test Results. While a test runs the LCD shows TESTING, for example DC BUS: 680.0V. If a test fails, verify the DC bus voltage, the Scaling values, and the motor power and feedback wiring.\n\nTuning for permanent-magnet motors uses the load observer, and the manual gives an exact starting recipe. On the Autotune tab set Application Type to Custom, Loop Response to Medium, and Load Coupling to Rigid, with only Velocity Feedforward checked. On the Load tab check Use Load Ratio and set Load Ratio to 0. On the Observer tab set Configuration to 'Load Observer with Velocity Estimate'. Click Apply, then Yes, and the gains are set automatically. Then enable the drive with an MSO instruction followed a few seconds later by an MSF, and listen: if the motor squeals, go to Axis Properties, Load, Compliance, and set the Torque Notch Filter Frequency in Hz. The deeper reference for all of this is MOTION-AT005, Motion System Tuning Application Techniques.\n\nInduction motors are tuned differently. Automatic FluxUpControl is recommended, and again you remove the load first, then reattach it and repeat. On the Autotune category set Travel Limit to 50.0 and Speed to 2.0 (the manual's example values); Direction defaults to Forward Uni-directional. Click Start, wait for Executing to become Success, then click Accept Tuned Values, and the tuned values populate the Loop and Load tables.", "componentIds": ["ab-kinetix-5700"]}, {"id": "kinetix-5700-l7", "title": "Faults and troubleshooting", "body": "The 5700 shows its health in two places: the axis state on the LCD display and the fault codes in Logix Designer. The axis states tell you where the axis is in its life cycle: STANDBY, CONNECTING, CONFIGURING, SYNCING, STOPPED, PRECHARGE, STARTING, RUNNING, TESTING, STOPPING, ABORTING, MAJOR FAULTED, START INHIBITED and SHUTDOWN. If the axis is stuck in one of the early states, the problem is usually configuration or communication; if it reaches RUNNING and then faults, the problem is usually power, wiring or tuning.\n\nFault codes follow the FLT Sxx scheme, where Sxx is a standard runtime axis exception. Two suffixes matter: FL means the factory limit was exceeded, and UL means the user limit was exceeded. So FLT S03, MTR OVERSPEED FL, is the factory overspeed limit, while FLT S04, MTR OVERSPEED UL, is the user-programmed overspeed limit. The same pattern runs through the whole table: S07 and S08 are motor overload factory and user limits, S33 and S34 are bus undervoltage factory and user limits, S43 and S44 are feedback loss factory and user limits. When you see a UL fault, the fix is often to check the user limit you set; when you see an FL fault, the fix is usually wiring, sizing or tuning.\n\nThe most common faults in the field are a short list worth memorizing. FLT S02, MTR COMMUTATION, is an illegal Hall state: check the Hall feedback wiring and use shielded cables routed away from noise. FLT S10, INV OVERCURRENT, means current exceeded the instantaneous hardware limit: verify the motor power wire gauge. FLT S22, AC POWER LOSS, means the AC input is gone: check the voltage on all phases. FLT S33, BUS UNDERVOLT FL, means the DC bus fell below the factory limit: monitor the AC line for glitches or line droop. FLT S45, FDBK COMM FL, is a feedback communication fault: check the motor feedback cable and connector. FLT S54, POSN ERROR, is excessive position error: verify the sizing of the drive and motor. FLT S61, ENABLE INPUT, means the hardware enable input was deactivated while the drive was enabled: check the enable input wiring.\n\nBeyond the Sxx codes there are FLT Mxx codes, INIT FLT codes (S01 enable input not configured, S02 motor not configured, S03 feedback not configured, S04 commutation not configured), NODE FLT codes (03 hardware, 05 clock skew, 06 lost controller connection, 07 clock sync) and SAFE FLT codes. The full fault list lives in the Kinetix 5700 Servo Drive Fault Codes reference, publication 2198-RD003, and the user manual points to Rockwell Knowledgebase Answer ID 1091727 for fault codes. When a fault repeats after you fix the obvious cause, read the sub-code: many faults, such as S05 MTR OVERTEMP FL nn and S47 FDBK DEVICE FAILURE, carry an nn sub-code that narrows the cause to a specific sensor or device error.", "componentIds": ["ab-kinetix-5700"]}], "quiz": [{"q": "In a Kinetix 5700 system, what supplies power to the inverters?", "options": ["Each inverter has its own three-phase AC input", "A 2198-Pxxx DC-bus power supply feeds a shared DC bus that all inverters hang off", "The Logix controller's power supply", "A 24V DC supply connected to the CP connector"], "answer": 1, "explain": "The 2198-Pxxx DC-bus power supply converts three-phase AC (324-528V rms) into DC, and the single-axis and dual-axis inverters share that DC bus through the zero-stacked shared-bus connection system. The 24V supply on the CP connector is only for control power, digital inputs and the motor brake."}, {"q": "What is the factory static IP address of a Kinetix 5700 drive?", "options": ["192.168.0.1", "192.168.1.1", "192.168.124.200", "10.0.0.1"], "answer": 1, "explain": "The factory static IP is 192.168.1.1, with subnet 255.255.255.0 and gateway 192.168.1.1. It is set from the LCD display under SETUP > NETWORK, and changes take effect only after a power cycle. (192.168.124.200 is the default for the Kinetix 300/350, not the 5700.)"}, {"q": "Your drive has firmware 7.001. Which Studio 5000 Logix Designer version do you need for the firmware 7.001 features?", "options": ["v24.00", "v26.00", "v28.00", "v29.00 or later"], "answer": 3, "explain": "Per the AOP table in the manual (Table 85), firmware 7.001 features need Logix Designer v29 or later, and firmware 7.001 with v29 or later does not need the Add-On Profile."}, {"q": "All modules on the same shared DC bus must be in the same what?", "options": ["Same rack", "Same Bus Sharing Group", "Same IP subnet", "Same Motion Group"], "answer": 1, "explain": "The system supports up to 25 bus-sharing groups, and all modules on the same shared bus must be in the same Bus Sharing Group. The DC-bus power supply uses Bus Configuration Shared AC/DC and the inverters use Shared DC, all in that group. Logix Designer enforces the shared-bus rules."}, {"q": "Which hookup test is required for a third-party permanent-magnet motor that is not in the Motion Database?", "options": ["Marker test", "Commutation test", "Motor Feedback test", "Motor and Feedback test"], "answer": 1, "explain": "The Commutation test verifies the commutation offset and polarity of the motor, and it is for third-party or custom PM motors with TTL-with-Hall or Sine-Cosine-with-Hall incremental encoders not in the Motion Database."}, {"q": "When tuning a permanent-magnet motor with the load observer, what do you set Configuration to on the Observer tab?", "options": ["Load Observer Only", "Load Observer with Velocity Estimate", "Tracking Notch", "Automatic FluxUpControl"], "answer": 1, "explain": "On the Observer tab, Configuration is set to 'Load Observer with Velocity Estimate' for a PM motor. 'Load Observer Only' is the Velocity Loop setting on the 5500, 'Tracking Notch' is a Compliance tab setting, and Automatic FluxUpControl is for induction motors."}, {"q": "What does FLT S33 mean on a Kinetix 5700?", "options": ["Bus overvoltage, factory limit", "Motor overspeed, factory limit", "Bus undervoltage, factory limit", "Feedback communication fault"], "answer": 2, "explain": "FLT S33 is BUS UNDERVOLT FL: the DC bus fell below the factory limit. The fix is to monitor the AC line for glitches or line droop and check the incoming AC voltage. In the FLT Sxx scheme, FL means the factory limit and UL means the user limit."}, {"q": "What is the main difference between an ERS4 drive and an ERS3 drive?", "options": ["ERS4 is hardwired safety only", "ERS4 adds safe monitor functions (SS1, SS2, SOS, SBC, SLS, SDI, SLP), rated SIL 3 / PLe", "ERS4 has higher output power", "ERS4 removes Safe Torque Off"], "answer": 1, "explain": "ERS3 drives have hardwired plus integrated Safe Torque Off. ERS4 drives add safe monitor functions per publication 2198-RM001: five safe stop functions (STO, SS1, SS2, SOS, SBC) and three safe monitoring functions (SLS, SDI, SLP), rated SIL 3 / PLe. Both are TUV certified to PLe and SIL CL3."}]}, {"id": "powerflex-525-module", "title": "PowerFlex 525: from selection to running motor", "family": "PowerFlex 525", "lessons": [{"id": "pf525-l1", "title": "What a VFD does, and what the 525 is", "body": "A variable frequency drive (VFD) controls an AC motor by changing the frequency and voltage it sends to the motor. A standard induction motor run across the line always tries to run at its synchronous speed, which is set by the line frequency and the number of poles. The drive rectifies the incoming AC into DC, then inverts it back into AC at whatever frequency you command, so the motor can run slower or faster than line speed, ramp up gently instead of slamming on, and hold a set speed under changing load. That is the whole job: controlled speed, controlled ramps, and protection in one box.\n\nThe PowerFlex 525 (bulletin 25B) is Rockwell's compact general-purpose VFD for that job on small machines. It covers 0.5 to 30 Hp (0.4 to 22 kW) in voltage classes from 100V to 600V, in Frames A through E. The seed drive for this app, 25B-D010N114, is a 4 kW / 5 Hp, 380-480V 3-phase, 10.5 A, Frame B unit in an IP20 open enclosure. It has an embedded single-port EtherNet/IP adapter, built-in Safe Torque-Off, an integral brake transistor, and two accessory card slots. It is a modular drive: the power module and the control module separate, so a control fault does not always mean replacing the whole unit.\n\nThe 525 sits in the middle of the PowerFlex range. Below it is the 523, the economy 520-series drive with the same frames and power range but no embedded EtherNet/IP, no Safe Torque-Off, and no closed-loop or permanent-magnet control. Above it are the 753 and 755, which start where the 525 stops at 30 Hp and add built-in I/O, option slots, DeviceLogix and Integrated Motion. Knowing where the 525 sits is the first selection skill: if the motor is under 30 Hp and the job needs network control or safety, the 525 is usually the right answer; if it needs neither, the 523 is cheaper; if it needs more power or process features, move up.", "componentIds": ["ab-powerflex-525"]}, {"id": "pf525-l2", "title": "Picking the right 525: sizing by amps, not horsepower", "body": "The most common sizing mistake is picking a drive by horsepower alone. Horsepower is a label; what the drive actually delivers is current. The rule from the 520-series technical data (520-TD001) is to size by motor full-load amps against the drive rated output amps. The 25B-D010N114 is rated 10.5 A, which Rockwell lists as 5 Hp / 4 kW at 480V - but if your motor's nameplate says 11 A, that drive is undersized even though the horsepower matches. Always read the FLA off the motor nameplate and compare it with the drive rating table.\n\nEach catalog number also carries a Normal Duty and a Heavy Duty rating. For the 525 the two are usually the same at the small end (the D010N114 is 5 Hp normal and heavy duty), but at the top of the range they split: a 43 A drive is 30 Hp normal duty but 25 Hp heavy duty. Heavy duty is the rating for constant-torque loads that need full torque at low speed and high overload - conveyors, extruders, hoists. Normal duty suits variable-torque loads like centrifugal fans and pumps, where torque falls with speed. If you are unsure which duty applies, size on heavy duty; it is the conservative pick.\n\nVoltage class is encoded in the catalog number: V is 120V single-phase, A is 240V single-phase, B is 240V three-phase, D is 480V three-phase, E is 600V three-phase. The frame size (A through E) is not in the catalog number - read it from 520-TD001, because it decides the panel space, the wire size and the torque on the power terminals. And select the input fuses or circuit breaker from the 520-TD001 tables for the exact catalog number, not from a generic rule of thumb.", "componentIds": ["ab-powerflex-525"]}, {"id": "pf525-l3", "title": "Power and control wiring: terminals, STO, and the jumper that matters", "body": "Power wiring on the 525 is at the bottom of the power module. Three-phase input lands on R/L1, S/L2, T/L3 (single-phase input uses R/L1 and S/L2), the motor lands on U/T1, V/T2, W/T3, and PE is the mandatory safety ground. DC+ and DC- are the DC bus terminals, and BR+ and BR- take an external dynamic brake resistor; the brake transistor itself is built into every rating, so the resistor is the only extra part. Frame A terminals take 0.8 to 5.3 square millimetres (18 to 10 AWG) at 1.76 to 2.16 newton-metres. If the motor runs backwards, swap any two motor leads - do not rewire the input.\n\nControl wiring is on the removable terminal block on the control module face. Terminal 01 is always the Stop input, 02 is Start/Run Forward, 03 is Direction/Run Reverse, and 04 is the digital common. There are seven digital inputs in total (one dedicated Stop plus six programmable), two analog inputs - 0-10V or plus/minus 10V on terminal 13, and 0/4-20 mA on terminal 15 - one analog output on terminal 16, two relay outputs and two opto outputs. Terminal 07 is a pulse input that accepts pulses up to 100 kHz; encoder feedback needs the 25-ENC-1 option card.\n\nThe safety wiring deserves its own paragraph because it is the one that bites people. The 525 has built-in Safe Torque-Off, SIL 2/PLd, on terminals S1, S2 and S+. The drive ships with a protective jumper across S1, S2 and S+; while that jumper is fitted the safety function is bypassed and the drive will run. The moment you wire a safety device, the jumper comes off and the safety inputs take effect. STO removes rotational power from the motor without removing power from the drive, so the drive restarts faster after a safety demand than a drive that was fully powered down. Never leave the jumper in place on a machine that is supposed to have a working safety function, and never remove it on a machine with no safety device wired - the drive will not run.", "componentIds": ["ab-powerflex-525"]}, {"id": "pf525-l4", "title": "First startup: the nameplate parameters", "body": "The 525 is designed so that startup is simple: the Basic Program group holds the parameters every setup needs, and the Smart Start-Up table in the quick start (520-QS001) lists them in order. The first group is the motor nameplate, and every value comes off the motor's own plate, never from memory. P031 [Motor NP Volts] is the nameplate rated voltage. P032 [Motor NP Hertz] is the nameplate frequency, 60 Hz by default. P033 [Motor OL Current] is the nameplate overload current, and it is the single most important protective setting on the drive because it drives the F007 electronic overload trip. P034 [Motor NP FLA] is the nameplate full-load amps, used by the autotune. P035 [Motor NP Poles] defaults to 4, P036 [Motor NP RPM] defaults to 1750, and P037 [Motor NP Power] is the nameplate power in kilowatts, used by the permanent-magnet regulator.\n\nNext comes the control mode. P039 [Torque Perf Mode] selects how the drive controls the motor: 0 is V/Hz, the simple mode that suits centrifugal fans and pumps, and 1 is sensorless vector control, the default, which gives better torque at low speed. Closed-loop velocity vector control and permanent-magnet motor control are 525-only features - the 523 does not have them.\n\nThen set the speed limits and the ramps. P043 [Minimum Freq] defaults to 0.00 Hz and is the lowest frequency the drive will output; P044 [Maximum Freq] defaults to 60.00 Hz and is the highest. P044 must be greater than P043, and it must be set above P032 before you run an autotune or the tune fails. P041 [Accel Time 1] and P042 [Decel Time 1] default to 10.00 seconds each, and they are the time to ramp from 0 Hz to maximum frequency and back. P045 [Stop Mode] defaults to 0, Ramp with coast-to-stop fallback, with Coast and DC Brake as the other options. Finally, tell the drive where its commands come from: P046 [Start Source 1] is 1 for the keypad by default or 2 for the terminal block, and P047 [Speed Reference 1] selects the speed source, for example 6 for a 4-20 mA analog input. If you reset a used drive first, P053 [Reset To Defalts] set to 2 performs a factory reset - do it with the drive stopped.", "componentIds": ["ab-powerflex-525"]}, {"id": "pf525-l5", "title": "Autotune and ramps: teaching the drive your motor", "body": "A VFD does not know your motor until you tell it. The nameplate parameters are the first half of that; the autotune is the second. P040 [Autotune] has three settings: 0 is Ready/Idle, 1 is Static Tune, and 2 is Rotate Tune. Static Tune measures the motor's electrical characteristics with the shaft standing still. Rotate Tune spins the motor and measures more, so it gives the better result - run it with the motor uncoupled or unloaded where the machine allows. The tune populates the drive's internal motor model, which is what makes sensorless vector control actually work instead of guessing.\n\nBefore you run the tune, check two things. First, the nameplate data must be right, especially P031, P032 and P034, because the tune calculates from those values. Second, P044 [Maximum Freq] must be above P032 [Motor NP Hertz]; the permanent-magnet application guide (520-AT001) is explicit that the autotune fails if it is not. For permanent-magnet motors there is a separate flowchart in Appendix J of the user manual (520-UM001), and the motor must be unloaded before a Rotate Tune.\n\nThe ramps are the other half of tuning. Accel time that is too short trips the drive on overcurrent or stalls the motor (F006): the fix in the manual is to increase P041 or the other accel times, or reduce the load so the current stays under the A484/A485 current limit. Decel time that is too short trips F005 OverVoltage, because a decelerating motor regenerates energy back into the DC bus faster than the drive can absorb it; the fix is to lengthen P042 or fit a dynamic brake resistor on BR+ and BR-. A good commissioning habit is to start with the 10-second defaults, watch the output current on b003 during a full accel and decel, and only shorten the ramps when the current stays comfortably below the motor FLA.", "componentIds": ["ab-powerflex-525"]}, {"id": "pf525-l6", "title": "Running from the network: embedded EtherNet/IP", "body": "The feature that most separates the 525 from the 523 is the embedded single-port EtherNet/IP adapter. There is no card to buy and no slot to fill: the RJ45 port on the control module is the network connection, and the adapter manual is 520COM-UM001. In Studio 5000 Logix Designer you add the drive with its Add-On Profile, set the IP address, and the controller can then start, stop and speed-reference the drive over the network. That is also why the start and speed source parameters matter: P046 [Start Source 1] and P047 [Speed Reference 1] have EtherNet/IP as one of their options, so the same drive can be keypad-controlled on the bench and network-controlled in the machine just by changing two parameters.\n\nIf the network needs a ring instead of a star, the 25-COMM-E2P dual-port EtherNet/IP card fits one of the two accessory slots and gives Device Level Ring capability. The built-in RS-485 (DSI) port is still there for Modbus RTU, and DeviceNet and PROFIBUS DP cards (25-COMM-D, 25-COMM-P) cover the older networks. When you commission a networked drive, prove the link before you trust it: confirm the drive appears in the controller's I/O tree, start and stop it from the PLC, and change the speed reference from the PLC while watching b001 [Output Freq] follow b002 [Commanded Freq] on the HIM. If the drive runs from the keypad but not from the network, the first thing to check is P046 and P047 - the drive is almost always still listening to the wrong source.\n\nOne more network habit is worth building now. Automatic Device Configuration is a 750-series feature, not a 520-series one, so a swapped 525 does not reconfigure itself from the controller. Save the parameter set with Connected Components Workbench after commissioning, and keep that file with the machine documentation. The next person to swap that drive will thank you.", "componentIds": ["ab-powerflex-525"]}, {"id": "pf525-l7", "title": "Faults and troubleshooting: reading the drive like a tech", "body": "When the 525 trips, the HIM shows a fault code and the drive stops. The fault history lives in the display group: b007 [Fault 1 Code] is the most recent fault, with b008 and b009 behind it. Learn the common ones by meaning, not by memorizing numbers. F004 UnderVoltage means the DC bus fell below its minimum - look at the incoming line for low voltage or an interruption. F005 OverVoltage means the bus went over its maximum - look for high line voltage, transients, or a regenerating load, and lengthen the decel time or fit a brake resistor. F013 Ground Fault means a current path to earth was detected at one or more output terminals - check the motor and the wiring to the drive output for a grounded condition, and megger the motor with its leads disconnected from the drive.\n\nTwo faults point at the load rather than the supply. F006 Motor Stalled means the drive cannot accelerate the motor: increase the accel time (P041) or reduce the load so the current stays under the A484/A485 current limit. F007 Motor Overload is the internal electronic overload trip: reduce the load so the current stays under P033 [Motor OL Current], and check that P033 actually matches the motor nameplate - a wrong P033 is one of the most common causes of nuisance F007 trips. F015 Load Loss means the output torque current fell below the level in A490, which usually means the coupling broke or the load disappeared; verify the connections between motor and load. F033 Auto Rstrt Tries means the drive tried and failed to reset a fault and restart: fix the original fault first, then clear it by hand.\n\nClearing a fault has four routes in the manual: press the Stop key if P045 [Stop Mode] is set between 0 and 3, cycle power, set A551 [Fault Clear] to 1 or 2, or cycle a digital input whose t062/t063/t065-t068 [DigIn TermBlk xx] function is set to 13. But clearing is the last step, never the first. The order that keeps you safe is: read the code, find and fix the cause, then clear, then run and watch b003 [Output Current] to prove the fix held. A fault that is cleared without a fix will come straight back, and on a machine that matters, that second trip is the one that breaks something.", "componentIds": ["ab-powerflex-525"]}], "quiz": [{"q": "On a PowerFlex 525, which parameter sets the motor nameplate rated voltage?", "options": ["P031 [Motor NP Volts]", "P033 [Motor OL Current]", "P041 [Accel Time 1]", "P046 [Start Source 1]"], "answer": 0, "explain": "P031 [Motor NP Volts] sets the motor nameplate rated volts (520-QS001A Smart Start-Up table). P033 is the overload current, P041 is accel time, P046 is the start source."}, {"q": "A PowerFlex 525 trips on F005. What does F005 mean?", "options": ["UnderVoltage - DC bus voltage fell below the minimum", "OverVoltage - DC bus voltage exceeded the maximum", "Ground Fault - a current path to earth at the output terminals", "Motor Stalled - the drive cannot accelerate the motor"], "answer": 1, "explain": "F005 OverVoltage means the DC bus voltage exceeded the maximum value; it can be caused by high line voltage, transients, or motor regeneration. The manual fix is to monitor the AC line, extend decel time, or install a dynamic brake option."}, {"q": "Which parameter runs the autotune on a PowerFlex 525, and what are its two tune types?", "options": ["P039, V/Hz or SVC", "P040, Static Tune or Rotate Tune", "P045, Ramp or Coast", "A551, Fault Clear 1 or 2"], "answer": 1, "explain": "P040 [Autotune]: 0 = Ready/Idle, 1 = Static Tune (motor still), 2 = Rotate Tune (motor spins). Run Rotate Tune uncoupled if possible, and set P044 above P032 first or the tune fails."}, {"q": "What are the Safe Torque-Off terminals on a PowerFlex 525?", "options": ["R/L1, S/L2, T/L3", "U/T1, V/T2, W/T3", "S1, S2 and S+", "BR+, BR- and DC+"], "answer": 2, "explain": "STO is on terminals S1 (Safety 1), S2 (Safety 2) and S+ (Safety +24V). The drive ships with a jumper on S1/S2/S+ that must be removed before the safety inputs take effect."}, {"q": "What is the power range of the PowerFlex 525?", "options": ["0.25 to 5 Hp", "0.5 to 30 Hp (0.4 to 22 kW)", "1 to 400 Hp (0.75 to 270 kW)", "1 to 2000 Hp (0.75 to 1500 kW)"], "answer": 1, "explain": "The 525 covers 0.5 to 30 Hp (0.4 to 22 kW) per 520-TD001. 1-400 Hp is the 753 and 1-2000 Hp is the 755."}, {"q": "A 525 fault is showing. Which parameter, set to 1 or 2, clears the fault?", "options": ["P031 [Motor NP Volts]", "P040 [Autotune]", "P053 [Reset To Defalts]", "A551 [Fault Clear]"], "answer": 3, "explain": "Set A551 [Fault Clear] to 1 or 2 to clear a fault. The other routes are pressing Stop (if P045 is 0-3), cycling power, or cycling a digital input set to function 13."}, {"q": "What does F013 Ground Fault mean on a PowerFlex 525?", "options": ["The DC bus voltage fell below the minimum", "The drive tried and failed to auto-reset a fault", "A current path to earth ground was detected at one or more drive output terminals", "The output torque current fell below the level in A490"], "answer": 2, "explain": "F013 Ground Fault: a current path to earth ground has been detected at one or more of the drive output terminals. Check the motor and external wiring for a grounded condition."}, {"q": "Which of these is a PowerFlex 525-only feature that the PowerFlex 523 does NOT have?", "options": ["V/Hz control", "Sensorless vector control", "Closed-loop velocity vector control", "An integral brake transistor"], "answer": 2, "explain": "Closed-loop velocity vector control (and permanent-magnet motor control) are 525-only per 520-TD001. The 523 has V/Hz, sensorless vector control and an integral brake transistor, but no embedded EtherNet/IP and no STO."}]}, {"id": "servo-motors-module", "title": "Servo motors: pick the right motor for the axis", "family": "MP-Series MPL", "lessons": [{"id": "sm-01", "title": "The six families at a glance", "body": "Allen-Bradley sells six rotary servo motor families that a tech will actually meet, and they are not six versions of the same motor \u2014 they are six answers to six different questions. The MP-Series MPL is the low-inertia, high-output general-purpose motor: frames from 63 mm to 300 mm, continuous stall torque from 0.26 to 163 N\u00b7m, speeds up to 8000 rpm, 200 V or 400 V windings, and it works with almost every Kinetix drive except the Kinetix 3. The MP-Series MPM is its medium-inertia brother: same MP-Series construction, but a heavier rotor, frames 115 to 215 mm, 2.18 to 62.8 N\u00b7m continuous, built for heavy loads. The Kinetix VP VPL is the low-inertia motor built specifically for the Kinetix 5500 and 5700: one single cable carries power, feedback and brake, the windings are matched to those two drives, and the feedback is the digital Hiperface DSL protocol. The Kinetix VP VPF is the same VPL idea rebuilt for food and beverage: food-grade epoxy coating, food-grade shaft seal, stainless steel shaft and noncorrosive fasteners, with a lower torque ceiling of 19 N\u00b7m continuous. The TL-Series TLY is the small compact motor: 200 V only, 46 to 100 mm frames, 0.086 to 5.42 N\u00b7m, 1 m cables with circular plastic connectors, for small axes on Kinetix 3/300/350/2000/6000/Ultra3000 drives. And the TL-Series TL is the same TL performance in metric frames only, with rectangular connectors and 300 mm cables, built for the Kinetix 3 drive alone. The first skill is not memorising these numbers \u2014 it is learning to ask, before anything else: which drive is this axis on? That one answer eliminates half the families immediately, because VPL and VPF only work on the 5500 and 5700, and TL and TLY do not work on the 5500 and 5700 at all. The compatibility table in the Kinetix Rotary Motion Specifications, publication KNX-TD001, page 2, is the chart to keep open whenever a motor is being picked.", "componentIds": ["ab-mpl", "ab-mpm", "ab-vpl", "ab-vpf", "ab-tly", "ab-tl"]}, {"id": "sm-02", "title": "Low inertia vs medium inertia: MPL vs MPM", "body": "Inertia is the motor's resistance to changing speed, and it is the single most misunderstood number in servo sizing. A low-inertia rotor \u2014 the MPL \u2014 accelerates fast because there is little rotor mass to spin up, which is exactly what a pick-and-place axis wants: short moves, fast reversals, quick settling. But that same light rotor is easily pushed around by its load. The number that decides whether an axis will tune well is the Load Inertia Ratio: load inertia reflected to the motor shaft divided by the motor's own rotor inertia. The Motion Analyzer manual defines it exactly that way. Compare the two motors at the same frame: the MPL-B4530K rotor is 0.00040 kg-m2, while the MPM-B1153F rotor is 0.00089 kg-m2 \u2014 more than double. On a heavy roll, a web line or a large rotary table, the MPM's heavier rotor brings the ratio down, the axis holds position better under load changes, and the tuning is stiffer and more forgiving. That is why Rockwell describes the MPM as the motor 'for applications with heavier loads and greater inertia' and lists printing, web handling and converting as its typical applications. The trade-off is real: the MPM tops out at 62.8 N\u00b7m continuous and 7.50 kW, while the MPL reaches 163 N\u00b7m and 18.6 kW, and the MPL spins to 8000 rpm against the MPM's 7000 rpm. So the rule is simple to state and easy to get wrong in practice: if the move is fast and the load is light, MPL; if the load is heavy and the move is steady, MPM \u2014 and always prove it in Motion Analyzer with the real load inertia, not with a guess. A motor that is too small will fault on thermal overload (FLT S07 on a 5500/5700 drive); a motor that is far too big wastes money and panel space and still needs tuning.", "componentIds": ["ab-mpl", "ab-mpm"]}, {"id": "sm-03", "title": "Single-cable motors: VPL and VPF, and the DSL encoder", "body": "The VPL and VPF exist because wiring is where servo jobs lose time. On an MPL or MPM axis there are two cables \u2014 a power/brake cable and a separate feedback cable \u2014 and on a Kinetix 5500 or 5700 the MPL/MPM Hiperface feedback even needs a converter kit (2198-H2DCK for the 5500, 2198-K57CK-D15M for the 5700). The VPL removes all of that: one 2090 single cable carries power, feedback and brake to one SpeedTec DIN connector on the motor, and the feedback travels as Hiperface DSL \u2014 a purely digital two-wire protocol integrated into the power cable. The encoder itself is absolute: the C option is 18-bit single-turn (262,144 counts per revolution), the P option is 18-bit multi-turn over 4096 turns with no battery, and the Q and W options are SIL 2 (PLd) safety-rated multi-turn encoders with a secondary safety channel \u2014 Q is 23-bit with a 12-bit secondary channel, W is 18-bit with a 9-bit secondary channel. That safety-rated feedback is what lets a 5500/5700 safety drive use the motor encoder in its safety functions. The VPF is mechanically the same motor with a different skin and seal: food-grade epoxy coating, food-grade shaft seal with food-grade grease, stainless steel shaft and noncorrosive fasteners, IP66/IP67 with the seal fitted, and a positive-air-pressure kit (VPF-AIR-PURGE) that can be fitted to the feedback connector to keep contamination out. Two warnings belong in every VPL/VPF lesson. First, the manual is blunt: building your own single cable or using third-party cable is not an option \u2014 the cable is part of the system and only Rockwell 2090 single-cable assemblies are tested with these motors and drives. Second, the shaft seal is a wear item on both families: inspect it and replace it every 3 months, not to exceed 12 months. A VPL and a VPF with the same frame and winding have the same torque in the tables, but the VPF family stops at 19 N\u00b7m continuous while the VPL reaches 33 N\u00b7m \u2014 so a food-line axis that needs more than 19 N\u00b7m continuous needs a different answer, and for meat and poultry Rockwell points to the stainless-steel VPS motors instead.", "componentIds": ["ab-vpl", "ab-vpf"]}, {"id": "sm-04", "title": "Small axes: TL vs TLY, and the feedback trap", "body": "The TL-Series motors are the ones a tech meets on the smallest machines \u2014 a small X-Y table, a lab instrument, a light packaging axis \u2014 and they are the easiest to pick wrong, because TL and TLY look identical in the performance tables. Rockwell states it plainly in KNX-TD001: the TL motor performance specifications match the TLY specifications identically. The differences are all in connection and drive. TLY has 1 m cables with circular plastic threaded connectors, comes in metric and NEMA frames, and works with Kinetix 6000, 300/350, 3, 2000 and Ultra3000 drives. TL has 300 mm cables with rectangular plastic connectors, comes in metric frames only, and works only with the Kinetix 3 drive \u2014 and the TL-A310 frame does not exist; that size is TLY-only. Both are 200 V only, both top out at 5.42 N\u00b7m continuous, and both are IP65. The trap is the feedback. TLY offers two encoders: H, a 2000-line incremental encoder, and B, a 17-bit multi-turn absolute encoder (131,072 counts per revolution) that is battery-backed \u2014 and the manual warns that the drive needs the connector kit with battery for absolute position backup, because without the battery the B encoder is single-turn only. The H incremental encoder has no absolute position at all: after every power cycle the axis must home before it knows where it is. A tech who swaps an H motor for a B motor (or the reverse) without changing the homing logic and the battery kit will get an axis that either loses position on power loss or faults on a missing battery. And the brake versions are de-rated: a TLY-A130 with a brake makes 0.293 N\u00b7m continuous against 0.325 N\u00b7m without a brake, and a TL-A220 with a brake makes 0.757 N\u00b7m against 0.836 N\u00b7m \u2014 always read the brake performance table, never the non-brake table, when the motor has a brake. Finally, never try to put a TL or TLY motor on a Kinetix 5500 or 5700: the compatibility table says no, and no converter kit changes that.", "componentIds": ["ab-tly", "ab-tl"]}, {"id": "sm-05", "title": "Sizing an axis step by step", "body": "Sizing is not picking a motor that is 'big enough' \u2014 it is proving, with numbers, that one specific motor and drive can do the real move profile without overheating and without running out of torque at speed. Rockwell's instruction, repeated in KNX-TD001 for every family, is to use FactoryTalk Motion Analyzer software to size and select motors, and to check the torque/speed curves in the drive-system design guides (KNX-RM009 for the Kinetix 5500, KNX-RM010 for the 5700, GMC-RM003 for the 6000/6200/6500). The workflow is the same for all six families. First, describe the move: distance, move time, dwell, load mass or inertia, gear ratio, screw lead or belt pitch, friction and any constant force such as gravity or web tension. Second, get the two torque numbers that matter: the RMS (continuous) torque over the whole cycle, which must sit under the motor's continuous stall torque, and the peak torque during acceleration, which must sit under the motor's peak stall torque \u2014 and under the torque/speed curve at the speed where that peak occurs, because available torque falls off at high speed. Third, check speed: the motor's rated speed and maximum speed against the fastest point in the profile. Fourth, check inertia: rotor inertia from the KNX-TD001 performance tables against the load inertia reflected to the motor, and think about the Load Inertia Ratio before ordering. Fifth, check the environment: ambient 0 to 40 C for all of these families, the aluminium heatsink size specified in KNX-TD001 pages 162-163 mounted to the front flange, the IP rating with the right shaft seal (IP50 minimum without a seal on MPL/MPM/VPL, IP66 with a seal and sealed connectors, IP65 on TL/TLY, IP66/IP67 on VPF), and the shaft load ratings \u2014 every family publishes radial and axial load tables for an L10 bearing life of 20,000 hours, and the rating falls as speed rises. A worked habit that saves rework: write down the four numbers for the chosen motor \u2014 continuous torque, peak torque, rated speed and rotor inertia \u2014 next to the four numbers the application demands, and keep that sheet with the axis. If any demanded number is above the motor number, change the motor, the gearbox or the move profile \u2014 in that order.", "componentIds": ["ab-mpl", "ab-mpm", "ab-vpl", "ab-vpf", "ab-tly", "ab-tl"]}, {"id": "sm-06", "title": "Commissioning and tuning: from first power-up to a stable axis", "body": "Commissioning is the disciplined sequence between 'the motor is bolted on' and 'the axis runs production', and most of it is mechanical. Verify the nameplate catalog number against the purchase order. Mount the motor with the connectors pointing down and a drip loop in each cable, on the specified heatsink, with airflow, inside 0 to 40 C. Check the shaft loads against the load-force tables. Use a torsionally rigid coupling or a reinforced timing belt, and never strike the shaft, coupling or pulley with a tool \u2014 the manuals for every family warn that sharp impact damages the bearings and the feedback device. Rotate a SpeedTec connector only by its housing, never with pliers and never repeatedly, or the seal and the IP rating are gone. Then configure the axis in Studio 5000 Logix Designer: add the drive as an Ethernet motion module (Electronic Keying set to Compatible Module or Exact Match, never Disable Keying; Connection set to Motion), create the axis (Associated Axes tab, data type AXIS_CIP_DRIVE), create a motion group (Base Update Period 5 ms), set the axis to Position Loop with Motor Feedback, Application Type Basic and Loop Response Medium, pick the motor by catalog number on the Motor page so all motor data fills in automatically, and set scaling \u2014 Direct Coupled Rotary, 1.0 position units per motor revolution, travel mode Unlimited. Tuning, on a Kinetix 5500/5700/6500 drive, is Rockwell's Load Observer method in the Motion System Tuning Application Technique, MOTION-AT005: the recommended EtherNet/IP settings use the load observer and give good performance in 90 percent of applications without an autotune, starting from a Load Inertia Ratio of 0; after an autotune from the Autotune tab, the measured ratio is applied and the Load Observer Bandwidth is set equal to the Velocity Proportional Gain. If the axis still misbehaves, fix the mechanics first \u2014 a loose coupling or a dragging shaft seal will beat any gain change \u2014 and use the Tracking Notch Filter on the Compliance tab for a resonance. Two facts about the brake must never be forgotten: it is a holding brake that releases with 24 V DC and holds the shaft at zero speed, it is not a stopping brake and not a safety device, so always command the drive to zero speed before engaging it. And when a fault appears, read the code before touching anything: on a 5500/5700, FLT S07 is thermal overload (slow the profile or lighten the load), FLT S45 is feedback communication loss (check the feedback cable, its shields and the motor ground), and FLT S05 motor overtemperature is a VP-motor fault \u2014 the drive's fault table in 2198-UM001 gives the problem and the fix for each code, and that table is the first place to look, not the last.", "componentIds": ["ab-mpl", "ab-mpm", "ab-vpl", "ab-vpf", "ab-tly", "ab-tl"]}], "quiz": [{"q": "An axis needs 8 N\u00b7m continuous torque and 20 N\u00b7m peak torque at 4000 rpm on a Kinetix 5700 drive. Which motor below is a verified match?", "options": ["VPL-B1303F (8.80 N\u00b7m continuous, 20.72 N\u00b7m peak, 4000 rpm)", "VPF-B0632F (0.93 N\u00b7m continuous, 2.69 N\u00b7m peak)", "TLY-A2540 (2.94 N\u00b7m continuous, 7.10 N\u00b7m peak)", "MPM-B1151M (2.18 N\u00b7m continuous, 6.60 N\u00b7m peak)"], "answer": 0, "explain": "KNX-TD001A lists VPL-B1303F (400 V) at 8.80 N\u00b7m continuous stall, 20.72 N\u00b7m peak stall, 4000 rpm \u2014 it clears both torque numbers at the required speed. The other three are all below 8 N\u00b7m continuous."}, {"q": "Why would you pick an MPM motor instead of an MPL motor for the same frame size?", "options": ["The MPM is cheaper and smaller", "The MPM has a heavier rotor that matches heavy loads, giving a lower Load Inertia Ratio", "The MPM runs on 200 V only", "The MPM has a single-cable DSL connection"], "answer": 1, "explain": "MPM is the medium-inertia family: its heavier rotor (e.g. 0.00089 kg-m2 on MPM-B1153F vs 0.00040 kg-m2 on the MPL-B4530K class) suits high-inertia loads. Single-cable DSL is a VPL/VPF feature, and MPM comes in 200 V and 400 V."}, {"q": "What is the difference between the VPL and the VPF?", "options": ["VPF is a larger frame motor with more torque", "VPF is the food-grade version of the VPL: food-grade coating, shaft seal, stainless shaft and noncorrosive fasteners", "VPF uses a resolver instead of DSL", "VPF works on Kinetix 6000 drives and VPL does not"], "answer": 1, "explain": "KNX-TD001A p48: VPF combines VPL characteristics with food-grade paint, shaft seal, noncorrosive fasteners and stainless steel shaft. VPF actually tops out lower (19 N\u00b7m continuous vs 33 N\u00b7m for VPL), both use DSL, and both work only on Kinetix 5500/5700."}, {"q": "A TLY motor with the H feedback option loses position every time the machine powers down. Why?", "options": ["The motor brake is faulty", "H is a 2000-line incremental encoder with no absolute position after a power cycle, so the axis must home on power-up", "The DSL cable is too long", "The motor is mounted upside down"], "answer": 1, "explain": "KNX-TD001A: H is a 2000 lines/rev incremental encoder. Incremental feedback has no absolute position after power loss; only the B absolute encoder (battery-backed) holds multi-turn position."}, {"q": "Which drive families can a VPL motor be used with?", "options": ["Kinetix 5500 and Kinetix 5700 only", "Kinetix 5500, 5700, 6000 and 300/350", "Kinetix 3 only", "Any Kinetix drive with a converter kit"], "answer": 0, "explain": "The KNX-TD001A p2 compatibility table shows VPL compatible only with Kinetix 5500 and 5700. MPL needs converter kits on 5500/5700, but VPL has no path to the other drives."}, {"q": "What does the 24 V DC brake on these servo motors do?", "options": ["It stops a moving shaft quickly in an emergency", "It is a safety-rated brake that replaces Safe Torque-Off", "It holds the shaft at 0 rpm up to its rated holding torque; it is not a stopping brake or a safety device", "It powers the encoder when the drive is off"], "answer": 2, "explain": "KNX-TD001A p164 Motor Brake Application Guidelines: the brakes hold the shaft at 0 rpm up to the rated holding torque, are not designed for stopping rotation, and are not intended to be used as a safety device. Always decelerate to 0 rpm with the drive first."}, {"q": "On a Kinetix 5500 drive, FLT S45 - FDBK COMM FL appears. What is the verified first check?", "options": ["Replace the motor bearings", "Check the motor feedback cable and connector, the power/feedback shields, and the motor frame ground", "Increase the Load Inertia Ratio to 10", "Change the motor catalog number to a larger frame"], "answer": 1, "explain": "2198-UM001: FLT S45 is missed/corrupted serial packets from the feedback device; the listed fix is to check the motor feedback cable and connector, check the shields are secured correctly, and check the motor frame is grounded correctly."}, {"q": "In Studio 5000 Logix Designer, how do you get the correct motor parameters for an MPL-B4530K-SK74AA axis?", "options": ["Type the torque and inertia in by hand from the nameplate", "On the Axis Properties - Motor page, set Data Source to Catalog Number and select MPL-B4530K-SK74AA; all motor settings complete automatically", "Set the drive to Disable Keying and let it auto-detect", "Use the Motion Group Attribute tab and enter the catalog number there"], "answer": 1, "explain": "Rockwell's Studio 5000 quick start: specify the motor with Data Source selected as Catalog Number, and 'All of the motor settings are completed automatically to match the settings specified for that catalog number.' Electronic Keying must never be Disable Keying on motion modules."}]}, {"id": "starters-module", "title": "Starters: soft start, protect, and stop the motor", "family": "SMC-3", "lessons": [{"id": "starters-1", "title": "Why a motor does not just switch on: DOL vs soft start", "body": "A direct-on-line (DOL) starter is the simplest way to run a motor: a contactor closes and the motor sees full voltage instantly. The price is inrush. A motor at standstill looks almost like a short circuit, so it draws several times its full-load current for the first moments, and it produces full locked-rotor torque in one hit. On a stiff supply with a small motor that is fine. On a pump it is water hammer - the pipework bangs as the water column is slammed into motion. On a conveyor it is a jerk that throws product. On a weak supply it is a voltage dip that browns out everything else on the circuit, and on a breaker it is a nuisance trip.\n\nA soft starter fixes the start, not the running. It puts SCRs (silicon-controlled rectifiers) in series with the motor and phases them on gradually, so the voltage - and therefore the torque and current - rise over a set ramp time instead of in one step. The SMC-3 does this with DIP switches: you pick Soft Start or Current Limit, an initial torque of 15, 25, 35 or 65% of locked-rotor torque, and a ramp of 2 to 30 seconds. The SMC Flex and SMC-50 do the same thing through parameters (Ramp Time, Initial Torque, Current Limit Level), and the SMC-50 adds Linear Speed and Torque Control ramps that hold the acceleration itself straight instead of just the voltage.\n\nThe key point for a technician is that a soft starter is not a speed control. Once the motor is up to speed, the starter's job is done: the SMC-3 and SMC Flex close an internal bypass contactor so the SCRs drop out of circuit and the motor runs at full voltage, and the SMC-50 keeps its SCRs in circuit but at full conduction. If the application needs the motor to run at different speeds, that is a variable-frequency drive (PowerFlex), not a soft starter. Choose a soft starter when the motor always runs at full speed and only the start - and the stop - needs taming.", "componentIds": ["ab-smc-3", "ab-smc-flex", "ab-smc-50"]}, {"id": "starters-2", "title": "The three SMCs: SMC-3, SMC Flex and SMC-50", "body": "Rockwell sells three soft-starter families, and the difference is how much control and information you need, not how big the motor is. The SMC-3 (Bulletin 150-C, 3 to 480 A) is the simple one: DIP switches and one overload dial, five start/stop modes (Soft Start, Current Limit, Kickstart, Soft Stop, Coast-to-Rest), a built-in overload and an integral bypass. There is no display and no network port in the documentation read, so you set it, close the panel, and read faults from one LED flashing a code - one flash for overload, six for a shorted SCR.\n\nThe SMC Flex (Bulletin 150-F, 5 to 1250 A) is the middle of the range: a built-in keypad and LCD, metering (volts, amps, kW, power factor, motor thermal usage), nine start/stop modes including Pump Control, Smart Motor Braking and Accu-Stop, and a DPI port for communication adapters. You program it through named parameters - Parameter 17 Starting Mode, Parameter 18 Ramp Time (0 to 30 seconds, default 10), Parameter 19 Initial Torque (0 to 90% of locked-rotor torque, default 70%), Parameter 20 Current Limit Level (50 to 600% of FLC, default 350%) - and you must enter the motor FLC in Parameter 46 or the overload does not protect anything.\n\nThe SMC-50 (Bulletin 150-S, 90 to 520 A) is the top end: 17 start/stop modes, fully solid-state with six back-to-back SCRs and no integral bypass, torque control and linear speed acceleration/deceleration, energy saver, preset slow speed from 1 to 15%, and a wide protection set that includes power, power factor and harmonic distortion. It is programmed from a 20-HIM LCD, DriveExecutive, or the 150-SM6 parameter module, and it tunes the motor automatically. Its ramp time runs 0 to 1000 seconds (Parameter 50, default 10) against the Flex's 0 to 30, which tells you the SMC-50 is aimed at very long, heavy starts. The selection rule is simple: SMC-3 for a simple job, SMC Flex when you need a display, metering or pump control, SMC-50 when you need torque or linear-speed control or the advanced protection set.", "componentIds": ["ab-smc-3", "ab-smc-flex", "ab-smc-50"]}, {"id": "starters-3", "title": "Starting modes: soft start, current limit, kickstart and the rest", "body": "Every SMC offers Soft Start as its general-purpose mode. The controller raises the motor voltage from an initial torque level to full voltage over the ramp time. If the motor hesitates at the start of the ramp, raise the initial torque; if it jerks, lower it. On the SMC-3 the choices are coarse - 15, 25, 35 or 65% of locked-rotor torque - because they are DIP-switch positions. On the Flex and SMC-50 you can dial any value from 0 to 90%.\n\nCurrent Limit Start is the mode for a weak supply or a breaker that cannot take the inrush. Instead of ramping voltage, the controller holds the motor current at a set ceiling - 150, 250, 350 or 450% of FLC on the SMC-3, 50 to 600% on the Flex and SMC-50 - for the ramp time. The motor accelerates as fast as that current allows. Pick the limit from the supply's capability, not from habit: a 350% limit on a motor whose breaker trips at 300% will still trip.\n\nKickstart is a short, hard pulse - 450% of FLC for 0.5, 1.0 or 1.5 seconds on the SMC-3 - to break a sticky load free (a pump with settled solids, a conveyor with a seized roller) before the normal ramp takes over. It is off by default on the Flex and SMC-50 for a reason: a kickstart on a load that does not need it is just a shock you paid to avoid. The SMC-50 adds the modes the other two cannot do: Linear Speed Acceleration, which increases current to hold the speed ramp straight; Torque Control, which raises torque slowly over a fixed time for fragile loads; Dual Ramp, two start profiles selected by a digital input; and Preset Slow Speed, 1 to 15% speed forward or reverse for positioning. Full Voltage Start is also available on the Flex and SMC-50 - the ramp time is effectively zero - and it exists so one controller can be a DOL starter when the application calls for it.", "componentIds": ["ab-smc-3", "ab-smc-flex", "ab-smc-50"]}, {"id": "starters-4", "title": "Stopping modes: soft stop, pump stop, braking and coast", "body": "Stopping matters as much as starting, and it is where most soft-starter faults are actually made. Coast-to-Rest simply removes voltage and lets the load spin down on its own. It is the right choice for a fan or a conveyor with no stopping requirement, and it is the default on the Flex (Stop Input, Parameter 133, defaults to Coast). Soft Stop ramps the voltage down over a set time - on the SMC-3, one, two or three times the start time; on the Flex, Stop Time Parameter 33 runs 0 to 120 seconds; on the SMC-50, Parameter 66 runs 0 to 999 seconds - so the load decelerates instead of stopping dead.\n\nPump Stop (Pump Control on the Flex, Pump Start/Pump Stop on the SMC-50) is a shaped stop for centrifugal pumps. A plain soft stop on a pump can still cause water hammer because the pump's torque falls away faster than the water column slows; pump control shapes the torque so the flow decays smoothly. Rockwell warns in the Flex Quick Start that pump stopping may cause motor heating depending on the pumping system, so you use the lowest stopping time that stops the pump satisfactorily - longer is not better.\n\nSmart Motor Braking (SMB) actively brakes the load by injecting current, and Accu-Stop combines slow speed with braking to stop at an accurate position. Slow speed running is not for continuous operation: the motor's cooling fan is turning slowly while the windings still carry current, so the motor overheats. And the warning that appears in every SMC manual: stopping modes are not an emergency stop. An E-stop must remove power through a separate, hardwired path - an isolation contactor or a safety circuit - not through the soft starter's ramp.", "componentIds": ["ab-smc-3", "ab-smc-flex", "ab-smc-50"]}, {"id": "starters-5", "title": "Protection coordination: the 140M, the 100-C and the E300 as one starter", "body": "A starter is not one device, it is a coordinated set, and each part has a job the others cannot do. The Bulletin 140M motor protection circuit breaker is the branch-circuit device: it gives short-circuit protection (an instantaneous magnetic trip, fixed at 13 times rated current on the E-type, 16 to 20 times on the high-inrush T-type) and overload protection (an adjustable thermal trip, Trip Class 10, set to 105% of motor current on its dial). The Bulletin 100-C contactor is the switch: it makes and breaks the motor current on command from its coil, rated on AC-3 motor duty - 9 A for a 100-C09, 23 A for a 100-C23, 97 A for a 100-C97. The E300 electronic overload relay is the brain: it measures the current, runs a thermal model of the motor, and opens its trip relay to drop the contactor out when the motor is in danger.\n\nRockwell publishes short-circuit coordination tables that prove which combinations survive a fault together. A 3-component starter is a magnetic-only 140M (the N-type motor circuit protector, which has no thermal trip of its own) plus a 100-C contactor plus an E300: for example, at 460 V and 65 kA, a 5 Hp motor (7.6 A) uses a 140M-D8N-C10 (130 A magnetic trip) with a 100-C09 and a 193-ESM-*-30A-C23 sensing module, and a 15 Hp motor (21 A) uses a 140M-D8N-C16 with a 100-C16 and the same 30 A E300 module. That combination is rated Type 2 coordination, which means after the short circuit is cleared the starter is still usable without replacing parts. Type 1, by contrast, allows damage to the contactor and overload as long as nobody is hurt.\n\nTwo combinations matter most. A 2-component starter is a 140M-E (thermal plus magnetic) plus a contactor, with no separate overload relay - the 140M does the thermal job. A Type F combination is a Type E self-protected 140M (with its Type E adapter) plus a contactor or an SMC soft starter, tested together so the assembly needs no additional branch-circuit protection. The practical rule for the panel builder is to copy the combination from the coordination table, catalog numbers and all, and to record it on the panel schedule: swapping in a different breaker or contactor of the same current rating does not keep the Type 2 rating, because the rating belongs to the tested combination, not to the individual devices. Note also that the 140M was discontinued on 31 March 2025 and Rockwell points to the 140MT family as its engineering replacement - check the current 140MT tables before ordering a new build.", "componentIds": ["ab-140m", "ab-100-c", "ab-e300"]}, {"id": "starters-6", "title": "The E300: a thermal model instead of a bimetal strip", "body": "A bimetallic overload relay bends a strip as it heats and trips at a fixed curve. The E300 electronic overload relay replaces that strip with a thermal model in software, and two settings drive the whole model: FLA (Parameter 171), the motor's nameplate full-load current, and Trip Class (Parameter 172), adjustable from 5 to 30 with a default of 10. Trip class is defined as the maximum time in seconds for the relay to trip at six times rated current, so a Class 10 relay trips within 10 seconds at 600% current and a Class 30 allows 30 seconds - the right choice for a long, heavy start like a large fan or crusher, and the wrong choice for a motor that cannot take the heat.\n\nThe E300's thermal memory is nonvolatile with a time constant equivalent to Trip Class 20. That matters on a real plant: if the power fails and comes back, the relay does not forget that the motor was hot. It reads its thermal-memory circuit on re-power and restores % Thermal Capacity Utilized (Parameter 1), so a hot motor stays protected after a power cycle instead of getting a fresh cold start it cannot take.\n\nBeyond overload, the E300 watches for the failures that kill motors in service. Stall Trip Level (Parameter 250, 100 to 600% of FLA) catches a motor that never reaches speed. Jam catches a blocked load when current stays above a level for a time. Underload Warning Level (Parameter 258, 10 to 100% of FLA) catches a broken belt, a dry pump or a snapped shaft - the current falls because the load has gone, not because the motor is healthy. Current imbalance, ground fault (on VIG/IG sensing modules), and voltage and power protection (on P-type modules) cover the rest. Each protection has an inhibit time that holds it off during the start, so the start itself does not false-trip, and each has a warning level you can watch in normal running before you set the trip level. The commissioning discipline is to set FLA and trip class first, enable the overload trip in TripEnableI (Parameter 183) - without that bit the relay will not trip the contactor at all - prove the trip path drops the contactor out, and only then set the jam, stall and underload levels above the normal running envelope you actually measured.", "componentIds": ["ab-e300", "ab-100-c", "ab-140m"]}], "quiz": [{"q": "A centrifugal pump bangs the pipework every time it starts DOL. What is the soft starter doing that fixes this?", "options": ["It runs the pump at a lower speed permanently", "It ramps the motor voltage up gradually over a set time so torque and current rise smoothly", "It adds a bigger breaker so the inrush does not trip", "It reverses the pump briefly before starting"], "answer": 1, "explain": "A soft starter phases its SCRs on gradually, so voltage, torque and current rise over the ramp time instead of in one hit. That is what removes the water hammer. It does not change the running speed - once up to speed the motor runs at full voltage."}, {"q": "On an SMC-3, how do you set the starting method, ramp time and overload class?", "options": ["Through a keypad and LCD menu", "Through Parameters 17, 18 and 44", "With DIP switches and the overload dial on the front", "Over DeviceNet from the PLC"], "answer": 2, "explain": "The SMC-3 is set with DIP switches (DIP 3/4/5 for Soft Start vs Current Limit and level, DIP 1/2/8 for start time, DIP 11/12 for trip class) and the overload dial, whose trip rating is 120% of the dial setting. Parameters 17/18/44 are SMC Flex parameters."}, {"q": "Why must you enter the motor FLC on an SMC Flex (Parameter 46) or an E300 (Parameter 171)?", "options": ["It sets the display brightness", "The overload protection cannot protect the motor until FLC is entered - the Flex manual says the Motor Overload parameter must be programmed by the installer", "It is only needed for metering, not protection", "It sets the ramp time automatically"], "answer": 1, "explain": "Both manuals are explicit: the overload is not automatic. On the Flex the Motor Overload parameter must be programmed by the installer to provide proper protection, and on the E300, FLA (Parameter 171) plus Trip Class (Parameter 172) drive the thermal model. Leaving FLC at its default leaves the motor unprotected or wrongly protected."}, {"q": "A motor needs a short hard pulse to break a sticky load free before its normal ramp. Which feature is that, and what is its current on the SMC-3?", "options": ["Soft Stop, at 150% FLA", "Kickstart, fixed at 450% FLA for 0.5, 1.0 or 1.5 s", "Current Limit, at 350% FLA", "Preset Slow Speed, at 15% speed"], "answer": 1, "explain": "Kickstart gives a short 450% FLA pulse (0.5/1.0/1.5 s on the SMC-3, set by DIP switches 9/10) to break a load free, then the normal ramp follows. It is off by default on the Flex and SMC-50."}, {"q": "In a 3-component starter (140M + 100-C + E300), which 140M type is used and why?", "options": ["140M-E, because it has its own thermal trip and the E300 is a spare", "140M-N magnetic-only motor circuit protector, because the E300 provides the thermal/overload protection", "140M-T, because it is the only type that fits a contactor", "Any 140M, the type letter does not matter"], "answer": 1, "explain": "The coordination tables specify the 140M-..N magnetic-only MCP for the 3-component starter: the magnetic trip clears short circuits and the E300 does the thermal overload job. The E-type (thermal + magnetic) is for the 2-component starter, where there is no separate overload relay."}, {"q": "What does Type 2 short-circuit coordination mean for a starter combination?", "options": ["The starter can be used without any branch-circuit protection", "After the short circuit is cleared the starter is still usable without replacing parts", "The breaker trips twice as fast as Type 1", "Only the breaker needs replacing after a fault"], "answer": 1, "explain": "Type 2 coordination per IEC/UL 60947-4-1 means the combination survives the fault and remains usable without part replacement. Type 1 allows damage to the contactor/overload as long as there is no hazard to people. The rating belongs to the tested combination, so copy the catalog numbers from the coordination table."}, {"q": "An E300 shows Trip Class 10 (Parameter 172). What does Class 10 mean?", "options": ["The relay trips in 10 seconds at full-load current", "The maximum time to trip at 6x rated current is 10 seconds", "The motor may start 10 times per hour", "The relay has 10 protection functions enabled"], "answer": 1, "explain": "Trip class is the maximum time (in seconds) for the relay to trip at six times rated current. Class 5 trips faster for motors that cannot take a long start; Class 20/30 allow long heavy starts. The E300 offers 5 to 30, default 10."}, {"q": "A 100-C09 contactor is rated 9 A AC-3 / 32 A AC-1. A technician sizes a motor starter using the 32 A figure. What is wrong?", "options": ["Nothing - 32 A is the safer, higher rating", "AC-1 is the resistive rating; motors must be sized on AC-3, so the contactor is undersized for the motor's starting current", "The 9 A figure is for DC only", "AC-3 already includes the 32 A, so either number works"], "answer": 1, "explain": "AC-3 is switching a running motor (making and breaking starting current); AC-1 is resistive load with no inrush and is much higher. Sizing a motor on AC-1 undersizes the contactor for the real starting duty. Always size motors on AC-3."}]}, {"family": "Studio 5000 Logix Designer", "id": "studio5000-motion-module", "lessons": [{"body": "Integrated Motion on the EtherNet/IP network is Rockwell's way of running servo axes over the same Ethernet network as the rest of the machine, instead of over a separate motion network. The Logix controller (ControlLogix, CompactLogix or GuardLogix), the drive, and Studio 5000 Logix Designer work as one system: the controller plans the motion, the drive closes the servo loop, and Studio 5000 holds the configuration for both. The manual that teaches this whole flow is Integrated Motion on the EtherNet/IP Network: Configuration and Startup, publication MOTION-UM003P-EN-P, January 2025, and it covers Kinetix 350, 5300, 5500, 5700 and 6500, PowerFlex 527, PowerFlex 755 and PowerFlex 755T drives with TotalFORCE control, plus iTRAK 5730.\n\nThe technology underneath is CIP Motion, built on the Common Industrial Protocol (CIP), together with CIP Sync time synchronisation. That matters because motion is time-critical: the controller and the drives must agree on time so that position commands and feedback line up. MOTION-UM003P states th
