ed the motor overspeed user limit.", "fix": "Check control loop tuning and increase the Motor Overspeed UL attribute value."}, {"code": "S05", "meaning": "Motor overtemperature, factory limit. Thermistor calculations indicate the factory temperature limit was exceeded (nn 01 thermostat/thermistor, 02 encoder temperature sensor). VP/MP-Series only, not induction motors.", "fix": "Operate within the continuous torque rating, reduce ambient temperature, and add motor cooling."}, {"code": "S08", "meaning": "Motor thermal overload, user limit. Thermal model exceeded the Motor Thermal Overload User Limit.", "fix": "Modify the command profile and increase the Motor Thermal Overload UL attribute value."}, {"code": "S11", "meaning": "Inverter overtemperature, factory limit. Measured inverter temperature exceeded the factory limit.", "fix": "Modify the command profile, reduce drive ambient temperature, and verify airflow is not obstructed."}, {"code": "S13", "meaning": "Inverter thermal overload, factory limit. Thermal capacity exceeded the factory limit.", "fix": "Modify the command profile."}, {"code": "S14", "meaning": "Inverter thermal overload, user limit. Exceeded the user limit given by the Inverter Thermal Overload User Limit.", "fix": "Modify the command profile and increase the Inverter Thermal Overload UL attribute value."}, {"code": "S18", "meaning": "Converter overtemperature, factory limit. Measured converter temperature exceeded the factory limit.", "fix": "Reduce the shared DC follower drives, modify the command profile, reduce ambient temperature, and verify airflow is not obstructed."}, {"code": "S21", "meaning": "Converter thermal overload, user limit. Exceeded the Converter Thermal Overload User Limit.", "fix": "Reduce the shared DC follower drives, reduce the duty cycle, and increase the Converter Thermal Overload UL attribute value."}, {"code": "S23", "meaning": "AC phase loss. Single AC input phase lost while the drive was enabled.", "fix": "Check the AC input voltage on all phases."}, {"code": "S29", "meaning": "Bus regulator thermal overload, factory limit. Shunt thermal model exceeded the factory limit.", "fix": "Modify the duty cycle, add an external shunt, and add a capacitor module."}, {"code": "S30", "meaning": "Bus regulator thermal overload, user limit. Exceeded the Bus Regulator Thermal Overload User Limit.", "fix": "Modify the duty cycle, add an external shunt, increase the Bus Regulator Thermal Overload UL attribute value, and add a capacitor module."}, {"code": "S31", "meaning": "Bus regulator failure. Shunt circuit detected a shorted shunt resistor.", "fix": "Check for shorts in the shunt connector, unplug the shunt connector and measure the resistance, and replace the drive if shorted."}, {"code": "S34", "meaning": "Bus undervoltage, user limit. DC bus below the user limit given by the Bus Undervoltage User Limit.", "fix": "Verify incoming AC, monitor for glitches or line droop, install a UPS, and increase the Bus Undervoltage UL attribute value."}, {"code": "S35", "meaning": "Bus overvoltage, factory limit. DC bus above the factory limit.", "fix": "Change the decel or motion profile of all drives on the DC bus, unplug the shunt connector and measure the resistance, and replace the drive if the shunt resistor is open."}, {"code": "S39", "meaning": "Bus power leakage. Measured converter power exceeded estimated inverter output power by more than the factory limit.", "fix": "Check the bus power sharing configuration attribute and check the AC input and DC bus sharing connections."}, {"code": "S49", "meaning": "Brake slip. Brake proving detected motor displacement exceeded the brake slip tolerance while the mechanical brake was engaged.", "fix": "Check the motor brake."}, {"code": "S50", "meaning": "Position hardware overtravel. Axis beyond the digital input travel limit, positive direction.", "fix": "Check the digital input and the axis position."}, {"code": "S51", "meaning": "Negative hardware overtravel. Axis beyond the digital input travel limit, negative direction.", "fix": "Check the digital input and the axis position."}, {"code": "S54", "meaning": "Excessive position error. Position error exceeded the Position Error Tolerance for the Position Error Tolerance Time.", "fix": "Check position loop tuning, increase the feedforward gain, verify sizing, check motor power wiring, and increase the Position Error Tolerance and/or Time attribute values."}, {"code": "S55", "meaning": "Excessive velocity error. Velocity error exceeded the Velocity Error Tolerance for the Velocity Error Tolerance Time.", "fix": "Check velocity loop tuning, reduce acceleration, verify sizing, check motor power wiring, and increase the Velocity Error Tolerance and/or Time values."}, {"code": "S56", "meaning": "Overtorque limit. Torque above the user-defined maximum for the Overtorque Limit Time.", "fix": "Verify the Torque Trim value, verify the motion profile, verify sizing, and increase the Overtorque Limit and/or Time attribute values."}, {"code": "S57", "meaning": "Undertorque limit. Torque below the user-defined minimum for the Undertorque Limit Time.", "fix": "Verify the motion profile, verify sizing, and decrease the Overtorque Limit and/or Time attribute values."}, {"code": "M02", "meaning": "Motor voltage mismatch. Configured drive voltage greater than the motor rated voltage, for example a 400V-class drive with a 200V-class motor.", "fix": "Set the drive voltage lower or replace the motor with one of matching voltage rating."}, {"code": "M25", "meaning": "DC common bus fault. AC power detected while configured for shared DC operation.", "fix": "Check the drive power configuration from the controller and check the wiring."}, {"code": "M26", "meaning": "Runtime error. Firmware unrecoverable runtime error.", "fix": "Cycle control power, reset the drive, and return the drive for repair if the fault continues."}, {"code": "M28", "meaning": "Safety module communication error, ERS2 only. Communications with the safety hardware within the drive failed.", "fix": "Cycle control power, reset the drive, and return the drive for repair if the fault continues."}, {"code": "INIT M01", "meaning": "INIT FLT: smart encoder data corruption. Data stored in the encoder has a checksum error.", "fix": "Cycle control power; return the motor for repair if the fault continues."}, {"code": "INIT M02", "meaning": "INIT FLT: motor data range error. Motor data attribute out of range (nn 01-16 DATA_RANGE_*).", "fix": "Cycle control power; return the motor for repair if the fault continues."}, {"code": "INIT M03", "meaning": "INIT FLT: motor feedback communication startup. Communications with the encoder could not be established.", "fix": "Cycle control power, check the motor feedback connector, check motor power and feedback shield terminations, and return the motor for repair if the fault continues."}, {"code": "INIT M14", "meaning": "INIT FLT: safety firmware. Loaded Safety firmware is not compatible with the drive firmware.", "fix": "Cycle control power, update the drive firmware, and return the drive for repair if the fault continues."}, {"code": "INIT M20", "meaning": "INIT FLT: unknown module. Product code of the power board is invalid.", "fix": "Cycle control power, reset the drive, and return the drive for repair if the fault continues."}, {"code": "INIT M21", "meaning": "INIT FLT: factory configuration error. Factory configuration data is missing or invalid.", "fix": "Cycle control power, reset the drive, and return the drive for repair if the fault continues."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2198-um001_-en-p.pdf", "sources": ["https://my.goagilix.com/assets/2d/98/2d9819f3-8d9f-4a32-abba-37e75b483d36/2198-um001_-en-p.pdf (Rockwell 2198-UM001M-EN-P Nov 2022, 260 pp)", "https://www.manualslib.com/manual/2385730/Allen-Bradley-Kinetix-5500.html", "https://manuals.plus/wp-content/plugins/pdfjs-viewer-shortcode/pdfjs/web/viewer.php?file=https://manuals.plus/wp-content/uploads/2023/02/Allen-Bradley-Kinetix-5500-Servo-Drives-User-Manual.pdf&attachment_id=6851326&dButton=true&pButton=true&oButton=false&sButton=true", "https://www.scribd.com/document/647398152/iasimp-qs035-en-p (Kinetix 5500 Quick Start, IASIMP-QS035B-EN-P Apr 2015)", "Local mirror copy read 2026-11-20: .research/pdfs/um001-5500.txt (Rockwell 2198-UM001M-EN-P Nov 2022)", "https://www.manualslib.com/manual/2385730/Rockwell-Automation-Allen-Bradley-Kinetix-5500.html?page=151 (ManualsLib, 2198-UM001F Table 53 pp. 151-153)", "https://www.manualslib.com/manual/2385730/Rockwell-Automation-Allen-Bradley-Kinetix-5500.html?page=154 (ManualsLib, 2198-UM001F Tables 54-55 p.154)"], "tbd": [], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-5700", "category": "servo-drive", "family": "Kinetix 5700", "catalogNumbers": ["2198-D057-ERS3", "2198-D006-ERS3", "2198-D012-ERS3", "2198-D020-ERS3", "2198-D032-ERS3", "2198-S086-ERS3", "2198-S130-ERS3", "2198-S160-ERS3", "2198-P031", "2198-P070", "2198-P141", "2198-P208", "2198-CAPMOD-2240"], "name": "Kinetix 5700 Servo Drive", "whatItIs": "The Kinetix 5700 is a multi-axis servo drive system built around a shared DC bus. A separate 2198-Pxxx DC-bus power supply converts three-phase AC into DC, and zero-stacked single-axis (2198-Sxxx) and dual-axis (2198-Dxxx) inverters hang off that bus. It is Rockwell's flagship Integrated Motion over EtherNet/IP servo system, covering 1.6 to 60 kW.", "whenToUse": "Pick the 5700 for high-performance multi-axis machines where several axes share one DC bus and you want regenerative braking energy shared between axes. Pick it over the 5500 when you need a separate DC-bus supply, dual-axis inverters, or power above 14.6 kW; over the 5300/5100 when the machine has multiple coordinated axes; over the 6200/6500 for any new design, since the 5700 is the current flagship that replaces the 2094 platform.", "selection": "Size with Rockwell Motion Analyzer. DC-bus power supplies (400V-class, 324-528V AC rms input): 2198-P031 7 kW, 2198-P070 17 kW, 2198-P141 31 kW, 2198-P208 46 kW. Single-axis inverters: 2198-S086 29.7 kW / 60.8 A 0-pk, 2198-S130 44.9 kW / 91.9 A 0-pk, 2198-S160 60.1 kW / 120.2 A 0-pk. Dual-axis inverters: 2198-D006 1.7 kW / 3.5 A 0-pk, 2198-D012 3.4 kW / 7.0 A, 2198-D020 5.5 kW / 11.3 A, 2198-D032 8.9 kW / 18.3 A, 2198-D057 15.9 kW / 32.5 A 0-pk (23 A rms). Add a 2198-CAPMOD-2240 capacitor module (2240 uF, 100 A max) when the application needs extra bus capacitance. Bus-sharing groups: up to 25; all modules on the same shared bus must be in the same Bus Sharing Group.\n\nERS4 drive-based stopping functions: Timed Safe Stop 1 (SS1) and Monitored Safe Stop 1 (SS1). ERS4 controller-based stopping functions: SS1, Safe Stop 2 (SS2), Safe Operational Stop (SOS). ERS4 controller-based monitoring functions: Safely-limited Speed (SLS), Safety-limited Position (SLP), Safe Direction (SDI). ERS4 safety feedback function: Safety Feedback Interface (SFX), which provides safety position and velocity data to a GuardLogix safety controller for use in controller-based monitoring functions. ERS3 (series B or later) drive-based: Timed SS1 and STO with configurable delay. STO applies to ERS3 and ERS4. Stop categories: Stop Category 0 (Safe Torque-off) is immediate removal of power, an uncontrolled coast-to-stop; Stop Category 1 (Monitored SS1 and Timed SS1) keeps power available to the actuators to achieve the stop, then removes power when the configured stop is achieved. Timed SS1: motor speed is decelerated to zero and torque is removed once the maximum stop-time elapses. Controller-based functions run in a GuardLogix 5580 or Compact GuardLogix 5380 controller and use EtherNet/IP. Studio 5000 Logix Designer version 31.00 or later is required. Achievable ratings (Table 3): SS1 Monitored SIL 3, PLe; SS1 velocity check SIL 3, PLe; SS2 velocity check SIL 3, PLe; SOS SIL 3, PLe; SLS SIL 3, PLe (velocity check); SS2/SOS position check SIL 2, PLd; SDI SIL 2, PLd; SLP SIL 2, PLd. Single-feedback configurations provide up to SIL 2 (PLd); dual-feedback configurations provide up to SIL 3 (PLe) using velocity discrepancy checking, while position-check functions with dual feedback have up to SIL 2 (PLd). SIL 3, PLe ratings require two encoders. Hardwired STO is the default setting; integrated STO and the SS1 functions must be configured from Studio 5000 Logix Designer. Configuration categories in Ch3: Motion Safety instances, Module Properties General/Connection/Safety, Motion Safety Actions, Primary Feedback, Secondary Feedback, Scaling, Discrepancy Checking, STO, SS1 categories. Ch4 covers controller-based drive safety instructions including SFX. Ch5 troubleshoots safety faults (Safety Core, STO, SS1, SS2/SOS/SBC/SLS/SLP/SDI, Safety Feedback faults; Safety Fault Reset). Appendix B gives validation checklists for SS1, SS2, SOS, SLS, SLP, SDI, SFX, and SBC. SBC is Safe Brake Control (drives the motor holding brake as a safety function).", "wiring": {"power": "Three-phase 324-528V AC rms into the 2198-Pxxx DC-bus power supply through the IPD (AC input) connector, with the CED (contactor-enable) connector for the line contactor. 24V DC control, digital-input and motor-brake power comes from a customer-supplied 1606-XLxxx supply into the CP connector. DC bus and shunt connectors link the power supply to the inverters over the zero-stacked shared-bus connection system. AC line filters 2198-DB20-F / DB42-F / DB80-F / DB290-F are required for CE compliance. Install the included ground screw for grounded (wye) power configurations; remove it for ungrounded or high-impedance grounded power.", "feedback": "MF-A / MF-B motor feedback connectors and UFB-A / UFB-B 15-pin universal feedback connectors for master, load or auxiliary feedback. DSL feedback via the 2198-KITCON-DSL kit (VPC-Bxxxxx-Q, VPL/VPF/VPS motors). Hiperface feedback via the 2198-K57CK-D15M 15-pin kit (VPC-Bxxxxx-S, MP-Series MPL/MPM/MPF/MPS, HPK, MPAS/MPAR/MPAI, LDAT, LDC). Heidenhain EnDat for RDD and VPC-Bxxxxx-Y motors. Hiperface-to-DSL converter kit 2198-H2DCK for mixed motor types. Use 2090 motor power/brake and feedback cables.", "safety": "Hardwired Safe Torque Off plus integrated STO over EtherNet/IP on ERS3 drives. ERS4 drives add safe monitor functions per 2198-RM001: five safe stop functions (STO, SS1, SS2, SOS, SBC) and three safe monitoring functions (SLS, SDI, SLP). Safety rating is TUV certified, PLe and SIL CL3. STO connector pins include SB+, S1A, SCA, S2A, SBS1B, SCB, S2B. STO can be cascaded from drive to drive.", "network": "Dual-port EtherNet/IP; linear, DLR (ring) and star topologies. Use 1585J-M8CBJM-x shielded Ethernet cable and 0.15 m drive-to-drive cables; use a 1783-ETAP for single-port devices in a ring. Controllers: CompactLogix 5370/5380, ControlLogix 5570/5580, GuardLogix 5570, with 1756-EN2T / EN2TR / EN3TR EtherNet/IP modules. CIP Sync provides the motion time base."}, "configuration": [{"step": "Set the drive IP address from the LCD display: SETUP > NETWORK, choose STATIC IP (the default) or DHCP. Factory static IP is 192.168.1.1, subnet 255.255.255.0, gateway 192.168.1.1. Changes take effect only after a power cycle. The address can also be changed through the RSLinx Module Configuration dialog.", "screen": "Drive LCD display, SETUP > NETWORK", "parameter": "Static IP / DHCP; IP address", "value": "Factory static IP 192.168.1.1", "source": "2198-UM002D-EN-P Ch6; 2198-UM002E-EN-P Table 82"}, {"step": "Install the 2198 CIP Motion Kinetix 5500/5700 Add-On Profile (AOP) from the Product Compatibility and Download Center (rok.auto/pcdc). AOP rule: firmware 4.001 with Logix Designer v26/27 needs the AOP, v28+ does not; firmware 5.001 with v26/27/28 needs the AOP, v29+ does not; firmware 7.001+ with v29+ does not. Firmware 7.001 features need Logix Designer v29+.", "screen": "Product Compatibility and Download Center", "parameter": "AOP: 2198 CIP Motion Kinetix 5500/5700", "value": "Per firmware / Logix version table (Table 85)", "source": "2198-UM002D-EN-P Ch6 Table 85"}, {"step": "Create the project in Studio 5000 Logix Designer v26.00 or later: select the controller (CompactLogix 5370/5380 or ControlLogix 5570/5580), set the Revision in the pull-down, click Finish.", "screen": "Studio 5000 Logix Designer, New Project", "parameter": "Controller Revision", "value": "v26.00 or later", "source": "2198-UM002D-EN-P Ch6"}, {"step": "ControlLogix / GuardLogix only: add the EtherNet/IP module via I/O Configuration > New Module, select 1756-EN2T / EN2TR / EN3TR. In Module Definition set Time Sync Connection to 'Time Sync and Motion'.", "screen": "I/O Configuration > New Module; Module Definition", "parameter": "Time Sync Connection", "value": "Time Sync and Motion", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Enable controller time synchronization: Controller Properties > Date/Time tab > check Enable Time Synchronization (the controller becomes the CIP Sync Grandmaster).", "screen": "Controller Properties > Date/Time tab", "parameter": "Enable Time Synchronization", "value": "Checked", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Add the DC-bus power supply: right-click Ethernet > New Module, filter Motion + Allen-Bradley, select 2198-Pxxx, enter a Name and the Ethernet Address (Private Network), for example last octet 1. In the Power tab set Bus Configuration to Shared AC/DC and assign the Bus Sharing Group. Logix Designer enforces the shared-bus rules.", "screen": "New Module; Module Properties > Power tab", "parameter": "Bus Configuration; Bus Sharing Group", "value": "Shared AC/DC", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Add each inverter the same way: right-click Ethernet > New Module, select 2198-Sxxx / Dxxx-ERS3 (or -ERS4). In the Power tab set Bus Configuration to Shared DC and assign the same Bus Sharing Group as the power supply.", "screen": "New Module; Module Properties > Power tab", "parameter": "Bus Configuration; Bus Sharing Group", "value": "Shared DC", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Create the axis: Module Properties > Associated Axes tab > New Axis (AXIS_CIP_DRIVE is the default data type). Then configure Axis Properties: General, Motor (select the catalog motor), Scaling, Load, Actions, Exceptions, Parameter List.", "screen": "Module Properties > Associated Axes tab; Axis Properties", "parameter": "AXIS_CIP_DRIVE", "value": "New Axis", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Create the Motion Group: right-click Motion Groups > New Motion Group. In Properties > Axis Assignment tab move the axis from Unassigned to Assigned, then set the Attribute tab.", "screen": "Motion Groups > New Motion Group; Axis Assignment tab", "parameter": "Axis Assignment", "value": "Unassigned -> Assigned", "source": "2198-UM002D-EN-P Ch6"}, {"step": "Download the program and apply power. Verify the MOD and NET indicators and the axis state on the drive display (STANDBY, CONNECTING, CONFIGURING, SYNCING, PRECHARGE, RUNNING). The display shows the DC bus voltage, for example 680.0 V at 480 V input.", "screen": "Drive LCD display, Home screen", "parameter": "Axis state; DC bus voltage", "value": "RUNNING; e.g. DC BUS: 680.0V", "source": "2198-UM002D-EN-P Ch6"}], "commissioning": ["Verify mounting: modules zero-stacked with the tab and cutout aligned, ground screw installed for grounded (wye) power or removed for ungrounded / high-impedance grounded power.", "Verify wiring: IPD and CED on the DC-bus power supply, CP 24V control power present, DC bus and shunt connectors seated, motor power/brake and feedback cables correct.", "Verify the IP address on the LCD (factory 192.168.1.1) and that the controller time synchronization is enabled.", "Remove the load from every axis before running hookup tests (uncontrolled motion and brake release are possible).", "Run Hookup Tests in Axis Properties: enter the Test Distance (units from the Scaling tab), then run Marker (manual shaft rotation, marker detection), Commutation (third-party / custom PM motors with TTL-with-Hall or Sine-Cosine-with-Hall encoders not in the Motion Database), Motor Feedback (manual rotation, verify feedback wiring), and Motor and Feedback (drive rotates the motor; needs full bus power; run Motor Feedback first).", "On each test: Start, wait for Test State Executing to become Passed, confirm the forward direction Yes, then Accept Test Results. The LCD shows TESTING, for example DC BUS: 680.0V.", "On a hookup failure, verify the DC bus voltage, the Scaling values, and the motor power and feedback wiring.", "Run the load-observer tuning or autotune, enable the drive with MSO then MSF for a few seconds, and listen for squealing before putting the machine into service.", "Verify there are no active faults on the display (FLT Sxx) or in Logix Designer, and verify the STO function."], "tuning": "PM motors use the load observer. In the Autotune tab set Application Type to Custom, Loop Response to Medium, Load Coupling to Rigid, with only Velocity Feedforward checked. In the Load tab check Use Load Ratio and set Load Ratio to 0. In the Observer tab set Configuration to 'Load Observer with Velocity Estimate'. Click Apply, then Yes; the gains are set automatically. Enable the drive with MSO then MSF for a few seconds and listen for squealing; if it squeals, go to Axis Properties > Load > Compliance and set the Torque Notch Filter Frequency (Hz). See MOTION-AT005 Motion System Tuning Application Techniques. Induction motors: Automatic FluxUpControl is recommended; remove the load first, then reattach and repeat. In the Autotune category set Travel Limit to 50.0 and Speed to 2.0 (example values from the manual), Direction defaults to Forward Uni-directional; click Start, wait for Executing to become Success, then Accept Tuned Values; the tuned values populate the Loop and Load tables.", "faults": [{"code": "FLT S02", "meaning": "MTR COMMUTATION - illegal Hall state", "fix": "Check the Hall feedback wiring and use shielded cables; route feedback wiring away from noise sources."}, {"code": "FLT S03", "meaning": "MTR OVERSPEED FL - motor speed exceeded the factory maximum", "fix": "Check the control loop tuning."}, {"code": "FLT S10", "meaning": "INV OVERCURRENT - current exceeded the instantaneous hardware limit", "fix": "Verify the motor power wire gauge is correct for the drive."}, {"code": "FLT S16", "meaning": "GROUND CURRENT - ground current detected", "fix": "Check the motor power wiring; replace the motor if the fault persists."}, {"code": "FLT S22", "meaning": "AC POWER LOSS - AC input power lost", "fix": "Check the AC input voltage on all phases."}, {"code": "FLT S33", "meaning": "BUS UNDERVOLT FL - DC bus below the factory limit", "fix": "Monitor the AC line for glitches or line droop; check the incoming AC voltage."}, {"code": "FLT S45", "meaning": "FDBK COMM FL - motor feedback communication fault", "fix": "Check the motor feedback cable and connector."}, {"code": "FLT S47", "meaning": "FDBK DEVICE FAILURE - feedback device internal error (nn sub-codes; Hiperface sub-codes)", "fix": "Check the feedback cable continuity and the motor phasing U/V/W plus the Hiperface 15-pin connections; cycle control power; reduce shock and vibration; replace the motor if it continues."}, {"code": "FLT S49", "meaning": "BRAKE SLIP FLT - motor moved while the brake was engaged", "fix": "Check the motor brake."}, {"code": "FLT S54", "meaning": "POSN ERROR - excessive position error", "fix": "Verify the sizing of the drive and motor."}, {"code": "FLT S61", "meaning": "ENABLE INPUT - hardware enable input deactivated while the drive was enabled", "fix": "Check the drive enable input wiring."}, {"code": "S04", "meaning": "Motor overspeed, user limit. Speed exceeded the motor overspeed user limit.", "fix": "Check control loop tuning and increase the Motor Overspeed UL attribute value."}, {"code": "S05", "meaning": "Motor overtemperature, factory limit (nn 01 thermostat/thermistor, 02 encoder temperature sensor). Thermistor indicates the factory temperature limit was exceeded. VP/MP-Series only, not induction motors.", "fix": "Operate within the continuous torque rating, reduce ambient temperature, and add motor cooling."}, {"code": "S08", "meaning": "Motor thermal overload, user limit. Thermal model exceeded the Motor Thermal Overload User Limit.", "fix": "Modify the command profile and increase the Motor Thermal Overload UL attribute value."}, {"code": "S09", "meaning": "Motor phase loss. Torque Prove detected motor current below the limit set by the Torque Prove Current Limit.", "fix": "Check the motor connections."}, {"code": "S11", "meaning": "Inverter overtemperature, factory limit. Measured inverter temperature exceeded the factory limit.", "fix": "Modify the command profile, reduce ambient temperature, and verify airflow is not obstructed."}, {"code": "S13", "meaning": "Inverter thermal overload, factory limit. Thermal capacity exceeded the factory limit.", "fix": "Modify the command profile."}, {"code": "S14", "meaning": "Inverter thermal overload, user limit. Exceeded the user limit given by the Inverter Thermal Overload User Limit.", "fix": "Modify the command profile and increase the Inverter Thermal Overload UL attribute value."}, {"code": "S15", "meaning": "Converter overcurrent, DC-bus power supply / iTRAK power supply. Measured converter current exceeded the factory limit.", "fix": "Reduce the number of drives in the same bus group, reduce the number of capacitor modules, and verify iTRAK power supply requirements."}, {"code": "S18", "meaning": "Converter overtemperature, factory limit. Measured converter temperature exceeded the factory limit.", "fix": "Reduce the drives in the bus group, modify the command profile of the inverters in the bus group, reduce ambient temperature, verify airflow is not obstructed, and verify iTRAK requirements."}, {"code": "S20", "meaning": "Converter thermal overload, factory limit. Converter thermal model exceeded factory capacity (110%).", "fix": "Reduce the drives in the bus group, reduce the duty cycle, and verify iTRAK requirements."}, {"code": "S21", "meaning": "Converter thermal overload, user limit. Exceeded the Converter Thermal Overload User Limit.", "fix": "Reduce the drives in the bus group, reduce the duty cycle, increase the Converter Thermal Overload UL attribute value, and verify iTRAK requirements."}, {"code": "S23", "meaning": "AC single phase loss. Single AC input phase lost.", "fix": "Check the AC input voltage on all phases."}, {"code": "S25", "meaning": "Converter precharge failure. Pre-charge circuit detected the DC bus did not reach the factory voltage after charging.", "fix": "Check the AC input voltage on all phases, check the input power wiring, replace the power supply or drive if the fault persists, and verify iTRAK cable wiring."}, {"code": "S27", "meaning": "Bus regulator overtemperature, factory limit. Digital input assigned to the shunt thermal switch OK asserted LOW.", "fix": "Check the digital input wiring, check the digital input assignments, check the shunt power configuration in Logix Designer, reduce regenerative energy, and add a larger external shunt resistor or an active brake module."}, {"code": "S29", "meaning": "Bus regulator thermal overload, factory limit. Shunt thermal model exceeded the factory thermal capacity.", "fix": "Modify the duty cycle, add an external shunt, and add a capacitor module."}, {"code": "S30", "meaning": "Bus regulator thermal overload, user limit. Exceeded the Bus Regulator Thermal Overload User Limit.", "fix": "Modify the duty cycle, add an external shunt, increase the Bus Regulator Thermal Overload UL attribute value, and add a capacitor module."}, {"code": "S31", "meaning": "Bus regulator failure. Shunt circuit detected a shorted shunt resistor.", "fix": "Check for shorts in the shunt connector, unplug the shunt connector and measure the resistance, and replace the power supply if shorted."}, {"code": "S32", "meaning": "Bus capacitor module failure. Digital input assigned to the capacitor module OK asserted LOW.", "fix": "Check the digital input wiring, check the digital input assignments, and replace the capacitor module if necessary."}, {"code": "S34", "meaning": "Bus undervoltage, user limit. DC bus below the user limit given by the Bus Undervoltage User Limit.", "fix": "Verify incoming AC, monitor for glitches or line droop, install a UPS, increase the Bus Undervoltage UL attribute value, and verify iTRAK cable wiring."}, {"code": "S35", "meaning": "Bus overvoltage, factory limit. DC bus above the factory limit.", "fix": "Change the decel or motion profile of some or all drives on the DC bus, unplug the shunt connector and measure the resistance, add an external shunt resistor or an active brake module, replace the DC-bus power supply if the shunt is open, and verify iTRAK wiring."}, {"code": "S37", "meaning": "Bus power loss. DC-bus voltage below the bus power loss threshold for more than 50 ms.", "fix": "Verify incoming AC, increase the Power Loss Threshold Attribute, monitor for glitches or line droop, and install a UPS. When Power Loss Threshold Attribute ID#628 is 0, the default 23.1% is used, equal to a 150V DC droop from the nominal 650V DC."}, {"code": "S38", "meaning": "Fuse blown (nn 00 non user-replaceable fuse, 01 user-replaceable fuse, iTRAK only). Internal DC-bus power fuse blown.", "fix": "Return the drive for repair if the fault continues, verify the output power wiring (iTRAK), and replace the fuse."}, {"code": "S40", "meaning": "Bus power sharing fault. Power supply/RPS sharing the DC-bus requested the module stop consuming power.", "fix": "Check the fault condition on the DC-bus power supply and install a UPS."}, {"code": "S41", "meaning": "Feedback signal noise, factory limit. Illegal state transitions of motor AQB encoder signals exceeded the factory limit; feedback wiring open, shorted, or missing.", "fix": "Verify motor feedback wiring is not open, shorted, or missing, use shielded cables, route feedback away from noise, check grounds, and replace the motor or encoder."}, {"code": "S43", "meaning": "Feedback signal loss, factory limit. Detected voltage levels of A/B channel signals below the Feedback Signal Loss factory limit; wiring open, shorted, or missing.", "fix": "Verify motor feedback wiring is not open, shorted, or missing, use shielded cables, route feedback away from noise, check grounds, and replace the motor or encoder."}, {"code": "S44", "meaning": "Feedback signal loss, user limit. Sub-code indicates which supported feedback channel is reporting.", "fix": "Same as FLT S43: verify motor feedback wiring, use shielded cables, route feedback away from noise, check grounds, and replace the motor or encoder."}, {"code": "S46", "meaning": "Motor feedback data loss, user limit. Consecutive missed or corrupted serial packets exceeded the user limit.", "fix": "Consult the Possible Solutions for FLT S47."}, {"code": "S50", "meaning": "Position hardware overtravel. Axis beyond the digital input travel limit, positive direction.", "fix": "Check the digital input and the axis position."}, {"code": "S51", "meaning": "Negative hardware overtravel. Axis beyond the digital input travel limit, negative direction.", "fix": "Check the digital input and the axis position."}, {"code": "S55", "meaning": "Excessive velocity error. Velocity error exceeded the Velocity Error Tolerance for the Velocity Error Tolerance Time.", "fix": "Check velocity loop tuning, reduce acceleration, verify sizing, check motor power wiring, and increase the Velocity Error Tolerance and/or Time attribute values."}, {"code": "S56", "meaning": "Overtorque limit. Torque above the user-defined maximum for the Overtorque Limit Time.", "fix": "Verify the Torque Trim value, verify the motion profile, verify sizing, and increase the Overtorque Limit and/or Time attribute values."}, {"code": "S57", "meaning": "Undertorque limit. Torque below the user-defined minimum for the Undertorque Limit Time.", "fix": "Verify the motion profile, verify sizing, and decrease the Overtorque Limit and/or Time attribute values."}, {"code": "M02", "meaning": "Motor voltage mismatch. Configured drive voltage greater than the motor rated voltage, for example a 400V-class drive with a 200V-class motor.", "fix": "Set the drive voltage lower or replace the motor with one of matching voltage rating."}, {"code": "M07", "meaning": "Feedback incremental count error. Periodic check of incremental encoder position versus absolute position or Hall edges out of tolerance.", "fix": "Verify motor feedback wiring is correct and not open, shorted, or missing, use shielded cables, route feedback away from noise, check grounds, and replace the motor or encoder."}, {"code": "M12", "meaning": "Converter precharge overload, factory limit. Thermal model for the precharge resistor detected precharge capacity exceeded the factory limit.", "fix": "Reduce the number of modules in the same bus group, reduce the frequency of AC power cycling, and remove capacitor modules."}, {"code": "M26", "meaning": "Runtime error. Firmware unrecoverable runtime error.", "fix": "Cycle control power, reset the drive, and return the drive for repair if the fault continues."}, {"code": "M28", "meaning": "Safety communication. Communications with the safety hardware within the drive failed.", "fix": "Cycle control power, reset the drive, and return the drive for repair if the fault continues."}, {"code": "INIT M01", "meaning": "INIT FLT: smart encoder data corruption. Data stored in the encoder has a checksum error.", "fix": "Cycle control power; return the motor for repair if the fault continues."}, {"code": "INIT M02", "meaning": "INIT FLT: motor data range error (nn 01-16 DATA_RANGE_*).", "fix": "Cycle control power; return the motor for repair if the fault continues."}, {"code": "INIT M03", "meaning": "INIT FLT: motor feedback communication startup. Communications with the encoder could not be established.", "fix": "Cycle control power, check the motor feedback connector, check motor power and feedback shield terminations, and return the motor for repair if the fault continues."}, {"code": "INIT M06", "meaning": "INIT FLT: motor absolute startup speed. Absolute encoder could not determine position after powerup due to speed above 100 rpm.", "fix": "Make sure the motor shaft is not moving during power-up."}, {"code": "INIT M14", "meaning": "INIT FLT: invalid safety firmware. Loaded Safety firmware is not compatible with the drive firmware.", "fix": "Cycle control power and update the drive firmware."}, {"code": "INIT M20", "meaning": "INIT FLT: unknown module. Product code of the power board is invalid.", "fix": "Cycle control power and reset the drive."}, {"code": "INIT M21", "meaning": "INIT FLT: factory configuration error. Factory configuration data is missing or invalid.", "fix": "Cycle control power and reset the drive."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2198-um002_-en-p.pdf", "sources": ["https://www.manualslib.com/manual/1590695/Allen-Bradley-Kinetix-5700.html (Rockwell 2198-UM002E-EN-P Feb 2018, read via ManualsLib pages 143, 205, 216)", "https://manuals.plus/m/6afe5ef81df23888629afaab5abcf709f7e5568e48ad218f6d78dc8f87228c26 (Rockwell 2198-UM002L-EN-P Oct 2021)", "https://literature.rockwellautomation.com/idc/groups/literature/documents/at/safety-at153_-en-p.pdf (SAFETY-AT153B-EN-P, Kinetix 5500/5700 integrated safety)", "Local mirror copy read 2026-11-20: .research/pdfs/um002-5700.txt (Rockwell 2198-UM002D-EN-P Nov 2016, 364 pp)", "https://www.scribd.com/document/732376667/2198-rm001-en-p (Scribd, 2198-RM001E-EN-P Aug 2022 full text)", "Manual revisions \u2014 2198-UM002I-EN-P (Nov 2019) Summary of Changes vs UM002D: added references to Knowledgebase Answer ID 1091727 for fault codes and descriptions (pp. 12, 277); added Kinetix 5700 compatibility with 2090-CSxM1xxxxVAxx (PVC) and 2090-CSBM1xxxxLFxx (halogen-free PUR) single motor cables; added compatibility with VPC-B3004x-M servo motors with multiturn encoder; Kinetix 5700 drive Series Change (p. 16). 2198-UM002L-EN-P (Oct 2021) also exists: it links fault codes to the 2198-RD003 spreadsheet, with a History of Changes in Appendix G p.441. UM002Q changes were NOT found; that part remains unverified.", "https://rexelcanada.a.bigcontent.io/v1/static/ALB2198KITCONRP088_1_P_PROD_SPEC_ALB2198KITCONRP088CutSheeten1 (Rexel, 2198-UM002I-EN-P Summary of Changes)"], "tbd": ["2198-UM002Q changes vs UM002I (Nov 2019) \u2014 UM002Q not found in any readable source \u2014 source needed: 2198-UM002Q-EN-P"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-6000", "category": "servo-drive", "family": "Kinetix 6000", "catalogNumbers": ["2094-AC05-MP5", "2094-AC05-M01", "2094-AC09-M02", "2094-AC16-M03", "2094-AC32-M05", "2094-BC01-MP5", "2094-BC01-M01", "2094-AMP5", "2094-AM01", "2094-AM02", "2094-AM03", "2094-AM05", "2094-BSP2", "2094-SEPM-B24-S"], "name": "Kinetix 6000 Servo Drive", "whatItIs": "The Kinetix 6000 is the original modular multi-axis sercos servo system on the Bulletin 2094 power rail, 3 to 45 kW (4 to 49 A). An Integrated Axis Module (IAM, converter plus inverter) and Axis Modules (AM, inverter only) share a DC common bus; the -S suffix means the module has Safe Torque Off. The 6000M IDM system uses the IPIM 2094-SEPM-B24-S (400V-class, 15 kW, 24 A rms) driving up to 16 IDM units.", "whenToUse": "Legacy sercos machines only. The migration target is the Kinetix 5700 (migration guide 2198-AP007). Do not specify the 6000 for new designs. Discontinued 31 December 2023. (Kinetix 300/350 were discontinued 17 July 2023 to 31 July 2024; Kinetix 6200/6500 modules 31 December 2023 to 31 December 2025; Ultra3000 during 2022; Kinetix 2000 31 December 2022.)", "selection": "IAM 200V: 2094-AC05-MP5 3 kW converter / 5 A inverter; AC05-M01 3 kW / 9 A; AC09-M02 6 kW / 15 A; AC16-M03 11 kW / 24 A; AC32-M05 23 kW / 49 A. IAM 400V: BC01-MP5 6 kW / 4 A; BC01-M01 6 kW / 9 A; BC02-M02, BC04-M03, BC07-M05 (ratings to be verified in KNX-TD005). AM modules: 2094-AMP5, AM01, AM02, AM03, AM05, BMP5 and others. Shunt module 2094-BSP2; slot filler 2094-PRF; IPIM 2094-SEPM-B24-S.\n\n400V-class IAM ratings (2094-UM001M Ch1 Table 3): 2094-BC02-M02(-S) is 400V-class, 15 kW converter, 15 A inverter; 2094-BC04-M03(-S) is 400V-class, 28 kW converter, 30 A inverter; 2094-BC07-M05(-S) is 400V-class, 45 kW converter, 49 A inverter. Three-phase input 360-480V. For 460V (series B and later) IAM/AM modules, the peak inverter current rating can be configured for 250% of continuous inverter current on BC01/BC02/BC04, and 200% on BC07 (Peak Enhancement Specifications, p.59). Additional power specifications are in KNX-TD005.", "wiring": {"power": "Three-phase AC to the IAM converter; separate AC control power to the IAM; DC common bus to the AM modules; DC-bus fuses per the common-bus rules (both lines between the DC bus terminal block and each follower IAM when wiring to more than one follower).", "feedback": "Motor feedback via the MF connector on the control module (Hiperface, TTL incremental, sine/cosine per the 2094 family); auxiliary feedback via the auxiliary feedback connector.", "safety": "Modules with the -S suffix include Safe Torque Off; see the 2094 safety reference manuals.", "network": "sercos only, via 1756-M03SE / M08SE / M16SE, 1768-M04SE, 1784-PM16SE modules; fiber-optic sercos cables (Bulletin 2090)."}, "configuration": [{"step": "Set the base node address with the sercos Node Address switch (01-99, most significant digit left, least significant digit right, +/- switches). Cycle control power; the address takes effect only after initialization. Node addresses begin at the IAM and increment left to right, and must be unique per IAM on the same sercos module.", "screen": "IAM Node Address switch", "parameter": "Base node address", "value": "01-99, unique per IAM", "source": "2094-UM001A-EN-P Ch6"}, {"step": "Set the sercos baud rate with DIP switches 2 and 3 (4 or 8 Mbps). Set the optical power High with DIP switch 1. The 6000M IDM supports only 8 Mbps (hardwired).", "screen": "Control module DIP switches 1, 2, 3", "parameter": "sercos baud rate; optical power", "value": "4 or 8 Mbps; High", "source": "2094-UM001A-EN-P Ch6"}, {"step": "Add the sercos module in RSLogix 5000: 1756-M03SE up to 3 axes, 1756-M08SE up to 8 axes, 1756-M16SE / 1784-PM16SE up to 16 axes, 1768-M04SE up to 4 axes.", "screen": "RSLogix 5000, I/O Configuration > New Module", "parameter": "sercos module", "value": "Per axis count", "source": "2094-UM001A-EN-P Ch6"}, {"step": "Configure the IAM and AM modules and the control modules in RSLogix 5000.", "screen": "RSLogix 5000, module configuration", "parameter": "IAM / AM / control module", "value": "Per hardware", "source": "2094-UM001A-EN-P Ch6"}, {"step": "Configure the Motion Group and the axis properties for motor feedback.", "screen": "Motion Groups; Axis Properties", "parameter": "Axis properties", "value": "Per motor", "source": "2094-UM001A-EN-P Ch6"}, {"step": "Run the Hookup test in RSLogix 5000 to verify the motor and feedback wiring (a motor or feedback malfunction produces E65).", "screen": "Axis Properties > Hookup Tests", "parameter": "Hookup test", "value": "Passed", "source": "2094-UM001A-EN-P Ch6/Ch8"}, {"step": "Run the Autotune procedure in RSLogix 5000 (an autotune failure produces E66).", "screen": "Axis Properties > Autotune", "parameter": "Autotune", "value": "Success", "source": "2094-UM001A-EN-P Ch6/Ch8"}, {"step": "IAM control power AC input voltage: 95-264V rms single-phase (230V nominal). Nominal control power AC input current is 3 A at 220/230V AC and 6 A at 110/115V AC.", "screen": "IAM control power", "parameter": "Control power AC input voltage", "value": "95-264V rms single-phase (230V nominal)", "source": "2094-UM001A Appendix (specifications)"}, {"step": "Source the 230V IAM control power from the three-phase input power (line-to-line).", "screen": "IAM control power wiring", "source": "2094-UM001A Ch4 p.196"}], "commissioning": ["Verify control power is applied to the IAM and the ground jumper position matches the power type.", "Verify each IAM base node address is unique on its sercos module and takes effect after a control-power cycle.", "Verify the sercos fiber-optic cables are plugged in and the baud-rate DIP switches match the module configuration.", "Verify DC-bus fuses for common-bus followers.", "Run the Hookup test in RSLogix 5000, then the Autotune procedure.", "Check the seven-segment display: it shows E plus a two-digit code, flashing one digit at a time until cleared."], "tuning": "Autotune in RSLogix 5000; the load observer technique is described in MOTION-AT005 Motion System Tuning Application Techniques (verify the 6000-specific coverage in 2094-UM001 before relying on it).", "faults": [{"code": "E00", "meaning": "Blown fuse - a fuse was detected on the inverter PCB", "fix": "Return the module."}, {"code": "E04", "meaning": "Motor Overtemp - motor thermal switch tripped", "fix": "Operate within the continuous torque rating; ambient 40 C maximum; lower the ambient temperature or increase cooling."}, {"code": "E05", "meaning": "IPM Fault / Power Fault - overcurrent in the inverter power stage", "fix": "SHUTDOWN; check the motor and power wiring, then replace the module if the fault remains."}, {"code": "E07", "meaning": "Motor Feedback Loss - feedback wiring open, shorted, or missing", "fix": "Run the Hookup test in RSLogix 5000; check the motor encoder wiring."}, {"code": "E10", "meaning": "Bus Overvoltage - DC bus voltage too high", "fix": "Install a shunt module."}, {"code": "E11", "meaning": "Motor Feedback Fault / MotFeedbackFault - Hall state fault", "fix": "Check for bad connections; check the motor wiring at the MF connector."}, {"code": "E34", "meaning": "GroundShortFault - internal ground short", "fix": "Internal problem; if it remains, return the drive."}, {"code": "E43", "meaning": "Missing Drive Enable Input - active whenever the drive is enabled", "fix": "Check the drive enable input wiring."}, {"code": "E54", "meaning": "Current feedback HW fault", "fix": "Replace the module."}, {"code": "E65", "meaning": "Hookup procedure failed - motor or feedback malfunction", "fix": "Check the motor and feedback wiring; rerun the Hookup test."}, {"code": "E75", "meaning": "Shunt overload - IAM / AM / SM exceeded the shunt resistor continuous rating", "fix": "Reduce the deceleration rate or the duty cycle; add an external shunt."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2094-um001_-en-p.pdf", "sources": ["https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2094-um001_-en-p.pdf (official manual link; direct fetch blocked by Akamai - read from the archive.org mirror copy, local file .research/pdfs/um001-6000.txt, Rockwell 2094-UM001A-EN-P Sep 2006)", "Local mirror copy read 2026-11-20: .research/pdfs/um001-6000.txt (Rockwell 2094-UM001A-EN-P Sep 2006, archive.org djvu text, OCR messy)", "Local file: .research/pdfs/um001-6000-m.pdf (Rockwell 2094-UM001M-EN-P Dec 2022, partial excerpts)", "https://www.tdl-ia.com/insights/kinetix-servo-drive-migration-300-350-6000-ultra3000.html (TDL, citing Rockwell product pages read 27 October 2026)"], "tbd": ["Revision M (Dec 2022) changes vs revision A (2006) - source needed: 2094-UM001M-EN-P full text (only 5-16 page excerpts were found)"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-6200", "category": "servo-drive", "family": "Kinetix 6200", "catalogNumbers": ["2094-SE02F-M00-S0", "2094-SE02F-M00-S1", "2094-BC01-MP5-M", "2094-BC01-M01-M", "2094-BC02-M02-M", "2094-BC04-M03-M", "2094-BC07-M05-M", "2094-BMP5-M", "2094-BM01-M", "2094-BM02-M", "2094-BSP2", "2094-PRF"], "name": "Kinetix 6200 Servo Drive", "whatItIs": "The Kinetix 6200 is the sercos version of the Bulletin 2094 modular multi-axis system: the same power rail, IAM/AM power modules and control-module slot as the 6500, but with the sercos control module (2094-SE02F-M00-Sx) instead of EtherNet/IP. It shares the 2094-UM002 user manual with the 6500.", "whenToUse": "Pick the 6200 for existing sercos ControlLogix systems (1756-MxxSE, 1768-M04SE, 1784-PM16SE). Legacy only: new designs use the Kinetix 5700. Note: Kinetix 6500 EtherNet/IP control modules are not compatible with IAM/AM modules on the same Bulletin 2094 power rail as Kinetix 6000 or Kinetix 6200 sercos drives.", "selection": "Same IAM/AM ratings as the 6500: IAM 400V-class BC01-MP5-M 6 kW / 4 A (0-pk) through BC07-M05-M 45 kW / 49 A; AM BMP5-M 4 A, BM01-M 9 A, BM02-M 15 A. Control modules: -S0 = Safe Torque Off, -S1 = Safe Speed Monitor. Size with Rockwell Motion Analyzer.", "wiring": {"power": "Same as the 6500: 400V-class three-phase AC to the IAM; separate AC control power 95-264V AC rms single-phase, 47-63 Hz; control-power isolation via a step-down transformer required for all 460V applications; AC (EMC) line filter required for CE; DC common-bus fusing rules as for the 6500; ground jumper set only for ungrounded or high-impedance grounded power.", "feedback": "Same control-module feedback as the 6500: Stegmann Hiperface, generic TTL incremental, generic sine/cosine incremental, Tamagawa 17-bit serial, Heidenhain EnDat 2.1/2.2. EPWR 5V (5.1-5.4V, 300 mA max) and 9V (8.3-9.9V, 150 mA max) shared between motor and auxiliary feedback. Thermostat single-ended: under 500 ohms = no fault, over 10 kohms = fault. Absolute position retention is 4096 turns for the 6200 with Hiperface.", "safety": "Same as the 6500: IAM with Safe Speed Monitor (-M modules) plus Safe Torque-off; STO safety reference manual 2094-RM002 (SIL CL3, PLe, Category 4).", "network": "sercos via 1756-MxxSE, 1768-M04SE, 1784-PM16SE modules (IEC 61491 sercos over fiber-optic, Bulletin 2090 sercos fiber cables). Kinetix 6200 control modules use sercos for Logix configuration and EtherNet/IP for diagnostics and safety configuration."}, "configuration": [{"step": "Set the base node address with the Node Address switches (valid 001-099; left switch = most significant digit, right = least significant digit; use the +/- switches). Cycle control power to initialize; the address takes effect only after initialization. Node addresses increment left to right from the IAM inverter, and each node address must be unique when two or more IAMs are on the same sercos module.", "screen": "IAM Node Address switches", "parameter": "Base node address", "value": "001-099, unique per IAM", "source": "2094-UM002G-EN-P Ch6"}, {"step": "Set the sercos rate with DIP switches 1 and 2 (4 or 8 Mbps). The 6000M IDM supports only 8 Mbps (hardwired).", "screen": "Control module DIP switches 1 and 2", "parameter": "sercos rate", "value": "4 or 8 Mbps", "source": "2094-UM002G-EN-P Ch6"}, {"step": "Add the sercos module in RSLogix 5000: 1756-M03SE / L60M03SE up to 3 axes, 1756-M08SE up to 8 axes, 1756-M16SE / 1784-PM16SE up to 16 axes, 1768-M04SE up to 4 axes. Data rates 4/8 Mbps. Coarse update periods: 0.5 ms (up to 2 axes), 1 ms (up to 4 axes), 2 ms (up to 8 axes).", "screen": "RSLogix 5000, I/O Configuration > New Module", "parameter": "sercos module; coarse update period", "value": "Per axis count", "source": "2094-UM002G-EN-P Ch6"}, {"step": "Configure the IAM and control modules. Verify no power is applied and the communication cables are plugged in (sercos fiber-optic).", "screen": "RSLogix 5000, module configuration", "parameter": "IAM / control module", "value": "Per hardware", "source": "2094-UM002G-EN-P Ch6"}, {"step": "Configure the Motion Group and the axis properties for motor feedback.", "screen": "Motion Groups; Axis Properties", "parameter": "Axis properties", "value": "Per motor", "source": "2094-UM002G-EN-P Ch6"}, {"step": "Apply power, then test and tune the axes using the same hookup-test and autotune pattern as the 6500 (Chapter 7): Hookup Tests with a Test Distance of 2.0 revolutions, hardware enable at IOD-41, then Autotune with Travel Limit 5 and Speed 10.", "screen": "Axis Properties > Hookup Tests; Autotune category", "parameter": "Test Distance; Travel Limit; Speed", "value": "2.0 revolutions; 5; 10", "source": "2094-UM002G-EN-P Ch6/Ch7"}, {"step": "Verify the sercos fiber-optic links and the node addresses in RSLogix 5000, and verify there are no active faults (FLT Sxx).", "screen": "RSLogix 5000, module status", "parameter": "Node address; fault status", "value": "Per configuration", "source": "2094-UM002G-EN-P Ch6"}, {"step": "Configure the Logix5000 controller: apply power to the chassis with the sercos module, then File > New and configure the controller Type, Revision, Name, Chassis Type, and slot; click OK. Then Edit > Controller Properties > Date/Time tab and check Enable Time Synchronization (the controller becomes the CIP Sync Grandmaster; only one module in the chassis may be Grandmaster); click OK.", "screen": "Logix5000 controller configuration", "source": "2094-UM002G Ch6 pp. 148-151"}, {"step": "Configure the Logix5000 module: right-click I/O Configuration > New Module, expand Motion, and select 1756-MxxSE, 1756-L60M03SE, 1768-M04SE, or 1784-PM16SE; click OK. Enter a Name and the sercos module slot (leftmost slot is 0), check Open Module Properties, and click OK.", "screen": "I/O Configuration > New Module", "source": "2094-UM002G Ch6 pp. 148-151"}, {"step": "On the sercos Interface tab, verify the Data Rate matches DIP switch 1 (communication rate) as set on the control module, or choose Auto Detect.", "screen": "sercos Interface tab", "parameter": "Data Rate", "source": "2094-UM002G Ch6 pp. 148-151"}, {"step": "Set Cycle Time from the pull-down per the table: at 4 Mbps, 0.5 ms supports up to 2 axes, 1 ms up to 4 axes, 2 ms up to 8 axes (axes 9-16 not supported); at 8 Mbps, 0.5 ms supports up to 4 axes, 1 ms up to 8 axes, 2 ms up to 16 axes.", "screen": "sercos Interface tab", "parameter": "Cycle Time", "source": "2094-UM002G Ch6 pp. 148-151"}, {"step": "Set Transmit Power to High (default High; depends on cable length and distance to the next receiver and on cable type, glass or plastic). Set Transition to Phase to 4 (default; stops the ring in the specified phase). Click OK. Repeat for each Logix5000 module.", "screen": "sercos Interface tab", "parameter": "Transmit Power / Transition to Phase", "value": "High / 4", "source": "2094-UM002G Ch6 pp. 148-151"}, {"step": "Set the optical power DIP switches on the control module: SW2 ON is 4 Mbps, SW2 OFF is 8 Mbps; SW1 OFF is low power light intensity, SW1 ON is high power.", "screen": "Control module DIP switches 1 and 2", "parameter": "SW1 optical power / SW2 data rate", "value": "SW1 OFF low / ON high; SW2 ON 4 Mbps / OFF 8 Mbps", "source": "2094-UM002G Ch6 p.143"}, {"step": "Choose optical power by sercos cable type and length: Low for up to 15 m plastic cable (2090-SCxP) or up to 100 m glass cable (2090-SCVG); High for over 15 m plastic or over 100 m glass. Other factors: bulkhead connector attenuation and cable bending.", "screen": "Control module DIP switches 1 and 2", "parameter": "Optical power", "value": "Low <=15 m plastic / <=100 m glass; High above those lengths", "source": "2094-UM002G Ch6 p.143"}, {"step": "Repeat for each 2094-BMxx-M axis module with a 2094-SE02F-M00-Sx control module. Note: the 6000M IDM supports only 8 Mbps, hardwired.", "screen": "Control module DIP switches 1 and 2", "source": "2094-UM002G Ch6 p.143"}], "commissioning": ["Verify control power 95-264V AC is present and the ground jumper position matches the power type.", "Verify each IAM base node address is unique on its sercos module and takes effect after a control-power cycle.", "Verify the sercos fiber-optic cables are plugged in and the sercos rate DIP switches match the module configuration.", "Verify DC-bus fuses for common-bus followers (both lines, between the DC bus terminal block and each follower IAM).", "Verify the load is removed, then run the Hookup Tests per axis with the 24V enable applied at IOD-41.", "Run the autotune per axis and verify the tuned values populate the Loop and Load tables."], "tuning": "Same as the 6500: the load observer is available with firmware 2.001 or later (see MOTION-AT005). Verify the load is still removed first, then reattach it and repeat. In the Autotune category set Travel Limit to 5 and Speed to 10 (example values from the manual); Direction defaults to Forward Uni-directional. Apply the enable input at IOD-41, click Start, wait for the Autotune dialog to go from Executing to Success; the tuned values populate the Loop and Load tables. Bandwidth in Hz depends on the application.", "faults": [{"code": "FLT S02", "meaning": "MTR COMMUTATION - illegal Hall state (Hall inputs all high or all low)", "fix": "Check the Hall wiring at the motor feedback (MF) connector; check the 5V power supply to the encoder."}, {"code": "FLT S03", "meaning": "MTR OVERSPEED FL - motor speed exceeded 125% of the motor maximum", "fix": "Check the cables for noise; check the tuning."}, {"code": "FLT S05", "meaning": "MTR OVERTEMP FL nn - motor thermostat, thermistor, or encoder temperature sensor over the factory limit", "fix": "Operate within (not above) the continuous torque rating for the ambient temperature; lower the ambient temperature or increase motor cooling; check the motor wiring at the MF connector; verify the proper motor was selected."}, {"code": "FLT S07", "meaning": "MTR OVERLOAD FL - motor thermal model over the factory limit", "fix": "Modify the command profile; reduce speed or increase time."}, {"code": "FLT S10", "meaning": "INV OVERCURRENT - current over the instantaneous hardware limit", "fix": "Check the motor power cable for shorts; verify the windings are not shorted; verify the wire gauge."}, {"code": "FLT S16", "meaning": "GROUND CURRENT - ground current detected", "fix": "Check the motor power wiring and cable; replace the motor if the fault persists."}, {"code": "FLT S22", "meaning": "AC POWER LOSS - AC input power lost", "fix": "Check the AC input voltage on all phases."}, {"code": "FLT S33", "meaning": "BUS UNDERVOLT FL - DC bus below the factory limit", "fix": "Verify the incoming AC voltage; monitor for glitches or line droop; install a UPS."}, {"code": "S11", "meaning": "Inverter overtemperature, factory limit. Inverter thermal switch tripped.", "fix": "Cabinet ambient above rating: check cabinet temperature. Duty cycle: change the command profile. Airflow blocked: check airflow and re-route cables."}, {"code": "S13", "meaning": "Inverter thermal overload, factory limit. Thermal model for the power transistors over 110% of rating.", "fix": "Change the command profile."}, {"code": "S18", "meaning": "Converter overtemperature, factory limit. Converter thermal switch tripped; excessive heat in the power circuitry.", "fix": "Reduce acceleration rates, reduce duty cycle, increase the time permitted for motion, use a larger IAM power module, check vents and fan, and check that cooling is not restricted."}, {"code": "S20", "meaning": "Converter thermal overload, factory limit. Thermal model over rating.", "fix": "Reduce acceleration rates, reduce duty cycle, increase the time permitted for motion, and use a larger IAM power module."}, {"code": "S23", "meaning": "AC phase loss (nn 01 L1 missing, 02 L2 missing, 03 L3 missing). Some but not all phases absent; faulty AC line control equipment.", "fix": "Check the input AC voltage on all phases."}, {"code": "S25", "meaning": "Precharge failure. Converter pre-charge circuit detected the DC bus did not reach the appropriate voltage after charging.", "fix": "Low AC input voltage: check the input AC voltage on all phases. Internal malfunction: call your Rockwell Automation sales representative."}, {"code": "S29", "meaning": "Shunt thermal overload, factory limit. Thermal model for the shunt circuitry over rating.", "fix": "Use a properly sized shunt or modify the duty cycle."}, {"code": "S31", "meaning": "Shunt module fault. Shunt module in a multi-axis system has a fault.", "fix": "Over-temperature indicator steady red: refer to Temperature Fault Status Indicator p.212. Shunt-fault indicator steady red: refer to Shunt Fault Status Indicator p.212. Shunt module missing from the power rail: install the missing module or fill the empty slot with a slot-filler module."}, {"code": "S35", "meaning": "Bus overvoltage, factory limit. DC bus above the factory limit (460V above 820V); excessive regeneration.", "fix": "Change the decel or motion profile, use a larger system, and install a shunt module."}, {"code": "S38", "meaning": "Fuse blown. Blown fuse detected in the power structure.", "fix": "Call your Rockwell Automation sales representative to return the module for repair."}, {"code": "S41", "meaning": "MTR + AUX AQB state, factory limit. Illegal AQB state transitions exceeded the factory limit; feedback wiring open, shorted, or missing.", "fix": "Use shielded twisted-pair cables, route feedback away from noise, check grounds, and replace the motor or encoder."}, {"code": "S42", "meaning": "MTR + AUX AQB state, user limit. Illegal AQB state transitions exceeded the user limit.", "fix": "Use shielded twisted-pair cables, route feedback away from noise, check grounds, and replace the motor or encoder."}, {"code": "S43", "meaning": "MTR + AUX feedback loss, factory limit. Sin/cos sum below the factory limit, or TTL A/B below the factory limit; wiring open, shorted, or missing.", "fix": "Check motor encoder wiring and run the Hookup test in Logix Designer."}, {"code": "S45", "meaning": "MTR + AUX feedback communications, factory limit. Consecutive missed or corrupted serial packets exceeded the factory limit; communications not established with intelligent encoder.", "fix": "Verify motor selection, verify the motor supports automatic identification, verify motor encoder wiring, and consult the Possible Solutions for FLT S47."}, {"code": "S47", "meaning": "MTR + AUX encoder self test (nn 01-18, 28-35 listed in the table). Hiperface internal error.", "fix": "Check motor feedback cable connectivity and continuity, check motor phasing U/V/W and Hiperface 15-pin connections, review Electrical Noise Reduction p.38, cycle control power, check the feedback shield, reduce shock and vibration, upgrade firmware to rev 2.045 or later (6200) / 2.010 or later (6500), and replace the motor if the fault continues."}, {"code": "S50", "meaning": "Position hardware overtravel. Axis beyond physical travel limits, positive direction; dedicated overtravel input inactive.", "fix": "Check wiring and verify the motion profile."}, {"code": "S51", "meaning": "Negative hardware overtravel. Axis beyond physical travel limits, negative direction; dedicated overtravel input inactive.", "fix": "Verify the axis configuration in software."}, {"code": "S52", "meaning": "Position software overtravel, Kinetix 6200 drives only. Axis position exceeded the maximum software setting.", "fix": "Verify the motion profile and verify the overtravel settings are appropriate."}, {"code": "S53", "meaning": "Negative software overtravel, Kinetix 6200 drives only. Axis position exceeded the minimum software setting.", "fix": "Verify the motion profile and verify the overtravel settings are appropriate."}, {"code": "S54", "meaning": "Excessive position error. Position error limit exceeded.", "fix": "Increase the feedforward gain, increase the following error limit and time, check position loop tuning, verify sizing, verify mechanical integrity within specification, and check motor power wiring."}, {"code": "S55", "meaning": "Excessive velocity error (nn 00 referenced to velocity loop feedback, 01 referenced to nonvelocity feedback, dual-feedback). Velocity error exceeded the limit for a period.", "fix": "Increase the velocity error limit and time, check velocity loop tuning, verify sizing, verify mechanical integrity, check motor power wiring, and reduce acceleration."}, {"code": "S61", "meaning": "Enable input. Hardware enable input deactivated while the drive was enabled.", "fix": "Disable the Drive Enable Input fault (when enabling via software while the hardware input is inactive) and verify the Drive Enable hardware input is active whenever the drive is enabled through software."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2094-um002_-en-p.pdf", "sources": ["https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/2094-um002_-en-p.pdf?A294B07782706461C5B2847584965D99BE72C473C29B96& (Rockwell 2094-UM002G-EN-P Aug 2016, 336 pp)", "https://rexel-cdn.com/products/abe2094bc04m03mapdf.pdf?i=9B0D274E-E0DD-4001-B5EF-CBAE5DF689DC (2094-UM002G-EN-P Ch1 Table 2, IAM/AM catalog numbers)", "https://cdn3.servls.com/view/1141/1141930-kinetix_6200.pdf (Kinetix 6200/6500 Safe Torque-off Safety Reference Manual, 2094-RM002B-EN-P May 2012)", "Local mirror copy read 2026-11-20: .research/pdfs/um002-6200-6500.txt (Rockwell 2094-UM002G-EN-P Aug 2016)"], "tbd": [], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-6500", "category": "servo-drive", "family": "Kinetix 6500", "catalogNumbers": ["2094-EN02D-M01-S0", "2094-EN02D-M01-S1", "2094-BC01-MP5-M", "2094-BC01-M01-M", "2094-BC02-M02-M", "2094-BC04-M03-M", "2094-BC07-M05-M", "2094-BMP5-M", "2094-BM01-M", "2094-BM02-M", "2094-BSP2", "2094-PRF", "2094-SEPM-B24-S"], "name": "Kinetix 6500 Servo Drive", "whatItIs": "The Kinetix 6500 is a modular multi-axis servo system on the Bulletin 2094 power rail. An Integrated Axis Module (IAM, converter plus inverter) and Axis Modules (AM, inverter only) share a common DC bus on copper bus bars, and each power module takes a plug-in control module. The 6500 uses the EtherNet/IP control module (2094-EN02D-M01-Sx); the 6200 is the same hardware with a sercos control module.", "whenToUse": "Pick the 6500 for multi-axis machines on the 2094 rail with a Logix controller over EtherNet/IP. Pick it over the 5700 only for existing 2094 installations, since the 5700 is the current flagship for new designs. Pick it over the 6200 when the controller is EtherNet/IP rather than sercos.", "selection": "Size with Rockwell Motion Analyzer. IAM 400V-class (Table 2 of UM002G): 2094-BC01-MP5-M 6 kW converter / 4 A (0-pk) inverter; BC01-M01-M 6 kW / 9 A; BC02-M02-M 15 kW / 15 A; BC04-M03-M 28 kW / 30 A; BC07-M05-M 45 kW / 49 A. AM 400V-class: 2094-BMP5-M 4 A (0-pk), BM01-M 9 A, BM02-M 15 A. Control modules: -S0 = Safe Torque Off, -S1 = Safe Speed Monitor. Shunt module 2094-BSP2; slot filler 2094-PRF; IPIM 2094-SEPM-B24-S for the 6000M IDM system (up to 16 IDM units, Bulletin MDF).\n\nSafe Speed Monitor: the safety reference manual is Rockwell publication 2094-RM001.", "wiring": {"power": "400V-class three-phase AC to the IAM. Separate AC control power 95-264V AC rms single-phase, 47-63 Hz (control-power current: IAM only 0.56 A at 110/115V, 0.36 A at 220/230V; each additional AM adds current, up to 3.62 A / 2.31 A with 7 AMs). Control-power isolation via a step-down transformer is required for all 460V applications. An AC (EMC) line filter is required for CE. Maximum inrush 98 A 0-pk (8-axis, 230V, 50 C). DC common bus between IAMs: DC-bus fuses are required only when wiring to more than one follower IAM, in both lines of the DC bus between the DC bus terminal block and each follower IAM; with a non-2094 leader, fuses go in both lines between the leader and the follower IAM. Ground jumper: set only for ungrounded or high-impedance grounded power (remove the IAM from the rail, open the module, move the jumper); not needed for grounded power.", "feedback": "The control module accepts Stegmann Hiperface, generic TTL incremental, generic sine/cosine incremental, Tamagawa 17-bit serial, and Heidenhain EnDat 2.1/2.2 feedback. EPWR 5V (5.1-5.4V, 300 mA max) and 9V (8.3-9.9V, 150 mA max) are shared between the motor and auxiliary feedback. Thermostat single-ended: under 500 ohms = no fault, over 10 kohms = fault. Absolute position is available with multi-turn encoders only; retention is 2048 turns for the 6500 with Hiperface. Auto-configuration of intelligent absolute, high-resolution and incremental encoders is available only with Allen-Bradley motors.", "safety": "IAM modules with Safe Speed Monitor (-M modules) plus Safe Torque-off. See the Kinetix 6200 and Kinetix 6500 Safe Speed Monitoring and Safe Torque-off Safety Reference Manuals; the STO manual is 2094-RM002 (SIL CL3, Performance Level PLe, Category 4). RBM 2090-XBxx-xx resistive brake module with safety contactor. Digital Input 1 (IOD-41) defaults to Enable.", "network": "EtherNet/IP via 1756-ENxTx modules or CompactLogix 5370; linear, DLR (ring) and star topologies. The 6000M IPIM connects to EtherNet/IP for monitoring, diagnostics and firmware."}, "configuration": [{"step": "Logix Designer / RSLogix 5000 v18 or later is required. Right-click the Logix EtherNet/IP module > New Module, expand Motion, select 2094-EN02D-M01-Sx, click OK.", "screen": "I/O Configuration > New Module", "parameter": "Catalog number", "value": "2094-EN02D-M01-Sx", "source": "2094-UM002G-EN-P Ch7"}, {"step": "In the New Module dialog enter the Name and the Ethernet Address (Private Network); the address last octet is 1 and must match the base node address of the IAM. Click Change in Module Definition, then in the Power Structure pull-down choose the Bulletin 2094 power module (example: 2094-BC02-M02-M IAM). Click OK, Yes to confirm, then OK.", "screen": "New Module; Module Definition", "parameter": "Power Structure; Ethernet Address", "value": "2094-BCxx-Mxx-M IAM; last octet 1", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Right-click the module > Properties > Associated Axes tab > New Axis. In the New Tag dialog enter the axis Name (AXIS_CIP_DRIVE is the default data type) and click OK; the axis appears under Motion Groups > Ungrouped Axes as Axis 1. Axis 2 can be a Feedback Only axis using the auxiliary feedback port; each control module can appear as two axes.", "screen": "Module Properties > Associated Axes tab; New Tag dialog", "parameter": "AXIS_CIP_DRIVE", "value": "New Axis", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Digital Input tab: inputs 1-4 have default values and are reassignable or unassignable. Digital Input 1 defaults to Enable (IOD-41). To remove Enable from IOD-41, choose Unassigned.", "screen": "Module Properties > Digital Input tab", "parameter": "Digital Input 1", "value": "Enable (IOD-41) by default", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Power tab: set the Bus Regulator Action pull-down to Disable (disable the internal shunt), Shunt Regulator (internal or external: 1394 or 2094-BSP2; it will not accept Internal / 2094-BSP2 / 1394-SRxxxx if DC bus voltage is present without three-phase power), or Common Bus Follower (it will not accept this if three-phase or DC bus power is applied). Verify the proper 460V fuse is installed before applying power when using a 1394 external shunt with a 2094-BSP2.", "screen": "Module Properties > Power tab", "parameter": "Bus Regulator Action", "value": "Disable / Shunt Regulator / Common Bus Follower", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Additional Bus Capacitance field (v18+) / Add Bus Cap parameter (Appendix F): DC common-bus applications must calculate Total Bus Capacitance + Additional Bus Capacitance in the leader IAM.", "screen": "Module Properties > Power tab", "parameter": "Additional Bus Capacitance / Add Bus Cap", "value": "Calculated per Appendix F", "source": "2094-UM002G-EN-P Ch7; 2094-UM002E-EN-P p.153"}, {"step": "Create the Motion Group: right-click Motion Groups > New Motion Group, configure the motion group, then configure the auxiliary axis properties and the axis properties.", "screen": "Motion Groups > New Motion Group; Axis Properties", "parameter": "Motion Group", "value": "New Motion Group", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Apply power per the procedure on p.187 of UM002G. Verify the load is removed, then right-click the axis in the Motion Group > Properties > Hookup Tests and type 2.0 revolutions (or an appropriate value). Tests: Marker, Motor Feedback, Motor and Feedback (same definitions as the 5700).", "screen": "Axis Properties > Hookup Tests", "parameter": "Test Distance", "value": "2.0 revolutions", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Hardware enable: Digital Input 1 (IOD-41) defaults to Enable, so apply a 24V ENABLE signal only to the axis being tested (if Enable is Unassigned, skip this). Click the test tab, click Start; in the RSLogix 5000 Motor and Feedback Test dialog wait for Executing to become Passed, click OK, confirm the direction Yes. On failure verify the Bus status indicator is solid green during the test, the hardware enable was applied, and the Scaling values, then rerun.", "screen": "Axis Properties > Hookup Tests; Motor and Feedback Test dialog", "parameter": "Enable input IOD-41", "value": "24V ENABLE during test", "source": "2094-UM002G-EN-P Ch7"}, {"step": "The Kinetix 6000M IDM system consists of the IDM power interface module (IPIM) 2094-SEPM-B24-S plus up to 16 Bulletin MDF IDM units. The IPIM mounts on the Bulletin 2094 power rail and provides power and communication to the IDM units; it monitors power output and provides overload protection.", "screen": "Kinetix 6000M IDM system overview", "source": "2094-UM002G Ch1 p.24"}, {"step": "Connect the IPIM to the IDM units with 2090 IDM hybrid and network cables; use 889D/879D cables to connect digital inputs and sensors.", "screen": "Kinetix 6000M IDM system wiring", "source": "2094-UM002G Ch6 p.141"}, {"step": "Configure the IDM system following a procedure similar to Ch6: assign each IDM unit a node address and configure the IDM system in Logix Designer. The IPIM does NOT require configuration for IDM units to be configured in the sercos ring.", "screen": "Logix Designer IDM configuration", "source": "2094-UM002G Ch6 p.141"}, {"step": "Optionally include the IPIM in the project by connecting it to a configured Ethernet module in the Logix5000 chassis and adding it under the Ethernet module in the I/O configuration tree; an Add-On Profile is needed. IPIM status is then viewable in the configuration software and usable in the application program. The Ethernet connection is also used to upgrade IPIM firmware via ControlFLASH.", "screen": "I/O configuration tree (Ethernet module)", "source": "2094-UM002G Ch6 p.141"}, {"step": "System-specific procedures are in 2094-UM003 (Kinetix 6000M Integrated Drive-Motor User Manual). IDM system error codes are in Ch8 p.198. Note: the 6000M IDM supports only 8 Mbps, hardwired.", "screen": "Kinetix 6000M IDM system", "source": "2094-UM002G Ch6 p.143, Ch8 p.198"}], "commissioning": ["Verify control power 95-264V AC is present and the ground jumper position matches the power type (ungrounded / high-impedance grounded only).", "Verify the node address in Module Properties matches the base node address of the IAM.", "Verify DC-bus fuses for common-bus followers (both lines, between the DC bus terminal block and each follower IAM).", "Verify the load is removed, then run the Hookup Tests per axis (Marker, Motor Feedback, Motor and Feedback) with the 24V enable applied at IOD-41.", "Run the autotune per axis and verify the tuned values populate the Loop and Load tables.", "Verify there are no active faults (FLT Sxx) on the four-character display or in Logix Designer."], "tuning": "The load observer is available with firmware 2.001 or later (see MOTION-AT005). Verify the load is still removed first, then reattach it and repeat. In the Autotune category set Travel Limit to 5 and Speed to 10 (example values from the manual); Direction defaults to Forward Uni-directional. Apply the enable input at IOD-41, click Start, wait for the Autotune dialog to go from Executing to Success; the tuned values populate the Loop and Load tables. Bandwidth in Hz depends on the application. Click OK. On failure adjust the motor velocity, see the Logix motion module user manual, and rerun. Repeat per axis.", "faults": [{"code": "FLT S02", "meaning": "MTR COMMUTATION - illegal Hall state (Hall inputs all high or all low)", "fix": "Check the Hall wiring at the motor feedback (MF) connector; check the 5V power supply to the encoder."}, {"code": "FLT S03", "meaning": "MTR OVERSPEED FL - motor speed exceeded 125% of the motor maximum", "fix": "Check the cables for noise; check the tuning."}, {"code": "FLT S05", "meaning": "MTR OVERTEMP FL nn - motor thermostat, thermistor, or encoder temperature sensor over the factory limit (nn sub-code: 01 motor thermostat or thermistor, 02 encoder temperature sensor)", "fix": "Operate within (not above) the continuous torque rating for the ambient temperature; lower the ambient temperature or increase motor cooling; check the motor wiring at the MF connector; verify the proper motor was selected."}, {"code": "FLT S07", "meaning": "MTR OVERLOAD FL - motor thermal model over the factory limit", "fix": "Modify the command profile; reduce speed or increase time."}, {"code": "FLT S10", "meaning": "INV OVERCURRENT - current over the instantaneous hardware limit", "fix": "Check the motor power cable for shorts; verify the windings are not shorted; verify the wire gauge."}, {"code": "FLT S16", "meaning": "GROUND CURRENT - ground current detected", "fix": "Check the motor power wiring and cable; replace the motor if the fault persists."}, {"code": "FLT S22", "meaning": "AC POWER LOSS - AC input power lost", "fix": "Check the AC input voltage on all phases."}, {"code": "FLT S33", "meaning": "BUS UNDERVOLT FL - DC bus below the factory limit", "fix": "Verify the incoming AC voltage; monitor for glitches or line droop; install a UPS."}, {"code": "FLT S43", "meaning": "FDBK LOSS FL - feedback signal loss (A/B channel levels below the factory limit)", "fix": "Verify the feedback wiring is not open, shorted, or missing; use shielded cables; check grounds; replace the motor or encoder."}, {"code": "FLT S54", "meaning": "POSN ERROR - excessive position error", "fix": "Verify the sizing of the drive and motor."}, {"code": "S04", "meaning": "Motor overspeed, user limit. Speed exceeded the user velocity limits.", "fix": "Check cables for noise and check tuning."}, {"code": "S06", "meaning": "Motor overtemperature, user limit (nn 01 thermostat/thermistor, 02 encoder temperature sensor). Same as S05 but against the user limit.", "fix": "Same as FLT S05: check the motor encoder wiring, check for clogged vents or a defective fan, check ambient temperature, reduce acceleration rates, reduce duty cycle, and increase the time permitted for motion."}, {"code": "S08", "meaning": "Motor thermal overload, user limit. Thermal model exceeded the user-programmable limit.", "fix": "Change the command profile."}, {"code": "S11", "meaning": "Inverter overtemperature, factory limit. Inverter thermal switch tripped.", "fix": "Cabinet ambient above rating: check cabinet temperature. Duty cycle: change the command profile. Airflow blocked: check airflow and re-route cables."}, {"code": "S13", "meaning": "Inverter thermal overload, factory limit. Thermal model for the power transistors over 110% of rating.", "fix": "Change the command profile."}, {"code": "S14", "meaning": "Inverter thermal overload, user limit. Thermal model exceeded the user-programmable limit.", "fix": "Change the command profile."}, {"code": "S18", "meaning": "Converter overtemperature, factory limit. Converter thermal switch tripped; excessive heat in the power circuitry.", "fix": "Reduce acceleration rates, reduce duty cycle, increase the time permitted for motion, use a larger IAM power module, check vents and fan, and check that cooling is not restricted."}, {"code": "S20", "meaning": "Converter thermal overload, factory limit. Thermal model over rating.", "fix": "Reduce acceleration rates, reduce duty cycle, increase the time permitted for motion, and use a larger IAM power module."}, {"code": "S21", "meaning": "Converter thermal overload, user limit. Thermal model exceeded the user-programmable limit.", "fix": "Reduce acceleration rates, reduce duty cycle, increase the time permitted for motion, and use a larger IAM power module."}, {"code": "S23", "meaning": "AC phase loss (nn 01 L1 missing, 02 L2 missing, 03 L3 missing). Some but not all phases absent; faulty AC line control equipment.", "fix": "Check the input AC voltage on all phases."}, {"code": "S25", "meaning": "Precharge failure. Converter pre-charge circuit detected the DC bus did not reach the appropriate voltage after charging.", "fix": "Low AC input voltage: check the input AC voltage on all phases. Internal malfunction: call your Rockwell Automation sales representative."}, {"code": "S29", "meaning": "Shunt thermal overload, factory limit. Thermal model for the shunt circuitry over rating.", "fix": "Use a properly sized shunt or modify the duty cycle."}, {"code": "S30", "meaning": "Shunt thermal overload, user limit. Thermal model exceeded the user-programmable limit.", "fix": "Use a properly sized shunt or modify the duty cycle."}, {"code": "S31", "meaning": "Shunt module fault. Shunt module in a multi-axis system has a fault.", "fix": "Over-temperature indicator steady red: refer to Temperature Fault Status Indicator p.212. Shunt-fault indicator steady red: refer to Shunt Fault Status Indicator p.212. Shunt module missing from the power rail: install the missing module or fill the empty slot with a slot-filler module."}, {"code": "S35", "meaning": "Bus overvoltage, factory limit. DC bus above the factory limit (460V above 820V); excessive regeneration.", "fix": "Change the decel or motion profile, use a larger system, and install a shunt module."}, {"code": "S38", "meaning": "Fuse blown. Blown fuse detected in th
