ng."}, {"code": "E54", "meaning": "Current feedback HW fault", "fix": "Replace the module."}, {"code": "E65", "meaning": "Hookup procedure failed - motor or feedback malfunction", "fix": "Check the motor and feedback wiring; rerun the Hookup test."}, {"code": "E75", "meaning": "Shunt overload - IAM / AM / SM exceeded the shunt resistor continuous rating", "fix": "Reduce the deceleration rate or the duty cycle; add an external shunt."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2094-um001_-en-p.pdf", "sources": ["https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2094-um001_-en-p.pdf (official manual link; direct fetch blocked by Akamai - read from the archive.org mirror copy, local file .research/pdfs/um001-6000.txt, Rockwell 2094-UM001A-EN-P Sep 2006)", "Local mirror copy read 2026-11-20: .research/pdfs/um001-6000.txt (Rockwell 2094-UM001A-EN-P Sep 2006, archive.org djvu text, OCR messy)", "Local file: .research/pdfs/um001-6000-m.pdf (Rockwell 2094-UM001M-EN-P Dec 2022, partial excerpts)"], "tbd": ["Lifecycle status of the Kinetix 6000 - source needed: Rockwell lifecycle / product-compatibility pages", "Revision M (Dec 2022) changes vs revision A (2006) - source needed: 2094-UM001M-EN-P full text (only 5-16 page excerpts were found)", "400V IAM ratings BC02-M02 / BC04-M03 / BC07-M05 - source needed: KNX-TD005", "Exact AC control-power voltage range for the 6000 IAM - source needed: 2094-UM001 Ch4"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-6200", "category": "servo-drive", "family": "Kinetix 6200", "catalogNumbers": ["2094-SE02F-M00-S0", "2094-SE02F-M00-S1", "2094-BC01-MP5-M", "2094-BC01-M01-M", "2094-BC02-M02-M", "2094-BC04-M03-M", "2094-BC07-M05-M", "2094-BMP5-M", "2094-BM01-M", "2094-BM02-M", "2094-BSP2", "2094-PRF"], "name": "Kinetix 6200 Servo Drive", "whatItIs": "The Kinetix 6200 is the sercos version of the Bulletin 2094 modular multi-axis system: the same power rail, IAM/AM power modules and control-module slot as the 6500, but with the sercos control module (2094-SE02F-M00-Sx) instead of EtherNet/IP. It shares the 2094-UM002 user manual with the 6500.", "whenToUse": "Pick the 6200 for existing sercos ControlLogix systems (1756-MxxSE, 1768-M04SE, 1784-PM16SE). Legacy only: new designs use the Kinetix 5700. Note: Kinetix 6500 EtherNet/IP control modules are not compatible with IAM/AM modules on the same Bulletin 2094 power rail as Kinetix 6000 or Kinetix 6200 sercos drives.", "selection": "Same IAM/AM ratings as the 6500: IAM 400V-class BC01-MP5-M 6 kW / 4 A (0-pk) through BC07-M05-M 45 kW / 49 A; AM BMP5-M 4 A, BM01-M 9 A, BM02-M 15 A. Control modules: -S0 = Safe Torque Off, -S1 = Safe Speed Monitor. Size with Rockwell Motion Analyzer.", "wiring": {"power": "Same as the 6500: 400V-class three-phase AC to the IAM; separate AC control power 95-264V AC rms single-phase, 47-63 Hz; control-power isolation via a step-down transformer required for all 460V applications; AC (EMC) line filter required for CE; DC common-bus fusing rules as for the 6500; ground jumper set only for ungrounded or high-impedance grounded power.", "feedback": "Same control-module feedback as the 6500: Stegmann Hiperface, generic TTL incremental, generic sine/cosine incremental, Tamagawa 17-bit serial, Heidenhain EnDat 2.1/2.2. EPWR 5V (5.1-5.4V, 300 mA max) and 9V (8.3-9.9V, 150 mA max) shared between motor and auxiliary feedback. Thermostat single-ended: under 500 ohms = no fault, over 10 kohms = fault. Absolute position retention is 4096 turns for the 6200 with Hiperface.", "safety": "Same as the 6500: IAM with Safe Speed Monitor (-M modules) plus Safe Torque-off; STO safety reference manual 2094-RM002 (SIL CL3, PLe, Category 4).", "network": "sercos via 1756-MxxSE, 1768-M04SE, 1784-PM16SE modules (IEC 61491 sercos over fiber-optic, Bulletin 2090 sercos fiber cables). Kinetix 6200 control modules use sercos for Logix configuration and EtherNet/IP for diagnostics and safety configuration."}, "configuration": [{"step": "Set the base node address with the Node Address switches (valid 001-099; left switch = most significant digit, right = least significant digit; use the +/- switches). Cycle control power to initialize; the address takes effect only after initialization. Node addresses increment left to right from the IAM inverter, and each node address must be unique when two or more IAMs are on the same sercos module.", "screen": "IAM Node Address switches", "parameter": "Base node address", "value": "001-099, unique per IAM", "source": "2094-UM002G-EN-P Ch6"}, {"step": "Set the sercos rate with DIP switches 1 and 2 (4 or 8 Mbps). The 6000M IDM supports only 8 Mbps (hardwired).", "screen": "Control module DIP switches 1 and 2", "parameter": "sercos rate", "value": "4 or 8 Mbps", "source": "2094-UM002G-EN-P Ch6"}, {"step": "Add the sercos module in RSLogix 5000: 1756-M03SE / L60M03SE up to 3 axes, 1756-M08SE up to 8 axes, 1756-M16SE / 1784-PM16SE up to 16 axes, 1768-M04SE up to 4 axes. Data rates 4/8 Mbps. Coarse update periods: 0.5 ms (up to 2 axes), 1 ms (up to 4 axes), 2 ms (up to 8 axes).", "screen": "RSLogix 5000, I/O Configuration > New Module", "parameter": "sercos module; coarse update period", "value": "Per axis count", "source": "2094-UM002G-EN-P Ch6"}, {"step": "Configure the IAM and control modules. Verify no power is applied and the communication cables are plugged in (sercos fiber-optic).", "screen": "RSLogix 5000, module configuration", "parameter": "IAM / control module", "value": "Per hardware", "source": "2094-UM002G-EN-P Ch6"}, {"step": "Configure the Motion Group and the axis properties for motor feedback.", "screen": "Motion Groups; Axis Properties", "parameter": "Axis properties", "value": "Per motor", "source": "2094-UM002G-EN-P Ch6"}, {"step": "Apply power, then test and tune the axes using the same hookup-test and autotune pattern as the 6500 (Chapter 7): Hookup Tests with a Test Distance of 2.0 revolutions, hardware enable at IOD-41, then Autotune with Travel Limit 5 and Speed 10.", "screen": "Axis Properties > Hookup Tests; Autotune category", "parameter": "Test Distance; Travel Limit; Speed", "value": "2.0 revolutions; 5; 10", "source": "2094-UM002G-EN-P Ch6/Ch7"}, {"step": "Verify the sercos fiber-optic links and the node addresses in RSLogix 5000, and verify there are no active faults (FLT Sxx).", "screen": "RSLogix 5000, module status", "parameter": "Node address; fault status", "value": "Per configuration", "source": "2094-UM002G-EN-P Ch6"}], "commissioning": ["Verify control power 95-264V AC is present and the ground jumper position matches the power type.", "Verify each IAM base node address is unique on its sercos module and takes effect after a control-power cycle.", "Verify the sercos fiber-optic cables are plugged in and the sercos rate DIP switches match the module configuration.", "Verify DC-bus fuses for common-bus followers (both lines, between the DC bus terminal block and each follower IAM).", "Verify the load is removed, then run the Hookup Tests per axis with the 24V enable applied at IOD-41.", "Run the autotune per axis and verify the tuned values populate the Loop and Load tables."], "tuning": "Same as the 6500: the load observer is available with firmware 2.001 or later (see MOTION-AT005). Verify the load is still removed first, then reattach it and repeat. In the Autotune category set Travel Limit to 5 and Speed to 10 (example values from the manual); Direction defaults to Forward Uni-directional. Apply the enable input at IOD-41, click Start, wait for the Autotune dialog to go from Executing to Success; the tuned values populate the Loop and Load tables. Bandwidth in Hz depends on the application.", "faults": [{"code": "FLT S02", "meaning": "MTR COMMUTATION - illegal Hall state (Hall inputs all high or all low)", "fix": "Check the Hall wiring at the motor feedback (MF) connector; check the 5V power supply to the encoder."}, {"code": "FLT S03", "meaning": "MTR OVERSPEED FL - motor speed exceeded 125% of the motor maximum", "fix": "Check the cables for noise; check the tuning."}, {"code": "FLT S05", "meaning": "MTR OVERTEMP FL nn - motor thermostat, thermistor, or encoder temperature sensor over the factory limit", "fix": "Operate within (not above) the continuous torque rating for the ambient temperature; lower the ambient temperature or increase motor cooling; check the motor wiring at the MF connector; verify the proper motor was selected."}, {"code": "FLT S07", "meaning": "MTR OVERLOAD FL - motor thermal model over the factory limit", "fix": "Modify the command profile; reduce speed or increase time."}, {"code": "FLT S10", "meaning": "INV OVERCURRENT - current over the instantaneous hardware limit", "fix": "Check the motor power cable for shorts; verify the windings are not shorted; verify the wire gauge."}, {"code": "FLT S16", "meaning": "GROUND CURRENT - ground current detected", "fix": "Check the motor power wiring and cable; replace the motor if the fault persists."}, {"code": "FLT S22", "meaning": "AC POWER LOSS - AC input power lost", "fix": "Check the AC input voltage on all phases."}, {"code": "FLT S33", "meaning": "BUS UNDERVOLT FL - DC bus below the factory limit", "fix": "Verify the incoming AC voltage; monitor for glitches or line droop; install a UPS."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2094-um002_-en-p.pdf", "sources": ["https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/2094-um002_-en-p.pdf?A294B07782706461C5B2847584965D99BE72C473C29B96& (Rockwell 2094-UM002G-EN-P Aug 2016, 336 pp)", "https://rexel-cdn.com/products/abe2094bc04m03mapdf.pdf?i=9B0D274E-E0DD-4001-B5EF-CBAE5DF689DC (2094-UM002G-EN-P Ch1 Table 2, IAM/AM catalog numbers)", "https://cdn3.servls.com/view/1141/1141930-kinetix_6200.pdf (Kinetix 6200/6500 Safe Torque-off Safety Reference Manual, 2094-RM002B-EN-P May 2012)", "Local mirror copy read 2026-11-20: .research/pdfs/um002-6200-6500.txt (Rockwell 2094-UM002G-EN-P Aug 2016)"], "tbd": ["Logix sercos-module configuration steps beyond what was read - source needed: 2094-UM002G Ch6 full text", "Optical power DIP switch setting for the 6200 (verified for the 6000 only) - source needed: 2094-UM002G Ch6", "Full Table 87 fault list beyond the verified rows - source needed: 2094-UM002G Ch8", "6200 fault set is the same FLT Sxx Table 87 as the 6500 minus the '(Kinetix 6500 drives only)' UL variants (S04, S06, S08, S14, S21, S30) - verified from the table headings"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-6500", "category": "servo-drive", "family": "Kinetix 6500", "catalogNumbers": ["2094-EN02D-M01-S0", "2094-EN02D-M01-S1", "2094-BC01-MP5-M", "2094-BC01-M01-M", "2094-BC02-M02-M", "2094-BC04-M03-M", "2094-BC07-M05-M", "2094-BMP5-M", "2094-BM01-M", "2094-BM02-M", "2094-BSP2", "2094-PRF", "2094-SEPM-B24-S"], "name": "Kinetix 6500 Servo Drive", "whatItIs": "The Kinetix 6500 is a modular multi-axis servo system on the Bulletin 2094 power rail. An Integrated Axis Module (IAM, converter plus inverter) and Axis Modules (AM, inverter only) share a common DC bus on copper bus bars, and each power module takes a plug-in control module. The 6500 uses the EtherNet/IP control module (2094-EN02D-M01-Sx); the 6200 is the same hardware with a sercos control module.", "whenToUse": "Pick the 6500 for multi-axis machines on the 2094 rail with a Logix controller over EtherNet/IP. Pick it over the 5700 only for existing 2094 installations, since the 5700 is the current flagship for new designs. Pick it over the 6200 when the controller is EtherNet/IP rather than sercos.", "selection": "Size with Rockwell Motion Analyzer. IAM 400V-class (Table 2 of UM002G): 2094-BC01-MP5-M 6 kW converter / 4 A (0-pk) inverter; BC01-M01-M 6 kW / 9 A; BC02-M02-M 15 kW / 15 A; BC04-M03-M 28 kW / 30 A; BC07-M05-M 45 kW / 49 A. AM 400V-class: 2094-BMP5-M 4 A (0-pk), BM01-M 9 A, BM02-M 15 A. Control modules: -S0 = Safe Torque Off, -S1 = Safe Speed Monitor. Shunt module 2094-BSP2; slot filler 2094-PRF; IPIM 2094-SEPM-B24-S for the 6000M IDM system (up to 16 IDM units, Bulletin MDF).", "wiring": {"power": "400V-class three-phase AC to the IAM. Separate AC control power 95-264V AC rms single-phase, 47-63 Hz (control-power current: IAM only 0.56 A at 110/115V, 0.36 A at 220/230V; each additional AM adds current, up to 3.62 A / 2.31 A with 7 AMs). Control-power isolation via a step-down transformer is required for all 460V applications. An AC (EMC) line filter is required for CE. Maximum inrush 98 A 0-pk (8-axis, 230V, 50 C). DC common bus between IAMs: DC-bus fuses are required only when wiring to more than one follower IAM, in both lines of the DC bus between the DC bus terminal block and each follower IAM; with a non-2094 leader, fuses go in both lines between the leader and the follower IAM. Ground jumper: set only for ungrounded or high-impedance grounded power (remove the IAM from the rail, open the module, move the jumper); not needed for grounded power.", "feedback": "The control module accepts Stegmann Hiperface, generic TTL incremental, generic sine/cosine incremental, Tamagawa 17-bit serial, and Heidenhain EnDat 2.1/2.2 feedback. EPWR 5V (5.1-5.4V, 300 mA max) and 9V (8.3-9.9V, 150 mA max) are shared between the motor and auxiliary feedback. Thermostat single-ended: under 500 ohms = no fault, over 10 kohms = fault. Absolute position is available with multi-turn encoders only; retention is 2048 turns for the 6500 with Hiperface. Auto-configuration of intelligent absolute, high-resolution and incremental encoders is available only with Allen-Bradley motors.", "safety": "IAM modules with Safe Speed Monitor (-M modules) plus Safe Torque-off. See the Kinetix 6200 and Kinetix 6500 Safe Speed Monitoring and Safe Torque-off Safety Reference Manuals; the STO manual is 2094-RM002 (SIL CL3, Performance Level PLe, Category 4). RBM 2090-XBxx-xx resistive brake module with safety contactor. Digital Input 1 (IOD-41) defaults to Enable.", "network": "EtherNet/IP via 1756-ENxTx modules or CompactLogix 5370; linear, DLR (ring) and star topologies. The 6000M IPIM connects to EtherNet/IP for monitoring, diagnostics and firmware."}, "configuration": [{"step": "Logix Designer / RSLogix 5000 v18 or later is required. Right-click the Logix EtherNet/IP module > New Module, expand Motion, select 2094-EN02D-M01-Sx, click OK.", "screen": "I/O Configuration > New Module", "parameter": "Catalog number", "value": "2094-EN02D-M01-Sx", "source": "2094-UM002G-EN-P Ch7"}, {"step": "In the New Module dialog enter the Name and the Ethernet Address (Private Network); the address last octet is 1 and must match the base node address of the IAM. Click Change in Module Definition, then in the Power Structure pull-down choose the Bulletin 2094 power module (example: 2094-BC02-M02-M IAM). Click OK, Yes to confirm, then OK.", "screen": "New Module; Module Definition", "parameter": "Power Structure; Ethernet Address", "value": "2094-BCxx-Mxx-M IAM; last octet 1", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Right-click the module > Properties > Associated Axes tab > New Axis. In the New Tag dialog enter the axis Name (AXIS_CIP_DRIVE is the default data type) and click OK; the axis appears under Motion Groups > Ungrouped Axes as Axis 1. Axis 2 can be a Feedback Only axis using the auxiliary feedback port; each control module can appear as two axes.", "screen": "Module Properties > Associated Axes tab; New Tag dialog", "parameter": "AXIS_CIP_DRIVE", "value": "New Axis", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Digital Input tab: inputs 1-4 have default values and are reassignable or unassignable. Digital Input 1 defaults to Enable (IOD-41). To remove Enable from IOD-41, choose Unassigned.", "screen": "Module Properties > Digital Input tab", "parameter": "Digital Input 1", "value": "Enable (IOD-41) by default", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Power tab: set the Bus Regulator Action pull-down to Disable (disable the internal shunt), Shunt Regulator (internal or external: 1394 or 2094-BSP2; it will not accept Internal / 2094-BSP2 / 1394-SRxxxx if DC bus voltage is present without three-phase power), or Common Bus Follower (it will not accept this if three-phase or DC bus power is applied). Verify the proper 460V fuse is installed before applying power when using a 1394 external shunt with a 2094-BSP2.", "screen": "Module Properties > Power tab", "parameter": "Bus Regulator Action", "value": "Disable / Shunt Regulator / Common Bus Follower", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Additional Bus Capacitance field (v18+) / Add Bus Cap parameter (Appendix F): DC common-bus applications must calculate Total Bus Capacitance + Additional Bus Capacitance in the leader IAM.", "screen": "Module Properties > Power tab", "parameter": "Additional Bus Capacitance / Add Bus Cap", "value": "Calculated per Appendix F", "source": "2094-UM002G-EN-P Ch7; 2094-UM002E-EN-P p.153"}, {"step": "Create the Motion Group: right-click Motion Groups > New Motion Group, configure the motion group, then configure the auxiliary axis properties and the axis properties.", "screen": "Motion Groups > New Motion Group; Axis Properties", "parameter": "Motion Group", "value": "New Motion Group", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Apply power per the procedure on p.187 of UM002G. Verify the load is removed, then right-click the axis in the Motion Group > Properties > Hookup Tests and type 2.0 revolutions (or an appropriate value). Tests: Marker, Motor Feedback, Motor and Feedback (same definitions as the 5700).", "screen": "Axis Properties > Hookup Tests", "parameter": "Test Distance", "value": "2.0 revolutions", "source": "2094-UM002G-EN-P Ch7"}, {"step": "Hardware enable: Digital Input 1 (IOD-41) defaults to Enable, so apply a 24V ENABLE signal only to the axis being tested (if Enable is Unassigned, skip this). Click the test tab, click Start; in the RSLogix 5000 Motor and Feedback Test dialog wait for Executing to become Passed, click OK, confirm the direction Yes. On failure verify the Bus status indicator is solid green during the test, the hardware enable was applied, and the Scaling values, then rerun.", "screen": "Axis Properties > Hookup Tests; Motor and Feedback Test dialog", "parameter": "Enable input IOD-41", "value": "24V ENABLE during test", "source": "2094-UM002G-EN-P Ch7"}], "commissioning": ["Verify control power 95-264V AC is present and the ground jumper position matches the power type (ungrounded / high-impedance grounded only).", "Verify the node address in Module Properties matches the base node address of the IAM.", "Verify DC-bus fuses for common-bus followers (both lines, between the DC bus terminal block and each follower IAM).", "Verify the load is removed, then run the Hookup Tests per axis (Marker, Motor Feedback, Motor and Feedback) with the 24V enable applied at IOD-41.", "Run the autotune per axis and verify the tuned values populate the Loop and Load tables.", "Verify there are no active faults (FLT Sxx) on the four-character display or in Logix Designer."], "tuning": "The load observer is available with firmware 2.001 or later (see MOTION-AT005). Verify the load is still removed first, then reattach it and repeat. In the Autotune category set Travel Limit to 5 and Speed to 10 (example values from the manual); Direction defaults to Forward Uni-directional. Apply the enable input at IOD-41, click Start, wait for the Autotune dialog to go from Executing to Success; the tuned values populate the Loop and Load tables. Bandwidth in Hz depends on the application. Click OK. On failure adjust the motor velocity, see the Logix motion module user manual, and rerun. Repeat per axis.", "faults": [{"code": "FLT S02", "meaning": "MTR COMMUTATION - illegal Hall state (Hall inputs all high or all low)", "fix": "Check the Hall wiring at the motor feedback (MF) connector; check the 5V power supply to the encoder."}, {"code": "FLT S03", "meaning": "MTR OVERSPEED FL - motor speed exceeded 125% of the motor maximum", "fix": "Check the cables for noise; check the tuning."}, {"code": "FLT S05", "meaning": "MTR OVERTEMP FL nn - motor thermostat, thermistor, or encoder temperature sensor over the factory limit (nn sub-code: 01 motor thermostat or thermistor, 02 encoder temperature sensor)", "fix": "Operate within (not above) the continuous torque rating for the ambient temperature; lower the ambient temperature or increase motor cooling; check the motor wiring at the MF connector; verify the proper motor was selected."}, {"code": "FLT S07", "meaning": "MTR OVERLOAD FL - motor thermal model over the factory limit", "fix": "Modify the command profile; reduce speed or increase time."}, {"code": "FLT S10", "meaning": "INV OVERCURRENT - current over the instantaneous hardware limit", "fix": "Check the motor power cable for shorts; verify the windings are not shorted; verify the wire gauge."}, {"code": "FLT S16", "meaning": "GROUND CURRENT - ground current detected", "fix": "Check the motor power wiring and cable; replace the motor if the fault persists."}, {"code": "FLT S22", "meaning": "AC POWER LOSS - AC input power lost", "fix": "Check the AC input voltage on all phases."}, {"code": "FLT S33", "meaning": "BUS UNDERVOLT FL - DC bus below the factory limit", "fix": "Verify the incoming AC voltage; monitor for glitches or line droop; install a UPS."}, {"code": "FLT S43", "meaning": "FDBK LOSS FL - feedback signal loss (A/B channel levels below the factory limit)", "fix": "Verify the feedback wiring is not open, shorted, or missing; use shielded cables; check grounds; replace the motor or encoder."}, {"code": "FLT S54", "meaning": "POSN ERROR - excessive position error", "fix": "Verify the sizing of the drive and motor."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2094-um002_-en-p.pdf", "sources": ["https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/2094-um002_-en-p.pdf?A294B07782706461C5B2847584965D99BE72C473C29B96& (Rockwell 2094-UM002G-EN-P Aug 2016, 336 pp)", "https://www.manualsdir.com/manuals/580230/rockwell-automation-2094-en02d-m01-sx-kinetix-6200-and-kinetix-6500-modular-multi-axis-servo-drives-user-manual-2094-se02f-m00-sx-kinetix-6200-and-kinetix-6500-modular-multi-axis-servo-drives-user-manual-2094-bmxx-m-kinetix-6200-and-kinetix-6500-modular-m.html?page=153 (2094-UM002E-EN-P May 2012, bus regulator / Add Bus Cap)", "https://www.manualsdir.com/manuals/580230/rockwell-automation-2094-en02d-m01-sx-kinetix-6200-and-kinetix-6500-modular-multi-axis-servo-drives-user-manual-2094-se02f-m00-sx-kinetix-6200-and-kinetix-6500-modular-multi-axis-servo-drives-user-manual-2094-bmxx-m-kinetix-6200-and-kinetix-6500-modular-m.html?page=97 (2094-UM002E-EN-P, common bus fusing and ground jumper)", "https://rexel-cdn.com/products/abe2094bc04m03mapdf.pdf?i=9B0D274E-E0DD-4001-B5EF-CBAE5DF689DC (2094-UM002G-EN-P Ch1 Table 2, IAM/AM catalog numbers)", "https://cdn3.servls.com/view/1141/1141930-kinetix_6200.pdf (Kinetix 6200/6500 Safe Torque-off Safety Reference Manual, 2094-RM002B-EN-P May 2012)", "Local mirror copy read 2026-11-20: .research/pdfs/um002-6200-6500.txt (Rockwell 2094-UM002G-EN-P Aug 2016)"], "tbd": ["Safe Speed Monitor safety reference manual publication number (the STO manual is verified: 2094-RM002B-EN-P) - source needed: 2094-UM002G Additional Resources", "Full Table 87 / Table 101 fault list beyond the verified rows - source needed: 2094-UM002G Ch8", "6000M IDM system details (IPIM 2094-SEPM-B24-S) - source needed: 2094-UM002G Ch1/Ch6"], "sourceFile": "kinetix.json"}, {"id": "ab-powerflex-4-40", "category": "vfd", "family": "PowerFlex 4 / 40", "catalogNumbers": ["22A-A8P0N104", "22B-D4P0N104", "22B-B012N104"], "name": "PowerFlex 4 / 40 AC Drive", "whatItIs": "The smallest and most cost-effective members of the PowerFlex family (bulletins 22A and 22B). Together they cover 0.2 to 11 kW (0.25 to 15 Hp) in 120, 240, 480 and 600V classes, for speed control of fans, pumps, conveyors, machine tools and material handling. The PowerFlex 4 is the basic V/Hz drive (max 5 Hp); the PowerFlex 40 adds sensorless vector control, PID, preset speeds, MOP and more I/O (max 15 Hp). Rockwell discontinued the PowerFlex 4 and 40 on 30 June 2025; the listed replacements are the PowerFlex 523 (for the 4) and the PowerFlex 525 (for the 40).", "whenToUse": "These drives are now a legacy/maintenance topic: pick them only when servicing an existing installation. For a new small machine, pick the PowerFlex 523 instead of a 4 and the PowerFlex 525 instead of a 40. Within the family, pick the 40 over the 4 when you need sensorless vector control, PID, 8 preset speeds, MOP, flying start, or RS-485 network control with more than basic I/O. Pick the 4 only for the simplest fixed-speed or potentiometer-controlled job.", "selection": "Size by motor FLA against the drive rated output amps in 22-TD001. Maximum ratings: 1.5 Hp at 115V 1-phase, 3 Hp at 230V 1-phase, 5 Hp at 230V 3-phase and 5 Hp at 460V 3-phase for the PowerFlex 4; 10 Hp at 230V 3-phase, 15 Hp at 460V 3-phase and 15 Hp at 600V 3-phase for the PowerFlex 40. Voltage classes: 120V 1-phase, 240V 1- or 3-phase, 480V 3-phase, 600V 3-phase. Both have a fixed integral keypad with a potentiometer; the 40 adds an optional remote HIM. Select fuses and circuit breakers from the 22-TD001 tables.", "wiring": {"power": "Three-phase input to R/L1, S/L2, T/L3 (single-phase input uses R/L1, S/L2 on the V and A voltage classes); motor to U/T1, V/T2, W/T3; DC+ and DC- bus terminals; PE ground. PowerFlex 40/40P Frame C drives have P1/P2 terminals for a DC bus inductor; the 525 replacement does not. Wait 3 minutes after removing power before servicing (DC bus discharge).", "feedback": "Analog speed reference only: 0-10V input and 4-20 mA input on the control terminal block, plus the integral keypad potentiometer. No encoder feedback on the 4/40 (the 40P positioning variant had separate encoder terminals). The 40's sensorless vector control works from the motor model, not from a feedback device.", "safety": "No built-in Safe Torque-Off. The 40P variant used a DriveGuard 20A-DG01 option board for a safety input; on the 525 replacement the equivalent is the built-in STO on S1, S2 and S+. On the 4/40 the hardware enable is an ENBL jumper: with the jumper removed, terminal 01 becomes a hardware enable.", "network": "Built-in RS-485 (DSI) port with Modbus RTU. Network adapters in the 22-COMM family (DeviceNet, EtherNet/IP) fit the DSI port; confirm the exact adapter catalog in 22-TD001. On the 525 replacement, RS-485 stays on the DSI port and EtherNet/IP is embedded."}, "configuration": [{"step": "Enter motor nameplate volts", "screen": "Integral keypad, Basic Program group", "parameter": "P031 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "22B-UM001G parameter cross-reference; 22B-QS001A"}, {"step": "Enter motor nameplate frequency", "screen": "Integral keypad, Basic Program group", "parameter": "P032 [Motor NP Hertz]", "value": "Motor nameplate rated frequency", "source": "22B-UM001G parameter cross-reference; 22B-QS001A"}, {"step": "Enter motor overload current", "screen": "Integral keypad, Basic Program group", "parameter": "P033 [Motor OL Current]", "value": "Motor nameplate overload current; drives the F007 electronic overload", "source": "22B-UM001G Chapter 4 fault actions"}, {"step": "Set maximum frequency", "screen": "Integral keypad, Basic Program group", "parameter": "P035 [Maximum Freq]", "value": "Top output frequency for the application", "source": "22B-UM001G Chapter 3"}, {"step": "Set speed reference source", "screen": "Integral keypad, Basic Program group", "parameter": "P038 [Speed Reference]", "value": "0 = Drive Pot (default), 1 = InternalFreq, 2 = 0-10V Input, 3 = 4-20mA Input, 4 = Preset Freq, 5 = Comm Port, 6 = Stp Logic", "source": "22B-QS001A"}, {"step": "Set accel and decel times", "screen": "Integral keypad, Basic Program group", "parameter": "P039 [Accel Time 1] / P040 [Decel Time 1]", "value": "10.0 s default each; range 0.0/600.0 s (P040 minimum 0.1 s)", "source": "22B-QS001A"}, {"step": "Set current limit (40)", "screen": "Integral keypad, Advanced Program group", "parameter": "A089 [Current Limit 1]", "value": "Current limit the F006 stall action refers to; set to suit the load", "source": "22B-UM001G Chapter 4 fault actions"}, {"step": "Clear faults after a trip", "screen": "Integral keypad, Advanced Program group", "parameter": "A100 [Fault Clear]", "value": "Set to 1 or 2 to clear a fault (or press the Stop key, or cycle power)", "source": "22A Quick Start FRN 6.xx"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; wait 3 minutes after removing power for the DC bus to discharge.", "Confirm the supply voltage matches the drive voltage class and the motor nameplate; confirm fuses/breaker per 22-TD001.", "Check PE ground continuity and that motor leads land on U/T1, V/T2, W/T3 in the right phase order.", "Check the ENBL jumper: fitted for normal run, removed only if terminal 01 is used as a hardware enable.", "Enter the motor nameplate data (P031-P033) before the first run; do not trust defaults.", "On the 40, run A127 autotune (Static Tune first; Rotate Tune uncoupled if the application allows).", "Jog the motor at low speed from the keypad potentiometer, check rotation; swap two motor leads if reversed.", "Run up to full speed, compare output current (d001) with the motor nameplate FLA, and confirm the selected speed reference actually drives the speed."], "tuning": "The PowerFlex 4 is V/Hz only: tune it with A084 [Boost Select] (voltage boost at low speed) and A089 [Current Limit 1]. The PowerFlex 40 adds sensorless vector control with autotune: A127 [Autotune], 0 = Ready/Idle, 1 = Static Tune, 2 = Rotate Tune. The autotune sets A128 [IR Voltage Drop] and A129 [Flux Current Ref], which affect sensorless vector performance; enter the motor nameplate FLA before running it. If the drive stalls on acceleration (F006), increase P039/A067 [Accel Time x] or reduce the load so current stays below A089 [Current Limit 1].", "faults": [{"code": "F4", "meaning": "UnderVoltage: DC bus voltage fell below the minimum value.", "fix": "Monitor the incoming AC line for low voltage or line power interruption."}, {"code": "F5", "meaning": "OverVoltage: DC bus voltage exceeded the maximum value.", "fix": "Monitor the AC line for high line voltage or transient conditions. Bus overvoltage can also be caused by motor regeneration; extend the decel time or install a dynamic brake option."}, {"code": "F6", "meaning": "Motor Stalled: drive is unable to accelerate the motor.", "fix": "Increase P039/A067 [Accel Time x] or reduce load so drive output current does not exceed the current set by A089 [Current Limit 1]."}, {"code": "F7", "meaning": "Motor Overload: internal electronic overload trip.", "fix": "An excessive motor load exists. Reduce load so drive output current does not exceed the current set by P033 [Motor OL Current]."}, {"code": "F8", "meaning": "Heatsink OvrTmp: heatsink temperature exceeds a predefined value.", "fix": "Check for blocked or dirty heatsink fins. Verify ambient temperature has not exceeded 40 C for IP30/NEMA Type 1 installations or 50 C for IP20/Open type installations. Check fan."}, {"code": "F12", "meaning": "HW OverCurrent: the drive output current has exceeded the hardware current limit.", "fix": "Check programming. Check for excess load, improper A084 [Boost Select] setting, DC brake volts set too high or other causes of excess current."}, {"code": "F13", "meaning": "Ground Fault: a current path to earth ground has been detected at one or more drive output terminals.", "fix": "Check the motor and external wiring to the drive output terminals for a grounded condition."}, {"code": "F29", "meaning": "Analog In Loss: an analog input is configured to fault on signal loss and a signal loss has occurred.", "fix": "Check parameters and check for broken/loose connections at the analog inputs."}, {"code": "F33", "meaning": "Auto Rstrt Tries: drive unsuccessfully attempted to reset a fault and resume running.", "fix": "Correct the cause of the original fault and manually clear it."}, {"code": "F80", "meaning": "SVC Autotune (40 only): the autotune function was either cancelled by the user or failed.", "fix": "Check the motor nameplate data, check the motor is connected, and re-run A127 [Autotune]."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/22b-um001_-en-p.pdf", "sources": ["https://docs.rs-online.com/4478/0900766b8161e3d1.pdf", "https://www.manualsdir.com/manuals/576843/rockwell-automation-22b-powerflex-40-quick-start-frn-5xx-6xx.html?page=17", "https://www.manualsdir.com/manuals/576955/rockwell-automation-22a-powerflex-4-quick-start-frn-6xx.html?page=13", "https://ia903403.us.archive.org/35/items/manualzilla-id-5728513/5728513.pdf", "https://www.tdl-ia.com/insights/powerflex-4-40-to-powerflex-525-migration.html"], "tbd": ["Confirm the PowerFlex 40 nameplate-FLA parameter number (P034 [Motor NP FLA] in the Basic Program group vs A126 [Motor NP FLA] in the Advanced Program group) in 22B-UM001 before teaching it.", "22-COMM EtherNet/IP adapter catalog number for the 40 - needed source: 22-TD001.", "PowerFlex 4 maximum ratings per voltage class are from 22-TD001; the PF4 user manual is 22A-UM001 (the manualUrl above is the 40 manual 22B-UM001).", "Confirm the literature.rockwellautomation.com link for 22B-UM001 resolves; if not, search the Rockwell literature library."], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-523", "category": "vfd", "family": "PowerFlex 523", "catalogNumbers": ["25A-D6P0N114", "25A-D1P4N104"], "name": "PowerFlex 523 AC Drive", "whatItIs": "The economy drive in Rockwell's PowerFlex 520-series (bulletin 25A). It is a compact general-purpose VFD for standalone machines, covering 0.25 to 30 Hp (up to 22 kW) with V/Hz and sensorless vector control. It shares frames A through E and the same power module footprint as the PowerFlex 525, but has no embedded EtherNet/IP port and no built-in Safe Torque-Off.", "whenToUse": "Pick the 523 over the 525 when the machine is standalone, needs no network control and no safety function: a simple conveyor, fan or pump run from the keypad or hardwired terminal-block control. Pick the 525 instead when you need embedded EtherNet/IP, closed-loop velocity vector control, permanent-magnet motor control, or built-in Safe Torque-Off. Pick a 753/755 when power exceeds 30 Hp or the application needs process control, encoder feedback options, DeviceLogix or Integrated Motion.", "selection": "Size by motor full-load amps against the drive rated output amps in 520-TD001, not by horsepower alone; both Normal Duty and Heavy Duty ratings are published for each catalog number. Voltage classes are 100-120V 1-phase, 200-240V 1- or 3-phase, 380-480V 3-phase and 525-600V 3-phase. The 0.25 Hp rating exists only on the 523. Frames A-E; frame is read from 520-TD001, it is not encoded in the catalog number. Select fuses and circuit breakers from the 520-TD001 tables for the exact catalog number.", "wiring": {"power": "Power terminals R/L1, S/L2, T/L3 (1-phase input uses R/L1, S/L2) and motor terminals U/T1, V/T2, W/T3; DC+ and DC- bus terminals; BR+ and BR- for an external dynamic brake resistor (integral brake transistor is fitted on all ratings). PE safety ground is mandatory. Frame A: 0.8-5.3 sq mm (18-10 AWG), torque 1.76-2.16 N-m. Swap any two motor leads to reverse forward direction.", "feedback": "One analog input (unipolar voltage or current), independently isolated from the rest of the drive I/O. No encoder feedback: closed-loop velocity vector control and PM motor control are 525-only. Five digital inputs (one dedicated Stop plus four programmable).", "safety": "No built-in Safe Torque-Off on the 523. Stopping and isolation must be provided externally (contactor / disconnect) to the plant safety design; terminal 01 is the hardwired Stop input.", "network": "No embedded EtherNet/IP. Built-in RS-485 (DSI) port for Modbus RTU. Network options fit the two accessory card slots: 25-COMM-D (DeviceNet), 25-COMM-E2P (dual-port EtherNet/IP), 25-COMM-P (PROFIBUS DP)."}, "configuration": [{"step": "Enter motor nameplate voltage", "screen": "HIM Basic Program group", "parameter": "P031 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "520-QS001A (520-UM001 Smart Start-Up table)"}, {"step": "Enter motor nameplate frequency", "screen": "HIM Basic Program group", "parameter": "P032 [Motor NP Hertz]", "value": "Motor nameplate rated frequency (60 Hz default)", "source": "520-QS001A"}, {"step": "Enter motor overload current", "screen": "HIM Basic Program group", "parameter": "P033 [Motor OL Current]", "value": "Motor nameplate overload current; drives the F007 electronic overload", "source": "520-QS001A"}, {"step": "Enter motor nameplate FLA", "screen": "HIM Basic Program group", "parameter": "P034 [Motor NP FLA]", "value": "Motor nameplate full load amps", "source": "520-QS001A"}, {"step": "Set control mode", "screen": "HIM Basic Program group", "parameter": "P039 [Torque Perf Mode]", "value": "0 = V/Hz for fan/pump loads; 1 = SVC (default) for general purpose", "source": "520-UM001D; 520-QS001A"}, {"step": "Set accel and decel times", "screen": "HIM Basic Program group", "parameter": "P041 [Accel Time 1] / P042 [Decel Time 1]", "value": "10.00 s default each; time from 0 Hz to P044 [Maximum Freq] and back", "source": "520-QS001A"}, {"step": "Set frequency limits", "screen": "HIM Basic Program group", "parameter": "P043 [Minimum Freq] / P044 [Maximum Freq]", "value": "P043 default 0.00 Hz; P044 default 60.00 Hz; P044 must be greater than P043", "source": "520-QS001A; 520-AT001A"}, {"step": "Set start and speed sources", "screen": "HIM Basic Program group", "parameter": "P046 [Start Source 1] / P047 [Speed Reference 1]", "value": "P046: 1 = Keypad (default), 2 = DigIn TrmBlk; P047: 6 = 4-20mA Input for analog speed", "source": "520-QS001A; 520-UM001O"}], "commissioning": ["Lock out and tag out, verify zero voltage at R/L1, S/L2, T/L3 before touching terminals.", "Confirm the supply voltage matches the drive voltage class and the motor nameplate; confirm fuses/breaker per 520-TD001.", "Check PE ground continuity and that motor leads land on U/T1, V/T2, W/T3 in the right phase order.", "Verify control wiring against the 523 control I/O diagram: terminal 01 is Stop, 02 Start/Run FWD, 03 Direction/Run REV.", "Enter the motor nameplate data (P031-P034) before the first run; do not trust defaults.", "Run the autotune (P040) if SVC is selected, then jog the motor at low speed and check rotation; swap two motor leads if reversed.", "Run up to full speed and compare output current (b003) with motor FLA; check for F007/F012 under load.", "Record the final parameter set (or save via Connected Components Workbench) before handover."], "tuning": "The 523 runs V/Hz or sensorless vector control (P039). Autotune is P040 [Autotune]: 0 = Ready/Idle, 1 = Static Tune (motor does not spin), 2 = Rotate Tune (motor spins, run it uncoupled/unloaded if possible). Set P044 [Maximum Freq] above P032 [Motor NP Hertz] before autotune or the tune fails. If the motor is unstable or stalls, lengthen P041 [Accel Time 1] and check the load against A484/A485 current limit behaviour per the F006 action.", "faults": [{"code": "F003", "meaning": "Power Loss: excessive DC bus voltage ripple / incoming line loss.", "fix": "Monitor the incoming AC line for low voltage or interruption. Check input fuses. Reduce load."}, {"code": "F006", "meaning": "Motor Stalled: drive cannot accelerate the motor.", "fix": "Increase P041, A442, A444 or A446 [Accel Time x] or reduce load so output current does not exceed the current set by A484/A485 [Current Limit]."}, {"code": "F007", "meaning": "Motor Overload: internal electronic overload trip.", "fix": "Reduce the load so output current does not exceed P033 [Motor OL Current]; verify P033 matches the motor nameplate."}, {"code": "F012", "meaning": "HW OverCurrent: drive output current exceeded the hardware current limit.", "fix": "Check programming. Check for excess load, improper DC boost setting, DC brake volts set too high, or other causes of excess current."}, {"code": "F013", "meaning": "Ground Fault: a current path to earth ground at one or more drive output terminals.", "fix": "Check the motor and external wiring to the drive output terminals for a grounded condition."}, {"code": "F033", "meaning": "Auto Rstrt Tries: drive unsuccessfully attempted to reset a fault and resume running.", "fix": "Correct the cause of the original fault and manually clear the fault."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/520-um001_-en-e.pdf", "sources": ["https://www.manualsdir.com/manuals/578029/rockwell-automation-25b-powerflex-520-series-adjustable-frequency-ac-drive-quick-start-25a-powerflex-520-series-adjustable-frequency-ac-drive-quick-start.html?page=20", "https://docs.rs-online.com/0238/A700000015338479.pdf", "https://manuals.plus/m/b9445a63c78865037d22238ddedbb785b4309c9798da9da35029d628658636a6", "https://www.scribd.com/document/372060262/520-qs001-en-e", "https://plcexchange.net/how-to-allen-bradley-vfd-selection/"], "tbd": ["Confirm P040 [Autotune] is available on the 523 (not 525-only) in 520-UM001 - needed source: 520-UM001 Chapter 3 parameter listing.", "F004 UnderVoltage and F005 OverVoltage are marked 'not applicable to PowerFlex 523 drives' in the 520-UM001 fault table - confirm the 523 behaviour on loss of line in 520-UM001 Chapter 4.", "Exact 523 digital-input terminal numbers for Start/Stop in 2-wire vs 3-wire control - needed source: 520-UM001 Chapter 1 I/O wiring."], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-525", "category": "vfd", "family": "PowerFlex 525", "catalogNumbers": ["25B-D010N114", "25B-D6P0N114"], "name": "PowerFlex 525 AC Drive", "whatItIs": "The full-featured drive in Rockwell's PowerFlex 520-series (bulletin 25B) and the seed component 25B-D010N114: 4 kW / 5 Hp, 380-480V 3-phase, 10.5 A output, Frame B, IP20 open type, with embedded EtherNet/IP, built-in Safe Torque-Off and an integral brake transistor. It covers 0.5 to 30 Hp (0.4 to 22 kW) across 100-600V classes and adds closed-loop velocity vector control and permanent-magnet motor control over the 523.", "whenToUse": "Pick the 525 over the 523 when the drive must talk to a PLC over EtherNet/IP without an add-on card, when STO is specified, or when you need closed-loop velocity vector or PM motor control. It is the default pick for a small standalone machine with network control: conveyors, pumps, fans and machine axes needing controlled ramps. Pick a 753/755 when power exceeds 30 Hp, or when the job needs process PID with encoder feedback options, DeviceLogix, Safe Speed Monitor or Integrated Motion.", "selection": "Size by motor FLA against the drive rated output amps in 520-TD001 (e.g. 25B-D010N114 is 10.5 A, 5 Hp / 4 kW normal and heavy duty). Voltage classes: 100-120V 1-phase, 200-240V 1- or 3-phase, 380-480V 3-phase, 525-600V 3-phase. Frames A-E; frame is read from 520-TD001, it is not in the catalog number. Two accessory card slots (the 523 has one). Select fuses and circuit breakers from the 520-TD001 tables for the exact catalog number.", "wiring": {"power": "Power terminals R/L1, S/L2, T/L3 (1-phase input uses R/L1, S/L2) and motor terminals U/T1, V/T2, W/T3; DC+ and DC- bus terminals; BR+ and BR- for an external dynamic brake resistor (integral brake transistor fitted on all ratings). PE safety ground is mandatory. Frame A: 0.8-5.3 sq mm (18-10 AWG), torque 1.76-2.16 N-m; Frame E: up to 26.7 sq mm (3 AWG), torque 3.09-3.77 N-m. Swap any two motor leads to reverse forward direction.", "feedback": "Two analog inputs, independently isolated: 0-10V (or +/-10V) on terminal 13 and 0/4-20 mA on terminal 15; one analog output (0-10V or 0/4-20 mA) on terminal 16. Pulse input on terminal 07 accepts pulses up to 100 kHz; encoder feedback needs the 25-ENC-1 option card. Seven digital inputs (one dedicated Stop plus six programmable), two relay outputs, two opto outputs.", "safety": "Built-in Safe Torque-Off, SIL 2/PLd, on terminals S1 (Safety 1), S2 (Safety 2) and S+ (Safety +24V). The drive ships with a protective jumper on S1, S2 and S+; the safety inputs only take effect once the jumper is removed. STO removes rotational power without removing power from the drive.", "network": "Embedded single-port EtherNet/IP adapter (see 520COM-UM001) plus built-in RS-485 (DSI) port for Modbus RTU. Optional cards: 25-COMM-E2P dual-port EtherNet/IP, 25-COMM-D DeviceNet, 25-COMM-P PROFIBUS DP."}, "configuration": [{"step": "Reset to factory defaults on a used drive", "screen": "HIM Basic Program group", "parameter": "P053 [Reset To Defalts]", "value": "2 = Factory Reset (drive must be stopped)", "source": "520-AT001A Appendix A"}, {"step": "Enter motor nameplate voltage", "screen": "HIM Basic Program group", "parameter": "P031 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "520-QS001A"}, {"step": "Enter motor nameplate frequency", "screen": "HIM Basic Program group", "parameter": "P032 [Motor NP Hertz]", "value": "Motor nameplate rated frequency (60 Hz default)", "source": "520-QS001A"}, {"step": "Enter motor overload current", "screen": "HIM Basic Program group", "parameter": "P033 [Motor OL Current]", "value": "Motor nameplate overload current; drives the F007 electronic overload", "source": "520-QS001A"}, {"step": "Enter motor nameplate FLA, poles, RPM and power", "screen": "HIM Basic Program group", "parameter": "P034 [Motor NP FLA] / P035 [Motor NP Poles] / P036 [Motor NP RPM] / P037 [Motor NP Power]", "value": "Copy all four from the motor nameplate; P035 default 4 poles, P036 default 1750 rpm", "source": "520-QS001A"}, {"step": "Set control mode", "screen": "HIM Basic Program group", "parameter": "P039 [Torque Perf Mode]", "value": "0 = V/Hz, 1 = SVC (default); closed-loop velocity vector and PM modes are 525-only", "source": "520-UM001D; 520-TD001H"}, {"step": "Set accel and decel times", "screen": "HIM Basic Program group", "parameter": "P041 [Accel Time 1] / P042 [Decel Time 1]", "value": "10.00 s default each; time from 0 Hz to P044 [Maximum Freq] and back", "source": "520-QS001A"}, {"step": "Set frequency limits", "screen": "HIM Basic Program group", "parameter": "P043 [Minimum Freq] / P044 [Maximum Freq]", "value": "P043 default 0.00 Hz; P044 default 60.00 Hz; P044 must be greater than P043 and above P032 before autotune", "source": "520-QS001A; 520-AT001A"}, {"step": "Set stop mode", "screen": "HIM Basic Program group", "parameter": "P045 [Stop Mode]", "value": "0 = Ramp, CF (default); 1 = Coast, CF; 2 = DC Brake, CF", "source": "520-QS001A"}, {"step": "Set start and speed sources", "screen": "HIM Basic Program group", "parameter": "P046 [Start Source 1] / P047 [Speed Reference 1]", "value": "P046: 1 = Keypad (default), 2 = DigIn TrmBlk; P047: 6 = 4-20mA Input for analog speed", "source": "520-QS001A; 520-UM001O"}], "commissioning": ["Lock out and tag out, verify zero voltage at R/L1, S/L2, T/L3 before touching terminals.", "Confirm the supply voltage matches the drive voltage class and the motor nameplate; confirm fuses/breaker per 520-TD001.", "Check PE ground continuity and that motor leads land on U/T1, V/T2, W/T3 in the right phase order.", "Confirm the STO jumper on S1/S2/S+ is fitted if no safety circuit is wired, or removed and wired to the safety device if STO is used.", "Verify control wiring against the 525 control I/O diagram: terminal 01 is Stop, 02 Start/Run FWD, 03 Direction/Run REV, 13 is 0-10V in, 15 is 4-20 mA in.", "Enter the motor nameplate data (P031-P037) before the first run; do not trust defaults.", "Run P040 autotune, then jog the motor at low speed and check rotation; swap two motor leads if reversed.", "Run up to full speed, compare output current (b003) with motor FLA, and confirm the EtherNet/IP link and the PLC can start/stop the drive.", "Record the final parameter set (or save via Connected Components Workbench) before handover."], "tuning": "Autotune is P040 [Autotune]: 0 = Ready/Idle, 1 = Static Tune (motor does not spin), 2 = Rotate Tune (motor spins). Run Rotate Tune with the motor unloaded/uncoupled where possible; the tune measures the motor circuit and populates the motor model parameters. Set P044 [Maximum Freq] above P032 [Motor NP Hertz] before autotune or the tune fails. If the motor is unstable at low speed in SVC, lengthen P041 [Accel Time 1]; if it trips F005 on stopping, lengthen P042 [Decel Time 1] or fit a dynamic brake resistor on BR+/BR-.", "faults": [{"code": "F004", "meaning": "UnderVoltage: DC bus voltage fell below the minimum value.", "fix": "Monitor the incoming AC line for low voltage or line power interruption."}, {"code": "F005", "meaning": "OverVoltage: DC bus voltage exceeded the maximum value. Can be caused by motor regeneration.", "fix": "Monitor the AC line for high line voltage or transient conditions. Extend the decel time or install a dynamic brake option."}, {"code": "F006", "meaning": "Motor Stalled: drive cannot accelerate the motor.", "fix": "Increase P041, A442, A444 or A446 [Accel Time x] or reduce load so output current does not exceed the current set by A484/A485 [Current Limit]."}, {"code": "F007", "meaning": "Motor Overload: internal electronic overload trip.", "fix": "Reduce the load so output current does not exceed P033 [Motor OL Current]; verify P033 matches the motor nameplate."}, {"code": "F012", "meaning": "HW OverCurrent: drive output current exceeded the hardware current limit.", "fix": "Check programming. Check for excess load, improper DC boost setting, DC brake volts set too high, or other causes of excess current."}, {"code": "F013", "meaning": "Ground Fault: a current path to earth ground has been detected at one or more of the drive output terminals.", "fix": "Check the motor and external wiring to the drive output terminals for a grounded condition."}, {"code": "F015", "meaning": "Load Loss: output torque current is below the value programmed in A490.", "fix": "Verify connections between motor and load. Verify level and time requirements."}, {"code": "F033", "meaning": "Auto Rstrt Tries: drive unsuccessfully attempted to reset a fault and resume running.", "fix": "Correct the cause of the original fault and manually clear the fault."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/520-um001_-en-e.pdf", "sources": ["https://www.manualsdir.com/manuals/578029/rockwell-automation-25b-powerflex-520-series-adjustable-frequency-ac-drive-quick-start-25a-powerflex-520-series-adjustable-frequency-ac-drive-quick-start.html?page=20", "https://docs.rs-online.com/0238/A700000015338479.pdf", "https://manuals.plus/m/b9445a63c78865037d22238ddedbb785b4309c9798da9da35029d628658636a6", "https://www.scribd.com/document/612159169/520-at001-en-p", "https://plcexchange.net/how-to-powerflex-525-installation/", "https://www.tdl-ia.com/insights/powerflex-4-40-to-powerflex-525-migration.html", "https://www.rockwellautomation.com/en-us/products/details.25b-d010n114.html"], "tbd": ["Fault-clear digital input: t062, t063, t065-t068 [DigIn TermBlk xx] set to 13 clears a fault - verified in 520-UM001 Chapter 4 text; the full fault-clear procedure (Stop key only when P045 is 0-3, A551 [Fault Clear] = 1 or 2) is from the same chapter and should be re-checked against 520-UM001O.", "Exact 525 PID loop parameters for the two built-in PID loops - needed source: 520-UM001 Chapter 3 Advanced Program group."], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-70", "category": "vfd", "family": "PowerFlex 70", "catalogNumbers": ["20AB2P2A3AYYNNC0"], "name": "PowerFlex 70 AC Drive", "whatItIs": "Rockwell's compact performance drive (bulletin 20A) for machines that need vector control in a small frame. It covers 0.5-25 Hp at 240V AC input, 0.5-50 Hp at 480V and 600V AC input, in Frames A-E, with V/Hz, sensorless vector and (Enhanced Control) flux vector control. It shares its parameter structure and HIM with the PowerFlex 700 but is the smaller, panel-mount member of the pair.", "whenToUse": "Pick the 70 over the 525 when the machine needs true vector control, an LCD HIM with S.M.A.R.T. Start, DPI communication options, or power up to 50 Hp with a compact frame. Pick the 700 over the 70 when power exceeds 50 Hp or the job needs the 700's larger frames, IP54 Type 12 standalone packages, or vector-control firmware options. Pick the 525 for small jobs where the 70's vector performance and DPI options are not needed. Note the 70/700 are a mature family: Rockwell's current migration path for new designs is the 750-series.", "selection": "Size by motor FLA against the drive rated output amps in 20A-TD001, Normal Duty or Heavy Duty. Power ratings: 0.5-25 Hp at 240V AC input, 0.5-50 Hp at 480V AC input, 0.5-50 Hp at 600V AC input. Frames A-E; IP20 NEMA/UL Type 1, with IP66 Type 4X/12 options on some frames. Select fuses and circuit breakers from the 20A-TD001 tables for the exact catalog number.", "wiring": {"power": "Three-phase input to R/L1, S/L2, T/L3; motor to U/T1, V/T2, W/T3; PE ground; DC bus test points are on the power terminal block. Follow the wire sizes and torques in 20A-IN009 for the frame fitted.", "feedback": "Sensorless vector control needs no encoder. Flux vector (Enhanced Control) uses encoder feedback; the exact encoder interface terminals must be confirmed in 20A-UM001 before wiring (see tbd). Analog inputs and outputs and digital I/O are on the main control board terminal block.", "safety": "No built-in Safe Torque-Off. Stopping and isolation must be provided externally to the plant safety design; the drive reports an F111 Enable Hardware fault when the hardware enable is disabled while the logic pin is still low.", "network": "No embedded Ethernet. Communication is through DPI ports using 20-COMM adapters: 20-COMM-E (EtherNet/IP), 20-COMM-D (DeviceNet), 20-COMM-C (ControlNet), 20-COMM-M (Modbus/TCP), 20-COMM-H (HVAC), 20-COMM-K (CANopen) and 20-COMM-L (LonWorks). The HIM is a removable LCD or LED module."}, "configuration": [{"step": "Enter motor nameplate volts", "screen": "LCD HIM, File-Group-Parameter view (or Numbered List view)", "parameter": "41 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Enter motor nameplate amps, hertz, RPM and power", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "42 [Motor NP Amps] / 43 [Motor NP Hertz] / 44 [Motor NP RPM] / 45 [Motor NP Power]", "value": "Copy all four from the motor nameplate", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Set motor control selection", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "53 [Motor Cntl Sel]", "value": "V/Hz for simple speed control; Sensrls Vect or SV Economize for sensorless vector (required before autotune works)", "source": "20A-QS001E; PFLEX-AP005A"}, {"step": "Set maximum frequency", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "55 [Maximum Freq]", "value": "5.0/420.0 Hz range; set to the top speed the motor is rated for", "source": "20B-UM001 (via 20B parameter text)"}, {"step": "Set minimum and maximum speed", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "81 [Minimum Speed] / 82 [Maximum Speed]", "value": "Speed limits in the configured speed units; also set 83 [Overspeed Limit]", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Run autotune", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "61 [Autotune]", "value": "1 = Static Tune (motor still) or 2 = Rotate Tune (motor spins); 3 = Calculate is the default; 0 = Ready", "source": "20A-QS001E; 20A-UM001O"}, {"step": "Set accel and decel times", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "140 [Accel Time 1] / 142 [Decel Time 1]", "value": "10.0 s default each; range 0.1/3600.0 s", "source": "20A-QS001E; 20A-UM001P"}, {"step": "Select the speed reference source", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "90 [Speed Ref A Sel]", "value": "Source for speed reference A (analog input, preset speed, DPI, MOP, etc.)", "source": "PFLEX-AP005A; 20B/20A Parameters FRN 3.xx list"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; confirm the supply voltage matches the drive voltage class.", "Confirm fuses/breaker per 20A-TD001 and that the PE ground is in place.", "Use the LCD HIM S.M.A.R.T. Start: it walks through Start Mode and Stop Mode, Minimum and Maximum Speed, Accel Time 1 and Decel Time 1, Reference Source, and Thermal Motor Overload.", "Enter the motor nameplate data (41-45) before the first run; do not trust defaults.", "Run 61 [Autotune] (Static Tune first; Rotate Tune uncoupled if the application allows).", "Jog the motor at low speed, check rotation and that the output frequency follows the commanded speed.", "Run up to full speed, compare output current with 42 [Motor NP Amps], and confirm the selected speed reference actually drives the speed.", "Check parameter 214 [Start Inhibits] if the drive will not start: a flashing yellow STS LED means an inhibit condition exists."], "tuning": "Autotune is 61 [Autotune]: 0 = Ready, 1 = Static Tune (a non-rotational test; a start command is required after initiation), 2 = Rotate Tune (a Static Tune followed by a rotational test), 3 = Calculate (default). It sets 62 [IR Voltage Drop] and 63 [Flux Current Ref], which affect sensorless vector performance. It is valid only when parameter 53 is set to Sensrls Vect, SV Economize (or FVC Vector on Enhanced Control). Enter the motor nameplate data first: the autotune procedure needs [Motor NP Volts], [Motor NP Hertz] and [Motor NP Power] to get accurate results. If the autotune values fall outside the acceptable range the drive raises F77 [IR Volts Range] or F78 [FluxAmpsRef Rang].", "faults": [{"code": "F2", "meaning": "Auxiliary Input: auxiliary input interlock is open.", "fix": "Check remote wiring."}, {"code": "F4", "meaning": "UnderVoltage: DC bus voltage fell below the minimum value.", "fix": "Monitor the incoming AC line for low voltage or line power interruption."}, {"code": "F5", "meaning": "OverVoltage: DC bus voltage exceeded the maximum value.", "fix": "Monitor the AC line for high line voltage or transient conditions. Bus overvoltage can also be caused by motor regeneration; extend the decel time or install a dynamic brake option."}, {"code": "F7", "meaning": "Motor Overload: internal electronic overload trip.", "fix": "Check for excess load; verify the motor overload settings and parameter 42 [Motor NP Amps]."}, {"code": "F12", "meaning": "HW OverCurrent: the drive output current has exceeded the hardware current limit.", "fix": "Check programming; check for excess load, improper DC boost setting or other causes of excess current."}, {"code": "F13", "meaning": "Ground Fault: a current path to earth ground has been detected at one or more drive output terminals.", "fix": "Check the motor and external wiring to the drive output terminals for a grounded condition."}, {"code": "F24", "meaning": "Decel Inhibit: the drive is not following a commanded deceleration because it is attempting to limit bus voltage.", "fix": "Check input voltage and system grounding; lengthen the decel time or fit dynamic braking."}, {"code": "F36", "meaning": "SW OverCurrent: drive output current has exceeded the 1 ms current rating (typically 200-250% of the drive continuous rating).", "fix": "Check for excess load, improper DC boost setting, or other causes of excess current."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/20a-um001_-en-p.pdf", "sources": ["https://www.sigi-elect.si/sites/default/files/doc_tree/powerflex%2070%20-%20quick%20start%20guide.pdf", "https://manuals.plus/m/9d6f03313480baea1173c492292cf9d52b1b4ce58bbee68f4d2960134157a616", "https://archive.org/download/manualzilla-id-5892875/5892875.pdf", "https://eforsan.com.tr/wp-content/uploads/2023/10/PowerFlex-70-Adjustable-Frequency-AC-Drives-1.pdf", "https://www.manualsdir.com/manuals/580976/rockwell-automation-20b-powerflex-70-_-700-parameters-frn-3xx-20a-powerflex-70-_-700-parameters-frn-3xx.html?page=25"], "tbd": ["Exact encoder feedback terminals for flux vector control on the 70 - needed source: 20A-UM001 Chapter 1.", "Power terminal wire sizes and torques per frame - needed source: 20A-IN009 installation instructions.", "Current lifecycle status of the PowerFlex 70 on Rockwell's product page (Active Mature vs discontinued) - needed source: rockwellautomation.com PowerFlex 70 product page.", "Confirm the literature.rockwellautomation.com link for 20A-UM001 resolves; if not, search the Rockwell literature library."], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-700", "category": "vfd", "family": "PowerFlex 700", "catalogNumbers": ["20BD1P1A0AYNANC0", "20BB2P2A0AYNBNC0"], "name": "PowerFlex 700 AC Drive", "whatItIs": "Rockwell's large-frame performance drive (bulletin 20B) for demanding torque control of three-phase induction motors, from the simplest speed control to flux vector control with encoder feedback. It covers 0.5-100 Hp at 240V, 0.5-700 Hp at 480V, 1-150 Hp at 600V and 50-150 Hp at 690V, in Frames 0-10, with Standard Control and Vector Control (700VC) firmware.", "whenToUse": "Pick the 700 over the 70 when power exceeds 50 Hp, when the job needs Frames 6-10, an IP54 Type 12 standalone wall-mount package (75-200 Hp, Frames 5-6), or the 700VC vector-control firmware with encoder feedback and position control options. Pick the 753/755 for new designs: the 700 is a mature family and Rockwell's current migration path is the 750-series (see PFLEX-AP005, the PowerFlex 700 to 753 migration guide). Pick the 70 for the same control capability in a smaller frame up to 50 Hp.", "selection": "Size by motor FLA against the drive rated output amps in 20B-TD001, Normal Duty or Heavy Duty (the seed example 20BD1P1A0AYNANC0 is 1.1 A, 0.5 Hp at 480V, Frame 0). Voltage classes: 240V, 480V, 600V and 690V AC, 3-phase. Frames 0-3 are IP20 NEMA/UL Type 1; Frames 5-6 are available as IP54 NEMA/UL Type 12 standalone wall-mount drives (75-200 Hp); Frames 7-10 are larger floor/wall packages. Select fuses and circuit breakers from the 20B-TD001 tables for the exact catalog number.", "wiring": {"power": "Three-phase input to R/L1, S/L2, T/L3; motor to U/T1, V/T2, W/T3; PE ground; DC bus test points are on the power terminal block. Follow the wire sizes and torques in 20B-IN0019 (Frames 0-6) or 20B-IN0014 (Frames 7-10) for the frame fitted.", "feedback": "Vector Control (700VC) firmware supports encoder feedback for flux vector and position control; Standard Control is sensorless. The exact encoder interface terminals must be confirmed in 20B-UM002 before wiring (see tbd). Analog inputs and outputs and digital I/O are on the main control board terminal block.", "safety": "No built-in Safe Torque-Off. Stopping and isolation must be provided externally to the plant safety design; the drive reports an F111 Enable Hardware fault when the hardware enable is disabled while the logic pin is still low.", "network": "No embedded Ethernet. Communication is through DPI ports using 20-COMM adapters: 20-COMM-E (EtherNet/IP), 20-COMM-D (DeviceNet), 20-COMM-C (ControlNet), 20-COMM-M (Modbus/TCP), 20-COMM-H (HVAC), 20-COMM-K (CANopen) and 20-COMM-L (LonWorks). The HIM is a removable LCD or LED module; parameters are viewed in File-Group-Parameter or Numbered List order on the LCD HIM."}, "configuration": [{"step": "Enter motor nameplate volts", "screen": "LCD HIM, File-Group-Parameter view (or Numbered List view)", "parameter": "41 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Enter motor nameplate amps, hertz, RPM and power", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "42 [Motor NP Amps] / 43 [Motor NP Hertz] / 44 [Motor NP RPM] / 45 [Motor NP Power]", "value": "Copy all four from the motor nameplate", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Set motor control selection", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "53 [Motor Cntl Sel]", "value": "V/Hz for simple speed control; Sensrls Vect or SV Economize for sensorless vector; FVC Vector on 700VC with encoder", "source": "20A-UM001O; PFLEX-AP005A"}, {"step": "Set maximum frequency", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "55 [Maximum Freq]", "value": "5.0/420.0 Hz range; set to the top speed the motor is rated for", "source": "20B-UM001 (via 20B parameter text)"}, {"step": "Set minimum and maximum speed", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "81 [Minimum Speed] / 82 [Maximum Speed]", "value": "Speed limits in the configured speed units; also set 83 [Overspeed Limit]", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Run autotune", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "61 [Autotune]", "value": "1 = Static Tune (motor still) or 2 = Rotate Tune (motor spins); 3 = Calculate is the default; 0 = Ready", "source": "20B-UM002 (via manualzilla text); 20A-UM001O"}, {"step": "Set accel and decel times", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "140 [Accel Time 1] / 142 [Decel Time 1]", "value": "10.0 s default each; range 0.1/3600.0 s", "source": "20A-UM001P; 20A-QS001E"}, {"step": "Select the speed reference source", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "90 [Speed Ref A Sel]", "value": "Source for speed reference A (analog input, preset speed, DPI, MOP, etc.)", "source": "PFLEX-AP005A; 20B/20A Parameters FRN 3.xx list"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; confirm the supply voltage matches the drive voltage class.", "Confirm fuses/breaker per 20B-TD001 and that the PE ground is in place.", "Use the LCD HIM S.M.A.R.T. Start: it walks through Start Mode and Stop Mode, Minimum and Maximum Speed, Accel Time 1 and Decel Time 1, Reference Source, and Thermal Motor Overload.", "Enter the motor nameplate data (41-45) before the first run; do not trust defaults.", "Run 61 [Autotune] (Static Tune first; Rotate Tune uncoupled if the application allows). On 700VC, confirm the encoder feedback reads correctly before closing the loop.", "Jog the motor at low speed, check rotation and that the output frequency follows the commanded speed.", "Run up to full speed, compare output current with 42 [Motor NP Amps], and confirm the selected speed reference actually drives the speed.", "Check parameter 214 [Start Inhibits] if the drive will not start: a flashing yellow STS LED means an inhibit condition exists."], "tuning": "Autotune is 61 [Autotune]: 0 = Ready, 1 = Static Tune (a non-rotational test; a start command is required after initiation), 2 = Rotate Tune (a Static Tune followed by a rotational test), 3 = Calculate (default). It sets 62 [IR Voltage Drop] and 63 [Flux Current Ref], which affect sensorless vector performance. It is valid only when parameter 53 is set to Sensrls Vect, SV Economize (or FVC Vector on 700VC). Enter the motor nameplate data first: the autotune procedure needs [Motor NP Volts], [Motor NP Hertz] and [Motor NP Power] to get accurate results. During start-up the drive may temporarily modify parameters 53, 80, 276, 278 and 361-366 and restore them when start-up completes. If the autotune values fall outside the acceptable range the drive raises F77 [IR Volts Range] or F78 [FluxAmpsRef Rang].", "faults": [{"code": "F3", "meaning": "Power Loss: DC bus voltage remained below 85% of nominal for longer than [Power Loss Time].", "fix": "Monitor the incoming AC line for low voltage or interruption; enable/disable with [Fault Config 1]."}, {"code": "F5", "meaning": "OverVoltage: DC bus voltage exceeded the maximum value.", "fix": "Monitor the AC line for high line voltage or transient conditions. Bus overvoltage can also be caused by motor regeneration; extend the decel time or install a dynamic brake option."}, {"code": "F7", "meaning": "Motor Overload: internal electronic overload trip.", "fix": "Check for excess load; verify the motor overload settings and parameter 42 [Motor NP Amps]."}, {"code": "F12", "meaning": "HW OverCurrent: the drive output current has exceeded the hardware current limit.", "fix": "Check programming; check for excess load, improper DC boost setting or other causes of excess current."}, {"code": "F13", "meaning": "Ground Fault: a current path to earth ground greater than 25% of the drive rating.", "fix": "Check the motor and external wiring to the drive output terminals for a grounded condition."}, {"code": "F24", "meaning": "Decel Inhibit: the drive is not following a commanded deceleration because it is attempting to limit bus voltage.", "fix": "Check input voltage and system grounding; lengthen the decel time or fit dynamic braking."}, {"code": "F25", "meaning": "OverSpeed Limit: slip compensation or bus regulation tried to add an output frequency adjustment greater than [Overspeed Limit].", "fix": "Check parameter 83 [Overspeed Limit]; remove excessive load or overhauling conditions."}, {"code": "F36", "meaning": "SW OverCurrent: drive output current has exceeded the 1 ms current rating (typically 200-250% of the drive continuous rating).", "fix": "Check for excess load, improper DC boost setting, or other causes of excess current."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/20b-um002_-en-p.pdf", "sources": ["https://www.manualsdir.com/manuals/577088/rockwell-automation-20b-powerflex-700-ac-drives-vector-control-v4001-and-up.html?page=88", "https://www.manualsdir.com/manuals/580976/rockwell-automation-20b-powerflex-70-_-700-parameters-frn-3xx-20a-powerflex-70-_-700-parameters-frn-3xx.html?page=25", "https://4ind-hub.s3.amazonaws.com/prod/sku/20bc260a0aynanc0-651ecfea6b7cf384398325.pdf", "https://manualzilla.com/doc/5636642/powerflex-700-user-manual---columbia-electric-supply-pasco", "https://www.manualslib.com/manual/2497157/Rockwell-Automation-Allen-Bradley-Powerflex-700-Series.html?page=53"], "tbd": ["Exact encoder feedback terminals for 700VC flux vector control - needed source: 20B-UM002 Chapter 1.", "Power terminal wire sizes and torques per frame - needed source: 20B-IN0019 (Frames 0-6) / 20B-IN0014 (Frames 7-10).", "Current lifecycle status of the PowerFlex 700 on Rockwell's product page - needed source: rockwellautomation.com PowerFlex 700 product page.", "Confirm the literature.rockwellautomation.com link for 20B-UM002 resolves; if not, search the Rockwell literature library. (20B-UM001 is the earlier user manual revision.)"], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-753", "category": "vfd", "family": "PowerFlex 753", "catalogNumbers": ["20F11ND065JA0NNNNN"], "name": "PowerFlex 753 AC Drive", "whatItIs": "The general-purpose drive in Rockwell's PowerFlex 750-series (bulletin 20F) and the seed component 20F11ND065JA0NNNNN: 50 Hp normal duty / 40 Hp heavy duty, 480V 3-phase, 65 A output, Frame 4, open type, with embedded I/O, a DC link choke and a dynamic-braking transistor. It covers 0.75 to 270 kW (1 to 400 Hp) in wall-mount Frames 1-7, with three option slots plus built-in I/O for feedback, safety and communication cards.", "whenToUse": "Pick the 753 over the 525 when power exceeds 30 Hp, or when the job needs built-in I/O, PID process control, encoder feedback, Safe Torque-Off via an option card, or DeviceLogix. Pick the 755 over the 753 when you need dual-port embedded EtherNet/IP with DLR, five option slots, Integrated Motion on EtherNet/IP, Safe Speed Monitor, permanent-magnet motor control in open loop, or power above 400 Hp / 270 kW. Pick the 525 for small standalone machines where the 753 is oversized.", "selection": "Size by motor FLA against the drive rated output amps in 750-TD001, choosing Normal Duty or Heavy Duty to suit the load (the seed drive is 65 A, 50 Hp ND / 40 Hp HD). Voltage classes: 240V, 400V, 480V, 600V and 690V AC. Frames 1-5 are IP20 NEMA/UL Type 1 wall mount; Frames 6-7 are IP00 open wall mount (convertible to IP20 Type 1 with kit 20-750-NEMA1-Fx). A DC link choke is included on all frames; the internal brake transistor is standard on Frames 1-5 and optional on Frames 6-7. Select fuses and circuit breakers from the 750-TD001 tables.", "wiring": {"power": "Three-phase input to R/L1, S/L2, T/L3; motor to U/T1, V/T2, W/T3; DC+ and DC- bus terminals; PE ground. DC link choke is built in on all frames. Internal brake transistor is standard on Frames 1-5, optional on Frames 6-7; connect an external brake resistor only when the transistor is fitted.", "feedback": "Closed-loop and permanent-magnet control need a feedback device fitted in an option slot. For the 753, a feedback device must be used for PM flux vector control; open-loop PM flux vector is a 755-only feature. Speed feedback is read as P3 [Mtr Vel Fdbk]; check it against P2 [Commanded SpdRef] when diagnosing a speed error.", "safety": "Safe Torque-Off is available as an option module, catalog 20-750-S3, as a hardwired or networked (CIP Safety) solution certified SIL 3, PLe, Cat 3. The STO function reaction time is 15 ms maximum. See 750-UM004 for the STO wiring, timing diagrams and verification.", "network": "No embedded EtherNet/IP on the 753: fit the 20-750-ENETR dual-port EtherNet/IP option module (Adapter mode is the default and supports star, linear or Device Level Ring topologies). Automatic Device Configuration (ADC) lets a Logix controller detect a replaced drive and download all configuration parameters automatically. Other option modules: 20-750-DNET (DeviceNet), 20-750-CNETC (ControlNet), 20-750-PBUS (PROFIBUS DP), 20-750-PNET2P (PROFINET)."}, "configuration": [{"step": "Enter motor nameplate volts", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P25 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "750-PM001Q parameter list"}, {"step": "Enter motor nameplate amps, hertz, RPM and power", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P26 [Motor NP Amps] / P27 [Motor NP Hertz] / P28 [Motor NP RPM] / P30 [Motor NP Power]", "value": "Copy all four from the motor nameplate", "source": "750-PM001Q parameter list"}, {"step": "Set motor control mode", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P35 [Motor Ctrl Mode]", "value": "V/Hz, sensorless vector or flux vector to suit the application; PM flux vector on the 753 needs a feedback device", "source": "750-PM001Q; 750-UM001C"}, {"step": "Set maximum frequency and voltage", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P36 [Maximum Voltage] / P37 [Maximum Freq]", "value": "P37 limits the top speed; check P520 [Max Fwd Speed] and P521 [Max Rev Speed] agree with it", "source": "750-PM001Q; 750-IN001C"}, {"step": "Run autotune", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P70 [Autotune] / P71 [Autotune Torque]", "value": "Static Tune (motor still) or Rotate Tune (motor spins, uncoupled if possible)", "source": "750-PM001Q; 750-IN001C"}, {"step": "Set accel and decel times", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P535 [Accel Time 1] / P537 [Decel Time 1]", "value": "Ramp times in seconds; lengthen if the drive hits current limit or overvoltage on stopping", "source": "750-IN001C; PFLEX-AP005A"}, {"step": "Select the speed reference source", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P545 [Spd Ref A Sel]", "value": "Main speed reference source in Auto mode; P550 [Spd Ref B Sel] is the alternate, switched by digital input P173-P175 [DI Speed Sel]", "source": "750-PM001J"}, {"step": "Assign start/stop digital inputs", "screen": "HIM Parameters (Linear List) or CCW Parameters", "parameter": "P158 [DI Stop] / P161 [DI Start] / P162 [DI Fwd Reverse]", "value": "Wire 3-wire control to the assigned inputs, or use P163 [DI Run] / P164 [DI Run Forward] for 2-wire control", "source": "750-PM001Q; PFLEX-AP005A"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; confirm the supply voltage matches the drive voltage class.", "Confirm fuses/breaker per 750-TD001 and that the DC link choke and PE ground are in place.", "Check motor leads on U/T1, V/T2, W/T3 and that any feedback, safety and network option modules are seated in the correct slots.", "Enter the motor nameplate data (P25-P31) before the first run; do not trust defaults.", "Run P70 autotune (Static Tune first; Rotate Tune uncoupled if the application allows).", "Jog the motor at low speed, check rotation and that P3 [Mtr Vel Fdbk] follows P2 [Commanded SpdRef].", "Run up to full speed, compare P7 [Output Current] with P26 [Motor NP Amps], and confirm the PLC can start/stop the drive over the network.", "Verify ADC: the Logix controller should hold the drive configuration so a swapped drive is reconfigured automatically."], "tuning": "Autotune is P70 [Autotune] with P71 [Autotune Torque]; it sets P73 [IR Voltage Drop], P74 [Ixo Voltage Drop], P75 [Flux Current Ref] and P76 [Total Inertia] (with P77 [Inertia Test Lmt]). Static Tune measures the motor without spinning it; Rotate Tune spins the motor and gives the better result, so run it uncoupled where the machine allows. If motor data was entered wrong or autotune was not run, the drive will not accelerate to commanded speed or motor operation will be unstable - correct the nameplate data and re-run the tune. For flux vector work, P35 [Motor Ctrl Mode] must match the feedback fitted.", "faults": [{"code": "2", "meaning": "Auxiliary Input: an auxiliary input interlock is open.", "fix": "Check the auxiliary input wiring and the digital input assigned in P157 [DI Aux Fault]."}, {"code": "3", "meaning": "Power Loss: the DC bus voltage stayed below the power-loss level for longer than the programmed time.", "fix": "Check parameters P449, P451, P454 and P455; examine the incoming voltage source and supply."}, {"code": "4", "meaning": "UnderVoltage: DC bus voltage fell below the value set in P461 [UnderVltg Level].", "fix": "Check parameters P460 and P461; examine the incoming voltage source."}, {"code": "5", "meaning": "OverVoltage: the DC bus voltage exceeded the maximum value.", "fix": "Monitor P11 [DC Bus Volts]; check for high line voltage, transients or regenerative load; extend decel time or fit dynamic braking."}, {"code": "7", "meaning": "Motor Overload: an internal electronic overload trip occurred.", "fix": "Check P410 [Motor OL Actn]; check P7 [Output Current], P26 [Motor NP Amps], P413 [Mtr OL Factor] and P414 [Mtr OL Hertz]; reduce the load."}, {"code": "8", "meaning": "Heatsink OvrTemp: heatsink temperature exceeded 100% of the drive temperature (115-120 C).", "fix": "Check cooling airflow and ambient temperature; check P943 [Drive Temp Pct] and P944 [Drive Temp C]; clean heatsink fins."}, {"code": "12", "meaning": "HW OverCurrent: drive output current exceeded the hardware current limit.", "fix": "Examine the current limiters and the load; check for a shorted motor or wiring fault."}, {"code": "13", "meaning": "Ground Fault: a current path to earth ground greater than 25% of the drive rating.", "fix": "Inspect groun
