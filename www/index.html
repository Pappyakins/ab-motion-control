p": "Create a motion group and assign the axis", "screen": "Motion Group Properties - Attribute tab", "parameter": "Base Update Period", "value": "5 ms", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Axis Configuration", "value": "Position Loop", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Feedback Configuration", "value": "Motor Feedback", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Application Type / Loop Response", "value": "Basic / Medium", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Select the motor so all motor data fills in automatically", "screen": "Axis Properties - Motor", "parameter": "Data Source / Motor Catalog Number", "value": "Data Source = Catalog Number; Motor Catalog Number = VPF-B1303F-PJ14AF", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Load Type", "value": "Direct Coupled Rotary", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Position Units per Motor Rev / Travel Mode", "value": "1.0 Position Units per 1.0 Motor Rev; Travel Mode = Unlimited", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Tune the axis", "screen": "Axis Properties - Autotune tab", "parameter": "Autotune Start", "value": "Click Start and perform an autotune (see tuning)", "source": "Rockwell Motion System Tuning Application Technique MOTION-AT005, 'Using Load Observer with Autotune'"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (VPF-IN001).", "Mount with the connector pointing downward, cable entry underneath, and a drip loop; provide clearance, heatsink mass and airflow for 0-40 C ambient (KNX-TD001A p162).", "Verify axial and radial shaft loads do not exceed the Motor Load Force Ratings for the speed (L10 bearing life 20,000 hours, KNX-TD001A pp54-67).", "Use a torsionally rigid coupling or reinforced timing belt; do not strike the shaft, couplings or pulleys \u2014 sharp impact damages bearings and the feedback device.", "Keep the food-grade shaft seal intact and the single SpeedTec connector (315 deg range) rotated only by its housing, never with tools.", "IP66/IP67 depends on the shaft seal (standard on VPF) and environmentally sealed cable connectors; position connectors away from direct exposure to cleaning processes (KNX-TD001A p163 note).", "Inspect food-grade shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months (KNX-TD001A p51). Use only food-grade shaft seal kits (VPF-SSN / MPF-SST series) with food-grade lubricant.", "Use only Rockwell 2090 single-cable assemblies \u2014 do not build your own cable or use third-party cable (KNX-TD001A p50).", "Before first motion, confirm the brake (if fitted) releases with 24 V DC and that the axis is commanded to 0 rpm before the brake engages (KNX-TD001A p164)."], "tuning": "Tuning means setting the position/velocity loop gains so the axis follows its commanded move without oscillation, overshoot or following-error faults. Rockwell's method for Kinetix 5500/5700 drives is the Load Observer: MOTION-AT005 says the EtherNet/IP drive recommended settings use the load observer and 'produce a relatively high level of performance in 90% of motion applications', and work for unknown loads or when no autotune is performed. With Load Observer, out-of-box tuning uses Load Inertia Ratio = 0; after an autotune (Autotune tab, Start button in Axis Properties) the measured Load Inertia Ratio is greater than 0 and Load Observer Bandwidth (KOP) is set equal to Velocity Proportional Gain (KVP). Load Inertia Ratio is load inertia over motor inertia (Motion Analyzer manual). VPF is mechanically identical in inertia to VPL, so it tunes the same way \u2014 the food-grade coating and seal do not change the tuning, but a draggy or worn shaft seal adds friction the autotune will see as load, so replace worn seals before tuning, not after. For Kinetix 5500/5700, choose Tracking Notch Filter from the Adaptive Tuning Configuration pull-down on the Compliance tab (MOTION-AT005). Reduce Maximum Acceleration/Deceleration if the loaded motor cannot reach the unloaded defaults.", "faults": [{"code": "FLT S05 - MTR OVERTEMP FL", "meaning": "Motor overtemperature, factory limit fault \u2014 calculations based on the motor thermistor indicate the motor factory temperature limit has been exceeded. 2198-UM001D notes this fault is available only on Kinetix VP motors.", "fix": "Operate motor within continuous torque rating; reduce motor ambient temperature; add motor cooling (2198-UM001)."}, {"code": "FLT S07 - MTR OVERLOAD FL", "meaning": "Motor thermal overload, factory limit fault \u2014 the motor thermal model has exceeded its factory-set thermal capacity limit of 110% (2198-UM001).", "fix": "Modify the command profile to reduce speed or increase time; operate within the continuous torque rating."}, {"code": "FLT S09 - MTR PHASE LOSS", "meaning": "Motor phase loss \u2014 the motor has failed torque proving (2198-UM001).", "fix": "Check motor connections (single-cable SpeedTec connector seating, drive-end terminals)."}, {"code": "FLT S45 - FDBK COMM FL", "meaning": "Motor feedback data loss, factory limit fault \u2014 consecutive missed or corrupted serial data packets from the DSL feedback device exceeded a factory-set limit (2198-UM001).", "fix": "Check motor feedback cable and connector; check motor power cable and feedback wire shields are secured correctly; check motor frame is grounded correctly."}, {"code": "FLT S47 - FDBK DEVICE FAILURE", "meaning": "Feedback device failure (2198-UM001).", "fix": "Check the single cable and connector for damage; if the fault persists the DSL encoder is faulty and the motor needs authorised repair \u2014 do not open the motor."}, {"code": "FLT S49 - BRAKE SLIP FLT", "meaning": "Brake slip exception (2198-UM001) \u2014 the holding brake slipped under load.", "fix": "Check the load against the brake holding torque (14.10 N\u00b7m for VPF-B1303); check 24 V DC brake supply and wiring; never use the holding brake to stop a moving shaft."}], "manualUrl": "https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://www.rockwellautomation.com/en-us/products/details.VPF-B1303F-PJ14AF.html", "https://www.rockwellautomation.com/en-us/products/details.VPF-B1303F-PJ12AF.html", "https://www.rockwellautomation.com/en-nl/docs/studio-5000-logix-designer/37-00/contents-ditamap/quick-start-steps/configuring-an-ethernet-motion-system.html", "https://www.manualslib.com/manual/1593435/Allen-Bradley-Kinetix-5500.html?page=163", "https://www.manualslib.com/manual/3008536/Rockwell-Automation-Allen-Bradley-Kinetix-5500.html?page=151", "https://proxy-cf3-1.fbsidatest.workers.dev/https://literature.rockwellautomation.com/idc/groups/literature/documents/at/motion-at005_-en-p.pdf", "https://dol6gxheefykt.cloudfront.net/HPK-B1613C-MA42AA-Specifications.pdf (CloudFront mirror of Rockwell KNX-TD001I-EN-P, June 2023)", "https://docs.rs-online.com/2615/A700000009574131.pdf (RS-Online mirror of Rockwell VPF-IN001C-EN-P, Aug 2016)"], "tbd": ["Rockwell literature.rockwellautomation.com direct URL for KNX-TD001 was not returned by search; the manualUrl above is a distributor-hosted copy of Rockwell publication KNX-TD001A-EN-P (Feb 2017) read in full."], "sourceFile": "servo-motors.json"}, {"id": "ab-vpl", "category": "servo-motor", "family": "Kinetix VP VPL", "catalogNumbers": ["VPL-B1303F-PJ14AS"], "name": "Kinetix VP VPL Servo Motor", "whatItIs": "The Kinetix VP VPL is Allen-Bradley's low-inertia servo motor built for single-cable connection to Kinetix 5500 drives and Kinetix 5700 dual-axis inverters: one 2090 single cable carries power, feedback and brake. It uses the same proven magnetic core as the MP-Series MPL motors, with a Hiperface DSL digital encoder. The example motor VPL-B1303F-PJ14AS is a 480 V, 130 mm frame, 3-stack motor with an 18-bit single-turn / 12-bit multi-turn DSL encoder, keyed shaft, single SpeedTec DIN connector, 24 V DC holding brake and IP66 shaft seal.", "whenToUse": "Pick VPL when the system is a Kinetix 5500 or 5700 and you want the simplest wiring \u2014 one cable, one connector \u2014 with windings matched to the drive ratings for efficient sizing. Pick MPL instead when the drive is a Kinetix 6000/6200/6500/300/350/2000/7000 or Ultra3000, or when you need MPL's wider frame range (up to 300 mm, 163 N\u00b7m) and resolver/incremental feedback options. Pick VPF instead for food and beverage environments. Pick MPM instead for heavy-load axes where medium rotor inertia tunes better. Never pick VPL for a Kinetix 3, 6000 or 300/350 drive \u2014 KNX-TD001A p2 shows VPL compatible only with Kinetix 5500 and 5700.", "selection": "Size with FactoryTalk Motion Analyzer software (KNX-TD001: 'Use Motion Analyzer software to size and select motors'; also torque/speed curves in KNX-RM009 for Kinetix 5500 and KNX-RM010 for Kinetix 5700). Check: (1) continuous stall torque against RMS torque \u2014 VPL family range 0.46 to 33 N\u00b7m continuous stall, 1.33 to 79 N\u00b7m peak stall (KNX-TD001A p3); example VPL-B1303F (400 V): 8.80 N\u00b7m continuous stall, 20.72 N\u00b7m peak stall, 2.82 kW rated output, 4000 rpm rated and maximum speed. (2) Speed: up to 8000 rpm across the family. (3) Inertia: rotor inertia 0.00040 kg-m2 class for the 1303 frame \u2014 low inertia is the point of the family, so check Load Inertia Ratio carefully on heavy loads. (4) Frames: 63, 75, 100, 115, 130 and 165 mm; 200 V (A) or 400 V (B) windings matched to 5500/5700 ratings. (5) Feedback: C single-turn, P multi-turn, Q/W SIL 2 rated multi-turn \u2014 pick Q/W only if the safety design needs the safety-rated encoder. (6) Ambient 0-40 C; IP50 minimum without shaft seal, IP66 with optional shaft seal and environmentally sealed connectors.", "wiring": {"power": "SINGLE CABLE: one 2090 single motor cable carries power, feedback and brake to the single SpeedTec DIN (M1) connector on the motor, right angle, 325 deg rotatable, attached with a one-quarter turn (KNX-TD001A p5). Cable families: 2090-CSBM1DF-xxAAxx / -xxAFxx (power/feedback/brake) for Kinetix 5500, 2090-CSBM1DE-xxAAxx / -xxAFxx for Kinetix 5700, 2090-CSBM1DG-xxAAxx / -xxAFxx for either; 2090-CSWM1Dx are power/feedback cables without brake wires. Cables are available in 1.0 m increments up to 50 m for Kinetix 5500 drives and 90 m for Kinetix 5700 drives.", "feedback": "Hiperface DSL encoder protocol \u2014 purely digital two-wire communication integrated into the motor power cable (KNX-TD001A p5). Feedback options: C = 18-bit absolute single-turn digital encoder (262,144 counts/rev); P = 18-bit absolute multi-turn digital encoder (4096 turns); Q = 23-bit absolute multi-turn (8,388,608 counts/rev) SIL 2 (PLd) rated with 12-bit secondary safety channel; W = 18-bit absolute multi-turn SIL 2 (PLd) rated with 9-bit secondary safety channel. The electromechanical multi-turn design needs no battery. IMPORTANT (KNX-TD001A p5): 'Due to the unique characteristics of single cable technology, designed for and tested with Kinetix 5500 drives, Kinetix 5700 dual-axis inverters, and Bulletin VPL motors, building your own cables or using third-party cable is not an option.'", "safety": "Safe Torque-Off lives in the drive (Kinetix 5500/5700 ERS variants); the motor contributes safety-rated feedback only when a Q or W SIL 2 (PLd) encoder is fitted. The optional 24 V DC brake is a HOLDING brake only: KNX-TD001A p164 \u2014 designed to hold the shaft at 0 rpm up to the rated holding torque, not for stopping rotation, not a safety device. Example VPL-B1303 brake: 14.10 N\u00b7m holding torque, 0.738-0.902 A coil current at 24 V DC, release 125 ms / engage 120 ms with diode+zener arc suppression in the external circuit. Stop by commanding the drive to decelerate to 0 rpm, then engage the brake.", "network": "The motor has no network port. It connects by its single cable to a Kinetix 5500 drive or Kinetix 5700 dual-axis inverter, and the drive connects to the Logix controller over EtherNet/IP Integrated Motion. Select the drive first, then the motor catalog number in Studio 5000 Logix Designer."}, "configuration": [{"step": "Add the Kinetix 5500/5700 drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Electronic Keying", "value": "Compatible Module or Exact Match \u2014 never Disable Keying with motion modules", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Add the Kinetix 5500/5700 drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Connection", "value": "Motion", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create the axis for the drive", "screen": "Module Properties - Associated Axes tab", "parameter": "Data Type", "value": "AXIS_CIP_DRIVE (New Axis, Type Base)", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create a motion group and assign the axis", "screen": "Motion Group Properties - Attribute tab", "parameter": "Base Update Period", "value": "5 ms", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Axis Configuration", "value": "Position Loop", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Feedback Configuration", "value": "Motor Feedback", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Application Type / Loop Response", "value": "Basic / Medium", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Select the motor so all motor data fills in automatically", "screen": "Axis Properties - Motor", "parameter": "Data Source / Motor Catalog Number", "value": "Data Source = Catalog Number; Motor Catalog Number = VPL-B1303F-PJ14AS", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Load Type", "value": "Direct Coupled Rotary", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Position Units per Motor Rev / Travel Mode", "value": "1.0 Position Units per 1.0 Motor Rev; Travel Mode = Unlimited", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Tune the axis", "screen": "Axis Properties - Autotune tab", "parameter": "Autotune Start", "value": "Click Start and perform an autotune (see tuning)", "source": "Rockwell Motion System Tuning Application Technique MOTION-AT005, 'Using Load Observer with Autotune'"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (VPL-IN001).", "Mount with the connector pointing downward, cable entry underneath, and a drip loop in the cable; provide clearance, heatsink mass and airflow for 0-40 C ambient (VPL-IN001; KNX-TD001A p162).", "Verify axial and radial shaft loads do not exceed the Motor Load Force Ratings for the speed (L10 bearing life 20,000 hours, KNX-TD001A pp9-25).", "Use a torsionally rigid coupling or reinforced timing belt; do not strike the shaft, couplings or pulleys \u2014 sharp impact damages bearings and the feedback device.", "Rotate the single SpeedTec connector only by its housing (325 deg range); never use tools and never rotate repeatedly \u2014 the seal and IP rating suffer.", "An IP66 rating requires a shaft seal AND environmentally sealed connectors and cables (VPL-IN001).", "Inspect shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months, depending on use (KNX-TD001A p6).", "Use only Rockwell 2090 single-cable assemblies \u2014 do not build your own cable or use third-party cable (KNX-TD001A p5).", "Before first motion, confirm the brake (if fitted) releases with 24 V DC and that the axis is commanded to 0 rpm before the brake engages (KNX-TD001A p164)."], "tuning": "Tuning means setting the position/velocity loop gains so the axis follows its commanded move without oscillation, overshoot or following-error faults. Rockwell's method for Kinetix 5500/5700 drives is the Load Observer: MOTION-AT005 says the EtherNet/IP drive recommended settings use the load observer and 'produce a relatively high level of performance in 90% of motion applications', and work for unknown loads or when no autotune is performed. With Load Observer, out-of-box tuning uses Load Inertia Ratio = 0; after an autotune (Autotune tab, Start button in Axis Properties) the measured Load Inertia Ratio is greater than 0 and Load Observer Bandwidth (KOP) is set equal to Velocity Proportional Gain (KVP). Load Inertia Ratio is load inertia over motor inertia (Motion Analyzer manual). VPL's low rotor inertia is built for speed, so a heavy or compliant load (belt, long shaft, flexible coupling) drives the ratio up \u2014 the load observer automatically compensates for unknown compliance in belts, shafts and flexible couplings, and adjusts for applications where inertia varies during operation (Kinetix 5500 drive description). If the axis still oscillates, fix the mechanics first, then use Tracking Notch Filter from the Adaptive Tuning Configuration pull-down on the Compliance tab (MOTION-AT005). Reduce Maximum Acceleration/Deceleration if the loaded motor cannot reach the unloaded defaults.", "faults": [{"code": "FLT S05 - MTR OVERTEMP FL", "meaning": "Motor overtemperature, factory limit fault \u2014 calculations based on the motor thermistor indicate the motor factory temperature limit has been exceeded. 2198-UM001D notes this fault is available only on Kinetix VP motors.", "fix": "Operate motor within continuous torque rating; reduce motor ambient temperature; add motor cooling (2198-UM001)."}, {"code": "FLT S07 - MTR OVERLOAD FL", "meaning": "Motor thermal overload, factory limit fault \u2014 the motor thermal model has exceeded its factory-set thermal capacity limit of 110% (2198-UM001).", "fix": "Modify the command profile to reduce speed or increase time; operate within the continuous torque rating."}, {"code": "FLT S09 - MTR PHASE LOSS", "meaning": "Motor phase loss \u2014 the motor has failed torque proving (2198-UM001).", "fix": "Check motor connections (single-cable SpeedTec connector seating, drive-end terminals)."}, {"code": "FLT S45 - FDBK COMM FL", "meaning": "Motor feedback data loss, factory limit fault \u2014 consecutive missed or corrupted serial data packets from the DSL feedback device exceeded a factory-set limit (2198-UM001).", "fix": "Check motor feedback cable and connector; check motor power cable and feedback wire shields are secured correctly; check motor frame is grounded correctly."}, {"code": "FLT S47 - FDBK DEVICE FAILURE", "meaning": "Feedback device failure (2198-UM001).", "fix": "Check the single cable and connector for damage; if the fault persists the DSL encoder is faulty and the motor needs authorised repair \u2014 do not open the motor."}, {"code": "FLT S49 - BRAKE SLIP FLT", "meaning": "Brake slip exception (2198-UM001) \u2014 the holding brake slipped under load.", "fix": "Check the load against the brake holding torque (14.10 N\u00b7m for VPL-B1303); check 24 V DC brake supply and wiring; never use the holding brake to stop a moving shaft."}], "manualUrl": "https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://www.rockwellautomation.com/en-us/products/details.VPL-B1303F-PJ14AS.html", "https://www.rockwellautomation.com/en-us/products/details.VPL-B1303F-PJ14AS.html", "https://www.rockwellautomation.com/en-nl/docs/studio-5000-logix-designer/37-00/contents-ditamap/quick-start-steps/configuring-an-ethernet-motion-system.html", "https://www.manualslib.com/manual/1593435/Allen-Bradley-Kinetix-5500.html?page=163", "https://www.manualslib.com/manual/3008536/Rockwell-Automation-Allen-Bradley-Kinetix-5500.html?page=151", "https://proxy-cf3-1.fbsidatest.workers.dev/https://literature.rockwellautomation.com/idc/groups/literature/documents/at/motion-at005_-en-p.pdf", "https://dol6gxheefykt.cloudfront.net/HPK-B1613C-MA42AA-Specifications.pdf (CloudFront mirror of Rockwell KNX-TD001I-EN-P, June 2023)"], "tbd": ["Rockwell literature.rockwellautomation.com direct URL for KNX-TD001 was not returned by search; the manualUrl above is a distributor-hosted copy of Rockwell publication KNX-TD001A-EN-P (Feb 2017) read in full."], "sourceFile": "servo-motors.json"}, {"id": "ab-mpl", "category": "servo-motor", "family": "MP-Series MPL", "catalogNumbers": ["MPL-B4530K-SK74AA"], "name": "MP-Series MPL Servo Motor", "whatItIs": "The MP-Series MPL is Allen-Bradley's low-inertia, high-output brushless AC synchronous servo motor. It uses high-energy rare-earth magnets and Smart Motor Technology to deliver high torque from a compact frame, and it is the general-purpose high-performance servo motor for Kinetix systems. The example motor MPL-B4530K-SK74AA is a 460 V, 130 mm frame, 4000 rpm motor with a single-turn high-resolution encoder, keyless shaft, SpeedTec DIN connector and 24 V DC brake.", "whenToUse": "Pick MPL when the axis must accelerate, reverse and settle fast \u2014 pick-and-place, indexing, flying shear, rotary tables and packaging axes. Pick MPM instead when the load inertia is large and a heavier rotor damps the system better. Pick VPL instead when the drive is a Kinetix 5500/5700 and you want the single-cable DSL connection with no feedback converter kit. Pick TL/TLY instead only for small, low-torque (under about 5.4 N\u00b7m) 200 V axes.", "selection": "Size with FactoryTalk Motion Analyzer software (KNX-TD001: 'Use Motion Analyzer software to size and select motors'). Check in this order: (1) continuous stall torque of the candidate against the RMS torque of the move profile \u2014 MPL family range 0.26 to 163 N\u00b7m continuous stall, 0.74 to 278 N\u00b7m peak stall (KNX-TD001A p74); example MPL-B4530K (400 V): 8.25 N\u00b7m continuous stall, 20.3 N\u00b7m peak stall, 2.6 kW rated output, 4000 rpm rated and maximum speed. (2) Speed: rated speed up to 8000 rpm across the family; do not exceed the torque/speed curve for the matched drive in KNX-RM003/RM009/RM010. (3) Inertia: rotor inertia of MPL-B4530K is 0.00040 kg-m2; compare load inertia reflected to the motor shaft against rotor inertia \u2014 a large mismatch makes the axis hard to tune (see tuning). (4) Frame and heatsink: frames 63 mm to 300 mm; mount on an aluminium heatsink as specified in KNX-TD001 pp162-163 and keep ambient 0 to 40 C. (5) Voltage class: A = 200 V, B = 400 V \u2014 match the drive. (6) Feedback and brake options are chosen by catalog letters (see wiring/feedback).", "wiring": {"power": "Separate power/brake cable and feedback cable. MPL motors use SpeedTec DIN (M7) connectors, right angle, 180 deg rotatable, attached with a one-quarter turn (KNX-TD001A p76). Power/brake cables: 2090-CPBM7DF-xxAAxx standard non-flex or 2090-CPBM7DF-xxAFxx continuous-flex; power-only: 2090-CPWM7DF-xxAAxx / -xxAFxx. On Kinetix 5500 the MPL Hiperface feedback requires the 2198-H2DCK (series B or later) Hiperface-to-DSL converter kit; on Kinetix 5700 it requires the 2198-K57CK-D15M universal feedback connector kit (KNX-TD001A p74 footnotes). Converter-kit install (verified in 2198-UM001M Ch5 and 2198-UM002D Ch5, plus the 2198-H2DCK kit instructions): on a Kinetix 5500, mount the 2198-H2DCK (series B or later) kit on the drive with its frame-specific bracket, wire the 2090 feedback cable to the kit's 10-pin connector, and plug the kit's 2-pin DSL connector into the drive MF connector; on a Kinetix 5700 use the 2198-K57CK-D15M universal feedback connector kit on the 15-pin UFB connector instead (it terminates Hiperface/TTL incremental/sin-cos/EnDat feedback; it is a connector kit, not a converter). For either kit: expose 12 mm (0.5 in.) of cable shield and apply the shield clamp (H2DCK clamp screws 0.30 N\u00b7m / 2.6 lb\u00b7in; K57CK clamp screws 0.34 N\u00b7m / 3.0 lb\u00b7in; terminal screws 0.22-0.25 N\u00b7m), route each wire to its pinout terminal with a service loop, pull-test each wire, attach the tie wrap, and install MF-connector kits before the UFB kit. With the H2DCK kit the drive enclosure ambient is derated to 0-40 \u00b0C and feedback cable length is limited to 20 m.", "feedback": "Hiperface (Stegmann) encoder protocol (KNX-TD001A p74). Feedback options by catalog letter: V = 128 sin/cos absolute multi-turn, M = 1024 sin/cos absolute multi-turn (up to 21-bit, 2,097,152 counts/rev), E = 128 sin/cos absolute single-turn, S = 1024 sin/cos absolute single-turn (up to 21-bit), H = 2000 lines/rev incremental encoder, R = resolver (limited frames). Single-turn gives absolute position within one turn; multi-turn gives absolute position within 4096 turns and the electromechanical design needs no battery. Feedback cables: 2090-CFBM7DF-CEAAxx flying-lead or 2090-CFBM7DD-CEAAxx drive-end (standard), -CEAFxx continuous-flex.", "safety": "Safe Torque-Off lives in the drive, not the motor; there is no STO wiring on the motor itself. The optional 24 V DC brake is a HOLDING brake only: KNX-TD001A p164 \u2014 brakes 'are designed to hold the motor shaft at 0 rpm up to the rated brake holding torque', 'are not designed for stopping rotation', 'are not designed nor are they intended to be used as a safety device'. Stop by commanding the drive to decelerate to 0 rpm, then engage the brake. Example MPL-B4530 brake: 10.2 N\u00b7m holding torque, 0.576-0.704 A coil current at 24 V DC. A customer-supplied diode or MOV arc suppressor is recommended on the brake relay contacts unless the drive already provides one. MPL has no SIL-rated encoder option (SIL 2/PLd encoders are a VPL/VPF option).", "network": "The motor has no network port. It connects to a Kinetix drive (5500, 5700, 6200/6500, 6000, 300/350, 2000, 7000, Ultra3000 per KNX-TD001A p74) and the drive connects to the Logix controller over EtherNet/IP Integrated Motion (5500/5700/6500) or Sercos (6000/6200). Select the drive first, then the motor catalog number in Studio 5000 Logix Designer."}, "configuration": [{"step": "Add the Kinetix drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Electronic Keying", "value": "Compatible Module or Exact Match \u2014 never Disable Keying with motion modules", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Add the Kinetix drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Connection", "value": "Motion", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create the axis for the drive", "screen": "Module Properties - Associated Axes tab", "parameter": "Data Type", "value": "AXIS_CIP_DRIVE (New Axis, Type Base)", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create a motion group and assign the axis", "screen": "Motion Group Properties - Attribute tab", "parameter": "Base Update Period", "value": "5 ms", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Axis Configuration", "value": "Position Loop", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Feedback Configuration", "value": "Motor Feedback", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Application Type / Loop Response", "value": "Basic / Medium", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Select the motor so all motor data fills in automatically", "screen": "Axis Properties - Motor", "parameter": "Data Source / Motor Catalog Number", "value": "Data Source = Catalog Number; Motor Catalog Number = MPL-B4530K-SK74AA", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system' \u2014 'All of the motor settings are completed automatically to match the settings specified for that catalog number'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Load Type", "value": "Direct Coupled Rotary", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Position Units per Motor Rev / Travel Mode", "value": "1.0 Position Units per 1.0 Motor Rev; Travel Mode = Unlimited", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Tune the axis", "screen": "Axis Properties - Autotune tab", "parameter": "Autotune Start", "value": "Click Start and perform an autotune (see tuning)", "source": "Rockwell Motion System Tuning Application Technique MOTION-AT005, 'Using Load Observer with Autotune'"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (MP-IN002).", "Mount with the connector housing pointing downward, cable entry underneath the motor, and a drip loop in each cable (MP-IN001/MP-IN015).", "Provide clearance, heatsink mass and airflow so the motor stays within 0-40 C ambient; do not enclose the motor unless forced air is blown across it, and keep other heat-producing devices away (MP-IN001 p10; KNX-TD001A p162).", "Verify axial and radial shaft loads do not exceed the Motor Load Force Ratings for the speed (L10 bearing life 20,000 hours, KNX-TD001A pp81-83); for MPL-B4530 radial load is 133 kg at 500 rpm falling to 66 kg at 5000 rpm.", "Use a torsionally rigid coupling or reinforced timing belt; do not strike the shaft, couplings or pulleys with tools \u2014 sharp impact damages bearings and the feedback device (MP-IN001).", "Rotate the SpeedTec DIN connector only by grasping both connector housings, never with tools and never repeatedly \u2014 excessive rotation or force damages the connector seal and reduces the IP rating (MP-IN001 p10).", "Electronic zero (index pulse / Stegmann ABS = 0) occurs when the shaft key or dimple is aligned with the connectors \u2014 check alignment against the mounting dimensions (MP-IN001 p10).", "Inspect shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months, depending on use (KNX-TD001A p77).", "Before first motion, confirm the brake releases with 24 V DC applied and that the axis is commanded to 0 rpm before the brake is engaged \u2014 the brake is a holding brake, not a stopping brake (KNX-TD001A p164)."], "tuning": "Tuning means setting the position/velocity loop gains so the axis follows its commanded move without oscillation, overshoot or following-error faults. Rockwell's method for Kinetix 5500/5700/6500 drives is the Load Observer: MOTION-AT005 says the EtherNet/IP drive recommended settings use the load observer and 'produce a relatively high level of performance in 90% of motion applications', and work for unknown loads or when no autotune is performed. With Load Observer, out-of-box tuning uses Load Inertia Ratio = 0; after an autotune (Autotune tab, Start button in Axis Properties) the measured Load Inertia Ratio is greater than 0 and Load Observer Bandwidth (KOP) is set equal to Velocity Proportional Gain (KVP). Load Inertia Ratio is defined in the Motion Analyzer manual as load inertia over motor inertia \u2014 so for MPL the small rotor inertia (0.00040 kg-m2 on the MPL-B4530K) is an advantage for acceleration but makes the axis sensitive to a heavy, compliant load: if autotune reports a large Load Inertia Ratio, fix the mechanics first (stiffen the coupling, reduce backlash, add a gearbox) rather than forcing higher gains. For Kinetix 5500/5700, choose Tracking Notch Filter from the Adaptive Tuning Configuration pull-down on the Compliance tab in Axis Properties (MOTION-AT005). Reduce Maximum Acceleration/Deceleration if the loaded motor cannot reach the unloaded defaults. Tuning cannot fix a wrong motor size: if the axis faults on overload, re-check continuous vs peak torque in Motion Analyzer.", "faults": [{"code": "FLT S02 - MTR COMMUTATION", "meaning": "Motor commutation fault (Kinetix 5500/5700 drive, 2198-UM001). The drive has lost correct commutation of the motor.", "fix": "Check motor power and feedback wiring and connectors; verify the correct motor catalog number is selected in Axis Properties - Motor; check for a damaged feedback cable."}, {"code": "FLT S03 - MTR OVERSPEED FL", "meaning": "Motor overspeed, factory limit fault \u2014 motor speed has exceeded 125% of its maximum speed (2198-UM001).", "fix": "Check control loop tuning (MOTION-AT005); check the commanded profile and overspeed limits in Axis Properties."}, {"code": "FLT S07 - MTR OVERLOAD FL", "meaning": "Motor thermal overload, factory limit fault \u2014 the motor thermal model has exceeded its factory-set thermal capacity limit of 110% (2198-UM001).", "fix": "Modify the command profile to reduce speed or increase time; operate the motor within its continuous torque rating; check ambient temperature and heatsink/airflow."}, {"code": "FLT S09 - MTR PHASE LOSS", "meaning": "Motor phase loss \u2014 the motor has failed torque proving (2198-UM001).", "fix": "Check motor connections (power cable, SpeedTec connector seating, drive-end terminals)."}, {"code": "FLT S45 - FDBK COMM FL", "meaning": "Motor feedback data loss, factory limit fault \u2014 the number of consecutive missed or corrupted serial data packets from the intelligent feedback device has exceeded a factory-set limit (2198-UM001).", "fix": "Check motor feedback cable and connector; check motor power cable and feedback wire shields are secured correctly; check motor frame is grounded correctly."}, {"code": "FLT S47 - FDBK DEVICE FAILURE", "meaning": "Feedback device failure (2198-UM001) \u2014 the drive cannot use the motor feedback device.", "fix": "Check the feedback cable and connector for damage; if the fault persists the encoder/feedback device is faulty and the motor needs authorised repair \u2014 do not open the motor (MP-IN002: only an authorised Allen-Bradley repair centre can service it)."}, {"code": "FLT S05 - MTR OVERTEMP FL", "meaning": "Motor overtemperature, factory limit fault \u2014 calculations based on the motor thermistor indicate the motor factory temperature limit has been exceeded. Sub-codes: 01 motor thermostat or thermistor, 02 encoder temperature sensor (2198-UM002D Table 91).", "fix": "Operate motor within continuous torque rating; reduce motor ambient temperature; add motor cooling (2198-UM002D Table 91)."}], "manualUrl": "https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://www.rockwellautomation.com/en-us/products/details.MPL-B4530K-SK74AA.html", "https://www.rockwellautomation.com/en-nl/docs/studio-5000-logix-designer/37-00/contents-ditamap/quick-start-steps/configuring-an-ethernet-motion-system.html", "https://www.rockwellautomation.com/en-ua/docs/studio-5000-logix-designer/37-00/contents-ditamap/studio-5000-logix-designer/axis-properties-for-ethernet-motion-system/configure-the-axis-properties/axis-wizard-props-drive-motor-axis-servo-drive.html", "https://literature.rockwellautomation.com/idc/groups/literature/documents/pc/mp-pc002_-en-p.pdf", "https://www.manualslib.com/manual/1593435/Allen-Bradley-Kinetix-5500.html?page=163", "https://www.manualslib.com/manual/3008536/Rockwell-Automation-Allen-Bradley-Kinetix-5500.html?page=151", "https://proxy-cf3-1.fbsidatest.workers.dev/https://literature.rockwellautomation.com/idc/groups/literature/documents/at/motion-at005_-en-p.pdf", "https://www.rockwellautomation.com/en-mde/products/software/factorytalk/designsuite/motion-analyzer.html", "https://dol6gxheefykt.cloudfront.net/HPK-B1613C-MA42AA-Specifications.pdf (CloudFront mirror of Rockwell KNX-TD001I-EN-P, June 2023)", "https://elwood.com/dElwood_H2DCK.pdf (Elwood distributor mirror of the 2198-H2DCK kit instructions)"], "tbd": ["Rockwell literature.rockwellautomation.com direct URL for KNX-TD001 was not returned by search; the manualUrl above is a distributor-hosted copy of the same Rockwell publication KNX-TD001A-EN-P (Feb 2017) that was read in full \u2014 replace with the literature.rockwellautomation.com link when confirmed."], "sourceFile": "servo-motors.json"}, {"id": "ab-mpm", "category": "servo-motor", "family": "MP-Series MPM", "catalogNumbers": ["MPM-B1153F-MJ72AA"], "name": "MP-Series MPM Servo Motor", "whatItIs": "The MP-Series MPM is Allen-Bradley's medium-inertia brushless AC synchronous servo motor. It combines the features of the low-inertia MPL motors with a rotor that is better suited for high-inertia loads (MPM-IN001). The example motor MPM-B1153F-MJ72AA is a 460 V, 115 mm frame, 3-stack, 3000 rpm motor with a multi-turn high-resolution encoder, keyed shaft and SpeedTec DIN connector, no brake.", "whenToUse": "Pick MPM when the load inertia is large relative to the motor \u2014 printing, web handling, converting and automotive axes, and any axis where an MPL would need a gearbox or would be hard to tune because the load dominates the rotor. Pick MPL instead for fast, light, high-acceleration axes where low rotor inertia is the advantage. Pick VPL instead when the drive is a Kinetix 5500/5700 and single-cable DSL wiring is wanted (MPM on those drives needs a Hiperface-to-DSL converter kit). Do not pick MPM for food or washdown duty \u2014 that is MPF/MPS/VPF territory.", "selection": "Size with FactoryTalk Motion Analyzer software (KNX-TD001: 'Use Motion Analyzer software to size and select motors'). Check: (1) continuous stall torque against RMS torque \u2014 MPM family range 2.18 to 62.8 N\u00b7m continuous stall, 6.6 to 154.2 N\u00b7m peak stall (KNX-TD001A p91); example MPM-B1153F (400 V): 6.55 N\u00b7m continuous stall, 19.8 N\u00b7m peak stall, 1.45 kW rated output, 3000 rpm base speed, 4000 rpm rated speed and 5500 rpm maximum speed. (2) Speed: up to 7000 rpm across the family; base speed equals maximum speed at peak torque (KNX-TD001A p92 note). (3) Inertia: rotor inertia of MPM-B1153F is 0.00089 kg-m2 \u2014 roughly double the same-frame MPL rotor \u2014 which is the point of the family: the heavier rotor matches heavy loads so the Load Inertia Ratio stays manageable. (4) Frames: 115, 130, 165 and 215 mm bolt-circle diameter; 200 V (A) or 400 V (B) windings. (5) Ambient 0-40 C, mount on the aluminium heatsink specified in KNX-TD001 pp162-163. (6) Resolver feedback is not available on all models (KNX-TD001A p92).", "wiring": {"power": "Separate power/brake cable and feedback cable, same as MPL. MPM motors use SpeedTec DIN (M7) connectors, right angle, 180 deg rotatable, one-quarter turn (KNX-TD001A p93). Power/brake cables: 2090-CPBM7DF-xxAAxx standard or 2090-CPBM7DF-xxAFxx continuous-flex; power-only: 2090-CPWM7DF-xxAAxx / -xxAFxx. On Kinetix 5500, MPM requires the 2198-H2DCK Hiperface-to-DSL converter kit, and 200 V-class MPM motors require the 2198-H2DCK series B or later (KNX-TD001A p91 footnote). On a Kinetix 5700 use the 2198-K57CK-D15M universal feedback connector kit on the 15-pin UFB connector instead (2198-UM002D Table 72 lists MPM-Bxxxxx-M/S under both kits; it terminates Hiperface/TTL incremental/sin-cos/EnDat feedback). Kit install (2198-UM001M Ch5; 2198-UM002D Ch5; 2198-H2DCK kit instructions): mount the H2DCK kit with its frame-specific bracket, wire the feedback cable to the kit's 10-pin connector, plug the 2-pin DSL connector into the drive MF connector; expose 12 mm (0.5 in.) of shield for the shield clamp (H2DCK 0.30 N\u00b7m; K57CK 0.34 N\u00b7m; terminal screws 0.22-0.25 N\u00b7m), route each wire to its pinout terminal with a service loop, pull-test each wire, attach the tie wrap; with the H2DCK kit the enclosure ambient derates to 0-40 \u00b0C.", "feedback": "Hiperface encoder protocol (KNX-TD001A p91). Feedback options by catalog letter: 2 = resolver, 4-pole (not on all models); M = 1024 sin/cos absolute multi-turn encoder (Hiperface, up to 21-bit, 2,097,152 counts/rev); S = 1024 sin/cos absolute single-turn encoder (Hiperface). Single-turn gives absolute position within one turn; multi-turn gives absolute position within 4096 turns with no battery (electromechanical design). Feedback cables: 2090-CFBM7DF-CEAAxx flying-lead or 2090-CFBM7DD-CEAAxx drive-end (standard), -CEAFxx continuous-flex. Note the difference from MPL: MPM has no 128 sin/cos (E/V) or 2000-line incremental (H) feedback options in KNX-TD001A \u2014 only resolver, M and S.", "safety": "Safe Torque-Off lives in the drive, not the motor. The optional 24 V DC brake is a HOLDING brake only: KNX-TD001A p164 \u2014 brakes 'are designed to hold the motor shaft at 0 rpm up to the rated brake holding torque', 'are not designed for stopping rotation', 'are not designed nor are they intended to be used as a safety device'. Stop by commanding the drive to decelerate to 0 rpm, then engage the brake. A customer-supplied diode or MOV arc suppressor is recommended on brake relay contacts unless the drive already provides one. MPM has no SIL-rated encoder option.", "network": "The motor has no network port. It connects to a Kinetix drive (5500, 5700, 6200/6500, 6000, 300/350, 2000, 7000, Ultra3000 per KNX-TD001A p91) and the drive connects to the Logix controller over EtherNet/IP Integrated Motion or Sercos. Select the drive first, then the motor catalog number in Studio 5000 Logix Designer."}, "configuration": [{"step": "Add the Kinetix drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Electronic Keying", "value": "Compatible Module or Exact Match \u2014 never Disable Keying with motion modules", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Add the Kinetix drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Connection", "value": "Motion", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create the axis for the drive", "screen": "Module Properties - Associated Axes tab", "parameter": "Data Type", "value": "AXIS_CIP_DRIVE (New Axis, Type Base)", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create a motion group and assign the axis", "screen": "Motion Group Properties - Attribute tab", "parameter": "Base Update Period", "value": "5 ms", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Axis Configuration", "value": "Position Loop", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Feedback Configuration", "value": "Motor Feedback", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Application Type / Loop Response", "value": "Basic / Medium", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Select the motor so all motor data fills in automatically", "screen": "Axis Properties - Motor", "parameter": "Data Source / Motor Catalog Number", "value": "Data Source = Catalog Number; Motor Catalog Number = MPM-B1153F-MJ72AA", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Load Type", "value": "Direct Coupled Rotary", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Position Units per Motor Rev / Travel Mode", "value": "1.0 Position Units per 1.0 Motor Rev; Travel Mode = Unlimited", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Tune the axis", "screen": "Axis Properties - Autotune tab", "parameter": "Autotune Start", "value": "Click Start and perform an autotune (see tuning)", "source": "Rockwell Motion System Tuning Application Technique MOTION-AT005, 'Using Load Observer with Autotune'"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (MPM-IN001).", "Mount with the connector housing pointing downward, cable entry underneath the motor, and a drip loop in each cable (MPM-IN001, same MP-Series practice as MP-IN001).", "Provide clearance, heatsink mass and airflow so the motor stays within 0-40 C ambient; do not enclose the motor unless forced air is blown across it (MP-IN001 p10; KNX-TD001A p162).", "Verify axial and radial shaft loads do not exceed the Motor Load Force Ratings for the speed (L10 bearing life 20,000 hours, KNX-TD001A).", "Use a torsionally rigid coupling or reinforced timing belt; do not strike the shaft, couplings or pulleys with tools \u2014 sharp impact damages bearings and the feedback device.", "Rotate the SpeedTec DIN connector only by grasping both connector housings, never with tools and never repeatedly \u2014 excessive rotation damages the connector seal and reduces the IP rating.", "Electronic zero occurs when the shaft key or dimple is aligned with the connectors \u2014 check alignment against the mounting dimensions.", "Inspect shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months, depending on use (KNX-TD001A p94).", "Before first motion, confirm the brake (if fitted) releases with 24 V DC applied and that the axis is commanded to 0 rpm before the brake is engaged (KNX-TD001A p164)."], "tuning": "Tuning means setting the position/velocity loop gains so the axis follows its commanded move without oscillation, overshoot or following-error faults. Rockwell's method for Kinetix 5500/5700/6500 drives is the Load Observer: MOTION-AT005 says the EtherNet/IP drive recommended settings use the load observer and 'produce a relatively high level of performance in 90% of motion applications', and work for unknown loads or when no autotune is performed. With Load Observer, out-of-box tuning uses Load Inertia Ratio = 0; after an autotune (Autotune tab, Start button in Axis Properties) the measured Load Inertia Ratio is greater than 0 and Load Observer Bandwidth (KOP) is set equal to Velocity Proportional Gain (KVP). Load Inertia Ratio is load inertia over motor inertia (Motion Analyzer manual). MPM exists for exactly this number: its heavier rotor (0.00089 kg-m2 on the MPM-B1153F, vs 0.00040 kg-m2 for the same-frame MPL-B4530K class) brings the ratio down on heavy loads, so the axis tunes stiffer and holds position better under load changes. If autotune still reports a large ratio, fix the mechanics first (stiffen the coupling, reduce backlash, add a gearbox) rather than forcing higher gains. For Kinetix 5500/5700, choose Tracking Notch Filter from the Adaptive Tuning Configuration pull-down on the Compliance tab (MOTION-AT005). Reduce Maximum Acceleration/Deceleration if the loaded motor cannot reach the unloaded defaults. Tuning cannot fix a wrong motor size: if the axis faults on overload, re-check continuous vs peak torque in Motion Analyzer.", "faults": [{"code": "FLT S02 - MTR COMMUTATION", "meaning": "Motor commutation fault (Kinetix 5500/5700 drive, 2198-UM001).", "fix": "Check motor power and feedback wiring and connectors; verify the correct motor catalog number is selected in Axis Properties - Motor; check for a damaged feedback cable."}, {"code": "FLT S03 - MTR OVERSPEED FL", "meaning": "Motor overspeed, factory limit fault \u2014 motor speed has exceeded 125% of its maximum speed (2198-UM001).", "fix": "Check control loop tuning (MOTION-AT005); check the commanded profile and overspeed limits."}, {"code": "FLT S07 - MTR OVERLOAD FL", "meaning": "Motor thermal overload, factory limit fault \u2014 the motor thermal model has exceeded its factory-set thermal capacity limit of 110% (2198-UM001).", "fix": "Modify the command profile to reduce speed or increase time; operate within the continuous torque rating; check ambient and heatsink/airflow."}, {"code": "FLT S09 - MTR PHASE LOSS", "meaning": "Motor phase loss \u2014 the motor has failed torque proving (2198-UM001).", "fix": "Check motor connections (power cable, SpeedTec connector seating, drive-end terminals)."}, {"code": "FLT S45 - FDBK COMM FL", "meaning": "Motor feedback data loss, factory limit fault \u2014 consecutive missed or corrupted serial data packets from the intelligent feedback device exceeded a factory-set limit (2198-UM001).", "fix": "Check motor feedback cable and connector; check motor power cable and feedback wire shields are secured correctly; check motor frame is grounded correctly."}, {"code": "FLT S47 - FDBK DEVICE FAILURE", "meaning": "Feedback device failure (2198-UM001).", "fix": "Check the feedback cable and connector for damage; if the fault persists the encoder is faulty and the motor needs authorised repair \u2014 do not open the motor (only an authorised Allen-Bradley repair centre can service it)."}, {"code": "FLT S05 - MTR OVERTEMP FL", "meaning": "Motor overtemperature, factory limit fault \u2014 calculations based on the motor thermistor indicate the motor factory temperature limit has been exceeded. Sub-codes: 01 motor thermostat or thermistor, 02 encoder temperature sensor (2198-UM002D Table 91).", "fix": "Operate motor within continuous torque rating; reduce motor ambient temperature; add motor cooling (2198-UM002D Table 91)."}], "manualUrl": "https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://www.rockwellautomation.com/en-ro/products/details.MPM-B1153F-MJ72AA.html", "https://www.rockwellautomation.com/en-nl/docs/studio-5000-logix-designer/37-00/contents-ditamap/quick-start-steps/configuring-an-ethernet-motion-system.html", "https://literature.rockwellautomation.com/idc/groups/literature/documents/pc/mp-pc002_-en-p.pdf", "https://www.manualslib.com/manual/1593435/Allen-Bradley-Kinetix-5500.html?page=163", "https://www.manualslib.com/manual/3008536/Rockwell-Automation-Allen-Bradley-Kinetix-5500.html?page=151", "https://proxy-cf3-1.fbsidatest.workers.dev/https://literature.rockwellautomation.com/idc/groups/literature/documents/at/motion-at005_-en-p.pdf", "https://dol6gxheefykt.cloudfront.net/HPK-B1613C-MA42AA-Specifications.pdf (CloudFront mirror of Rockwell KNX-TD001I-EN-P, June 2023)", "https://elwood.com/dElwood_H2DCK.pdf (Elwood distributor mirror of the 2198-H2DCK kit instructions)"], "tbd": ["Rockwell literature.rockwellautomation.com direct URL for KNX-TD001 was not returned by search; the manualUrl above is a distributor-hosted copy of Rockwell publication KNX-TD001A-EN-P (Feb 2017) read in full."], "sourceFile": "servo-motors.json"}, {"id": "ab-tl", "category": "servo-motor", "family": "TL-Series TL", "catalogNumbers": ["TL-A220P-HJ32AN"], "name": "TL-Series TL Servo Motor", "whatItIs": "The TL-Series TL is the metric-frame, Kinetix 3 variant of the TL-Series compact low-inertia servo motor. Its performance specifications match the Bulletin TLY motor specifications identically (KNX-TD001A p149), but TL motors are available only in metric frame sizes, use rectangular plastic connectors with 300 mm cables instead of TLY's 1 m circular-connector cables, and are intended for use with Kinetix 3 servo drives. The example motor TL-A220P-HJ32AN is a 200 V, 70 mm frame, 5000 rpm motor with a 2000-line incremental encoder, shaft key, rectangular connectors and NEMA mounting.", "whenToUse": "Pick TL when the drive is a Kinetix 3 and the axis is small (under 5.42 N\u00b7m continuous) \u2014 the TL is the motor Rockwell pairs with the Kinetix 3. Pick TLY instead when the drive is a Kinetix 300/350, 2000, 6000 or Ultra3000, or when NEMA frames and circular connectors are wanted. Pick VPL/MPL instead when the axis needs more than 5.42 N\u00b7m, 400 V, absolute multi-turn feedback without a battery, or a Kinetix 5500/5700 drive. Note the family split in KNX-TD001A p149: TL supports frames TL-A110, TL-A120, TL-A130, TL-A220, TL-A230, TL-A2530, TL-A2540 and TL-A410 \u2014 TL-A310 is NOT supported (that frame exists only as TLY-A310).", "selection": "Size with FactoryTalk Motion Analyzer software. Check: (1) continuous stall torque against RMS torque \u2014 TL-Series family range 0.086 to 5.42 N\u00b7m continuous stall, 0.22 to 13 N\u00b7m peak stall (KNX-TD001A p150); example TL-A220 (non-brake): 0.836 N\u00b7m continuous, 1.48 N\u00b7m peak, 0.35 kW, 5000 rpm rated. Brake versions are de-rated (TL-A220 with brake: 0.757 N\u00b7m continuous, 0.24 kW) \u2014 read the brake table. (2) Speed: 4500, 5000 and 6000 rpm rated speeds; the 6000 rpm rating applies only to TLY-AxxxT-H incremental motors, so TL motors top out at 5000 rpm in the tables (KNX-TD001A p154 note 3). (3) Inertia: rotor inertia TL-A220 is 0.000018 kg-m2 \u2014 the load dominates, so check Load Inertia Ratio. (4) Voltage: 200 V class only (A). (5) Frames metric only: 46, 70, 90, 100 (TL-A310 not supported) and 115 mm (TL-A410, metric only). (6) Ambient 0-40 C; IP65 housing with optional shaft seal.", "wiring": {"power": "TL motors have 300 mm (11.8 in.) cable extensions with rectangular plastic connectors (KNX-TD001A p152). Power cables: 2090-DANPT-16Sxx (standard, non-flex); brake cables (optional): 2090-DANBT-18Sxx (standard, non-flex). Do not confuse with TLY's circular threaded connectors and 1 m cables, or with MPL/VPL SpeedTec DIN cables.", "feedback": "Feedback options (KNX-TD001I p144-146): TL motors are available ONLY with the B = multi-turn, 17-bit (131,072 counts/rev), absolute, battery-backed encoder (serial protocol; single-turn without battery backup). The H = 2000 lines/rev incremental encoder applies to TLY motors only \u2014 do not order or teach an H-feedback TL motor. The shared TL/TLY catalog chart lists both B and H codes, which caused the confusion; the Kinetix 3 compatibility row settles it (KNX-TD001I p2: Kinetix 3 supports TL-Axx-B only). Feedback cable: 2090-DANFCT-Sxx (standard, non-flex). The absolute (B) option holds multi-turn position only while its battery is good (Kinetix 3 uses the 2071-TBMF motor feedback breakout board with battery backup); without battery backup it is single-turn, so the axis must home if multi-turn position matters after a power cycle.", "safety": "Safe Torque-Off lives in the drive, not the motor. The optional 24 V DC brake is a HOLDING brake only (KNX-TD001A p164): hold the shaft at 0 rpm up to the rated holding torque, not for stopping rotation, not a safety device. Stop by commanding the drive to decelerate to 0 rpm, then engage the brake. TL has no SIL-rated encoder option.", "network": "The motor has no network port. TL is compatible only with Kinetix 3 servo drives (KNX-TD001A p150) \u2014 NOT with Kinetix 5500/5700, 6000, 300/350 or 2000. The Kinetix 3 drive is configured in Connected Components Workbench (configuration steps verified in 2071-UM001E Ch7 \u2014 see Configuration below)."}, "configuration": [{"step": "Add the Kinetix 3 drive to a Connected Components Workbench project and connect to it", "screen": "Connected Components Workbench \u2014 Device Toolbox / Project Organizer / Kinetix 3 pane", "parameter": "Device / connection", "value": "Device Toolbox > Drives > Kinetix 3, drag to Project Organizer; double-click the Kinetix 3 icon; Add+ tab > 1203-USB USB to DSI > Add; 0-Kinetix 3 tab > Connect; expand AB_DF1, click 01, AB DSI > OK", "source": "2071-UM001E Ch7 p91-93"}, {"step": "Run the Kinetix 3 Startup Wizard and reset the drive to factory settings", "screen": "Connected Components Workbench \u2014 Wizards / Kinetix 3 Startup Wizard", "parameter": "Encoder Backup Battery / Emergency Stop Input", "value": "Wizards icon > Kinetix 3 Startup Wizard > Reset to Factory Settings; choose the Encoder Backup Battery and Emergency Stop Input options; click Next", "source": "2071-UM001E Ch7 p93-94"}, {"step": "Choose controller and operation mode, set the gear ratio, verify the motor", "screen": "Kinetix 3 Startup Wizard", "parameter": "Controller / Operation Mode / First Gear Ratio / motor identification", "value": "Choose Controller and Operation Mode > Next; enter First Gear Ratio > Next; verify the motor has been identified correctly > Next", "source": "2071-UM001E Ch7 p95"}, {"step": "Autotune, finish and save (also the TL tuning procedure)", "screen": "Kinetix 3 Startup Wizard", "parameter": "Start Autotuning", "value": "Click Start Autotuning (status shows Autotuning Now, then Autotuning Successful) > Finish > File > Save", "source": "2071-UM001E Ch7 p95-96"}, {"step": "Select the motor and set homing (advanced changes in the Configuration Wizard)", "screen": "Connected Components Workbench \u2014 Kinetix 3 Configuration Wizard (Motor / Homing panes)", "parameter": "Motor selection / Homing type", "value": "Motor pane: select the motor (TL absolute B-feedback; verify it is identified). Homing pane: configure the homing operation the drive performs. Alternative tool: Ultraware Ch8 p104 \u2014 Motor Model pull-down to choose the motor; Input 1 defaults to Drive Enable", "source": "2071-UM001E Ch7 Table 33 p98-99; Ch8 p104-105"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (TL-IN001).", "Use a torsionally rigid coupling or a reinforced timing belt \u2014 all connections between machine and motor shaft must be rigid to achieve acceptable system response (TL-IN001 p7).", "Verify axial and radial loads are within the Motor Load Force Ratings for 20,000 hours of bearing life (TL-IN001 p11; KNX-TD001A p154).", "Do not strike the shaft, key, couplings or pulleys with tools during installation or removal (TL-IN001) \u2014 impact damages bearings and the feedback device.", "Mount with the connector pointing downward and a drip loop in each cable; keep ambient 0-40 C with airflow (KNX-TD001A p162).", "If the absolute (B) encoder is fitted, confirm the battery-backed connector kit is installed or the axis will be single-turn only (KNX-TD001A p152).", "If the incremental (H) encoder is fitted, plan a homing move on every power-up \u2014 incremental feedback has no absolute position after power loss.", "Inspect shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months (KNX-TD001A p153). Shaft seal kits: TL-A1xx TL-SSN-1, TL-A2xx TL-SSN-2, TL-A25xx TL-SSN-3, TL-A4xx TL-SSN-4.", "Before first motion, confirm the brake (if fitted) releases with 24 V DC and that the axis is commanded to 0 rpm before the brake engages (KNX-TD001A p164)."], "tuning": "Tune a TL axis on its Kinetix 3 drive \u2014 there is no Studio 5000 autotune for TL (MOTION-AT005 covers 5300/5500/5700/6500 only and TL runs on Kinetix 3). Two verified routes in 2071-UM001E: (1) Connected Components Workbench Startup Wizard (Ch7 p95-96): after the motor is identified, click Start Autotuning \u2014 status shows Autotuning Now, then Autotuning Successful \u2014 then Finish and save. (2) Ultraware (Ch8 p106): double-click the Tuning branch, click Start Autotuning, click OK, then Start Autotune; when done, copy the Main Gains to alternate gains as needed. The Tuning branch also configures the velocity, position and current regulator gains and offers manual position and manual velocity tuning. Tune with the load removed first, then re-attach the load and tune again. What still applies from the general method: Load Inertia Ratio is load inertia over motor inertia (Motion Analyzer manual), and TL rotor inertias are extremely small (0.000018 kg-m2 for TL-A220), so the load dominates and rigid mechanics matter more than gain tweaks.", "faults": [{"code": "E.004", "meaning": "Motor Overtemperature \u2014 the motor thermal switch trips (2071-UM001E Table 35, p116).", "fix": "Operate within (not above) the continuous torque rating for the ambient temperature; lower ambient temperature or increase motor cooling; check motor wiring; verify the proper motor has been selected."}, {"code": "E.030", "meaning": "Encoder Cable Open \u2014 communication not established with an intelligent encoder, or Hall error (2071-UM001E Table 35, p117).", "fix": "Verify motor selection if it does not support automatic identification; verify the motor supports automatic identification; verify encoder wiring."}, {"code": "E.022", "meaning": "Motor Continuous Current Overload \u2014 the internal filter protecting the motor from overheating has tripped (2071-UM001E Table 35, p117).", "fix": "Reduce acceleration rates; reduce duty cycle (ON/OFF) of commanded motion; increase time permitted for motion; use a larger drive and motor; check tuning."}], "manualUrl": "https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/tl-in003_-en-p.pdf?A294B0B9BE6499A2807587A47F9C9E61C073C4A9B8&ts=1778731798841", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/tl-in003_-en-p.pdf?A294B0B9BE6499A2807587A47F9C9E61C073C4A9B8&ts=1778731798841", "https://www.manualsdir.com/manuals/581264/rockwell-automation-tl-series-servo-motor.html?page=7", "https://oeelab.com/allen-bradley-kinetix-ultra3000-fault-codes", "https://abmarketotomasyon.com/wp-content/uploads/2025/08/2071-UM001-EN-P.pdf (distributor mirror of Rockwell 2071-UM001E-EN-P, Nov 2013)", "https://www.manualsdir.com/manuals/581766/rockwell-automation-2071-apx-kinetix-3-drive-systems-design-guide.html (ManualsDir mirror of GMC-RM005B-EN-P, Sep 2013)", "https://dol6gxheefykt.cloudfront.net/HPK-B1613C-MA42AA-Specifications.pdf (CloudFront mirror of Rockwell KNX-TD001I-EN-P, June 2023)"], "tbd": ["TL catalog number TL-A220P-HJ32AN was verified on a distributor page (DO Supply) matching KNX-TD001A tables, not on a Rockwell product page opened in this pass \u2014 confirm on rockwellautomation.com before publishing.", "TL-IN001 (TL installation instructions, publication TL-IN001C-EN-P) was read only via a secondary mirror page (ManualsDir) \u2014 confirm mounting details in the Rockwell original before teaching."], "sourceFile": "servo-motors.json"}, {"id": "ab-tly", "category": "servo-motor", "family": "TL-Series TLY", "catalogNumbers": ["TLY-A130T-HJ64AA", "TLY-A2540P-HJ62AA"], "name": "TL-Series TLY Servo Motor", "whatItIs": "The TL-Series TLY is Allen-Bradley's compact, low-inertia brushless AC synchronous servo motor for small axes. It packs high torque density into metric and NEMA frame sizes (46 mm / NEMA 17 up to 100 mm) using high-energy Neodymium-Iron-Boron magnets, with 1 m cable extensions and circular plastic threaded connectors. The example motor TLY-A130T-HJ64AA is a 200 V, 46 mm frame, 6000 rpm motor with a 2000-line incremental encoder, shaft key, circular connectors and 24 V DC brake; TLY-A2540P-HJ62AA is a 90 mm / NEMA 34, 5000 rpm motor with the same incremental feedback and no brake.", "whenToUse": "Pick TLY for small, low-torque axes \u2014 robotics, X-Y tables, semiconductor and medical/lab equipment, light packaging and office machinery (KNX-TD001A p150) \u2014 where a VPL/MPL would be oversized and overpriced. Pick TL instead (same performance, rectangular connectors, absolute encoder only) when the drive is a Kinetix 3. Pick VPL/MPL instead when the axis needs more than 5.42 N\u00b7m continuous, 400 V windings, absolute multi-turn feedback without a battery, or a Kinetix 5500/5700 drive \u2014 TLY is NOT compatible with Kinetix 5500/5700 (KNX-TD001A p2).", "selection": "Size with FactoryTalk Motion Analyzer software (KNX-TD001: 'Use Motion Analyzer software to size and select motors'). Check: (1) continuous stall torque against RMS torque \u2014 TL-Series family range 0.086 to 5.42 N\u00b7m continuous stall, 0.22 to 13 N\u00b7m peak stall (KNX-TD001A p150); example TLY-A130 (non-brake): 0.325 N\u00b7m continuous, 0.76 N\u00b7m peak, 0.14 kW, 6000 rpm max (incremental version); TLY-A2540 (non-brake): 2.94 N\u00b7m continuous, 7.10 N\u00b7m peak, 0.86 kW, 5000 rpm rated. Note the brake version of the same motor is de-rated (TLY-A130 with brake: 0.293 N\u00b7m continuous, 0.13 kW) \u2014 always read the brake table, not the non-brake table. (2) Speed: 4500, 5000 and 6000 rpm rated speeds; the 6000 rpm rating applies only to TLY-AxxxT-H motors with incremental feedback \u2014 absolute-encoder versions are rated 5000 rpm (KNX-TD001A p154 note 3). (3) Inertia: rotor inertia is tiny (TLY-A130: 0.000003 kg-m2; TLY-A2540: 0.00011 kg-m2), so even a small load dominates \u2014 check Load Inertia Ratio. (4) Voltage: 200 V class only (A). (5) Frames: 46 mm/NEMA 17, 70 mm/NEMA 23, 90 mm/NEMA 34, 100 mm (TLY only). (6) Ambient 0-40 C; IP65 housing with optional shaft seal.", "wiring": {"power": "TLY motors have 1 m (39.4 in.) cable extensions with circular plastic threaded (M6) connectors (KNX-TD001A p152). Power-only cables: 2090-CPWM6DF-16AAxx (standard, non-flex); power-with-brake cables: 2090-CPBM6DF-16AAxx (standard, non-flex). Do not confuse with TL (rectangular connectors, 300 mm cables) or with MPL/VPL SpeedTec DIN cables \u2014 the connectors are different.", "feedback": "Two feedback choices (KNX-TD001A p151-152): B = multi-turn, 17-bit (131,072 counts/rev), absolute, battery-backed encoder, serial protocol \u2014 single-turn if used without battery backup; the drive needs the appropriate connector kit WITH battery for absolute position backup on power loss. H = 2000 lines/rev incremental encoder \u2014 industry-standard incremental feedback, applies to Bulletin TLY motors. Feedback cable: 2090-CFBM6DF-CBAAxx (standard, non-flex). The incremental (H) option has no absolute position after a power cycle \u2014 the axis must home on every power-up; the absolute (B) option holds position only while its battery is good.", "safety": "Safe Torque-Off lives in the drive, not the motor. The optional 24 V DC brake is a HOLDING brake only (KNX-TD001A p164): hold the shaft at 0 rpm up to the rated holding torque, not for stopping rotation, not a safety device. Stop by commanding the drive to decelerate to 0 rpm, then engage the brake. TLY has no SIL-rated encoder option.", "network": "The motor has no network port. TLY is compatible with Kinetix 6000, Kinetix 300/350, Kinetix 3, Kinetix 2000 and Ultra3000 drives (KNX-TD001A p150) \u2014 NOT with Kinetix 5500/5700. The drive connects to the Logix controller over EtherNet/IP Integrated Motion (300/350) or Sercos (6000/2000)."}, "configuration": [{"step": "Configure a TLY axis on a Kinetix 3 drive in Connected Components Workbench (Kinetix 3 path)", "screen": "Connected Components Workbench \u2014 Device Toolbox / Kinetix 3 Startup Wizard", "parameter": "Device / Controller / Operation Mode / First Gear Ratio", "value": "Add Kinetix 3 from Device Toolbox > Drives to the Project Organizer; Add+ tab > 1203-USB > Add; 0-Kinetix 3 tab > Connect; Wizards > Kinetix 3 Startup Wizard > Reset to Factory Settings (Encoder Backup Battery + Emergency Stop Input) > choose Controller and Operation Mode > First Gear Ratio > verify motor identified > Start Autotuning > Finish > Save. Motor pane selects the motor; Homing pane configures homing (incremental H-feedback motors must home \u2014 E.027 Axis Not Homed).", "source": "2071-UM001E Ch7 p91-99"}, {"step": "Configure a TLY axis on a Kinetix 300 drive in MotionView OnBoard (Kinetix 300 path \u2014 NOT Studio 5000)", "screen": "Web browser \u2014 MotionView OnBoard (drive IP address)", "parameter": "Connection / Drive Mode / motor selection", "value": "Open a Java-enabled browser, enter the drive IP address, open MotionView.jnlp, click Connect; use the MotionView OnBoard menu (General, Motor, Dynamics) to configure the drive and select the motor", "source": "2097-UM001A Ch5 p89-90 (local file um001-300.txt)"}, {"step": "Add the Kinetix drive as an Ethernet motion module (Kinetix 350 path)", "screen": "New Module dialog box", "parameter": "Electronic Keying", "value": "Compatible Module or Exact Match \u2014 never Disable Keying with motion modules", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Add the Kinetix drive as an Ethernet motion module (Kinetix 350 path)", "screen": "New Module dialog box", "parameter": "Connection", "value": "Motion", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create the axis for the drive", "screen": "Module Properties - Associated Axes tab", "parameter": "Data Type", "value": "AXIS_CIP_DRIVE (New Axis, Type Base)", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create a motion group and assign the axis", "screen": "Motion Group Properties - Attribute tab", "parameter": "Base Update Period", "value": "5 ms", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Axis Configuration / Feedback Configuration", "value": "Position Loop / Motor Feedback", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Select the motor so all motor data fills in automatically", "screen": "Axis Properties - Motor", "parameter": "Data Source / Motor Catalog Number", "value": "Data Source = Catalog Number; Motor Catalog Number = TLY-A130T-HJ64AA", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Load Type / Position Units per Motor Rev / Travel Mode", "value": "Direct Coupled Rotary / 1.0 Position Units per 1.0 Motor Rev / Unlimited", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (TL-IN003).", "Use a torsionally rigid coupling or a reinforced timing belt \u2014 all connections between machine and motor shaft must be rigid to achieve acceptable system response (TL-IN003 p6).", "Verify axial and radial loads are within the Motor Load Force Ratings for 20,000 hours of bearing life (TL-IN003 p17; KNX-TD001A p154).", "Do not strike the shaft, key, couplings or pulleys with tools during installation or removal (TL-IN003 p6) \u2014 impact damages bearings and the feedback device.", "Mount with the connector housing pointing downward and a drip loop in each cable; keep ambient 0-40 C with airflow (TL-Series practice, KNX-TD001A p162).", "If the absolute (B) encoder is fitted, confirm the battery-backed connector kit is installed or the axis will be single-turn only and will lose multi-turn position on power loss (KNX-TD001A p152).", "If the incremental (H) encoder is fitted, plan a homing move on every power-up \u2014 incremental feedback has no absolute position after power loss.", "Inspect shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months (KNX-TD001A p153). Shaft seal kits: TLY-A1xx TL-SSN-1, TLY-A2xx TL-SSN-2, TLY-A25xx TL-SSN-3, TLY-A3xx TL-SSN-4.", "Before first motion, confirm the brake (if fitted) releases with 24 V DC and that the axis is commanded to 0 rpm before the brake engages (KNX-TD001A p164)."], "tuning": "Tuning is drive-specific \u2014 there is no single TLY autotune, because TLY runs on Kinetix 3, 300, 350, 6000, 2000, 5100 and 5300. Verified autotune routes: Kinetix 3 \u2014 Connected Components Workbench Startup Wizard, Start Autotuning (2071-UM001E Ch7 p95-96), or Ultraware Tuning branch, Start Autotuning (Ch8 p106). Kinetix 300 \u2014 MotionView OnBoard (2097-UM001A Ch5 p102-103): remove the load, run MotionView, select General, choose Auto Tune from the Drive Mode menu, select Dynamics, click Autotuning, check Velocity and/or Position, apply the Enable Input, click Start and accept the gains. Kinetix 350 \u2014 Studio 5000 Logix Designer, Axis Properties Autotune category (2097-UM002). Kinetix 6000 \u2014 RSLogix 5000, Axis Properties Tune tab: remove the load, enter Travel Limit and Speed, apply the Hardware Enable Input (IOD-2), click Start Tuning (2094-UM001A p141-142). In every case tune with the load removed first, then re-attach the load and tune again. Kinetix 2000 and Ultra3000 tuning were not verified in this pass. What still applies generally: Load Inertia Ratio is load inertia over motor inertia (Motion Analyzer manual), and TLY rotor inertias are extremely small (0.000003 kg-m2 for TLY-A130), so the load almost always dominates the ratio and the mechanics \u2014 rigid coupling, no backlash, correct gearbox \u2014 matter more than gain tweaks.", "faults": [{"code": "E04", "meaning": "Motor Overtemperature \u2014 the motor thermal switch was tripped (2094-UM001A p147).", "fix": "Operate within (not above) the continuous torque rating for the ambient temperature; lower ambient temperature or increase motor cooling; check motor wiring; verify the proper motor has been selected (2097-UM001A Table, p116)."}, {"code": "E07", "meaning": "Motor Feedback Loss \u2014 the feedback wiring is open, shorted, or missing (2094-UM001A p147).", "fix": "Check motor encoder wiring; run the Hookup test in RSLogix 5000; ensure the motor is recognized from the drive's configuration motor screen (2097-UM001A p116-117)."}], "manualUrl": "https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/tl-in003_-en-p.pdf?A294B0B9BE6499A2807587A47F9C9E61C073C4A9B8&ts=1778731798841", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/tl-in003_-en-p.pdf?A294B0B9BE6499A2807587A47F9C9E61C073C4A9B8&ts=1778731798841", "https://www.rockwellautomation.com/en-nl/docs/studio-5000-logix-designer/37-00/contents-ditamap/quick-start-steps/configuring-an-ethernet-motion-system.html", "https://www.manualsdir.com/manuals/581096/rockwell-automation-tly-series-servo-motor.html?page=6", "https://oeelab.com/allen-bradley-kinetix-ultra3000-fault-codes", "https://abmarketotomasyon.com/wp-content/uploads/2025/08/2071-UM001-EN-P.pdf (distributor mirror of Rockwell 2071-UM001E-EN-P, Nov 2013)", "https://dol6gxheefykt.cloudfront.net/HPK-B1613C-MA42AA-Specifications.pdf (CloudFront mirror of Rockwell KNX-TD001I-EN-P, June 2023)"], "tbd": ["TLY catalog numbers were verified on distributor pages (Automation Stop / DO Supply) matching KNX-TD001A tables, not on a Rockwell product page opened in this pass \u2014 confirm on rockwellautomation.com before publishing.", "TLY Axis Properties screens and tuning for Kinetix 2000 (Sercos) \u2014 Kinetix 3, 300, 350 and 6000 paths verified; 2000 screens/tuning not read \u2014 source needed: 2093-UM001"], "sourceFile": "servo-motors.json"}, {"id": "ab-100-c", "category": "starter", "family": "Bulletin 100-C", "catalogNumbers": ["100-C09D10", "100-C23D10"], "name": "Bulletin 100-C IEC Contactor", "whatItIs": "The Bulletin 100-C is Rockwell's IEC power contactor family: an electromagnetically operated switch with three main power poles (plus an optional fourth pole) that makes and breaks motor current on command from its coil. It is the switching heart of a direct-on-line starter and of the bypass/isolation position in soft-starter panels. It mounts on a 35 mm DIN rail or a panel, and takes front- or side-mounted auxiliary contacts, timers and surge suppressors.", "whenToUse": "Use a 100-C wherever a motor (or other load) must be switched on and off electrically - DOL starters, reversing starters (104-C, two contactors with a mechanical interlock), star-delta, and as the isolation/bypass contactor in an SMC panel. Use a 100-E instead above 97 A AC-3 (100-E goes to 2650 A). Use a safety contactor (100S-C) where mirror/m mechanically linked auxiliary contacts are needed for a safety circuit.", "selection": "Select by AC-3 motor duty current and Hp/kW, not by AC-1 (resistive) current. Range 9...97 A AC-3 (9, 12, 16, 23, 30, 37, 43, 60, 72, 85, 97 A); 4...55 kW / 5...75 Hp. Examples from 100-TD013: 100-C09 = 9 A AC-3 / 32 A AC-1, 4 kW at 400V, 2 Hp at 230V 3-phase, 5 Hp at 460V, 7.5 Hp at 575V; 100-C23 = 23 A AC-3, 11 kW at 400V, 15 Hp at 460V; 100-C97 = 97 A AC-3, 55 kW at 400V, 75 Hp at 460V. The catalog number is incomplete until you add the coil code and the auxiliary suffix: 100-C09*10, where * is the coil code and 10 means 1 N.O. auxiliary (01 = 1 N.C., 00 = none).", "wiring": {"power": "Main poles: line 1/3/5 (L1/L2/L3), load 2/4/6 (T1/T2/T3). Screw terminals, IP20 finger-safe. Coil terminals are reversible - line side or load side - by turning the coil assembly (see 100-TD013 coil terminal position). For a reversing pair (104-C), add the mechanical interlock and wire the two contactors so only one can close; electrical interlocking through the N.C. aux contacts is also required.", "feedback": "Built-in auxiliary: 1 N.O. (-10) or 1 N.C. (-01); the N.C. aux on the -01 meets mechanically-linked performance per IEC 60947-5-1 Annex L, and on the 100-C97 the N.C. meets mirror-contact performance per IEC 60947-4-1 Annex F. Add front-mounted 2- or 4-pole aux blocks or side-mounted 1-, 2- or 4-pole blocks; on the 100-C09...C23 frame, aux blocks mount on the left side only (double-numbering on
