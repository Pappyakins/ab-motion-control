e power structure.", "fix": "Call your Rockwell Automation sales representative to return the module for repair."}, {"code": "S41", "meaning": "MTR + AUX AQB state, factory limit. Illegal AQB state transitions exceeded the factory limit; feedback wiring open, shorted, or missing.", "fix": "Use shielded twisted-pair cables, route feedback away from noise, check grounds, and replace the motor or encoder."}, {"code": "S42", "meaning": "MTR + AUX AQB state, user limit. Illegal AQB state transitions exceeded the user limit.", "fix": "Use shielded twisted-pair cables, route feedback away from noise, check grounds, and replace the motor or encoder."}, {"code": "S44", "meaning": "MTR + AUX feedback loss, user limit. Sin/cos sum below the user limit, or TTL A/B below the user limit; wiring open, shorted, or missing.", "fix": "Check motor encoder wiring and run the Hookup test in Logix Designer."}, {"code": "S45", "meaning": "MTR + AUX feedback communications, factory limit. Consecutive missed or corrupted serial packets exceeded the factory limit; communications not established with intelligent encoder.", "fix": "Verify motor selection, verify the motor supports automatic identification, verify motor encoder wiring, and consult the Possible Solutions for FLT S47."}, {"code": "S46", "meaning": "MTR + AUX feedback communications, user limit. Consecutive missed or corrupted serial packets exceeded the user set limit.", "fix": "Verify motor selection, verify the motor supports automatic identification, and verify motor encoder wiring."}, {"code": "S47", "meaning": "MTR + AUX encoder self test (nn 01-18, 28-35 listed in the table). Hiperface internal error.", "fix": "Check motor feedback cable connectivity and continuity, check motor phasing U/V/W and Hiperface 15-pin connections, review Electrical Noise Reduction p.38, cycle control power, check the feedback shield, reduce shock and vibration, upgrade firmware to rev 2.045 or later (6200) / 2.010 or later (6500), and replace the motor if the fault continues."}, {"code": "S50", "meaning": "Position hardware overtravel. Axis beyond physical travel limits, positive direction; dedicated overtravel input inactive.", "fix": "Check wiring and verify the motion profile."}, {"code": "S51", "meaning": "Negative hardware overtravel. Axis beyond physical travel limits, negative direction; dedicated overtravel input inactive.", "fix": "Verify the axis configuration in software."}, {"code": "S55", "meaning": "Excessive velocity error (nn 00 referenced to velocity loop feedback, 01 referenced to nonvelocity feedback, dual-feedback). Velocity error exceeded the limit for a period.", "fix": "Increase the velocity error limit and time, check velocity loop tuning, verify sizing, verify mechanical integrity, check motor power wiring, and reduce acceleration."}, {"code": "S56", "meaning": "Overtorque limit, Kinetix 6500 drives only. Torque exceeded the user-programmable setting.", "fix": "Verify the motion profile, verify Overtorque settings, verify sizing, verify the torque offset, and verify mechanical integrity."}, {"code": "S57", "meaning": "Undertorque limit, Kinetix 6500 drives only. Torque below the user-programmable setting.", "fix": "Verify the motion profile, verify Overtorque settings, verify sizing, and verify mechanical integrity."}, {"code": "S60", "meaning": "Illegal control mode, Kinetix 6500 drives only. Illegal mode attempted: Axis 1 configured for dual/load feedback with Axis 2 also Feedback Only but with different feedback attribute values.", "fix": "Use Aux Feedback for one axis only and verify Axis 1 and Axis 2 have identical feedback configuration for aux feedback."}, {"code": "S61", "meaning": "Enable input. Hardware enable input deactivated while the drive was enabled.", "fix": "Disable the Drive Enable Input fault (when enabling via software while the hardware input is inactive) and verify the Drive Enable hardware input is active whenever the drive is enabled through software."}, {"code": "S62", "meaning": "Controller initiated exception, Kinetix 6500 drives only. User-configured software overtravel.", "fix": "Move the axis out of the soft overtravel range, clear the soft overtravel fault, check the soft overtravel configuration, and consult the controller documentation."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2094-um002_-en-p.pdf", "sources": ["https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/2094-um002_-en-p.pdf?A294B07782706461C5B2847584965D99BE72C473C29B96& (Rockwell 2094-UM002G-EN-P Aug 2016, 336 pp)", "https://www.manualsdir.com/manuals/580230/rockwell-automation-2094-en02d-m01-sx-kinetix-6200-and-kinetix-6500-modular-multi-axis-servo-drives-user-manual-2094-se02f-m00-sx-kinetix-6200-and-kinetix-6500-modular-multi-axis-servo-drives-user-manual-2094-bmxx-m-kinetix-6200-and-kinetix-6500-modular-m.html?page=153 (2094-UM002E-EN-P May 2012, bus regulator / Add Bus Cap)", "https://www.manualsdir.com/manuals/580230/rockwell-automation-2094-en02d-m01-sx-kinetix-6200-and-kinetix-6500-modular-multi-axis-servo-drives-user-manual-2094-se02f-m00-sx-kinetix-6200-and-kinetix-6500-modular-multi-axis-servo-drives-user-manual-2094-bmxx-m-kinetix-6200-and-kinetix-6500-modular-m.html?page=97 (2094-UM002E-EN-P, common bus fusing and ground jumper)", "https://rexel-cdn.com/products/abe2094bc04m03mapdf.pdf?i=9B0D274E-E0DD-4001-B5EF-CBAE5DF689DC (2094-UM002G-EN-P Ch1 Table 2, IAM/AM catalog numbers)", "https://cdn3.servls.com/view/1141/1141930-kinetix_6200.pdf (Kinetix 6200/6500 Safe Torque-off Safety Reference Manual, 2094-RM002B-EN-P May 2012)", "Local mirror copy read 2026-11-20: .research/pdfs/um002-6200-6500.txt (Rockwell 2094-UM002G-EN-P Aug 2016)", "Safe Speed Monitor safety reference manual: Rockwell publication 2094-RM001 (per 2094-UM002G Additional Resources)", "2094-UM002G-EN-P Additional Resources (local text um002-6200-6500.txt lines 460-464): 'Kinetix 6200 and Kinetix 6500 Safe Speed Monitoring Servo Drives Safety Reference Manual, publication 2094-RM001'"], "tbd": ["Table 101 (referenced in the 6500 fault-table TBD) \u2014 not found anywhere in 2094-UM002G; Table 87 portion verified \u2014 source needed: 2094-UM002G"], "sourceFile": "kinetix.json"}, {"id": "ab-powerflex-4-40", "category": "vfd", "family": "PowerFlex 4 / 40", "catalogNumbers": ["22A-A8P0N104", "22B-D4P0N104", "22B-B012N104"], "name": "PowerFlex 4 / 40 AC Drive", "whatItIs": "The smallest and most cost-effective members of the PowerFlex family (bulletins 22A and 22B). Together they cover 0.2 to 11 kW (0.25 to 15 Hp) in 120, 240, 480 and 600V classes, for speed control of fans, pumps, conveyors, machine tools and material handling. The PowerFlex 4 is the basic V/Hz drive (max 5 Hp); the PowerFlex 40 adds sensorless vector control, PID, preset speeds, MOP and more I/O (max 15 Hp). Rockwell discontinued the PowerFlex 4 and 40 on 30 June 2025; the listed replacements are the PowerFlex 523 (for the 4) and the PowerFlex 525 (for the 40).", "whenToUse": "These drives are now a legacy/maintenance topic: pick them only when servicing an existing installation. For a new small machine, pick the PowerFlex 523 instead of a 4 and the PowerFlex 525 instead of a 40. Within the family, pick the 40 over the 4 when you need sensorless vector control, PID, 8 preset speeds, MOP, flying start, or RS-485 network control with more than basic I/O. Pick the 4 only for the simplest fixed-speed or potentiometer-controlled job.", "selection": "Size by motor FLA against the drive rated output amps in 22-TD001. Maximum ratings: 1.5 Hp at 115V 1-phase, 3 Hp at 230V 1-phase, 5 Hp at 230V 3-phase and 5 Hp at 460V 3-phase for the PowerFlex 4; 10 Hp at 230V 3-phase, 15 Hp at 460V 3-phase and 15 Hp at 600V 3-phase for the PowerFlex 40. Voltage classes: 120V 1-phase, 240V 1- or 3-phase, 480V 3-phase, 600V 3-phase. Both have a fixed integral keypad with a potentiometer; the 40 adds an optional remote HIM. Select fuses and circuit breakers from the 22-TD001 tables.", "wiring": {"power": "Three-phase input to R/L1, S/L2, T/L3 (single-phase input uses R/L1, S/L2 on the V and A voltage classes); motor to U/T1, V/T2, W/T3; DC+ and DC- bus terminals; PE ground. PowerFlex 40/40P Frame C drives have P1/P2 terminals for a DC bus inductor; the 525 replacement does not. Wait 3 minutes after removing power before servicing (DC bus discharge).", "feedback": "Analog speed reference only: 0-10V input and 4-20 mA input on the control terminal block, plus the integral keypad potentiometer. No encoder feedback on the 4/40 (the 40P positioning variant had separate encoder terminals). The 40's sensorless vector control works from the motor model, not from a feedback device.", "safety": "No built-in Safe Torque-Off. The 40P variant used a DriveGuard 20A-DG01 option board for a safety input; on the 525 replacement the equivalent is the built-in STO on S1, S2 and S+. On the 4/40 the hardware enable is an ENBL jumper: with the jumper removed, terminal 01 becomes a hardware enable.", "network": "Built-in RS-485 (DSI) port with Modbus RTU. Network adapters in the 22-COMM family (DeviceNet, EtherNet/IP) fit the DSI port; confirm the exact adapter catalog in 22-TD001. On the 525 replacement, RS-485 stays on the DSI port and EtherNet/IP is embedded."}, "configuration": [{"step": "Enter motor nameplate volts", "screen": "Integral keypad, Basic Program group", "parameter": "P031 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "22B-UM001G parameter cross-reference; 22B-QS001A"}, {"step": "Enter motor nameplate frequency", "screen": "Integral keypad, Basic Program group", "parameter": "P032 [Motor NP Hertz]", "value": "Motor nameplate rated frequency", "source": "22B-UM001G parameter cross-reference; 22B-QS001A"}, {"step": "Enter motor overload current", "screen": "Integral keypad, Basic Program group", "parameter": "P033 [Motor OL Current]", "value": "Motor nameplate overload current; drives the F007 electronic overload", "source": "22B-UM001G Chapter 4 fault actions"}, {"step": "Set maximum frequency", "screen": "Integral keypad, Basic Program group", "parameter": "P035 [Maximum Freq]", "value": "Top output frequency for the application", "source": "22B-UM001G Chapter 3"}, {"step": "Set speed reference source", "screen": "Integral keypad, Basic Program group", "parameter": "P038 [Speed Reference]", "value": "0 = Drive Pot (default), 1 = InternalFreq, 2 = 0-10V Input, 3 = 4-20mA Input, 4 = Preset Freq, 5 = Comm Port, 6 = Stp Logic", "source": "22B-QS001A"}, {"step": "Set accel and decel times", "screen": "Integral keypad, Basic Program group", "parameter": "P039 [Accel Time 1] / P040 [Decel Time 1]", "value": "10.0 s default each; range 0.0/600.0 s (P040 minimum 0.1 s)", "source": "22B-QS001A"}, {"step": "Set current limit (40)", "screen": "Integral keypad, Advanced Program group", "parameter": "A089 [Current Limit 1]", "value": "Current limit the F006 stall action refers to; set to suit the load", "source": "22B-UM001G Chapter 4 fault actions"}, {"step": "Clear faults after a trip", "screen": "Integral keypad, Advanced Program group", "parameter": "A100 [Fault Clear]", "value": "Set to 1 or 2 to clear a fault (or press the Stop key, or cycle power)", "source": "22A Quick Start FRN 6.xx"}, {"step": "Set the motor nameplate full load amps before running autotune", "screen": "Advanced Program Group", "parameter": "A126 [Motor NP FLA]", "value": "Motor nameplate full load amps (default = drive rated amps; range 0.1 to drive rated amps x 2)", "source": "22B-UM001 Ch3"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; wait 3 minutes after removing power for the DC bus to discharge.", "Confirm the supply voltage matches the drive voltage class and the motor nameplate; confirm fuses/breaker per 22-TD001.", "Check PE ground continuity and that motor leads land on U/T1, V/T2, W/T3 in the right phase order.", "Check the ENBL jumper: fitted for normal run, removed only if terminal 01 is used as a hardware enable.", "Enter the motor nameplate data (P031-P033) before the first run; do not trust defaults.", "On the 40, run A127 autotune (Static Tune first; Rotate Tune uncoupled if the application allows).", "Jog the motor at low speed from the keypad potentiometer, check rotation; swap two motor leads if reversed.", "Run up to full speed, compare output current (d001) with the motor nameplate FLA, and confirm the selected speed reference actually drives the speed."], "tuning": "The PowerFlex 4 is V/Hz only: tune it with A084 [Boost Select] (voltage boost at low speed) and A089 [Current Limit 1]. The PowerFlex 40 adds sensorless vector control with autotune: A127 [Autotune], 0 = Ready/Idle, 1 = Static Tune, 2 = Rotate Tune. The autotune sets A128 [IR Voltage Drop] and A129 [Flux Current Ref], which affect sensorless vector performance; enter the motor nameplate FLA before running it. If the drive stalls on acceleration (F006), increase P039/A067 [Accel Time x] or reduce the load so current stays below A089 [Current Limit 1].", "faults": [{"code": "F4", "meaning": "UnderVoltage: DC bus voltage fell below the minimum value.", "fix": "Monitor the incoming AC line for low voltage or line power interruption."}, {"code": "F5", "meaning": "OverVoltage: DC bus voltage exceeded the maximum value.", "fix": "Monitor the AC line for high line voltage or transient conditions. Bus overvoltage can also be caused by motor regeneration; extend the decel time or install a dynamic brake option."}, {"code": "F6", "meaning": "Motor Stalled: drive is unable to accelerate the motor.", "fix": "Increase P039/A067 [Accel Time x] or reduce load so drive output current does not exceed the current set by A089 [Current Limit 1]."}, {"code": "F7", "meaning": "Motor Overload: internal electronic overload trip.", "fix": "An excessive motor load exists. Reduce load so drive output current does not exceed the current set by P033 [Motor OL Current]."}, {"code": "F8", "meaning": "Heatsink OvrTmp: heatsink temperature exceeds a predefined value.", "fix": "Check for blocked or dirty heatsink fins. Verify ambient temperature has not exceeded 40 C for IP30/NEMA Type 1 installations or 50 C for IP20/Open type installations. Check fan."}, {"code": "F12", "meaning": "HW OverCurrent: the drive output current has exceeded the hardware current limit.", "fix": "Check programming. Check for excess load, improper A084 [Boost Select] setting, DC brake volts set too high or other causes of excess current."}, {"code": "F13", "meaning": "Ground Fault: a current path to earth ground has been detected at one or more drive output terminals.", "fix": "Check the motor and external wiring to the drive output terminals for a grounded condition."}, {"code": "F29", "meaning": "Analog In Loss: an analog input is configured to fault on signal loss and a signal loss has occurred.", "fix": "Check parameters and check for broken/loose connections at the analog inputs."}, {"code": "F33", "meaning": "Auto Rstrt Tries: drive unsuccessfully attempted to reset a fault and resume running.", "fix": "Correct the cause of the original fault and manually clear it."}, {"code": "F80", "meaning": "SVC Autotune (40 only): the autotune function was either cancelled by the user or failed.", "fix": "Check the motor nameplate data, check the motor is connected, and re-run A127 [Autotune]."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/22b-um001_-en-p.pdf", "sources": ["https://docs.rs-online.com/4478/0900766b8161e3d1.pdf", "https://www.manualsdir.com/manuals/576843/rockwell-automation-22b-powerflex-40-quick-start-frn-5xx-6xx.html?page=17", "https://www.manualsdir.com/manuals/576955/rockwell-automation-22a-powerflex-4-quick-start-frn-6xx.html?page=13", "https://ia903403.us.archive.org/35/items/manualzilla-id-5728513/5728513.pdf", "https://www.tdl-ia.com/insights/powerflex-4-40-to-powerflex-525-migration.html", "https://docs.rs-online.com/dd32/A700000007818445.pdf (RS Online mirror, 22B-UM001I-EN-E)", "https://manualzilla.com/doc/5638207/22b-um001---rockwell-automation (Manualzilla mirror, 22B-UM001H-EN-E)", "https://docs.rs-online.com/4478/0900766b8161e3d1.pdf (RS Online mirror, 22-TD001I-EN-P)"], "tbd": [], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-523", "category": "vfd", "family": "PowerFlex 523", "catalogNumbers": ["25A-D6P0N114", "25A-D1P4N104"], "name": "PowerFlex 523 AC Drive", "whatItIs": "The economy drive in Rockwell's PowerFlex 520-series (bulletin 25A). It is a compact general-purpose VFD for standalone machines, covering 0.25 to 30 Hp (up to 22 kW) with V/Hz and sensorless vector control. It shares frames A through E and the same power module footprint as the PowerFlex 525, but has no embedded EtherNet/IP port and no built-in Safe Torque-Off.", "whenToUse": "Pick the 523 over the 525 when the machine is standalone, needs no network control and no safety function: a simple conveyor, fan or pump run from the keypad or hardwired terminal-block control. Pick the 525 instead when you need embedded EtherNet/IP, closed-loop velocity vector control, permanent-magnet motor control, or built-in Safe Torque-Off. Pick a 753/755 when power exceeds 30 Hp or the application needs process control, encoder feedback options, DeviceLogix or Integrated Motion.", "selection": "Size by motor full-load amps against the drive rated output amps in 520-TD001, not by horsepower alone; both Normal Duty and Heavy Duty ratings are published for each catalog number. Voltage classes are 100-120V 1-phase, 200-240V 1- or 3-phase, 380-480V 3-phase and 525-600V 3-phase. The 0.25 Hp rating exists only on the 523. Frames A-E; frame is read from 520-TD001, it is not encoded in the catalog number. Select fuses and circuit breakers from the 520-TD001 tables for the exact catalog number.", "wiring": {"power": "Power terminals R/L1, S/L2, T/L3 (1-phase input uses R/L1, S/L2) and motor terminals U/T1, V/T2, W/T3; DC+ and DC- bus terminals; BR+ and BR- for an external dynamic brake resistor (integral brake transistor is fitted on all ratings). PE safety ground is mandatory. Frame A: 0.8-5.3 sq mm (18-10 AWG), torque 1.76-2.16 N-m. Swap any two motor leads to reverse forward direction.", "feedback": "One analog input (unipolar voltage or current), independently isolated from the rest of the drive I/O. No encoder feedback: closed-loop velocity vector control and PM motor control are 525-only. Five digital inputs (one dedicated Stop plus four programmable).", "safety": "No built-in Safe Torque-Off on the 523. Stopping and isolation must be provided externally (contactor / disconnect) to the plant safety design; terminal 01 is the hardwired Stop input.", "network": "No embedded EtherNet/IP. Built-in RS-485 (DSI) port for Modbus RTU. Network options fit the two accessory card slots: 25-COMM-D (DeviceNet), 25-COMM-E2P (dual-port EtherNet/IP), 25-COMM-P (PROFIBUS DP)."}, "configuration": [{"step": "Enter motor nameplate voltage", "screen": "HIM Basic Program group", "parameter": "P031 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "520-QS001A (520-UM001 Smart Start-Up table)"}, {"step": "Enter motor nameplate frequency", "screen": "HIM Basic Program group", "parameter": "P032 [Motor NP Hertz]", "value": "Motor nameplate rated frequency (60 Hz default)", "source": "520-QS001A"}, {"step": "Enter motor overload current", "screen": "HIM Basic Program group", "parameter": "P033 [Motor OL Current]", "value": "Motor nameplate overload current; drives the F007 electronic overload", "source": "520-QS001A"}, {"step": "Enter motor nameplate FLA", "screen": "HIM Basic Program group", "parameter": "P034 [Motor NP FLA]", "value": "Motor nameplate full load amps", "source": "520-QS001A"}, {"step": "Set control mode", "screen": "HIM Basic Program group", "parameter": "P039 [Torque Perf Mode]", "value": "0 = V/Hz for fan/pump loads; 1 = SVC (default) for general purpose", "source": "520-UM001D; 520-QS001A"}, {"step": "Set accel and decel times", "screen": "HIM Basic Program group", "parameter": "P041 [Accel Time 1] / P042 [Decel Time 1]", "value": "10.00 s default each; time from 0 Hz to P044 [Maximum Freq] and back", "source": "520-QS001A"}, {"step": "Set frequency limits", "screen": "HIM Basic Program group", "parameter": "P043 [Minimum Freq] / P044 [Maximum Freq]", "value": "P043 default 0.00 Hz; P044 default 60.00 Hz; P044 must be greater than P043", "source": "520-QS001A; 520-AT001A"}, {"step": "Set start and speed sources", "screen": "HIM Basic Program group", "parameter": "P046 [Start Source 1] / P047 [Speed Reference 1]", "value": "P046: 1 = Keypad (default), 2 = DigIn TrmBlk; P047: 6 = 4-20mA Input for analog speed", "source": "520-QS001A; 520-UM001O"}, {"step": "Run the autotune routine", "screen": "Basic Program Group", "parameter": "P040 [Autotune]", "value": "0 = Ready/Idle (default); 1 = Static Tune (non-rotational stator-resistance test, sets A496 [IR Voltage Drop]); 2 = Rotate Tune (Static Tune plus rotational test, sets A497 [Flux Current Ref]). Set to 1 or 2 then issue a Start command; the routine returns to 0 when done. Start must be issued within 30 s or an Autotune Fault occurs. Uncouple the motor from the load for Rotate Tune.", "source": "520-UM001 Ch3"}, {"step": "Wire the stop input", "screen": "Control I/O Terminal Block", "parameter": "Terminal 01 (Stop)", "value": "Always a Stop input; cannot be disabled. Shipped with a jumper between 01 and 11; remove the jumper when using 01 as stop/enable.", "source": "520-UM001 Ch1"}, {"step": "Wire the start / direction inputs (2-wire control)", "screen": "Control I/O Terminal Block", "parameter": "Terminals 02 (t062) and 03 (t063)", "value": "2-wire: t062 = 48 '2-Wire FWD', t063 = 50 '2-Wire REV'.", "source": "520-UM001 Ch1"}, {"step": "Wire the start / direction inputs (3-wire control)", "screen": "Control I/O Terminal Block", "parameter": "Terminals 02 (t062) and 03 (t063)", "value": "3-wire: t062 = 49 '3-Wire Start' (momentary start), t063 = 51 '3-Wire Dir' (maintained direction). t064 [2-Wire Mode] settings 0/1/2 = Coast, 3 = per P045 [Stop Mode] for the terminal 01 stop.", "source": "520-UM001 Ch1"}], "commissioning": ["Lock out and tag out, verify zero voltage at R/L1, S/L2, T/L3 before touching terminals.", "Confirm the supply voltage matches the drive voltage class and the motor nameplate; confirm fuses/breaker per 520-TD001.", "Check PE ground continuity and that motor leads land on U/T1, V/T2, W/T3 in the right phase order.", "Verify control wiring against the 523 control I/O diagram: terminal 01 is Stop, 02 Start/Run FWD, 03 Direction/Run REV.", "Enter the motor nameplate data (P031-P034) before the first run; do not trust defaults.", "Run the autotune (P040) if SVC is selected, then jog the motor at low speed and check rotation; swap two motor leads if reversed.", "Run up to full speed and compare output current (b003) with motor FLA; check for F007/F012 under load.", "Record the final parameter set (or save via Connected Components Workbench) before handover."], "tuning": "The 523 runs V/Hz or sensorless vector control (P039). Autotune is P040 [Autotune]: 0 = Ready/Idle, 1 = Static Tune (motor does not spin), 2 = Rotate Tune (motor spins, run it uncoupled/unloaded if possible). Set P044 [Maximum Freq] above P032 [Motor NP Hertz] before autotune or the tune fails. If the motor is unstable or stalls, lengthen P041 [Accel Time 1] and check the load against A484/A485 current limit behaviour per the F006 action.", "faults": [{"code": "F003", "meaning": "Power Loss: excessive DC bus voltage ripple / incoming line loss.", "fix": "Monitor the incoming AC line for low voltage or interruption. Check input fuses. Reduce load."}, {"code": "F006", "meaning": "Motor Stalled: drive cannot accelerate the motor.", "fix": "Increase P041, A442, A444 or A446 [Accel Time x] or reduce load so output current does not exceed the current set by A484/A485 [Current Limit]."}, {"code": "F007", "meaning": "Motor Overload: internal electronic overload trip.", "fix": "Reduce the load so output current does not exceed P033 [Motor OL Current]; verify P033 matches the motor nameplate."}, {"code": "F012", "meaning": "HW OverCurrent: drive output current exceeded the hardware current limit.", "fix": "Check programming. Check for excess load, improper DC boost setting, DC brake volts set too high, or other causes of excess current."}, {"code": "F013", "meaning": "Ground Fault: a current path to earth ground at one or more drive output terminals.", "fix": "Check the motor and external wiring to the drive output terminals for a grounded condition."}, {"code": "F033", "meaning": "Auto Rstrt Tries: drive unsuccessfully attempted to reset a fault and resume running.", "fix": "Correct the cause of the original fault and manually clear the fault."}, {"code": "F002", "meaning": "Auxiliary Input: External trip (Auxiliary) input.", "fix": "Check remote wiring. Verify communications programming for intentional fault."}, {"code": "F004", "meaning": "UnderVoltage: DC bus voltage fell below the min value.", "fix": "Monitor the incoming AC line for low voltage or line power interruption."}, {"code": "F005", "meaning": "OverVoltage: DC bus voltage exceeded max value.", "fix": "Monitor the AC line for high line voltage or transient conditions. Bus overvoltage can also be caused by motor regeneration. Extend the decel time or install dynamic brake option."}, {"code": "F008", "meaning": "Heatsink OvrTmp: Heatsink/Power Module temperature exceeds a predefined value.", "fix": "Check for blocked or dirty heat sink fins. Verify that ambient temperature has not exceeded the rated ambient temperature. Check fan."}, {"code": "F009", "meaning": "CC OvrTmp: Control module temperature exceeds a predefined value.", "fix": "Check for airflow obstruction. Check for dirt or debris. Check fan."}, {"code": "F021", "meaning": "Output Ph Loss: Output Phase Loss (if enabled). Configure with A557 [Out Phas Loss En].", "fix": "Verify motor wiring. Verify motor."}, {"code": "F029", "meaning": "Analog In Loss: An analog input is configured to fault on signal loss. A signal loss has occurred. Configure with t094 [Anlg In V Loss] or t097 [Anlg In mA Loss].", "fix": "Check for broken/loose connections at inputs. Check parameters."}, {"code": "F038", "meaning": "Phase U to Gnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Check the wiring between the drive and motor. Check motor for grounded phase. Replace drive if fault cannot be cleared."}, {"code": "F039", "meaning": "Phase V to Gnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Check the wiring between the drive and motor. Check motor for grounded phase. Replace drive if fault cannot be cleared."}, {"code": "F040", "meaning": "Phase W to Grnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Check the wiring between the drive and motor. Check motor for grounded phase. Replace drive if fault cannot be cleared."}, {"code": "F041", "meaning": "Phase UV Short: Excessive current has been detected between these two output terminals.", "fix": "Check the motor and drive output terminal wiring for a shorted condition. Replace drive if fault cannot be cleared."}, {"code": "F042", "meaning": "Phase UW Short: Excessive current has been detected between these two output terminals.", "fix": "Check the motor and drive output terminal wiring for a shorted condition. Replace drive if fault cannot be cleared."}, {"code": "F043", "meaning": "Phase VW Short: Excessive current has been detected between these two output terminals.", "fix": "Check the motor and drive output terminal wiring for a shorted condition. Replace drive if fault cannot be cleared."}, {"code": "F048", "meaning": "Params Defaulted: The drive was commanded to write default values to EEPROM.", "fix": "Clear the fault or cycle power to the drive. Program the drive parameters as needed."}, {"code": "F063", "meaning": "SW OverCurrent: Programmed A486, A488 [Shear Pinx Level] has been exceeded for a time period greater than the time programmed in A487, A489 [Shear Pinx Time].", "fix": "Verify connections between motor and load. Verify level and time requirements."}, {"code": "F064", "meaning": "Drive Overload: Drive overload rating has been exceeded.", "fix": "Reduce load or extend Accel Time. Check max ambient temperature has not been exceeded."}, {"code": "F070", "meaning": "Power Unit: Failure has been detected in the drive power section.", "fix": "Cycle power. Replace drive if fault cannot be cleared."}, {"code": "F071", "meaning": "DSI Net Loss: Control over the Modbus or DSI communication link has been interrupted.", "fix": "Cycle power. Check communications cabling. Check Modbus or DSI setting. Check Modbus or DSI status."}, {"code": "F072", "meaning": "Opt Net Loss: Control over the network option card's remote network has been interrupted.", "fix": "Cycle power. Check communications cabling. Check network adapter setting. Check external network status."}, {"code": "F080", "meaning": "Autotune Failure: The autotune function was either cancelled by the user or failed.", "fix": "Restart procedure."}, {"code": "F081", "meaning": "DSI Comm Loss: Communications between the drive and the Modbus or DSI master device have been interrupted.", "fix": "Cycle power. Check communications cabling. Check Modbus or DSI setting. Check Modbus or DSI status. Modify using C125 [Comm Loss Action]. Connecting I/O terminals C1 and C2 to ground may improve noise immunity. Replace wiring, Modbus master device, or control module."}, {"code": "F082", "meaning": "Opt Comm Loss: Communications between the drive and the network option card have been interrupted.", "fix": "Cycle power. Reinstall option card in drive. Modify using C125 [Comm Loss Action]. Replace wiring, port expander, option card, or control module."}, {"code": "F094", "meaning": "Function Loss: 'Freeze-Fire' (Function Loss) input is inactive, input to the programmed terminal is open.", "fix": "Close input to the terminal and cycle power."}, {"code": "F100", "meaning": "Parameter Chksum: Drive parameter non-volatile storage is corrupted.", "fix": "Set P053 [Reset To Defalts] to 2 'Factory Rset'."}, {"code": "F101", "meaning": "External Storage: External non-volatile storage has failed.", "fix": "Set P053 [Reset To Defalts] to 2 'Factory Rset'."}, {"code": "F105", "meaning": "C Connect Err: Control module was disconnected while drive was powered.", "fix": "Clear fault and verify all parameter settings. Do not remove or install the control module while power is applied."}, {"code": "F106", "meaning": "Incompat C-P: The PowerFlex 525 control module does not support power modules with 0.25 HP power rating.", "fix": "Change to a different power module. Change to a PowerFlex 523 control module."}, {"code": "F107", "meaning": "Replaced C-P: The control module could not recognize the power module. Hardware failure.", "fix": "Change to a different power module. Replace control module if changing power module does not work."}, {"code": "F109", "meaning": "Mismatch C-P: The control module was mounted to a different drive type power module.", "fix": "Set P053 [Reset To Defalts] to 3 'Power Reset'. Cycle power."}, {"code": "F110", "meaning": "Keypad Membrane: Keypad membrane failure / disconnected.", "fix": "Cycle power. Replace control module if fault cannot be cleared."}, {"code": "F114", "meaning": "uC Failure: Microprocessor failure.", "fix": "Cycle power. Verify grounding requirements. Replace control module if fault cannot be cleared."}, {"code": "F122", "meaning": "I/O Board Fail: Failure has been detected in the drive control and I/O section.", "fix": "Cycle power. Replace drive or control module if fault cannot be cleared."}, {"code": "F125", "meaning": "Flash Update Req: The firmware in the drive is corrupt, mismatched, or incompatible with the hardware.", "fix": "Perform a firmware flash update operation to attempt to load a valid set of firmware."}, {"code": "F126", "meaning": "NonRecoverablErr: A non-recoverable firmware or hardware error was detected. The drive was automatically stopped and reset.", "fix": "Clear fault or cycle power to the drive. Replace drive or control module if fault cannot be cleared."}, {"code": "F127", "meaning": "DSIFlashUpdatReq: A critical problem with the firmware was detected and the drive is running using backup firmware that only supports DSI communications.", "fix": "Perform a firmware flash update operation using DSI communications to attempt to load a valid set of firmware."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/520-um001_-en-e.pdf", "sources": ["https://www.manualsdir.com/manuals/578029/rockwell-automation-25b-powerflex-520-series-adjustable-frequency-ac-drive-quick-start-25a-powerflex-520-series-adjustable-frequency-ac-drive-quick-start.html?page=20", "https://docs.rs-online.com/0238/A700000015338479.pdf", "https://manuals.plus/m/b9445a63c78865037d22238ddedbb785b4309c9798da9da35029d628658636a6", "https://www.scribd.com/document/372060262/520-qs001-en-e", "https://plcexchange.net/how-to-allen-bradley-vfd-selection/", "https://docs.rs-online.com/ad16/A700000008519420.pdf (RS Online mirror, 520-UM001K-EN-E)"], "tbd": [], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-525", "category": "vfd", "family": "PowerFlex 525", "catalogNumbers": ["25B-D010N114", "25B-D6P0N114"], "name": "PowerFlex 525 AC Drive", "whatItIs": "The full-featured drive in Rockwell's PowerFlex 520-series (bulletin 25B) and the seed component 25B-D010N114: 4 kW / 5 Hp, 380-480V 3-phase, 10.5 A output, Frame B, IP20 open type, with embedded EtherNet/IP, built-in Safe Torque-Off and an integral brake transistor. It covers 0.5 to 30 Hp (0.4 to 22 kW) across 100-600V classes and adds closed-loop velocity vector control and permanent-magnet motor control over the 523.", "whenToUse": "Pick the 525 over the 523 when the drive must talk to a PLC over EtherNet/IP without an add-on card, when STO is specified, or when you need closed-loop velocity vector or PM motor control. It is the default pick for a small standalone machine with network control: conveyors, pumps, fans and machine axes needing controlled ramps. Pick a 753/755 when power exceeds 30 Hp, or when the job needs process PID with encoder feedback options, DeviceLogix, Safe Speed Monitor or Integrated Motion.", "selection": "Size by motor FLA against the drive rated output amps in 520-TD001 (e.g. 25B-D010N114 is 10.5 A, 5 Hp / 4 kW normal and heavy duty). Voltage classes: 100-120V 1-phase, 200-240V 1- or 3-phase, 380-480V 3-phase, 525-600V 3-phase. Frames A-E; frame is read from 520-TD001, it is not in the catalog number. Two accessory card slots (the 523 has one). Select fuses and circuit breakers from the 520-TD001 tables for the exact catalog number.", "wiring": {"power": "Power terminals R/L1, S/L2, T/L3 (1-phase input uses R/L1, S/L2) and motor terminals U/T1, V/T2, W/T3; DC+ and DC- bus terminals; BR+ and BR- for an external dynamic brake resistor (integral brake transistor fitted on all ratings). PE safety ground is mandatory. Frame A: 0.8-5.3 sq mm (18-10 AWG), torque 1.76-2.16 N-m; Frame E: up to 26.7 sq mm (3 AWG), torque 3.09-3.77 N-m. Swap any two motor leads to reverse forward direction.", "feedback": "Two analog inputs, independently isolated: 0-10V (or +/-10V) on terminal 13 and 0/4-20 mA on terminal 15; one analog output (0-10V or 0/4-20 mA) on terminal 16. Pulse input on terminal 07 accepts pulses up to 100 kHz; encoder feedback needs the 25-ENC-1 option card. Seven digital inputs (one dedicated Stop plus six programmable), two relay outputs, two opto outputs.", "safety": "Built-in Safe Torque-Off, SIL 2/PLd, on terminals S1 (Safety 1), S2 (Safety 2) and S+ (Safety +24V). The drive ships with a protective jumper on S1, S2 and S+; the safety inputs only take effect once the jumper is removed. STO removes rotational power without removing power from the drive.", "network": "Embedded single-port EtherNet/IP adapter (see 520COM-UM001) plus built-in RS-485 (DSI) port for Modbus RTU. Optional cards: 25-COMM-E2P dual-port EtherNet/IP, 25-COMM-D DeviceNet, 25-COMM-P PROFIBUS DP."}, "configuration": [{"step": "Reset to factory defaults on a used drive", "screen": "HIM Basic Program group", "parameter": "P053 [Reset To Defalts]", "value": "2 = Factory Reset (drive must be stopped)", "source": "520-AT001A Appendix A"}, {"step": "Enter motor nameplate voltage", "screen": "HIM Basic Program group", "parameter": "P031 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "520-QS001A"}, {"step": "Enter motor nameplate frequency", "screen": "HIM Basic Program group", "parameter": "P032 [Motor NP Hertz]", "value": "Motor nameplate rated frequency (60 Hz default)", "source": "520-QS001A"}, {"step": "Enter motor overload current", "screen": "HIM Basic Program group", "parameter": "P033 [Motor OL Current]", "value": "Motor nameplate overload current; drives the F007 electronic overload", "source": "520-QS001A"}, {"step": "Enter motor nameplate FLA, poles, RPM and power", "screen": "HIM Basic Program group", "parameter": "P034 [Motor NP FLA] / P035 [Motor NP Poles] / P036 [Motor NP RPM] / P037 [Motor NP Power]", "value": "Copy all four from the motor nameplate; P035 default 4 poles, P036 default 1750 rpm", "source": "520-QS001A"}, {"step": "Set control mode", "screen": "HIM Basic Program group", "parameter": "P039 [Torque Perf Mode]", "value": "0 = V/Hz, 1 = SVC (default); closed-loop velocity vector and PM modes are 525-only", "source": "520-UM001D; 520-TD001H"}, {"step": "Set accel and decel times", "screen": "HIM Basic Program group", "parameter": "P041 [Accel Time 1] / P042 [Decel Time 1]", "value": "10.00 s default each; time from 0 Hz to P044 [Maximum Freq] and back", "source": "520-QS001A"}, {"step": "Set frequency limits", "screen": "HIM Basic Program group", "parameter": "P043 [Minimum Freq] / P044 [Maximum Freq]", "value": "P043 default 0.00 Hz; P044 default 60.00 Hz; P044 must be greater than P043 and above P032 before autotune", "source": "520-QS001A; 520-AT001A"}, {"step": "Set stop mode", "screen": "HIM Basic Program group", "parameter": "P045 [Stop Mode]", "value": "0 = Ramp, CF (default); 1 = Coast, CF; 2 = DC Brake, CF", "source": "520-QS001A"}, {"step": "Set start and speed sources", "screen": "HIM Basic Program group", "parameter": "P046 [Start Source 1] / P047 [Speed Reference 1]", "value": "P046: 1 = Keypad (default), 2 = DigIn TrmBlk; P047: 6 = 4-20mA Input for analog speed", "source": "520-QS001A; 520-UM001O"}, {"step": "Clear a fault after correcting its cause", "screen": "Fault handling", "parameter": "P045 [Stop Mode] / A551 [Fault Clear] / t062, t063, t065-t068 [DigIn TermBlk xx]", "value": "(1) Press Stop if P045 [Stop Mode] is 0 'Ramp, CF', 1 'Coast, CF', 2 'DC Brake, CF' or 3 'DCBrkAuto,CF' (CF = stop command clears the active fault; options 4-11 do not clear); (2) cycle drive power; (3) set A551 [Fault Clear] to 1 'Reset Fault' or 2 'Clear Buffer'; or (4) cycle a digital input if t062, t063, t065-t068 is set to 13 'Clear Fault'.", "source": "520-UM001 Ch4"}, {"step": "Configure PID loop 1 (available on 523 and 525)", "screen": "Advanced Program Group", "parameter": "A456-A467 [PID 1]", "value": "A456/A468 PID Trim Hi, A457/A469 Trim Lo, A458/A470 Trim Sel, A459/A471 Ref Sel, A460/A472 Fdback Sel, A461/A473 Prop Gain (default 0.01, range 0.00-99.99), A462/A474 Integ Time (default 2.0 s, 0.0-999.9 s), A463/A475 Diff Rate (default 0.00), A464/A476 Setpoint (default 0.0%, 0.0-100.0%), A465/A477 Deadband (default 0.0%, 0.0-10.0%), A466/A478 Preload (default 0.0 Hz), A467/A479 Invert Err (0 'Normal' default, 1 'Inverted'). PID 1 = A456-A467; PID 2 = A468-A479 and is PowerFlex 525 only.", "source": "520-UM001 Ch3"}, {"step": "Select a PID loop as the speed reference", "screen": "Basic Program Group", "parameter": "P047 [Speed Reference1]", "value": "11 = 'PID1 Output', 12 = 'PID2 Output' (525 only).", "source": "520-UM001 Ch3"}], "commissioning": ["Lock out and tag out, verify zero voltage at R/L1, S/L2, T/L3 before touching terminals.", "Confirm the supply voltage matches the drive voltage class and the motor nameplate; confirm fuses/breaker per 520-TD001.", "Check PE ground continuity and that motor leads land on U/T1, V/T2, W/T3 in the right phase order.", "Confirm the STO jumper on S1/S2/S+ is fitted if no safety circuit is wired, or removed and wired to the safety device if STO is used.", "Verify control wiring against the 525 control I/O diagram: terminal 01 is Stop, 02 Start/Run FWD, 03 Direction/Run REV, 13 is 0-10V in, 15 is 4-20 mA in.", "Enter the motor nameplate data (P031-P037) before the first run; do not trust defaults.", "Run P040 autotune, then jog the motor at low speed and check rotation; swap two motor leads if reversed.", "Run up to full speed, compare output current (b003) with motor FLA, and confirm the EtherNet/IP link and the PLC can start/stop the drive.", "Record the final parameter set (or save via Connected Components Workbench) before handover."], "tuning": "Autotune is P040 [Autotune]: 0 = Ready/Idle, 1 = Static Tune (motor does not spin), 2 = Rotate Tune (motor spins). Run Rotate Tune with the motor unloaded/uncoupled where possible; the tune measures the motor circuit and populates the motor model parameters. Set P044 [Maximum Freq] above P032 [Motor NP Hertz] before autotune or the tune fails. If the motor is unstable at low speed in SVC, lengthen P041 [Accel Time 1]; if it trips F005 on stopping, lengthen P042 [Decel Time 1] or fit a dynamic brake resistor on BR+/BR-.", "faults": [{"code": "F004", "meaning": abling. Check network adapter setting. Check external network status."}, {"code": "F073", "meaning": "EN Net Loss: Control through the embedded EtherNet/IP adapter has been interrupted.", "fix": "Cycle power. Check communications cabling. Check EtherNet/IP setting. Check external network status."}, {"code": "F080", "meaning": "Autotune Failure: The autotune function was either cancelled by the user or failed.", "fix": "Restart procedure."}, {"code": "F081", "meaning": "DSI Comm Loss: Communications between the drive and the Modbus or DSI master device have been interrupted.", "fix": "Cycle power. Check communications cabling. Check Modbus or DSI setting. Check Modbus or DSI status. Modify using C125 [Comm Loss Action]. Connecting I/O terminals C1 and C2 to ground may improve noise immunity. Replace wiring, Modbus master device, or control module."}, {"code": "F082", "meaning": "Opt Comm Loss: Communications between the drive and the network option card have been interrupted.", "fix": "Cycle power. Reinstall option card in drive. Modify using C125 [Comm Loss Action]. Replace wiring, port expander, option card, or control module."}, {"code": "F083", "meaning": "EN Comm Loss: Internal communications between the drive and the embedded EtherNet/IP adapter have been interrupted.", "fix": "Cycle power. Check EtherNet/IP setting. Check drive's Ethernet settings and diagnostic parameters. Modify using C125 [Comm Loss Action]. Replace wiring, Ethernet switch, or control module."}, {"code": "F091", "meaning": "Encoder Loss: One of the 2 encoder channel signals is missing. Requires differential encoder.", "fix": "Check Wiring. If P047, P049, P051 [Speed Referencex] = 16 'Positioning' and A535 [Motor Fdbk Type] = 5 'Quad Check', swap the Encoder channel inputs or swap any two motor leads. Replace encoder."}, {"code": "F094", "meaning": "Function Loss: 'Freeze-Fire' (Function Loss) input is inactive, input to the programmed terminal is open.", "fix": "Close input to the terminal and cycle power."}, {"code": "F100", "meaning": "Parameter Chksum: Drive parameter non-volatile storage is corrupted.", "fix": "Set P053 [Reset To Defalts] to 2 'Factory Rset'."}, {"code": "F101", "meaning": "External Storage: External non-volatile storage has failed.", "fix": "Set P053 [Reset To Defalts] to 2 'Factory Rset'."}, {"code": "F105", "meaning": "C Connect Err: Control module was disconnected while drive was powered.", "fix": "Clear fault and verify all parameter settings. Do not remove or install the control module while power is applied."}, {"code": "F106", "meaning": "Incompat C-P: The PowerFlex 525 control module does not support power modules with 0.25 HP power rating.", "fix": "Change to a different power module. Change to a PowerFlex 523 control module."}, {"code": "F107", "meaning": "Replaced C-P: The control module could not recognize the power module. Hardware failure.", "fix": "Change to a different power module. Replace control module if changing power module does not work."}, {"code": "F109", "meaning": "Mismatch C-P: The control module was mounted to a different drive type power module.", "fix": "Set P053 [Reset To Defalts] to 3 'Power Reset'. Cycle power."}, {"code": "F110", "meaning": "Keypad Membrane: Keypad membrane failure / disconnected.", "fix": "Cycle power. Replace control module if fault cannot be cleared."}, {"code": "F111", "meaning": "Safety Hardware: Safety input enable hardware malfunction. One of the safety inputs is not enabled.", "fix": "Check safety input signals. If not using safety, verify and tighten jumper for I/O terminals S1, S2, and S+. Replace control module if fault cannot be cleared."}, {"code": "F114", "meaning": "uC Failure: Microprocessor failure.", "fix": "Cycle power. Verify grounding requirements. Replace control module if fault cannot be cleared."}, {"code": "F122", "meaning": "I/O Board Fail: Failure has been detected in the drive control and I/O section.", "fix": "Cycle power. Replace drive or control module if fault cannot be cleared."}, {"code": "F125", "meaning": "Flash Update Req: The firmware in the drive is corrupt, mismatched, or incompatible with the hardware.", "fix": "Perform a firmware flash update operation to attempt to load a valid set of firmware."}, {"code": "F126", "meaning": "NonRecoverablErr: A non-recoverable firmware or hardware error was detected. The drive was automatically stopped and reset.", "fix": "Clear fault or cycle power to the drive. Replace drive or control module if fault cannot be cleared."}, {"code": "F127", "meaning": "DSIFlashUpdatReq: A critical problem with the firmware was detected and the drive is running using backup firmware that only supports DSI communications.", "fix": "Perform a firmware flash update operation using DSI communications to attempt to load a valid set of firmware."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/520-um001_-en-e.pdf", "sources": ["https://www.manualsdir.com/manuals/578029/rockwell-automation-25b-powerflex-520-series-adjustable-frequency-ac-drive-quick-start-25a-powerflex-520-series-adjustable-frequency-ac-drive-quick-start.html?page=20", "https://docs.rs-online.com/0238/A700000015338479.pdf", "https://manuals.plus/m/b9445a63c78865037d22238ddedbb785b4309c9798da9da35029d628658636a6", "https://www.scribd.com/document/612159169/520-at001-en-p", "https://plcexchange.net/how-to-powerflex-525-installation/", "https://www.tdl-ia.com/insights/powerflex-4-40-to-powerflex-525-migration.html", "https://www.rockwellautomation.com/en-us/products/details.25b-d010n114.html", "https://docs.rs-online.com/ad16/A700000008519420.pdf (RS Online mirror, 520-UM001K-EN-E)"], "tbd": [], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-70", "category": "vfd", "family": "PowerFlex 70", "catalogNumbers": ["20AB2P2A3AYYNNC0"], "name": "PowerFlex 70 AC Drive", "whatItIs": "Rockwell's compact performance drive (bulletin 20A) for machines that need vector control in a small frame. It covers 0.5-25 Hp at 240V AC input, 0.5-50 Hp at 480V and 600V AC input, in Frames A-E, with V/Hz, sensorless vector and (Enhanced Control) flux vector control. It shares its parameter structure and HIM with the PowerFlex 700 but is the smaller, panel-mount member of the pair.", "whenToUse": "Pick the 70 over the 525 when the machine needs true vector control, an LCD HIM with S.M.A.R.T. Start, DPI communication options, or power up to 50 Hp with a compact frame. Pick the 700 over the 70 when power exceeds 50 Hp or the job needs the 700's larger frames, IP54 Type 12 standalone packages, or vector-control firmware options. Pick the 525 for small jobs where the 70's vector performance and DPI options are not needed. Note: most PowerFlex 70 catalog numbers are now Discontinued (2025-2026); the remaining IP66/NEMA 4X variants are End of Life with a discontinued date of Jul 01, 2027. Status varies by catalog number, so check the exact catalog page. Rockwell's current migration path for new designs is the 750-series.", "selection": "Size by motor FLA against the drive rated output amps in 20A-TD001, Normal Duty or Heavy Duty. Power ratings: 0.5-25 Hp at 240V AC input, 0.5-50 Hp at 480V AC input, 0.5-50 Hp at 600V AC input. Frames A-E; IP20 NEMA/UL Type 1, with IP66 Type 4X/12 options on some frames. Select fuses and circuit breakers from the 20A-TD001 tables for the exact catalog number.", "wiring": {"power": "Three-phase input to R/L1, S/L2, T/L3; motor to U/T1, V/T2, W/T3; PE ground; DC bus test points are on the power terminal block. Follow the wire sizes and torques in 20A-IN009 for the frame fitted.", "feedback": "the encoder interface is the 20A-ENC-1 board: terminals 1 = 5...12V power, 2 = power return, 3 = Encoder B (NOT), 4 = Encoder B, 5 = Encoder A (NOT), 6 = Encoder A (jumper-selectable +5...12V, 12V DC 250 mA internal)", "safety": "No built-in Safe Torque-Off. Stopping and isolation must be provided externally to the plant safety design; the drive reports an F111 Enable Hardware fault when the hardware enable is disabled while the logic pin is still low.", "network": "No embedded Ethernet. Communication is through DPI ports using 20-COMM adapters: 20-COMM-E (EtherNet/IP), 20-COMM-D (DeviceNet), 20-COMM-C (ControlNet), 20-COMM-M (Modbus/TCP), 20-COMM-H (HVAC), 20-COMM-K (CANopen) and 20-COMM-L (LonWorks). The HIM is a removable LCD or LED module."}, "configuration": [{"step": "Enter motor nameplate volts", "screen": "LCD HIM, File-Group-Parameter view (or Numbered List view)", "parameter": "41 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Enter motor nameplate amps, hertz, RPM and power", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "42 [Motor NP Amps] / 43 [Motor NP Hertz] / 44 [Motor NP RPM] / 45 [Motor NP Power]", "value": "Copy all four from the motor nameplate", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Set motor control selection", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "53 [Motor Cntl Sel]", "value": "V/Hz for simple speed control; Sensrls Vect or SV Economize for sensorless vector (required before autotune works)", "source": "20A-QS001E; PFLEX-AP005A"}, {"step": "Set maximum frequency", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "55 [Maximum Freq]", "value": "5.0/420.0 Hz range; set to the top speed the motor is rated for", "source": "20B-UM001 (via 20B parameter text)"}, {"step": "Set minimum and maximum speed", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "81 [Minimum Speed] / 82 [Maximum Speed]", "value": "Speed limits in the configured speed units; also set 83 [Overspeed Limit]", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Run autotune", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "61 [Autotune]", "value": "1 = Static Tune (motor still) or 2 = Rotate Tune (motor spins); 3 = Calculate is the default; 0 = Ready", "source": "20A-QS001E; 20A-UM001O"}, {"step": "Set accel and decel times", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "140 [Accel Time 1] / 142 [Decel Time 1]", "value": "10.0 s default each; range 0.1/3600.0 s", "source": "20A-QS001E; 20A-UM001P"}, {"step": "Select the speed reference source", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "90 [Speed Ref A Sel]", "value": "Source for speed reference A (analog input, preset speed, DPI, MOP, etc.)", "source": "PFLEX-AP005A; 20B/20A Parameters FRN 3.xx list"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; confirm the supply voltage matches the drive voltage class.", "Confirm fuses/breaker per 20A-TD001 and that the PE ground is in place.", "Use the LCD HIM S.M.A.R.T. Start: it walks through Start Mode and Stop Mode, Minimum and Maximum Speed, Accel Time 1 and Decel Time 1, Reference Source, and Thermal Motor Overload.", "Enter the motor nameplate data (41-45) before the first run; do not trust defaults.", "Run 61 [Autotune] (Static Tune first; Rotate Tune uncoupled if the application allows).", "Jog the motor at low speed, check rotation and that the output frequency follows the commanded speed.", "Run up to full speed, compare output current with 42 [Motor NP Amps], and confirm the selected speed reference actually drives the speed.", "Check parameter 214 [Start Inhibits] if the drive will not start: a flashing yellow STS LED means an inhibit condition exists."], "tuning": "Autotune is 61 [Autotune]: 0 = Ready, 1 = Static Tune (a non-rotational test; a start command is required after initiation), 2 = Rotate Tune (a Static Tune followed by a rotational test), 3 = Calculate (default). It sets 62 [IR Voltage Drop] and 63 [Flux Current Ref], which affect sensorless vector performance. It is valid only when parameter 53 is set to Sensrls Vect, SV Economize (or FVC Vector on Enhanced Control). Enter the motor nameplate data first: the autotune procedure needs [Motor NP Volts], [Motor NP Hertz] and [Motor NP Power] to get accurate results. If the autotune values fall outside the acceptable range the drive raises F77 [IR Volts Range] or F78 [FluxAmpsRef Rang].", "faults": [{"code": "F2", "meaning": "Auxiliary Input: auxiliary input interlock is open.", "fix": "Check remote wiring."}, {"code": "F4", "meaning": "UnderVoltage: DC bus voltage fell below the minimum value.", "fix": "Monitor the incoming AC line for low voltage or line power interruption."}, {"code": "F5", "meaning": "OverVoltage: DC bus voltage exceeded the maximum value.", "fix": "Monitor the AC line for high line voltage or transient conditions. Bus overvoltage can also be caused by motor regeneration; extend the decel time or install a dynamic brake option."}, {"code": "F7", "meaning": "Motor Overload: internal electronic overload trip.", "fix": "Check for excess load; verify the motor overload settings and parameter 42 [Motor NP Amps]."}, {"code": "F12", "meaning": "HW OverCurrent: the drive output current has exceeded the hardware current limit.", "fix": "Check programming; check for excess load, improper DC boost setting or other causes of excess current."}, {"code": "F13", "meaning": "Ground Fault: a current path to earth ground has been detected at one or more drive output terminals.", "fix": "Check the motor and external wiring to the drive output terminals for a grounded condition."}, {"code": "F24", "meaning": "Decel Inhibit: the drive is not following a commanded deceleration because it is attempting to limit bus voltage.", "fix": "Check input voltage and system grounding; lengthen the decel time or fit dynamic braking."}, {"code": "F36", "meaning": "SW OverCurrent: drive output current has exceeded the 1 ms current rating (typically 200-250% of the drive continuous rating).", "fix": "Check for excess load, improper DC boost setting, or other causes of excess current."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/20a-um001_-en-p.pdf", "sources": ["https://www.sigi-elect.si/sites/default/files/doc_tree/powerflex%2070%20-%20quick%20start%20guide.pdf", "https://manuals.plus/m/9d6f03313480baea1173c492292cf9d52b1b4ce58bbee68f4d2960134157a616", "https://archive.org/download/manualzilla-id-5892875/5892875.pdf", "https://eforsan.com.tr/wp-content/uploads/2023/10/PowerFlex-70-Adjustable-Frequency-AC-Drives-1.pdf", "https://www.manualsdir.com/manuals/580976/rockwell-automation-20b-powerflex-70-_-700-parameters-frn-3xx-20a-powerflex-70-_-700-parameters-frn-3xx.html?page=25", "https://www.manualslib.com/manual/4671416/Allen-Bradley-Powerflex-70.html (ManualsLib mirror, 20A-TD001K-EN-P)", "https://manuals.plus/m/9d6f03313480baea1173c492292cf9d52b1b4ce58bbee68f4d2960134157a616 (manuals.plus mirror, 20A-IN009E-EN-P)", "https://archive.org/stream/manualzilla-id-5853650/5853650_djvu.txt (archive.org full text, 20A-UM001O-EN-P)", "https://www.artisantg.com/info/Allen_Bradley_PowerFlex_manual.pdf (Artisan Technology Group copy, PowerFlex 70 User Manual)"], "tbd": [], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-700", "category": "vfd", "family": "PowerFlex 700", "catalogNumbers": ["20BD1P1A0AYNANC0", "20BB2P2A0AYNBNC0"], "name": "PowerFlex 700 AC Drive", "whatItIs": "Rockwell's large-frame performance drive (bulletin 20B) for demanding torque control of three-phase induction motors, from the simplest speed control to flux vector control with encoder feedback. It covers 0.5-100 Hp at 240V, 0.5-700 Hp at 480V, 1-150 Hp at 600V and 50-150 Hp at 690V, in Frames 0-10, with Standard Control and Vector Control (700VC) firmware.", "whenToUse": "Pick the 700 over the 70 when power exceeds 50 Hp, when the job needs Frames 6-10, an IP54 Type 12 standalone wall-mount package (75-200 Hp, Frames 5-6), or the 700VC vector-control firmware with encoder feedback and position control options. Pick the 753/755 for new designs: the PowerFlex 700 is Discontinued (catalogs discontinued in 2023, e.g. Nov 30, 2023 and Jun 01, 2023); Rockwell's current migration path is the 750-series (see PFLEX-AP005, the PowerFlex 700 to 753 migration guide). Pick the 70 for the same control capability in a smaller frame up to 50 Hp.", "selection": "Size by motor FLA against the drive rated output amps in 20B-TD001, Normal Duty or Heavy Duty (the seed example 20BD1P1A0AYNANC0 is 1.1 A, 0.5 Hp at 480V, Frame 0). Voltage classes: 240V, 480V, 600V and 690V AC, 3-phase. Frames 0-3 are IP20 NEMA/UL Type 1; Frames 5-6 are available as IP54 NEMA/UL Type 12 standalone wall-mount drives (75-200 Hp); Frames 7-10 are larger floor/wall packages. Select fuses and circuit breakers from the 20B-TD001 tables for the exact catalog number.", "wiring": {"power": "Three-phase input to R/L1, S/L2, T/L3; motor to U/T1, V/T2, W/T3; PE ground; DC bus test points are on the power terminal block. Follow the wire sizes and torques in 20B-IN019E (Frames 0-6) or 20B-IN014H (Frames 7-10) for the frame fitted.", "feedback": "the 700VC encoder interface is terminals 1 = Encoder A, 2 = Encoder A (NOT), 3 = Encoder B, 4 = Encoder B (NOT), 5 = Encoder Z, 6 = Encoder Z (NOT), 7 = +12V DC return (common), 8 = +12V DC power (250 mA, jumper-selectable +5/12V on 20B-ENC-1)", "safety": "No built-in Safe Torque-Off. Stopping and isolation must be provided externally to the plant safety design; the drive reports an F111 Enable Hardware fault when the hardware enable is disabled while the logic pin is still low.", "network": "No embedded Ethernet. Communication is through DPI ports using 20-COMM adapters: 20-COMM-E (EtherNet/IP), 20-COMM-D (DeviceNet), 20-COMM-C (ControlNet), 20-COMM-M (Modbus/TCP), 20-COMM-H (HVAC), 20-COMM-K (CANopen) and 20-COMM-L (LonWorks). The HIM is a removable LCD or LED module; parameters are viewed in File-Group-Parameter or Numbered List order on the LCD HIM."}, "configuration": [{"step": "Enter motor nameplate volts", "screen": "LCD HIM, File-Group-Parameter view (or Numbered List view)", "parameter": "41 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Enter motor nameplate amps, hertz, RPM and power", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "42 [Motor NP Amps] / 43 [Motor NP Hertz] / 44 [Motor NP RPM] / 45 [Motor NP Power]", "value": "Copy all four from the motor nameplate", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Set motor control selection", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "53 [Motor Cntl Sel]", "value": "V/Hz for simple speed control; Sensrls Vect or SV Economize for sensorless vector; FVC Vector on 700VC with encoder", "source": "20A-UM001O; PFLEX-AP005A"}, {"step": "Set maximum frequency", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "55 [Maximum Freq]", "value": "5.0/420.0 Hz range; set to the top speed the motor is rated for", "source": "20B-UM001 (via 20B parameter text)"}, {"step": "Set minimum and maximum speed", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "81 [Minimum Speed] / 82 [Maximum Speed]", "value": "Speed limits in the configured speed units; also set 83 [Overspeed Limit]", "source": "20B/20A Parameters FRN 3.xx list; PFLEX-AP005A"}, {"step": "Run autotune", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "61 [Autotune]", "value": "1 = Static Tune (motor still) or 2 = Rotate Tune (motor spins); 3 = Calculate is the default; 0 = Ready", "source": "20B-UM002 (via manualzilla text); 20A-UM001O"}, {"step": "Set accel and decel times", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "140 [Accel Time 1] / 142 [Decel Time 1]", "value": "10.0 s default each; range 0.1/3600.0 s", "source": "20A-UM001P; 20A-QS001E"}, {"step": "Select the speed reference source", "screen": "LCD HIM, File-Group-Parameter view", "parameter": "90 [Speed Ref A Sel]", "value": "Source for speed reference A (analog input, preset speed, DPI, MOP, etc.)", "source": "PFLEX-AP005A; 20B/20A Parameters FRN 3.xx list"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; confirm the supply voltage matches the drive voltage class.", "Confirm fuses/breaker per 20B-TD001 and that the PE ground is in place.", "Use the LCD HIM S.M.A.R.T. Start: it walks through Start Mode and Stop Mode, Minimum and Maximum Speed, Accel Time 1 and Decel Time 1, Reference Source, and Thermal Motor Overload.", "Enter the motor nameplate data (41-45) before the first run; do not trust defaults.", "Run 61 [Autotune] (Static Tune first; Rotate Tune uncoupled if the application allows). On 700VC, confirm the encoder feedback reads correctly before closing the loop.", "Jog the motor at low speed, check rotation and that the output frequency follows the commanded speed.", "Run up to full speed, compare output current with 42 [Motor NP Amps], and confirm the selected speed reference actually drives the speed.", "Check parameter 214 [Start Inhibits] if the drive will not start: a flashing yellow STS LED means an inhibit condition exists."], "tuning": "Autotune is 61 [Autotune]: 0 = Ready, 1 = Static Tune (a non-rotational test; a start command is required after initiation), 2 = Rotate Tune (a Static Tune followed by a rotational test), 3 = Calculate (default). It sets 62 [IR Voltage Drop] and 63 [Flux Current Ref], which affect sensorless vector performance. It is valid only when parameter 53 is set to Sensrls Vect, SV Economize (or FVC Vector on 700VC). Enter the motor nameplate data first: the autotune procedure needs [Motor NP Volts], [Motor NP Hertz] and [Motor NP Power] to get accurate results. During start-up the drive may temporarily modify parameters 53, 80, 276, 278 and 361-366 and restore them when start-up completes. If the autotune values fall outside the acceptable range the drive raises F77 [IR Volts Range] or F78 [FluxAmpsRef Rang].", "faults": [{"code": "F3", "meaning": "Power Loss: DC bus voltage remained below 85% of nominal for longer than [Power Loss Time].", "fix": "Monitor the incoming AC line for low voltage or interruption; enable/disable with [Fault Config 1]."}, {"code": "F5", "meaning": "OverVoltage: DC bus voltage exceeded the maximum value.", "fix": "Monitor the AC line for high line voltage or transient conditions. Bus overvoltage can also be caused by motor regeneration; extend the decel time or install a dynamic brake option."}, {"code": "F7", "meaning": "Motor Overload: internal electronic overload trip.", "fix": "Check for excess load; verify the motor overload settings and parameter 42 [Motor NP Amps]."}, {"code": "F12", "meaning": "HW OverCurrent: the drive output current has exceeded the hardware current limit.", "fix": "Check programming; check for excess load, improper DC boost setting or other causes of excess current."}, {"code": "F13", "meaning": "Ground Fault: a current path to earth ground greater than 25% of the drive rating.", "fix": "Check the motor and external wiring to the drive output terminals for a grounded condition."}, {"code": "F24", "meaning": "Decel Inhibit: the drive is not following a commanded deceleration because it is attempting to limit bus voltage.", "fix": "Check input voltage and system grounding; lengthen the decel time or fit dynamic braking."}, {"code": "F25", "meaning": "OverSpeed Limit: slip compensation or bus regulation tried to add an output frequency adjustment greater than [Overspeed Limit].", "fix": "Check parameter 83 [Overspeed Limit]; remove excessive load or overhauling conditions."}, {"code": "F36", "meaning": "SW OverCurrent: drive output current has exceeded the 1 ms current rating (typically 200-250% of the drive continuous rating).", "fix": "Check for excess load, improper DC boost setting, or other causes of excess current."}, {"code": "F2", "meaning": "Auxiliary Input: Auxiliary input interlock is open.", "fix": "Check remote wiring."}, {"code": "F4", "meaning": "UnderVoltage: DC bus voltage fell below the minimum value of 407V DC at 400/480V input or 204V DC at 200/240V input. Enable/Disable with [Fault Config 1].", "fix": "Monitor the incoming AC line for low voltage or power interruption."}, {"code": "F8", "meaning": "Heatsink OvrTemp: Heatsink temperature exceeds 100% of [Drive Temp].", "fix": "Verify that maximum ambient temperature has not been exceeded. Check fan. Check for excess load."}, {"code": "F9", "meaning": "Trnsistr OvrTemp: Output transistors have exceeded their maximum operating temperature.", "fix": "Verify that maximum ambient temperature has not been exceeded. Check fan. Check for excess load."}, {"code": "F10", "meaning": "Heatsink LowTemp: Annunciates a too low temperature case or an open NTC (heatsink temperature sensing device) circuit.", "fix": "Verify ambient temperature. In cold ambient temperatures, add space heaters."}, {"code": "F15", "meaning": "Load Loss: Drive output torque current is below [Load Loss Level] for a time period greater than [Load Loss time].", "fix": "Verify connections between motor and load. Verify level and time requirements."}, {"code": "F16", "meaning": "Motor Thermistor: Thermistor output is out of range.", "fix": "Verify that thermistor is connected. Motor is overheated. Reduce load."}, {"code": "F17", "meaning": "Input Phase Loss: The DC bus ripple has exceeded a preset level.", "fix": "Check incoming power for a missing phase/blown fuse."}, {"code": "F18", "meaning": "Hardware PTC: Hardware enable is disabled (jumpered high) but logic pin is still low.", "fix": "Check jumper. Replace Main Control Board."}, {"code": "F20", "meaning": "TorqPrv Spd Band: Difference between [Commanded Speed] and [Encoder Speed] has exceeded the level set in [Spd Dev Band] for a time period greater than [Spd Band Integrat].", "fix": "Check wiring between drive and motor. Check release of mechanical brake."}, {"code": "F21", "meaning": "Output PhaseLoss: Current in one or more phases has been lost or remains below a preset level.", "fix": "Check the drive and motor wiring. Check for phase-to-phase continuity at the motor terminals. Check for disconnected motor leads."}, {"code": "F29", "meaning": "Analog In Loss: An analog input is configured to fault on signal loss. A signal loss has occurred. Configure with [Anlg In 1, 2 Loss].", "fix": "Check parameters. Check for broken/loose connections at inputs."}, {"code": "F33", "meaning": "Auto Rstrt Tries: Drive unsuccessfully attempted to reset a fault and resume running for the programmed number of [Flt RstRun Tries]. Enable/Disable with [Fault Config 1].", "fix": "Correct the cause of the fault and manually clear."}, {"code": "F38", "meaning": "Phase U to Grnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Check the wiring between the drive and motor. Check motor for grounded phase. Replace drive."}, {"code": "F39", "meaning": "Phase V to Grnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Check the wiring between the drive and motor. Check motor for grounded phase. Replace drive."}, {"code": "F40", "meaning": "Phase W to Grnd: A phase to ground fault has been detected between the drive and motor in this phase.", "fix": "Check the wiring between the drive and motor. Check motor for grounded phase. Replace drive."}, {"code": "F41", "meaning": "Phase UV Short: Excessive current has been detected between these two output terminals.", "fix": "Check the motor and drive output terminal wiring for a shorted condition. Replace drive."}, {"code": "F42", "meaning": "Phase VW Short: Excessive current has been detected between these two output terminals.", "fix": "Check the motor and drive output terminal wiring for a shorted condition. Replace drive."}, {"code": "F43", "meaning": "Phase UW Short: Excessive current has been detected between these two output terminals.", "fix": "Check the motor and drive output terminal wiring for a shorted condition. Replace drive."}, {"code": "F48", "meaning": "Params Defaulted: The drive was commanded to write default values to EEPROM.", "fix": "Clear the fault or cycle power to the drive. Program the drive parameters as needed."}, {"code": "F55", "meaning": "Cntl Bd Overtemp: The temperature sensor on the Main Control Board detected excessive heat.", "fix": "Check Main Control Board fan. Check surrounding air temperature. Verify proper mounting/cooling."}, {"code": "F63", "meaning": "Shear Pin: Programmed [Current Lmt Val] has been exceeded. Enable/Disable with [Fault Config 1].", "fix": "Check load requirements and [Current Lmt Val] setting."}, {"code": "F64", "meaning": "Drive OverLoad: Drive rating of 110% for 1 minute or 150% for 3 seconds has been exceeded.", "fix": "Reduce load or extend Accel Time."}, {"code": "F69", "meaning": "DB Resistance: Resistance of the internal DB resistor is out of range.", "fix": "Replace resistor."}, {"code": "F70", "meaning": "Power Unit: One or more of the output transistors were operating in the active region instead of desaturation. This can be caused by excessive transistor current or insufficient base drive voltage.", "fix": "Check for damaged output transistors. Replace drive."}, {"code": "F71", "meaning": "Port 1 Adapter: The communications card has a fault.", "fix": "Check DPI device event queue and corresponding fault information for the device."}, {"code": "F72", "meaning": "Port 2 Adapter: The communications card has a fault.", "fix": "Check DPI device event queue and corresponding fault information for the device."}, {"code": "F73", "meaning": "Port 3 Adapter: The communications card has a fault.", "fix": "Check DPI device event queue and corresponding fault information for the device."}, {"code": "F74", "meaning": "Port 4 Adapter: The communications card has a fault.", "fix": "Check DPI device event queue and corresponding fault information for the device."}, {"code": "F75", "meaning": "Port 5 Adapter: The communications card has a fault.", "fix": "Check DPI device event queue and corresponding fault information for the device."}, {"code": "F76", "meaning": "Port 6 Adapter: The communications card has a fault.", "fix": "Check DPI device event queue and corresponding fault information for the device."}, {"code": "F77", "meaning": "IR Volts Range: 'Calculate' is the autotune default and the value determined by the autotune procedure for IR Drop Volts is not in the range of acceptable values.", "fix": "Re-enter motor nameplate data."}, {"code": "F78", "meaning": "FluxAmpsRef Rang: The value for flux amps determined by the Autotune procedure exceeds the programmed [Motor NP FLA].", "fix": "Reprogram [Motor NP FLA] with the correct motor nameplate value. Repeat Autotune."}, {"code": "F79", "meaning": "Excessive Load: Motor did not come up to speed in the allotted time during autotune.", "fix": "Uncouple load from motor. Repeat Autotune."}, {"code": "F80", "meaning": "AutoTune Aborted: Autotune function was canceled by the user or a fault occurred.", "fix": "Restart procedure."}, {"code": "F81", "meaning": "Port 1 DPI Loss: DPI port stopped communicating.", "fix": "If adapter was not intentionally disconnected, check wiring to the port. Replace wiring, port expander, adapters, Main Control Board or complete drive as required. Check HIM connection. If an adapter was intentionally disconnected and the [Logic Mask] bit for that adapter is set to '1', this fault will occur; to disable it, set the [Logic Mask] bit for the adapter to '0'."}, {"code": "F82", "meaning": "Port 2 DPI Loss: DPI port stopped communicating.", "fix": "If adapter was not intentionally disconnected, check wiring to the port. Replace wiring, port expander, adapters, Main Control Board or complete drive as required. Check HIM connection. If an adapter was intentionally disconnected and the [Logic Mask] bit for that adapter is set to '1', this fault will occur; to disable it, set the [Logic Mask] bit for the adapter to '0'."}, {"code": "F83", "meaning": "Port 3 DPI Loss: DPI port stopped communicating.", "fix": "If adapter was not intentionally disconnected, check wiring to the port. Replace wiring, port expander, adapters, Main Control Board or complete drive as required. Check HIM connection. If an adapter was intentionally disconnected and the [Logic Mask] bit for that adapter is set to '1', this fault will occur; to disable it, set the [Logic Mask] bit for the adapter to '0'."}, {"code": "F84", "meaning": "Port 4 DPI Loss: DPI port stopped communicating.", "fix": "If adapter was not intentionally disconnected, check wiring to the port. Replace wiring, port expander, adapters, Main Control Board or complete drive as required. Check HIM connection. If an adapter was intentionally disconnected and the [Logic Mask] bit for that adapter is set to '1', this fault will occur; to disable it, set the [Logic Mask] bit for the adapter to '0'."}, {"code": "F85", "meaning": "Port 5 DPI Loss: DPI port stopped communicating.", "fix": "If adapter was not intentionally disconnected, check wiring to the port. Replace wiring, port expander, adapters, Main Control Board or complete drive as required. Check HIM connection. If an adapter was intentionally disconnected and the [Logic Mask] bit for that adapter is set to '1', this fault will occur; to disable it, set the [Logic Mask] bit for the adapter to '0'."}, {"code": "F86", "meaning": "Port 6 DPI Loss: DPI port stopped communicating.", "fix": "If adapter was not intentionally disconnected, check wiring to the port. Replace wiring, port expander, adapters, Main Control Board or complete drive as required. Check HIM connection. If an adapter was intentionally disconnected and the [Logic Mask] bit for that adapter is set to '1', this fault will occur; to disable it, set the [Logic Mask] bit for the adapter to '0'."}, {"code": "F87", "meaning": "IXo VoltageRange: Voltage calculated for motor inductive impedance exceeds 25% of [Motor NP Volts].", "fix": "Check for proper motor sizing. Check for correct programming of [Motor NP Volts], parameter 41. Additional output impedance may be required."}, {"code": "F88", "meaning": "Software Fault: Microprocessor handshake error.", "fix": "Replace Main Control Board."}, {"code": "F89", "meaning": "Software Fault: Microprocessor handshake error.", "fix": "Replace Main Control Board."}, {"code": "F90", "meaning": "Encoder Quad Err: Both encoder channels changed state within one clock cycle.", "fix": "Check for externally induced noise. Replace encoder."}, {"code": "F91", "meaning": "Encoder Loss: Requires differential encoder. One of the 2 encoder channel signals is missing.", "fix": "Check Wiring. Check motor rotation. Check encoder pulses, rotation, etc. Replace encoder."}, {"code": "F92", "meaning": "Pulse In Loss: Z Channel is selected as a pulse input and no signal is present.", "fix": "Check wiring. Replace pulse generator."}, {"code": "F93", "meaning": "Hardware Fault: Diagnostic code indicating a drive malfunction.", "fix": "Cycle power. Replace Main Control Board. Contact Tech Support."}, {"code": "F100", "meaning": "Parameter Chksum: The checksum read from the board does not match the checksum calculated.", "fix": "Restore defaults. Reload User Set if used."}, {"code": "F101", "meaning": "UserSet Chksum: The checksum read from the user set does not match the checksum calculated.", "fix": "Re-save user set."}, {"code": "F102", "meaning": "UserSet Chksum: The checksum read from the user set does not match the checksum calculated.", "fix": "Re-save user set."}, {"code": "F103", "meaning": "UserSet Chksum: The checksum read from the user set does not match the checksum calculated.", "fix": "Re-save user set."}, {"code": "F104", "meaning": "Pwr Brd Chksum1: The checksum read from the EEPROM does not match the checksum calculated from the EEPROM data.", "fix": "Clear the fault or cycle power to the drive."}, {"code": "F105", "meaning": "Pwr Brd Chksum2: The checksum read from the board does not match the checksum calculated.", "fix": "Cycle power to the drive. If problem persists, replace drive."}, {"code": "F106", "meaning": "Incompat MCB-PB: Drive rating information stored on the power board is incompatible with the main control board.", "fix": "Load compatible version files into drive. Frame 7-10 drives must have firmware version 4.009 or greater."}, {"code": "F107", "meaning": "Replaced MCB-PB: Main Control Board was replaced and parameters were not programmed.", "fix": "Restore defaults. Reprogram parameters."}, {"code": "F108", "meaning": "Anlg Cal Chksum: The checksum read from the analog calibration data does not match the checksum calculated.", "fix": "Replace drive."}, {"code": "F109", "meaning": "NVS I/O Checksum: EEprom checksum error.", "fix": "Cycle power and repeat function. Replace Main Control Board."}, {"code": "F110", "meaning": "NVS I/O Failure: EEprom I/O error.", "fix": "Cycle power and repeat function. Replace Main Control Board."}, {"code": "F111", "meaning": "Power Down Csum: EEPROM data is corrupt on drive power up.", "fix": "Clear the fault or cycle power to the drive."}, {"code": "F121", "meaning": "I/O Comm Loss: I/O Board lost communications with the Main Control Board.", "fix": "Check connector. Check for induced noise. Replace I/O board or Main Control Board."}, {"code": "F122", "meaning": "I/O Failure: I/O was detected, but failed the powerup sequence.", "fix": "Replace Main Control Board."}, {"code": "F130", "meaning": "Hardware Fault: Hardware Fault.", "fix": "Cycle power. Replace Main Control Board."}, {"code": "F131", "meaning": "Hardware Fault: Hardware Fault.", "fix": "Cycle power. Replace Main Control Board."}, {"code": "F900", "meaning": "Fatal Faults: Fatal Faults.", "fix": "Cycle power. Replace Main Control Board."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/20b-um002_-en-p.pdf", "
