0-DANPT-16Sxx (standard, non-flex); brake cables (optional): 2090-DANBT-18Sxx (standard, non-flex). Do not confuse with TLY's circular threaded connectors and 1 m cables, or with MPL/VPL SpeedTec DIN cables.", "feedback": "Per the KNX-TD001A p151 catalog chart, TL-Series feedback options are B = multi-turn, 17-bit (131,072 counts/rev), absolute, battery-backed encoder (serial protocol; single-turn without battery backup) and H = 2000 lines/rev incremental encoder. Feedback cable: 2090-DANFCT-Sxx (standard, non-flex). NOTE a discrepancy flagged in tbd: KNX-TD001A p149 text says Bulletin TL motors are available 'with high-resolution absolute position encoders' only, while the p151 catalog chart and distributor listings show H incremental TL motors (e.g. TL-A220P-HJ32AN) \u2014 confirm which feedback options are actually orderable for TL before teaching.", "safety": "Safe Torque-Off lives in the drive, not the motor. The optional 24 V DC brake is a HOLDING brake only (KNX-TD001A p164): hold the shaft at 0 rpm up to the rated holding torque, not for stopping rotation, not a safety device. Stop by commanding the drive to decelerate to 0 rpm, then engage the brake. TL has no SIL-rated encoder option.", "network": "The motor has no network port. TL is compatible only with Kinetix 3 servo drives (KNX-TD001A p150) \u2014 NOT with Kinetix 5500/5700, 6000, 300/350 or 2000. The Kinetix 3 drive is configured in Connected Components Workbench (TBD \u2014 not read in this pass)."}, "configuration": [{"step": "TBD \u2014 TL axes run on Kinetix 3 drives configured in Connected Components Workbench, not Studio 5000 Logix Designer; no Kinetix 3 configuration steps were verified in this pass", "screen": "TBD", "parameter": "TBD", "value": "TBD", "source": "TBD \u2014 see tbd list; read GMC-RM005 Kinetix 3 Drive Systems Design Guide and the Kinetix 3 user manual before teaching configuration"}, {"step": "TBD \u2014 motor selection step for Kinetix 3 (catalog number, feedback type, homing for incremental encoders)", "screen": "TBD", "parameter": "TBD", "value": "TBD", "source": "TBD \u2014 GMC-RM005 / Kinetix 3 user manual not yet read"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (TL-IN001).", "Use a torsionally rigid coupling or a reinforced timing belt \u2014 all connections between machine and motor shaft must be rigid to achieve acceptable system response (TL-IN001 p7).", "Verify axial and radial loads are within the Motor Load Force Ratings for 20,000 hours of bearing life (TL-IN001 p11; KNX-TD001A p154).", "Do not strike the shaft, key, couplings or pulleys with tools during installation or removal (TL-IN001) \u2014 impact damages bearings and the feedback device.", "Mount with the connector pointing downward and a drip loop in each cable; keep ambient 0-40 C with airflow (KNX-TD001A p162).", "If the absolute (B) encoder is fitted, confirm the battery-backed connector kit is installed or the axis will be single-turn only (KNX-TD001A p152).", "If the incremental (H) encoder is fitted, plan a homing move on every power-up \u2014 incremental feedback has no absolute position after power loss.", "Inspect shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months (KNX-TD001A p153). Shaft seal kits: TL-A1xx TL-SSN-1, TL-A2xx TL-SSN-2, TL-A25xx TL-SSN-3, TL-A4xx TL-SSN-4.", "Before first motion, confirm the brake (if fitted) releases with 24 V DC and that the axis is commanded to 0 rpm before the brake engages (KNX-TD001A p164)."], "tuning": "TBD \u2014 no tuning procedure was verified for TL/Kinetix 3 axes in this pass. MOTION-AT005 covers Kinetix 5300/5500/5700/6500 only and TL is not compatible with any of those drives. What is verified and still applies: Load Inertia Ratio is load inertia over motor inertia (Motion Analyzer manual), and TL rotor inertias are extremely small (0.000018 kg-m2 for TL-A220), so the load dominates and rigid mechanics matter more than gain tweaks. Read the Kinetix 3 user manual tuning chapter (and GMC-RM005) before teaching any TL tuning steps.", "faults": [{"code": "TBD \u2014 fault table not verified in the drive manual", "meaning": "TBD \u2014 TL axes run on Kinetix 3 drives; no Kinetix 3 fault-code table was read in this pass, so no fault code is taught for this family yet.", "fix": "TBD \u2014 confirm fault codes and fixes in the Kinetix 3 user manual before teaching (see tbd list)."}, {"code": "E04 (unverified \u2014 see tbd)", "meaning": "Motor Overtemperature (per secondary summary of Kinetix/Ultra3000 fault codes; Kinetix 3 fault set not confirmed).", "fix": "TBD \u2014 verify in the Kinetix 3 user manual before teaching."}, {"code": "E07 (unverified \u2014 see tbd)", "meaning": "Motor Feedback Loss (per secondary summary; Kinetix 3 fault set not confirmed).", "fix": "TBD \u2014 verify in the Kinetix 3 user manual before teaching."}], "manualUrl": "https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/tl-in003_-en-p.pdf?A294B0B9BE6499A2807587A47F9C9E61C073C4A9B8&ts=1778731798841", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/tl-in003_-en-p.pdf?A294B0B9BE6499A2807587A47F9C9E61C073C4A9B8&ts=1778731798841", "https://www.manualsdir.com/manuals/581264/rockwell-automation-tl-series-servo-motor.html?page=7", "https://oeelab.com/allen-bradley-kinetix-ultra3000-fault-codes"], "tbd": ["Configuration for TL is fully TBD: Kinetix 3 is configured in Connected Components Workbench, not Studio 5000 \u2014 read GMC-RM005 and the Kinetix 3 user manual before teaching any configuration steps.", "Tuning for TL is TBD (see tuning field) \u2014 read the Kinetix 3 user manual tuning chapter before teaching.", "Fault codes for TL are TBD: E04/E07 above come from a secondary summary of Kinetix/Ultra3000 codes, NOT from a Kinetix 3 manual \u2014 verify in the Kinetix 3 user manual before teaching; FLT Sxx codes do NOT apply to TL.", "Feedback discrepancy: KNX-TD001A p149 text says Bulletin TL motors have high-resolution absolute encoders only, but the p151 catalog chart lists H (2000-line incremental) and distributor listings show TL-A220P-HJ32AN with incremental feedback \u2014 confirm orderable TL feedback options in the current KNX-TD001 revision.", "TL catalog number TL-A220P-HJ32AN was verified on a distributor page (DO Supply) matching KNX-TD001A tables, not on a Rockwell product page opened in this pass \u2014 confirm on rockwellautomation.com before publishing.", "TL-IN001 (TL installation instructions, publication TL-IN001C-EN-P) was read only via a secondary mirror page (ManualsDir) \u2014 confirm mounting details in the Rockwell original before teaching."], "sourceFile": "servo-motors.json"}, {"id": "ab-tly", "category": "servo-motor", "family": "TL-Series TLY", "catalogNumbers": ["TLY-A130T-HJ64AA", "TLY-A2540P-HJ62AA"], "name": "TL-Series TLY Servo Motor", "whatItIs": "The TL-Series TLY is Allen-Bradley's compact, low-inertia brushless AC synchronous servo motor for small axes. It packs high torque density into metric and NEMA frame sizes (46 mm / NEMA 17 up to 100 mm) using high-energy Neodymium-Iron-Boron magnets, with 1 m cable extensions and circular plastic threaded connectors. The example motor TLY-A130T-HJ64AA is a 200 V, 46 mm frame, 6000 rpm motor with a 2000-line incremental encoder, shaft key, circular connectors and 24 V DC brake; TLY-A2540P-HJ62AA is a 90 mm / NEMA 34, 5000 rpm motor with the same incremental feedback and no brake.", "whenToUse": "Pick TLY for small, low-torque axes \u2014 robotics, X-Y tables, semiconductor and medical/lab equipment, light packaging and office machinery (KNX-TD001A p150) \u2014 where a VPL/MPL would be oversized and overpriced. Pick TL instead (same performance, rectangular connectors, absolute encoder only) when the drive is a Kinetix 3. Pick VPL/MPL instead when the axis needs more than 5.42 N\u00b7m continuous, 400 V windings, absolute multi-turn feedback without a battery, or a Kinetix 5500/5700 drive \u2014 TLY is NOT compatible with Kinetix 5500/5700 (KNX-TD001A p2).", "selection": "Size with FactoryTalk Motion Analyzer software (KNX-TD001: 'Use Motion Analyzer software to size and select motors'). Check: (1) continuous stall torque against RMS torque \u2014 TL-Series family range 0.086 to 5.42 N\u00b7m continuous stall, 0.22 to 13 N\u00b7m peak stall (KNX-TD001A p150); example TLY-A130 (non-brake): 0.325 N\u00b7m continuous, 0.76 N\u00b7m peak, 0.14 kW, 6000 rpm max (incremental version); TLY-A2540 (non-brake): 2.94 N\u00b7m continuous, 7.10 N\u00b7m peak, 0.86 kW, 5000 rpm rated. Note the brake version of the same motor is de-rated (TLY-A130 with brake: 0.293 N\u00b7m continuous, 0.13 kW) \u2014 always read the brake table, not the non-brake table. (2) Speed: 4500, 5000 and 6000 rpm rated speeds; the 6000 rpm rating applies only to TLY-AxxxT-H motors with incremental feedback \u2014 absolute-encoder versions are rated 5000 rpm (KNX-TD001A p154 note 3). (3) Inertia: rotor inertia is tiny (TLY-A130: 0.000003 kg-m2; TLY-A2540: 0.00011 kg-m2), so even a small load dominates \u2014 check Load Inertia Ratio. (4) Voltage: 200 V class only (A). (5) Frames: 46 mm/NEMA 17, 70 mm/NEMA 23, 90 mm/NEMA 34, 100 mm (TLY only). (6) Ambient 0-40 C; IP65 housing with optional shaft seal.", "wiring": {"power": "TLY motors have 1 m (39.4 in.) cable extensions with circular plastic threaded (M6) connectors (KNX-TD001A p152). Power-only cables: 2090-CPWM6DF-16AAxx (standard, non-flex); power-with-brake cables: 2090-CPBM6DF-16AAxx (standard, non-flex). Do not confuse with TL (rectangular connectors, 300 mm cables) or with MPL/VPL SpeedTec DIN cables \u2014 the connectors are different.", "feedback": "Two feedback choices (KNX-TD001A p151-152): B = multi-turn, 17-bit (131,072 counts/rev), absolute, battery-backed encoder, serial protocol \u2014 single-turn if used without battery backup; the drive needs the appropriate connector kit WITH battery for absolute position backup on power loss. H = 2000 lines/rev incremental encoder \u2014 industry-standard incremental feedback, applies to Bulletin TLY motors. Feedback cable: 2090-CFBM6DF-CBAAxx (standard, non-flex). The incremental (H) option has no absolute position after a power cycle \u2014 the axis must home on every power-up; the absolute (B) option holds position only while its battery is good.", "safety": "Safe Torque-Off lives in the drive, not the motor. The optional 24 V DC brake is a HOLDING brake only (KNX-TD001A p164): hold the shaft at 0 rpm up to the rated holding torque, not for stopping rotation, not a safety device. Stop by commanding the drive to decelerate to 0 rpm, then engage the brake. TLY has no SIL-rated encoder option.", "network": "The motor has no network port. TLY is compatible with Kinetix 6000, Kinetix 300/350, Kinetix 3, Kinetix 2000 and Ultra3000 drives (KNX-TD001A p150) \u2014 NOT with Kinetix 5500/5700. The drive connects to the Logix controller over EtherNet/IP Integrated Motion (300/350) or Sercos (6000/2000)."}, "configuration": [{"step": "TBD \u2014 confirm drive-specific configuration path for the exact TLY drive (Kinetix 3 uses Connected Components Workbench; Kinetix 300/350 uses Studio 5000 Logix Designer)", "screen": "TBD", "parameter": "TBD", "value": "TBD", "source": "TBD \u2014 see tbd list; GMC-RM005 Kinetix 3 Drive Systems Design Guide and 2093-UM001 not yet read"}, {"step": "Add the Kinetix drive as an Ethernet motion module (Kinetix 300/350 path)", "screen": "New Module dialog box", "parameter": "Electronic Keying", "value": "Compatible Module or Exact Match \u2014 never Disable Keying with motion modules", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Add the Kinetix drive as an Ethernet motion module (Kinetix 300/350 path)", "screen": "New Module dialog box", "parameter": "Connection", "value": "Motion", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create the axis for the drive", "screen": "Module Properties - Associated Axes tab", "parameter": "Data Type", "value": "AXIS_CIP_DRIVE (New Axis, Type Base)", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create a motion group and assign the axis", "screen": "Motion Group Properties - Attribute tab", "parameter": "Base Update Period", "value": "5 ms", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Axis Configuration / Feedback Configuration", "value": "Position Loop / Motor Feedback", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Select the motor so all motor data fills in automatically", "screen": "Axis Properties - Motor", "parameter": "Data Source / Motor Catalog Number", "value": "Data Source = Catalog Number; Motor Catalog Number = TLY-A130T-HJ64AA", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Load Type / Position Units per Motor Rev / Travel Mode", "value": "Direct Coupled Rotary / 1.0 Position Units per 1.0 Motor Rev / Unlimited", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (TL-IN003).", "Use a torsionally rigid coupling or a reinforced timing belt \u2014 all connections between machine and motor shaft must be rigid to achieve acceptable system response (TL-IN003 p6).", "Verify axial and radial loads are within the Motor Load Force Ratings for 20,000 hours of bearing life (TL-IN003 p17; KNX-TD001A p154).", "Do not strike the shaft, key, couplings or pulleys with tools during installation or removal (TL-IN003 p6) \u2014 impact damages bearings and the feedback device.", "Mount with the connector housing pointing downward and a drip loop in each cable; keep ambient 0-40 C with airflow (TL-Series practice, KNX-TD001A p162).", "If the absolute (B) encoder is fitted, confirm the battery-backed connector kit is installed or the axis will be single-turn only and will lose multi-turn position on power loss (KNX-TD001A p152).", "If the incremental (H) encoder is fitted, plan a homing move on every power-up \u2014 incremental feedback has no absolute position after power loss.", "Inspect shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months (KNX-TD001A p153). Shaft seal kits: TLY-A1xx TL-SSN-1, TLY-A2xx TL-SSN-2, TLY-A25xx TL-SSN-3, TLY-A3xx TL-SSN-4.", "Before first motion, confirm the brake (if fitted) releases with 24 V DC and that the axis is commanded to 0 rpm before the brake engages (KNX-TD001A p164)."], "tuning": "TBD \u2014 the Load Observer / autotune method in MOTION-AT005 is verified for Kinetix 5300, 5500, 5700 and 6500 drives, and TLY is not compatible with any of those drives, so the tuning procedure for TLY axes (Kinetix 3 / 300 / 350 / 2000 / 6000 / Ultra3000) was not verified in this pass and is marked TBD. What is verified and still applies: Load Inertia Ratio is load inertia over motor inertia (Motion Analyzer manual), and TLY rotor inertias are extremely small (0.000003 kg-m2 for TLY-A130), so the load almost always dominates the ratio and the mechanics \u2014 rigid coupling, no backlash, correct gearbox \u2014 matter more than gain tweaks. Do not teach a TLY autotune procedure until the Kinetix 300/350 user manual (2093-UM001) or Kinetix 6000 manual (2094-UM001) tuning chapter is read.", "faults": [{"code": "TBD \u2014 E-code fault table not verified in the drive manual", "meaning": "TBD \u2014 TL/TLY axes run on Kinetix 6000/2000/300/350/3 drives whose faults are E-codes, not the FLT Sxx codes of the 5500/5700; the E-code table was not read in 2094-UM001 / 2093-UM001 in this pass.", "fix": "TBD \u2014 confirm fault codes and fixes in the drive user manual for the exact drive before teaching (see tbd list)."}, {"code": "E04 (unverified \u2014 see tbd)", "meaning": "Motor Overtemperature (per secondary summary of Kinetix/Ultra3000 fault codes).", "fix": "TBD \u2014 verify in 2094-UM001 before teaching; expected checks: operate within continuous torque, reduce ambient, check heatsink/airflow."}, {"code": "E07 (unverified \u2014 see tbd)", "meaning": "Motor Feedback Loss / Feedback lost (per secondary summary of Kinetix/Ultra3000 fault codes).", "fix": "TBD \u2014 verify in 2094-UM001 before teaching; expected checks: feedback cable and connector, shields, grounding."}, {"code": "E22 (unverified \u2014 see tbd)", "meaning": "Motor Thermal Protection / overload fault (per secondary summary).", "fix": "TBD \u2014 verify in 2094-UM001 before teaching; expected checks: reduce speed or dwell in the command profile, check continuous torque."}], "manualUrl": "https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/tl-in003_-en-p.pdf?A294B0B9BE6499A2807587A47F9C9E61C073C4A9B8&ts=1778731798841", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://aut-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/tl-in003_-en-p.pdf?A294B0B9BE6499A2807587A47F9C9E61C073C4A9B8&ts=1778731798841", "https://www.rockwellautomation.com/en-nl/docs/studio-5000-logix-designer/37-00/contents-ditamap/quick-start-steps/configuring-an-ethernet-motion-system.html", "https://www.manualsdir.com/manuals/581096/rockwell-automation-tly-series-servo-motor.html?page=6", "https://oeelab.com/allen-bradley-kinetix-ultra3000-fault-codes"], "tbd": ["Configuration steps for TLY are PARTLY TBD: the Studio 5000 steps listed are verified only for the generic Ethernet-motion (Kinetix 300/350) path; the Kinetix 3 path (Connected Components Workbench) and the exact Axis Properties screens for Kinetix 2000/6000 (Sercos) were not read \u2014 confirm in GMC-RM005 / 2093-UM001 / 2094-UM001.", "Tuning for TLY is TBD (see tuning field): MOTION-AT005 covers 5300/5500/5700/6500 only; read the tuning chapter of the drive manual for the exact TLY drive before teaching.", "Fault codes for TLY are TBD: E04/E07/E22 above come from a secondary summary (OEE Lab) of Kinetix/Ultra3000 fault codes, NOT from a drive manual read in this pass \u2014 verify each code, meaning and fix in 2094-UM001 (Kinetix 6000) or 2093-UM001 (Kinetix 300/350) before teaching.", "TLY catalog numbers were verified on distributor pages (Automation Stop / DO Supply) matching KNX-TD001A tables, not on a Rockwell product page opened in this pass \u2014 confirm on rockwellautomation.com before publishing.", "FLT Sxx codes (Kinetix 5500/5700) do NOT apply to TLY \u2014 do not teach them for this family."], "sourceFile": "servo-motors.json"}, {"id": "ab-100-c", "category": "starter", "family": "Bulletin 100-C", "catalogNumbers": ["100-C09D10", "100-C23D10"], "name": "Bulletin 100-C IEC Contactor", "whatItIs": "The Bulletin 100-C is Rockwell's IEC power contactor family: an electromagnetically operated switch with three main power poles (plus an optional fourth pole) that makes and breaks motor current on command from its coil. It is the switching heart of a direct-on-line starter and of the bypass/isolation position in soft-starter panels. It mounts on a 35 mm DIN rail or a panel, and takes front- or side-mounted auxiliary contacts, timers and surge suppressors.", "whenToUse": "Use a 100-C wherever a motor (or other load) must be switched on and off electrically - DOL starters, reversing starters (104-C, two contactors with a mechanical interlock), star-delta, and as the isolation/bypass contactor in an SMC panel. Use a 100-E instead above 97 A AC-3 (100-E goes to 2650 A). Use a safety contactor (100S-C) where mirror/m mechanically linked auxiliary contacts are needed for a safety circuit.", "selection": "Select by AC-3 motor duty current and Hp/kW, not by AC-1 (resistive) current. Range 9...97 A AC-3 (9, 12, 16, 23, 30, 37, 43, 60, 72, 85, 97 A); 4...55 kW / 5...75 Hp. Examples from 100-TD013: 100-C09 = 9 A AC-3 / 32 A AC-1, 4 kW at 400V, 2 Hp at 230V 3-phase, 5 Hp at 460V, 7.5 Hp at 575V; 100-C23 = 23 A AC-3, 11 kW at 400V, 15 Hp at 460V; 100-C97 = 97 A AC-3, 55 kW at 400V, 75 Hp at 460V. The catalog number is incomplete until you add the coil code and the auxiliary suffix: 100-C09*10, where * is the coil code and 10 means 1 N.O. auxiliary (01 = 1 N.C., 00 = none).", "wiring": {"power": "Main poles: line 1/3/5 (L1/L2/L3), load 2/4/6 (T1/T2/T3). Screw terminals, IP20 finger-safe. Coil terminals are reversible - line side or load side - by turning the coil assembly (see 100-TD013 coil terminal position). For a reversing pair (104-C), add the mechanical interlock and wire the two contactors so only one can close; electrical interlocking through the N.C. aux contacts is also required.", "feedback": "Built-in auxiliary: 1 N.O. (-10) or 1 N.C. (-01); the N.C. aux on the -01 meets mechanically-linked performance per IEC 60947-5-1 Annex L, and on the 100-C97 the N.C. meets mirror-contact performance per IEC 60947-4-1 Annex F. Add front-mounted 2- or 4-pole aux blocks or side-mounted 1-, 2- or 4-pole blocks; on the 100-C09...C23 frame, aux blocks mount on the left side only (double-numbering on the right). Aux contacts are the feedback to the PLC/E300 (contactor state) and the hold-in/seal-in path in 3-wire control.", "safety": "The contactor is not an isolator: its main poles are open when the coil is de-energised, but the line terminals stay live, so isolate upstream (140M or disconnect) before working on the load side. A contactor that welds closed will not drop out on coil de-energisation - that is why the starter needs short-circuit protection (140M) and overload protection (E300) upstream/downstream, and why safety circuits use mirror contacts. Fit a surge suppressor (RC snubber/varistor) across the coil where the manual calls for it to protect the driving output.", "network": "TBD - the 100-C itself has no network port; in a smart starter the contactor is driven by the E300 control relay or a PLC output, and its state is read back through aux contacts. Network control of the starter lives in the E300 (EtherNet/IP) or the SMC, not in the contactor. See tbd."}, "configuration": [{"step": "Pick the frame by AC-3 current and Hp at the supply voltage", "screen": "Product Selection table, Publication 100-TD013", "parameter": "AC-3 Ie and Hp/kW", "value": "e.g. 5 Hp at 460V 3-phase = 100-C09 (9 A AC-3); 15 Hp at 460V = 100-C23 (23 A AC-3); 75 Hp at 460V = 100-C97 (97 A AC-3)", "source": "Rockwell Publication 100-TD013K-EN-P, Product Selection"}, {"step": "Add the coil voltage code to complete the catalog number", "screen": "Coil Voltage Codes table, 100-TD013 p.19", "parameter": "Coil code (inserted before the aux suffix)", "value": "D = 110V 50 Hz / 120V 60 Hz (example: 100-C0910 becomes 100-C09D10). A = 220V 50 Hz / 240V 60 Hz. KJ = 24V AC 50/60 Hz. EJ = 24V DC electronic with integrated diode (C09...C55). DJ = 24V DC with integrated diode (C60...C97)", "source": "Rockwell Publication 100-TD013K-EN-P, Coil Voltage Codes"}, {"step": "Choose the built-in auxiliary: 1 N.O., 1 N.C. or none", "screen": "Catalog suffix", "parameter": "Aux suffix 10 / 01 / 00", "value": "10 = 1 N.O., 01 = 1 N.C. (mechanically linked), 00 = no built-in aux. Example: 100-C09D10 = 120V AC coil, 1 N.O. aux", "source": "Rockwell Publication 100-TD013K-EN-P, Product Selection"}, {"step": "Mount on 35 mm DIN rail or panel, and set the coil terminal position", "screen": "Hardware", "parameter": "Mounting; coil terminal position (line side = standard, load side = U suffix)", "value": "DIN rail or panel mount; reversible coil terminations (line or load side) - suffix U for load-side coil connection on some variants", "source": "Rockwell Publication 100-TD013K-EN-P, Product Line Overview"}, {"step": "Wire the coil through the E300 trip relay / overload N.C. contact so an overload trip drops the contactor out", "screen": "Starter control wiring (E300 Ch. 2 / 190E starter diagrams)", "parameter": "Control circuit: Start/Stop, E300 trip relay in series with the coil", "value": "3-wire control: Start (N.O.) seals in through the contactor N.O. aux; Stop (N.C.) and the overload trip contact break the coil circuit. The E300 must have Overload Trip enabled in TripEnableI (Parameter 183) for the trip relay to open", "source": "E300 User Manual 193-UM015E-EN-P Ch. 2 Control Circuits; 100-TD013"}], "commissioning": ["Confirm the catalog number: frame, coil code and aux suffix match the panel schedule and the control voltage actually present.", "Energise the coil and confirm the contactor pulls in cleanly (single clunk, no chatter) and all three main poles close; check the aux contact changes state.", "Measure the coil voltage at the coil terminals under load; a coil fed below its rating will chatter and burn out.", "Start the motor DOL and check the contactor does not drop out on the starting dip; confirm the E300/overload does not trip on a healthy start.", "Confirm the contactor drops out when Stop is pressed, when the overload trips, and when control power is removed."], "tuning": "A contactor has no ramp to tune, but two ratings decide whether it survives: AC-3 (switching a running motor, making and breaking starting current) and AC-1 (resistive, no inrush). Always size on AC-3 for motors; the AC-1 number is much higher and will mislead you. AC-4 (plugging / inching a motor) is the hardest duty and de-rates the contactor sharply - check the AC-4 table in 100-TD013 before using a 100-C for jogging. If the contactor chatters, the coil voltage is low or the coil is the wrong code; if the poles weld, the short-circuit device did not clear the fault or the contactor is undersized for the starting current.", "faults": [{"code": "Contactor chatters / buzzes", "meaning": "Coil voltage too low, wrong coil code, or a loose coil connection", "fix": "Measure the voltage at the coil terminals; confirm the coil code matches the supply (e.g. D = 120V 60 Hz); tighten connections; check for a voltage dip on start."}, {"code": "Contactor will not pull in", "meaning": "No coil voltage, open control circuit (Stop, overload trip contact open, or E300 trip latched), or a failed coil", "fix": "Trace the control circuit with a meter; check the overload/E300 trip state and reset it; check coil continuity and replace the coil/contactor if open."}, {"code": "Contactor welds / will not drop out", "meaning": "Main poles welded by a short circuit or by breaking a current above the AC-3 rating", "fix": "Isolate upstream, replace the contactor; find the short or the overload that caused the weld; confirm the 140M/MCP coordination rating (Type 2) for the combination."}, {"code": "Overheating / burnt poles", "meaning": "Loose power terminals, undersized contactor for the duty (AC-4 jogging), or a single-phased motor drawing excess current", "fix": "Torque power terminals to the manual value; re-size on AC-3/AC-4 for the real duty; check all three phases and the overload setting."}], "manualUrl": "https://files.kempstoncontrols.com/files/8ce78e3bca34fa45378a5a921d189111/100-C85D00.pdf", "sources": ["https://files.kempstoncontrols.com/files/8ce78e3bca34fa45378a5a921d189111/100-C85D00.pdf", "https://www.artisantg.com/info/allen_bradley_100_c16d10_manual_2016121144135.pdf"], "tbd": ["100-C power-terminal torque and wire-size table by frame - the Product Selection table was read; the torque table in 100-TD013 Specifications was not extracted in this pass; confirm before teaching terminal torques.", "100-C electrical/mechanical life curves (Life-Load Curves in 100-TD013) - not extracted; confirm the operations-at-current figures before teaching life expectancy.", "100-C surge-suppressor catalog numbers (100-FSC etc.) - mentioned as accessories in 100-TD013 but the exact numbers were not verified in the text read."], "subcategory": "contactor", "sourceFile": "starters.json"}, {"id": "ab-140m", "category": "starter", "family": "Bulletin 140M", "catalogNumbers": ["140M-C2E-A63", "140M-C2N-B16", "140M-D8N-B40", "140M-F8E-C45"], "name": "Bulletin 140M Motor Protection Circuit Breaker", "whatItIs": "The Bulletin 140M is a motor protection circuit breaker (MPCB): one device that gives a motor branch circuit short-circuit protection (magnetic trip) and overload protection (adjustable thermal trip, Trip Class 10) plus manual switching and isolation. It is the front end of a starter: 140M on the line side, then a contactor (100-C) and an overload relay (E300) or a soft starter downstream.", "whenToUse": "Use a 140M (E-type, adjustable thermal + fixed magnetic) as the branch-circuit device in a 2-component starter (140M + contactor) or as the short-circuit device in a 3-component starter. Use the magnetic-only 140M-N motor circuit protector (MCP) instead when a separate overload relay (E300) will do the thermal protection - that is the 140M + 100-C + E300 combination in the Rockwell coordination tables. Do not use a 140M as a general molded-case breaker: it is not a UL 489 breaker.", "selection": "Frames (Publication 140M-TD002): C-Frame 0.1...32 A, D-Frame 1.6...32 A, F-Frame 6.3...45 A, CMN-Frame 16...90 A (with 140-CMN). Pick the current range that contains the motor FLC, then the interrupting rating: 2 = Normal Break, 8 = High Break. Protection type: E = adjustable thermal / fixed magnetic at 13 x In; T = adjustable thermal / fixed magnetic at 16...20 x In (high inrush motors); N = magnetic-only MCP. Example decode: 140M-C2E-A63 = C-frame, normal break, E-type, 0.63 A range. NOTE: Rockwell discontinued the 140M on 31 March 2025; the engineering replacement family is 140MT (see tbd).", "wiring": {"power": "Line in at L1/L2/L3 (top), load out at T1/T2/T3 (bottom) to the contactor or starter. Use 75 C copper wire only. For the F-frame: 1 x 4...50 mm2 (No. 12...1/0 AWG), torque 5...6 N-m (45...54 lb-in). For 1- or 2-phase motor applications, loop the unused pole per the wiring diagram in the installation sheet so all three thermal elements see current.", "feedback": "Front-mounted auxiliary contacts: 140M-C-AFA10 (1 N.O., 13-14) or 140M-C-AFA01 (1 N.C., 11-12); trip contacts 140M-C-AFAR10A10 signal a trip (short-circuit and overload, 27-28). Right-side auxiliaries 140M-C-ASA20 / ASA02 add 9 mm width. Undervoltage trip (140M-C-UXD for 110V 50 Hz / 120V 60 Hz) trips the breaker when voltage falls below 35...70%; shunt trip 140M-C-SNJ (24V) trips it on command - both mount on the left and add 18 mm.", "safety": "Do not set the current dial outside its marked scale. The 140M-F*N and KTB7-45H magnetic-only variants provide NO thermal protection for themselves or downstream components - a separate overload relay must be installed as part of the starter combination. The device meets IEC 60947-2 as a circuit breaker and is cULus listed as a Manual Motor Controller and, with the Type E adapter, as a Manual Self-Protected Combination Motor Controller; it does not meet UL 489 for molded-case breakers in North America.", "network": "TBD - the 140M is a purely electromechanical device with no network port; status comes only from its auxiliary/trip contacts wired into the control circuit or an input module. See tbd."}, "configuration": [{"step": "Select the frame and current range so the motor FLC falls inside the dial range", "screen": "140M current dial / catalog decode (140M-TD002)", "parameter": "Current range code (e.g. A63 = 0.63 A, C25 = 25 A, C45 = 45 A)", "value": "C 0.1...32 A; D 1.6...32 A; F 6.3...45 A; CMN 16...90 A", "source": "Rockwell Publication 140M-TD002B/G-EN-P"}, {"step": "Set the overload (thermal) dial to the motor current", "screen": "Front rotary dial", "parameter": "Overload release current setting", "value": "Set to 105% of motor current (installation sheet instruction); never set outside the marked scale", "source": "140M-F Motor Protection Circuit Breaker installation sheet (41053/21.303.910-01)"}, {"step": "Choose the magnetic trip type for the load", "screen": "Catalog number, protection-type code", "parameter": "Protection type E / T / N", "value": "E: fixed magnetic 13 x In (standard). T: fixed 16...20 x In (high-inrush / high-efficiency motors). N: magnetic-only MCP - use only with a separate overload relay (E300)", "source": "Rockwell Publication 140M-TD002B-EN-P"}, {"step": "Fit the Type E adapter and accessories for a self-protected combination starter", "screen": "Hardware: 140M-C-TE1 Type E adapter, aux/trip contacts", "parameter": "140M-C-TE1 adapter; 140M-C-AFA10/AFA01 aux; 140M-C-AFAR trip contact", "value": "Type E listing needs the adapter and the correct spacing; a Type F combination is a Type E 140M plus a contactor (100-C) or SMC, both tested together", "source": "Rockwell Publication 140M-TD002B-EN-P, Type E / Type F section"}, {"step": "Coordinate the downstream starter from the Rockwell short-circuit coordination tables", "screen": "Coordination table SCCR-16342E (or 190-TD004)", "parameter": "140M + 100-C + E300 combination, Type 2 coordination", "value": "Example at 460V, 65 kA: 5 Hp motor (7.6 A) = 140M-D8N-C10 (130 A magnetic) + 100-C09 + 193-ESM-*-30A-C23; 15 Hp (21 A) = 140M-D8N-C16 + 100-C16 + 193-ESM-*-30A-C23", "source": "Rockwell Short-Circuit Coordination SCCR-16342E (3C starter, MCP + contactor + OLR, Type 2, 65 kA at 480V)"}], "commissioning": ["Confirm the dial setting (105% of motor current) and that the range code matches the motor FLC.", "Operate the handle OFF/ON and confirm the motor starts and stops; confirm the handle shows TRIPPED distinctly from OFF after a trip.", "Test the trip function only as the manual allows (do not defeat the thermal element); confirm an overload trip opens the starter and the trip contact (if fitted) signals.", "Confirm aux/trip contacts switch as expected (N.O. aux closed when ON, trip contact closed only when tripped).", "Record the coordination combination (140M + contactor + overload catalog numbers) on the panel schedule so a like-for-like replacement keeps the Type 2 rating."], "tuning": "There is no ramp to tune on a 140M. The only adjustments are the thermal dial (105% of motor current) and the choice of magnetic trip (E 13x, T 16-20x, N magnetic-only). If the breaker trips on motor start, the magnetic trip is too low for the inrush - step from E to T, or check for a genuine short. If it trips on running overload, check the real load current against the dial, not the dial against the load: a dial set below the true FLC will nuisance-trip, and a dial set above it will not protect the motor. Trip Class is fixed at 10 on the 140M.", "faults": [{"code": "Overload trip (thermal)", "meaning": "Motor current above the dial setting long enough for the Class 10 thermal element to trip", "fix": "Check the real load and current draw; confirm the dial is 105% of motor current and the range is correct; let the thermal element cool, then reset by moving the handle to OFF and back to ON."}, {"code": "Short-circuit trip (magnetic)", "meaning": "Instantaneous magnetic trip at 13 x In (E) or 16...20 x In (T) - a short circuit or a very high inrush", "fix": "Do not just reset: find and clear the short (motor, cable, starter) and megger the motor; if it trips only on start with no fault found, consider the T (high magnetic) variant for a high-inrush motor."}, {"code": "Undervoltage trip (if UX fitted)", "meaning": "Supply voltage fell below 35...70% and the undervoltage release tripped the breaker", "fix": "Restore the supply voltage; check for a loose supply or a failing control transformer; the breaker must be manually re-closed."}, {"code": "Nuisance trip on start", "meaning": "Magnetic trip set too low for the motor inrush, or the thermal dial set below the true FLC", "fix": "Verify the motor FLC and inrush; move from E to T magnetic trip if the motor is high-inrush/high-efficiency; re-set the thermal dial to 105% of motor current."}], "manualUrl": "https://media.distributordatasolutions.com/Rockwell/files/File_140M_Motor_Protection_Circuit_Breakers_140M-TD002_EN_1.pdf", "sources": ["https://media.distributordatasolutions.com/Rockwell/files/File_140M_Motor_Protection_Circuit_Breakers_140M-TD002_EN_1.pdf", "https://www.manualshelf.com/manual/rockwell-automation/140m-f-motor-protection-circuit-breaker/owner-manual-english/page-2.html", "https://configurator.rockwellautomation.com/api/doc/SCCR-16342E.pdf", "https://www.rockwellautomation.com/en-us/products/details.140M-F8E-C45-GD-KY-RQ-TE.html"], "tbd": ["140M successor: Rockwell discontinued the 140M on 31 March 2025 (product pages read) and points to 140MT as the engineering replacement; the 140MT catalog decode and coordination tables were not covered in this pass - confirm in Publication 140-TD005 before teaching 140MT as the current buy.", "140M installation instructions publication number (140M-IN001 or similar) - the sheet read was the 140M-F owner/installation sheet; confirm the C/D-frame sheet number.", "140M exact torque and wire sizes for C- and D-frames - only the F-frame values (4...50 mm2, 5...6 N-m) were read; confirm C/D values in 140M-TD002."], "subcategory": "protection", "sourceFile": "starters.json"}, {"id": "ab-e300", "category": "starter", "family": "E300", "catalogNumbers": ["193-ESM-VIG-30A-C23", "193-ESM-IG-60A-C55", "193-ESM-IG-100A-C97", "193-ECM-ETR"], "name": "E300 Electronic Overload Relay", "whatItIs": "The E300 (Bulletin 193/592) is a microprocessor electronic overload relay that protects 3-phase or single-phase AC induction motors rated 0.5...65,000 A. It is modular: a sensing module (current, and optionally ground-fault and voltage/power), a control module, a communication module, plus optional digital/analog expansion I/O, an operator station and an expansion-bus power supply. It replaces a bimetallic overload with a thermal model, metering, diagnostics and network control in one device.", "whenToUse": "Use the E300 as the overload in a 3-component starter (140M magnetic-only MCP + 100-C contactor + E300) or in a DOL/reversing starter where you want more than a bimetallic strip: adjustable trip class 5...30, jam/stall/underload/imbalance/ground-fault/power protection, metering, and EtherNet/IP or DeviceNet control and diagnostics. Use a 140M-E (with its own thermal trip) instead for a simple 2-component starter with no network need; use the SMC Flex/50 built-in overload when the starter already has one and a separate relay would be redundant.", "selection": "Select the sensing module by motor FLC: 0.5...30 A (193-ESM-*-30A), 6...60 A (60A), 10...100 A (100A), 20...200 A (200A); above 200 A use external current transformers, to 65,000 A. Match the sensing module to the contactor: 30A modules pair with 100-C09...C23, 60A with 100-C30...C55, 100A with 100-C60...C97, 200A with 100-E (per the E300 manual starter-assembly tables and the SCCR coordination tables). Sensing types: VIG = current + ground-fault current, IG = current + ground fault, P = current + voltage/power. Communication module 193-ECM-ETR is the EtherNet/IP module.", "wiring": {"power": "The sensing module sits in the motor power circuit: motor conductors pass through it (or through external CTs above 200 A). Starter assembly: the E300 mounts directly to a 100-C09...C55 contactor (or 100-C60...C97 with the larger adapter) - see E300 Manual Ch. 2, Starter Assembly Installation. Short-circuit ratings and fuse coordination are in Ch. 2; the E300 is not a short-circuit device and must sit behind a 140M/MCP or fuses.", "feedback": "Outputs: the control module has relay outputs configurable as Trip Relay (opens on trip), Control Relay, Trip Alarm, Warning Alarm and Normal Relay; the Protection Fault State of each output is set by Parameters 304/305 (Relay 0), 310/311 (Relay 1), 316/317 (Relay 2) and 322...342 (expansion outputs). Diagnostics: TRIP/WARN LED blink patterns (e.g. an under-kVA trip flashes red 2-long / 7-short), Device Status 0 (Parameter 20) bits, and trip/warning status parameters. The optional operator station (diagnostic station) displays and edits parameters on the panel door.", "safety": "Install, adjust and maintain only as trained personnel per the manual and local codes; if the equipment is used in a manner not specified, the protection may be impaired. The E300 thermal memory is nonvolatile with a time constant equivalent to Trip Class 20: after a power loss the thermal memory decays as a Class 20 motor cools, and on re-power the relay reads the thermal-memory circuit to set % Thermal Capacity Utilized (Parameter 1) - so a hot motor is still protected after a power cycle. Never bypass the trip relay to keep a tripping motor running.", "network": "EtherNet/IP via the 193-ECM-ETR communication module (also DeviceNet and other comms modules in the family). The E300 appears in the Logix I/O tree through its Add-On Profile; a hardware mismatch (e.g. a 30 A sensing module fitted where a 60 A was expected) shows as flashing Power/MS/NS LEDs. Enable Option Match Protection Trip (Parameter 186) to trip on a module mismatch. Parameters 23...25 identify the fitted modules; Parameter 38/39 report a mismatch."}, "configuration": [{"step": "Assemble the base relay: sensing module to control module to communication module, then expansion bus peripherals", "screen": "Hardware assembly, E300 Manual Ch. 2", "parameter": "Module assembly order", "value": "Sensing module + control module + communication module; expansion digital/analog I/O and operator station on the expansion bus; expansion-bus power supply if needed", "source": "E300 User Manual 193-UM015E-EN-P Ch. 2 Base Relay Assembly"}, {"step": "Mount the E300 to the contactor as a starter assembly", "screen": "Hardware, Ch. 2 Starter Assembly", "parameter": "Starter assembly", "value": "100-C09...C55 starter assembly (Ch. 2 p.34); 100-C60...C97 (p.35); 100-D115...D180 (p.36)", "source": "E300 User Manual 193-UM015E-EN-P Ch. 2"}, {"step": "Enter the motor full-load current - this is the single most important setting", "screen": "Diagnostic station / Parameters", "parameter": "Parameter 171 FLA", "value": "Set to the motor nameplate FLC; FLA and Trip Class are the two parameters that drive the thermal capacity (overload) algorithm. A second FLA (Parameter 177 FLA2) is available for two-speed / dual-motor setups", "source": "E300 User Manual 193-UM015E-EN-P Ch. 6 (Table 227)"}, {"step": "Set the trip class", "screen": "Diagnostic station / Parameters", "parameter": "Parameter 172 Trip Class", "value": "Adjustable 5...30, default 10. Trip class is the maximum time (in seconds) for the relay to trip at 6x rated current; standard classes 5, 10, 20, 30 have published time-current curves (Figure 210)", "source": "E300 User Manual 193-UM015E-EN-P Ch. 6 (Table 229, Figure 210)"}, {"step": "Enable the overload trip (and the other trips you need)", "screen": "Diagnostic station / Parameters", "parameter": "Parameter 183 TripEnableI (current-based trips incl. Overload Trip); Parameter 186 TripEnableC / Control Trip Enable", "value": "Overload Trip must be enabled in TripEnableI (Parameter 183) or the relay will not trip the contactor on overload. Enable Option Match Trip in Parameter 186 bit 8 to trip on a module mismatch", "source": "E300 User Manual 193-UM015E-EN-P Ch. 4/6 (control-circuit notes repeat this on every starter diagram)"}, {"step": "Set jam, stall and underload levels to suit the load", "screen": "Diagnostic station / Parameters", "parameter": "Parameter 250 Stall Trip Level; Parameter 254 Jam Warn Level; Parameter 258 Underload Warning Level; Parameters 282/283 L3 Over Current Trip Delay/Level", "value": "Stall 100...600% of FLA (Parameter 171); Jam warning 50...600% FLA; Underload warning 10...100% FLA; L3 Over Current Trip Level 10...100% FLA with delay 0.1...25.0 s (Parameter 282)", "source": "E300 User Manual 193-UM015E-EN-P Ch. 5/6"}], "commissioning": ["Confirm the sensing-module range covers the motor FLC and matches the contactor frame (30A/60A/100A/200A as above).", "Confirm FLA (Parameter 171) and Trip Class (Parameter 172) are entered; the relay is in Invalid Configuration mode until its configuration is valid.", "Check the device mode: Administration (configuring), Ready (ready to run), Run (running), Test (test mode). Do not leave it in Test or Invalid Configuration.", "Run the motor and check metering (current per phase, % Thermal Capacity Utilized Parameter 1) against a clamp meter.", "Prove the trip path: a test trip (or the diagnostic station test) must open the Trip Relay and drop the contactor out; confirm the TRIP/WARN LED and Device Status 0 (Parameter 20) report the trip.", "Confirm network health: Power/MS/NS LEDs solid green when scanned; flashing green MS/NS means no connection or a module mismatch - check the I/O tree, the Add-On Profile, Parameters 23...25 and Parameter 186."], "tuning": "The thermal model is set by FLA (Parameter 171) and Trip Class (Parameter 172): Class 10 is the default and suits most motors; Class 5 trips faster for a motor that cannot take a long start; Class 20/30 allow long, heavy starts (large fans, crushers). The nonvolatile thermal memory (Class 20 time constant) means the relay remembers heat across a power cycle - do not defeat it. Jam (current above a level for a time) catches a blocked load; Stall (locked-rotor current, 100...600% FLA) catches a motor that never gets up to speed; Underload (10...100% FLA) catches a broken belt, a dry pump or a snapped shaft. Each has an inhibit time that holds the protection off during the start, so the start itself does not false-trip. Set warning levels first, watch them in normal running, then set trip levels above the normal running envelope.", "faults": [{"code": "Overload trip", "meaning": "Thermal capacity utilised reached 100% - the motor ran above FLA long enough for the Class 5...30 curve to trip", "fix": "Check the real load and current; confirm FLA (Parameter 171) and Trip Class (Parameter 172) match the motor; check for a hot motor, blocked ventilation or a dragging load; let the thermal memory decay before restarting."}, {"code": "Jam trip", "meaning": "Current stayed above the jam level for the jam delay - a blocked or jammed load", "fix": "Clear the jam (conveyor, crusher, pump); check the jam level/delay against the normal running current."}, {"code": "Stall trip", "meaning": "Locked-rotor current (Parameter 250, 100...600% FLA) persisted - the motor never reached speed", "fix": "Check for a seized load, a single-phased supply, or a starting voltage too low; check the ramp if a soft starter is upstream."}, {"code": "Current imbalance trip", "meaning": "Phase currents are unbalanced beyond the programmed level - a lost phase, a bad connection or a winding fault", "fix": "Check all three phases, power and motor connections, and megger the motor; imbalance % = 100% x (Id/Ia) per the manual."}, {"code": "Ground-fault trip (VIG/IG sensing module)", "meaning": "Ground-fault current above the programmed level - insulation breakdown or foreign material in the motor", "fix": "Megger the motor and cable; do not re-start until the insulation fault is found; check the ground-fault level/delay settings."}, {"code": "MS/NS LEDs flashing green, Power LED flashing green", "meaning": "Device is Ready but not scanned / no EtherNet/IP connection, or a hardware (module) mismatch", "fix": "Verify the E300 is in the Logix I/O tree with the correct Add-On Profile for its firmware; check Parameters 23...25 match the fitted modules; check Parameters 38/39 for the mismatch; check Parameter 186 (option-match trip); check the network switch and cabling."}], "manualUrl": "https://che-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/193-um015_-en-p.pdf?A294B0768B6A5DA9BD75857AB16495A27DB582B5B69D&ts=1781064314721", "sources": ["https://che-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/193-um015_-en-p.pdf?A294B0768B6A5DA9BD75857AB16495A27DB582B5B69D&ts=1781064314721", "https://configurator.rockwellautomation.com/api/doc/SCCR-16342E.pdf"], "tbd": ["E300 communication-module catalog numbers beyond 193-ECM-ETR (DeviceNet 193-ECM-DNT etc.) - only the EtherNet/IP module number was verified in the sources read; confirm the DeviceNet/ControlNet numbers in 193-UM015 Ch. 1 before teaching them.", "E300 exact TRIP/WARN LED blink table for every trip (only the under-kVA red 2-long/7-short pattern was extracted) - confirm the full blink table in 193-UM015 Ch. 5/6 before teaching LED diagnosis as a complete list.", "E300 sensing-module current ranges for the 200 A module and external-CT ratios - the 200 A module (20...200 A) is in the coordination tables; the external-CT ratio parameter was not extracted; confirm in 193-UM015 Ch. 2 (Current Transformer Ratio)."], "subcategory": "protection", "sourceFile": "starters.json"}, {"id": "ab-smc-flex", "category": "starter", "family": "SMC Flex", "catalogNumbers": ["150-F108FBDB", "150-F361NBDB"], "name": "SMC Flex Soft Starter", "whatItIs": "The SMC Flex (Bulletin 150-F) is Rockwell's mid-range soft starter: a microprocessor controller with a built-in keypad and LCD (or optional 20-HIM LCD), internal bypass contactor, built-in electronic overload, metering, and DPI communication. It covers 5...1250 A and comes in Standard, Pump Control and Braking (SMB) options.", "whenToUse": "Pick SMC Flex over SMC-3 when you need a display and real setup (not DIP switches), metering, pump control to kill water hammer, Smart Motor Braking, dual ramp, preset slow speed, ground-fault or PTC protection, or control over DPI/DeviceNet/EtherNet/IP. Pick SMC-50 instead when you need torque control, linear speed accel/decel, energy saver, or the wider power/protection set (17 modes). Pick SMC-3 when the job is simple and a display is not wanted.", "selection": "Select by motor FLC; family range 5...1250 A (frames 5...85, 108...135, 201...251, 317...480, 625...780, 970...1250 A). Line voltage 200...480V, 200...600V or 230...690V depending on frame/option. Control power 100...240V AC or 24V AC/DC (5...480 A units, terminals 11/12); 625...1250 A units take 110/120V or 230/240V AC through terminal block CP1. The Motor Overload parameter must be programmed by the installer; overload protection is not automatic.", "wiring": {"power": "Line L1/L2/L3 to 1/3/5, motor T1/T2/T3 to 2/4/6 for line connection; inside-the-delta uses T4/T5/T6 as well (see Quick Start power-wiring diagrams: Line, Delta with isolation contactor, Delta with shorted-SCR protection). Power lug torque: 5...85 A, 11.3 N-m (100 lb-in); 108...135 A, 31 N-m (275 lb-in) wire-to-lug. Vertical mounting only, 15 cm (6 in.) vertical clearance, enclosure minimum IP23/NEMA 1, recommended IP54/NEMA 12, internal temperature -5...50 C.", "feedback": "Four auxiliary contacts: Aux #1 terminals 19/20, Aux #2 29/30, Aux #3 31/32, Aux #4 33/34; each configurable (Parameters 107, 110, 108, 109) as Normal, Up-to-Speed, Fault, Alarm, Network Control or External Bypass. PTC input terminals 23/24, tachometer 25/26, ground-fault transformer input 27/28. Metering (volts, current, kW, kWh, power factor, motor thermal usage) is on the HIM under Parameters / Monitoring / Metering.", "safety": "Hazardous voltage is present in the motor circuit even when the controller is off; disconnect main power before working on it. A failed SCR can cause a single-phase condition and overheating, so an isolation contactor or shunt-trip breaker on the line side capable of interrupting locked-rotor current is recommended. Stopping modes are not an emergency stop. Pump stopping may cause motor heating, so use the lowest stopping time that stops the pump satisfactorily. Slow speed is not for continuous running (reduced motor cooling). Disconnect the controller before Megger-testing the motor; never IR-test the controller itself.", "network": "DPI port: up to two peripheral devices, maximum 280 mA through the DPI port. Start/stop via DPI only is possible with an isolation contactor (K1); Parameter 87 Logic Mask selects the control source: 4 = HIM only, 32 = communication port only, 44 = all DPI ports. Communication adapters (DeviceNet, EtherNet/IP, ControlNet) plug into the DPI port; loss of DPI comms is Fault 27...32."}, "configuration": [{"step": "In the Basic Set Up group (Parameters menu, then Set Up), confirm SMC Option (Parameter 14) and Motor Connection (Parameter 15)", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 14 SMC Option; Parameter 15 Motor Connection", "value": "SMC Option is factory-set, read-only (Standard, Pump Control or Brake). Motor Connection: Line or Delta, default Line", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Enter the system line voltage", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 16 Line Voltage", "value": "0...10000 V, default 480", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Choose the starting mode", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 17 Starting Mode", "value": "Soft Start, Current Limit, Full Voltage, Linear Speed or Pump Control; default Soft Start", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Set the ramp time and initial torque (Soft Start) or current limit level (Current Limit)", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 18 Ramp Time; Parameter 19 Initial Torque; Parameter 20 Current Limit Level", "value": "Ramp 0...30 s, default 10 s; Initial Torque 0...90% LRT, default 70%; Current Limit 50...600% FLC, default 350%", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Set kickstart time and level if the load needs a breakaway pulse", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 22 Kickstart Time; Parameter 23 Kickstart Level", "value": "Time 0.0...2.0 s, default 0 (off); Level 0...90% LRT, default 0", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Set the stop mode and stop time, and the stop-input behaviour", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 32 Stop Mode; Parameter 33 Stop Time; Parameter 133 Stop Input; Parameter 132 Option Input 1; Parameter 24 Option Input 2", "value": "Stop Mode Soft Stop, Linear Speed, SMB, Accu-Stop or Pump Stop, default Soft Stop; Stop Time 0.0...120 s, default 0.0; Stop Input (terminal 18) Coast or Stop Option, default Coast", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Program motor protection: overload class, service factor, motor FLC and reset mode - this is mandatory, the overload does not protect until FLC is entered", "screen": "Parameters / Motor Protection", "parameter": "Parameter 44 Overload Class; Parameter 45 Service Factor; Parameter 46 Motor FLC; Parameter 47 OL Reset Mode", "value": "Class Disable, 10, 15, 20 or 30, default 10; Service Factor 0.01...1.99, default 1.15 (1.0 typical for IEC motors); Motor FLC 1.0...2200 A, default 1.0; Reset Auto or Manual, default Manual", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}], "commissioning": ["Verify input supply voltage and wiring; check output wiring; check control wiring (Quick Start Step 4 checklist, items 1-3).", "Apply control power (Step 4, item 4).", "Test local start/stop control (Step 4, item 5) in 2-wire or 3-wire control as wired, with the isolation contactor K1 if fitted.", "View metering: Main Menu / Parameters / Monitoring / Metering - confirm volts and current on all three phases and that motor thermal usage is sensible.", "View/clear faults: press Esc to acknowledge, then Main Menu / Diagnostics / Faults / View Fault Queue (or Parameters 124...128); correct the cause first, then clear by holding Esc 3 s, cycling control power, pressing Stop on an external HIM, or Diagnostics / Faults / Clear Fault.", "Confirm Aux contacts do what the wiring expects (e.g. Aux #1 Normal for hold-in, Aux #4 Up-to-Speed or Fault as programmed)."], "tuning": "Soft Start ramps voltage from the Initial Torque level (Parameter 19) to full voltage over the Ramp Time (Parameter 18); raise initial torque if the motor hesitates, lower it if it jerks. Current Limit holds current at Parameter 20 for the ramp time; use it where the supply is weak. Linear Speed ramps speed (not voltage) for a straight-line accel. Pump Control shapes the start and stop to reduce pressure surges and water hammer; for pump stop use the lowest stop time that stops the pump without hammer, because longer pump stops heat the motor. Soft Stop ramps voltage down over Stop Time (Parameter 33). Smart Motor Braking (SMB) brakes the load; Accu-Stop gives accurate stopping position. Dual Ramp (Option Input 2, terminal 15) selects between two Soft Start profiles. Starts Per Hour (Parameter 81) limits starts in one hour.", "faults": [{"code": "1, 2, 3", "meaning": "Line Fault (prestart) - missing supply phase", "fix": "Check for an open line (blown fuse), open load lead, or unstable incoming 3-phase voltage; verify power quality."}, {"code": "4, 5, 6", "meaning": "Shorted SCR (with phase indication)", "fix": "Check for a shorted SCR; replace the power module if necessary."}, {"code": "7, 8, 9", "meaning": "Open Gate (start or stop, with phase indication)", "fix": "Perform a resistance check; check gate-lead connections to the control module; replace the power module if necessary."}, {"code": "10, 11", "meaning": "PTC Power Pole and SCR Overtemp", "fix": "Check ventilation, duty cycle and fan; wait for the motor/controller to cool or provide external cooling; replace the power module or control module as needed."}, {"code": "13, 14, 15", "meaning": "Open Bypass (running, with phase indication)", "fix": "Check control-voltage supply; check control-module TB2...TB4 and TB5...TB7 are secure; check Aux 1-4 are not set to External Bypass; replace the power module if inoperable."}, {"code": "22", "meaning": "Overload (running) - motor overloaded or overload parameters do not match the motor", "fix": "Check the overload condition, verify overload class and motor FLC values, and verify actual current draw."}, {"code": "24 / 25", "meaning": "Jam (24) - current exceeded the programmed jam level; Stall (25) - motor did not reach full speed by the end of the ramp", "fix": "Correct the source of the jam/stall or excessive loading; check programmed jam/stall settings and adjust starting parameters to suit the load."}, {"code": "26", "meaning": "Phase Reversal (prestart only) - incoming supply is not in the expected ABC sequence", "fix": "Check power wiring and correct the phase sequence."}], "manualUrl": "https://lvmcc-pubs.rockwellautomation.com/pubs/150-QS001G-EN-P.pdf", "sources": ["https://lvmcc-pubs.rockwellautomation.com/pubs/150-QS001G-EN-P.pdf", "https://rexelcanada.a.bigcontent.io/v1/static/ALB150CD31JCD34RGA6P_1_P_PROD_SPEC_ALB150CD10JADCutSheeten1"], "tbd": ["SMC Flex full User Manual 150-UM008 fault-code table beyond the Quick Start abbreviated listing (Quick Start itself says: for a complete list refer to the User Manual).", "SMC Flex exact catalog-number decode for the 150-F frame (voltage/option codes) - the two catalog numbers listed are examples seen in Publication 150-SG009; confirm the full decode in 150-TD009.", "SMC Flex ground-fault level/delay parameter numbers (Parameters 72-78 in the full manual) - not in the Quick Start basic set; confirm in 150-UM008 Appendix B."], "sourceFile": "starters.json"}, {"id": "ab-smc-3", "category": "starter", "family": "SMC-3", "catalogNumbers": ["150-C135NBD", "150-C37NBD", "150-C60NBD"], "name": "SMC-3 Soft Starter", "whatItIs": "The SMC-3 (Bulletin 150-C) is a compact solid-state soft starter for 3-phase motors. It uses SCRs to ramp the motor voltage up and down, and it has a built-in electronic overload relay and an integral SCR bypass contactor on all three phases, so the SCRs are bypassed once the motor is up to speed and run cooler.", "whenToUse": "Pick the SMC-3 when the job is simple and cost matters: a pump, fan, conveyor or compressor that only needs soft start, current-limit start, kickstart, soft stop or coast-to-rest, set with DIP switches and one overload dial. Pick SMC Flex instead when you need a display, metering, pump control, braking, dual ramp, ground fault or network control; pick SMC-50 when you need torque/linear-speed control, 17 start/stop modes or advanced power protection.", "selection": "Select by motor full-load current (FLC), never by kW or Hp alone (Rockwell cautions kW ratings are based on a 350% current-limit value). Family range is 3...480 A in sizes 3, 9, 16, 19, 25, 30, 37, 43, 60, 85, 108, 135, 201, 251, 317, 361 and 480 A (Publication 150-TD007). Line voltage 200...460V AC or 200...600V AC, 50/60 Hz; control voltage code D = 100...240V AC, code R = 24V AC/DC (open type only). The 150-C135NBD seed unit is 135 A, 200...460V AC, 100...240V AC control.", "wiring": {"power": "Line L1/L2/L3 to terminals 1/3/5, motor T1/T2/T3 to terminals 2/4/6. Inside-the-delta connection uses terminals 8/T4, 10/T5, 12/T6 as well as 2/T1, 4/T2, 6/T3 (DIP switch 15 selects Line or Delta). Power terminals for the 43...85 A frame take 2.1...95 mm2 (No. 14...3/0 AWG) at 11.3 N-m (100 lb-in).", "feedback": "Aux #1 (terminals 13/14, 1 N.O. plus 1 N.C. on the 43...85 A label) is set by DIP switch 14 to Normal or Up-to-Speed. Fault contact 97/98 is 1 N.O. and changes state on a fault. A single RUN/FAULT LED flashes a code: 1 flash overload, 2 temperature, 3 phase reversal, 4 phase loss/open load, 5 phase imbalance, 6 shorted SCR.", "safety": "Disconnect main power before installing or servicing; hazardous voltage is present in the motor circuit even when the controller is off. Before connecting main power, apply control voltage first so the bypass relays settle to a defined state, or the motor may start inadvertently. The installation sheet recommends an isolation contactor or shunt-trip breaker on the line side capable of interrupting locked-rotor current, because a failed SCR can leave a single-phase condition. Stopping modes are not an emergency stop. Never Megger-test the controller; disconnect it from the motor before insulation-resistance testing.", "network": "TBD - the SMC-3 has no network/communication port documented in the installation sheet read; network control is a reason to step up to SMC Flex or SMC-50. See tbd."}, "configuration": [{"step": "Set the motor overload dial to the motor FLC, remembering the trip rating is 120% of the dial setting", "screen": "Overload dial on the front (label: Set Motor FLA)", "parameter": "Overload dial (no parameter number; dial)", "value": "Motor nameplate FLC; if service factor <1.15 use 0.9 x FLA, if >1.15 use 1 x FLA", "source": "SMC-3 Installation Instructions 41053-248-01 (DIR 42053-248 v06)"}, {"step": "Select the starting method: Soft Start or Current Limit Start with DIP switch 3", "screen": "DIP switches 3, 4, 5", "parameter": "DIP 3 = mode; DIP 4/5 = level", "value": "Soft Start: initial torque 15/25/35/65% LRT. Current Limit: 150/250/350/450% FLA", "source": "SMC-3 Installation Instructions 41053-248-01"}, {"step": "Set the start (ramp) time with DIP switches 1, 2 and 8", "screen": "DIP switches 1, 2, 8", "parameter": "Start Time t1", "value": "2, 5, 10, 15, 20, 25 or 30 s", "source": "SMC-3 Installation Instructions 41053-248-01"}, {"step": "Set kickstart with DIP switches 9 and 10 (kickstart current is fixed at 450% FLA)", "screen": "DIP switches 9, 10", "parameter": "Kickstart time t2", "value": "Off, 0.5, 1.0 or 1.5 s", "source": "SMC-3 Installation Instructions 41053-248-01"}, {"step": "Set soft stop with DIP switches 6 and 7, as a multiple of the start time", "screen": "DIP switches 6, 7", "parameter": "Soft Stop time t3", "value": "Off, 1x t1, 2x t1 or 3x t1", "source": "SMC-3 Installation Instructions 41053-248-01"}, {"step": "Set overload trip class with DIP switches 11 and 12, reset mode with DIP 13, Aux #1 with DIP 14, and Line/Delta with DIP 15", "screen": "DIP switches 11-15", "parameter": "Overload Class (DIP 11/12); Overload Reset (DIP 13); Aux #1 (DIP 14); Line/Delta (DIP 15)", "value": "Class 10, 15 or 20; Reset Auto (auto-reset below 75% thermal capacity) or Manual (push Reset/Test); Aux #1 Normal or Up-to-Speed; Line or Delta", "source": "SMC-3 Installation Instructions 41053-248-01"}], "commissioning": ["Verify input supply voltage and wiring, output wiring and control wiring before applying power (same Step 4 order as SMC Flex Quick Start).", "Apply control voltage BEFORE main power so the bypass relays settle to a defined state.", "Confirm DIP switches match the application and the overload dial matches motor FLC and service factor.", "Press and hold Reset/Test for 5 s to prove the manual trip: LED shows test state and fault contact 97/98 changes state; press again to return to operating mode.", "Start the motor and watch the ramp: it should reach full speed inside the set start time with no stall; check the RUN/FAULT LED is not flashing a fault code.", "Confirm the bypass has closed at full speed (motor runs at full voltage, SCRs out of circuit)."], "tuning": "Soft Start raises the motor from the set initial torque (15/25/35/65% of locked-rotor torque) to full voltage over the ramp time (2...30 s). Use Current Limit Start when the supply or breaker cannot take the inrush: it holds current at 150/250/350/450% FLA for the ramp time. Kickstart gives a short 450% FLA pulse (0.5...1.5 s) to break a sticky load free, then the normal ramp follows. Soft Stop ramps voltage down over 1x, 2x or 3x the start time to stop a pump gently; Coast-to-Rest simply removes voltage and lets the load spin down. If the motor stalls, lengthen the ramp or raise the initial torque/current limit; if it jerks, lower the initial torque.", "faults": [{"code": "LED 1 flash", "meaning": "Overload trip - motor thermal model exceeded (trip at 120% of dial setting)", "fix": "Check for a real overload, verify the overload dial and trip class match the motor, check actual current draw; reset with Reset/Test (Manual) or wait for auto-reset below 75% thermal capacity (Auto, DIP 13)."}, {"code": "LED 2 flashes", "meaning": "Temperature fault - controller/motor overtemperature", "fix": "Check ventilation and duty cycle, let the motor cool; reset by cycling control power."}, {"code": "LED 3 flashes", "meaning": "Phase reversal - incoming 3-phase sequence is not ABC (when enabled via DIP switch)", "fix": "Check and correct the incoming phase wiring; reset by cycling control power."}, {"code": "LED 4 flashes", "meaning": "Phase loss / open load", "fix": "Check for an open line or blown fuse and for open load leads; reset by cycling control power."}, {"code": "LED 5 flashes", "meaning": "Phase imbalance - imbalance between phase currents above the internal threshold", "fix": "Check the power system and motor connections for imbalance; reset by cycling control power."}, {"code": "LED 6 flashes", "meaning": "Shorted SCR", "fix": "Check for a shorted power module; replace the power module if necessary; reset by cycling control power."}], "manualUrl": "https://abmarketotomasyon.com/wp-content/uploads/2025/08/SMC-3-Installation-Manual.pdf", "sources": ["https://abmarketotomasyon.com/wp-content/uploads/2025/08/SMC-3-Installation-Manual.pdf", "https://abmarketotomasyon.com/wp-content/uploads/2021/03/150-TD007-EN-P.pdf", "https://lvmcc-pubs.rockwellautomation.com/cutsheets/150-C135NBD.pdf"], "tbd": ["SMC-3 network/communication capability: no comms port is shown in the installation sheet read; confirm from Publication 150-TD007/150-TD009 whether any SMC-3 variant offers DPI/DeviceNet.", "SMC-3 exact control-terminal list for the 3...37 A frame (IN1/IN2 functions) - the sheet read covers the 43...85 A Series B label; confirm terminal numbers for smaller frames in 150-IN044.", "SMC-3 enclosed/combination catalog numbers (152/153) - not covered in this pass."], "sourceFile": "starters.json"}, {"id": "ab-smc-50", "category": "starter", "family": "SMC-50", "catalogNumbers": ["150-SB1NUD"], "name": "SMC-50 Soft Starter", "whatItIs": "The SMC-50 (Bulletin 150-S) is Rockwell's top-end soft starter: a microprocessor smart motor controller with six back-to-back SCRs (two per phase) and a fully solid-state power structure with no integral bypass contactor, so the SCRs control the motor continuously. It offers 17 start/stop modes, built-in electronic overload, metering, DeviceLogix, and optional EtherNet/IP, DeviceNet or ControlNet.", "whenToUse": "Pick the SMC-50 for the hardest soft-start jobs: large pumps needing pump control and torque control, long conveyors, crushers and chillers, heavy starting duty, many starts per hour, or where you need linear-speed or torque ramps, energy saver, preset slow speed, Smart Motor Braking or Accu-Stop. Pick SMC Flex when a built-in bypass, a simpler 9-mode set and a lower price are enough; pick SMC-3 for simple DIP-switch jobs.", "selection": "Select by motor FLC. Family range 90...520 A solid-state (line) / up to 480 A in enclosed form; the 150-SB1NUD seed unit is 90 A line / 155 A inside-the-delta, 200...690V AC, 100...120V AC control. Because there is no bypass, check the continuous SCR rating and the enclosure heat dissipation; the manual gives enclosure sizing and heat-dissipation data. Automatic tuning of motor parameters is standard on the SMC-50 (not on SMC Flex).", "wiring": {"power": "Line-connected: L1/L2/L3 to the line lugs, motor to T1/T2/T3. Inside-the-delta: motor windings connect through the delta terminals (see User Manual Ch. 2, Delta Connected Motors); the controller rating rises inside delta (e.g. 90 A line = 155 A delta on the SB1NUD). Grounding provision is on the power structure; power lugs per the manual table. Do not fit power-factor correction capacitors on the load side without following the PFCC section (Ch. 2).", "feedback": "Two 24V DC inputs as standard: terminal 11 (In1, Parameter 56) is the START input, terminal 10 (In2, Parameter 57) is COAST / STOP OPTION. AC inputs are also available on the option port (A1 100...240V AC Coast/Stop, A2 100...240V AC Start). Auxiliary relay outputs are configurable for Normal, Fault, Alarm, Up-to-Speed and network control. A Push to Reset / Hold to Test button on the control module resets faults and proves a test trip. Metering covers RMS current and voltage per phase, frequency, unbalance, torque, real/reactive/apparent power and energy.", "safety": "Hazardous voltage is present in the motor circuit even when the controller is off; disconnect main power before servicing. The safety-label sheet states the unit is suitable for use on a circuit capable of delivering not more than 10,000 rms symmetrical amperes at 600 V max (line-connected) or 18,000 A (inside-the-delta). An isolation contactor or shunt-trip device is recommended on the line side. The ground-fault feature (with 150-SM2) is for monitoring only, not ground-fault circuit protection. Stopping modes are not an emergency stop.", "network": "Program with a Bulletin 20-HIM-A6 LCD, DriveExecutive/DriveExplorer, Connected Components Workbench, or the 150-SM6 Parameter Configuration Module; the SMC-50 ships with no configuration device. Option modules plug into three expansion ports: 150-SM2 (PTC, ground fault, external CT), 150-SM3 (analog I/O), 150-SM4 (digital I/O), 150-SM6 (parameter configuration). Communication option modules provide DeviceNet, EtherNet/IP or ControlNet; a loss of DPI comms faults the unit."}, "configuration": [{"step": "Set the motor connection and line voltage", "screen": "HIM / Parameters - Motor Configuration", "parameter": "Parameter 44 Motor Connection; Parameter 46 Line Voltage", "value": "Motor Connection Line or Delta (also auto-detected during tuning); Line Voltage = system voltage", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 3 Motor Configuration"}, {"step": "Enter the motor full-load current", "screen": "HIM / Parameters - Motor Data", "parameter": "Parameter 78 Motor FLC", "value": "1.0...2200.0 A - enter the motor nameplate FLC (for the 150-SM6 module, rotary switch S5 sets FLC as % of controller max: position 0 = 40%, F = 100%, in 4% steps; e.g. a 60 A motor on a 90 A controller is 64%, position 6)", "source": "SMC-50 User Manual 150-UM011B-EN-P; 150-SM6 Installation 150-IN053B (S5 table)"}, {"step": "Choose the starting mode", "screen": "HIM / Parameters - Starting", "parameter": "Parameter 49 Starting Mode", "value": "Soft Start (default), Current Limit, Torque Ramp, Linear Speed, Pump Start, Full Voltage, Dual Ramp, Preset Slow Speed; set with the 150-SM6 DIP switches as Linear Speed Accel (default), Current Limit, Soft Start or Pump Start", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 3"}, {"step": "Set ramp time, initial torque and (for Current Limit) current limit level", "screen": "HIM / Parameters - Starting", "parameter": "Parameter 50 Ramp Time; Parameter 51 Initial Torque; Parameter 53 Current Limit Level", "value": "Ramp Time 0.0...1000.0 s, default 10.0 s; Initial Torque 0...90% LRT, default 70%; Current Limit 50...600% FLC", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 3 Tables 15/16"}, {"step": "Set the stop mode and stop time", "screen": "HIM / Parameters - Stopping", "parameter": "Parameter 65 Stop Mode; Parameter 66 Stop Time", "value": "Stop Mode: Coast, Soft Stop, Linear Speed Decel (default), Pump Stop, SMB, Accu-Stop; Stop Time 0.0...999.0 s (Pump Stop table shows 0.0...999.0 s)", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 3"}, {"step": "Configure the control inputs: In1 = Start, In2 = Coast/Stop", "screen": "HIM / Parameters - I/O", "parameter": "Parameter 56 Input 1 (In1, terminal 11); Parameter 57 Input 2 (In2, terminal 10)", "value": "In1 = Start; In2 = Coast, Stop Option, etc. If any input is set to Start or Slow Speed with no input set to Coast or Stop, the controller generates an I/O Configuration Fault (Fault 61)", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 2 wiring diagrams"}, {"step": "Run motor tuning, then enable the overload and other protections", "screen": "HIM / Motor Tuning; HIM / Protection", "parameter": "Motor Tuning (Ch. 3); Parameter 230 Motor Fault En (overload enable)", "value": "Run tuning before the first start after installation and after Load Defaults; disable the SMC-50 overload (Parameter 230) only when separate overload relays are provided (e.g. multi-motor or two-speed applications)", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 3 and Ch. 2 (two-speed/multi-motor notes)"}], "commissioning": ["Verify input supply voltage and wiring, output wiring and control wiring; check control power at terminals 1 (+L1) and 2 (-L2).", "Run motor tuning before the first start after installation and after any Load Defaults.", "Test local start/stop from the HIM or the wired In1/In2 inputs; confirm the motor reaches full speed inside the ramp time.", "Check metering (current per phase, voltage, torque, power) and that the motor thermal model is not climbing abnormally.", "Prove the Push to Reset / Hold to Test button: hold >3 s (but <10 s) to force a Test Fault (Fault 62); press <2 s to reset it.", "Confirm the isolation contactor (if fitted) and aux outputs behave as configured, and that a fault (e.g. overload) opens the trip relay."], "tuning": "Soft Start ramps voltage from Initial Torque (Parameter 51) over Ramp Time (Parameter 50). Current Limit holds current at Parameter 53 for the ramp time. Linear Speed Acceleration increases current to give a straight-line speed ramp - the default and the best choice for most loads. Torque Control (Torque Ramp) slowly increases motor torque over a fixed time for fragile loads. Pump Start/Pump Stop shape torque to prevent water hammer; use the shortest pump-stop time that stops the pump cleanly. Dual Ramp gives two start profiles selected by a digital input. Preset Slow Speed runs the motor at 1...15% speed forward or reverse for positioning. Smart Motor Braking (Parameter 65 = SMB, Braking Current Parameter 69, Slow Speed Parameter 72) brakes the load; Accu-Stop combines slow speed with braking for accurate positioning. Energy Saver reduces voltage at light load; it is a running mode, not a starting mode.", "faults": [{"code": "1, 2, 3", "meaning": "Line Loss (with phase indication) - missing supply phase, high-impedance connection, or unstable 3-phase voltage", "fix": "Check for an open line (blown fuse), loose line/load connections, and power quality; disable the feature only if the application requires it."}, {"code": "4, 5, 6", "meaning": "Shorted SCR (with phase indication) - shorted power module", "fix": "Check for a shorted SCR with a resistance check (Power Module Check section); replace the power module if necessary."}, {"code": "7, 8, 9", "meaning": "Open Gate (with phase indication) - open gate circuitry or loose gate lead", "fix": "Perform a resistance check; remove the control module and check gate-lead connections TB5, TB6, TB7 are firmly seated; replace the power module if necessary."}, {"code": "10 or 60", "meaning": "SCR Overtemp or PTC Power Pole overtemperature", "fix": "Check controller ventilation, duty cycle and fan operation; wait for cooling or provide external cooling; replace the power module or control module as needed."}, {"code": "21", "meaning": "Overload - motor overloaded, or overload class / motor FLC do not match the motor", "fix": "Check the overload condition, check programmed overload class and motor FLC, verify actual current draw."}, {"code": "23 / 24", "meaning": "Jam (23) - current above the programmed jam level for the programmed time; Stall (24) - motor did not reach full speed by the end of the ramp", "fix": "Correct the jam/stall source or excessive loading; check programmed settings and adjust starting parameters."}, {"code": "25", "meaning": "Phase Reversal (prestart only) - incoming supply not in the expected ABC sequence", "fix": "Check power wiring and correct the phase sequence."}, {"code": "61", "meaning": "I/O Configuration Fault - control I/O does not meet the system rules (e.g. a Start input with no Coast/Stop input)", "fix": "Modify the control I/O configuration to meet the rules in Ch. 4 Configuration Functions."}], "manualUrl": "https://dalkos.ru/upload/documents/RockwellAutomation_SMC-50.pdf", "sources": ["https://dalkos.ru/upload/documents/RockwellAutomation_SMC-50.pdf", "https://www.manualsdir.com/manuals/577736/rockwell-automation-150-sm6-smc-50-soft-starter-parameter-configuration-option-module-installation.html?page=4", "https://lvmcc-pubs.rockwellautomation.com/cutsheets/150-SB1NUD.pdf"], "tbd": ["SMC-50 exact control-power voltage range and fan-power wiring for the 90...520 A frames - the manual chapter was read for terminals 1/2 but the VA/voltage table was not extracted in this pass; confirm in 150-UM011 Ch. 2 Control Power.", "SMC-50 EtherNet/IP option module catalog number - the manual confirms comms option modules exist; the exact 20-COMM-E number was not verified in the text read, so it is not stated here.", "SMC-50 150-SM6 DIP-switch bank definitions beyond S5 (starting mode/stop mode/energy saver/braking current) - partially read from 150-IN053; confirm the full 3-bank table before teaching it."], "sourceFile": "starters.json"}], "modules": [{"id": "kinetix-5700-module", "title": "Kinetix 5700: from selection to running axis", "family": "Kinetix 5700", "lesso
