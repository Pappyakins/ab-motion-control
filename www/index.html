<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7c3aed">
<title>AB Motion Control App</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
:root{
  --bg:#f2f5f9; --card:#ffffff; --text:#141a24; --muted:#6b7280;
  --primary:#7c3aed; --primary-dark:#6d28d9; --primary-soft:#ede9fe;
  --danger:#ef4444; --danger-soft:#fee2e2; --success:#10b981; --success-soft:#d1fae5;
  --gold:#b45309; --gold-soft:#fef3c7; --warn:#d97706; --warn-soft:#fef3c7;
  --border:#e5e9f0; --radius:16px; --tabbar-h:64px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0e1117; --card:#171c26; --text:#eef1f7; --muted:#9aa3b5;
    --primary:#a78bfa; --primary-dark:#7c3aed; --primary-soft:#2e1065;
    --danger:#f87171; --danger-soft:#3a1d1d; --success:#34d399; --success-soft:#123b2c;
    --gold:#fbbf24; --gold-soft:#3d2f10; --warn:#fbbf24; --warn-soft:#3d2f10; --border:#262c3b;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh}
#app{max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;background:var(--bg)}
header.top{position:sticky;top:0;z-index:20;padding:calc(var(--sat) + 14px) 18px 16px;background:linear-gradient(135deg,var(--primary-dark),var(--primary));color:#fff;border-radius:0 0 24px 24px;box-shadow:0 4px 18px rgba(124,58,237,.35)}
header.top h1{margin:0;font-size:20px;font-weight:700}
header.top .sub{margin:4px 0 0;font-size:13px;opacity:.85}
main{padding:14px 14px calc(var(--tabbar-h) + var(--sab) + 40px)}
.tab{display:none}
.tab.active{display:block;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:0 1px 4px rgba(20,20,60,.05)}
.card h3{margin:0 0 4px;font-size:13px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted)}
.card h2{margin:0 0 6px;font-size:18px}
.card p{margin:6px 0;line-height:1.55;font-size:14.5px}
.card p.small{font-size:13px;color:var(--muted)}
button{font-family:inherit}
.btn{display:block;width:100%;padding:15px;border:none;border-radius:14px;cursor:pointer;background:var(--primary);color:#fff;font-size:16px;font-weight:700;min-height:52px;margin-bottom:12px}
.btn:active{transform:scale(.98)}
.btn.secondary{background:var(--primary-soft);color:var(--primary)}
.btn.ghost{background:transparent;color:var(--primary);border:1px solid var(--border);min-height:44px;padding:10px;font-size:14px}
input{width:100%;padding:13px 14px;border:1px solid var(--border);border-radius:12px;font-size:16px;background:var(--card);color:var(--text);font-family:inherit;min-height:50px}
input:focus{outline:2px solid var(--primary);border-color:var(--primary)}
label.f{display:block;font-size:12px;font-weight:700;color:var(--muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.list-item{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer;color:var(--text);font-size:15px}
.list-item:active{transform:scale(.98)}
.list-item .grow{flex:1}
.list-item .t{font-weight:700}
.list-item .s{font-size:12.5px;color:var(--muted);margin-top:2px}
.badge{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;padding:3px 8px;border-radius:999px;background:var(--primary-soft);color:var(--primary)}
.badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.green{background:var(--success-soft);color:var(--success)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.pill-row{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.progress{height:8px;border-radius:999px;background:var(--border);overflow:hidden;margin:8px 0 2px}
.progress>div{height:100%;background:var(--primary);border-radius:999px}
table{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--border);vertical-align:top;line-height:1.45}
th{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.tbd{border:2px dashed var(--warn);background:var(--warn-soft);border-radius:12px;padding:12px;margin:10px 0;font-size:13.5px;line-height:1.5}
.tbd b{color:var(--warn)}
.quiz-opt{display:block;width:100%;text-align:left;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--card);color:var(--text);font-size:15px;margin-bottom:10px;cursor:pointer;line-height:1.45}
.quiz-opt.correct{border-color:var(--success);background:var(--success-soft)}
.quiz-opt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.quiz-opt:disabled{opacity:.85;cursor:default}
.explain{font-size:13.5px;line-height:1.55;background:var(--primary-soft);border-radius:12px;padding:12px;margin:10px 0}
.tabbar{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:100%;max-width:560px;height:calc(var(--tabbar-h) + var(--sab));padding-bottom:var(--sab);background:var(--card);border-top:1px solid var(--border);display:flex;z-index:30}
.tabbar button{flex:1;border:none;background:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;padding-top:10px}
.tabbar button.active{color:var(--primary)}
.tabbar button .ic{display:block;font-size:20px;margin-bottom:2px}
.back{color:var(--primary);background:none;border:none;font-size:14px;font-weight:700;cursor:pointer;padding:0 0 10px}
h2.sec{font-size:15px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin:20px 0 8px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px dashed var(--border);font-size:14px}
.kv:last-child{border-bottom:none}
.kv span{color:var(--muted);flex:none}
.kv b{text-align:right;font-variant-numeric:tabular-nums}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px dashed var(--border);font-size:14.5px;line-height:1.5}
.check:last-child{border-bottom:none}
.check input{width:20px;height:20px;min-height:20px;flex:none;margin-top:2px;accent-color:var(--primary)}
.check.done{color:var(--muted);text-decoration:line-through}
a{color:var(--primary)}
</style>
</head>

e within the continuous torque rating, ambient 40 C / 104 F maximum, lower the ambient temperature or increase cooling. Motor wiring error: check the wiring. Incorrect motor: verify the proper motor was selected."}, {"code": "E06", "meaning": "Hardware overtravel - dedicated overtravel input inactive", "fix": "Check the wiring; verify the motion profile."}, {"code": "E07", "meaning": "Feedback lost - feedback wiring open, shorted, or missing", "fix": "Check the motor encoder wiring; ensure the motor is recognized from the drive's web-based configuration motor screen."}, {"code": "E09", "meaning": "Bus undervoltage - low AC line or input voltage", "fix": "Verify the voltage level of the incoming AC; check for AC line drop; install a UPS on the AC input."}, {"code": "E10", "meaning": "Bus overvoltage - excessive regeneration, or excessive AC input voltage", "fix": "The motor is driven by an external mechanical power source and regenerates too much peak energy: change the decel or motion profile, use a larger system, or use a resistive shunt; if a shunt is connected, verify the wiring. Also verify the input voltage is within specification."}, {"code": "E11", "meaning": "Illegal Hall state - incorrect phasing", "fix": "Check the Hall phasing; verify the Hall wiring; check for bad connections; verify the 5V power supply to the encoder."}, {"code": "E12", "meaning": "Home search failed - home sensor or marker outside the overtravel limits", "fix": "Reposition the overtravel limits or the sensor; check the wiring."}, {"code": "E14", "meaning": "Ethernet I/O connection lost", "fix": "Check the wiring and the Ethernet cables and routing; check the controller program to ensure the I/O is scanned at the correct RPI rate."}, {"code": "E16", "meaning": "Software overtravel - programmed overtravel limit exceeded", "fix": "Verify the motion profile; verify the overtravel settings are appropriate."}, {"code": "E18", "meaning": "Overspeed - motor speed exceeded 125% of the maximum rated speed", "fix": "Check the cables for noise; check the tuning."}, {"code": "E19", "meaning": "Excess position error - position error limit exceeded", "fix": "Increase the following error limit or time; check the position loop tuning."}, {"code": "E67", "meaning": "Operating system failed. Hardware or configuration failure.", "fix": "Check configuration settings to ensure that drive tags setting are valid."}, {"code": "E17", "meaning": "User-specified current fault.", "fix": "Increase to a less restrictive setting."}, {"code": "E26", "meaning": "User-specified velocity fault.", "fix": "Increase to a less restrictive setting."}, {"code": "E30", "meaning": "Encoder communication fault. Communications not established with intelligent encoder.", "fix": "Verify motor selection, verify motor supports automatic identification, and check encoder wiring."}, {"code": "E31", "meaning": "Encoder data corrupted.", "fix": "Replace the motor/encoder."}, {"code": "E37", "meaning": "Safe torque-off while enabled. Safety circuit opened while the drive was enabled.", "fix": "Check the safety circuit."}, {"code": "E43", "meaning": "Drive enable input. Attempt to enable via software while the Drive Enable hardware input is inactive, or the input transitioned inactive while enabled.", "fix": "Disable the Drive Enable Input fault, or verify the Drive Enable input is active whenever the drive is enabled through software."}, {"code": "E44", "meaning": "Controller changed to PROG mode. Program downloaded or key turned to program mode.", "fix": "Place the controller back in RUN mode and clear the faults."}, {"code": "E70", "meaning": "Memory module error. Bad memory module.", "fix": "Replace the memory module."}, {"code": "E72", "meaning": "Drive temperature too high.", "fix": "Check for clogged vents or a defective fan, check ambient temperature, reduce acceleration rates, reduce duty cycle, and increase time per motion."}, {"code": "E74", "meaning": "Drive exceeded peak current limit. Motor cables or winding shorted, duty cycle, or ambient temperature.", "fix": "Reduce acceleration, check continuity of the DC bus to U/V/W, check for wire fibers, or send the drive for repair."}, {"code": "E91", "meaning": "User watchdog timed out. WatchDogKick tag not written frequently enough, or watchdog timeout too low.", "fix": "Increase the watchdog timeout or kick the watchdog more frequently."}, {"code": "E92", "meaning": "Bad battery. Tamagawa absolute feedback battery voltage low or missing.", "fix": "Replace the battery."}, {"code": "E93", "meaning": "Acceleration value above or below drive capability.", "fix": "Check indexing and motion profiles; increase or decrease acceleration or permitted time."}, {"code": "E94", "meaning": "Motor or motor feedback cable malfunction, or grounding not followed.", "fix": "Check motor power and feedback wiring, replace the motor/encoder, verify grounding, route feedback away from noise, and see GMC-RM001."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2097-um001_-en-p.pdf", "sources": ["https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2097-um001_-en-p.pdf (official manual link; direct fetch blocked by Akamai - read from the archive.org mirror copy, local file .research/pdfs/um001-300.txt, Rockwell 2097-UM001A-EN-P Feb 2010)", "Local mirror copy read 2026-11-20: .research/pdfs/um001-300.txt (Rockwell 2097-UM001A-EN-P Feb 2010, archive.org djvu text, OCR messy)", "Rockwell Kinetix 300 hands-on lab (Lab 1 Basic Drive Configuration, Lab 2 Indexing mode), read via archive.org text", "https://www.tdl-ia.com/insights/kinetix-servo-drive-migration-300-350-6000-ultra3000.html (TDL, paraphrasing 2198-RM004C)"], "tbd": [], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-350", "category": "servo-drive", "family": "Kinetix 350", "catalogNumbers": ["2097-V31PR0-LM", "2097-V31PR2-LM", "2097-V32PR0-LM", "2097-V32PR2-LM", "2097-V32PR4-LM", "2097-V33PR1-LM", "2097-V33PR3-LM", "2097-V33PR5-LM", "2097-V33PR6-LM", "2097-V34PR3-LM", "2097-V34PR5-LM", "2097-V34PR6-LM"], "name": "Kinetix 350 Servo Drive", "whatItIs": "The Kinetix 350 is a single-axis EtherNet/IP servo drive, 0.4 to 3.0 kW (2 to 12 A rms), with integrated motion on EtherNet/IP (CIP Motion) and Safe Torque Off. Rockwell announced in July 2024 that Bulletin 2097 Kinetix 350 is discontinued and no longer for sale; the migration target is the Bulletin 2198 Kinetix 5300.", "whenToUse": "Legacy single-axis CIP Motion applications only. For any new design, use the Kinetix 5300, the announced migration target for the 350.", "selection": "Continuous output current in A (0-pk): 2097-V31PR0 2.8, V31PR2 5.7, V32PR0 2.8, V32PR2 5.7, V32PR4 11.3, V33PR6 17.0, V34PR3 2.8, V34PR5 5.7, V34PR6 8.5. Input: 120V single-phase doubler mode (V31), 240V single-phase (V32), 240V single/three-phase (V33), 480V three-phase (V34). Integrated AC line filter. Size with Rockwell Motion Analyzer.\n\nMigration: Kinetix 350 to Kinetix 5300 migration guide is 2198-RM005B. The Kinetix 5300 is integrated motion on EtherNet/IP, one port to two; it needs Studio 5000 v33.00 or later (RM005B p.46). The 5300 powers brakes up to 2.25 A directly. STO changes from a 6-pin plug to a 10-pin connector. MP cables are reusable; flying-lead cables replace the kit with 2198-K53CK-D15M. Similar-size example: 2097-V31PR0-LM becomes 2198-C1004-ERS.", "wiring": {"power": "AC input (120/240/480V) with AC line filters 2097-Fx. Contactor ratings per UM002 (for example 2097-V32PR0-LM at 240V uses a 100-C23x10 / 100-C23Zx10 contactor). No isolation transformer is required for three-phase input. Enclosure sizing example: minimum cabinet depth 332 mm.", "feedback": "Motor power and feedback via 2090 cables. I/O terminal block 2097-TB1. Shunt resistors 2097-Rx.", "safety": "Hardwired Safe Torque Off via the STO connector. If the system does not use the safe torque-off feature, follow the Safe Torque-off Feature Bypass instructions starting on page 107 of UM002. Troubleshooting the STO function is on page 103; 'Wiring Your Safe Torque-off Circuit' is on page 105.", "network": "EtherNet/IP Port 1 (10/100 Mbps). Default IP address 192.168.124.200. DHCP (dynamic) or static (manual) addressing via the keypad parameters IP.1-IP.4. Changes take effect only after the drive is powered off and on again. Use 1585J Ethernet cables."}, "configuration": [{"step": "Set the IP address from the drive keypad. Press the display key and use the arrow keys to access parameters IP.1, IP.2, IP.3 and IP.4; each parameter holds one sub-octet of the full IP address (factory default 192.168.124.200). Changes take effect only after the drive is powered off and on again.", "screen": "Drive keypad display", "parameter": "IP.1; IP.2; IP.3; IP.4", "value": "Factory default 192.168.124.200", "source": "2097-UM002C-EN-P Ch5 p.81-82"}, {"step": "Configure the Logix5000 EtherNet/IP controller (UM002E Ch5 p.84).", "screen": "Studio 5000 Logix Designer", "parameter": "Controller; EtherNet/IP module", "value": "Per application", "source": "2097-UM002E-EN-P Ch5 p.84"}, {"step": "Configure the Motion Group: right-click Motion Groups > New Motion Group (p.86-87).", "screen": "Motion Groups > New Motion Group", "parameter": "Motion Group", "value": "New Motion Group", "source": "2097-UM002E-EN-P Ch5 p.86-87"}, {"step": "Configure the Axis Properties: right-click the axis > Properties (p.87 and following). Step 14 is 'Click Apply' (p.86).", "screen": "Axis Properties", "parameter": "Axis properties", "value": "Per motor", "source": "2097-UM002E-EN-P Ch5 p.86-87"}, {"step": "Apply power to the Kinetix 350 drive (p.93).", "screen": "Drive display", "parameter": "Power", "value": "Apply power", "source": "2097-UM002E-EN-P Ch5 p.93"}, {"step": "Test and Tune the Axes (p.94): run the hookup tests and the autotune in Axis Properties.", "screen": "Axis Properties > Hookup Tests; Autotune", "parameter": "Hookup test; Autotune", "value": "Passed; Success", "source": "2097-UM002E-EN-P Ch5 p.94"}, {"step": "If needed, Disable EnableInputChecking by Using a Logix Designer Message Instruction (Ch5 p.100).", "screen": "Logix Designer, Message Instruction", "parameter": "EnableInputChecking", "value": "Disabled via MSG", "source": "2097-UM002E-EN-P Ch5 p.100"}], "commissioning": ["Verify the IP address on the display (parameters IP.1-IP.4) and power-cycle the drive after any change.", "Verify the controller connection and the Motion Group / axis configuration.", "Verify the STO wiring, or the STO bypass if the safe torque-off feature is not used.", "Verify the four-digit display: it shows an axis fault code F xx, a custom fault code Fxx, an initialization fault code, or a node fault code nFxx.", "Test and tune the axes (UM002E p.94) before putting the machine into service."], "tuning": "Hookup tests: verify the load is removed from the axis, then in the Motion Group right-click the axis, open Properties, and select Hookup Tests. Test Distance is 2.0 revolutions (or per application). Marker test verifies marker detection as the shaft is rotated. Motor Feedback test verifies feedback wiring as the shaft is rotated. Motor and Feedback test verifies motor power and feedback as the drive commands rotation; it requires 24V ENABLE on the axis under test only, or disable enableInputChecking per p.100. Click Start; Test State goes Executing then Passed; click OK and confirm the direction is correct (Yes). On failure verify the Axis status is solid green during the test, ENABLE is applied or enableInputChecking is 0, check Scaling values, and rerun. Autotune: with the load still removed first (then reattach and repeat), click the Autotune category, set Travel Limit to 5 and Speed to 10 (example values), Direction defaults to Forward Uni-directional, click Apply then Start; Test State goes Executing then Success, tuned values populate the Loop and Load tables; Accept the tuned values and click OK. On failure adjust motor velocity, see the Logix5000 motion module manual, and rerun.", "faults": [{"code": "F02", "meaning": "Illegal Hall State - Hall feedback inputs are incorrect", "fix": "Check for improper connections; check the wiring of S1/S2/S3, the power supply to the encoder, and the motor wire phasing."}, {"code": "F03", "meaning": "Motor Overspeed - speed exceeded 125% of the maximum rated speed", "fix": "Check the cables for noise, check the tuning, and check the motor wiring at the MF connector."}, {"code": "F05", "meaning": "Motor Overtemperature - thermostat / thermistor / encoder temperature sensor tripped", "fix": "High ambient temperature and/or excessive current: operate within the continuous torque rating, lower the ambient temperature or increase cooling, and verify the proper motor was selected."}, {"code": "F07", "meaning": "Motor Thermal Protection - thermal model over 110% of the RMS rating", "fix": "The machine duty cycle requires RMS current exceeding the continuous rating; change the command profile to reduce speed or increase time."}, {"code": "F10", "meaning": "Inverter Overcurrent - power transistors turned off due to overcurrent, overtemperature, or power supply problems", "fix": "Motor cables shorted: verify continuity. Motor winding shorted: with a multimeter, phase-to-phase should not be open and phase-to-ground should be open. Check for clogged vents or a defective fan, restricted cooling, and ambient within specification (KNX-TD003 / GMC-TD003). Operate within the continuous power rating and reduce acceleration rates. Remove all power and motor connections and continuity-check DC bus to U/V/W; if continuity exists, check for wire fibers or send the drive for repair."}, {"code": "E38", "meaning": "Memory module error - bad memory module", "fix": "Replace the memory module."}, {"code": "E76", "meaning": "Blank memory module - a blank MEM module was inserted", "fix": "Push and hold the drive's enter key."}, {"code": "F11", "meaning": "Inverter overtemperature. Thermal switch tripped.", "fix": "Fan failed: replace the drive. Cabinet ambient too high: check temperature per GMC-TD003. Duty cycle: change the command profile. Airflow blocked: check airflow and re-route cables."}, {"code": "F13", "meaning": "Inverter thermal protection. Thermal model over 110% of rating.", "fix": "Change the command profile to reduce speed and increase time."}, {"code": "F33", "meaning": "Bus undervoltage. DC bus below limits: 460V below 275V, 230V below 137V, 120V below 80V.", "fix": "Verify incoming AC voltage, check for glitches or line drop, and install a UPS."}, {"code": "F35", "meaning": "Bus overvoltage. DC bus above factory limit (460V above 820V); excessive regeneration.", "fix": "Change the decel or motion profile, use a larger system, or install a shunt resistor."}, {"code": "F43", "meaning": "Feedback loss. Sin/cos sum below factory limit, or TTL A/B below factory limit; wiring open, shorted, or missing.", "fix": "Check motor encoder wiring and run the Hookup test in RSLogix 5000."}, {"code": "F45", "meaning": "Feedback serial communications, TL-Series only. Consecutive missed or corrupted serial packets exceeded the factory limit; communications not established with intelligent encoder.", "fix": "Verify motor selection and verify motor encoder wiring."}, {"code": "F47", "meaning": "Feedback self test. Feedback device internal error; damage to the feedback device.", "fix": "Call your Rockwell Automation sales representative to return the motor for repair."}, {"code": "F50", "meaning": "Hardware overtravel positive. Axis beyond physical travel limits; dedicated overtravel input inactive.", "fix": "Check wiring and verify the motion profile."}, {"code": "F51", "meaning": "Hardware overtravel negative. Axis beyond physical travel limits; dedicated overtravel input inactive.", "fix": "Verify the axis configuration in software."}, {"code": "F54", "meaning": "Excessive position error.", "fix": "Check wiring at the MF connector, increase the following error limit and time, check position loop tuning, verify sizing, verify mechanical integrity, and check motor power wiring."}, {"code": "F55", "meaning": "Excessive velocity error.", "fix": "Check wiring at the MF connector, increase the velocity error limit and time, check velocity loop tuning, verify sizing, verify mechanical integrity, and check motor power wiring."}, {"code": "F56", "meaning": "Overtorque limit.", "fix": "Reduce acceleration, verify the motion profile, verify Overtorque settings, verify sizing, verify the torque offset, and verify mechanical integrity."}, {"code": "F57", "meaning": "Undertorque limit.", "fix": "Verify the motion profile, verify Overtorque settings, verify sizing, and verify mechanical integrity."}, {"code": "F61", "meaning": "Drive enable input. Hardware enable deactivated while enabled.", "fix": "Check wiring of the drive enable input, check the 24V source, and verify the Drive Enable input is active whenever the drive is enabled through software."}, {"code": "F62", "meaning": "Controller initiated exception. User-configured software overtravel.", "fix": "Move the axis out of the soft overtravel range, clear the soft overtravel fault, check the soft overtravel configuration, and consult the controller documentation."}, {"code": "Fc02", "meaning": "Motor voltage mismatch. Wrong motor.", "fix": "Connect the appropriate motor."}, {"code": "Fc05", "meaning": "Motor encoder battery loss, TLY motors with B feedback. Weak battery or poor connection.", "fix": "Replace the battery and check the battery connection."}, {"code": "Fc14", "meaning": "Excessive current feedback offset. Current in one or more phases lost or below preset.", "fix": "Replace the drive."}, {"code": "Fc26", "meaning": "Runtime drive error. Firmware unrecoverable runtime error.", "fix": "Cycle control power; replace the drive."}, {"code": "Ic01", "meaning": "Boot block check sum fault. Motor data checksum error; faulty intelligent encoder.", "fix": "Cycle power or reset the drive; replace the motor if the fault continues."}, {"code": "Ic02", "meaning": "Motor data range error. Data in the motor data blob out of range; faulty intelligent encoder or incorrect motor file.", "fix": "Cycle power or reset the drive, check the validity of the motion database, and replace the motor if the fault continues."}, {"code": "Ic03", "meaning": "Motor feedback communication startup. Communications with the smart encoder could not be established on the MF port; incorrect motor selected or connected, or faulty wiring.", "fix": "Check motor selection and check motor encoder wiring."}, {"code": "Ic06", "meaning": "Motor absolute startup speed. Absolute encoder could not determine position after powerup due to speed above 100 rpm.", "fix": "Allow machine motion to stop before powerup."}, {"code": "L001", "meaning": "Identity block corrupted.", "fix": "Reload firmware and restart the drive; if the status repeats, contact Rockwell Automation technical support to return the drive for repair."}, {"code": "L002", "meaning": "Firmware file load failed.", "fix": "Reload firmware and restart the drive; if the status repeats, contact Rockwell Automation technical support to return the drive for repair."}, {"code": "L004", "meaning": "Firmware not programmed. Drive is new.", "fix": "Reload firmware and restart the drive; if the status repeats, contact Rockwell Automation technical support to return the drive for repair."}, {"code": "L008", "meaning": "DSP load operation failed.", "fix": "Reload firmware and restart the drive; if the status repeats, contact Rockwell Automation technical support to return the drive for repair."}, {"code": "P001", "meaning": "SDRAM test failed.", "fix": "Contact Rockwell Automation technical support to return the drive for repair."}, {"code": "P002", "meaning": "FPGA load operation failed.", "fix": "Contact Rockwell Automation technical support to return the drive for repair."}, {"code": "P004", "meaning": "DPRAM test failed.", "fix": "Contact Rockwell Automation technical support to return the drive for repair."}, {"code": "P005", "meaning": "DSP interface to DPRAM. No DSP response.", "fix": "Contact Rockwell Automation technical support to return the drive for repair."}, {"code": "P006", "meaning": "V/F to DPRAM failed.", "fix": "Contact Rockwell Automation technical support to return the drive for repair."}, {"code": "P007", "meaning": "Firmware file md5 test failure.", "fix": "Contact Rockwell Automation technical support to return the drive for repair."}, {"code": "nF01", "meaning": "Control update fault. Several consecutive updates lost; excessive network traffic or noisy environment.", "fix": "Remove unnecessary network devices, change topology, use faster equipment, segregate signal from power wiring, use shielded cables, add snubbers, and cycle control power or reset the drive."}, {"code": "nF02", "meaning": "Processor watchdog fault.", "fix": "Cycle control power or reset the drive; replace the control module if the fault persists."}, {"code": "nF03", "meaning": "Hardware fault. Internal hardware problem, or nonvolatile write failed; faulty memory.", "fix": "Cycle control power or reset the drive; replace the drive."}, {"code": "nF04", "meaning": "Data format error. Data format error in the controller-to-drive message; faulty memory.", "fix": "Cycle control power or reset the drive; replace the control module if the fault persists."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2097-um002_-en-p.pdf", "sources": ["https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2097-um002_-en-p.pdf (official manual link; direct fetch blocked by Akamai - read from the archive.org mirror copy, local file .research/pdfs/um002-350.txt, Rockwell 2097-UM002C-EN-P Dec 2013)", "Local mirror copy read 2026-11-20: .research/pdfs/um002-350.txt (Rockwell 2097-UM002C-EN-P Dec 2013, archive.org djvu text, OCR messy)", "Local file: .research/pdfs/um002-350.pdf (Rockwell 2097-UM002E-EN-P, 4-page excerpt)", "https://www.tdl-ia.com/insights/kinetix-servo-drive-migration-300-350-6000-ultra3000.html (TDL, paraphrasing 2198-RM005B)"], "tbd": [], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-5100", "category": "servo-drive", "family": "Kinetix 5100", "catalogNumbers": ["2198-E1007-ERS", "2198-E1004-ERS", "2198-E1015-ERS", "2198-E1020-ERS", "2198-E2030-ERS", "2198-E2055-ERS", "2198-E2075-ERS", "2198-E2150-ERS", "2198-E4004-ERS", "2198-E4007-ERS", "2198-E4015-ERS", "2198-E4020-ERS", "2198-E4030-ERS", "2198-E4055-ERS", "2198-E4075-ERS"], "name": "Kinetix 5100 Servo Drive", "whatItIs": "The Kinetix 5100 is a single-axis EtherNet/IP indexing servo drive, 0.4 to 15.0 kW (2.6 to 78 A rms), with built-in indexing (PR mode, PR commands 0-99). It can run standalone from digital I/O, pulse train or analog command, or under a Logix controller (Class 1 EtherNet/IP) or a Micro800 controller (Class 3), with operation modes for Position, Speed, Torque, PR indexing, IO mode, E-Cam, capture (CAP) and compare (CMP).", "whenToUse": "Pick the 5100 for small standalone machines with one or two axes that need indexing without full motion programming. Pick it over the 5300 when the drive must run without a Logix controller. Pick it over the 300/350 for any new design, since the 5100 is the current single-axis indexing drive and the 300/350 are discontinued.", "selection": "Size with Rockwell Motion Analyzer. KNX-RM011C design guide values: 2198-E1004 0.40 kW / 2.60 A / 6.50 A peak; E1007 0.75 kW / 5.10 A / 15.4 A; E1015 1.50 kW / 7.90 A / 23.7 A; E1020 2.00 kW / 13.4 A / 40.6 A. 2198-E4030 is 3.0 kW at 480V three-phase. Input: 120V single-phase, 200-230V single-phase, 230V three-phase, 480V three-phase (nominal).\n\nControl power: 400V-class drives (2198-E4xxx-ERS) require 24V DC control power. 200V-class drives take control power from one incoming AC phase. A 24V DC power supply is also required for digital I/O circuitry, motor brake circuitry, and control power on 2198-E4xxx-ERS (400V-class) drives.", "wiring": {"power": "AC input through the input power connector. I/O through the 50-pin terminal block 2198-TBIO. Motor power connector: ring lugs are recommended for motor power (U/V/W/PE) on 2198-E2055 / E2075 / E2150 (200V) and E4020 / E4030 / E4055 / E4075 / E4150 (400V). External passive shunt resistor as needed. AC line filters 2198-DB111-F, DB127-F, DB310-F, DB324-F. Cable shield clamp for the feedback cable.", "feedback": "MFB 15-pin connector kit 2198-K51CK-D15M with battery backup for TLP/TL/TLY multi-turn encoders (SIN+/-, COS+/-, DATA+/-, ECOM, EPWR 9V, S1/S2/S3, TS+, EPWR 5V, battery). AUX feedback kit 2198-AUXKIT for master or load feedback. Feedback battery box 2198-KTBT maintains TLP position on power loss. 2090-CFBM7Dx feedback cables.", "safety": "Hardwired Safe Torque Off only; Cat 3 per ISO 13849-1, PLd (SAFETY-AT188A-EN-P, Guardmaster DI safety relay). The STO alarm is typically E500. The STO condition is not automatically controlled: after a faulted STO state is corrected, the STO alarm remains and must be reset. STO connector data, wiring, bypass and cascade per UM004D Chapter 15.", "network": "EtherNet/IP, Port 1 (TX+/-, RX+/-). Set the IP address via the keypad interface, KNX5100C software, or the BOOTP-DHCP tool. Linear, ring and star topologies per UM004D Chapter 1. Studio 5000 Logix Designer v30+ for Logix, Connected Components Workbench (CCW) v10.0+ for Micro800, KNX5100C v1.001+ via the mini-USB cable 2198-USBC (with 2198-USBF filter). Pulse train output with the Motion User Defined Function Block from a Micro800 controller; MicroLogix 1400 via RS-232/485 plus Ethernet. Two EtherNet/IP ports. Dual-port EtherNet/IP supports linear, ring and star topologies and device-level ring topologies."}, "configuration": [{"step": "KNX5100C route: download KNX5100C software v1.001 or later, launch it, connect to the drive and set the COM port (mini-USB cable 2198-USBC).", "screen": "KNX5100C software", "parameter": "COM port", "value": "Mini-USB connection", "source": "2198-UM004D-EN-P Ch7"}, {"step": "In KNX5100C configure the drive settings: set the IP address, then configure the motor selection (Data Source, motor thermal models, motor feedback), then run a commutation test.", "screen": "KNX5100C, drive settings", "parameter": "Data Source; motor thermal models; motor feedback", "value": "Per motor catalog", "source": "2198-UM004D-EN-P Ch7"}, {"step": "Choose the operation mode in the Operation Mode Selection List: Position, Speed, Torque, PR (index), IO mode (Position / Home / Gear / Index / Speed / Torque), or E-Cam. The mode parameter is ControlMode ID117 (P1.001.Z).", "screen": "KNX5100C, Operation Mode Selection List", "parameter": "ID117 (P1.001.Z) ControlMode", "value": "Per application", "source": "2198-UM004D-EN-P Ch7/Ch10"}, {"step": "Configure the general settings, command source, pulse outputs, electronic gear (E-Gear) ratio, filter, notch filter, limits, analog I/O, position / velocity / current loops, and DI/DO plus the jog function. E-Gear ratio: GearRatioFollowerCountsN1 ID151 (P1.044), GearRatioMasterCounts ID152 (P1.045).", "screen": "KNX5100C, Parameter Editor / Parameter Wizard", "parameter": "ID151 (P1.044) GearRatioFollowerCountsN1; ID152 (P1.045) GearRatioMasterCounts", "value": "Per gearing", "source": "2198-UM004D-EN-P Ch7/Ch10; Appendix C"}, {"step": "For PR (indexing) mode, set up homing: ID297 (P5.004) homing mode and ID397 (P6.000) homing setting. The PR trigger is ID300 (P5.007). PR commands are numbered 0-99.", "screen": "KNX5100C, homing / PR settings", "parameter": "ID297 (P5.004) homing mode; ID397 (P6.000) homing setting; ID300 (P5.007) PR trigger", "value": "Per application", "source": "2198-UM004D-EN-P Ch7/Ch10"}, {"step": "Logix route (Studio 5000 v30+): install the Kinetix 5100 AOP, configure the Logix 5000 controller, add the 2198-Exxxx-ERS drive modules, use Automatic Device Configuration (ADC) in AOP v2+, set the Connection RPI, then download the program.", "screen": "Studio 5000 Logix Designer, New Module; Module Properties", "parameter": "Connection RPI; ADC", "value": "Per application", "source": "2198-UM004D-EN-P Ch8"}, {"step": "Configure the digital I/O: the drive supports ten customer-defined digital input points, all configurable with KNX5100C software (DI 1-8, plus DI 9 and DI 10 high-speed). All inputs are 24V DC (0V = OFF, 24V = ON). Digital outputs OUT1-OUT4 are assignable: Not assigned, Zero speed, Inspeed window, Current limit, Runtime fault, Ready, Brake (motor holding brake).", "screen": "KNX5100C, DI/DO configuration", "parameter": "Digital inputs 1-10; digital outputs OUT1-OUT4", "value": "24V DC; per application", "source": "2198-UM004D-EN-P Ch3/Ch7; 2198-RM004"}, {"step": "Apply power. After the drive boots up successfully it displays 'Kinetix 5100' briefly and then transitions to the Drive Status display, assuming the drive is disabled / servo off. The Real Time Data screen shows the real-time value of the selected parameter. Three status indicators on the front: module (MOD), network (NET), and CHARGE.", "screen": "Drive keypad display, Drive Status / Real Time Data", "parameter": "MOD; NET; CHARGE indicators", "value": "Per drive state", "source": "2198-UM004D-EN-P Ch5; 2198-UM004A-EN-P p.96"}, {"step": "Download KNX5100C v1.001 or later from the Product Compatibility Download Center (compatibility.rockwellautomation.com, search Kinetix 5100), extract the zip, and run Setup.", "screen": "Product Compatibility Download Center", "source": "2198-UM004D Ch7 p.130"}, {"step": "Launch KNX5100C from the desktop KNX5100C shortcut, or from Connected Components Workbench via Tools > KNX5100C.", "screen": "Desktop / Connected Components Workbench", "source": "2198-UM004D Ch7 p.130"}, {"step": "The software starts with a new project. Choose New Project, add a New Device, and click Add (the drive is auto-created); cancel to open an existing file instead.", "screen": "KNX5100C New Project", "source": "2198-UM004D Ch7 p.131"}, {"step": "Choose the COM port associated with the drive (mini-USB cable 2198-USBC). If needed, remove and reinsert the mini-USB cable to refresh the COM port state.", "screen": "KNX5100C COM port selection", "source": "2198-UM004D Ch7 p.131"}], "commissioning": ["Verify wiring: AC input, 50-pin terminal block 2198-TBIO, motor power (ring lugs on the larger frames), MFB feedback kit with battery backup, AUX feedback if used, STO wiring or bypass, Ethernet Port 1.", "Verify the IP address (keypad, KNX5100C, or BOOTP-DHCP tool) and the MOD / NET / CHARGE indicators.", "Run the commutation test in KNX5100C and verify the motor selection (Data Source, motor thermal models, motor feedback).", "For PR mode, verify homing (ID297 / ID397) is defined before starting indexing; PR commands are 0-99.", "Verify the E-Gear ratio (ID151 / ID152) and the digital I/O assignments in KNX5100C.", "Monitor the drive in KNX5100C (Function List > Monitoring Status). View status and faults on the keypad display; the display shows E + code for a fault and A + code for a warning. Clear faults per UM004D Chapter 16, p.431."], "tuning": "Autotuning is available via the drive panel or KNX5100C. Tuning Mode 1 and Tuning Mode 2: ID217 (P2.032) = 1 selects Mode 1, = 2 selects Mode 2, = 0 selects manual mode; keep estimating ID144 (P1.037) and adjust ID216 (P2.031). Autotune constraints: dwell time must be over 1 second (else E08B), accel/decel from 0 to 3000 rpm within 1.5 s (else E08C), recommended speed 500 rpm (lowest 200 rpm), load inertia at most 50 times the motor inertia. Manual mode: nested P-I loop gain adjustment (position loop gain, velocity loop gain); low-frequency vibration suppression in position mode; mechanical resonance suppression; system analysis (phase margin / gain margin). Notch filters: ID208 (P2.023) NotchFilter1Frequency, ID209 (P2.024) NotchFilter1Depth, ID226 (P2.043) NotchFilter2Frequency, ID227 (P2.044) NotchFilter2Depth, ID228 (P2.045) NotchFilter3Frequency, ID229 (P2.046) NotchFilter3Depth, ID254 (P2.095) NotchFilter1QValue. Low-pass filter: ID210 (P2.025) ResonanceSuppressionLowPassFilterTime.", "faults": [{"code": "E001", "meaning": "Over current - current 1.5x the rated peak", "fix": "Check the wiring, check for shorts, check the heatsink temperature, reset the parameters to default then adjust gradually, check and increase the accel time, apply a filter."}, {"code": "E002", "meaning": "Over voltage - main circuit voltage above the rated value", "fix": "Check the main input voltage and apply the correct voltage."}, {"code": "E003", "meaning": "Under voltage - main circuit voltage below the rated value", "fix": "Check the input voltage and wiring."}, {"code": "E005", "meaning": "Regeneration error - shunt not connected or shunt value too low", "fix": "Check the shunt connection; set ID157 (P1.052) ShuntResistorValue and ID158 (P1.053) ShuntResistorPower correctly. ID158 must not be zero when no shunt is fitted."}, {"code": "E006", "meaning": "Motor overload - ratings exceeded", "fix": "Check ID102 (P0.002) LEDMonitorSelection = 12 for average torque percent; change the motor or reduce the load; check vibration; adjust tuning; check accel/decel."}, {"code": "E009", "meaning": "Excessive deviation of position command", "fix": "Check ID219 (P2.035) PositionErrorTolerance (it may be too small); check tuning; check that the torque limit is not too low; check the external load."}, {"code": "E011", "meaning": "Encoder error - encoder wired incorrectly, loose, or damaged", "fix": "Check the connectors; replace the motor."}, {"code": "E083", "meaning": "Excessive over current - output exceeds 95% of the hardware overcurrent", "fix": "Check the wiring for shorts and check the accel time."}, {"code": "E08C", "meaning": "Inertia estimation error (autotune)", "fix": "Accel/decel 0 to 3000 rpm within 1.5 s; recommended speed 500 rpm, lowest 200 rpm; load inertia at most 50x the motor inertia."}, {"code": "E500", "meaning": "STO enabled", "fix": "Check whether STO is activated; if STO is unused, check the bypass wiring; check the STO wiring."}, {"code": "E601", "meaning": "Duplicate IP address", "fix": "Set an unused IP address."}, {"code": "E602", "meaning": "Control connection loss", "fix": "Check the Ethernet cable and connection and the controller operation."}, {"code": "E016", "meaning": "IGBT overheat. Load above the drive rating, or output short.", "fix": "Check for overload or high motor current and check the output wiring."}, {"code": "E017", "meaning": "Abnormal EEPROM.", "fix": "Contact your distributor or Rockwell Automation."}, {"code": "E022", "meaning": "Input voltage phase loss. Abnormal input voltage.", "fix": "Check the main power input wiring; contact your distributor or Rockwell Automation if the fault persists."}, {"code": "E030", "meaning": "Exceed torque limit. ID162 (P1.057) CrashProtectionTorqueThreshold and ID163 (P1.058) CrashProtectionFilterTime set wrongly.", "fix": "Set ID162 to 0 if the function is unused; otherwise raise both values."}, {"code": "E034", "meaning": "Encoder communication error.", "fix": "Change the motor."}, {"code": "E085", "meaning": "Shunt resistor error. Shunt not operating while the DC bus stays at 400V for over 110 ms.", "fix": "Check the shunt connection; recalculate and reset ID157 (P1.052) and ID158 (P1.053)."}, {"code": "E501", "meaning": "STO_A signal loss. STO_A off for more than 1 s while STO_B is on.", "fix": "Check STO_A wiring; reset by cycling power."}, {"code": "E502", "meaning": "STO_B signal loss. STO_B off for more than 1 s while STO_A is on.", "fix": "Check STO_B wiring; reset by cycling power."}, {"code": "E503", "meaning": "STO self-diagnostic error. STO self-diagnostic fails.", "fix": "Check wiring per the manual; contact your distributor or Rockwell Automation if the fault persists; reset by cycling power."}, {"code": "E555", "meaning": "Malfunction of the system.", "fix": "Contact your distributor or Rockwell Automation if the fault persists."}, {"code": "E600", "meaning": "Boot failure.", "fix": "Cycle power, update the drive firmware, and contact your distributor or Rockwell Automation if the fault persists."}, {"code": "E604", "meaning": "Watchdog fault.", "fix": "Cycle control power, update the drive firmware, and contact your distributor or Rockwell Automation if the fault persists."}, {"code": "E60B", "meaning": "Motor selection match error. Wrong motor selection or encoder wiring.", "fix": "Check the motor selection and the encoder wiring."}, {"code": "E60C", "meaning": "Internal fault.", "fix": "Contact your distributor or Rockwell Automation if the fault persists."}, {"code": "E611", "meaning": "Feedback serial communications. Wrong motor selection or encoder wiring, or motor vibration.", "fix": "Check the motor selection, the encoder wiring, and the feedback shield; replace the motor or encoder if the fault persists."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2198-um004_-en-p.pdf", "sources": ["https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=10 (Rockwell 2198-UM004D-EN-P Dec 2022, Ch1)", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=27 (UM004D Ch1, PTO / Micro800)", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=57 (UM004D Ch3, digital I/O)", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=107 (UM004D Ch4, 2198-K51CK-D15M feedback kit)", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=259 (UM004D Ch10, notch filters)", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=519 (UM004D Appendix C, MAG AOI E-Gear ID151/ID152)", "https://www.manualslib.com/manual/3863128/Allen-Bradley-Kinetix-5100-2198-E1007-Ers.html?page=425 (UM004A Ch16, status indicators)", "Local copies read 2026-11-20: .research/pdfs/um004-5100.pdf (failed 482-byte Akamai block page - ignored); 2198-RD001A-EN-P Aug 2021 fault reference read via Scribd", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=130 (ManualsLib, 2198-UM004D p.130)", "https://www.manualslib.com/manual/2980666/Rockwell-Automation-Allen-Bradley-Kinetix-5100.html?page=131 (ManualsLib, 2198-UM004D p.131)", "https://www.tdl-ia.com/insights/kinetix-servo-drive-migration-300-350-6000-ultra3000.html (TDL, citing 2198-RM004C pp. 16, 28-29)", "https://www.tdl-ia.com/insights/kinetix-servo-drive-migration-300-350-6000-ultra3000.html (TDL, citing 2198-RM004C p.35)", "Rockwell Automation press release: Rockwell Automation Saves Costs, Simplifies Sizing with New Servo System (rockwellautomation.com)", "https://www.tdl-ia.com/insights/kinetix-5100-fault-codes.html (TDL, citing 2198-RD001A-EN-P sheet 'Kinetix 5100' 06/2021 and 2198-UM004D Ch16 pp. 449-456)"], "tbd": ["Full 2198-RD001 fault table beyond the verified rows (E016, E017, E022, E030, E034, E085, E501-E503, E555, E600, E604, E60B, E60C, E611) \u2014 the rest of the RD001A spreadsheet (E004, E007-E010, E012-E015, E018-E021, E023-E029, etc.) was not directly readable from this VM \u2014 source needed: 2198-RD001A-EN-P", "Per-drive 24V control-power current-draw table (2198-UM004D Ch3) \u2014 headline 24V DC (400V-class) vs AC-phase (200V-class) verified; the per-drive current table was not located \u2014 source needed: 2198-UM004D Ch3"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-5300", "category": "servo-drive", "family": "Kinetix 5300", "catalogNumbers": ["2198-C1004-ERS", "2198-C1007-ERS", "2198-C1015-ERS", "2198-C1020-ERS", "2198-C2030-ERS", "2198-C2055-ERS", "2198-C2075-ERS", "2198-C4004-ERS", "2198-C4007-ERS", "2198-C4015-ERS", "2198-C4020-ERS", "2198-C4030-ERS", "2198-C4055-ERS", "2198-C4075-ERS"], "name": "Kinetix 5300 Servo Drive", "whatItIs": "The Kinetix 5300 is a single-axis EtherNet/IP servo drive, 0.22 to 14.70 kW, and Rockwell's entry-level CIP Motion drive. It is a standalone drive with hardwired Safe Torque Off, and it is the announced migration target for the discontinued Kinetix 350.", "whenToUse": "Pick the 5300 for single-axis machines where you want full Logix CIP Motion without the cost or complexity of the 5500/5700. Pick it over the 350 for any new design (the 350 was discontinued in July 2024). Pick it over the 5100 when the axis is driven by a Logix controller rather than running standalone indexing. Pick it over the 5500 when you do not need shared-bus multi-axis operation or integrated safety.", "selection": "Size with Rockwell Motion Analyzer. Table 3 of UM005E: 2198-C1004 0.22 kW; C1007 0.36/0.76/1.18 kW, 4.6 A rms continuous; C1015 8.5 A; C1020 0.97/2.02/3.13 kW, 12.2 A continuous, 25.0/40.6 A peak; C2030 5.02 kW, 19.6 A, 61.0 A peak; C2055 10.30 kW, 40.2 A, 108.0 A; C2075 12.22 kW, 47.7 A, 127.5 A; C4004 0.86 kW, 1.6 A, 5.3 A; C4007 1.55 kW, 2.9 A, 9.3 A; C4015 2.78 kW, 5.2 A, 18.0 A; C4020 3.90 kW, 7.3 A, 23.8 A; C4030 6.25 kW, 11.7 A, 34.1 A; C4055 12.08 kW, 22.6 A, 58.5 A; C4075 14.70 kW, 27.5 A, 73.5 A. Input voltages: 85-132V rms single-phase, 170-253V single-phase, 170-253V three-phase, 342-528V three-phase (100V / 200V / 400V class).\n\nMigration: Kinetix 350 to Kinetix 5300 migration guide is 2198-RM005B. The Kinetix 5300 is integrated motion on EtherNet/IP, one port to two; it needs Studio 5000 v33.00 or later (RM005B p.46). The 5300 powers brakes up to 2.25 A directly. STO changes from a 6-pin plug to a 10-pin connector. MP cables are reusable; flying-lead cables replace the kit with 2198-K53CK-D15M. Similar-size example: 2097-V31PR0-LM becomes 2198-C1004-ERS. (2198-RM006 is the Ultra3000 to 5300 guide, not the 350 to 5300 guide.)", "wiring": {"power": "AC input through the input power connector. 24V DC control power through the 2198-TCON-24VDCIN36 control power input connector, with 2198-H040-P-T (frames 1-2) and 2198-H070-P-T T-connectors for control-power sharing between drives. AC line filters 2198-DB08-F or 2198-DBRxx-F (DBR20-F, DBR40-F) are required for CE and UK compliance. External passive shunt resistor as needed.", "feedback": "MFB 15-pin connector kit with battery backup for TLP/TL/TLY multi-turn encoders. AUX connector kit for master or load feedback. Feedback battery box 2198-KTBT maintains TLP motor position on power loss.", "safety": "Hardwired Safe Torque Off via the STO connector only; there is no integrated-safety variant. SF09 GuardStopInputFault occurs if the STO inputs disagree for more than 1.0 second.", "network": "Dual-port EtherNet/IP; linear, DLR (ring) and star topologies. Studio 5000 Logix Designer v33.00 or later. Controllers: CompactLogix 5370/5380/5480, GuardLogix 5370, ControlLogix 5570/5580, GuardLogix 5570/5580, with 1756-EN2T / EN2TR / EN3TR."}, "configuration": [{"step": "Set the network parameters from the front panel. From the Home Screen press Next to access the main menu, press Next to scroll until IP SETTINGS is displayed, press Select. Within the IP SETTINGS menu press Next to navigate IP ADDRESS, SUBNET, or GATE, then Select. If the character is editable it blinks: press Select to increment the active character, Next to move to the next character, Back to move to the previous character. After modifying the last character press Next (the display shows ACCEPT), then Select to accept and return to the IP SETTINGS submenu. Press Back to validate the settings; Net Err is displayed if any network settings are incompatible (or Protected Net is set to ON). Cycle 24V power to apply the changes.", "screen": "Drive front panel, IP SETTINGS menu", "parameter": "IP ADDRESS; SUBNET; GATE", "value": "Per network plan; cycle 24V power to apply", "source": "2198-UM005E-EN-P Ch6 p.99"}, {"step": "Download the Kinetix 5300 Add-On Profile (AOP) from the Product Compatibility and Download Center, following the download procedure in UM005E Chapter 6.", "screen": "Product Compatibility and Download Center", "parameter": "AOP: Kinetix 5300", "value": "Latest revision for the drive firmware", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Create the project in Studio 5000 Logix Designer v33.00 or later: select the controller, set the Revision, click Finish. Add the EtherNet/IP module (ControlLogix: 1756-EN2T / EN2TR / EN3TR) via I/O Configuration > New Module; in Module Definition set Time Sync Connection to 'Time Sync and Motion'; in Controller Properties > Date/Time tab check Enable Time Synchronization.", "screen": "Studio 5000 Logix Designer; I/O Configuration > New Module; Controller Properties > Date/Time tab", "parameter": "Time Sync Connection; Enable Time Synchronization", "value": "Time Sync and Motion; Checked", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Add the drive: right-click Ethernet > New Module, filter Motion + Allen-Bradley, select 2198-Cxxxx-ERS, enter a Name and the Ethernet Address (Private Network), click OK.", "screen": "New Module", "parameter": "Catalog number; Ethernet Address", "value": "2198-Cxxxx-ERS", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Create the axis: right-click the drive > Properties > Associated Axes tab > New Axis. Configure the Digital Input category and the Power category.", "screen": "Module Properties > Associated Axes tab", "parameter": "AXIS_CIP_DRIVE", "value": "New Axis", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Configure Axis Properties. SPM closed-loop motors: General, Motor, Scaling, Load, Actions, Exceptions, Parameter List. Induction motors: General, Motor, Frequency Control, Motor > Model, Motor > Analyzer (Calculate Model). Feedback-only axis: General + Master Feedback.", "screen": "Axis Properties", "parameter": "Motor > Analyzer: Calculate Model", "value": "Per motor", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Create the Motion Group: right-click Motion Groups > New Motion Group > Properties > Axis Assignment tab, move the axis from Unassigned to Assigned, then set the Attribute tab.", "screen": "Motion Groups > New Motion Group; Axis Assignment tab", "parameter": "Axis Assignment", "value": "Unassigned -> Assigned", "source": "2198-UM005E-EN-P Ch6"}, {"step": "Download the program and apply power. Startup display sequence: BOOT, then 5300 (dot segments light left to right as each start-up phase completes), then self-test shows 8.8.8.8, then the device state and the MAC or IP address scroll across the display. Device states: 00 waiting for connection to controller, 01 configuring device attributes, 02 waiting for group synchronization, 03 waiting for DC-bus to charge, 04 device is operational.", "screen": "Drive front-panel display", "parameter": "Device state", "value": "04 = operational", "source": "2198-UM005E-EN-P Ch6 Table 59"}, {"step": "Verify the MOD/NET indicators, verify the load is removed from each axis, then in the Motion Group right-click the axis, open Properties, and select Hookup Tests.", "screen": "Axis Properties > Hookup Tests", "source": "2198-UM005E Ch6 pp. 131-133"}, {"step": "Run the Marker, Motor Feedback, and Motor and Feedback tests (Commutation test only for third-party or custom PM motors not in the Motion Database). Click Start; when Test State shows Passed, click OK, confirm forward direction (Yes), and click Accept Test Results.", "screen": "Axis Properties > Hookup Tests", "source": "2198-UM005E Ch6 pp. 131-133"}, {"step": "For motor tests and autotune, right-click the axis, open Properties, select Motor > Analyzer, choose Calculate, Static, or Dynamic, click Start, then Accept Test Results and OK.", "screen": "Axis Properties > Motor > Analyzer", "source": "2198-UM005E Appendix C pp. 207-208"}], "commissioning": ["Verify wiring: AC input, 24V DC control power, line filter fitted for CE/UK, motor power and feedback cables correct, STO wiring correct.", "Verify the network settings on the front panel (IP ADDRESS, SUBNET, GATE) and cycle 24V power after any change.", "Remove the load from every axis before running hookup tests (uncontrolled motion and brake release are possible).", "Run Hookup Tests in Axis Properties: enter the Test Distance (units from the Scaling tab), then run Marker (manual shaft rotation, marker detection), Commutation (required for third-party / custom PM motors not in the Motion Database; see Commutation Test p.229 of UM005E), Motor Feedback (manual rotation, verify feedback wiring), and Motor and Feedback (drive rotates the motor; needs full bus power; run Motor Feedback first).", "On each test: Start, wait for Test State Executing to become Passed, confirm the forward direction Yes, then Accept Test Results.", "On a hookup failure, verify the DC bus voltage, the Scaling values, and the motor power and feedback wiring.", "Verify the drive reaches device state 04 (operational) and there are no active faults (Fxx) on the display or in Logix Designer."], "tuning": "Drives are configured for tuningless operation by default; if additional tuning is required see MOTION-AT005. Test and Tune the Axes: verify the MOD/NET indicators per p.137 and verify the load is removed from each axis. Hookup tests: in the Motion Group right-click the axis, open Properties, and select Hookup Tests. Test Distance is in position units per the Scaling category. Marker test verifies marker detection as the shaft is manually rotated; run it after Motor Feedback and Motor and Feedback. Commutation test verifies commutation offset and polarity; it is required for third-party or custom PM motors not in the Motion Database (see p.229). Motor Feedback test verifies feedback wiring as the shaft is manually rotated; run it before Motor and Feedback. Motor and Feedback test verifies motor power and feedback as the drive commands rotation and requires full bus power. Click Start; Test State goes Executing then Passed; click OK, confirm the forward direction is correct (Yes), and click Accept Test Results. On failure verify DC bus voltage, Scaling values, and motor power and feedback wiring, then rerun. Appendix C Motor Tests and Autotune (pp. 207-208): in Motor > Analyzer, Calculate uses nameplate estimates (Rs, X1, X2, rated flux current, slip speed; no measurements). Static test is for a shaft that cannot rotate or is coupled to a load; it measures Rs/X1/X2 and estimates flux current and needs initial estimates (auto-populated in Logix v29 and later). Dynamic test is for a motor disconnected from the load with the shaft turning and no travel limits; it measures Rs/X1/X2, flux current at 75% rated speed (rotational test), and slip speed at 100% speed / 50% torque default, with ramp times of at least 10 s. Steps: right-click the axis, open Properties, select Motor > Analyzer, click Start, then Accept Test Results and OK.", "faults": [{"code": "F2", "meaning": "Motor Commutation Fault - illegal Hall state transition", "fix": "Verify the Hall wiring is not open, shorted, or missing; use shielded cables; check grounds; replace the motor if it persists."}, {"code": "F3", "meaning": "Motor Overspeed Factory Limit - speed over 125% of maximum, or output frequency over 590 Hz", "fix": "Check the control loop tuning; reduce the velocity command."}, {"code": "F7", "meaning": "Motor Thermal Overload FL - thermal model over the factory limit", "fix": "Modify the command profile; reduce speed or increase time."}, {"code": "F10", "meaning": "Inverter Overcurrent - current over the instantaneous hardware limit", "fix": "Check the power cable for shorts; verify the windings are not shorted; verify the wire gauge; operate within the continuous rating; reduce acceleration."}, {"code": "F25", "meaning": "Pre-charge Failure - DC bus did not reach the factory voltage after charging, or went too high", "fix": "Check the AC input on all phases and the input power wiring; check for an inverter or motor shorted to ground; replace the power supply or drive if it persists."}, {"code": "F33", "meaning": "Bus Undervoltage FL - DC bus below the factory limit", "fix": "Verify the incoming AC voltage; monitor for glitches or line droop; install a UPS."}, {"code": "F35", "meaning": "Bus Overvoltage FL - DC bus above the factory limit", "fix": "Change the decel or motion profile; unplug the shunt connector and measure the resistance; add an external shunt or an active brake."}, {"code": "F45", "meaning": "Motor Feedback Data Loss FL - missed or corrupted serial feedback packets", "fix": "Check the feedback cable and connector; check that the power cable and feedback shields are secured; check that the motor frame is grounded; consult the F47 solutions."}, {"code": "F47", "meaning": "Motor Feedback Device Failure - Hiperface internal error (nn sub-codes 01-35, e.g. 01 incorrect alignment data, 29 transmitter current critical, 30 encoder temperature critical, 33-35 multiturn position error)", "fix": "Check the feedback cable continuity; check motor phasing U/V/W and the Hiperface 15-pin connections; improve noise reduction and bonding; cycle control power; check the shield; reduce shock and vibration; replace the motor."}, {"code": "F49", "meaning": "Brake Slip Exception - motor displacement exceeded the brake slip tolerance while the brake was engaged", "fix": "Check the motor brake."}, {"code": "F54", "meaning": "Excessive Position Error - position error exceeded Position Error Tolerance for Position Error Tolerance Time", "fix": "Check the position loop tuning; increase the feedforward gain; verify the sizing; check the motor power wiring; increase Position Error Tolerance and/or Time."}, {"code": "F61", "meaning": "Enable Input Deactivated - hardware enable input deactivated while the drive was enabled", "fix": "Check the drive enable input wiring; un-assign Enable as a digital input source."}, {"code": "SF09", "meaning": "GuardStopInputFault - STO input discrepancy for more than 1.0 second", "fix": "Verify the safety wiring at the STO connector, the terminations, that the cable/header is seated, and that +24V is within limits; check the safety inputs; reset the error and execute STO to verify."}, {"code": "F05", "meaning": "Motor overtemperature, factory limit.", "fix": "Keep the duty cycle and accel/decel within the continuous torque rating, check motor ambient temperature and cooling per RD006B, check that tuning gains are not too high per Table 71, and check motor size versus load."}, {"code": "F23", "meaning": "AC single phase loss.", "fix": "Measure the AC input voltage on all three phases per RD006B, then check fuses, breaker, and input terminals; check that 'AC Input Phasing' in Module Properties matches the actual supply (UM005E p.110)."}], "manualUrl": "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/2198-um005_-en-p.pdf", "sources": ["http://5.imimg.com/data5/SELLER/Doc/2025/9/549021007/HD/NP/BQ/44769851/allen-bradley-2198-c1004-ers-kinetix-5300-200v-class-servo-drive.pdf (Rockwell 2198-UM005E-EN-P Sep 2024, 240 pp)", "https://che-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/2198-um005_-en-p.pdf?A294B07783706861C5B2847587965D99BE72C473C29B96&ts=1789790791895 (Rockwell 2198-UM005A-EN-P Oct 2020)", "https://www.manualslib.com/manual/2526843/Rockwell-Automation-Allen-Bradley-Kinetix-5300.html (Rockwell 2198-UM005C-EN-P Feb 2022)", "https://literature.rockwellautomation.com/idc/groups/literature/documents/rm/2198-rm006_-en-p.pdf (Ultra3000 to Kinetix 5300 Migration Guide, 2198-RM006A-EN-P Dec 2020)", "https://literature.rockwellautomation.com/idc/groups/literature/documents/um/motion-um003_-en-p.pdf (Integrated Motion on the EtherNet/IP Network: Configuration and Startup, MOTION-UM003)", "Local mirror copy read 2026-11-20: .research/pdfs/um005-5300.txt (Rockwell 2198-UM005E-EN-P Sep 2024)", "https://www.tdl-ia.com/insights/kinetix-servo-drive-migration-300-350-6000-ultra3000.html (TDL, paraphrasing 2198-RM005B)", "https://www.tdl-ia.com/insights/kinetix-5300-fault-codes.html (TDL, citing 2198-RD006B-EN-P)"], "tbd": ["Full 2198-RD006 fault table beyond the verified rows (F05, F23 added; F10/F35 already listed) \u2014 remaining RD006 rows not directly readable (spreadsheet behind Rockwell Knowledgebase QA59764 login) \u2014 source needed: 2198-RD006B-EN-P"], "sourceFile": "kinetix.json"}, {"id": "ab-kinetix-5500", "category": "servo-drive", "family": "Kinetix 5500", "catalogNumbers": ["2198-H070-ERS2", "2198-H003-ERS", "2198-H008-ERS", "2198-H015-ERS", "2198-H025-ERS", "2198-H040-ERS", "2198-H070-ERS", "2198-CAPMOD-1300"], "name": "Kinetix 5500 Servo Drive", "whatItIs": "The Kinetix 5500 is a single-axis EtherNet/IP servo drive with hardwired Safe Torque Off (ERS) or integrated Safe Torque Off over EtherNet/IP (ERS2). Each drive is a complete servo axis that can run standalone or share AC, DC, or AC/DC bus power with other 5500 drives, and it connects to VP motors with a single cable carrying power, feedback and brake.", "whenToUse": "Pick the 5500 for one-drive-per-axis machines up to 14.6 kW where you want full CIP Motion with a Logix controller. Pick it over the 5700 when you do not need a separate DC-bus supply, dual-axis inverters, or power above 14.6 kW. Pick it over the 5300 when you need shared-bus multi-axis operation or integrated safety (ERS2). Pick it over the 5100 when the axis is driven by a Logix controller rather than running standalone indexing.", "selection": "Size with Rockwell Motion Analyzer. Table 3 of UM001M: 2198-H003 0.2/0.3 kW, 1.4 A 0-pk continuous / 3.5 A peak; H008 0.5/0.8/1.6 kW, 3.5 / 8.8 A; H015 1.0/1.5 kW, 7.1 / 17.7 A; H025 2.4/3.2/5.1 kW, 11.3 / 28.3 A; H040 4.0/8.3 kW, 18.4 / 45.9 A; H070 7.0/14.6 kW, 32.5 / 81.3 A. Input: 195-264V rms single-phase, 195-264V three-phase, or 324-528V rms three-phase. Frames 1-3. CAPMOD-1300 capacitor module: 1360 uF minimum, 650V DC nominal. Combined motor power cable length for all axes on the same DC bus must not exceed 250 m.", "wiring": {"power": "AC input through the input connector. Shared AC/DC power uses T-connector kits 2198-H040-x-x (frames 1-2) and 2198-H070-x-x (frame 3): ADP-IN for the first drive (mains AC + 24V DC + DC bus T), A-T for AC sharing, D-T for DC sharing, P-T for control power sharing, plus AD-T, AP-T and DP-T combinations. 24V DC control, digital-input, safety and motor-brake power from a 1606-XLxxx supply. AC line filters 2198-DB08-F / DB20-F are required for CE (DBRxx-F for new systems). External shunt 2097-R6/R7.", "feedback": "Single cable 2090-CSxM1DF (flying lead: power + feedback + optional 24V brake) for VP motors; 2090-CSxM1DG with longer leads. 2090-CFBM7DF-CEAxxx feedback cables and 2090-CPxM7DF power/brake cables for MP motors. DSL feedback via the 2198-KITCON-DSL kit. Hiperface motors (MPL/MPM/MPF/MPS, MPAS/MPAR/MPAI, LDAT) connect through the 2198-H2DCK Hiperface-to-DSL converter kit, series B or later. Optional 2198-ABQE encoder output module (DIN rail, EtherNet/IP) outputs encoder pulses, for example to line-scan vision cameras.", "safety": "ERS drives use a hardwired STO connector. ERS2 drives provide STO over EtherNet/IP (integrated safety), which needs Studio 5000 Logix Designer v24.00 or later. Safety rating SIL 3 / PLe.", "network": "Dual-port EtherNet/IP; linear, DLR (ring) and star topologies. A DLR supervisor is required in a ring (for example a 1783-ETAP). Use 1585J shielded Ethernet cable. Studio 5000 Logix Designer v21.00 or later (v24+ for ERS2). Controllers: CompactLogix 5370/5380/5480, GuardLogix 5370, ControlLogix 5570/5580, GuardLogix 5570, with 1756-EN2T / EN2TR / EN3TR."}, "configuration": [{"step": "Set the drive IP address from the LCD display: SETUP > NETWORK, choose STATIC IP (the default) or DHCP. Factory static IP is 192.168.1.1. Changes take effect only after a power cycle. The address can also be changed through the RSLinx Module Configuration dialog.", "screen": "Drive LCD display, SETUP > NETWORK", "parameter": "Static IP / DHCP; IP address", "value": "Factory static IP 192.168.1.1", "source": "2198-UM001M-EN-P Ch6"}, {"step": "Download the 2198 CIP Motion Kinetix 5500/5700 Add-On Profile (AOP) from the Product Compatibility and Download Center at rok.auto/pcdc. AOP rule (same as 5700): firmware 4.001 with Logix v26/27 needs the AOP, v28+ does not; firmware 5.001 with v26/27/28 needs the AOP, v29+ does not.", "screen": "Product Compatibility and Download Center", "parameter": "AOP: 2198 CIP Motion Kinetix 5500/5700", "value": "Per firmware / Logix version table (Table 58)", "source": "2198-UM001M-EN-P Ch6 Table 58"}, {"step": "Create the project in Studio 5000 Logix Designer v21.00 or later (v24.00+ for ERS2 drives): select the controller, set the Revision, click Finish.", "screen": "Studio 5000 Logix Designer, New Project", "parameter": "Controller Revision", "value": "v21.00+ (v24.00+ for ERS2)", "source": "2198-UM001M-EN-P Ch6"}, {"step": "ControlLogix / GuardLogix only: add the EtherNet/IP module via I/O Configuration > New Module, select 1756-EN2T / EN2TR / EN3TR. In Module Definition set Time Sync Connection to 'Time Sync and Motion'. Then Controller Properties > Date/Time tab > check Enable Time Synchronization.", "screen": "I/O Configuration > New Module; Module Definition; Controller Properties > Date/Time tab", "parameter": "Time Sync Connection; Enable Time Synchronization", "value": "Time Sync and Motion; Checked", "source": "2198-UM001M-EN-P Ch6"}, {"step": "Add the drive: right-click Ethernet > New Module, filter Motion + Allen-Bradley, select 2198-Hxxx-ERS or -ERS2, enter a Name and the Ethernet Address (Private Network).", "screen": "New Module", "parameter": "Catalog number; Ethernet Address", "value": "2198-Hxxx-ERS / -ERS2", "source": "2198-UM001M-EN-P Ch6"}, {"step": "Create the axis: Module Properties > Associated Axes tab > New Axis (AXIS_CIP_DRIVE is the default data type). For ERS2 drives, configure the Drive Safety tab and the Safety tab in Module Properties.", "screen": "Module Properties > Associated Axes tab; Drive Safety tab; Safety tab", "parameter": "AXIS_CIP_DRIVE", "value": "New Axis", "source": "2198-UM001M-EN-P Ch6"}, {"step": "Configure Axis Properties: General, Motor, Scaling, Load, Actions, Exceptions, Parameter List. For SPM motors follow the same categories. For induction motors use General, Motor, Frequency Control; the Parameter List category includes SkipSpeed1 and SkipSpeedBand. For a feedback-only axis use General + Master Feedback.", "screen": "Axis Properties", "parameter": "SkipSpeed1; SkipSpeedBand", "value": "Per application", "source": "2198-UM001M-EN-P Ch6; 2198-UM001D-EN-P p.129"}, {"step": "Create the Motion Group: right-click Motion Groups > New Motion Group. In Properties > Axis Assignment tab move the axis from Unassigned to Assigned, then set the Attribute tab.", "screen": "Motion Groups > New Motion Group; Axis Assignment tab", "parameter": "Axis Assignment", "value": "Unassigned -> Assigned", "source": "2198-UM001M-EN-P Ch6"}, {"step": "In the Module Properties > Power tab set the Bus Configuration (standalone, shared AC, shared DC, shared AC/DC, or shared AC/DC hybrid) and the Bus Sharing Group. Download the program and apply power.", "screen": "Module Properties > Power tab", "parameter": "Bus Configuration; Bus Sharing Group", "value": "Per system layout", "source": "2198-UM001M-EN-P Ch6"}, {"step": "Single-phase operation is possible only when Module Properties > Power tab > Bus Configuration is set to Standalone.", "screen": "Module Properties > Power", "parameter": "Bus Configuration", "value": "Standalone", "source": "2198-UM001M Ch6 pp. 116-118"}, {"step": "Set AC Input Phasing to Single Phase. Single-phase operation is limited to 2198-H003-ERSx, 2198-H008-ERSx, and 2198-H015-ERSx.", "screen": "Module Properties > Power", "parameter": "AC Input Phasing", "value": "Single Phase", "source": "2198-UM001M Ch6 pp. 116-118"}, {"step": "Voltage 200-240 VAC, input range 195-264V AC rms.", "screen": "Module Properties > Power", "parameter": "Voltage", "value": "200-240 VAC (195-264V AC rms input)", "source": "2198-UM001M Ch6 pp. 116-118"}, {"step": "The 2198-H003-ERS and any drive in standalone single-phase operation are NOT compatible with the Kinetix 5500 capacitor module (Table 21).", "screen": "Module Properties > Power", "source": "2198-UM001M Ch6 pp. 116-118"}, {"step": "For single-phase operation, remove only the AC ground screw to reduce leakage current (this can affect EMC performance).", "screen": "Ch3 grounding", "source": "2198-UM001M Ch3"}, {"step": "In New Module > Module Definition, set Connection: Motion only (ControlLogix/GuardLogix; on ERS2, motion by this controller and safety by another controller with a Safety-only connection; on ERS, hardwired STO only), Motion and Safety (GuardLogix/Compact GuardLogix; motion and safety by this controller), or Safety only (motion by another controller with a Motion-only connection). When 'Safety' appears in the Connection mode, integrated safety is implied.", "screen": "New Module > Module Definition > Connection", "parameter": "Connection", "value": "Motion only / Motion and Safety / Safety only", "source": "2198-UM001M Ch6 pp. 112-115"}, {"step": "The Safety Network Number (SNN) populates automatically when Connection includes Motion and Safety or Safety-only.", "screen": "New Module > Module Definition", "parameter": "Safety Network Number (SNN)", "source": "2198-UM001M Ch6 pp. 112-115"}, {"step": "In Module Properties > Drive Safety tab, set Restart Type to Manual (a 0 to 1 transition on SO.Reset is required to allow torque after SO.SafeTorqueOff goes 0 to 1) or Automatic (torque is allowed by SO.SafeTorqueOff 0 to 1; SO.Reset is used only for resetting safety faults). Click Apply.", "screen": "Module Properties > Drive Safety", "parameter": "Restart Type", "value": "Manual / Automatic", "source": "2198-UM001M Ch6 pp. 112-115"}, {"step": "On the Safety tab, verify the connection based on the drive catalog (2198-Hxxx-ERS2), the drive SNN, the GuardLogix slot, the GuardLogix SNN, the path, and the configuration signature; a mismatch loses the connection (yellow yield icon after download).", "screen": "Module Properties > Safety", "source": "2198-UM001M Ch6 pp. 112-115"}, {"step": "In Advanced, set the Connection Reaction Time Limit. The smallest Input RPI allowed is 6 ms; a small RPI consumes bandwidth and can cause nuisance trips.", "screen": "Module Properties > Safety > Advanced", "parameter": "Connection Reaction Time Limit", "source": "2198-UM001M Ch6 pp. 112-115"}, {"step": "Out-of-box state: ERS2 drives ship out-of-box; in out-of-box state, motion-producing power is allowed by STO unless an integrated safety connection configuration has been applied at least once. To restore out-of-box: Connection tab, check Inhibit Module, click Apply, then Safety tab > Configuration Ownership > Reset Ownership (authorized personnel only; rejected if any active connection), then cycle drive power. If power is not cycled, the drive does not transition and maintains STO; when returned to out-of-box, STO safety integrity is lost.", "screen": "Module Properties > Connection / Safety > Configuration Ownership", "source": "2198-UM001M Ch10 pp. 169-170"}], "commissioning": ["Verify wiring: AC input, 24V DC control power from the 1606-XLxxx supply, shared-bus T-connectors seated, motor power/brake and feedback cables correct, line filter fitted for CE.", "Verify the IP address on the LCD (factory 192.168.1.1) and that the controller time synchronization is enabled.", "Remove the load from every axis before running hookup tests (uncontrolled motion and brake release are possible).", "Run Hookup Tests in Axis Properties: enter the Test Distance (units from the Scaling tab), then run Marker (manual shaft rotation, marker detection), Commutation (third-party motors only for the 5500), Motor Feedback (manual rotation, verify feedback wiring), and Motor and Feedback (drive rotates the motor; needs full bus power; run Motor Feedback first).", "On each test: Start, wait for Test State Executing to become Passed, confirm the forward direction Yes, then Accept Test Results. The LCD shows TESTING, for example DC BUS: 218.3V.", "On a hookup failure, verify the DC bus voltage, the Scaling values, and the motor power and feedback wiring.", "Run the load-observer tuning or autotune, enable the drive with MSO then MSF for a few seconds, and listen for squealing before putting the machine into service.", "Verify there are no active faults on the display (FLT Sxx) or in Logix Designer, and verify the STO function."], "tuning": "PM motors use the load observer. In the Autotune tab set Application Type to Custom, Loop Response to Medium, Load Coupling to Rigid, with only Velocity Feedforward checked; UNCHECK Torque Low Pass Filter (it is checked by default). In the Load tab check Use Load Ratio and set Load Ratio to 0. In the Observer tab set Configuration to 'Load Observer with Velocity Estimate' for the Position Loop and 'Load Observer Only' for the Velocity Loop; the load observer is NOT available for the Torque Loop. In the Compliance tab set Adaptive Tuning Configuration to 'Tracking Notch'. Enable the drive with MSO then MSF for a few seconds and listen for squealing; if it squeals, set the Torque Notch Filter Frequency (Hz) in Load > Compliance. See MOTION-AT005. Induction motors: Automatic FluxUpControl is recommended; remove the load first, then reattach and repeat. In the Autotune category set Travel Limit to 50.0 and Speed to 2.0 (example values from the manual), Direction defaults to Forward Uni-directional; click Start, wait for Executing to become Success, then Accept Tuned Values.", "faults": [{"code": "FLT S02", "meaning": "MTR COMMUTATION - illegal Hall state", "fix": "Verify the Hall feedback wiring is not open, shorted, or missing; use shielded cables."}, {"code": "FLT S03", "meaning": "MTR OVERSPEED FL - motor speed over 125% of maximum, or output frequency over 590 Hz", "fix": "Check the control loop tuning; reduce the velocity command."}, {"code": "FLT S07", "meaning": "MTR OVERLOAD FL - motor thermal model over the factory limit", "fix": "Modify the command profile; reduce speed or increase time."}, {"code": "FLT S10", "meaning": "INV OVERCURRENT - current over the instantaneous hardware limit", "fix": "Check the motor power cable for shorts; verify the motor windings are not shorted."}, {"code": "FLT S15", "meaning": "CONV OVERCURRENT - converter overcurrent", "fix": "Reduce the acceleration times of all drives sharing the DC bus."}, {"code": "FLT S16", "meaning": "GROUND CURRENT - ground current detected", "fix": "Check the motor power wiring and cable; replace the motor if the fault persists."}, {"code": "FLT S20", "meaning": "CONV OVERLOAD FL - converter thermal model over the factory limit", "fix": "Reduce the duty cycle or the number of follower drives on the shared DC bus."}, {"code": "FLT S25", "meaning": "CONV PRECHARGE FAILURE - DC bus did not reach the factory voltage after charging, or went too high", "fix": "Check the AC input on all phases and the input power wiring; check for an inverter or motor shorted to ground."}, {"code": "FLT S33", "meaning": "BUS UNDERVOLT FL - DC bus below the factory limit", "fix": "Verify the incoming AC voltage; monitor for glitches or line droop; install a UPS."}, {"code": "FLT S45", "meaning": "FDBK COMM FL - motor feedback communication fault", "fix": "Check the feedback cable and connector, check the shield terminations, and check that the motor frame is grounded."}, {"code": "FLT S47", "meaning": "FDBK DEVICE FAILURE - feedback device internal error", "fix": "Check the feedback cable continuity and the motor phasing; cycle control power; replace the motor if it continues."}, {"code": "S04", "meaning": "Motor overspeed, user limit. Speed exceed
