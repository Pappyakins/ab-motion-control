ding and the motor and drive output wiring for a grounded condition."}], "manualUrl": "https://lvmcc-pubs.rockwellautomation.com/pubs/750-PM001Q-EN-P.pdf", "sources": ["https://lvmcc-pubs.rockwellautomation.com/pubs/750-PM001Q-EN-P.pdf", "http://docs.plcexchange.net/allen-bradley/howto/750-TD001.pdf", "https://www.manualsdir.com/manuals/577755/rockwell-automation-21g-powerflex-750-series-ac-drives-programming-manual-20g-powerflex-750-series-ac-drives-programming-manual-20f-powerflex-750-series-ac-drives-programming-manual.html?page=113", "https://www.docsity.com/en/docs/powerflex-753-vfd-fault-codes/9567207/", "https://lvmcc-pubs.rockwellautomation.com/cutsheets/20F11ND065JA0NNNNN.pdf"], "tbd": ["750-series stop mode parameter numbers (P370 [Stop Mode A] / P371 [Stop Mode B]) - needed source: 750-PM001Q Chapter 3.", "Exact 753 embedded I/O terminal assignments (digital/analog I/O points on the main control board) - needed source: 750-IN001 installation instructions.", "750-UM001 user manual direct literature link - needed source: Rockwell literature library search for 750-UM001."], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-755", "category": "vfd", "family": "PowerFlex 755", "catalogNumbers": ["20G11ND5P0AA0NNNNN"], "name": "PowerFlex 755 AC Drive", "whatItIs": "The performance tier of Rockwell's PowerFlex 750-series (bulletin 20G). It covers 0.75 to 1500 kW (1 to 2000 Hp) in wall-mount Frames 1-7 and floor-mount Frames 8-10, with five option slots, embedded dual-port EtherNet/IP, FORCE vector control, sensorless vector and permanent-magnet motor control, DeviceLogix, and optional Integrated Safety and Integrated Motion on EtherNet/IP.", "whenToUse": "Pick the 755 over the 753 when you need embedded dual-port EtherNet/IP with Device Level Ring, five option slots, Integrated Motion on EtherNet/IP alongside Kinetix drives, Safe Speed Monitor, open-loop PM flux vector control, or power above 400 Hp / 270 kW. Pick the 753 for general-purpose duty up to 400 Hp where the 755's extra slots and embedded network are not needed. Pick the 755T when the job needs low harmonics, regeneration or a common DC bus.", "selection": "Size by motor FLA against the drive rated output amps in 750-TD001, Normal Duty or Heavy Duty. Voltage classes: 200-240V (0.37-132 kW), 380-480V (0.75-1400 kW), 600V (up to 1500 Hp) and 690V (7.5-1500 kW). Frames 1-5 are IP20 NEMA/UL Type 1 wall mount; Frames 6-7 are IP00 open wall mount; Frames 8-10 are floor-mount cabinets (21G adds a pre-engineered power option bay). A DC link choke is included on all frames; the internal brake transistor is standard on Frames 1-5 and optional on Frames 6-7.", "wiring": {"power": "Three-phase input to R/L1, S/L2, T/L3; motor to U/T1, V/T2, W/T3; DC+ and DC- bus terminals; PE ground. DC link choke is built in on all frames. Internal brake transistor is standard on Frames 1-5, optional on Frames 6-7. Frames 8-10 floor-mount drives include integrated AC line fuses and a roll-out design.", "feedback": "Feedback, I/O, safety and communication modules fit the five option slots. Flux vector with or without encoder; interior permanent-magnet motors are supported with and without encoder on Frames 2-7 and with encoder on Frames 8-10. Unlike the 753, the 755 allows flux vector open-loop control of PM motors. Check P3 [Mtr Vel Fdbk] against P2 [Commanded SpdRef] when diagnosing a speed error.", "safety": "Safe Torque-Off option module 20-750-S3 is available as a networked or hardwired solution, both certified SIL 3, PLe, Cat 3, with a 15 ms maximum reaction time. Safe Speed Monitor option is certified SIL 3, PLe, Cat 4 and lets you safely monitor and control the speed of the application. See 750-UM004.", "network": "Dual-port EtherNet/IP is embedded on the main control board and supports linear, star and Device Level Ring topologies. The 20-750-ENETR dual-port option module can be added; in Tap mode (755 only) its ENET3 DEVICE port transfers Integrated Motion on EtherNet/IP data to the embedded adapter. Automatic Device Configuration (ADC) downloads the full drive configuration to a replacement drive automatically."}, "configuration": [{"step": "Enter motor nameplate volts", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P25 [Motor NP Volts]", "value": "Motor nameplate rated volts", "source": "750-PM001Q parameter list"}, {"step": "Enter motor nameplate amps, hertz, RPM and power", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P26 [Motor NP Amps] / P27 [Motor NP Hertz] / P28 [Motor NP RPM] / P30 [Motor NP Power]", "value": "Copy all four from the motor nameplate", "source": "750-PM001Q parameter list"}, {"step": "Set motor control mode", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P35 [Motor Ctrl Mode]", "value": "V/Hz, sensorless vector, flux vector (FORCE) or PM control; open-loop PM flux vector is allowed on the 755", "source": "750-PM001Q; 750-PM001J"}, {"step": "Set maximum frequency and voltage", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P36 [Maximum Voltage] / P37 [Maximum Freq]", "value": "P37 limits the top speed; check P520 [Max Fwd Speed] and P521 [Max Rev Speed] agree with it", "source": "750-PM001Q; 750-IN001C"}, {"step": "Run autotune", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P70 [Autotune] / P71 [Autotune Torque]", "value": "Static Tune (motor still) or Rotate Tune (motor spins, uncoupled if possible)", "source": "750-PM001Q; 750-IN001C"}, {"step": "Set accel and decel times", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P535 [Accel Time 1] / P537 [Decel Time 1]", "value": "Ramp times in seconds; lengthen if the drive hits current limit or overvoltage on stopping", "source": "750-IN001C; PFLEX-AP005A"}, {"step": "Select the speed reference source", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P545 [Spd Ref A Sel]", "value": "Main speed reference source in Auto mode; P550 [Spd Ref B Sel] is the alternate, switched by digital input P173-P175 [DI Speed Sel]", "source": "750-PM001J"}, {"step": "Assign start/stop digital inputs", "screen": "HIM Parameters (Linear List) or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P158 [DI Stop] / P161 [DI Start] / P162 [DI Fwd Reverse]", "value": "Wire 3-wire control to the assigned inputs, or use P163 [DI Run] / P164 [DI Run Forward] for 2-wire control", "source": "750-PM001Q; PFLEX-AP005A"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; confirm the supply voltage matches the drive voltage class.", "Confirm fuses/breaker per 750-TD001 and that the DC link choke and PE ground are in place.", "Check motor leads on U/T1, V/T2, W/T3 and that feedback, safety and network option modules are seated in the correct slots.", "Enter the motor nameplate data (P25-P31) before the first run; do not trust defaults.", "Run P70 autotune (Static Tune first; Rotate Tune uncoupled if the application allows).", "Jog the motor at low speed, check rotation and that P3 [Mtr Vel Fdbk] follows P2 [Commanded SpdRef].", "Run up to full speed, compare P7 [Output Current] with P26 [Motor NP Amps], and confirm the Logix controller can start/stop the drive over the embedded EtherNet/IP port.", "Verify ADC and, where used, Integrated Motion: the drive should appear in Studio 5000 with its axis configured and the configuration stored in the controller project."], "tuning": "Autotune is P70 [Autotune] with P71 [Autotune Torque]; it sets P73 [IR Voltage Drop], P74 [Ixo Voltage Drop], P75 [Flux Current Ref] and P76 [Total Inertia] (with P77 [Inertia Test Lmt]). Static Tune measures the motor without spinning it; Rotate Tune spins the motor and gives the better result, so run it uncoupled where the machine allows. If motor data was entered wrong or autotune was not run, the drive will not accelerate to commanded speed or motor operation will be unstable - correct the nameplate data and re-run the tune. For flux vector work, P35 [Motor Ctrl Mode] must match the feedback fitted; a Type 2 alarm bit will flag an invalid combination (for example flux vector with a PM motor and open-loop feedback on a 753).", "faults": [{"code": "2", "meaning": "Auxiliary Input: an auxiliary input interlock is open.", "fix": "Check the auxiliary input wiring and the digital input assigned in P157 [DI Aux Fault]."}, {"code": "3", "meaning": "Power Loss: the DC bus voltage stayed below the power-loss level for longer than the programmed time.", "fix": "Check parameters P449, P451, P454 and P455; examine the incoming voltage source and supply."}, {"code": "4", "meaning": "UnderVoltage: DC bus voltage fell below the value set in P461 [UnderVltg Level].", "fix": "Check parameters P460 and P461; examine the incoming voltage source."}, {"code": "5", "meaning": "OverVoltage: the DC bus voltage exceeded the maximum value.", "fix": "Monitor P11 [DC Bus Volts]; check for high line voltage, transients or regenerative load; extend decel time or fit dynamic braking."}, {"code": "7", "meaning": "Motor Overload: an internal electronic overload trip occurred.", "fix": "Check P410 [Motor OL Actn]; check P7 [Output Current], P26 [Motor NP Amps], P413 [Mtr OL Factor] and P414 [Mtr OL Hertz]; reduce the load."}, {"code": "8", "meaning": "Heatsink OvrTemp: heatsink temperature exceeded 100% of the drive temperature (115-120 C).", "fix": "Check cooling airflow and ambient temperature; check P943 [Drive Temp Pct] and P944 [Drive Temp C]; clean heatsink fins."}, {"code": "12", "meaning": "HW OverCurrent: drive output current exceeded the hardware current limit.", "fix": "Examine the current limiters and the load; check for a shorted motor or wiring fault."}, {"code": "13", "meaning": "Ground Fault: a current path to earth ground greater than 25% of the drive rating.", "fix": "Inspect grounding and the motor and drive output wiring for a grounded condition."}], "manualUrl": "https://lvmcc-pubs.rockwellautomation.com/pubs/750-PM001Q-EN-P.pdf", "sources": ["https://lvmcc-pubs.rockwellautomation.com/pubs/750-PM001Q-EN-P.pdf", "http://docs.plcexchange.net/allen-bradley/howto/750-TD001.pdf", "https://www.manualsdir.com/manuals/577755/rockwell-automation-21g-powerflex-750-series-ac-drives-programming-manual-20g-powerflex-750-series-ac-drives-programming-manual-20f-powerflex-750-series-ac-drives-programming-manual.html?page=113", "https://lvmcc-pubs.rockwellautomation.com/cutsheets/20G11ND5P0AA0NNNNN.pdf", "https://lvmcc-pubs.rockwellautomation.com/cutsheets/20-750-ENETR.pdf"], "tbd": ["750-series stop mode parameter numbers (P370 [Stop Mode A] / P371 [Stop Mode B]) - needed source: 750-PM001Q Chapter 3.", "Exact 755 embedded I/O terminal assignments on the main control board - needed source: 750-IN001 installation instructions.", "750-UM001 user manual direct literature link - needed source: Rockwell literature library search for 750-UM001."], "sourceFile": "powerflex.json"}, {"id": "ab-powerflex-755t", "category": "vfd", "family": "PowerFlex 755T", "catalogNumbers": ["20G21ND077JA0NNNNN"], "name": "PowerFlex 755T AC Drive", "whatItIs": "The TotalFORCE generation of the PowerFlex 750-series (bulletins 20G/20J): the 755TL low-harmonic drive, the 755TR regenerative drive, the 755TM common-bus drive system, and the 755TS smart drive. An active front end replaces the standard 6-pulse rectifier, so the drive mitigates harmonics, corrects power factor, and (on TR/TM) regenerates braking energy back to the supply. TotalFORCE technology adds adaptive motor control and predictive diagnostics that track the health of drive and motor components.", "whenToUse": "Pick a 755T over a standard 755 when the site needs low harmonics (IEEE 519 compliance or a generator supply), when braking energy is large enough to regenerate instead of burning in a resistor, or when several drives should share a common DC bus. The 755TL is for low-harmonic non-regenerative duty (7.5-1400 kW / 10-1800 Hp); the 755TR is for regenerative duty (7.5-4500 kW / 10-6000 Hp); the 755TM is a predesigned common-bus system with regenerative bus supplies and common-bus inverters (160-4500 kW). Pick the standard 755 when harmonics and regeneration are not a problem and cost matters.", "selection": "Size by motor FLA against the drive rated output amps in 750-TD100, Normal Duty or Heavy Duty. The 755TS example 20G21ND077JA0NNNNN is 77 A normal duty (60 Hp) / 65 A heavy duty (50 Hp), Frame 5, IP20. Total harmonic distortion is less than 5%. The 755T is a separate platform from the standard 750-series (bulletins 20J/20M/20N) and is not covered in 750-TD001; use 750-TD100. Voltage classes 400/480/600/690V; enclosures IP21 UL Type 1 and IP54 UL Type 12.", "wiring": {"power": "The 755T is built from modules: a line-side converter draws energy from the AC line, an LCL filter provides low-harmonic capability and minimises current distortion into the utility grid, and a motor-side inverter drives the motor. A pre-charge module regulates the input AC current. One control pod per common-bus inverter and one for the regenerative bus supply; the control pod holds the control platform with I/O, safety and feedback slots. Follow the 755T installation instructions for the module layout - it is not a single-box drive like the 753/755.", "feedback": "Feedback, I/O and safety fit the control pod option slots, as on the 755. TotalFORCE control supports permanent-magnet motors and adaptive control of torque, velocity and position. Confirm the feedback device selection in 750-TD100 for the exact 755T variant.", "safety": "Integrated Safety Safe Torque-Off is available on 755T drive products; the STO function reaction time is 15 ms maximum (750-UM004 covers both 755 and 755T products). Confirm the exact safety option catalog for the 755T variant in 750-TD100.", "network": "Built-in EtherNet/IP adapter (see 750COM-UM009, PowerFlex Drives with TotalFORCE Control Built-in EtherNet/IP Adapter User Manual). Settings made in the drive Add-on Profile are saved in the controller project, and Automatic Device Configuration downloads them when a replaced drive or option module no longer matches. Configuration and programming are via the HIM, Studio 5000 Logix Designer, or Connected Components Workbench."}, "configuration": [{"step": "Enter motor nameplate data", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P25 [Motor NP Volts] / P26 [Motor NP Amps] / P27 [Motor NP Hertz] / P28 [Motor NP RPM] / P30 [Motor NP Power]", "value": "Copy all five from the motor nameplate", "source": "750-PM001Q parameter list (750-series family); 755T parameter set to be confirmed in 750-UM003"}, {"step": "Set motor control mode", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P35 [Motor Ctrl Mode]", "value": "TotalFORCE control mode to suit the motor type (induction or PM)", "source": "750-TD100"}, {"step": "Set maximum frequency", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P37 [Maximum Freq]", "value": "Top speed limit for the application", "source": "750-PM001Q parameter list (750-series family)"}, {"step": "Run autotune", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P70 [Autotune]", "value": "Static Tune (motor still) or Rotate Tune (motor spins, uncoupled if possible)", "source": "750-PM001Q (750-series family); 755T autotune procedure to be confirmed in 750-UM003"}, {"step": "Set accel and decel times", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P535 [Accel Time 1] / P537 [Decel Time 1]", "value": "Ramp times in seconds", "source": "750-PM001Q (750-series family)"}, {"step": "Select the speed reference source", "screen": "HIM Parameters or Studio 5000 drive Add-On Profile, Parameters tab", "parameter": "P545 [Spd Ref A Sel]", "value": "Main speed reference source in Auto mode", "source": "750-PM001Q (750-series family)"}], "commissioning": ["Lock out and tag out, verify zero voltage before touching terminals; confirm the supply voltage matches the drive voltage class.", "Confirm the line-side converter, LCL filter, pre-charge module and motor-side inverter modules are all present and cabled per the 755T installation instructions.", "Enter the motor nameplate data before the first run; do not trust defaults.", "Run the autotune, then jog the motor at low speed and check rotation.", "Run up to full speed, compare output current with motor nameplate amps, and confirm the Logix controller can start/stop the drive over the built-in EtherNet/IP port.", "On a 755TL, confirm the harmonic performance and power factor at load; on a 755TR, confirm regeneration back to the supply during braking.", "Verify ADC: the controller project should hold the drive configuration so a swapped drive is reconfigured automatically."], "tuning": "TotalFORCE technology adapts automatically to changes in resonance frequency over time and compensates for machine characteristics that change, and it continuously monitors operation to give real-time diagnostics and remaining-life estimates for critical components. Run the autotune (same Static Tune / Rotate Tune approach as the 750-series) after entering the motor nameplate data, then let the adaptive control settle the torque and velocity loops; do not hand-tune gains the adaptive loop is managing. If the drive reports a predictive-maintenance event (for example fan or bearing life), treat it as a planned-maintenance trigger, not a nuisance alarm.", "faults": [{"code": "2", "meaning": "Auxiliary Input: an auxiliary input interlock is open.", "fix": "Check the auxiliary input wiring and the digital input assigned for the aux fault."}, {"code": "4", "meaning": "UnderVoltage: DC bus voltage fell below the configured undervoltage level.", "fix": "Check the undervoltage level and action parameters; examine the incoming voltage source."}, {"code": "5", "meaning": "OverVoltage: the DC bus voltage exceeded the maximum value.", "fix": "Monitor DC bus volts; check for high line voltage, transients or regenerative load; extend decel time."}, {"code": "7", "meaning": "Motor Overload: an internal electronic overload trip occurred.", "fix": "Check the motor overload action and factor parameters; check output current against motor nameplate amps; reduce the load."}, {"code": "12", "meaning": "HW OverCurrent: drive output current exceeded the hardware current limit.", "fix": "Examine the current limiters and the load; check for a shorted motor or wiring fault."}, {"code": "13", "meaning": "Ground Fault: a current path to earth ground greater than 25% of the drive rating.", "fix": "Inspect grounding and the motor and drive output wiring for a grounded condition."}], "manualUrl": "https://www.rockwellautomation.com/en-pl/products/hardware/vfds-variable-frequency-drives/powerflex-755t.html", "sources": ["https://gesrepair.com/wp-content/uploads/2020/Allen_Bradley_PDF/Allen-Bradley_20G1G3D960LNDNNNNN-P15-P17.pdf", "https://www.nhpnz.co.nz/public/assets/pim/Original/10044/20G21ND077JA0NNNNN-NZ-PF755TS-Variable-Speed-Drive-Datasheet.pdf", "https://media.distributordatasolutions.com/158/jsonl_allen_bradley/7c0df31ee14d77caaa2c6731227fc220ea80f184.pdf", "https://www.rockwellautomation.com/en-pl/products/hardware/vfds-variable-frequency-drives/powerflex-755t.html"], "tbd": ["755T user manual publication number and direct literature link (expected 750-UM003) - needed source: Rockwell literature library search for the PowerFlex 755T user manual.", "755T-specific fault and alarm event numbers (TotalFORCE predictive events) - the six faults listed here use the 750-series event framework; confirm against the 755T user manual.", "Exact 755T autotune parameter numbers and the 755TL/TR catalog-number pattern (20J prefix) - needed source: 750-TD100 full text.", "Exact safety option catalog for 755T STO - needed source: 750-TD100."], "sourceFile": "powerflex.json"}, {"id": "ab-vpf", "category": "servo-motor", "family": "Kinetix VP VPF", "catalogNumbers": ["VPF-B1303F-PJ14AF"], "name": "Kinetix VP VPF Servo Motor", "whatItIs": "The Kinetix VP VPF is the food-grade version of the VPL low-inertia servo motor. It combines the characteristics of the VPL \u2014 single-cable DSL connection to Kinetix 5500/5700 drives, windings matched to those drives \u2014 with features for food and beverage applications: food-grade epoxy coating, food-grade shaft seal, noncorrosive fasteners and a stainless steel shaft (KNX-TD001A p48). The example motor VPF-B1303F-PJ14AF is a 480 V, 130 mm frame, 3-stack motor with an 18-bit multi-turn DSL encoder, keyed shaft, single SpeedTec DIN connector, 24 V DC holding brake and food-grade shaft seal.", "whenToUse": "Pick VPF for food packaging, volumetric filling, form-fill-seal and food handling axes on a Kinetix 5500/5700 system \u2014 anywhere the motor is exposed to food, washdown splash or cleaning chemicals and a standard VPL would corrode or contaminate. Pick VPL instead for the same motion in a dry, non-food environment (same performance, lower cost, no food-grade seal to maintain). Pick MPF instead if the drive is not a 5500/5700. For meat and poultry applications Rockwell recommends the stainless-steel VPS motors instead of VPF (KNX-TD001A p48). Never pick VPF for a Kinetix 3, 6000 or 300/350 drive \u2014 VPF is compatible only with Kinetix 5500 and 5700 (KNX-TD001A p2).", "selection": "Size with FactoryTalk Motion Analyzer software and the torque/speed curves in KNX-RM009 (Kinetix 5500) and KNX-RM010 (Kinetix 5700). Check: (1) continuous stall torque against RMS torque \u2014 VPF family range 0.93 to 19 N\u00b7m continuous stall, 2.69 to 49 N\u00b7m peak stall (KNX-TD001A p48); example VPF-B1303F (400 V): 8.80 N\u00b7m continuous stall, 20.72 N\u00b7m peak stall, 2.54 kW rated output, 4000 rpm rated and maximum speed. Note the family tops out lower than VPL (33 N\u00b7m) \u2014 if the axis needs more than 19 N\u00b7m continuous, VPF is the wrong family. (2) Speed: up to 8000 rpm across the family. (3) Inertia: rotor inertia 0.00040 kg-m2 class for the 1303 frame. (4) Frames: 63, 75, 100, 115, 130 and 165 mm; 200 V (A) or 400 V (B). (5) Feedback C/P/Q/W as on VPL, including SIL 2 rated options. (6) Environmental: IP66/IP67 with shaft seal (standard) and environmentally sealed cable connector, food-grade grease on the shaft seal. A positive-air-pressure kit (VPF-AIR-PURGE) mounts on the feedback connector to reduce contamination inside the motor.", "wiring": {"power": "SINGLE CABLE, same as VPL: one 2090 single motor cable carries power, feedback and brake to the single SpeedTec DIN (M1) connector, right angle, 315 deg rotatable, one-quarter turn (KNX-TD001A p50 \u2014 note 315 deg for VPF vs 325 deg for VPL). Cable families: 2090-CSBM1DF-xxAAxx / -xxAFxx for Kinetix 5500, 2090-CSBM1DE-xxAAxx / -xxAFxx for Kinetix 5700, 2090-CSBM1DG-xxAAxx / -xxAFxx for either; 2090-CSWM1Dx are power/feedback cables without brake wires. Cables in 1.0 m increments up to 50 m (5500) / 90 m (5700).", "feedback": "Hiperface DSL encoder protocol, same as VPL (KNX-TD001A p48). Feedback options: C = 18-bit absolute single-turn (262,144 counts/rev); P = 18-bit absolute multi-turn (4096 turns); Q = 23-bit absolute multi-turn SIL 2 (PLd) rated, 12-bit secondary safety channel; W = 18-bit absolute multi-turn SIL 2 (PLd) rated, 9-bit secondary safety channel. No battery needed for multi-turn. IMPORTANT (KNX-TD001A p50): building your own cables or using third-party cable is not an option for single-cable technology.", "safety": "Safe Torque-Off lives in the drive; the motor contributes safety-rated feedback only with a Q or W SIL 2 (PLd) encoder. The optional 24 V DC brake is a HOLDING brake only (KNX-TD001A p164): hold the shaft at 0 rpm up to the rated holding torque, not for stopping rotation, not a safety device. Example VPF-B1303 brake: 14.10 N\u00b7m holding torque, 0.738-0.902 A coil current at 24 V DC. Food-grade shaft seals are wear items: inspect periodically, replacement recommended every 3 months, not to exceed 12 months (KNX-TD001A p51).", "network": "The motor has no network port. It connects by its single cable to a Kinetix 5500 drive or Kinetix 5700 dual-axis inverter, and the drive connects to the Logix controller over EtherNet/IP Integrated Motion."}, "configuration": [{"step": "Add the Kinetix 5500/5700 drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Electronic Keying", "value": "Compatible Module or Exact Match \u2014 never Disable Keying with motion modules", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Add the Kinetix 5500/5700 drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Connection", "value": "Motion", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create the axis for the drive", "screen": "Module Properties - Associated Axes tab", "parameter": "Data Type", "value": "AXIS_CIP_DRIVE (New Axis, Type Base)", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create a motion group and assign the axis", "screen": "Motion Group Properties - Attribute tab", "parameter": "Base Update Period", "value": "5 ms", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Axis Configuration", "value": "Position Loop", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Feedback Configuration", "value": "Motor Feedback", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Application Type / Loop Response", "value": "Basic / Medium", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Select the motor so all motor data fills in automatically", "screen": "Axis Properties - Motor", "parameter": "Data Source / Motor Catalog Number", "value": "Data Source = Catalog Number; Motor Catalog Number = VPF-B1303F-PJ14AF", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Load Type", "value": "Direct Coupled Rotary", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Position Units per Motor Rev / Travel Mode", "value": "1.0 Position Units per 1.0 Motor Rev; Travel Mode = Unlimited", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Tune the axis", "screen": "Axis Properties - Autotune tab", "parameter": "Autotune Start", "value": "Click Start and perform an autotune (see tuning)", "source": "Rockwell Motion System Tuning Application Technique MOTION-AT005, 'Using Load Observer with Autotune'"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (VPF-IN001).", "Mount with the connector pointing downward, cable entry underneath, and a drip loop; provide clearance, heatsink mass and airflow for 0-40 C ambient (KNX-TD001A p162).", "Verify axial and radial shaft loads do not exceed the Motor Load Force Ratings for the speed (L10 bearing life 20,000 hours, KNX-TD001A pp54-67).", "Use a torsionally rigid coupling or reinforced timing belt; do not strike the shaft, couplings or pulleys \u2014 sharp impact damages bearings and the feedback device.", "Keep the food-grade shaft seal intact and the single SpeedTec connector (315 deg range) rotated only by its housing, never with tools.", "IP66/IP67 depends on the shaft seal (standard on VPF) and environmentally sealed cable connectors; position connectors away from direct exposure to cleaning processes (KNX-TD001A p163 note).", "Inspect food-grade shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months (KNX-TD001A p51). Use only food-grade shaft seal kits (VPF-SSN / MPF-SST series) with food-grade lubricant.", "Use only Rockwell 2090 single-cable assemblies \u2014 do not build your own cable or use third-party cable (KNX-TD001A p50).", "Before first motion, confirm the brake (if fitted) releases with 24 V DC and that the axis is commanded to 0 rpm before the brake engages (KNX-TD001A p164)."], "tuning": "Tuning means setting the position/velocity loop gains so the axis follows its commanded move without oscillation, overshoot or following-error faults. Rockwell's method for Kinetix 5500/5700 drives is the Load Observer: MOTION-AT005 says the EtherNet/IP drive recommended settings use the load observer and 'produce a relatively high level of performance in 90% of motion applications', and work for unknown loads or when no autotune is performed. With Load Observer, out-of-box tuning uses Load Inertia Ratio = 0; after an autotune (Autotune tab, Start button in Axis Properties) the measured Load Inertia Ratio is greater than 0 and Load Observer Bandwidth (KOP) is set equal to Velocity Proportional Gain (KVP). Load Inertia Ratio is load inertia over motor inertia (Motion Analyzer manual). VPF is mechanically identical in inertia to VPL, so it tunes the same way \u2014 the food-grade coating and seal do not change the tuning, but a draggy or worn shaft seal adds friction the autotune will see as load, so replace worn seals before tuning, not after. For Kinetix 5500/5700, choose Tracking Notch Filter from the Adaptive Tuning Configuration pull-down on the Compliance tab (MOTION-AT005). Reduce Maximum Acceleration/Deceleration if the loaded motor cannot reach the unloaded defaults.", "faults": [{"code": "FLT S05 - MTR OVERTEMP FL", "meaning": "Motor overtemperature, factory limit fault \u2014 calculations based on the motor thermistor indicate the motor factory temperature limit has been exceeded. 2198-UM001D notes this fault is available only on Kinetix VP motors.", "fix": "Operate motor within continuous torque rating; reduce motor ambient temperature; add motor cooling (2198-UM001)."}, {"code": "FLT S07 - MTR OVERLOAD FL", "meaning": "Motor thermal overload, factory limit fault \u2014 the motor thermal model has exceeded its factory-set thermal capacity limit of 110% (2198-UM001).", "fix": "Modify the command profile to reduce speed or increase time; operate within the continuous torque rating."}, {"code": "FLT S09 - MTR PHASE LOSS", "meaning": "Motor phase loss \u2014 the motor has failed torque proving (2198-UM001).", "fix": "Check motor connections (single-cable SpeedTec connector seating, drive-end terminals)."}, {"code": "FLT S45 - FDBK COMM FL", "meaning": "Motor feedback data loss, factory limit fault \u2014 consecutive missed or corrupted serial data packets from the DSL feedback device exceeded a factory-set limit (2198-UM001).", "fix": "Check motor feedback cable and connector; check motor power cable and feedback wire shields are secured correctly; check motor frame is grounded correctly."}, {"code": "FLT S47 - FDBK DEVICE FAILURE", "meaning": "Feedback device failure (2198-UM001).", "fix": "Check the single cable and connector for damage; if the fault persists the DSL encoder is faulty and the motor needs authorised repair \u2014 do not open the motor."}, {"code": "FLT S49 - BRAKE SLIP FLT", "meaning": "Brake slip exception (2198-UM001) \u2014 the holding brake slipped under load.", "fix": "Check the load against the brake holding torque (14.10 N\u00b7m for VPF-B1303); check 24 V DC brake supply and wiring; never use the holding brake to stop a moving shaft."}], "manualUrl": "https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://www.rockwellautomation.com/en-us/products/details.VPF-B1303F-PJ14AF.html", "https://www.rockwellautomation.com/en-us/products/details.VPF-B1303F-PJ12AF.html", "https://www.rockwellautomation.com/en-nl/docs/studio-5000-logix-designer/37-00/contents-ditamap/quick-start-steps/configuring-an-ethernet-motion-system.html", "https://www.manualslib.com/manual/1593435/Allen-Bradley-Kinetix-5500.html?page=163", "https://www.manualslib.com/manual/3008536/Rockwell-Automation-Allen-Bradley-Kinetix-5500.html?page=151", "https://proxy-cf3-1.fbsidatest.workers.dev/https://literature.rockwellautomation.com/idc/groups/literature/documents/at/motion-at005_-en-p.pdf"], "tbd": ["VPF-B1303F rated speed: KNX-TD001A p53 lists VPF-B1303F at 4000 rpm rated / 4000 rpm max, 2.54 kW; Rockwell product listings show '4500-6600 RPM Rated Speed' for VPF-B1303F-PJ14AF \u2014 confirm against the current KNX-TD001 revision before teaching a speed number for this exact catalog.", "VPF-IN001 installation instructions were cited from KNX-TD001A but the VPF-IN001 document itself was not opened and read \u2014 confirm mounting and air-purge kit steps in VPF-IN001 before teaching them.", "Rockwell literature.rockwellautomation.com direct URL for KNX-TD001 was not returned by search; the manualUrl above is a distributor-hosted copy of Rockwell publication KNX-TD001A-EN-P (Feb 2017) read in full."], "sourceFile": "servo-motors.json"}, {"id": "ab-vpl", "category": "servo-motor", "family": "Kinetix VP VPL", "catalogNumbers": ["VPL-B1303F-PJ14AS"], "name": "Kinetix VP VPL Servo Motor", "whatItIs": "The Kinetix VP VPL is Allen-Bradley's low-inertia servo motor built for single-cable connection to Kinetix 5500 drives and Kinetix 5700 dual-axis inverters: one 2090 single cable carries power, feedback and brake. It uses the same proven magnetic core as the MP-Series MPL motors, with a Hiperface DSL digital encoder. The example motor VPL-B1303F-PJ14AS is a 480 V, 130 mm frame, 3-stack motor with an 18-bit single-turn / 12-bit multi-turn DSL encoder, keyed shaft, single SpeedTec DIN connector, 24 V DC holding brake and IP66 shaft seal.", "whenToUse": "Pick VPL when the system is a Kinetix 5500 or 5700 and you want the simplest wiring \u2014 one cable, one connector \u2014 with windings matched to the drive ratings for efficient sizing. Pick MPL instead when the drive is a Kinetix 6000/6200/6500/300/350/2000/7000 or Ultra3000, or when you need MPL's wider frame range (up to 300 mm, 163 N\u00b7m) and resolver/incremental feedback options. Pick VPF instead for food and beverage environments. Pick MPM instead for heavy-load axes where medium rotor inertia tunes better. Never pick VPL for a Kinetix 3, 6000 or 300/350 drive \u2014 KNX-TD001A p2 shows VPL compatible only with Kinetix 5500 and 5700.", "selection": "Size with FactoryTalk Motion Analyzer software (KNX-TD001: 'Use Motion Analyzer software to size and select motors'; also torque/speed curves in KNX-RM009 for Kinetix 5500 and KNX-RM010 for Kinetix 5700). Check: (1) continuous stall torque against RMS torque \u2014 VPL family range 0.46 to 33 N\u00b7m continuous stall, 1.33 to 79 N\u00b7m peak stall (KNX-TD001A p3); example VPL-B1303F (400 V): 8.80 N\u00b7m continuous stall, 20.72 N\u00b7m peak stall, 2.82 kW rated output, 4000 rpm rated and maximum speed. (2) Speed: up to 8000 rpm across the family. (3) Inertia: rotor inertia 0.00040 kg-m2 class for the 1303 frame \u2014 low inertia is the point of the family, so check Load Inertia Ratio carefully on heavy loads. (4) Frames: 63, 75, 100, 115, 130 and 165 mm; 200 V (A) or 400 V (B) windings matched to 5500/5700 ratings. (5) Feedback: C single-turn, P multi-turn, Q/W SIL 2 rated multi-turn \u2014 pick Q/W only if the safety design needs the safety-rated encoder. (6) Ambient 0-40 C; IP50 minimum without shaft seal, IP66 with optional shaft seal and environmentally sealed connectors.", "wiring": {"power": "SINGLE CABLE: one 2090 single motor cable carries power, feedback and brake to the single SpeedTec DIN (M1) connector on the motor, right angle, 325 deg rotatable, attached with a one-quarter turn (KNX-TD001A p5). Cable families: 2090-CSBM1DF-xxAAxx / -xxAFxx (power/feedback/brake) for Kinetix 5500, 2090-CSBM1DE-xxAAxx / -xxAFxx for Kinetix 5700, 2090-CSBM1DG-xxAAxx / -xxAFxx for either; 2090-CSWM1Dx are power/feedback cables without brake wires. Cables are available in 1.0 m increments up to 50 m for Kinetix 5500 drives and 90 m for Kinetix 5700 drives.", "feedback": "Hiperface DSL encoder protocol \u2014 purely digital two-wire communication integrated into the motor power cable (KNX-TD001A p5). Feedback options: C = 18-bit absolute single-turn digital encoder (262,144 counts/rev); P = 18-bit absolute multi-turn digital encoder (4096 turns); Q = 23-bit absolute multi-turn (8,388,608 counts/rev) SIL 2 (PLd) rated with 12-bit secondary safety channel; W = 18-bit absolute multi-turn SIL 2 (PLd) rated with 9-bit secondary safety channel. The electromechanical multi-turn design needs no battery. IMPORTANT (KNX-TD001A p5): 'Due to the unique characteristics of single cable technology, designed for and tested with Kinetix 5500 drives, Kinetix 5700 dual-axis inverters, and Bulletin VPL motors, building your own cables or using third-party cable is not an option.'", "safety": "Safe Torque-Off lives in the drive (Kinetix 5500/5700 ERS variants); the motor contributes safety-rated feedback only when a Q or W SIL 2 (PLd) encoder is fitted. The optional 24 V DC brake is a HOLDING brake only: KNX-TD001A p164 \u2014 designed to hold the shaft at 0 rpm up to the rated holding torque, not for stopping rotation, not a safety device. Example VPL-B1303 brake: 14.10 N\u00b7m holding torque, 0.738-0.902 A coil current at 24 V DC, release 125 ms / engage 120 ms with diode+zener arc suppression in the external circuit. Stop by commanding the drive to decelerate to 0 rpm, then engage the brake.", "network": "The motor has no network port. It connects by its single cable to a Kinetix 5500 drive or Kinetix 5700 dual-axis inverter, and the drive connects to the Logix controller over EtherNet/IP Integrated Motion. Select the drive first, then the motor catalog number in Studio 5000 Logix Designer."}, "configuration": [{"step": "Add the Kinetix 5500/5700 drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Electronic Keying", "value": "Compatible Module or Exact Match \u2014 never Disable Keying with motion modules", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Add the Kinetix 5500/5700 drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Connection", "value": "Motion", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create the axis for the drive", "screen": "Module Properties - Associated Axes tab", "parameter": "Data Type", "value": "AXIS_CIP_DRIVE (New Axis, Type Base)", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create a motion group and assign the axis", "screen": "Motion Group Properties - Attribute tab", "parameter": "Base Update Period", "value": "5 ms", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Axis Configuration", "value": "Position Loop", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Feedback Configuration", "value": "Motor Feedback", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Application Type / Loop Response", "value": "Basic / Medium", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Select the motor so all motor data fills in automatically", "screen": "Axis Properties - Motor", "parameter": "Data Source / Motor Catalog Number", "value": "Data Source = Catalog Number; Motor Catalog Number = VPL-B1303F-PJ14AS", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Load Type", "value": "Direct Coupled Rotary", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Position Units per Motor Rev / Travel Mode", "value": "1.0 Position Units per 1.0 Motor Rev; Travel Mode = Unlimited", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Tune the axis", "screen": "Axis Properties - Autotune tab", "parameter": "Autotune Start", "value": "Click Start and perform an autotune (see tuning)", "source": "Rockwell Motion System Tuning Application Technique MOTION-AT005, 'Using Load Observer with Autotune'"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (VPL-IN001).", "Mount with the connector pointing downward, cable entry underneath, and a drip loop in the cable; provide clearance, heatsink mass and airflow for 0-40 C ambient (VPL-IN001; KNX-TD001A p162).", "Verify axial and radial shaft loads do not exceed the Motor Load Force Ratings for the speed (L10 bearing life 20,000 hours, KNX-TD001A pp9-25).", "Use a torsionally rigid coupling or reinforced timing belt; do not strike the shaft, couplings or pulleys \u2014 sharp impact damages bearings and the feedback device.", "Rotate the single SpeedTec connector only by its housing (325 deg range); never use tools and never rotate repeatedly \u2014 the seal and IP rating suffer.", "An IP66 rating requires a shaft seal AND environmentally sealed connectors and cables (VPL-IN001).", "Inspect shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months, depending on use (KNX-TD001A p6).", "Use only Rockwell 2090 single-cable assemblies \u2014 do not build your own cable or use third-party cable (KNX-TD001A p5).", "Before first motion, confirm the brake (if fitted) releases with 24 V DC and that the axis is commanded to 0 rpm before the brake engages (KNX-TD001A p164)."], "tuning": "Tuning means setting the position/velocity loop gains so the axis follows its commanded move without oscillation, overshoot or following-error faults. Rockwell's method for Kinetix 5500/5700 drives is the Load Observer: MOTION-AT005 says the EtherNet/IP drive recommended settings use the load observer and 'produce a relatively high level of performance in 90% of motion applications', and work for unknown loads or when no autotune is performed. With Load Observer, out-of-box tuning uses Load Inertia Ratio = 0; after an autotune (Autotune tab, Start button in Axis Properties) the measured Load Inertia Ratio is greater than 0 and Load Observer Bandwidth (KOP) is set equal to Velocity Proportional Gain (KVP). Load Inertia Ratio is load inertia over motor inertia (Motion Analyzer manual). VPL's low rotor inertia is built for speed, so a heavy or compliant load (belt, long shaft, flexible coupling) drives the ratio up \u2014 the load observer automatically compensates for unknown compliance in belts, shafts and flexible couplings, and adjusts for applications where inertia varies during operation (Kinetix 5500 drive description). If the axis still oscillates, fix the mechanics first, then use Tracking Notch Filter from the Adaptive Tuning Configuration pull-down on the Compliance tab (MOTION-AT005). Reduce Maximum Acceleration/Deceleration if the loaded motor cannot reach the unloaded defaults.", "faults": [{"code": "FLT S05 - MTR OVERTEMP FL", "meaning": "Motor overtemperature, factory limit fault \u2014 calculations based on the motor thermistor indicate the motor factory temperature limit has been exceeded. 2198-UM001D notes this fault is available only on Kinetix VP motors.", "fix": "Operate motor within continuous torque rating; reduce motor ambient temperature; add motor cooling (2198-UM001)."}, {"code": "FLT S07 - MTR OVERLOAD FL", "meaning": "Motor thermal overload, factory limit fault \u2014 the motor thermal model has exceeded its factory-set thermal capacity limit of 110% (2198-UM001).", "fix": "Modify the command profile to reduce speed or increase time; operate within the continuous torque rating."}, {"code": "FLT S09 - MTR PHASE LOSS", "meaning": "Motor phase loss \u2014 the motor has failed torque proving (2198-UM001).", "fix": "Check motor connections (single-cable SpeedTec connector seating, drive-end terminals)."}, {"code": "FLT S45 - FDBK COMM FL", "meaning": "Motor feedback data loss, factory limit fault \u2014 consecutive missed or corrupted serial data packets from the DSL feedback device exceeded a factory-set limit (2198-UM001).", "fix": "Check motor feedback cable and connector; check motor power cable and feedback wire shields are secured correctly; check motor frame is grounded correctly."}, {"code": "FLT S47 - FDBK DEVICE FAILURE", "meaning": "Feedback device failure (2198-UM001).", "fix": "Check the single cable and connector for damage; if the fault persists the DSL encoder is faulty and the motor needs authorised repair \u2014 do not open the motor."}, {"code": "FLT S49 - BRAKE SLIP FLT", "meaning": "Brake slip exception (2198-UM001) \u2014 the holding brake slipped under load.", "fix": "Check the load against the brake holding torque (14.10 N\u00b7m for VPL-B1303); check 24 V DC brake supply and wiring; never use the holding brake to stop a moving shaft."}], "manualUrl": "https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://www.rockwellautomation.com/en-us/products/details.VPL-B1303F-PJ14AS.html", "https://www.rockwellautomation.com/en-us/products/details.VPL-B1303F-PJ14AS.html", "https://www.rockwellautomation.com/en-nl/docs/studio-5000-logix-designer/37-00/contents-ditamap/quick-start-steps/configuring-an-ethernet-motion-system.html", "https://www.manualslib.com/manual/1593435/Allen-Bradley-Kinetix-5500.html?page=163", "https://www.manualslib.com/manual/3008536/Rockwell-Automation-Allen-Bradley-Kinetix-5500.html?page=151", "https://proxy-cf3-1.fbsidatest.workers.dev/https://literature.rockwellautomation.com/idc/groups/literature/documents/at/motion-at005_-en-p.pdf"], "tbd": ["VPL-B1303F rated speed discrepancy: KNX-TD001A p8 lists VPL-B1303F at 4000 rpm rated / 4000 rpm max, 2.82 kW; a Rockwell Australia product listing shows 5500 rpm for VPL-B1303F-PJ14AS \u2014 confirm against the current KNX-TD001 revision before teaching a speed number for this exact catalog.", "VPL brake release/engage times (125 ms / 120 ms) are read from the KNX-TD001A p9 brake table whose column order was ambiguous in extraction \u2014 confirm in the current KNX-TD001 revision before teaching exact timings.", "Rockwell literature.rockwellautomation.com direct URL for KNX-TD001 was not returned by search; the manualUrl above is a distributor-hosted copy of Rockwell publication KNX-TD001A-EN-P (Feb 2017) read in full."], "sourceFile": "servo-motors.json"}, {"id": "ab-mpl", "category": "servo-motor", "family": "MP-Series MPL", "catalogNumbers": ["MPL-B4530K-SK74AA"], "name": "MP-Series MPL Servo Motor", "whatItIs": "The MP-Series MPL is Allen-Bradley's low-inertia, high-output brushless AC synchronous servo motor. It uses high-energy rare-earth magnets and Smart Motor Technology to deliver high torque from a compact frame, and it is the general-purpose high-performance servo motor for Kinetix systems. The example motor MPL-B4530K-SK74AA is a 460 V, 130 mm frame, 4000 rpm motor with a single-turn high-resolution encoder, keyless shaft, SpeedTec DIN connector and 24 V DC brake.", "whenToUse": "Pick MPL when the axis must accelerate, reverse and settle fast \u2014 pick-and-place, indexing, flying shear, rotary tables and packaging axes. Pick MPM instead when the load inertia is large and a heavier rotor damps the system better. Pick VPL instead when the drive is a Kinetix 5500/5700 and you want the single-cable DSL connection with no feedback converter kit. Pick TL/TLY instead only for small, low-torque (under about 5.4 N\u00b7m) 200 V axes.", "selection": "Size with FactoryTalk Motion Analyzer software (KNX-TD001: 'Use Motion Analyzer software to size and select motors'). Check in this order: (1) continuous stall torque of the candidate against the RMS torque of the move profile \u2014 MPL family range 0.26 to 163 N\u00b7m continuous stall, 0.74 to 278 N\u00b7m peak stall (KNX-TD001A p74); example MPL-B4530K (400 V): 8.25 N\u00b7m continuous stall, 20.3 N\u00b7m peak stall, 2.6 kW rated output, 4000 rpm rated and maximum speed. (2) Speed: rated speed up to 8000 rpm across the family; do not exceed the torque/speed curve for the matched drive in KNX-RM003/RM009/RM010. (3) Inertia: rotor inertia of MPL-B4530K is 0.00040 kg-m2; compare load inertia reflected to the motor shaft against rotor inertia \u2014 a large mismatch makes the axis hard to tune (see tuning). (4) Frame and heatsink: frames 63 mm to 300 mm; mount on an aluminium heatsink as specified in KNX-TD001 pp162-163 and keep ambient 0 to 40 C. (5) Voltage class: A = 200 V, B = 400 V \u2014 match the drive. (6) Feedback and brake options are chosen by catalog letters (see wiring/feedback).", "wiring": {"power": "Separate power/brake cable and feedback cable. MPL motors use SpeedTec DIN (M7) connectors, right angle, 180 deg rotatable, attached with a one-quarter turn (KNX-TD001A p76). Power/brake cables: 2090-CPBM7DF-xxAAxx standard non-flex or 2090-CPBM7DF-xxAFxx continuous-flex; power-only: 2090-CPWM7DF-xxAAxx / -xxAFxx. On Kinetix 5500 the MPL Hiperface feedback requires the 2198-H2DCK (series B or later) Hiperface-to-DSL converter kit; on Kinetix 5700 it requires the 2198-K57CK-D15M universal feedback converter kit (KNX-TD001A p74 footnotes).", "feedback": "Hiperface (Stegmann) encoder protocol (KNX-TD001A p74). Feedback options by catalog letter: V = 128 sin/cos absolute multi-turn, M = 1024 sin/cos absolute multi-turn (up to 21-bit, 2,097,152 counts/rev), E = 128 sin/cos absolute single-turn, S = 1024 sin/cos absolute single-turn (up to 21-bit), H = 2000 lines/rev incremental encoder, R = resolver (limited frames). Single-turn gives absolute position within one turn; multi-turn gives absolute position within 4096 turns and the electromechanical design needs no battery. Feedback cables: 2090-CFBM7DF-CEAAxx flying-lead or 2090-CFBM7DD-CEAAxx drive-end (standard), -CEAFxx continuous-flex.", "safety": "Safe Torque-Off lives in the drive, not the motor; there is no STO wiring on the motor itself. The optional 24 V DC brake is a HOLDING brake only: KNX-TD001A p164 \u2014 brakes 'are designed to hold the motor shaft at 0 rpm up to the rated brake holding torque', 'are not designed for stopping rotation', 'are not designed nor are they intended to be used as a safety device'. Stop by commanding the drive to decelerate to 0 rpm, then engage the brake. Example MPL-B4530 brake: 10.2 N\u00b7m holding torque, 0.576-0.704 A coil current at 24 V DC. A customer-supplied diode or MOV arc suppressor is recommended on the brake relay contacts unless the drive already provides one. MPL has no SIL-rated encoder option (SIL 2/PLd encoders are a VPL/VPF option).", "network": "The motor has no network port. It connects to a Kinetix drive (5500, 5700, 6200/6500, 6000, 300/350, 2000, 7000, Ultra3000 per KNX-TD001A p74) and the drive connects to the Logix controller over EtherNet/IP Integrated Motion (5500/5700/6500) or Sercos (6000/6200). Select the drive first, then the motor catalog number in Studio 5000 Logix Designer."}, "configuration": [{"step": "Add the Kinetix drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Electronic Keying", "value": "Compatible Module or Exact Match \u2014 never Disable Keying with motion modules", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Add the Kinetix drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Connection", "value": "Motion", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create the axis for the drive", "screen": "Module Properties - Associated Axes tab", "parameter": "Data Type", "value": "AXIS_CIP_DRIVE (New Axis, Type Base)", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create a motion group and assign the axis", "screen": "Motion Group Properties - Attribute tab", "parameter": "Base Update Period", "value": "5 ms", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Axis Configuration", "value": "Position Loop", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Feedback Configuration", "value": "Motor Feedback", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Application Type / Loop Response", "value": "Basic / Medium", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Select the motor so all motor data fills in automatically", "screen": "Axis Properties - Motor", "parameter": "Data Source / Motor Catalog Number", "value": "Data Source = Catalog Number; Motor Catalog Number = MPL-B4530K-SK74AA", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system' \u2014 'All of the motor settings are completed automatically to match the settings specified for that catalog number'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Load Type", "value": "Direct Coupled Rotary", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Position Units per Motor Rev / Travel Mode", "value": "1.0 Position Units per 1.0 Motor Rev; Travel Mode = Unlimited", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Tune the axis", "screen": "Axis Properties - Autotune tab", "parameter": "Autotune Start", "value": "Click Start and perform an autotune (see tuning)", "source": "Rockwell Motion System Tuning Application Technique MOTION-AT005, 'Using Load Observer with Autotune'"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (MP-IN002).", "Mount with the connector housing pointing downward, cable entry underneath the motor, and a drip loop in each cable (MP-IN001/MP-IN015).", "Provide clearance, heatsink mass and airflow so the motor stays within 0-40 C ambient; do not enclose the motor unless forced air is blown across it, and keep other heat-producing devices away (MP-IN001 p10; KNX-TD001A p162).", "Verify axial and radial shaft loads do not exceed the Motor Load Force Ratings for the speed (L10 bearing life 20,000 hours, KNX-TD001A pp81-83); for MPL-B4530 radial load is 133 kg at 500 rpm falling to 66 kg at 5000 rpm.", "Use a torsionally rigid coupling or reinforced timing belt; do not strike the shaft, couplings or pulleys with tools \u2014 sharp impact damages bearings and the feedback device (MP-IN001).", "Rotate the SpeedTec DIN connector only by grasping both connector housings, never with tools and never repeatedly \u2014 excessive rotation or force damages the connector seal and reduces the IP rating (MP-IN001 p10).", "Electronic zero (index pulse / Stegmann ABS = 0) occurs when the shaft key or dimple is aligned with the connectors \u2014 check alignment against the mounting dimensions (MP-IN001 p10).", "Inspect shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months, depending on use (KNX-TD001A p77).", "Before first motion, confirm the brake releases with 24 V DC applied and that the axis is commanded to 0 rpm before the brake is engaged \u2014 the brake is a holding brake, not a stopping brake (KNX-TD001A p164)."], "tuning": "Tuning means setting the position/velocity loop gains so the axis follows its commanded move without oscillation, overshoot or following-error faults. Rockwell's method for Kinetix 5500/5700/6500 drives is the Load Observer: MOTION-AT005 says the EtherNet/IP drive recommended settings use the load observer and 'produce a relatively high level of performance in 90% of motion applications', and work for unknown loads or when no autotune is performed. With Load Observer, out-of-box tuning uses Load Inertia Ratio = 0; after an autotune (Autotune tab, Start button in Axis Properties) the measured Load Inertia Ratio is greater than 0 and Load Observer Bandwidth (KOP) is set equal to Velocity Proportional Gain (KVP). Load Inertia Ratio is defined in the Motion Analyzer manual as load inertia over motor inertia \u2014 so for MPL the small rotor inertia (0.00040 kg-m2 on the MPL-B4530K) is an advantage for acceleration but makes the axis sensitive to a heavy, compliant load: if autotune reports a large Load Inertia Ratio, fix the mechanics first (stiffen the coupling, reduce backlash, add a gearbox) rather than forcing higher gains. For Kinetix 5500/5700, choose Tracking Notch Filter from the Adaptive Tuning Configuration pull-down on the Compliance tab in Axis Properties (MOTION-AT005). Reduce Maximum Acceleration/Deceleration if the loaded motor cannot reach the unloaded defaults. Tuning cannot fix a wrong motor size: if the axis faults on overload, re-check continuous vs peak torque in Motion Analyzer.", "faults": [{"code": "FLT S02 - MTR COMMUTATION", "meaning": "Motor commutation fault (Kinetix 5500/5700 drive, 2198-UM001). The drive has lost correct commutation of the motor.", "fix": "Check motor power and feedback wiring and connectors; verify the correct motor catalog number is selected in Axis Properties - Motor; check for a damaged feedback cable."}, {"code": "FLT S03 - MTR OVERSPEED FL", "meaning": "Motor overspeed, factory limit fault \u2014 motor speed has exceeded 125% of its maximum speed (2198-UM001).", "fix": "Check control loop tuning (MOTION-AT005); check the commanded profile and overspeed limits in Axis Properties."}, {"code": "FLT S07 - MTR OVERLOAD FL", "meaning": "Motor thermal overload, factory limit fault \u2014 the motor thermal model has exceeded its factory-set thermal capacity limit of 110% (2198-UM001).", "fix": "Modify the command profile to reduce speed or increase time; operate the motor within its continuous torque rating; check ambient temperature and heatsink/airflow."}, {"code": "FLT S09 - MTR PHASE LOSS", "meaning": "Motor phase loss \u2014 the motor has failed torque proving (2198-UM001).", "fix": "Check motor connections (power cable, SpeedTec connector seating, drive-end terminals)."}, {"code": "FLT S45 - FDBK COMM FL", "meaning": "Motor feedback data loss, factory limit fault \u2014 the number of consecutive missed or corrupted serial data packets from the intelligent feedback device has exceeded a factory-set limit (2198-UM001).", "fix": "Check motor feedback cable and connector; check motor power cable and feedback wire shields are secured correctly; check motor frame is grounded correctly."}, {"code": "FLT S47 - FDBK DEVICE FAILURE", "meaning": "Feedback device failure (2198-UM001) \u2014 the drive cannot use the motor feedback device.", "fix": "Check the feedback cable and connector for damage; if the fault persists the encoder/feedback device is faulty and the motor needs authorised repair \u2014 do not open the motor (MP-IN002: only an authorised Allen-Bradley repair centre can service it)."}], "manualUrl": "https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://www.rockwellautomation.com/en-us/products/details.MPL-B4530K-SK74AA.html", "https://www.rockwellautomation.com/en-nl/docs/studio-5000-logix-designer/37-00/contents-ditamap/quick-start-steps/configuring-an-ethernet-motion-system.html", "https://www.rockwellautomation.com/en-ua/docs/studio-5000-logix-designer/37-00/contents-ditamap/studio-5000-logix-designer/axis-properties-for-ethernet-motion-system/configure-the-axis-properties/axis-wizard-props-drive-motor-axis-servo-drive.html", "https://literature.rockwellautomation.com/idc/groups/literature/documents/pc/mp-pc002_-en-p.pdf", "https://www.manualslib.com/manual/1593435/Allen-Bradley-Kinetix-5500.html?page=163", "https://www.manualslib.com/manual/3008536/Rockwell-Automation-Allen-Bradley-Kinetix-5500.html?page=151", "https://proxy-cf3-1.fbsidatest.workers.dev/https://literature.rockwellautomation.com/idc/groups/literature/documents/at/motion-at005_-en-p.pdf", "https://www.rockwellautomation.com/en-mde/products/software/factorytalk/designsuite/motion-analyzer.html"], "tbd": ["MPL-B4530K rated torque was listed as TBD in the seed file; now verified from KNX-TD001A p79 as 8.25 N\u00b7m continuous stall / 20.3 N\u00b7m peak stall \u2014 no longer TBD.", "FLT S05 MTR OVERTEMP FL is stated in 2198-UM001D as 'Available only on Kinetix VP motors. Not supported on induction motors' \u2014 whether it applies to MPL motors on a Kinetix 5500/5700 needs confirmation in the current 2198-UM001 revision before teaching it for MPL.", "Exact 2198-H2DCK / 2198-K57CK-D15M converter-kit wiring steps were not read in the converter kit instructions \u2014 confirm kit manual before teaching the physical wiring.", "Rockwell literature.rockwellautomation.com direct URL for KNX-TD001 was not returned by search; the manualUrl above is a distributor-hosted copy of the same Rockwell publication KNX-TD001A-EN-P (Feb 2017) that was read in full \u2014 replace with the literature.rockwellautomation.com link when confirmed."], "sourceFile": "servo-motors.json"}, {"id": "ab-mpm", "category": "servo-motor", "family": "MP-Series MPM", "catalogNumbers": ["MPM-B1153F-MJ72AA"], "name": "MP-Series MPM Servo Motor", "whatItIs": "The MP-Series MPM is Allen-Bradley's medium-inertia brushless AC synchronous servo motor. It combines the features of the low-inertia MPL motors with a rotor that is better suited for high-inertia loads (MPM-IN001). The example motor MPM-B1153F-MJ72AA is a 460 V, 115 mm frame, 3-stack, 3000 rpm motor with a multi-turn high-resolution encoder, keyed shaft and SpeedTec DIN connector, no brake.", "whenToUse": "Pick MPM when the load inertia is large relative to the motor \u2014 printing, web handling, converting and automotive axes, and any axis where an MPL would need a gearbox or would be hard to tune because the load dominates the rotor. Pick MPL instead for fast, light, high-acceleration axes where low rotor inertia is the advantage. Pick VPL instead when the drive is a Kinetix 5500/5700 and single-cable DSL wiring is wanted (MPM on those drives needs a Hiperface-to-DSL converter kit). Do not pick MPM for food or washdown duty \u2014 that is MPF/MPS/VPF territory.", "selection": "Size with FactoryTalk Motion Analyzer software (KNX-TD001: 'Use Motion Analyzer software to size and select motors'). Check: (1) continuous stall torque against RMS torque \u2014 MPM family range 2.18 to 62.8 N\u00b7m continuous stall, 6.6 to 154.2 N\u00b7m peak stall (KNX-TD001A p91); example MPM-B1153F (400 V): 6.55 N\u00b7m continuous stall, 19.8 N\u00b7m peak stall, 1.45 kW rated output, 3000 rpm base speed. (2) Speed: up to 7000 rpm across the family; base speed equals maximum speed at peak torque (KNX-TD001A p92 note). (3) Inertia: rotor inertia of MPM-B1153F is 0.00089 kg-m2 \u2014 roughly double the same-frame MPL rotor \u2014 which is the point of the family: the heavier rotor matches heavy loads so the Load Inertia Ratio stays manageable. (4) Frames: 115, 130, 165 and 215 mm bolt-circle diameter; 200 V (A) or 400 V (B) windings. (5) Ambient 0-40 C, mount on the aluminium heatsink specified in KNX-TD001 pp162-163. (6) Resolver feedback is not available on all models (KNX-TD001A p92).", "wiring": {"power": "Separate power/brake cable and feedback cable, same as MPL. MPM motors use SpeedTec DIN (M7) connectors, right angle, 180 deg rotatable, one-quarter turn (KNX-TD001A p93). Power/brake cables: 2090-CPBM7DF-xxAAxx standard or 2090-CPBM7DF-xxAFxx continuous-flex; power-only: 2090-CPWM7DF-xxAAxx / -xxAFxx. On Kinetix 5500, MPM requires the 2198-H2DCK Hiperface-to-DSL converter kit, and 200 V-class MPM motors require the 2198-H2DCK series B or later (KNX-TD001A p91 footnote).", "feedback": "Hiperface encoder protocol (KNX-TD001A p91). Feedback options by catalog letter: 2 = resolver, 4-pole (not on all models); M = 1024 sin/cos absolute multi-turn encoder (Hiperface, up to 21-bit, 2,097,152 counts/rev); S = 1024 sin/cos absolute single-turn encoder (Hiperface). Single-turn gives absolute position within one turn; multi-turn gives absolute position within 4096 turns with no battery (electromechanical design). Feedback cables: 2090-CFBM7DF-CEAAxx flying-lead or 2090-CFBM7DD-CEAAxx drive-end (standard), -CEAFxx continuous-flex. Note the difference from MPL: MPM has no 128 sin/cos (E/V) or 2000-line incremental (H) feedback options in KNX-TD001A \u2014 only resolver, M and S.", "safety": "Safe Torque-Off lives in the drive, not the motor. The optional 24 V DC brake is a HOLDING brake only: KNX-TD001A p164 \u2014 brakes 'are designed to hold the motor shaft at 0 rpm up to the rated brake holding torque', 'are not designed for stopping rotation', 'are not designed nor are they intended to be used as a safety device'. Stop by commanding the drive to decelerate to 0 rpm, then engage the brake. A customer-supplied diode or MOV arc suppressor is recommended on brake relay contacts unless the drive already provides one. MPM has no SIL-rated encoder option.", "network": "The motor has no network port. It connects to a Kinetix drive (5500, 5700, 6200/6500, 6000, 300/350, 2000, 7000, Ultra3000 per KNX-TD001A p91) and the drive connects to the Logix controller over EtherNet/IP Integrated Motion or Sercos. Select the drive first, then the motor catalog number in Studio 5000 Logix Designer."}, "configuration": [{"step": "Add the Kinetix drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Electronic Keying", "value": "Compatible Module or Exact Match \u2014 never Disable Keying with motion modules", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Add the Kinetix drive as an Ethernet motion module", "screen": "New Module dialog box", "parameter": "Connection", "value": "Motion", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create the axis for the drive", "screen": "Module Properties - Associated Axes tab", "parameter": "Data Type", "value": "AXIS_CIP_DRIVE (New Axis, Type Base)", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Create a motion group and assign the axis", "screen": "Motion Group Properties - Attribute tab", "parameter": "Base Update Period", "value": "5 ms", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Axis Configuration", "value": "Position Loop", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Feedback Configuration", "value": "Motor Feedback", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set the axis loop type", "screen": "Axis Properties - General", "parameter": "Application Type / Loop Response", "value": "Basic / Medium", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Select the motor so all motor data fills in automatically", "screen": "Axis Properties - Motor", "parameter": "Data Source / Motor Catalog Number", "value": "Data Source = Catalog Number; Motor Catalog Number = MPM-B1153F-MJ72AA", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Load Type", "value": "Direct Coupled Rotary", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Set position scaling", "screen": "Axis Properties - Scaling", "parameter": "Position Units per Motor Rev / Travel Mode", "value": "1.0 Position Units per 1.0 Motor Rev; Travel Mode = Unlimited", "source": "Rockwell Studio 5000 Logix Designer docs, 'Configuring an Ethernet motion system'"}, {"step": "Tune the axis", "screen": "Axis Properties - Autotune tab", "parameter": "Autotune Start", "value": "Click Start and perform an autotune (see tuning)", "source": "Rockwell Motion System Tuning Application Technique MOTION-AT005, 'Using Load Observer with Autotune'"}], "commissioning": ["Verify the nameplate catalog number against the purchase order before installing (MPM-IN001).", "Mount with the connector housing pointing downward, cable entry underneath the motor, and a drip loop in each cable (MPM-IN001, same MP-Series practice as MP-IN001).", "Provide clearance, heatsink mass and airflow so the motor stays within 0-40 C ambient; do not enclose the motor unless forced air is blown across it (MP-IN001 p10; KNX-TD001A p162).", "Verify axial and radial shaft loads do not exceed the Motor Load Force Ratings for the speed (L10 bearing life 20,000 hours, KNX-TD001A).", "Use a torsionally rigid coupling or reinforced timing belt; do not strike the shaft, couplings or pulleys with tools \u2014 sharp impact damages bearings and the feedback device.", "Rotate the SpeedTec DIN connector only by grasping both connector housings, never with tools and never repeatedly \u2014 excessive rotation damages the connector seal and reduces the IP rating.", "Electronic zero occurs when the shaft key or dimple is aligned with the connectors \u2014 check alignment against the mounting dimensions.", "Inspect shaft seals periodically; replacement is recommended every 3 months, not to exceed 12 months, depending on use (KNX-TD001A p94).", "Before first motion, confirm the brake (if fitted) releases with 24 V DC applied and that the axis is commanded to 0 rpm before the brake is engaged (KNX-TD001A p164)."], "tuning": "Tuning means setting the position/velocity loop gains so the axis follows its commanded move without oscillation, overshoot or following-error faults. Rockwell's method for Kinetix 5500/5700/6500 drives is the Load Observer: MOTION-AT005 says the EtherNet/IP drive recommended settings use the load observer and 'produce a relatively high level of performance in 90% of motion applications', and work for unknown loads or when no autotune is performed. With Load Observer, out-of-box tuning uses Load Inertia Ratio = 0; after an autotune (Autotune tab, Start button in Axis Properties) the measured Load Inertia Ratio is greater than 0 and Load Observer Bandwidth (KOP) is set equal to Velocity Proportional Gain (KVP). Load Inertia Ratio is load inertia over motor inertia (Motion Analyzer manual). MPM exists for exactly this number: its heavier rotor (0.00089 kg-m2 on the MPM-B1153F, vs 0.00040 kg-m2 for the same-frame MPL-B4530K class) brings the ratio down on heavy loads, so the axis tunes stiffer and holds position better under load changes. If autotune still reports a large ratio, fix the mechanics first (stiffen the coupling, reduce backlash, add a gearbox) rather than forcing higher gains. For Kinetix 5500/5700, choose Tracking Notch Filter from the Adaptive Tuning Configuration pull-down on the Compliance tab (MOTION-AT005). Reduce Maximum Acceleration/Deceleration if the loaded motor cannot reach the unloaded defaults. Tuning cannot fix a wrong motor size: if the axis faults on overload, re-check continuous vs peak torque in Motion Analyzer.", "faults": [{"code": "FLT S02 - MTR COMMUTATION", "meaning": "Motor commutation fault (Kinetix 5500/5700 drive, 2198-UM001).", "fix": "Check motor power and feedback wiring and connectors; verify the correct motor catalog number is selected in Axis Properties - Motor; check for a damaged feedback cable."}, {"code": "FLT S03 - MTR OVERSPEED FL", "meaning": "Motor overspeed, factory limit fault \u2014 motor speed has exceeded 125% of its maximum speed (2198-UM001).", "fix": "Check control loop tuning (MOTION-AT005); check the commanded profile and overspeed limits."}, {"code": "FLT S07 - MTR OVERLOAD FL", "meaning": "Motor thermal overload, factory limit fault \u2014 the motor thermal model has exceeded its factory-set thermal capacity limit of 110% (2198-UM001).", "fix": "Modify the command profile to reduce speed or increase time; operate within the continuous torque rating; check ambient and heatsink/airflow."}, {"code": "FLT S09 - MTR PHASE LOSS", "meaning": "Motor phase loss \u2014 the motor has failed torque proving (2198-UM001).", "fix": "Check motor connections (power cable, SpeedTec connector seating, drive-end terminals)."}, {"code": "FLT S45 - FDBK COMM FL", "meaning": "Motor feedback data loss, factory limit fault \u2014 consecutive missed or corrupted serial data packets from the intelligent feedback device exceeded a factory-set limit (2198-UM001).", "fix": "Check motor feedback cable and connector; check motor power cable and feedback wire shields are secured correctly; check motor frame is grounded correctly."}, {"code": "FLT S47 - FDBK DEVICE FAILURE", "meaning": "Feedback device failure (2198-UM001).", "fix": "Check the feedback cable and connector for damage; if the fault persists the encoder is faulty and the motor needs authorised repair \u2014 do not open the motor (only an authorised Allen-Bradley repair centre can service it)."}], "manualUrl": "https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "sources": ["https://vecto-bsp-virginia.s3.us-east-1.amazonaws.com/product/12128/documents/knx-td001-en-p.pdf/knxtd001enp.pdf", "https://www.rockwellautomation.com/en-ro/products/details.MPM-B1153F-MJ72AA.html", "https://www.rockwellautomation.com/en-nl/docs/studio-5000-logix-designer/37-00/contents-ditamap/quick-start-steps/configuring-an-ethernet-motion-system.html", "https://literature.rockwellautomation.com/idc/groups/literature/documents/pc/mp-pc002_-en-p.pdf", "https://www.manualslib.com/manual/1593435/Allen-Bradley-Kinetix-5500.html?page=163", "https://www.manualslib.com/manual/3008536/Rockwell-Automation-Allen-Bradley-Kinetix-5500.html?page=151", "https://proxy-cf3-1.fbsidatest.workers.dev/https://literature.rockwellautomation.com/idc/groups/literature/documents/at/motion-at005_-en-p.pdf"], "tbd": ["MPM-B1153F 400 V-class rated/max speed: KNX-TD001A p95 table is garbled in the extracted text (base 3000 rpm is clear; rated and maximum speed columns could not be read cleanly) \u2014 confirm rated/max speed in the current KNX-TD001 revision before teaching a speed number for this exact catalog.", "FLT S05 MTR OVERTEMP FL applicability to MPM (stated in 2198-UM001D as VP-motors only) \u2014 confirm in the current 2198-UM001 revision before teaching it for MPM.", "Exact 2198-H2DCK converter-kit wiring steps were not read in the kit instructions \u2014 confirm before teaching physical wiring.", "Rockwell literature.rockwellautomation.com direct URL for KNX-TD001 was not returned by search; the manualUrl above is a distributor-hosted copy of Rockwell publication KNX-TD001A-EN-P (Feb 2017) read in full."], "sourceFile": "servo-motors.json"}, {"id": "ab-tl", "category": "servo-motor", "family": "TL-Series TL", "catalogNumbers": ["TL-A220P-HJ32AN"], "name": "TL-Series TL Servo Motor", "whatItIs": "The TL-Series TL is the metric-frame, Kinetix 3 variant of the TL-Series compact low-inertia servo motor. Its performance specifications match the Bulletin TLY motor specifications identically (KNX-TD001A p149), but TL motors are available only in metric frame sizes, use rectangular plastic connectors with 300 mm cables instead of TLY's 1 m circular-connector cables, and are intended for use with Kinetix 3 servo drives. The example motor TL-A220P-HJ32AN is a 200 V, 70 mm frame, 5000 rpm motor with a 2000-line incremental encoder, shaft key, rectangular connectors and NEMA mounting.", "whenToUse": "Pick TL when the drive is a Kinetix 3 and the axis is small (under 5.42 N\u00b7m continuous) \u2014 the TL is the motor Rockwell pairs with the Kinetix 3. Pick TLY instead when the drive is a Kinetix 300/350, 2000, 6000 or Ultra3000, or when NEMA frames and circular connectors are wanted. Pick VPL/MPL instead when the axis needs more than 5.42 N\u00b7m, 400 V, absolute multi-turn feedback without a battery, or a Kinetix 5500/5700 drive. Note the family split in KNX-TD001A p149: TL supports frames TL-A110, TL-A120, TL-A130, TL-A220, TL-A230, TL-A2530, TL-A2540 and TL-A410 \u2014 TL-A310 is NOT supported (that frame exists only as TLY-A310).", "selection": "Size with FactoryTalk Motion Analyzer software. Check: (1) continuous stall torque against RMS torque \u2014 TL-Series family range 0.086 to 5.42 N\u00b7m continuous stall, 0.22 to 13 N\u00b7m peak stall (KNX-TD001A p150); example TL-A220 (non-brake): 0.836 N\u00b7m continuous, 1.48 N\u00b7m peak, 0.35 kW, 5000 rpm rated. Brake versions are de-rated (TL-A220 with brake: 0.757 N\u00b7m continuous, 0.24 kW) \u2014 read the brake table. (2) Speed: 4500, 5000 and 6000 rpm rated speeds; the 6000 rpm rating applies only to TLY-AxxxT-H incremental motors, so TL motors top out at 5000 rpm in the tables (KNX-TD001A p154 note 3). (3) Inertia: rotor inertia TL-A220 is 0.000018 kg-m2 \u2014 the load dominates, so check Load Inertia Ratio. (4) Voltage: 200 V class only (A). (5) Frames metric only: 46, 70, 90, 100 (TL-A310 not supported) and 115 mm (TL-A410, metric only). (6) Ambient 0-40 C; IP65 housing with optional shaft seal.", "wiring": {"power": "TL motors have 300 mm (11.8 in.) cable extensions with rectangular plastic connectors (KNX-TD001A p152). Power cables: 209
