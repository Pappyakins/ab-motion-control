the right). Aux contacts are the feedback to the PLC/E300 (contactor state) and the hold-in/seal-in path in 3-wire control.", "safety": "The contactor is not an isolator: its main poles are open when the coil is de-energised, but the line terminals stay live, so isolate upstream (140M or disconnect) before working on the load side. A contactor that welds closed will not drop out on coil de-energisation - that is why the starter needs short-circuit protection (140M) and overload protection (E300) upstream/downstream, and why safety circuits use mirror contacts. Fit a surge suppressor (RC snubber/varistor) across the coil where the manual calls for it to protect the driving output.", "network": "the 100-C itself has no network port; in a smart starter the contactor is driven by the E300 control relay or a PLC output, and its state is read back through aux contacts. Network control of the starter lives in the E300 (EtherNet/IP) or the SMC, not in the contactor."}, "configuration": [{"step": "Pick the frame by AC-3 current and Hp at the supply voltage", "screen": "Product Selection table, Publication 100-TD013", "parameter": "AC-3 Ie and Hp/kW", "value": "e.g. 5 Hp at 460V 3-phase = 100-C09 (9 A AC-3); 15 Hp at 460V = 100-C23 (23 A AC-3); 75 Hp at 460V = 100-C97 (97 A AC-3)", "source": "Rockwell Publication 100-TD013K-EN-P, Product Selection"}, {"step": "Add the coil voltage code to complete the catalog number", "screen": "Coil Voltage Codes table, 100-TD013 p.19", "parameter": "Coil code (inserted before the aux suffix)", "value": "D = 110V 50 Hz / 120V 60 Hz (example: 100-C0910 becomes 100-C09D10). A = 220V 50 Hz / 240V 60 Hz. KJ = 24V AC 50/60 Hz. EJ = 24V DC electronic with integrated diode (C09...C55). DJ = 24V DC with integrated diode (C60...C97)", "source": "Rockwell Publication 100-TD013K-EN-P, Coil Voltage Codes"}, {"step": "Choose the built-in auxiliary: 1 N.O., 1 N.C. or none", "screen": "Catalog suffix", "parameter": "Aux suffix 10 / 01 / 00", "value": "10 = 1 N.O., 01 = 1 N.C. (mechanically linked), 00 = no built-in aux. Example: 100-C09D10 = 120V AC coil, 1 N.O. aux", "source": "Rockwell Publication 100-TD013K-EN-P, Product Selection"}, {"step": "Mount on 35 mm DIN rail or panel, and set the coil terminal position", "screen": "Hardware", "parameter": "Mounting; coil terminal position (line side = standard, load side = U suffix)", "value": "DIN rail or panel mount; reversible coil terminations (line or load side) - suffix U for load-side coil connection on some variants", "source": "Rockwell Publication 100-TD013K-EN-P, Product Line Overview"}, {"step": "Wire the coil through the E300 trip relay / overload N.C. contact so an overload trip drops the contactor out", "screen": "Starter control wiring (E300 Ch. 2 / 190E starter diagrams)", "parameter": "Control circuit: Start/Stop, E300 trip relay in series with the coil", "value": "3-wire control: Start (N.O.) seals in through the contactor N.O. aux; Stop (N.C.) and the overload trip contact break the coil circuit. The E300 must have Overload Trip enabled in TripEnableI (Parameter 183) for the trip relay to open", "source": "E300 User Manual 193-UM015E-EN-P Ch. 2 Control Circuits; 100-TD013"}, {"step": "Torque the main power terminals to the manual value for the frame (Table 17, Conductors)", "screen": "100-TD013 Table 17, p. 44", "parameter": "Power-terminal torque, 100-C09...C23", "value": "1.5...2.0 N-m (13.3...17.7 lb-in). Wire: 1 conductor 1...4 mm2, 2 conductors 1...4 mm2; 16...10 AWG. Fine-stranded second row: 1 conductor 1.5...6 mm2, 2 conductors 1.5...6 mm2.", "source": "Rockwell Publication 100-TD013J-EN-P, Table 17 (Conductors), p. 44 (Rexel mirror)"}, {"step": "Torque the main power terminals to the manual value for the frame (Table 17, Conductors)", "screen": "100-TD013 Table 17, p. 44", "parameter": "Power-terminal torque, 100-C30...C37", "value": "2.5...3.5 N-m (22...31 lb-in). Wire: 1 conductor 2.5...10 mm2, 2 conductors 2.5...10 mm2; 14...4 AWG. Fine-stranded second row: 1 conductor 2.5...16 mm2, 2 conductors 2.5...16 mm2.", "source": "Rockwell Publication 100-TD013J-EN-P, Table 17 (Conductors), p. 44 (Rexel mirror)"}, {"step": "Torque the main power terminals to the manual value for the frame (Table 17, Conductors)", "screen": "100-TD013 Table 17, p. 44", "parameter": "Power-terminal torque, 100-C43...C55", "value": "2.5...3.5 N-m (22...31 lb-in). Wire: 1 conductor 2.5...16 mm2, 2 conductors 2.5...10 mm2; 14...6 AWG. Fine-stranded second row: 1 conductor 2.5...25 mm2, 2 conductors 2.5...16 mm2.", "source": "Rockwell Publication 100-TD013J-EN-P, Table 17 (Conductors), p. 44 (Rexel mirror)"}, {"step": "Torque the main power terminals to the manual value for the frame (Table 17, Conductors)", "screen": "100-TD013 Table 17, p. 44", "parameter": "Power-terminal torque, 100-C60...C97", "value": "4.5...6 N-m (40...53 lb-in). Wire: 1 conductor 2.5...35 mm2, 2 conductors 2.5...25 mm2; 14...4 AWG. Fine-stranded second row: 1 conductor 2.5...50 mm2 (14...1 AWG for C90...C97), 2 conductors 2.5...35 mm2.", "source": "Rockwell Publication 100-TD013J-EN-P, Table 17 (Conductors), p. 44 (Rexel mirror)"}, {"step": "Torque the coil terminals to the manual value (Table 17, Conductors)", "screen": "100-TD013 Table 17, p. 44", "parameter": "Coil-terminal torque / wire", "value": "1...1.5 N-m (9...13 lb-in); 1...2.5 mm2 and 1...4 mm2 (two wire types); 16...12 AWG. Terminal screws: (1) Pozidriv No. 2 / Blade No. 3; (2) Pozidriv No. 2 / Blade No. 4; (3) hexagonal socket.", "source": "Rockwell Publication 100-TD013J-EN-P, Table 17 (Conductors), p. 44 (Rexel mirror)"}, {"step": "Read the contactor's estimated contact life from the Life-Load Curves", "screen": "100-TD013 pp. 49-55, Figures 11-22; Table 16 p. 43", "parameter": "Contact life (operations) vs operational current Ie", "value": "Method (p. 49): curves are based on Rockwell Automation tests per IEC 60947-4-1. Identify the utilization category from Table 23, choose the matching graph, locate the intersection of the contactor's curve with the application operational current (Ie) on the horizontal axis, and read the estimated contact life on the vertical axis. Actual application life may vary with environment and duty cycle. Figures: 11 AC-1 40 deg C Ue 230...690V; 12 AC-2 Ue 230...400...460V; 13 AC-3 Ue 230...400...460V; 14 AC-3 Ue 500...575V; 15 AC-3 Ue 690V; 16 AC-4 Ue 230...690V; 17 AC-3 & AC-4 10% AC-4 mixed Ue 230...400...460V; 18 Heavy Duty Starting and Regular Short-time Operation; 19-22 Maximum Operating Rates (AC-1, AC-2, AC-3, AC-4). Mixed AC-3/AC-4 life: Lmixed = Lac3 / [1 + Pac4 x (Lac3/Lac4 - 1)], where Lmixed = approximate contact life in operations for the mixed application, Lac3 = life for pure AC-3 (from the AC-3 curves), Lac4 = life for pure AC-4, Pac4 = percentage of AC-4 operations. Headline lives (Table 16): mechanical life, AC control: 13M ops (C09...C37), 10M (C40), 12M (C43...C55), 6M (C60...C97); DC control: 13M, 10M, 13M, 6M. Electrical life AC-3 at 400V: 1.3M ops (C09...C37), 1M (C43), 0.8M (C55), 1M (C60...C85, C97); C40 and C90 not listed. Utilization categories (Table 23): AC-1 resistance furnaces (non/slightly inductive, 1/1/0.95); AC-2 slip-ring motors starting/reversing (2.5/1/0.65); AC-3 squirrel-cage starting/stopping running motors (Ie<17 A: 6/1/0.65 make, 1/0.17/0.65 break; Ie>17 A: 6/1/0.35 make, 1/0.17/0.35 break); AC-4 squirrel-cage starting/plugging/inch-ing (Ie<17 A: 6/1/0.65; Ie>17 A: 6/1/0.35); AC-15 solenoids/contactors/valves/lifting magnets (10/1/0.7 make, 1/1/0.4 break). The curves are graphs, so no numeric curve points are transcribed here - teach the reading method and the Table 16 headline lives.", "source": "Rockwell Publication 100-TD013J-EN-P, Life-Load Curves pp. 49-55, Tables 16 and 23 (Rexel mirror)"}, {"step": "Fit a plug-in surge suppressor across the coil to limit coil switching transients (RC version, AC operating mechanism)", "screen": "100-TD013 Accessories, p. 33", "parameter": "100-FSC RC Module", "value": "100-FSC48 (24...48V AC, 50/60 Hz), 100-FSC280 (110...280V AC, 50/60 Hz), 100-FSC480 (380...480V AC, 50/60 Hz) - for 100-C with coils. Plug-in, coil-mounted; suitable for 100-C contactor sizes 9...97 A. Screwless-terminal variant: insert 'CR' after '100-' (e.g. 100-FSC48 becomes 100-CRFSC48).", "source": "Rockwell Publication 100-TD013J-EN-P, Accessories p. 33 (Rexel mirror)"}, {"step": "Fit a plug-in surge suppressor across the coil to limit coil switching transients (varistor version, AC/DC operating mechanism)", "screen": "100-TD013 Accessories, p. 33", "parameter": "100-FSV Varistor Module", "value": "100-FSV55 (12...55V AC, 12...77V DC), 100-FSV136 (56...136V AC / 78...180V DC), 100-FSV277 (137...277V AC / 181...350V DC), 100-FSV575 (278...575V AC) - for 100-C with AC coils or 100-C09...-C43 with DC coils. Plug-in, coil-mounted; suitable for 100-C contactor sizes 9...97 A. Screwless-terminal variant: insert 'CR' after '100-' (e.g. 100-FSV55 becomes 100-CRFSV55).", "source": "Rockwell Publication 100-TD013J-EN-P, Accessories p. 33 (Rexel mirror)"}, {"step": "Fit a plug-in surge suppressor across the coil to limit coil switching transients (diode version, DC operating mechanism)", "screen": "100-TD013 Accessories, p. 33", "parameter": "100-FSD Diode Module", "value": "100-FSD250 - for 100-C09...-C43 with DC coils. Plug-in, coil-mounted; suitable for 100-C contactor sizes 9...97 A. Screwless-terminal variant: insert 'CR' after '100-' (e.g. 100-FSD250 becomes 100-CRFSD250). Note: the '1...30 s' / '10...180 s' figures printed next to 100-FSD250 in the OCR belong to the timer table below it, not to the diode module.", "source": "Rockwell Publication 100-TD013J-EN-P, Accessories p. 33 (Rexel mirror)"}], "commissioning": ["Confirm the catalog number: frame, coil code and aux suffix match the panel schedule and the control voltage actually present.", "Energise the coil and confirm the contactor pulls in cleanly (single clunk, no chatter) and all three main poles close; check the aux contact changes state.", "Measure the coil voltage at the coil terminals under load; a coil fed below its rating will chatter and burn out.", "Start the motor DOL and check the contactor does not drop out on the starting dip; confirm the E300/overload does not trip on a healthy start.", "Confirm the contactor drops out when Stop is pressed, when the overload trips, and when control power is removed."], "tuning": "A contactor has no ramp to tune, but two ratings decide whether it survives: AC-3 (switching a running motor, making and breaking starting current) and AC-1 (resistive, no inrush). Always size on AC-3 for motors; the AC-1 number is much higher and will mislead you. AC-4 (plugging / inching a motor) is the hardest duty and de-rates the contactor sharply - check the AC-4 table in 100-TD013 before using a 100-C for jogging. If the contactor chatters, the coil voltage is low or the coil is the wrong code; if the poles weld, the short-circuit device did not clear the fault or the contactor is undersized for the starting current.", "faults": [{"code": "Contactor chatters / buzzes", "meaning": "Coil voltage too low, wrong coil code, or a loose coil connection", "fix": "Measure the voltage at the coil terminals; confirm the coil code matches the supply (e.g. D = 120V 60 Hz); tighten connections; check for a voltage dip on start."}, {"code": "Contactor will not pull in", "meaning": "No coil voltage, open control circuit (Stop, overload trip contact open, or E300 trip latched), or a failed coil", "fix": "Trace the control circuit with a meter; check the overload/E300 trip state and reset it; check coil continuity and replace the coil/contactor if open."}, {"code": "Contactor welds / will not drop out", "meaning": "Main poles welded by a short circuit or by breaking a current above the AC-3 rating", "fix": "Isolate upstream, replace the contactor; find the short or the overload that caused the weld; confirm the 140M/MCP coordination rating (Type 2) for the combination."}, {"code": "Overheating / burnt poles", "meaning": "Loose power terminals, undersized contactor for the duty (AC-4 jogging), or a single-phased motor drawing excess current", "fix": "Torque power terminals to the manual value; re-size on AC-3/AC-4 for the real duty; check all three phases and the overload setting."}], "manualUrl": "https://files.kempstoncontrols.com/files/8ce78e3bca34fa45378a5a921d189111/100-C85D00.pdf", "sources": ["https://files.kempstoncontrols.com/files/8ce78e3bca34fa45378a5a921d189111/100-C85D00.pdf", "https://www.artisantg.com/info/allen_bradley_100_c16d10_manual_2016121144135.pdf", "https://rexelcanada.a.bigcontent.io/v1/static/ALB109C12AHA2E14RG90_1_P_PROD_SPEC_ALB100C37UEJ10CutSheeten1 (Rexel mirror of 100-TD013J-EN-P)", "https://gesrepair.com/wp-content/uploads/2026/01/document/Allen%20Bradley_170-PW205.pdf (gesrepair.com second copy of 100-TD013J-EN-P)"], "tbd": [], "subcategory": "contactor", "sourceFile": "starters.json"}, {"id": "ab-140m", "category": "starter", "family": "Bulletin 140M", "catalogNumbers": ["140M-C2E-A63", "140M-C2N-B16", "140M-D8N-B40", "140M-F8E-C45"], "name": "Bulletin 140M Motor Protection Circuit Breaker", "whatItIs": "The Bulletin 140M is a motor protection circuit breaker (MPCB): one device that gives a motor branch circuit short-circuit protection (magnetic trip) and overload protection (adjustable thermal trip, Trip Class 10) plus manual switching and isolation. It is the front end of a starter: 140M on the line side, then a contactor (100-C) and an overload relay (E300) or a soft starter downstream.", "whenToUse": "Use a 140M (E-type, adjustable thermal + fixed magnetic) as the branch-circuit device in a 2-component starter (140M + contactor) or as the short-circuit device in a 3-component starter. Use the magnetic-only 140M-N motor circuit protector (MCP) instead when a separate overload relay (E300) will do the thermal protection - that is the 140M + 100-C + E300 combination in the Rockwell coordination tables. Do not use a 140M as a general molded-case breaker: it is not a UL 489 breaker.", "selection": "Frames (Publication 140M-TD002): C-Frame 0.1...32 A, D-Frame 1.6...32 A, F-Frame 6.3...45 A, CMN-Frame 16...90 A (with 140-CMN). Pick the current range that contains the motor FLC, then the interrupting rating: 2 = Normal Break, 8 = High Break. Protection type: E = adjustable thermal / fixed magnetic at 13 x In; T = adjustable thermal / fixed magnetic at 16...20 x In (high inrush motors); N = magnetic-only MCP. Example decode: 140M-C2E-A63 = C-frame, normal break, E-type, 0.63 A range. NOTE: Rockwell discontinued the 140M on 31 March 2025; the engineering replacement family is 140MT. 140MT is the current buy (Publication 140-TD005E-EN-P, Feb 2024): C-frame max 32 A, D-frame 40 A, F-frame 45 A; current ranges 0.1...32 A (C), 0.4...40 A (D), 6.3...45 A (F); trip class 10A (140MP), 10 (140MT/140M); phase-loss sensitivity; Type F ratings with 100-C and 100-E contactors. Example decode 140MT-C3E-B63-KN-MT-XC-GK: 140MT = bulletin; C = 32 A Frame C (D = 40 A Frame D); 3 = Normal break (9 = High break); E = Adjustable Thermal/Fixed Magnetic (14 x In) MPCB (N = Fixed Magnetic (14 x In) MCP; T = Adjustable Thermal/Fixed Magnetic (18...22 x In) high-inrush; V = Fixed Magnetic, VFD multimotor); B63 = current range - A = 0.10 (A16 = 0.16 A), B = 1.0 (B16 = 1.6 A), C = 10 (C16 = 16 A); KN = black lockable knob (KY red/yellow, KB blue C-frame only, TE normal break); MT = standard busbar mount, top; XC = auxiliary contacts (1st code front: X no contact, B 1 N.O., C 1 N.O. + 1 N.C., D 2 N.O., R 1 N.C. + 1 N.O. (SC+OL), S 1 N.O. + 1 N.O. (SC+OL), M 1 N.O. + 1 N.C. (SC+OL), N 1 N.O. (SC+OL) + 1 N.O. (SC); 2nd code right side: X no contact, C 1 N.O. + 1 N.C., D 2 N.C., E 2 N.C.); GK = undervoltage trip 24V 50 Hz (GD 110V 50 Hz/120V 60 Hz, GF 220...230V 50 Hz, GA 240...260V 60 Hz, GN 380...400V 50 Hz, GB 480V 60 Hz/415V 50 Hz; shunt trips PK 24V 50 Hz, PD 110V 50 Hz/120V 60 Hz, PF 220...230V 50 Hz, PA 240...260V 60 Hz, PT 240V 50 Hz/277V 60 Hz, PN 380...400V 50 Hz, PB 480V 60 Hz/415V 50 Hz, PZJ 24V DC). F-frame example 140M-F8E-C10: F = 45 A Frame F, 8 = High break, E = Adjustable Thermal/Fixed Magnetic (F-frame magnetic is 13 x In per Table 27; T = 16...22 x In), C10 = 10 A range. Migration: 140M-C2E-A16 maps to 140MT-C3E-A16; 140MT-D9T is the high-magnetic fixed 18...22 x Ie variant.", "wiring": {"power": "Line in at L1/L2/L3 (top), load out at T1/T2/T3 (bottom) to the contactor or starter. Use 75 C copper wire only. For the F-frame: 1 x 4...50 mm2 (No. 12...1/0 AWG), torque 5...6 N-m (45...54 lb-in). C-frame main terminals: torque 2...2.5 N-m (18...22 lb-in); single conductor 1...6 mm2 (No. 16...10 AWG). D-frame main terminals: torque 3...3.5 N-m (27...30 lb-in); single conductor 2.5...25 mm2 (No. 14...4 AWG). (140M-TD002B main-terminal table, pp. 24-25.) For 1- or 2-phase motor applications, loop the unused pole per the wiring diagram in the installation sheet so all three thermal elements see current.", "feedback": "Front-mounted auxiliary contacts: 140M-C-AFA10 (1 N.O., 13-14) or 140M-C-AFA01 (1 N.C., 11-12); trip contacts 140M-C-AFAR10A10 signal a trip (short-circuit and overload, 27-28). Right-side auxiliaries 140M-C-ASA20 / ASA02 add 9 mm width. Undervoltage trip (140M-C-UXD for 110V 50 Hz / 120V 60 Hz) trips the breaker when voltage falls below 35...70%; shunt trip 140M-C-SNJ (24V) trips it on command - both mount on the left and add 18 mm.", "safety": "Do not set the current dial outside its marked scale. The 140M-F*N and KTB7-45H magnetic-only variants provide NO thermal protection for themselves or downstream components - a separate overload relay must be installed as part of the starter combination. The device meets IEC 60947-2 as a circuit breaker and is cULus listed as a Manual Motor Controller and, with the Type E adapter, as a Manual Self-Protected Combination Motor Controller; it does not meet UL 489 for molded-case breakers in North America.", "network": "the 140M is a purely electromechanical device with no network port; status comes only from its auxiliary/trip contacts wired into the control circuit or an input module."}, "configuration": [{"step": "Select the frame and current range so the motor FLC falls inside the dial range", "screen": "140M current dial / catalog decode (140M-TD002)", "parameter": "Current range code (e.g. A63 = 0.63 A, C25 = 25 A, C45 = 45 A)", "value": "C 0.1...32 A; D 1.6...32 A; F 6.3...45 A; CMN 16...90 A", "source": "Rockwell Publication 140M-TD002B/G-EN-P"}, {"step": "Set the overload (thermal) dial to the motor current", "screen": "Front rotary dial", "parameter": "Overload release current setting", "value": "Set to 105% of motor current (installation sheet instruction); never set outside the marked scale", "source": "140M-F Motor Protection Circuit Breaker installation sheet (41053/21.303.910-01)"}, {"step": "Choose the magnetic trip type for the load", "screen": "Catalog number, protection-type code", "parameter": "Protection type E / T / N", "value": "E: fixed magnetic 13 x In (standard). T: fixed 16...20 x In (high-inrush / high-efficiency motors). N: magnetic-only MCP - use only with a separate overload relay (E300)", "source": "Rockwell Publication 140M-TD002B-EN-P"}, {"step": "Fit the Type E adapter and accessories for a self-protected combination starter", "screen": "Hardware: 140M-C-TE1 Type E adapter, aux/trip contacts", "parameter": "140M-C-TE1 adapter; 140M-C-AFA10/AFA01 aux; 140M-C-AFAR trip contact", "value": "Type E listing needs the adapter and the correct spacing; a Type F combination is a Type E 140M plus a contactor (100-C) or SMC, both tested together", "source": "Rockwell Publication 140M-TD002B-EN-P, Type E / Type F section"}, {"step": "Coordinate the downstream starter from the Rockwell short-circuit coordination tables", "screen": "Coordination table SCCR-16342E (or 190-TD004)", "parameter": "140M + 100-C + E300 combination, Type 2 coordination", "value": "Example at 460V, 65 kA: 5 Hp motor (7.6 A) = 140M-D8N-C10 (130 A magnetic) + 100-C09 + 193-ESM-*-30A-C23; 15 Hp (21 A) = 140M-D8N-C16 + 100-C16 + 193-ESM-*-30A-C23", "source": "Rockwell Short-Circuit Coordination SCCR-16342E (3C starter, MCP + contactor + OLR, Type 2, 65 kA at 480V)"}, {"step": "Coordinate the 140MT with the downstream contactor from the Type F combination tables", "screen": "140-TD005E Tables 46 and 48", "parameter": "140MT + 100-C combination, SCCR", "value": "Table 46 (UL 60947 Type 1, Type F with 100-C): 140MT-C3E-A16 + 100-C09 = 65 kA at 480V / 50 kA at 600V. Table 48 (UL 60947-4-1 Type F, Type 2 with 100-C): 140MT-D9E-C40 + 100-C37 = 30 kA at 480V; 140M-F8E-C45 + 100-C37 = 65 kA at 480V / 18 kA at 600V. See the full tables in the manual for the complete pairing list.", "source": "Rockwell Publication 140-TD005E-EN-P, Tables 46 and 48, pp. 42-46 (CNW shop mirror)"}, {"step": "Use installation sheet 140MT-IN011A-MU-P (April 2021) for C- and D-frame 140MT breakers", "screen": "140MT-IN011A-MU-P", "parameter": "Installation sheet (C/D frames)", "value": "Covers Bul. 140MT-C3E-..., 140MT-D9E-..., 140MT-D9N-..., 140MT-D9T-..., 140MT-D9V-... - one sheet for both C- and D-frames. Contents: 5-step proper-connection procedure; minimum distances to grounded parts (X1/X2 30 mm at 400/500V, 50 mm at 690V; Y 9 mm at 400/500V, 30 mm at 690V; Z 7.5 mm C-frame, 13.5 mm D-frame); 1-/2-phase wiring (set to 105% of motor current, 'Do not set outside scale!'); short-circuit ratings tables; Ex/ATEX notes. The legacy 140M sheet was the original question; the current buy is 140MT and its C/D sheet is 140MT-IN011A; the existing data's F-frame sheet 41053/21.303.910-01 is the legacy 140M-F sheet.", "source": "Rockwell Publication 140MT-IN011A-MU-P (April 2021) (manualspro.net mirror)"}], "commissioning": ["Confirm the dial setting (105% of motor current) and that the range code matches the motor FLC.", "Operate the handle OFF/ON and confirm the motor starts and stops; confirm the handle shows TRIPPED distinctly from OFF after a trip.", "Test the trip function only as the manual allows (do not defeat the thermal element); confirm an overload trip opens the starter and the trip contact (if fitted) signals.", "Confirm aux/trip contacts switch as expected (N.O. aux closed when ON, trip contact closed only when tripped).", "Record the coordination combination (140M + contactor + overload catalog numbers) on the panel schedule so a like-for-like replacement keeps the Type 2 rating."], "tuning": "There is no ramp to tune on a 140M. The only adjustments are the thermal dial (105% of motor current) and the choice of magnetic trip (E 13x, T 16-20x, N magnetic-only). If the breaker trips on motor start, the magnetic trip is too low for the inrush - step from E to T, or check for a genuine short. If it trips on running overload, check the real load current against the dial, not the dial against the load: a dial set below the true FLC will nuisance-trip, and a dial set above it will not protect the motor. Trip Class is fixed at 10 on the 140M.", "faults": [{"code": "Overload trip (thermal)", "meaning": "Motor current above the dial setting long enough for the Class 10 thermal element to trip", "fix": "Check the real load and current draw; confirm the dial is 105% of motor current and the range is correct; let the thermal element cool, then reset by moving the handle to OFF and back to ON."}, {"code": "Short-circuit trip (magnetic)", "meaning": "Instantaneous magnetic trip at 13 x In (E) or 16...20 x In (T) - a short circuit or a very high inrush", "fix": "Do not just reset: find and clear the short (motor, cable, starter) and megger the motor; if it trips only on start with no fault found, consider the T (high magnetic) variant for a high-inrush motor."}, {"code": "Undervoltage trip (if UX fitted)", "meaning": "Supply voltage fell below 35...70% and the undervoltage release tripped the breaker", "fix": "Restore the supply voltage; check for a loose supply or a failing control transformer; the breaker must be manually re-closed."}, {"code": "Nuisance trip on start", "meaning": "Magnetic trip set too low for the motor inrush, or the thermal dial set below the true FLC", "fix": "Verify the motor FLC and inrush; move from E to T magnetic trip if the motor is high-inrush/high-efficiency; re-set the thermal dial to 105% of motor current."}], "manualUrl": "https://media.distributordatasolutions.com/Rockwell/files/File_140M_Motor_Protection_Circuit_Breakers_140M-TD002_EN_1.pdf", "sources": ["https://media.distributordatasolutions.com/Rockwell/files/File_140M_Motor_Protection_Circuit_Breakers_140M-TD002_EN_1.pdf", "https://www.manualshelf.com/manual/rockwell-automation/140m-f-motor-protection-circuit-breaker/owner-manual-english/page-2.html", "https://configurator.rockwellautomation.com/api/doc/SCCR-16342E.pdf", "https://www.rockwellautomation.com/en-us/products/details.140M-F8E-C45-GD-KY-RQ-TE.html", "https://shop.cnw.com.au/medias/A-B140MTC3EC10-Catalog.pdf (CNW shop mirror of 140-TD005E-EN-P)", "https://manualspro.net/40821-allen-bradley-140mt-c3e-breaker-motor-protection-instruction-manual (manualspro.net mirror of 140MT-IN011A-MU-P)", "https://media.distributordatasolutions.com/Rockwell/files/File_140M_Motor_Protection_Circuit_Breakers_140M-TD002_EN_1.pdf (distributor mirror of 140M-TD002B-EN-P)"], "tbd": [], "subcategory": "protection", "sourceFile": "starters.json"}, {"id": "ab-e300", "category": "starter", "family": "E300", "catalogNumbers": ["193-ESM-VIG-30A-C23", "193-ESM-IG-60A-C55", "193-ESM-IG-100A-C97", "193-ECM-ETR", "193-ECM-DNT"], "name": "E300 Electronic Overload Relay", "whatItIs": "The E300 (Bulletin 193/592) is a microprocessor electronic overload relay that protects 3-phase or single-phase AC induction motors rated 0.5...65,000 A. It is modular: a sensing module (current, and optionally ground-fault and voltage/power), a control module, a communication module, plus optional digital/analog expansion I/O, an operator station and an expansion-bus power supply. It replaces a bimetallic overload with a thermal model, metering, diagnostics and network control in one device.", "whenToUse": "Use the E300 as the overload in a 3-component starter (140M magnetic-only MCP + 100-C contactor + E300) or in a DOL/reversing starter where you want more than a bimetallic strip: adjustable trip class 5...30, jam/stall/underload/imbalance/ground-fault/power protection, metering, and EtherNet/IP or DeviceNet control and diagnostics. Use a 140M-E (with its own thermal trip) instead for a simple 2-component starter with no network need; use the SMC Flex/50 built-in overload when the starter already has one and a separate relay would be redundant.", "selection": "Select the sensing module by motor FLC: 0.5...30 A (193-ESM-*-30A), 6...60 A (60A), 10...100 A (100A), 20...200 A (200A); above 200 A use external current transformers, to 65,000 A. Match the sensing module to the contactor: 30A modules pair with 100-C09...C23, 60A with 100-C30...C55, 100A with 100-C60...C97, 200A with 100-E (per the E300 manual starter-assembly tables and the SCCR coordination tables). Sensing types: VIG = current + ground-fault current, IG = current + ground fault, P = current + voltage/power. Communication module 193-ECM-ETR is the EtherNet/IP module.", "wiring": {"power": "The sensing module sits in the motor power circuit: motor conductors pass through it (or through external CTs above 200 A). Starter assembly: the E300 mounts directly to a 100-C09...C55 contactor (or 100-C60...C97 with the larger adapter) - see E300 Manual Ch. 2, Starter Assembly Installation. Short-circuit ratings and fuse coordination are in Ch. 2; the E300 is not a short-circuit device and must sit behind a 140M/MCP or fuses.", "feedback": "Outputs: the control module has relay outputs configurable as Trip Relay (opens on trip), Control Relay, Trip Alarm, Warning Alarm and Normal Relay; the Protection Fault State of each output is set by Parameters 304/305 (Relay 0), 310/311 (Relay 1), 316/317 (Relay 2) and 322...342 (expansion outputs). Diagnostics: TRIP/WARN LED blink patterns (e.g. an under-kVA trip flashes red 2-long / 7-short), Device Status 0 (Parameter 20) bits, and trip/warning status parameters. The optional operator station (diagnostic station) displays and edits parameters on the panel door.", "safety": "Install, adjust and maintain only as trained personnel per the manual and local codes; if the equipment is used in a manner not specified, the protection may be impaired. The E300 thermal memory is nonvolatile with a time constant equivalent to Trip Class 20: after a power loss the thermal memory decays as a Class 20 motor cools, and on re-power the relay reads the thermal-memory circuit to set % Thermal Capacity Utilized (Parameter 1) - so a hot motor is still protected after a power cycle. Never bypass the trip relay to keep a tripping motor running.", "network": "EtherNet/IP via the 193-ECM-ETR communication module (dual-port DLR) or DeviceNet via the 193-ECM-DNT module. These are the only two communication modules for the E300 (193-UM015 Ch. 4, Table 34, Parameter 223); there is no ControlNet module. The E300 appears in the Logix I/O tree through its Add-On Profile; a hardware mismatch (e.g. a 30 A sensing module fitted where a 60 A was expected) shows as flashing Power/MS/NS LEDs. Enable Option Match Protection Trip (Parameter 186) to trip on a module mismatch. Parameters 23...25 identify the fitted modules; Parameter 38/39 report a mismatch."}, "configuration": [{"step": "Assemble the base relay: sensing module to control module to communication module, then expansion bus peripherals", "screen": "Hardware assembly, E300 Manual Ch. 2", "parameter": "Module assembly order", "value": "Sensing module + control module + communication module; expansion digital/analog I/O and operator station on the expansion bus; expansion-bus power supply if needed", "source": "E300 User Manual 193-UM015E-EN-P Ch. 2 Base Relay Assembly"}, {"step": "Mount the E300 to the contactor as a starter assembly", "screen": "Hardware, Ch. 2 Starter Assembly", "parameter": "Starter assembly", "value": "100-C09...C55 starter assembly (Ch. 2 p.34); 100-C60...C97 (p.35); 100-D115...D180 (p.36)", "source": "E300 User Manual 193-UM015E-EN-P Ch. 2"}, {"step": "Enter the motor full-load current - this is the single most important setting", "screen": "Diagnostic station / Parameters", "parameter": "Parameter 171 FLA", "value": "Set to the motor nameplate FLC; FLA and Trip Class are the two parameters that drive the thermal capacity (overload) algorithm. A second FLA (Parameter 177 FLA2) is available for two-speed / dual-motor setups", "source": "E300 User Manual 193-UM015E-EN-P Ch. 6 (Table 227)"}, {"step": "Set the trip class", "screen": "Diagnostic station / Parameters", "parameter": "Parameter 172 Trip Class", "value": "Adjustable 5...30, default 10. Trip class is the maximum time (in seconds) for the relay to trip at 6x rated current; standard classes 5, 10, 20, 30 have published time-current curves (Figure 210)", "source": "E300 User Manual 193-UM015E-EN-P Ch. 6 (Table 229, Figure 210)"}, {"step": "Enable the overload trip (and the other trips you need)", "screen": "Diagnostic station / Parameters", "parameter": "Parameter 183 TripEnableI (current-based trips incl. Overload Trip); Parameter 186 TripEnableC / Control Trip Enable", "value": "Overload Trip must be enabled in TripEnableI (Parameter 183) or the relay will not trip the contactor on overload. Enable Option Match Trip in Parameter 186 bit 8 to trip on a module mismatch", "source": "E300 User Manual 193-UM015E-EN-P Ch. 4/6 (control-circuit notes repeat this on every starter diagram)"}, {"step": "Set jam, stall and underload levels to suit the load", "screen": "Diagnostic station / Parameters", "parameter": "Parameter 250 Stall Trip Level; Parameter 254 Jam Warn Level; Parameter 258 Underload Warning Level; Parameters 282/283 L3 Over Current Trip Delay/Level", "value": "Stall 100...600% of FLA (Parameter 171); Jam warning 50...600% FLA; Underload warning 10...100% FLA; L3 Over Current Trip Level 10...100% FLA with delay 0.1...25.0 s (Parameter 282)", "source": "E300 User Manual 193-UM015E-EN-P Ch. 5/6"}, {"step": "Set the external current-transformer ratio (Parameters 263/264) when using external CTs above 200 A", "screen": "Diagnostic station / Parameters", "parameter": "Parameter 263 CT Primary; Parameter 264 CT Secondary", "value": "CT Primary default 5, range 1...65535 A; CT Secondary default 5, range 1...65535 A. Use the primary current for FLA (Parameter 171). The 200 A sensing module is direct 20...200 A; above 200 A use external CTs, to 65,000 A.", "source": "193-UM015E-EN-P Ch. 2 pp. 62-63 (Routeco cloudinary mirror)"}, {"step": "Fit one external CT per phase, protective-relaying rated", "screen": "Hardware, Ch. 2 Current Transformer Ratio", "parameter": "External CT requirements", "value": "External-CT sensing modules: 193-ESM-IG-30A-E3T/T/P, 193-ESM-I-30A-E3T/T/P, 193-ESM-VIG-30A-CT. One CT per phase; the CT must be protective-relaying rated, accurate within +/-2%, burden 0.1 VA. A Configuration fault (red 3-long / 8-short) appears if FLA is outside the legal range of the CT ratio.", "source": "193-UM015E-EN-P Ch. 2 pp. 62-63 (Routeco cloudinary mirror)"}], "commissioning": ["Confirm the sensing-module range covers the motor FLC and matches the contactor frame (30A/60A/100A/200A as above).", "Confirm FLA (Parameter 171) and Trip Class (Parameter 172) are entered; the relay is in Invalid Configuration mode until its configuration is valid.", "Check the device mode: Administration (configuring), Ready (ready to run), Run (running), Test (test mode). Do not leave it in Test or Invalid Configuration.", "Run the motor and check metering (current per phase, % Thermal Capacity Utilized Parameter 1) against a clamp meter.", "Prove the trip path: a test trip (or the diagnostic station test) must open the Trip Relay and drop the contactor out; confirm the TRIP/WARN LED and Device Status 0 (Parameter 20) report the trip.", "Confirm network health: Power/MS/NS LEDs solid green when scanned; flashing green MS/NS means no connection or a module mismatch - check the I/O tree, the Add-On Profile, Parameters 23...25 and Parameter 186."], "tuning": "The thermal model is set by FLA (Parameter 171) and Trip Class (Parameter 172): Class 10 is the default and suits most motors; Class 5 trips faster for a motor that cannot take a long start; Class 20/30 allow long, heavy starts (large fans, crushers). The nonvolatile thermal memory (Class 20 time constant) means the relay remembers heat across a power cycle - do not defeat it. Jam (current above a level for a time) catches a blocked load; Stall (locked-rotor current, 100...600% FLA) catches a motor that never gets up to speed; Underload (10...100% FLA) catches a broken belt, a dry pump or a snapped shaft. Each has an inhibit time that holds the protection off during the start, so the start itself does not false-trip. Set warning levels first, watch them in normal running, then set trip levels above the normal running envelope.", "faults": [{"code": "Overload trip", "meaning": "Thermal capacity utilised reached 100% - the motor ran above FLA long enough for the Class 5...30 curve to trip", "fix": "Check the real load and current; confirm FLA (Parameter 171) and Trip Class (Parameter 172) match the motor; check for a hot motor, blocked ventilation or a dragging load; let the thermal memory decay before restarting."}, {"code": "Jam trip", "meaning": "Current stayed above the jam level for the jam delay - a blocked or jammed load", "fix": "Clear the jam (conveyor, crusher, pump); check the jam level/delay against the normal running current."}, {"code": "Stall trip", "meaning": "Locked-rotor current (Parameter 250, 100...600% FLA) persisted - the motor never reached speed", "fix": "Check for a seized load, a single-phased supply, or a starting voltage too low; check the ramp if a soft starter is upstream."}, {"code": "Current imbalance trip", "meaning": "Phase currents are unbalanced beyond the programmed level - a lost phase, a bad connection or a winding fault", "fix": "Check all three phases, power and motor connections, and megger the motor; imbalance % = 100% x (Id/Ia) per the manual."}, {"code": "Ground-fault trip (VIG/IG sensing module)", "meaning": "Ground-fault current above the programmed level - insulation breakdown or foreign material in the motor", "fix": "Megger the motor and cable; do not re-start until the insulation fault is found; check the ground-fault level/delay settings."}, {"code": "MS/NS LEDs flashing green, Power LED flashing green", "meaning": "Device is Ready but not scanned / no EtherNet/IP connection, or a hardware (module) mismatch", "fix": "Verify the E300 is in the Logix I/O tree with the correct Add-On Profile for its firmware; check Parameters 23...25 match the fitted modules; check Parameters 38/39 for the mismatch; check Parameter 186 (option-match trip); check the network switch and cabling."}, {"code": "Phase Loss - TRIP/WARN LED red 0 long / 2 short", "meaning": "A supply phase is missing.", "fix": "Check for an open line (e.g. blown fuse); check all power terminations from the branch-circuit-protecting device down to the motor for proper tightness and that the overload-to-contactor connection is secure; inspect the contactor for proper operation; for single-phase applications Single/Three Phase (Parameter 176) must be set to 'single phase'."}, {"code": "PTC - TRIP/WARN LED red 3 long / 2 short", "meaning": "Motor stator windings overheated (thermistor).", "fix": "Check for the source of motor overtemperature (overload, obstructed cooling, high ambient temperature, excessive starts/hour); inspect thermistor leads for a short-circuit or open."}, {"code": "Nonvolatile Memory - TRIP/WARN LED red 3 long / 14 short", "meaning": "Nonvolatile memory fault - statistics, history logs and % TCU corrupted (e.g. after a firmware downgrade).", "fix": "Execute the Clear Command to clear the operating statistics, history logs and % TCU; if the fault is an internal product failure, consult the factory."}, {"code": "Hardware Fault - TRIP/WARN LED red 3 long / 7 short", "meaning": "Sensing-module firmware incompatible with control-module firmware, or a hardware configuration failure.", "fix": "Verify the firmware revisions of the control module and sensing module; update control-module firmware to v2.0 or higher; consult the factory; verify the Sensing, Control and Communication Modules are connected properly; verify the connection pins between the sensing and control modules are not bent."}, {"code": "Configuration - TRIP/WARN LED red 3 long / 8 short", "meaning": "Illegal/invalid configuration.", "fix": "For three-phase applications Single/Three Phase (Parameter 176) should be set to 'Three-Phase' (for single-phase, verify current flows through L1 and L2 only); if Operating Mode is 'Overload (Network)' verify one of the Output Assignments (Parameters 202...204) is configured as a 'Trip Relay'; review Invalid Configuration Parameter (Parameter 38) and Invalid Configuration Cause (Parameter 39) to identify the illegal parameter and reason."}, {"code": "Remote Trip - TRIP/WARN LED red 3 long / 5 short", "meaning": "Contact closure of a remote sensor (e.g. vibration switch).", "fix": "Take corrective action to address the issue that caused the sensor to actuate; check the sensor for proper operation; check the wiring."}, {"code": "Blocked Start - TRIP/WARN LED red 3 long / 6 short", "meaning": "Start blocked by the starts-per-hour / operating-hours limits.", "fix": "If Starts Counter (Parameter 29) is at or above Total Starts Warning (Parameter 207), set Clear Command (Parameter 165) to 'Clear Operating Statistics' to reset the Starts Counter; if Operating Time (Parameter 28) is at or above Total Operating Hours Warning (Parameter 208), use the same Clear Command to reset Operating Time; if the starts in the past hour equal Starts Per Hour (Parameter 205), check Time to Start (Parameter 31) and wait, or change the configuration to allow more starts/hour; if the time since the most recent start is less than Starts Interval (Parameter 206), check Time to Start and wait, or shorten the interval."}, {"code": "Test trip - TRIP/WARN LED red 3 long / 1 short", "meaning": "Test trip from operating the Test/Reset button.", "fix": "Operate the Test/Reset button to clear."}], "manualUrl": "https://che-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/193-um015_-en-p.pdf?A294B0768B6A5DA9BD75857AB16495A27DB582B5B69D&ts=1781064314721", "sources": ["https://che-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/193-um015_-en-p.pdf?A294B0768B6A5DA9BD75857AB16495A27DB582B5B69D&ts=1781064314721", "https://configurator.rockwellautomation.com/api/doc/SCCR-16342E.pdf", "https://che-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/193-um015_-en-p.pdf (Routeco cloudinary mirror of 193-UM015E-EN-P)"], "tbd": [], "subcategory": "protection", "sourceFile": "starters.json"}, {"id": "ab-smc-flex", "category": "starter", "family": "SMC Flex", "catalogNumbers": ["150-F108FBDB", "150-F361NBDB"], "name": "SMC Flex Soft Starter", "whatItIs": "The SMC Flex (Bulletin 150-F) is Rockwell's mid-range soft starter: a microprocessor controller with a built-in keypad and LCD (or optional 20-HIM LCD), internal bypass contactor, built-in electronic overload, metering, and DPI communication. It covers 5...1250 A and comes in Standard, Pump Control and Braking (SMB) options.", "whenToUse": "Pick SMC Flex over SMC-3 when you need a display and real setup (not DIP switches), metering, pump control to kill water hammer, Smart Motor Braking, dual ramp, preset slow speed, ground-fault or PTC protection, or control over DPI/DeviceNet/EtherNet/IP. Pick SMC-50 instead when you need torque control, linear speed accel/decel, energy saver, or the wider power/protection set (17 modes). Pick SMC-3 when the job is simple and a display is not wanted.", "selection": "Select by motor FLC; family range 5...1250 A (frames 5...85, 108...135, 201...251, 317...480, 625...780, 970...1250 A). Line voltage 200...480V, 200...600V or 230...690V depending on frame/option. Control power 100...240V AC or 24V AC/DC (5...480 A units, terminals 11/12); 625...1250 A units take 110/120V or 230/240V AC through terminal block CP1. The Motor Overload parameter must be programmed by the installer; overload protection is not automatic. Catalog decode (150-TD009A p. 29), example 150-F135NBDB: 150 = Solid-state Controller (bulletin number); F135 = rating 135 A, 100 Hp at 460V AC. Ratings (A / Hp at 460V AC): F5 5 A/3 Hp, F25 25 A/15 Hp, F43 43 A/30 Hp, F60 60 A/40 Hp, F85 85 A/60 Hp, F108 108 A/75 Hp, F135 135 A/100 Hp, F201 201 A/150 Hp, F251 251 A/200 Hp, F317 317 A/250 Hp, F361 361 A/300 Hp, F480 480 A/400 Hp, F625 625 A/500 Hp, F780 780 A/600 Hp, F970 970 A/800 Hp, F1250 1250 A/1000 Hp. Enclosure: N = Open. Line voltage: B = 200...460V AC, 3-phase, 50/60 Hz; C = 200...575V; Z = 230...690V AC, open only, 108 A and above, 690V AC line-connected only. Control voltage: D = 100...240V AC (5...480 A units), R = 24V AC/DC (5...480 A units), E = 110/120V AC (625...1250 A units), A = 230/240V AC (625...1250 A units). Option: Blank = Standard, B = Pump Control, D = Braking Control. For 24V AC/DC control power, a separate 120V or 240V single-phase supply is required for fan operation. Devices 108 A and greater are not equipped with line/load terminal lugs.", "wiring": {"power": "Line L1/L2/L3 to 1/3/5, motor T1/T2/T3 to 2/4/6 for line connection; inside-the-delta uses T4/T5/T6 as well (see Quick Start power-wiring diagrams: Line, Delta with isolation contactor, Delta with shorted-SCR protection). Power lug torque: 5...85 A, 11.3 N-m (100 lb-in); 108...135 A, 31 N-m (275 lb-in) wire-to-lug. Vertical mounting only, 15 cm (6 in.) vertical clearance, enclosure minimum IP23/NEMA 1, recommended IP54/NEMA 12, internal temperature -5...50 C.", "feedback": "Four auxiliary contacts: Aux #1 terminals 19/20, Aux #2 29/30, Aux #3 31/32, Aux #4 33/34; each configurable (Parameters 107, 110, 108, 109) as Normal, Up-to-Speed, Fault, Alarm, Network Control or External Bypass. PTC input terminals 23/24, tachometer 25/26, ground-fault transformer input 27/28. Metering (volts, current, kW, kWh, power factor, motor thermal usage) is on the HIM under Parameters / Monitoring / Metering.", "safety": "Hazardous voltage is present in the motor circuit even when the controller is off; disconnect main power before working on it. A failed SCR can cause a single-phase condition and overheating, so an isolation contactor or shunt-trip breaker on the line side capable of interrupting locked-rotor current is recommended. Stopping modes are not an emergency stop. Pump stopping may cause motor heating, so use the lowest stopping time that stops the pump satisfactorily. Slow speed is not for continuous running (reduced motor cooling). Disconnect the controller before Megger-testing the motor; never IR-test the controller itself.", "network": "DPI port: up to two peripheral devices, maximum 280 mA through the DPI port. Start/stop via DPI only is possible with an isolation contactor (K1); Parameter 87 Logic Mask selects the control source: 4 = HIM only, 32 = communication port only, 44 = all DPI ports. Communication adapters (DeviceNet, EtherNet/IP, ControlNet) plug into the DPI port; loss of DPI comms is Fault 27...32."}, "configuration": [{"step": "In the Basic Set Up group (Parameters menu, then Set Up), confirm SMC Option (Parameter 14) and Motor Connection (Parameter 15)", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 14 SMC Option; Parameter 15 Motor Connection", "value": "SMC Option is factory-set, read-only (Standard, Pump Control or Brake). Motor Connection: Line or Delta, default Line", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Enter the system line voltage", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 16 Line Voltage", "value": "0...10000 V, default 480", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Choose the starting mode", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 17 Starting Mode", "value": "Soft Start, Current Limit, Full Voltage, Linear Speed or Pump Control; default Soft Start", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Set the ramp time and initial torque (Soft Start) or current limit level (Current Limit)", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 18 Ramp Time; Parameter 19 Initial Torque; Parameter 20 Current Limit Level", "value": "Ramp 0...30 s, default 10 s; Initial Torque 0...90% LRT, default 70%; Current Limit 50...600% FLC, default 350%", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Set kickstart time and level if the load needs a breakaway pulse", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 22 Kickstart Time; Parameter 23 Kickstart Level", "value": "Time 0.0...2.0 s, default 0 (off); Level 0...90% LRT, default 0", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Set the stop mode and stop time, and the stop-input behaviour", "screen": "Parameters / Set Up / Basic Set Up", "parameter": "Parameter 32 Stop Mode; Parameter 33 Stop Time; Parameter 133 Stop Input; Parameter 132 Option Input 1; Parameter 24 Option Input 2", "value": "Stop Mode Soft Stop, Linear Speed, SMB, Accu-Stop or Pump Stop, default Soft Stop; Stop Time 0.0...120 s, default 0.0; Stop Input (terminal 18) Coast or Stop Option, default Coast", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Program motor protection: overload class, service factor, motor FLC and reset mode - this is mandatory, the overload does not protect until FLC is entered", "screen": "Parameters / Motor Protection", "parameter": "Parameter 44 Overload Class; Parameter 45 Service Factor; Parameter 46 Motor FLC; Parameter 47 OL Reset Mode", "value": "Class Disable, 10, 15, 20 or 30, default 10; Service Factor 0.01...1.99, default 1.15 (1.0 typical for IEC motors); Motor FLC 1.0...2200 A, default 1.0; Reset Auto or Manual, default Manual", "source": "SMC Flex Quick Start 150-QS001G-EN-P, Step 3"}, {"step": "Set the ground-fault trip level, delay and inhibit time (Parameters 72-75)", "screen": "Parameters / Protection / Ground Fault", "parameter": "Parameter 72 Gnd Flt Enable; Parameter 73 Gnd Flt Level; Parameter 74 Gnd Flt Delay; Parameter 75 Gnd Flt Inh Time", "value": "Enable: Disable/Enable, default Disable. Level: 1.0...5.0 A (5.0...25 A on 625/780/970/1250 A units), default 2.5 A (5.0 A on large units). Delay: 0.1...250.0 s, default 0.5 s. Inhibit time: 0...250 s, default 10 s. The unit trips on ground fault when the current is at or above the level for longer than the delay after the inhibit time expires.", "source": "150-UM008 Series B, Appendix B Table B.1 (Routeco cloudinary mirror)"}, {"step": "Set the ground-fault alarm level and delay (Parameters 76-78)", "screen": "Parameters / Protection / Ground Fault", "parameter": "Parameter 76 Gnd Flt A Enable; Parameter 77 Gnd Flt A Lvl; Parameter 78 Gnd Flt A Dly", "value": "Alarm Enable: Disable/Enable, default Disable. Alarm Level: 1.0...5.0 A (5.0...25 A on 625/780/970/1250 A units), default 2.0 A. Alarm Delay: 0...250 s, default 10 s.", "source": "150-UM008 Series B, Appendix B Table B.1 (Routeco cloudinary mirror)"}, {"step": "Fit the external core-balance current transformer for ground-fault protection", "screen": "Hardware, Ch. 2 / Appendix B", "parameter": "External core-balance CT 825-CBCT", "value": "Ground-fault protection requires an external core-balance CT (825-CBCT) on 5...480 A units; the CT senses the ground-fault current that Parameters 72-78 act on.", "source": "150-UM008 Series B, Appendix B Table B.1 (Routeco cloudinary mirror)"}], "commissioning": ["Verify input supply voltage and wiring; check output wiring; check control wiring (Quick Start Step 4 checklist, items 1-3).", "Apply control power (Step 4, item 4).", "Test local start/stop control (Step 4, item 5) in 2-wire or 3-wire control as wired, with the isolation contactor K1 if fitted.", "View metering: Main Menu / Parameters / Monitoring / Metering - confirm volts and current on all three phases and that motor thermal usage is sensible.", "View/clear faults: press Esc to acknowledge, then Main Menu / Diagnostics / Faults / View Fault Queue (or Parameters 124...128); correct the cause first, then clear by holding Esc 3 s, cycling control power, pressing Stop on an external HIM, or Diagnostics / Faults / Clear Fault.", "Confirm Aux contacts do what the wiring expects (e.g. Aux #1 Normal for hold-in, Aux #4 Up-to-Speed or Fault as programmed)."], "tuning": "Soft Start ramps voltage from the Initial Torque level (Parameter 19) to full voltage over the Ramp Time (Parameter 18); raise initial torque if the motor hesitates, lower it if it jerks. Current Limit holds current at Parameter 20 for the ramp time; use it where the supply is weak. Linear Speed ramps speed (not voltage) for a straight-line accel. Pump Control shapes the start and stop to reduce pressure surges and water hammer; for pump stop use the lowest stop time that stops the pump without hammer, because longer pump stops heat the motor. Soft Stop ramps voltage down over Stop Time (Parameter 33). Smart Motor Braking (SMB) brakes the load; Accu-Stop gives accurate stopping position. Dual Ramp (Option Input 2, terminal 15) selects between two Soft Start profiles. Starts Per Hour (Parameter 81) limits starts in one hour.", "faults": [{"code": "1, 2, 3", "meaning": "Line Fault (prestart) - missing supply phase", "fix": "Check for an open line (blown fuse), open load lead, or unstable incoming 3-phase voltage; verify power quality."}, {"code": "4, 5, 6", "meaning": "Shorted SCR (with phase indication)", "fix": "Check for a shorted SCR; replace the power module if necessary."}, {"code": "7, 8, 9", "meaning": "Open Gate (start or stop, with phase indication)", "fix": "Perform a resistance check; check gate-lead connections to the control module; replace the power module if necessary."}, {"code": "10, 11", "meaning": "PTC Power Pole and SCR Overtemp", "fix": "Check ventilation, duty cycle and fan; wait for the motor/controller to cool or provide external cooling; replace the power module or control module as needed."}, {"code": "13, 14, 15", "meaning": "Open Bypass (running, with phase indication)", "fix": "Check control-voltage supply; check control-module TB2...TB4 and TB5...TB7 are secure; check Aux 1-4 are not set to External Bypass; replace the power module if inoperable."}, {"code": "22", "meaning": "Overload (running) - motor overloaded or overload parameters do not match the motor", "fix": "Check the overload condition, verify overload class and motor FLC values, and verify actual current draw."}, {"code": "24 / 25", "meaning": "Jam (24) - current exceeded the programmed jam level; Stall (25) - motor did not reach full speed by the end of the ramp", "fix": "Correct the source of the jam/stall or excessive loading; check programmed jam/stall settings and adjust starting parameters to suit the load."}, {"code": "26", "meaning": "Phase Reversal (prestart only) - incoming supply is not in the expected ABC sequence", "fix": "Check power wiring and correct the phase sequence."}, {"code": "12", "meaning": "Motor PTC - motor thermistor trip", "fix": "Check ventilation and duty cycle; let the motor cool; check PTC resistance."}, {"code": "16, 17, 18", "meaning": "No Load - no load detected on the output", "fix": "Check load-side connections and motor windings."}, {"code": "19", "meaning": "Line Unbalance - supply unbalance above the programmed level", "fix": "Check the power system; extend the delay."}, {"code": "20", "meaning": "Overvoltage - line voltage above the programmed level", "fix": "Check the power system; correct the programmed value."}, {"code": "21", "meaning": "Undervoltage - line voltage below the programmed level", "fix": "Check the power system; correct the programmed value; extend the delay."}, {"code": "23", "meaning": "Underload - load below the programmed underload level", "fix": "Check the machine; check the pump system."}, {"code": "27, 28, 29", "meaning": "Coms Loss - loss of DPI communication", "fix": "Check for a disconnected communication cable."}, {"code": "30, 31, 32", "meaning": "Network - DPI device not communicating", "fix": "Reconnect each DPI device."}, {"code": "33", "meaning": "Ground Fault - ground-fault current above the programmed level", "fix": "Check the power system and motor; check the programmed ground-fault levels."}, {"code": "34", "meaning": "Excess Starts/Hr - starts-per-hour limit exceeded", "fix": "Wait for the starts-per-hour window to clear, or turn off the Starts/Hr feature."}, {"code": "35, 36, 37", "meaning": "Power Loss - loss of line power during operation", "fix": "Check for an open line or blown fuse."}, {"code": "38", "meaning": "Hall ID - power-module identification fault", "fix": "Check the power module; replace the power module if necessary."}, {"code": "39", "meaning": "NVS Error - non-volatile memory (user data) fault", "fix": "Check the user data; reset the default values."}, {"code": "41, 42, 43", "meaning": "Line Loss (with phase indication) - missing supply phase", "fix": "Check the supply-voltage capability; check for loose line/motor connections."}, {"code": "44", "meaning": "V24 Recovery - 24V control supply recovered", "fix": "Check that control power is within the operating parameters; check connections including ground; replace the control module if necessary."}, {"code": "45", "meaning": "V24 Loss - 24V control supply lost", "fix": "Check that control power is within the operating parameters; check connections including ground; replace the control module if necessary."}], "manualUrl": "https://lvmcc-pubs.rockwellautomation.com/pubs/150-QS001G-EN-P.pdf", "sources": ["https://lvmcc-pubs.rockwellautomation.com/pubs/150-QS001G-EN-P.pdf", "https://rexelcanada.a.bigcontent.io/v1/static/ALB150CD31JCD34RGA6P_1_P_PROD_SPEC_ALB150CD10JADCutSheeten1", "https://che-routeco.mo.cloudinary.net/PRODUCT/DOCUMENT/PictureServer/Default.aspx/150-um008_-en-p.pdf (Routeco cloudinary mirror of 150-UM008 Series B)", "https://rexelcanada.a.bigcontent.io/v1/static/ALB150FD25JBD34GR6XP_1_P_PROD_SPEC_ALB150C104NCDK1CutSheeten1 (Rexel mirror of 150-TD009A-EN-P)"], "tbd": [], "sourceFile": "starters.json"}, {"id": "ab-smc-3", "category": "starter", "family": "SMC-3", "catalogNumbers": ["150-C135NBD", "150-C37NBD", "150-C60NBD"], "name": "SMC-3 Soft Starter", "whatItIs": "The SMC-3 (Bulletin 150-C) is a compact solid-state soft starter for 3-phase motors. It uses SCRs to ramp the motor voltage up and down, and it has a built-in electronic overload relay and an integral SCR bypass contactor on all three phases, so the SCRs are bypassed once the motor is up to speed and run cooler.", "whenToUse": "Pick the SMC-3 when the job is simple and cost matters: a pump, fan, conveyor or compressor that only needs soft start, current-limit start, kickstart, soft stop or coast-to-rest, set with DIP switches and one overload dial. Pick SMC Flex instead when you need a display, metering, pump control, braking, dual ramp, ground fault or network control; pick SMC-50 when you need torque/linear-speed control, 17 start/stop modes or advanced power protection.", "selection": "Select by motor full-load current (FLC), never by kW or Hp alone (Rockwell cautions kW ratings are based on a 350% current-limit value). Family range is 3...480 A in sizes 3, 9, 16, 19, 25, 30, 37, 43, 60, 85, 108, 135, 201, 251, 317, 361 and 480 A (Publication 150-TD007). Line voltage 200...460V AC or 200...600V AC, 50/60 Hz; control voltage code D = 100...240V AC, code R = 24V AC/DC (open type only). The 150-C135NBD seed unit is 135 A, 200...460V AC, 100...240V AC control. Enclosed/combination decode (150-TD007 p. 5): 152H = SMC-3 with fusible disconnect, 153H = SMC-3 with circuit breaker; enclosure F = NEMA 4/12 (IP65), X = NEMA 3R (IP44); example 152H-C30FBD43-8L. Enclosed decode (150-TD010, July 2018): 150C noncombination / 152C combination fusible disconnect / 153C combination circuit breaker; ratings D10 108 ... D25 251; enclosure J 1/12/3R; line voltage H 200...208V, A 230V, B 400...460V, C 500...575V; control voltage D 120V AC, J 24V AC, A 240V AC. Note: 150-TD007 uses the 152H/153H suffixes while 150-TD010 uses 152C/153C - the two publications differ, so quote the suffix with its publication. Open decode (150-TD007): 150-C30FBD-8L (N open / F NEMA 4/12; control D 100...240V AC / R 24V AC/DC open only; line B 200...460V / C 200...600V; options 8L line-mounted protective module, 8M load-mounted, 8B both).", "wiring": {"power": "Line L1/L2/L3 to terminals 1/3/5, motor T1/T2/T3 to terminals 2/4/6. Inside-the-delta connection uses terminals 8/T4, 10/T5, 12/T6 as well as 2/T1, 4/T2, 6/T3 (DIP switch 15 selects Line or Delta). Power terminals for the 43...85 A frame take 2.1...95 mm2 (No. 14...3/0 AWG) at 11.3 N-m (100 lb-in).", "feedback": "Aux #1 (terminals 13/14, 1 N.O. plus 1 N.C. on the 43...85 A label) is set by DIP switch 14 to Normal or Up-to-Speed. Fault contact 97/98 is 1 N.O. and changes state on a fault. A single RUN/FAULT LED flashes a code: 1 flash overload, 2 temperature, 3 phase reversal, 4 phase loss/open load, 5 phase imbalance, 6 shorted SCR. The 3...37 A frame uses the same control-terminal strip (installation sheet drawing 41053-167, Series B): A1-A2 control power, 97-98 fault contact (1 N.O.), Aux #1 13/14 (1 N.O.), optional Aux #2, IN1/IN2 control inputs, DIP switches 1-16 with the same functions as the 43...85 A sheet (41053-248-01). The 150-TD007 wiring diagrams (pp. 6-7) and 150-TD009 Figures 1-4 (pp. 16-17) show the same control-terminal strip A1 IN1 IN2 A2 97 98 13 14 for all frames. Note: the IN1/IN2 three-wire functions (Stop on IN1, Start on IN2) are shown by diagram labels only (SB2 'Stop Option', SB3 'Start'; two-wire uses a maintained 'Two-Wire Device') and are not fully verified - terminal numbers only are verified here.", "safety": "Disconnect main power before installing or servicing; hazardous voltage is present in the motor circuit even when the controller is off. Before connecting main power, apply control voltage first so the bypass relays settle to a defined state, or the motor may start inadvertently. The installation sheet recommends an isolation contactor or shunt-trip breaker on the line side capable of interrupting locked-rotor current, because a failed SCR can leave a single-phase condition. Stopping modes are not an emergency stop. Never Megger-test the controller; disconnect it from the motor before insulation-resistance testing.", "network": "There is no network/communication port on the SMC-3 and no DPI/DeviceNet variant: Publication 150-TD007A-EN-P contains zero mentions of 'DeviceNet' or 'communication'; control is hardwired only through IN1/IN2. For network control, step up to SMC Flex or SMC-50."}, "configuration": [{"step": "Set the motor overload dial to the motor FLC, remembering the trip rating is 120% of the dial setting", "screen": "Overload dial on the front (label: Set Motor FLA)", "parameter": "Overload dial (no parameter number; dial)", "value": "Motor nameplate FLC; if service factor <1.15 use 0.9 x FLA, if >1.15 use 1 x FLA", "source": "SMC-3 Installation Instructions 41053-248-01 (DIR 42053-248 v06)"}, {"step": "Select the starting method: Soft Start or Current Limit Start with DIP switch 3", "screen": "DIP switches 3, 4, 5", "parameter": "DIP 3 = mode; DIP 4/5 = level", "value": "Soft Start: initial torque 15/25/35/65% LRT. Current Limit: 150/250/350/450% FLA", "source": "SMC-3 Installation Instructions 41053-248-01"}, {"step": "Set the start (ramp) time with DIP switches 1, 2 and 8", "screen": "DIP switches 1, 2, 8", "parameter": "Start Time t1", "value": "2, 5, 10, 15, 20, 25 or 30 s", "source": "SMC-3 Installation Instructions 41053-248-01"}, {"step": "Set kickstart with DIP switches 9 and 10 (kickstart current is fixed at 450% FLA)", "screen": "DIP switches 9, 10", "parameter": "Kickstart time t2", "value": "Off, 0.5, 1.0 or 1.5 s", "source": "SMC-3 Installation Instructions 41053-248-01"}, {"step": "Set soft stop with DIP switches 6 and 7, as a multiple of the start time", "screen": "DIP switches 6, 7", "parameter": "Soft Stop time t3", "value": "Off, 1x t1, 2x t1 or 3x t1", "source": "SMC-3 Installation Instructions 41053-248-01"}, {"step": "Set overload trip class with DIP switches 11 and 12, reset mode with DIP 13, Aux #1 with DIP 14, and Line/Delta with DIP 15", "screen": "DIP switches 11-15", "parameter": "Overload Class (DIP 11/12); Overload Reset (DIP 13); Aux #1 (DIP 14); Line/Delta (DIP 15)", "value": "Class 10, 15 or 20; Reset Auto (auto-reset below 75% thermal capacity) or Manual (push Reset/Test); Aux #1 Normal or Up-to-Speed; Line or Delta", "source": "SMC-3 Installation Instructions 41053-248-01"}, {"step": "Check the control-power and control-input electrical ratings", "screen": "150-TD009 Tables 13/14", "parameter": "Control power; IN1/IN2 on/off voltage and current; control terminals", "value": "Control power 100...240V AC / 24V AC/DC. IN1/IN2 on-state voltage min 85V AC, 19.2V DC / 19.2V AC during start; on-state current 9.8 mA at 120V AC / 19.6 mA at 240V AC, 7.3 mA at 24V AC/DC; off-state voltage max 40V AC, 17V DC / 12V AC. Control terminals 0.2...2.5 mm2 (24...14 AWG), 0.45...0.9 N-m (4.0...8.0 in-lb).", "source": "150-TD009A-EN-P Tables 13/14 (Rexel mirror)"}], "commissioning": ["Verify input supply voltage and wiring, output wiring and control wiring before applying power (same Step 4 order as SMC Flex Quick Start).", "Apply control voltage BEFORE main power so the bypass relays settle to a defined state.", "Confirm DIP switches match the application and the overload dial matches motor FLC and service factor.", "Press and hold Reset/Test for 5 s to prove the manual trip: LED shows test state and fault contact 97/98 changes state; press again to return to operating mode.", "Start the motor and watch the ramp: it should reach full speed inside the set start time with no stall; check the RUN/FAULT LED is not flashing a fault code.", "Confirm the bypass has closed at full speed (motor runs at full voltage, SCRs out of circuit)."], "tuning": "Soft Start raises the motor from the set initial torque (15/25/35/65% of locked-rotor torque) to full voltage over the ramp time (2...30 s). Use Current Limit Start when the supply or breaker cannot take the inrush: it holds current at 150/250/350/450% FLA for the ramp time. Kickstart gives a short 450% FLA pulse (0.5...1.5 s) to break a sticky load free, then the normal ramp follows. Soft Stop ramps voltage down over 1x, 2x or 3x the start time to stop a pump gently; Coast-to-Rest simply removes voltage and lets the load spin down. If the motor stalls, lengthen the ramp or raise the initial torque/current limit; if it jerks, lower the initial torque.", "faults": [{"code": "LED 1 flash", "meaning": "Overload trip - motor thermal model exceeded (trip at 120% of dial setting)", "fix": "Check for a real overload, verify the overload dial and trip class match the motor, check actual current draw; reset with Reset/Test (Manual) or wait for auto-reset below 75% thermal capacity (Auto, DIP 13)."}, {"code": "LED 2 flashes", "meaning": "Temperature fault - controller/motor overtemperature", "fix": "Check ventilation and duty cycle, let the motor cool; reset by cycling control power."}, {"code": "LED 3 flashes", "meaning": "Phase reversal - incoming 3-phase sequence is not ABC (when enabled via DIP switch)", "fix": "Check and correct the incoming phase wiring; reset by cycling control power."}, {"code": "LED 4 flashes", "meaning": "Phase loss / open load", "fix": "Check for an open line or blown fuse and for open load leads; reset by cycling control power."}, {"code": "LED 5 flashes", "meaning": "Phase imbalance - imbalance between phase currents above the internal threshold", "fix": "Check the power system and motor connections for imbalance; reset by cycling control power."}, {"code": "LED 6 flashes", "meaning": "Shorted SCR", "fix": "Check for a shorted power module; replace the power module if necessary; reset by cycling control power."}], "manualUrl": "https://abmarketotomasyon.com/wp-content/uploads/2025/08/SMC-3-Installation-Manual.pdf", "sources": ["https://abmarketotomasyon.com/wp-content/uploads/2025/08/SMC-3-Installation-Manual.pdf", "https://abmarketotomasyon.com/wp-content/uploads/2021/03/150-TD007-EN-P.pdf", "https://lvmcc-pubs.rockwellautomation.com/cutsheets/150-C135NBD.pdf", "https://abmarketotomasyon.com/wp-content/uploads/2021/03/150-TD007-EN-P.pdf (abmarketotomasyon mirror of 150-TD007A-EN-P)", "https://www.manualsdir.com/manuals/577364/rockwell-automation-150-c3x-smc-3-soft-starter-3-37a.html (manualsdir mirror of installation sheet drawing 41053-167)", "https://rexelcanada.a.bigcontent.io/v1/static/ALB150FD25JBD34GR6XP_1_P_PROD_SPEC_ALB150C104NCDK1CutSheeten1 (Rexel mirror of 150-TD009A-EN-P)", "https://rexelcanada.a.bigcontent.io/v1/static/ALB150CD31JCD4GR6XP_1_P_PROD_SPEC_ALB150CD10JADCutSheeten1 (Rexel mirror of 150-TD010, July 2018)"], "tbd": [], "sourceFile": "starters.json"}, {"id": "ab-smc-50", "category": "starter", "family": "SMC-50", "catalogNumbers": ["150-SB1NUD"], "name": "SMC-50 Soft Starter", "whatItIs": "The SMC-50 (Bulletin 150-S) is Rockwell's top-end soft starter: a microprocessor smart motor controller with six back-to-back SCRs (two per phase) and a fully solid-state power structure with no integral bypass contactor, so the SCRs control the motor continuously. It offers 17 start/stop modes, built-in electronic overload, metering, DeviceLogix, and optional EtherNet/IP, DeviceNet or ControlNet.", "whenToUse": "Pick the SMC-50 for the hardest soft-start jobs: large pumps needing pump control and torque control, long conveyors, crushers and chillers, heavy starting duty, many starts per hour, or where you need linear-speed or torque ramps, energy saver, preset slow speed, Smart Motor Braking or Accu-Stop. Pick SMC Flex when a built-in bypass, a simpler 9-mode set and a lower price are enough; pick SMC-3 for simple DIP-switch jobs.", "selection": "Select by motor FLC. Family range 90...520 A solid-state (line) / up to 480 A in enclosed form; the 150-SB1NUD seed unit is 90 A line / 155 A inside-the-delta, 200...690V AC, 100...120V AC control. Because there is no bypass, check the continuous SCR rating and the enclosure heat dissipation; the manual gives enclosure sizing and heat-dissipation data. Automatic tuning of motor parameters is standard on the SMC-50 (not on SMC Flex).", "wiring": {"power": "Line-connected: L1/L2/L3 to the line lugs, motor to T1/T2/T3. Inside-the-delta: motor windings connect through the delta terminals (see User Manual Ch. 2, Delta Connected Motors); the controller rating rises inside delta (e.g. 90 A line = 155 A delta on the SB1NUD). Grounding provision is on the power structure; power lugs per the manual table. Do not fit power-factor correction capacitors on the load side without following the PFCC section (Ch. 2).", "feedback": "Two 24V DC inputs as standard: terminal 11 (In1, Parameter 56) is the START input, terminal 10 (In2, Parameter 57) is COAST / STOP OPTION. AC inputs are also available on the option port (A1 100...240V AC Coast/Stop, A2 100...240V AC Start). Auxiliary relay outputs are configurable for Normal, Fault, Alarm, Up-to-Speed and network control. A Push to Reset / Hold to Test button on the control module resets faults and proves a test trip. Metering covers RMS current and voltage per phase, frequency, unbalance, torque, real/reactive/apparent power and energy.", "safety": "Hazardous voltage is present in the motor circuit even when the controller is off; disconnect main power before servicing. The safety-label sheet states the unit is suitable for use on a circuit capable of delivering not more than 10,000 rms symmetrical amperes at 600 V max (line-connected) or 18,000 A (inside-the-delta). An isolation contactor or shunt-trip device is recommended on the line side. The ground-fault feature (with 150-SM2) is for monitoring only, not ground-fault circuit protection. Stopping modes are not an emergency stop.", "network": "Program with a Bulletin 20-HIM-A6 LCD, DriveExecutive/DriveExplorer, Connected Components Workbench, or the 150-SM6 Parameter Configuration Module; the SMC-50 ships with no configuration device. Option modules plug into three expansion ports: 150-SM2 (PTC, ground fault, external CT), 150-SM3 (analog I/O), 150-SM4 (digital I/O), 150-SM6 (parameter configuration). Communication option modules (150-UM011B Ch. 8): DeviceNet 20-COMM-D, ControlNet 20-COMM-C, Profibus 20-COMM-P, RS-485 20-COMM-S, InterBus 20-COMM-I, EtherNet/IP 20-COMM-E, RS485 HVAC 20-COMM-H, ControlNet (Fiber) 20-COMM-Q, CANopen 20-COMM-K, Modbus/TCP 20-COMM-M. The communication module physically sits in Port 9 and connects to DPI Port 4 via the supplied ribbon cable. A loss of DPI comms faults the unit."}, "configuration": [{"step": "Set the motor connection and line voltage", "screen": "HIM / Parameters - Motor Configuration", "parameter": "Parameter 44 Motor Connection; Parameter 46 Line Voltage", "value": "Motor Connection Line or Delta (also auto-detected during tuning); Line Voltage = system voltage", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 3 Motor Configuration"}, {"step": "Enter the motor full-load current", "screen": "HIM / Parameters - Motor Data", "parameter": "Parameter 78 Motor FLC", "value": "1.0...2200.0 A - enter the motor nameplate FLC (for the 150-SM6 module, rotary switch S5 sets FLC as % of controller max: position 0 = 40%, F = 100%, in 4% steps; e.g. a 60 A motor on a 90 A controller is 64%, position 6)", "source": "SMC-50 User Manual 150-UM011B-EN-P; 150-SM6 Installation 150-IN053B (S5 table)"}, {"step": "Choose the starting mode", "screen": "HIM / Parameters - Starting", "parameter": "Parameter 49 Starting Mode", "value": "Soft Start (default), Current Limit, Torque Ramp, Linear Speed, Pump Start, Full Voltage, Dual Ramp, Preset Slow Speed; set with the 150-SM6 DIP switches as Linear Speed Accel (default), Current Limit, Soft Start or Pump Start", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 3"}, {"step": "Set ramp time, initial torque and (for Current Limit) current limit level", "screen": "HIM / Parameters - Starting", "parameter": "Parameter 50 Ramp Time; Parameter 51 Initial Torque; Parameter 53 Current Limit Level", "value": "Ramp Time 0.0...1000.0 s, default 10.0 s; Initial Torque 0...90% LRT, default 70%; Current Limit 50...600% FLC", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 3 Tables 15/16"}, {"step": "Set the stop mode and stop time", "screen": "HIM / Parameters - Stopping", "parameter": "Parameter 65 Stop Mode; Parameter 66 Stop Time", "value": "Stop Mode: Coast, Soft Stop, Linear Speed Decel (default), Pump Stop, SMB, Accu-Stop; Stop Time 0.0...999.0 s (Pump Stop table shows 0.0...999.0 s)", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 3"}, {"step": "Configure the control inputs: In1 = Start, In2 = Coast/Stop", "screen": "HIM / Parameters - I/O", "parameter": "Parameter 56 Input 1 (In1, terminal 11); Parameter 57 Input 2 (In2, terminal 10)", "value": "In1 = Start; In2 = Coast, Stop Option, etc. If any input is set to Start or Slow Speed with no input set to Coast or Stop, the controller generates an I/O Configuration Fault (Fault 61)", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 2 wiring diagrams"}, {"step": "Run motor tuning, then enable the overload and other protections", "screen": "HIM / Motor Tuning; HIM / Protection", "parameter": "Motor Tuning (Ch. 3); Parameter 230 Motor Fault En (overload enable)", "value": "Run tuning before the first start after installation and after Load Defaults; disable the SMC-50 overload (Parameter 230) only when separate overload relays are provided (e.g. multi-motor or two-speed applications)", "source": "SMC-50 User Manual 150-UM011B-EN-P, Ch. 3 and Ch. 2 (two-speed/multi-motor notes)"}, {"step": "Supply control power at 100...240V AC to terminals 1 (+L1) and 2 (-L2), from a source of at least 150 VA", "screen": "150-UM011B Ch. 2, Control Power", "parameter": "Control power 100...240V AC, terminals 1 and 2", "value": "Control power 100...240V AC on terminals 1 (+L1) and 2 (-L2); minimum 150 VA source. Base draw: 150 VA (90...180 A), 150 VA (210...320 A), 300 VA (361...520 A) for the control module with heat-sink fan.", "source": "150-UM011B-EN-P (Jan 2013), Ch. 2 p. 35 (dalkos.ru mirror)"}, {"step": "Add the VA draw of each fitted option module to the control-power budget", "screen": "150-UM011B Ch. 2, Control Power", "parameter": "Option-module VA adders", "value": "HIM 10 VA, 150-SM2 30 VA, 150-SM3 30 VA, 150-SM4 50 VA, 150-SM6 5 VA, 20-COMM-X 25 VA.", "source": "150-UM011B-EN-P (Jan 2013), Ch. 2 p. 35 (dalkos.ru mirror)"}, {"step": "Wire the control terminals and let the fan run itself", "screen": "150-UM011B Ch. 2, Control Power", "parameter": "Control terminals; heat-sink fan", "value": "Control terminals: 14 AWG max / 24 AWG min, max torque 0.8 N-m (7 lb-in), strip 7 mm. The heat-sink fan is self-powered from control terminals 1 and 2, auto-configured with no user connections; it cycles ON/OFF as needed.", "source": "150-UM011B-EN-P (Jan 2013), Ch. 2 p. 35 (dalkos.ru mirror)"}, {"step": "Set starting/stopping with the 150-SM6 DEVICE DIP bank", "screen": "150-SM6 (150-IN053B) DEVICE bank; 150-UM011B Ch. 5 Tables 68-70", "parameter": "DEVICE DIP switches 1-8", "value": "Switches 1-2 Starting Mode (Parameter 49): 0,0 Linear Speed Accel (default); 0,1 Current Limit; 1,0 Soft Start; 1,1 Pump Start. Switches 3-4 Stop Mode (Parameter 65): 0,0 Linear Speed Decel (default); 0,1 Soft Stop; 1,0 Braking; 1,1 Pump Stop. Switch 5 Energy Saver (Parameter 193): 1 Enable, 0 Disable (default); enabling auto-sets the level to 0.25. Switches 6-8 Braking Current (Parameter 69): 000 = 50%, 001 = 100%, 010 = 150%, 011 = 200% (default), 100 = 250%, 101 = 300%, 110 = 350%, 111 = 400%.", "source": "150-UM011B-EN-P Ch. 5 Tables 68-70; 150-SM6 Installation 150-IN053B (manualsdir mirror)"}, {"step": "Set protection with the 150-SM6 PROTECTION DIP bank", "screen": "150-SM6 (150-IN053B) PROTECTION bank; 150-UM011B Ch. 5 Tables 68-70", "parameter": "PROTECTION DIP switches 1-8", "value": "Switch 1 Preset Protection Level (group: Current Imbalance P110, Voltage Unbalance P106, Line Loss, Open Gate, No/Open Load): 1 Enabled (default) / 0 Disabled. Switch 2 Stall Fault (P230): 1 Enabled (default). Switch 3 Phase Reversal (P136): 1 Enable / 0 Disable (default). Switch 4 OL Restart (P264): 1 Enable / 0 Disable (default). Switch 5 OL Enable (P230): 1 Enabled (default). Switches 6-7 OL Class (P75): 0,0 = 10 (default); 1,0 = 20; 0,1 = 15; 1,1 = 30. Switch 8 is unassigned in both documents.", "source": "150-UM011B-EN-P Ch. 5 Tables 68-70; 150-SM6 Installation 150-IN053B (manualsdir mirror)"}, {"step": "Set auxiliary outputs and control inputs with the 150-SM6 I/O DIP bank", "screen": "150-SM6 (150-IN053B) I/O bank; 150-UM011B Ch. 5 Tables 68-70", "parameter": "I/O DIP switches 1-8", "value": "Switches 1-2 Aux #1 (P172): 00 Normal (default), 01 UTS, 10 Fault, 11 Alarm. Switches 3-4 Aux #2 (P176): 00 Normal, 01 UTS (default), 10 Fault, 11 Alarm. Switch 5 Input #1 (P56): 0 Start/Coast (default), 1 Start/Stop Option. Switches 6-7 Input #2 (P57): 00 Stop Option (default), 01 Clear Fault, 10 Slow Speed, 11 Fault. Switch 8 is unassigned in both documents.", "source": "150-UM011B-EN-P Ch. 5 Tables 68-70; 150-SM6 Installation 150-IN053B (manualsdir mirror)"}, {"step": "Set torque, current limit, ramp/stop times and motor FLC with the 150-SM6 rotary switches S1-S5", "screen": "150-SM6 (150-IN053B) rotary switches; 150-UM011B Ch. 5", "parameter": "Rotary switches S1-S5", "value": "S1 Initial Torque (P51): 0 = 10% ... A = 70% (default), F = 100%. S2 Current Limit (P53): 0 = 200% ... 8 = 360% (default), F = 500%. S3 Ramp Time (P50): 0 = 0.1 s ... 5 = 10 s (default), F = 30 s. S4 Stop Time (P66): 0 = Coast-to-Stop (default), 1 = 2 s ... F = 30 s; braking multiplies by 10. S5 Motor FLC (P78): 0 = 40% (default) ... 6 = 64%, F = 100%, in 4% steps; e.g. a 60 A motor on a 90 A controller is 64% = position 6.", "source": "150-UM011B-EN-P Ch. 5; 150-SM6 Installation 150-IN053B (manualsdir mirror)"}], "commissioning": ["Verify input supply voltage and wiring, output wiring and control wiring; check control power at terminals 1 (+L1) and 2 (-L2).", "Run motor tuning before the first start after installation and after any Load Defaults.", "Test local start/stop from the HIM or the wired In1/In2 inputs; confirm the motor reaches full speed inside the ramp time.", "Check metering (current per phase, voltage, torque, power) and that the motor thermal model is not climbing abnormally.", "Prove the Push to Reset / Hold to Test button: hold >3 s (but <10 s) to force a Test Fault (Fault 62); press <2 s to reset it.", "Confirm the isolation contactor (if fitted) and aux outputs behave as configured, and that a fault (e.g. overload) opens the trip relay."], "tuning": "Soft Start ramps voltage from Initial Torque (Parameter 51) over Ramp Time (Parameter 50). Current Limit holds current at Parameter 53 for the ramp time. Linear Speed Acceleration increases current to give a straigh
