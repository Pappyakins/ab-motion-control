at all controllers and communication modules must have time synchronisation enabled for applications that use Integrated Motion on the EtherNet/IP network, and it points to publication IA-AT003 for the detail. If time sync is not on, do not expect clean coordinated motion.\n\nA common point of confusion is the axis data type. For a modern Kinetix drive on EtherNet/IP, the axis you create is an AXIS_CIP_DRIVE. That is the default data type when you create an associated axis in MOTION-UM003P. AXIS_SERVO_DRIVE is a different, older type: it belongs to SERCOS drives, where the axis execution lived in a separate motion module rather than in the controller over EtherNet/IP. Rockwell's own AXIS_SERVO_DRIVE structure page still documents its status bits (ServoActionStatus, DriveEnableStatus, ShutdownStatus, InhibitStatus) and its fault bits (PhysicalAxisFault, ModuleFault, ConfigFault), and the motion instructions accept both types, but do not teach learners to create an AXIS_SERVO_DRIVE for a new Kinetix 5500 or 5700 axis. For those drives the axis is an AXIS_CIP_DRIVE. On a legacy SERCOS system the axis type is different, and so is the setup. Studio 5000 Logix Designer online help (v37), 'Configuring a SERCOS analog motion system', gives this order: first add a SERCOS motion module (1756-M03SE, 1756-M08SE, 1756-M16SE or 1768-M04SE) by right-clicking the backplane in the Controller Organizer and choosing New Module, then set its Data Rate and Cycle Time on the SERCOS Interface tab; then add the SERCOS interface drive by right-clicking SERCOS Network and choosing New Module, giving it the SERCOS node number from the module's rotary switch; then, on the interface drive's Module Properties Report, Associated Axes tab, click New Axis to create an AXIS_SERVO tag, and in the Node box choose an AXIS_SERVO_DRIVE tag to associate with the drive's node. Alternatively, right-click the motion group and choose New Axis, choosing data type AXIS_SERVO_DRIVE for those SERCOS modules (AXIS_VIRTUAL for a virtual configuration with no hardware). The contrast with the CIP path above is the point: on EtherNet/IP there is no SERCOS motion module, no ring to phase up and no node number \u2014 the drive is an Ethernet module in the I/O tree and the axis is created on its Associated Axes tab with default type AXIS_CIP_DRIVE. Electronic keying is the same rule on both: Compatible Keying or Exact Match, never Disable Keying with motion modules.\n\nThink of the chain like this. The drive is a module in the I/O tree with an IP address. The axis is a tag that holds the configuration, the tuning, the scaling and the live status for one motor. The motion group is the container that schedules all the axes together. The ladder or structured-text program then talks to the axis tag with motion instructions. If any link in that chain is missing \u2014 no drive in the tree, no axis associated with the drive, or no axis assigned to a motion group \u2014 the axis is unavailable for use, and the instructions that try to move it will error.", "componentIds": ["ab-kinetix-5700-2198-d057-ers3", "ab-kinetix-5500-2198-h070-ers2", "ab-kinetix-5100-2198-e1007-ers"], "id": "studio5000-motion-overview", "title": "What Integrated Motion on EtherNet/IP is"}, {"body": "Before you add any drive, MOTION-UM003P says to create a controller project with a connection to the EtherNet/IP network, and to verify that you have the correct minimum software, firmware and Add-on Profile (AOP) versions for your controller and drive. That check comes first because a drive whose firmware or AOP does not match the project will not configure cleanly. For a safety application you must add a GuardLogix integrated safety controller, and for all communication modules you use the firmware revision that matches the firmware revision of your controller.\n\nThe manual's path for a Kinetix drive is: controller project ready, controller EtherNet/IP connectivity, time synchronisation, then add the Kinetix drive to your EtherNet/IP network. On the General page of the Module Properties dialog box you type a Name and an IP address for the drive. After that you configure the drive settings in the Module Definition dialog box, then power settings, digital inputs and outputs, and safety connections. The drive manual for your exact drive family gives the product-specific detail; for a Kinetix 5700 that is publication 2198-UM002.\n\nIn the Module Definition dialog box you can update the drive Revision, choose an Electronic Keying type, and choose a Power Structure, although the exact fields depend on the drive. Electronic keying matters a lot in motion: the feature automatically compares the expected module, as shown in the configuration tree, to the physical module before communication begins. MOTION-UM003P is explicit \u2014 when you are using devices in an integrated motion application, set the electronic keying to either Exact Match or Compatible Keying, and never use Disable Keying with motion or safety modules. Disable Keying would let the controller talk to the wrong physical module, which is exactly what you do not want on a servo axis.\n\nFor a Kinetix 5700 system, remember the bus supply. The 2198-Pxxx DC Bus Supply provides power in a range of 7 to 46 kW and 10.5 to 69.2 A output current to the Kinetix 2198 single-axis and dual-axis inverters, and the 2198-RPxxx Regenerative Bus Supply provides continuous output power and current to those inverters. The inverters alone do not make a working system; the supply is part of the design. The click path is in Kinetix 5700 Servo Drives User Manual, publication 2198-UM002D-EN-P, Chapter 6 (Configure and Start the Kinetix 5700 Drive System), and it matches the flow in MOTION-UM003P Chapter 2. In the Controller Organizer, right-click Ethernet under the I/O Configuration folder and choose New Module; the Select Module Type dialog box appears. Filter by Motion and Allen-Bradley (the manual's example types '2198' to narrow the list), select your catalog number \u2014 a 2198-Pxxx DC-bus power supply, a 2198-Sxxx-ERS3 single-axis inverter or a 2198-Dxxx-ERS3 dual-axis inverter \u2014 and click Create; the New Module dialog box appears. On the General page type a Name, choose an Ethernet Address option and enter the drive's IP address, then click OK; the drive appears in the Controller Organizer under the Ethernet network in the I/O Configuration folder. For an inverter, also open Module Definition (Change) to pick the Connection mode (Motion only, Motion and Safety, or Safety only) and use the Power tab to set Bus Configuration (Shared DC for inverters) and the Bus Sharing Group. Note the dialog names are from the 2198-UM002D edition (November 2016, Logix Designer v26.00 or later); the same dialog names appear in MOTION-UM003P (January 2025), but v36/v37-specific screenshots were not in the sources read.\n\nFor a Kinetix 5700 system, add the bus supply FIRST, then the inverters. Chapter 6 gives 'Configure the DC-bus Power Supply' before 'Configure the Inverter Drives', and the inverter procedure starts 'Above the DC-bus power supply (converter) you just created, right-click Ethernet and choose New Module'. The supply's Power tab uses Bus Configuration Shared AC/DC (the default for a 2198-Pxxx supply); the inverters use Shared DC, and every module physically on the same shared-bus connection must be in the same Bus Sharing Group. The 2198-RPxxx regenerative bus supply is the same kind of bus-supply module in the tree \u2014 MOTION-UM003P Table 3 lists 'Kinetix 5700 Regenerative Bus Supply' alongside the DC-bus supply \u2014 and it is added before the inverters the same way. The supply also gets an associated axis of its own: on its Associated Axes tab click New Axis (default type AXIS_CIP_DRIVE), which is how the controller monitors the bus.\n\nOne more ownership rule, from the PowerFlex side of the same chapter, is worth knowing even for Kinetix learners: when a drive is used in Integrated Motion on EtherNet/IP mode, the Logix controller and Studio 5000 Logix Designer are the exclusive owners of the drive. A HIM or other drive software tool cannot be used to control the drive or change configuration settings; those tools can only be used for monitoring. The project is the single source of truth for the drive.\n\nNote: a PowerFlex 525 cannot be an Integrated Motion (CIP Motion) axis \u2014 MOTION-UM003P covers Kinetix 350/5300/5500/5700/6500, PowerFlex 527, PowerFlex 755/755T and iTRAK 5730 only; the 527 is the 520-series motion drive.", "componentIds": ["ab-kinetix-5700-2198-d057-ers3", "ab-kinetix-5500-2198-h070-ers2", "ab-kinetix-5100-2198-e1007-ers"], "id": "add-kinetix-drive-io-tree", "title": "Adding a Kinetix drive to the I/O tree"}, {"body": "Adding the drive is only half the job. Before you can complete the configuration process, MOTION-UM003P says, you must create an axis and associate it to your drive. The axis is the tag your program will command, and the association is what ties that tag to the physical drive module and to one of its axis numbers.\n\nThe steps in the manual are plain. Double-click the drive in the Controller Organizer to open the Module Properties dialog box, click the Associated Axes tab, and click New Axis. On the New Tag dialog box you type a name for the axis; the default data type is AXIS_CIP_DRIVE. Click Create, and configure additional axes if applicable. For a Kinetix 5700 dual-axis inverter (2198-Dxxx-ERSx) there are four axis positions: Axis 1 and Axis 3 for motor and/or load feedback, and Axis 2 and Axis 4 for auxiliary (master) feedback. For a single-axis inverter (2198-Sxxx-ERSx) there are two: Axis 1 for motor or load feedback and Axis 2 for auxiliary (master) feedback. A Kinetix 5500 has one motor feedback axis. The manual warns that the Logix Designer application helps prevent incompatible feedback port assignments \u2014 for example, you cannot assign the same port for multiple devices, and the same port cannot be used for motor feedback, load feedback and master feedback at once.\n\nOnce the axis exists, you finish it in the Axis Properties dialog boxes, which are dynamic: the pages and attributes that appear change with the combination of axis characteristics you define. The manual is clear on the order here: be sure to associate the drive and axis before configuring the axis, because the drive determines what optional attributes are supported for the axis. If you have already created and associated an axis, the Associated Module and Axis are shown on the General page of the Axis Properties dialog box, and the Axis Number field corresponds to the axes listed on the Associated Axes tab.\n\nOn the General page you choose an Axis Configuration type. For Kinetix drives the choices include Position Loop, Velocity Loop, Torque Loop, Feedback Only and Frequency Control, though not every drive supports every type \u2014 for example, a Kinetix 5700 DC-bus supply supports none of those as an axis, and Frequency Control is not available on a Kinetix 350. Position Loop with Motor Feedback is the normal starting point for a servo positioning axis: the controller closes the position loop using the motor feedback device. Then, on the Motor page, you specify the motor data source. The usual choice is Catalog Number: you click Change Catalog and choose your motor from the motion database, and the motor specification data is entered for you automatically. If your motor is not in the Change Catalog list, it is not in the motion database and you have to input the specification data or add a custom motor. The other data sources the manual names are Nameplate Datasheet and Motor NV (non-volatile memory in the motor or drive).\n\nThe procedure above is the CIP path, whose default data type is AXIS_CIP_DRIVE. The legacy SERCOS path is different and is covered in the overview lesson: on SERCOS the axis is an AXIS_SERVO_DRIVE, created either on the SERCOS interface drive's Associated Axes tab (then linked to the drive's node number) or from the motion group with New Axis, after a 1756-MxxSE / 1768-M04SE motion module has been added to the backplane and its SERCOS ring configured \u2014 there is no Ethernet module and no IP address in that flow. (Studio 5000 Logix Designer online help v37, 'Configuring a SERCOS analog motion system'.)", "componentIds": ["ab-kinetix-5700-2198-d057-ers3", "ab-kinetix-5500-2198-h070-ers2", "ab-mp-series-mpl-b4530k-sk74aa", "ab-kinetix-vp-vpl-b1303f-pj14as"], "id": "create-axis-associate-drive", "title": "Creating an AXIS_CIP_DRIVE axis and associating it with the drive"}, {"body": "Every axis must belong to a motion group, and there is only one motion group per Logix controller. MOTION-UM003P states this bluntly: all axes must be added to the Motion Group in your project, and if you do not group the axes, they remain ungrouped and unavailable for use. So creating the group is not optional housekeeping; it is what makes the axes usable.\n\nTo create a motion group, in the Controller Organizer right-click Motion Groups and choose New Motion Group, type a name, make any adjustments for your application, and click Create. To put axes in it, right-click the new motion group and choose Properties, click the Axis Assignment tab, and move your axes from Unassigned to Assigned. Then click the Attribute tab and edit the default values as appropriate for your application, and click OK. The Attribute tab is also where you configure whether an AxisFault on a grouped axis is a Major Fault or a Non Major Fault \u2014 a choice with real consequences, covered in the faults lesson.\n\nThe timing heart of the group is the update period. In the current manual this is called the Base Update Period, and the motion-group attribute list calls the same thing the Course (Base) Update Period. Older Rockwell material calls it the Coarse Update Period, so learners will meet both names for the same setting; in this module, Base Update Period is the name on the screen in MOTION-UM003P, and Coarse Update Period is the older name for it. The Base Update Period is basically the RPI (requested packet interval) rate for Ethernet communication between the controller and the motion module, on a unicast connection, and it determines how often the Motion Task runs. When the Motion Task runs, it interrupts most other tasks regardless of their priority. The Motion Task is the part of the controller that takes care of position and velocity information for the axes.\n\nThat creates a trade-off you must teach honestly. A shorter period means fresher position data and tighter control, but it steals more controller time from your ladder logic. MOTION-UM003P says that in general you do not want the Motion Task to take more than 50 percent of the overall Logix controller time on average, and the more axes you add to the Motion Group, the more time it takes to run the Motion Task. Check the Last Scan time values; typically the value is less than 50 percent of the Base Update Period, to reduce group overlap and timing issues. The manual's minimum Base Update Periods are: other AXIS_CIP_DRIVE drives 1 ms, PowerFlex 755T 2 ms, PowerFlex 755 3 ms, and PowerFlex 527 4 ms. Too many axes per base rate can cause a motion task overlap error or high application program scan times.\n\nFor mixed systems there is Axis Scheduling. From the Attribute tab of the Motion Group Properties dialog box you open the Axis Schedule Panel, which provides a Base Update Period and two alternate periods. The alternate rates let lower-performance drives be multiplexed through one drive update channel, so multiple drives can be updated using the same amount of controller and network capacity as one non-multiplexed drive. The Alternate Update Periods are multiples of the base \u2014 the multipliers range from 2 to 32 \u2014 and you can edit the Base Update Period when the controller is offline; it is read-only when the controller is online. The panel also shows Estimated Utilization and Actual Utilization, with warning icons at the borderline of controller capability and a red X when a value has gone beyond what the motion task cycle can handle. If you are reaching utilization limits and you only have the Base Update Period assigned to axes, the manual's advice is to start assigning axes to the Alternate Update Periods.", "componentIds": ["ab-kinetix-5700-2198-d057-ers3", "ab-kinetix-5500-2198-h070-ers2"], "id": "motion-groups-update-period", "title": "Motion groups and the update period"}, {"body": "The controller provides a set of motion control instructions for your axes, and you use them just like the rest of the Logix 5000 instructions. Each motion instruction works on one or more axes, and you can program them in Ladder Diagram, Structured Text or Sequential Function Chart. Every motion instruction needs a motion control tag, which uses the MOTION_INSTRUCTION data type and stores the status of the instruction. Rockwell's help is firm on one rule: use each motion control tag in only one motion instruction. Unintended operation can result if you reuse the same motion control tag in other motion instructions, or if you write to any of the motion control tag elements. Each instruction is transitional in ladder: toggle the rung condition from false to true each time you want it to execute, and in structured text condition it so it only executes on a transition. Watch the status bits on the MOTION_INSTRUCTION tag: .EN means the rung made a false-to-true transition, .DN means the instruction completed or the move was successfully initiated, .ER means an error happened, .IP means the process is still in progress, and .PC means the process is complete.\n\nStart with the on and off pair. Motion Servo On (MSO) activates the drive amplifier for the specified axis and activates the axis servo control loop; with a CIP axis the resulting state is called the Running state. Its most common use is to activate the servo loop for the axis in its current position in preparation for commanding motion. Do not use MSO while the axis is moving \u2014 it generates an Axis in Motion error. Motion Servo Off (MSF) does the opposite: it deactivates the drive output for the specified axis and deactivates the axis servo loop, placing a CIP axis in the Stopped state. If you execute MSF while the axis is moving, the axis coasts to an uncontrolled stop, so MSF is an off switch, not a controlled stop. Both take only the axis and the motion control tag, for example MSO(Axis, MotionControl) in structured text, and both can take multiple scans and multiple coarse updates to complete, so the .DN bit is not set immediately.\n\nMotion Axis Home (MAH) homes an axis \u2014 it calibrates the absolute position of the axis. Two homing modes can be selected during axis configuration: Active or Passive. With Active homing the axis executes the configured Home Sequence Type and establishes an absolute axis position; with Passive homing no specific homing sequence is executed and the axis waits for the next marker pulse to establish the home position. The Home Sequence for active homing may be Immediate, Switch, Marker or Switch-Marker. A successful home sets the AxisHomedStatus bit, which indicates that an absolute machine reference position has been established; operations that require a machine reference, such as software overtravel checking, can then be meaningfully enabled. For CIP axes, software overtravels are disabled if the Home status bit transitions to false. Absolute Homing Mode is not available with a CIP axis, although any successful home sequence establishes an absolute position.\n\nMotion Axis Jog (MAJ) moves an axis at a constant speed until you tell it to stop, without regard to position. You give it a direction (Forward 0 or Reverse 1), a speed, acceleration and deceleration rates, and a profile \u2014 Trapezoidal (0) or S-curve (1). Use an MAS instruction to stop the jog. Motion Axis Move (MAM) moves an axis to a specified position: Absolute (0) to go to a position, Incremental (1) to move a distance from where it is now, or Rotary Shortest Path (2), Rotary Positive (3) and Rotary Negative (4) for rotary axes, plus Absolute and Incremental Master Offset moves for cams. You also give it speed, acceleration, deceleration and profile, and a Merge setting: Merge Disabled adds the move to motion already in process, while Merge Enabled cancels the motion from other instructions and moves at the programmed speed or at the current speed. A second MAM can change a move already in process \u2014 position, speed, acceleration or deceleration take effect immediately \u2014 but changing move parameters dynamically carries a risk of velocity or end-position overshoot, so teach that warning, not just the feature.\n\nMotion Axis Stop (MAS) is the controlled stop. It stops a specific motion process on an axis, or stops the axis completely, with a decelerated stop, and it stops the motion without disabling the servo loop. Its Stop Type operand selects All (0) for all motion in process, or one type only: Jog (1), Move (2), Gear (3), Home (4), Tune (5), Test (6), Time Cam (7), Position Cam (8), Master Offset Move (9) or Direct Control (10). If you stop only the jog while a move is also running, the move keeps running. With Stop Type All a trapezoidal profile is always used for the deceleration regardless of the programmed profile type. If Change Decel is No, the axis uses its maximum deceleration; if Yes, it uses the Decel Rate you enter \u2014 and Rockwell warns the axis could overshoot its target position if you reduce the deceleration while a move is in process. MAS can also abort a test or tune process started by MRHD or MRAT.\n\nMotion Run Axis Tuning (MRAT) is a configuration instruction, not a move: it commands the motion module to run a tuning motion profile for the specified axis, and the measurement data it produces is stored in the axis object for later use with Motion Apply Axis Tuning (MAAT), which computes a complete set of servo gains and dynamic limits from those results and updates the axis. MRAT takes no explicit input parameters; it derives its input from the axis tuning configuration parameters \u2014 Tuning Direction, Tuning Travel Limit, Tuning Speed and Tuning Torque, plus the Damping Factor, which the Loop Response selection sets (Low 1.5, Medium 1.0, High 0.8). For a CIP axis the profile is a triangular velocity profile, and the outputs include Tune Accel Time, Tune Decel Time, Tune Accel, Tune Decel, Tune Inertia Mass, Tune Friction and Tune Load Offset, plus the Position and Velocity Servo Bandwidths. It is covered in full in the tuning lesson.\n\nThere is no MAB instruction in Logix, and this is now confirmed rather than just suspected. The Instruction Locator and full text of the Logix 5000 Controllers Motion Instructions Reference Manual, publication MOTION-RM002L-EN-P (November 2022, the latest edition found \u2014 no newer MOTION-RM002 edition surfaced), contain no 'Motion Axis Blend' and no MAB entry; the locator lists MAFR, MAG, MAH, MAJ, MAM, MAPC, MAS, MASD, MASR, MATC and the rest, but nothing for blending under that name. A search of the Studio 5000 Logix Designer online help v37 table of contents likewise returns no 'Blend' entry at all. (Note: 'MAB' does exist as a third-party vendor AOI, e.g. Yaskawa's MAB_Yaskawa Motion Axis Blend add-on, but that is not a native Logix instruction.) So do not teach MAB as a Logix instruction. The real blending mechanisms are the ones already taught here: the Merge operand on MAM and MAJ \u2014 Merge Enabled cancels the motion from other instructions and moves at the programmed speed or the current speed \u2014 and, for coordinated motion, queuing a second MCLM or MCCM move behind the first, which Rockwell's help describes under 'Using Different Termination Types When Blending Instructions'. Related instructions learners will meet next are Motion Axis Fault Reset (MAFR), Motion Axis Shutdown (MASD) and Motion Axis Shutdown Reset (MASR), and the group versions Motion Group Stop (MGS), Motion Group Shutdown (MGSD) and Motion Group Shutdown Reset (MGSR); those are covered in the faults lesson. A useful first program, straight from Rockwell's own example, is: MSO when the axis is off, MAH when it has not been homed, MAJ while the jog button is held, MAS when the jog button is released, and MAM to move to a position \u2014 each guarded by checking ServoActionStatus and AxisHomedStatus on the axis tag.", "componentIds": ["ab-kinetix-5700-2198-d057-ers3", "ab-kinetix-5500-2198-h070-ers2"], "id": "motion-instructions-core", "title": "The core motion instructions: MSO, MSF, MAJ, MAM, MAH, MAS and MRAT"}, {"body": "Commissioning is the step between configuring an axis and trusting it with a real move, and MOTION-UM003P gives it a fixed order: scaling, hookup tests, polarity, autotune and load. Skipping the order is how axes run away. Scaling comes first. Axis motion can be specified in whatever units you want, and in the Scaling dialog box you configure the motion control system to convert between raw internal-motion units \u2014 for example Feedback Counts or Planner Counts \u2014 and your preferred unit of measure, be it revolutions, degrees, meters or inches. The conversion involves three key Scaling Factor attributes: Conversion Constant, Motion Resolution and Position Unwind. If you use the Scaling dialog box, the software calculates the scaling factors for you; the only task you do is select the Load Type that best matches the mechanical linkage between the motor and the load. There are four load types: Direct Coupled Rotary, Direct Coupled Linear, Rotary Transmission, and Linear Actuator. By default the Scaling dialog box is set for 1 Position Unit per Motor Rev. Changing scaling factors can have a significant impact on the calculations of factory defaults for scaling-dependent axis configuration attributes, and the software will offer to recalculate factory defaults for the dependent attributes when you apply a change.\n\nHookup tests are next, and they exist to check your cabling, adjust motor and feedback polarity, establish your sense of positive motion direction, and, if applicable, check the encoder marker and commutation function. To run any hookup test you must first download your program. The available tests depend on the drive and on the axis and feedback configuration you chose: Marker, Motor and Feedback, Motor Feedback, Load Feedback, Commutation and Master Feedback. For a Kinetix 5700 in a position loop with motor feedback, the Motor and Feedback test and the Commutation test apply; for a PowerFlex 527 the Motor Feedback test applies. Read the safety warnings as part of the lesson, not as fine print: these tests can actively move the axis even with the controller in Remote Program mode, so before you do the tests make sure no one is in the way of the axis, and you must remove the load from each axis, because uncontrolled motion can occur when an axis with an integral motor brake is released during the test. Changing motor or feedback after performing the hookup test can result in an axis-runaway condition when the drive is enabled. Axes with Axis Test Mode enabled cannot perform Motor, Motor Feedback, Inertia or Hookup Tests; they return the error Test Prohibited - Axis Test Mode Active (value 128), and they also fail the MRAT or MRHD motion instruction.\n\nHoming is what gives the axis a known zero. It is configured on the axis \u2014 Homing Mode Active or Passive, Home Sequence, Home Direction, Home Speed and Home Position \u2014 and executed with the MAH instruction, as taught in the instructions lesson. After a successful home the AxisHomedStatus bit is set. For learners, the practical rule is simple: do not enable software overtravel checking as a meaningful protection until the axis has been homed, because for CIP axes software overtravels are disabled if the Home status bit transitions to false. Absolute Position Recovery (APR) is the related idea: after a download, the axis position can be restored if the APR data is intact, but an APR fault can be generated by scaling changes or by saving a project without uploading it first, and the manual's fix is to upload the project so the changed attributes are saved, then rehome the axis.\n\nBefore running your own program, you can drive the axis by hand from inside Studio 5000. The Motion Generator on the Manual Tune dialog box, and the Motion Direct Commands dialog box it links to, give basic control of a closed-loop servo axis. The commands available there are MDS (Motion Drive Start), MSO, MSF, MAH, MAJ, MAM, MAS and MAFR. The manual's own sequence is: select MSO and click Execute, then select MAM and click Execute, and the drive moves according to your configuration settings. Typically motion does not occur in Program mode, but you can test an axis in Remote Program mode by using Motion Direct Commands \u2014 and the manual repeats the warning that when you tune an axis, it moves even with the controller in Remote Program mode, and in that mode your code is not in control of the axis.", "componentIds": ["ab-kinetix-5700-2198-d057-ers3", "ab-kinetix-5500-2198-h070-ers2", "ab-mp-series-mpl-b4530k-sk74aa"], "id": "commission-axis-hookup-homing", "title": "Commissioning an axis: scaling, hookup tests and homing"}, {"body": "The first thing to teach about tuning is that most axes do not need to be tuned by hand at all. Once you have applied your configurations, the factory defaults for dynamic configuration attributes \u2014 for example gain, limits and filter settings \u2014 are automatically computed, based on your drive and motor configuration settings and your selection for application type and loop response. MOTION-UM003P says the factory defaults yield a stable operational system that can then be tailored to the specific requirements for many types of machine applications, and that typically you do not need to use Autotune or Manual Tune. Once you select your drive and use the Motion Database as the data source, the defaults can provide adequate tuning performance.\n\nApplication Type and Loop Response are the two choices that shape those defaults. Application Type specifies the type of motion control application and is used to set the Gain Tuning Configuration Bits attribute that establishes the appropriate gain set application; those combinations determine how the calculations are made, which can reduce the need to perform an Autotune or a Manual Tune. Loop Response settings also impact the calculations and can minimise the need for an Autotune or a Manual Tune: loop response impacts the spacing between the position and velocity loops and the proportional and integral gains, and it affects how aggressively a given profile is followed. In the MRAT description the Loop Response maps to a Damping Factor: Low 1.5, Medium 1.0, High 0.8.\n\nIf the defaults do not satisfy the application, the manual's recommended next step for a Kinetix 5300, 5500 or 5700 drive is tuning-less operation, not Autotune: it is recommended that the drive is configured for tuning-less operation, and the guide for that is the Tuning-less Feature Configuration Quick Start, publication MOTION-QS001. If the tuning-less features are not available for your drive, use Autotune to adjust the parameters. The Load Observer is part of why tuning-less works: it is a control loop inside the drive that estimates the mechanical load on the motor and compensates for it, letting the control loops treat the motor as if it were unloaded. It automatically compensates for disturbances and load dynamics such as sudden inertia changes, compliance, backlash and resonances that are within the bandwidth of the Load Observer, and the manual says it provides relatively high-performance motion control without tuning and minimises the need to retune to account for machine wear over time. When using the tuning-less features, the manual recommends setting the Load Ratio to zero.\n\nWhen Autotune is the right tool, the procedure in Studio 5000 is in the Autotune dialog box of the Axis Properties, after you have set the parameters and performed the tasks in the General, Motor, Motor Feedback, Scaling, Hookup Test and Polarity dialog boxes. You enter the Tune Profile: Travel Limit based on the travel constraints of the machine, Speed set to the expected operation speed, Torque set to the level you want to apply to the motor during the Autotune (the default of 100 percent rated torque usually gives good results), and Direction based on machine constraints. A unidirectional tune profile measures inertia and friction; a bidirectional tune profile adds measurement of active torque loading. Then click Start. The Autotune profile accelerates and decelerates the motor according to the Tune Direction, and the status displays Success when it finishes. If you have edits that have not been applied, Autotune does not run, so save them first. After the profile, the measurements update the fields in the Gains Tuned and Inertia Tuned grids; you compare the existing and tuned values, choose to accept the new values, and apply them to the controller. A tune configuration fault can occur if any number of attributes are zero, and it occurs only when you use Nameplate Data as the motor data source \u2014 the checked attributes include Tuning Torque, Conversion Constant, Drive Model Time Constant, System Damping, Rotary Motor Inertia, Motor Rated Continuous Current and Rotary Motor Rated Speed.\n\nThe same tuning run can also be driven from logic with the MRAT and MAAT instructions. MRAT runs the tuning motion profile and stores measurement data in the axis object; MAAT computes a complete set of servo gains and dynamic limits from the results of a previously run MRAT and updates the axis with the new gain parameters. An axis with Axis Test Mode enabled does not support Auto or Manual Tuning, and execution of MRAT on such an axis is not successful. If Autotune's results are still not acceptable, the next step is Manual Tune, which lets you adjust system bandwidth, damping factor, drive loop gains, filters and compensations with direct online control, and test with the Motion Generator. Manual Tune applies to Position Loop and Velocity Loop axis configurations only. Teach the safety warning every time: when you tune an axis, it moves even with the controller in Remote Program mode, in that mode your code is not in control of the axis, and before you tune an axis make sure no one is in the way of it; if the drive has not been enabled before, verify that you have safeguards in place to safely remove power from the drive if there is an unstable situation where the drive can produce undesired motion. The tuning-less numbers are in the Tuning-less Feature Configuration Quick Start, publication MOTION-QS001D-EN-P (November 2020), and in Motion System Tuning, publication MOTION-AT005E-EN-P (September 2024), Chapter 2. With Logix Designer v33 and later the load observer and the tracking notch filters are enabled by default for Kinetix 5300 drives, Kinetix 5700 ERS3 Series B and ERS4 drives with firmware 13 and later (and Kinetix 5730, firmware 13 and later), so on those drives no configuration steps are needed for tuning-less operation; on older drives configure it by hand: right-click the axis, Properties, Autotune category, Application Type Custom; clear the Torque Low Pass Filter checkbox; Load category, set Load Ratio to zero; Observer, Configuration 'Load Observer with Velocity Estimate' for a Position Loop axis or 'Load Observer Only' for a Velocity Loop axis (not available for Torque Loop); then Compliance category, Adaptive Tuning Configuration 'Tracking Notch'. Do not run an Autotune test while applying the load observer. The recommended out-of-box settings in MOTION-AT005E Chapter 2 are Application Type Custom, Loop Response Medium, Load Coupling Rigid, Load Ratio 0, Load Observer with Velocity Estimate, Tracking Notch on the Compliance tab; this is the recommended out-of-box setting for Kinetix 5500, 5700 and 6500 drives and, per the manual, produces a relatively high level of performance in 90% of motion applications. The bandwidth relationships for raising performance are: for Position Loop control, Load Observer Bandwidth = 4 x Velocity Bandwidth = 16 x Position Bandwidth; for Velocity Loop control, Load Observer Bandwidth = Velocity Bandwidth; to cut following error, Position Integrator Bandwidth = Position Bandwidth / 100 and Velocity Integrator Bandwidth = Velocity Bandwidth / 10, and do not use the position and velocity integrators at the same time. The out-of-box gain relationships (MOTION-AT005E Chapter 2, default damping factor z = 1.0 for EtherNet/IP drives) are KVP = TBW / (4z^2) where TBW is the torque-loop bandwidth in Hz, KPP = KVP / (4z^2), KVI = 0 or KVP / (4z^2), KPI = 0 or KPP / (4z^2); with the load observer the low-pass filter bandwidth defaults to 5 x KOP (5 x KVP without it). There is no single fixed Hz default for the bandwidths: they are computed from the drive model time constant of the drive and motor you selected.\n\nManual tuning, when the defaults and Autotune are still not enough, is the 'inside-out' method in MOTION-AT005E Chapter 4: tune the inner velocity loop first, then the outer position loop, by raising gains to the point of marginal stability and backing off. Optionally initialise the axis first (offline, reset to defaults, Loop Type Position Servo, damping factor z = 1.0 / Loop Response Medium, KPP = KPI = KVP = KVI = 0, Load Observer disabled, KOP = KOI = 0, KVFF = KAFF = 0, low-pass and notch at 0, and large Position/Velocity Error Tolerances so you do not fault while tuning; start with KVP = 3 Hz for an EtherNet/IP drive, 19 rad/s for a SERCOS drive). To tune the velocity loop: create a move profile and a trend (Command Position, Command Velocity, Torque Reference, Position Error, Velocity Error), isolate the velocity loop by temporarily setting KPP = 0, KPI = 0, KAFF = 0 and KVFF = 100, go online, enable with MSO, run the profile slowly (about 2-3% of application speed, increasing to full speed), and raise KVP step by step until ringing appears in Torque Reference or a high-frequency noise is heard (use a phone app to find the resonant frequency and notch it out), then keep raising until a low-pitched growl or oscillation in Velocity Error / Torque Reference marks instability \u2014 then divide KVP by two. If the load observer is on, keep KOP = 4.0 x KVP when Load Ratio R = 0, or KOP = 1.0 x KVP when R > 0 (0.5 x KVP works better in some applications), adjusting KOP every time KVP changes. Typical EtherNet/IP ranges: KAFF 0-100, KVI 0 to KVP/4. Then tune the position loop the same way: restore the position gains, run the profile, raise KPP until growl or oscillation, then divide KPP by two; typical EtherNet/IP ranges: KVFF 0-100, KPI 0 to KPP/4. Manual Tune applies to Position Loop and Velocity Loop configurations only.", "componentIds": ["ab-kinetix-5700-2198-d057-ers3", "ab-kinetix-5500-2198-h070-ers2"], "id": "tuning-axis-autotune", "title": "Tuning an axis: factory defaults, tuning-less operation and Autotune"}, {"body": "Start every fault call with the status bits on the axis tag, because they tell you which state the axis is actually in. On an AXIS_SERVO_DRIVE tag the AxisStatus bits include ServoActionStatus (bit 00, servo action active), DriveEnableStatus (bit 01, drive enabled), ShutdownStatus (bit 02, axis in shutdown) and InhibitStatus (bit 04, axis inhibited). The same four ideas apply to a CIP axis: if ServoActionStatus is off, the servo loop is not active; if ShutdownStatus is on, the axis is in the shutdown operating state and the controller will block instructions that initiate motion; if InhibitStatus is on, the axis is inhibited and motion instructions will error. Rockwell's motion error codes list includes exactly these traps: Axis Is Inhibited (the fix is to uninhibit the axis), Shutdown State Error, and Axis In Faulted State. An MSO instruction also errors if you try it while the axis is moving, and an MSO or MAH errors when the drive is locally disabled.\n\nNext, read the fault word before you reset anything. AxisFault is a 32-bit attribute whose value is set on three faults: bit 0 PhysicalAxisFault, bit 1 ModuleFault, and bit 2 ConfigFault. A ConfigFault points at the configuration \u2014 a wrong motor, a bad scaling change, a module definition that does not match the hardware \u2014 while a ModuleFault points at the drive module itself and a PhysicalAxisFault at the axis hardware or feedback. The DriveFault bits on the axis tag break it down further, including PosSoftOvertravelFault and NegSoftOvertravelFault, PosHardOvertravelFault and NegHardOvertravelFault, MotFeedbackFault and MotFeedbackNoiseFault, DriveOvercurrentFault, DriveOvervoltageFault, DriveUndervoltageFault, OverSpeedFault and PosErrorFault. Several of these are latched and require an explicit MAFR or MASR to clear, so do not expect a power cycle or a fresh download to clear them for you.\n\nThe reset instructions each have one job, and mixing them up is a common beginner mistake. To clear an AxisFault, you must diagnose and clear the underlying fault first, and then: MAFR (Motion Axis Fault Reset) clears all motion faults for an axis; in the case of a shutdown, MASR (Motion Axis Shutdown Reset) returns the axis to the axis-ready operating state; and for a grouped axis, MGSR (Motion Group Shutdown Reset) transitions a group of axes from the shutdown operating state to the axis-ready state. MASD (Motion Axis Shutdown) is the other side of that pair: it forces an axis into the shutdown operating state, and once the axis is in shutdown the controller blocks any instructions that initiate axis motion. So the recovery order is: fix the cause, reset the fault with MAFR, reset the shutdown with MASR or MGSR if the axis is shut down, and only then try MSO again. Trying MSO on an axis that is still faulted or still shut down will not enable it.\n\nOvertravel deserves its own paragraph because it traps people in a loop. If the axis hits a hardware overtravel limit, the fault is latched and the axis must be moved back within the normal operation limits of the machine and the limit switch reset, and the fault requires an explicit MAFR or MASR to clear. With the Stop Planner fault action, when the travel limit is reached the axis stops and can only be commanded to move in the opposite direction of travel; the drive is not disabled, but the fault posts in the drive tag structure, and once the axis is back within the limits you clear the fault with an MAFR \u2014 after checking that the positive and negative overtravel input status is once again 1, so the planner does not think you are still in overtravel. If the fault action is Shutdown, recovery is harder: an MSO cannot be performed on an axis in a faulted state, so overtravel checking must be temporarily disabled, an MASD or MAFR performed, an MSO performed, the axis jogged back off the limit, and overtravel checking enabled again. Do not disable the axis with MSF or power-cycle the drive in the Stop Planner case while the overtravel condition is present, or you will still be unable to enable it.\n\nFinally, check the group-level setting that decides whether a fault stops the whole machine or just the axis. You can configure an AxisFault on a grouped axis to be either a Major Fault or a Non Major Fault in the Attribute tab of the Motion Group Properties dialog box. If you select Major Fault, the occurrence of an AxisFault will execute the pre-selected Controller Fault Handler routine, then shut down the drive. To prevent a shutdown, select Non Major Fault in the Attribute tab and be sure to include fault-handling in your main routine. That is a design decision, not a default to leave unexamined. The exception system itself is in the Integrated Motion on the EtherNet/IP Network Reference Manual, publication MOTION-RM003K-EN-P (July 2019), Chapter 4, and it works by numbers, not by names alone. The Standard Exceptions table (pp. 623-628) numbers every condition by array index, and that index IS the code number: the drive reports FLT Sxx for a standard runtime exception and FLT Mxx for a manufacturer-specific (Rockwell-specific) one, with INIT FLT Sxx / INIT FLT Mxx for faults found during initialisation and NODE FLT xx for module-level faults. The fault name is the exception name plus 'Fault' (e.g. bit 54, Excessive Position Error, becomes the Excessive Position Error Fault), and the same index with 'Alarm' is the alarm name. The exceptions that most often stop an axis enabling are: 1 Motor Overcurrent, 3/4 Motor Overspeed (factory / user limit), 5/6 Motor Overtemperature, 7/8 Motor Thermal Overload, 9 Motor Phase Loss, 10 Inverter Overcurrent, 33/34 Bus Undervoltage, 35/36 Bus Overvoltage, 41-47 feedback signal noise / loss / data loss / device failure, 50/51 Hardware Overtravel Positive/Negative, 52/53 Position (software) Overtravel Positive/Negative, 54 Excessive Position Error, 55 Excessive Velocity Error, 60 Illegal Control Mode, and 61 Enable Input Deactivated (enable dropped while Running). Each exception also carries a factory limit (FL) and a user limit (UL) variant where both exist. Two honest limits on this lesson: MOTION-RM003 defines what each code means and which exception action it can take (Ignore, Alarm, Fault Status Only, Stop Planner, Stop Drive, Shutdown), but the per-code fix steps are NOT in MOTION-RM003 \u2014 they live in the drive's own manual, e.g. Kinetix 5500 User Manual 2198-UM001 Chapter 7 (Troubleshoot) and the Kinetix Servo Drive Fault Codes Reference Data, publication 2198-RD005, which the drive manuals point to for the comprehensive list. So when a code appears, read its meaning from the MOTION-RM003 table above, then look up its fix in the drive manual's fault-code table for your drive family; do not guess a fix from the code number alone.\n\nClearing a fault from the Controller Organizer is verified in the current help. MOTION-UM003P Chapter 10 (Resetting an APR Fault, pp. 167-168) lists three ways to reset a fault: execute an instruction (MAFR, MGSR, MASR or MCSR), do it from the Controller Organizer \u2014 'Clear the group fault, the software executes an MGSR; Clear the axis fault, the software executes an MASR' \u2014 or download the same project a second time. The Studio 5000 Logix Designer online help v37 names the two commands exactly: 'Clear Axis Faults command \u2014 Choose this command to clear all faults for the online axis selected in the Controller Organizer. When the axis is selected, this command executes a Motion Axis Shutdown Reset (MASR) command.' and 'Clear MotionGroup Faults command \u2014 Choose this command to clear all faults for the motion group selected in the Controller Organizer. When the motion group is selected, this command executes a Motion Group Shutdown Reset (MGSR) command.' So: go online, select the faulted axis (or motion group) in the Controller Organizer, and choose Clear Axis Faults (or Clear MotionGroup Faults). One caveat: neither the manual nor the help page names the exact menu gesture that reaches the command, so this lesson does not assert a right-click step \u2014 select the item in the Controller Organizer and choose the command. And remember the order from the recovery paragraph above still applies: fix the cause first, clear the fault (MAFR), reset the shutdown (MASR/MGSR), and only then MSO.", "componentIds": ["ab-kinetix-5700-2198-d057-ers3", "ab-kinetix-5500-2198-h070-ers2"], "id": "axis-will-not-enable-faults", "title": "When an axis will not enable or faults"}], "quiz": [{"answer": 1, "explain": "MOTION-UM003P says the default data type is AXIS_CIP_DRIVE when you create an associated axis. AXIS_SERVO_DRIVE is the older SERCOS type.", "options": ["AXIS_SERVO_DRIVE", "AXIS_CIP_DRIVE", "AXIS_VIRTUAL", "AXIS_GENERIC"], "q": "For a new Kinetix 5500 or 5700 axis on EtherNet/IP, which axis data type is created by default when you click New Axis on the Associated Axes tab?"}, {"answer": 1, "explain": "MOTION-UM003P: you can only have one Motion Group per Logix controller, and axes that are not grouped remain ungrouped and unavailable for use.", "options": ["As many as you like; ungrouped axes still run", "One per controller; ungrouped axes remain ungrouped and unavailable for use", "One per drive; ungrouped axes run at the base update period", "Two per controller; ungrouped axes become virtual axes"], "q": "How many motion groups can one Logix controller have, and what happens to an axis that is not assigned to it?"}, {"answer": 1, "explain": "MOTION-UM003P Table: Other Axis CIP Drives 1 ms, PowerFlex 755T 2 ms, PowerFlex 755 3 ms, PowerFlex 527 4 ms.", "options": ["1 ms for both", "1 ms for a CIP drive and 4 ms for a PowerFlex 527", "4 ms for a CIP drive and 1 ms for a PowerFlex 527", "10 ms for both"], "q": "In MOTION-UM003P, what is the minimum Base Update Period for an ordinary AXIS_CIP_DRIVE, and for a PowerFlex 527?"}, {"answer": 1, "explain": "MOTION-RM002L: MSO activates the drive amplifier and the servo control loop, and should not be used while the axis is moving \u2014 if attempted, MSO generates an Axis in Motion error.", "options": ["It stops the axis; it generates a Shutdown State Error", "It activates the drive amplifier and the servo control loop; it generates an Axis in Motion error", "It homes the axis; it generates an Axis in Faulted State error", "It disables the drive output; the axis coasts to a stop"], "q": "What does the MSO instruction do, and what error do you get if you execute it while the axis is moving?"}, {"answer": 1, "explain": "MOTION-RM002L: MAS stops the motion without disabling the servo loop; MSF deactivates the drive output and the servo loop, and if executed while moving the axis coasts to an uncontrolled stop.", "options": ["They are the same instruction with different names", "MAS is a decelerated stop that leaves the servo loop enabled; MSF deactivates the drive output and the servo loop, and the axis coasts to an uncontrolled stop if moving", "MAS disables the drive; MSF only stops a jog", "MAS homes the axis; MSF stops it"], "q": "What is the difference between MAS and MSF?"}, {"answer": 1, "explain": "MOTION-RM002L: MAJ moves an axis at a constant speed until you tell it to stop, and the manual says to use an MAS instruction to stop the jog.", "options": ["MAM, then MAH", "MAJ, then MAS", "MAH, then MSF", "MRAT, then MAAT"], "q": "Which instruction moves an axis at a constant speed without regard to position, and which instruction stops that jog?"}, {"answer": 1, "explain": "A search of the Instruction Locator and full text of MOTION-RM002L returns no Motion Axis Blend and no MAB entry. Do not teach it as a Logix instruction; MAM and MAJ Merge is the verified blending mechanism.", "options": ["It is Motion Axis Blend, documented in MOTION-RM002L", "It is not in MOTION-RM002L at all \u2014 no Motion Axis Blend entry exists; blending is done with the Merge operand on MAM and MAJ", "It is the same as MAS, renamed in Studio 5000 v37", "It is only available on AXIS_SERVO_DRIVE axes"], "q": "MAB was listed in the brief for this module. What is the verified position on MAB as a native Logix motion instruction?"}, {"answer": 0, "explain": "MOTION-UM003P Autotune steps: set Travel Limit, Speed, Torque and Direction; the default of 100% rated torque usually gives good results.", "options": ["Travel Limit, Speed, Torque and Direction; Torque defaults to 100% rated torque", "Position, Velocity, Acceleration and Jerk; Torque defaults to 50%", "Gain, Bandwidth, Damping and Inertia; Torque defaults to 0%", "Travel Limit, Speed, Torque and Direction; Torque defaults to 10% rated torque"], "q": "In the Autotune dialog box, what four Tune Profile values do you enter, and what is the default Torque?"}, {"answer": 1, "explain": "Rockwell AxisFault help: diagnose and clear the underlying fault, then MAFR clears all motion faults, MASR returns a shut-down axis to axis-ready, MGSR does the same for a group. MSO on a faulted or shut-down axis will not enable it.", "options": ["MSO first, then MAFR, then MASR", "Fix the cause, MAFR to clear the faults, MASR (or MGSR for a group) to leave shutdown, then MSO", "Power-cycle the drive, then MSO", "MSF, then MAM, then MSO"], "q": "An axis is faulted and shut down. What is the correct recovery order?"}, {"answer": 1, "explain": "MOTION-UM003P: set electronic keying to either Exact Match or Compatible Keying for integrated motion, and never use Disable Keying with motion or safety modules.", "options": ["Disable Keying, so any module can connect", "Exact Match or Compatible Keying; never Disable Keying with motion or safety modules", "Compatible Keying only; Exact Match is not allowed", "It does not matter for motion drives"], "q": "What should Electronic Keying be set to for a drive in an Integrated Motion application?"}], "sources": ["https://www.nhp.com.au/public/assets/pim/Original/10054/Allen-Bradley-Integrated-Motion-on-the-EtherNet-IP-Network-User-Manual.pdf", "https://m.manuals.plus/m/4eebf5d4975c3b39d15ff3f0045c1196a1232859d950eb3d5695c22678dea752.pdf", "https://www.rockwellautomation.com/en-dk/docs/technical/logix5000/_online/1756-um900/controllogix-5590-controller-user-manual-ditamap/develop-motion-applications/program-motion-control.html", "https://www.rockwellautomation.com/en-dk/docs/studio-5000-logix-designer/37-00/contents-ditamap/instruction-set/instructions/motion-move-instructions/motion-axis-stop--mas-.html", "https://www.rockwellautomation.com/en-ua/docs/studio-5000-logix-designer/37-00/contents-ditamap/studio-5000-logix-designer/axisfault.html", "https://www.rockwellautomation.com/en-ro/docs/studio-5000-logix-designer/37-00/contents-ditamap/instruction-set/axis_servo_drive-structure.html", "https://www.nhp.com.au/public/assets/pim/Original/10054/Allen-Bradley-Integrated-Motion-on-the-EtherNet-IP-Network-User-Manual.pdf (NHP mirror of MOTION-UM003P-EN-P, Jan 2025)", "https://www.rockwellautomation.com/en-se/docs/studio-5000-logix-designer/37-00/contents-ditamap/quick-start-steps/configuring-a-sercos-analog-motion-system.html (Rockwell online help, v37)", "https://manuals.plus/m/4eebf5d4975c3b39d15ff3f0045c1196a1232859d950eb3d5695c22678dea752 (manuals.plus mirror of MOTION-RM002L-EN-P, Nov 2022)", "https://www.rockwellautomation.com/en-id/docs/studio-5000-logix-designer/37-00/contents-ditamap/instruction-set/instructions/motion-move-instructions/motion-axis-move--mam-.html (Rockwell online help v37, MAM Merge operand)", "https://www.rockwellautomation.com/en-il/docs/studio-5000-logix-designer/37-00/contents-ditamap/instruction-set/multi-axis-coordinated-motion-instructions.html (Rockwell online help v37, blending via queued MCLM/MCCM)", "https://hguywilliams.net/__databox/_Notes/Motion/_manuals/Programming/Integrated Motion on the EtherNetIP Network Reference Manual   motion-rm003_-en-p(1).pdf (mirror of MOTION-RM003K-EN-P, July 2019)", "https://hguywilliams.net/__databox/_Notes/Motion/_manuals/Tuningless Feature Configuration motion-qs001_-en-p.pdf (mirror of MOTION-QS001D-EN-P, Nov 2020)", "https://proxy-cf3-1.fbsidatest.workers.dev/https://literature.rockwellautomation.com/idc/groups/literature/documents/at/motion-at005_-en-p.pdf (proxy mirror of MOTION-AT005E-EN-P, Sept 2024)", "https://www.rockwellautomation.com/en-sg/docs/studio-5000-logix-designer/37-00/contents-ditamap/studio-5000-logix-designer/clear-axis-faults-command.html (Rockwell online help v37)", "https://www.rockwellautomation.com/en-sg/docs/studio-5000-logix-designer/37-00/contents-ditamap/studio-5000-logix-designer/clear-motiongroup-faults-command.html (Rockwell online help v37)", "https://www.nhp.com.au/public/assets/pim/Original/10054/Allen-Bradley-Integrated-Motion-on-the-EtherNet-IP-Network-User-Manual.pdf (NHP mirror of MOTION-UM003P-EN-P, Jan 2025, Ch.10 pp.167-168)"], "tbd": [], "title": "Studio 5000 motion: from drive to running axis"}], "stats": {"families": 29, "modules": 5, "lessons": 34, "quizQuestions": 42, "configSteps": 299, "faults": 777, "tbdItems": 15, "byCategory": {"servo-drive": 9, "vfd": 8, "servo-motor": 6, "starter": 6}}};

const $ = s => document.querySelector(s);
const main = $('#main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DATA = AB_DATA;
const byId = id => DATA.components.find(c => c.id === id);
const modById = id => DATA.modules.find(m => m.id === id);
const CAT = Object.fromEntries(DATA.categories.map(c => [c.id, c.label]));

/* ---- progress (localStorage, guarded for file://) ---- */
let progress = {lessons:{}, quiz:{}};
try { progress = JSON.parse(localStorage.getItem('abmc-progress') || '{}'); progress.lessons = progress.lessons || {}; progress.quiz = progress.quiz || {}; } catch(e) {}
function saveProgress(){ try { localStorage.setItem('abmc-progress', JSON.stringify(progress)); } catch(e) {} }
function lessonDone(mid, lid){ return !!progress.lessons[mid + '::' + lid]; }
function markLesson(mid, lid, done){ progress.lessons[mid + '::' + lid] = !!done; saveProgress(); }
function moduleProgress(m){ const n = m.lessons.length; const d = m.lessons.filter(l => lessonDone(m.id, l.id)).length; return {done:d, total:n, pct: n ? Math.round(d/n*100) : 0}; }

/* ---- navigation ---- */
let view = {tab:'learn'};
function go(tab){ view = {tab}; render(); window.scrollTo(0,0); }
document.querySelectorAll('.tabbar button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.tabbar button').forEach(x => x.classList.remove('active'));
  b.classList.add('active'); go(b.dataset.tab);
}));
function render(){
  if (view.tab === 'learn') return renderLearn();
  if (view.tab === 'library') return renderLibrary();
  if (view.tab === 'search') return renderSearch();
  if (view.tab === 'about') return renderAbout();
  if (view.tab === 'module') return renderModule(view.moduleId);
  if (view.tab === 'lesson') return renderLesson(view.moduleId, view.lessonIdx);
  if (view.tab === 'quiz') return renderQuiz(view.moduleId);
  if (view.tab === 'component') return renderComponent(view.componentId);
}
function backBtn(tab){ return `<button class="back" onclick="go('${tab}')">‹ Back</button>`; }

/* ---- Learn tab: learning paths ---- */
function renderLearn(){
  const cards = DATA.modules.map(m => {
    const p = moduleProgress(m);
    const q = progress.quiz[m.id];
    return `<div class="card">
      <span class="badge">${esc(m.family || 'General')}</span>
      <h2 style="margin-top:8px">${esc(m.title)}</h2>
      <p class="small">${m.lessons.length} lessons · ${m.quiz.length} quiz questions${q ? ' · quiz best: ' + q.score + '/' + q.total : ''}</p>
      <div class="progress"><div style="width:${p.pct}%"></div></div>
      <p class="small">${p.done}/${p.total} lessons done · ${p.pct}%</p>
      <button class="btn" onclick="view={tab:'module',moduleId:'${m.id}'};render();window.scrollTo(0,0)">${p.done ? 'Continue' : 'Start path'}</button>
    </div>`;
  }).join('');
  main.innerHTML = `<h2 class="sec">Learning paths</h2>${cards}
  <div class="card"><h3>How to use this app</h3>
  <p>Work a path top to bottom: each lesson teaches one piece, then the quiz checks it. Every procedure and parameter number comes from a Rockwell manual — anything not yet verified is marked TBD, never guessed.</p></div>`;
}

/* ---- Module view ---- */
function renderModule(mid){
  const m = modById(mid); if (!m) return go('learn');
  const p = moduleProgress(m);
  const lessons = m.lessons.map((l, i) => {
    const done = lessonDone(m.id, l.id);
    return `<button class="list-item" onclick="view={tab:'lesson',moduleId:'${m.id}',lessonIdx:${i}};render();window.scrollTo(0,0)">
      <span style="font-size:18px">${done ? '✅' : '⬜'}</span>
      <span class="grow"><span class="t">${i+1}. ${esc(l.title)}</span></span><span>›</span></button>`;
  }).join('');
  main.innerHTML = `${backBtn('learn')}
  <div class="card"><span class="badge">${esc(m.family || 'General')}</span>
  <h2 style="margin-top:8px">${esc(m.title)}</h2>
  <div class="progress"><div style="width:${p.pct}%"></div></div>
  <p class="small">${p.done}/${p.total} lessons done</p>
  <button class="btn" onclick="view={tab:'quiz',moduleId:'${m.id}'};render();window.scrollTo(0,0)">Take the quiz (${m.quiz.length} questions)</button></div>
  <h2 class="sec">Lessons</h2>${lessons}`;
}

/* ---- Lesson view ---- */
function renderLesson(mid, idx){
  const m = modById(mid); if (!m) return go('learn');
  const l = m.lessons[idx]; if (!l) return renderModule(mid);
  const done = lessonDone(m.id, l.id);
  const body = esc(l.body).replace(/\n\n+/g, '</p><p>').replace(/\n/g, '<br>');
  const links = (l.componentIds || []).map(id => { const c = byId(id); return c ? `<button class="list-item" onclick="view={tab:'component',componentId:'${c.id}'};render();window.scrollTo(0,0)"><span class="grow"><span class="t">${esc(c.family)}</span><span class="s">${esc(c.name)}</span></span><span>›</span></button>` : ''; }).join('');
  const prev = idx > 0 ? `<button class="btn secondary" onclick="view={tab:'lesson',moduleId:'${m.id}',lessonIdx:${idx-1}};render();window.scrollTo(0,0)">‹ Previous lesson</button>` : '';
  const next = idx < m.lessons.length - 1
    ? `<button class="btn" onclick="view={tab:'lesson',moduleId:'${m.id}',lessonIdx:${idx+1}};render();window.scrollTo(0,0)">Next lesson ›</button>`
    : `<button class="btn" onclick="view={tab:'quiz',moduleId:'${m.id}'};render();window.scrollTo(0,0)">Take the quiz ›</button>`;
  main.innerHTML = `<button class="back" onclick="view={tab:'module',moduleId:'${m.id}'};render();window.scrollTo(0,0)">‹ Back to ${esc(m.title)}</button>
  <div class="card"><span class="badge">Lesson ${idx+1} of ${m.lessons.length}</span>
  <h2 style="margin-top:8px">${esc(l.title)}</h2><p>${body}</p>
  <label class="check ${done ? 'done' : ''}"><input type="checkbox" ${done ? 'checked' : ''} onchange="markLesson('${m.id}','${l.id}',this.checked);render()"> <span>Mark this lesson done</span></label></div>
  ${links ? `<h2 class="sec">Components in this lesson</h2>${links}` : ''}
  ${prev}${next}`;
}

/* ---- Quiz view ---- */
let quizState = null;
function renderQuiz(mid){
  const m = modById(mid); if (!m) return go('learn');
  if (!quizState || quizState.moduleId !== mid) quizState = {moduleId: mid, idx: 0, answers: [], picked: -1};
  const q = m.quiz[quizState.idx];
  if (!q){
    const score = quizState.answers.filter((a, i) => a === m.quiz[i].answer).length;
    const best = progress.quiz[mid];
    if (!best || score > best.score){ progress.quiz[mid] = {score, total: m.quiz.length}; saveProgress(); }
    main.innerHTML = `<button class="back" onclick="view={tab:'module',moduleId:'${m.id}'};render();window.scrollTo(0,0)">‹ Back to ${esc(m.title)}</button>
    <div class="card"><h2>Quiz done</h2><p style="font-size:28px;font-weight:800">You scored ${score} / ${m.quiz.length}</p>
    <p>${score === m.quiz.length ? 'Perfect. You know this family.' : score >= m.quiz.length * 0.7 ? 'Solid. Re-read the lessons you missed and retake it.' : 'Go back through the lessons, then retake the quiz.'}</p>
    <button class="btn" onclick="quizState=null;renderQuiz('${m.id}')">Retake quiz</button>
    <button class="btn secondary" onclick="view={tab:'module',moduleId:'${m.id}'};render();window.scrollTo(0,0)">Back to path</button></div>`;
    return;
  }
  const opts = q.options.map((o, i) => {
    let cls = '';
    if (quizState.picked >= 0){
      if (i === q.answer) cls = 'correct';
      else if (i === quizState.picked) cls = 'wrong';
    }
    return `<button class="quiz-opt ${cls}" ${quizState.picked >= 0 ? 'disabled' : ''} onclick="quizPick(${i})">${esc(o)}</button>`;
  }).join('');
  const expl = quizState.picked >= 0 ? `<div class="explain"><b>${quizState.picked === q.answer ? 'Correct.' : 'Not quite.'}</b> ${esc(q.explain || '')}</div>
  <button class="btn" onclick="quizNext()">${quizState.idx < m.quiz.length - 1 ? 'Next question ›' : 'See my score'}</button>` : '';
  main.innerHTML = `<button class="back" onclick="view={tab:'module',moduleId:'${m.id}'};render();window.scrollTo(0,0)">‹ Back to ${esc(m.title)}</button>
  <div class="card"><span class="badge">Question ${quizState.idx + 1} of ${m.quiz.length}</span>
  <h2 style="margin-top:8px">${esc(q.q)}</h2>${opts}${expl}</div>`;
}
function quizPick(i){
  const m = modById(quizState.moduleId);
  quizState.picked = i; quizState.answers[quizState.idx] = i; renderQuiz(quizState.moduleId);
}
function quizNext(){ quizState.idx++; quizState.picked = -1; renderQuiz(quizState.moduleId); }

/* ---- Library tab ---- */
function renderLibrary(){
  const groups = DATA.categories.map(cat => {
    const comps = DATA.components.filter(c => c.category === cat.id);
    const items = comps.map(c => `<button class="list-item" onclick="view={tab:'component',componentId:'${c.id}'};render();window.scrollTo(0,0)">
      <span class="grow"><span class="t">${esc(c.family)}</span><span class="s">${esc(c.name)}${c.catalogNumbers && c.catalogNumbers.length ? ' · ' + esc(c.catalogNumbers[0]) : ''}</span></span><span>›</span></button>`).join('');
    return `<h2 class="sec">${esc(cat.label)} (${comps.length})</h2>${items}`;
  }).join('');
  main.innerHTML = `<h2 class="sec">Component library — ${DATA.components.length} families</h2>${groups}`;
}

/* ---- Search tab ---- */
function renderSearch(){
  main.innerHTML = `<h2 class="sec">Search</h2>
  <div class="card"><label class="f">Catalog number or name</label>
  <input id="q" type="search" placeholder="e.g. 2198-D057, MPL-B4530K, SMC-50" oninput="doSearch(this.value)">
  <p class="small">Searches family names, component names, and catalog numbers.</p></div>
  <div id="results"></div>`;
  const input = $('#q'); input.focus();
}
function doSearch(q){
  q = (q || '').trim().toLowerCase();
  const box = $('#results'); if (!box) return;
  if (q.length < 2){ box.innerHTML = ''; return; }
  const hits = DATA.components.filter(c =>
    (c.family + ' ' + c.name + ' ' + (c.catalogNumbers || []).join(' ')).toLowerCase().includes(q));
  box.innerHTML = hits.length ? hits.map(c => `<button class="list-item" onclick="view={tab:'component',componentId:'${c.id}'};render();window.scrollTo(0,0)">
    <span class="grow"><span class="t">${esc(c.family)}</span><span class="s">${esc(c.name)}${c.catalogNumbers && c.catalogNumbers.length ? ' · ' + esc(c.catalogNumbers[0]) : ''}</span></span><span>›</span></button>`).join('')
    : `<div class="card"><p>No match. Try a family name (Kinetix 5700), a catalog number (25B-D010N114), or a part of one.</p></div>`;
}

/* ---- Component detail ---- */
function tbdBlock(list){
  if (!list || !list.length) return '';
  return `<div class="tbd"><b>⚠ Not yet verified — do not teach as fact.</b><ul style="margin:8px 0 0;padding-left:18px">${list.map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`;
}
function renderComponent(id){
  const c = byId(id); if (!c) return go('library');
  const cfg = c.configuration.map(s => `<tr><td><b>${esc(s.step)}</b><br><span style="color:var(--muted)">${esc(s.screen || '')}</span></td><td>${esc(s.parameter || '')}<br><b>${esc(s.value || '')}</b><br><span style="color:var(--muted);font-size:12px">${esc(s.source || '')}</span></td></tr>`).join('');
  const faults = c.faults.map(f => `<tr><td><b>${esc(f.code)}</b></td><td>${esc(f.meaning)}<br><b>Fix:</b> ${esc(f.fix)}</td></tr>`).join('');
  const w = c.wiring || {};
  const wiring = `<div class="kv"><span>Power</span><b>${esc(w.power || 'TBD')}</b></div>
  <div class="kv"><span>Feedback</span><b>${esc(w.feedback || 'TBD')}</b></div>
  <div class="kv"><span>Safety</span><b>${esc(w.safety || 'TBD')}</b></div>
  <div class="kv"><span>Network</span><b>${esc(w.network || 'TBD')}</b></div>`;
  const comm = c.commissioning.map(x => `<label class="check"><input type="checkbox"> <span>${esc(x)}</span></label>`).join('');
  const modules = DATA.modules.filter(m => (m.lessons || []).some(l => (l.componentIds || []).includes(c.id)));
  const modLinks = modules.map(m => `<button class="list-item" onclick="view={tab:'module',moduleId:'${m.id}'};render();window.scrollTo(0,0)"><span class="grow"><span class="t">${esc(m.title)}</span></span><span>›</span></button>`).join('');
  main.innerHTML = `${backBtn('library')}
  <div class="card">
    <span class="badge">${esc(CAT[c.category] || c.category)}</span>${c.subcategory ? ` <span class="badge gold">${esc(c.subcategory)}</span>` : ''}
    <h2 style="margin-top:8px">${esc(c.family)}</h2>
    <p class="small">${esc(c.name)}</p>
    <div class="pill-row">${(c.catalogNumbers || []).map(n => `<span class="badge">${esc(n)}</span>`).join('')}</div>
    <h3>What it is</h3><p>${esc(c.whatItIs)}</p>
    <h3>When to use it</h3><p>${esc(c.whenToUse)}</p>
    <h3>Selection and sizing</h3><p>${esc(c.selection)}</p>
    ${tbdBlock(c.tbd)}
  </div>
  <div class="card"><h3>Wiring</h3>${wiring}</div>
  ${cfg ? `<div class="card"><h3>Configuration — verified steps</h3><table><tr><th>Step</th><th>Parameter / value</th></tr>${cfg}</table></div>` : ''}
  ${comm ? `<div class="card"><h3>Commissioning checklist</h3>${comm}</div>` : ''}
  <div class="card"><h3>Tuning basics</h3><p>${esc(c.tuning)}</p></div>
  ${faults ? `<div class="card"><h3>Common faults</h3><table><tr><th>Code</th><th>Meaning / fix</th></tr>${faults}</table></div>` : ''}
  ${modLinks ? `<h2 class="sec">Learn it in a path</h2>${modLinks}` : ''}
  <div class="card"><h3>Manual</h3><p>${c.manualUrl && c.manualUrl !== 'TBD' ? `<a href="${esc(c.manualUrl)}" target="_blank" rel="noopener">Open the Rockwell manual ↗</a>` : 'Manual link TBD — see the TBD list above.'}</p>
  <p class="small">Sources: ${(c.sources || []).map(s => esc(s)).join('<br>') || 'None listed.'}</p></div>`;
}

/* ---- About tab ---- */
function renderAbout(){
  const s = DATA.stats;
  main.innerHTML = `<h2 class="sec">About this app</h2>
  <div class="card"><h3>AB Motion Control App</h3>
  <p>A training app for Allen-Bradley motion control: servo drives, VFDs, servo motors, and starters. It teaches how to use the components, deep not surface: selection, wiring, configuration, commissioning, tuning, and faults.</p>
  <p class="small">Version ${esc(DATA.version)} · ${s.families} families · ${s.modules} learning paths · ${s.lessons} lessons · ${s.quizQuestions} quiz questions · ${s.configSteps} verified configuration steps · ${s.faults} faults documented.</p></div>
  <div class="card"><h3>Verification rule</h3>
  <p>Every procedure, parameter number, and spec in this app comes from a Rockwell manual, user manual, or technote that was actually read. Anything not verified is marked <b>TBD</b> and lists the source needed. Nothing here is guessed.</p>
  <p class="small">${s.tbdItems} TBD items remain across the app. Lifecycle notes: Bulletin 140M was discontinued 31 March 2025 (replacement 140MT); PowerFlex 4/40 was discontinued 30 June 2025 (replaced by 523/525); Kinetix 6000 was discontinued 31 December 2023 (migration target Kinetix 5700); PowerFlex 700 was discontinued in 2023 (migration path 750-series); most PowerFlex 70 catalog numbers are discontinued (2025-2026), remaining IP66 variants end of life July 1, 2027.</p></div>
  <div class="card"><h3>Works offline</h3><p>All content is bundled in the app. No account, no server, no signal needed on the plant floor.</p></div>`;
}

render();
</script>
</body>
</html>
